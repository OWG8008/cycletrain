<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>cycletrain</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

/* =====================================================
   基本
===================================================== */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{

  background:
    radial-gradient(
      circle at 20% 0%,
      rgba(255,255,255,.10),
      transparent 35%
    ),
    radial-gradient(
      circle at 100% 100%,
      rgba(255,140,40,.10),
      transparent 35%
    ),
    #08090c;

  color:white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    sans-serif;

}


/* =====================================================
   Liquid Glass
===================================================== */

.glass{

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.15),
      rgba(255,255,255,.035)
    );

  border:
    1px solid
    rgba(255,255,255,.16);

  box-shadow:
    0 12px 40px
    rgba(0,0,0,.35),

    inset 0 1px 0
    rgba(255,255,255,.16),

    inset 0 -1px 0
    rgba(0,0,0,.22);

  backdrop-filter:
    blur(32px)
    saturate(170%);

  -webkit-backdrop-filter:
    blur(32px)
    saturate(170%);

}


/* =====================================================
   設定画面
===================================================== */

#setup{

  width:100%;
  height:100vh;

  padding:
    25px 20px
    calc(25px + env(safe-area-inset-bottom));

  overflow-y:auto;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(255,255,255,.10),
      transparent 45%
    );

}


.logo{

  text-align:center;

  font-size:35px;

  font-weight:900;

  letter-spacing:-1.8px;

  margin:
    30px 0 38px;

}


label{

  display:block;

  color:
    rgba(255,255,255,.58);

  margin:
    18px 4px 8px;

  font-size:14px;

  font-weight:650;

}


select,
input{

  width:100%;

  height:58px;

  padding:
    0 18px;

  border-radius:23px;

  border:
    1px solid
    rgba(255,255,255,.14);

  background:
    rgba(255,255,255,.075);

  color:white;

  font-size:18px;

  outline:none;

  backdrop-filter:
    blur(24px);

  -webkit-backdrop-filter:
    blur(24px);

  box-shadow:
    inset 0 1px 0
    rgba(255,255,255,.08),

    0 8px 28px
    rgba(0,0,0,.20);

}


select option{

  background:#17191e;
  color:white;

}


.speedSetting{

  display:flex;

  align-items:center;

  gap:10px;

}


.speedSetting input{

  flex:1;

}


.speedUnit{

  color:
    rgba(255,255,255,.55);

  font-size:15px;

}


/* =====================================================
   スタートボタン
===================================================== */

.startButton{

  width:100%;

  height:64px;

  margin-top:30px;

  border:0;

  border-radius:25px;

  background:
    linear-gradient(
      180deg,
      #4aa3ff,
      #1478e8
    );

  color:white;

  font-size:19px;

  font-weight:850;

  box-shadow:
    0 12px 32px
    rgba(20,120,232,.30),

    inset 0 1px 0
    rgba(255,255,255,.35);

  transition:
    transform .15s,
    filter .15s;

}


.startButton:active{

  transform:scale(.965);

  filter:brightness(.9);

}


/* =====================================================
   運転画面
===================================================== */

#drive{

  display:none;

  width:100%;
  height:100vh;

  position:relative;

  overflow:hidden;

}


/* =====================================================
   Liquid Glass 幕
===================================================== */

#board{

  position:absolute;

  top:
    calc(8px + env(safe-area-inset-top));

  left:9px;

  right:9px;

  height:72px;

  z-index:3000;

  border-radius:29px;

  padding:
    0 20px;

  display:flex;

  align-items:center;

  overflow:hidden;

  background:
    linear-gradient(
      135deg,
      rgba(0,0,0,.82),
      rgba(27,27,31,.58)
    );

  border:
    1px solid
    rgba(255,255,255,.17);

  box-shadow:

    0 15px 42px
    rgba(0,0,0,.43),

    inset 0 1px 0
    rgba(255,255,255,.16),

    inset 0 -1px 0
    rgba(0,0,0,.25);

  backdrop-filter:
    blur(34px)
    saturate(180%);

  -webkit-backdrop-filter:
    blur(34px)
    saturate(180%);

}


/* =====================================================
   幕の中身
===================================================== */

.boardInner{

  width:100%;

  display:flex;

  align-items:center;

  gap:15px;

  overflow:hidden;

}


.boardDestination{

  flex-shrink:0;

  font-size:20px;

  font-weight:900;

  letter-spacing:-.5px;

}


.boardNextWindow{

  flex:1;

  min-width:0;

  overflow:hidden;

  position:relative;

}


.boardNext{

  display:inline-block;

  white-space:nowrap;

  font-size:16px;

  font-weight:700;

  color:
    rgba(255,255,255,.82);

  padding-left:100%;

  animation:
    boardScroll 8s linear infinite;

}


@keyframes boardScroll{

  from{

    transform:
      translateX(0);

  }

  to{

    transform:
      translateX(-100%);

  }

}


/* =====================================================
   種別カラー
===================================================== */

.board-normal{

  color:#ffffff;

}


.board-shinkaisoku{

  color:#4da3ff;

}


.board-other{

  color:#ff453a;

}


/* =====================================================
   MAP
===================================================== */

#map{

  width:100%;
  height:100%;

  background:#e8edf0;

}


/* =====================================================
   Leaflet
===================================================== */

.leaflet-control-zoom{

  border:0 !important;

  margin:
    95px 12px 0 0 !important;

}


.leaflet-control-zoom a{

  width:44px !important;

  height:44px !important;

  line-height:44px !important;

  border:0 !important;

  color:#222 !important;

  background:
    rgba(255,255,255,.82) !important;

  backdrop-filter:
    blur(25px);

  -webkit-backdrop-filter:
    blur(25px);

  box-shadow:
    0 5px 20px
    rgba(0,0,0,.20);

}


.leaflet-control-zoom a:first-child{

  border-radius:
    16px 16px 6px 6px !important;

}


.leaflet-control-zoom a:last-child{

  border-radius:
    6px 6px 16px 16px !important;

}


/* =====================================================
   距離
===================================================== */

#distanceBox{

  position:absolute;

  top:
    calc(92px + env(safe-area-inset-top));

  left:10px;

  z-index:2000;

  padding:
    10px 15px;

  border-radius:20px;

  background:
    rgba(0,0,0,.72);

  border:
    1px solid
    rgba(255,255,255,.13);

  box-shadow:
    0 9px 28px
    rgba(0,0,0,.28);

  backdrop-filter:
    blur(28px);

  -webkit-backdrop-filter:
    blur(28px);

  font-size:13px;

}


/* =====================================================
   制限速度
===================================================== */

#limitBox{

  position:absolute;

  top:
    calc(92px + env(safe-area-inset-top));

  right:10px;

  z-index:2000;

  padding:
    10px 15px;

  border-radius:20px;

  background:
    rgba(0,0,0,.72);

  border:
    1px solid
    rgba(255,255,255,.13);

  box-shadow:
    0 9px 28px
    rgba(0,0,0,.28);

  backdrop-filter:
    blur(28px);

  -webkit-backdrop-filter:
    blur(28px);

  font-size:13px;

}


/* =====================================================
   追従
===================================================== */

#followBox{

  position:absolute;

  top:
    calc(135px + env(safe-area-inset-top));

  left:10px;

  z-index:2100;

  padding:
    8px 11px;

  border-radius:19px;

  background:
    rgba(0,0,0,.70);

  border:
    1px solid
    rgba(255,255,255,.13);

  backdrop-filter:
    blur(25px);

  -webkit-backdrop-filter:
    blur(25px);

  font-size:13px;

  display:flex;

  align-items:center;

  gap:7px;

}


#followSwitch{

  width:45px;
  height:25px;

  appearance:none;

  background:
    rgba(255,255,255,.25);

  border-radius:20px;

  position:relative;

  outline:none;

  padding:0;

  border:0;

}


#followSwitch:checked{

  background:#238636;

}


#followSwitch::after{

  content:"";

  position:absolute;

  width:21px;
  height:21px;

  top:2px;
  left:2px;

  background:white;

  border-radius:50%;

  transition:.2s;

  box-shadow:
    0 2px 5px
    rgba(0,0,0,.25);

}


#followSwitch:checked::after{

  transform:
    translateX(20px);

}


/* =====================================================
   モード
===================================================== */

#modeBox{

  position:absolute;

  top:
    calc(135px + env(safe-area-inset-top));

  right:10px;

  z-index:2100;

  padding:
    10px 14px;

  border-radius:19px;

  background:
    rgba(0,0,0,.70);

  border:
    1px solid
    rgba(255,255,255,.13);

  backdrop-filter:
    blur(25px);

  -webkit-backdrop-filter:
    blur(25px);

  font-size:13px;

}


/* =====================================================
   地点一覧
===================================================== */

#routeButton{

  position:absolute;

  top:
    calc(177px + env(safe-area-inset-top));

  right:10px;

  z-index:2100;

  border:
    1px solid
    rgba(255,255,255,.13);

  border-radius:19px;

  background:
    rgba(0,0,0,.70);

  color:white;

  padding:
    10px 14px;

  font-size:13px;

  backdrop-filter:
    blur(25px);

  -webkit-backdrop-filter:
    blur(25px);

}


#routePanel{

  display:none;

  position:absolute;

  top:
    calc(222px + env(safe-area-inset-top));

  right:10px;

  width:255px;

  max-height:330px;

  overflow-y:auto;

  z-index:2500;

  padding:10px;

  background:
    rgba(10,12,16,.80);

  border:
    1px solid
    rgba(255,255,255,.15);

  border-radius:25px;

  box-shadow:
    0 18px 50px
    rgba(0,0,0,.48);

  backdrop-filter:
    blur(34px)
    saturate(170%);

  -webkit-backdrop-filter:
    blur(34px)
    saturate(170%);

}


.routeTitle{

  color:
    rgba(255,255,255,.55);

  font-size:13px;

  padding:
    5px 8px 10px;

}


.routeItem{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:5px;

  padding:10px;

  margin-bottom:7px;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid
    rgba(255,255,255,.07);

  border-radius:17px;

  font-size:13px;

}


.deleteRoute{

  border:0;

  border-radius:12px;

  background:
    rgba(255,69,58,.75);

  color:white;

  padding:
    7px 9px;

}


/* =====================================================
   速度
===================================================== */

#speedBox{

  position:absolute;

  bottom:
    calc(115px + env(safe-area-inset-bottom));

  left:0;

  width:100%;

  text-align:center;

  z-index:2000;

  pointer-events:none;

}


#speed{

  font-size:56px;

  font-weight:900;

  letter-spacing:-2px;

  text-shadow:
    0 4px 20px
    rgba(0,0,0,.5);

}


.kmh{

  color:
    rgba(255,255,255,.55);

  font-size:14px;

}


/* =====================================================
   速度超過
===================================================== */

#overspeed{

  display:none;

  position:absolute;

  bottom:
    calc(180px + env(safe-area-inset-bottom));

  left:0;

  width:100%;

  text-align:center;

  z-index:2600;

  color:#ff453a;

  font-size:19px;

  font-weight:bold;

  text-shadow:
    0 3px 15px
    rgba(0,0,0,.6);

}


/* =====================================================
   終了ボタン
===================================================== */

#finishButton{

  position:absolute;

  left:20px;

  bottom:
    calc(20px + env(safe-area-inset-bottom));

  width:
    calc(100% - 40px);

  height:64px;

  border:
    1px solid
    rgba(255,255,255,.14);

  border-radius:26px;

  background:
    rgba(0,0,0,.74);

  color:white;

  font-size:19px;

  font-weight:bold;

  z-index:2800;

  box-shadow:
    0 12px 38px
    rgba(0,0,0,.38),

    inset 0 1px 0
    rgba(255,255,255,.11);

  backdrop-filter:
    blur(30px);

  -webkit-backdrop-filter:
    blur(30px);

}


/* =====================================================
   ATS
===================================================== */

#ats{

  display:none;

  position:absolute;

  left:15px;

  bottom:
    calc(15px + env(safe-area-inset-bottom));

  width:
    calc(100% - 30px);

  z-index:4000;

  padding:16px;

  border-radius:31px;

  background:
    linear-gradient(
      135deg,
      rgba(0,0,0,.85),
      rgba(25,25,28,.65)
    );

  border:
    1px solid
    rgba(255,255,255,.16);

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.58),

    inset 0 1px 0
    rgba(255,255,255,.14);

  backdrop-filter:
    blur(38px)
    saturate(180%);

  -webkit-backdrop-filter:
    blur(38px)
    saturate(180%);

}


.atsWarning{

  text-align:center;

  color:#ff453a;

  font-size:19px;

  font-weight:900;

  margin-bottom:7px;

}


.atsTimer{

  text-align:center;

  color:
    rgba(255,255,255,.55);

  font-size:13px;

  margin-bottom:9px;

}


.slider{

  position:relative;

  height:68px;

  border-radius:23px;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid
    rgba(255,255,255,.08);

  overflow:hidden;

  touch-action:none;

}


.sliderText{

  position:absolute;

  width:100%;
  height:100%;

  display:flex;

  align-items:center;
  justify-content:center;

  color:
    rgba(255,255,255,.48);

  font-size:17px;

}


.sliderButton{

  position:absolute;

  left:5px;

  top:5px;

  width:58px;

  height:58px;

  border-radius:20px;

  background:
    linear-gradient(
      180deg,
      #ff7043,
      #e63828
    );

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:25px;

  z-index:10;

  touch-action:none;

  box-shadow:
    0 5px 15px
    rgba(255,69,58,.25),

    inset 0 1px 0
    rgba(255,255,255,.25);

}


/* =====================================================
   現在地
===================================================== */

.current-marker{

  width:18px;
  height:18px;

  border-radius:50%;

  background:#1677ff;

  border:
    3px solid white;

  box-shadow:
    0 0 0 6px
    rgba(22,119,255,.22),

    0 4px 12px
    rgba(0,0,0,.35);

}


/* =====================================================
   スマホ
===================================================== */

@media(max-width:500px){

  #board{

    height:70px;

  }

  .boardDestination{

    font-size:19px;

  }

  .boardNext{

    font-size:15px;

  }

}

</style>

</head>

<body>


<!-- =====================================================
     設定画面
===================================================== -->

<div id="setup">

  <div class="logo">
    🚲 cycletrain
  </div>


  <label>
    種別
  </label>

  <select id="type">

    <option>普通</option>

    <option>快速</option>

    <option>急行</option>

    <option>特急</option>

    <option>新快速</option>

  </select>


  <label>
    行き先
  </label>

  <input
    id="destinationName"
    type="text"
    placeholder="例：別府駅"
  >


  <label>
    速度制限
  </label>

  <div class="speedSetting">

    <input
      id="speedLimit"
      type="number"
      min="1"
      max="200"
      value="20"
      inputmode="numeric"
    >

    <div class="speedUnit">
      km/h
    </div>

  </div>


  <button
    class="startButton"
    onclick="startDrive()"
  >
    🚃 運転開始
  </button>

</div>


<!-- =====================================================
     運転画面
===================================================== -->

<div id="drive">


  <div id="board">

    <div class="boardInner">

      <div
        id="boardDestination"
        class="boardDestination board-normal"
      >
        普通・別府駅
      </div>

      <div class="boardNextWindow">

        <div
          id="boardNext"
          class="boardNext"
        >
          次は、別府駅
        </div>

      </div>

    </div>

  </div>


  <div id="distanceBox">
    📍 目的地を設定してください
  </div>


  <div id="limitBox">
    🚦 制限 20 km/h
  </div>


  <div id="followBox">

    追従

    <input
      id="followSwitch"
      type="checkbox"
      checked
    >

  </div>


  <div id="modeBox">
    🎯 目的地設定
  </div>


  <button
    id="routeButton"
    onclick="toggleRoutePanel()"
  >
    📍 地点一覧
  </button>


  <div id="routePanel">

    <div class="routeTitle">
      設定地点
    </div>

    <div id="routeList"></div>

  </div>


  <div id="map"></div>


  <div id="overspeed">
    ⚠️ 速度超過
  </div>


  <div id="speedBox">

    <div id="speed">
      0
    </div>

    <div class="kmh">
      km/h
    </div>

  </div>


  <button
    id="finishButton"
    onclick="finishDrive()"
  >
    運転終了
  </button>


  <!-- ===================================================
       ATS
  =================================================== -->

  <div id="ats">

    <div
      id="atsText"
      class="atsWarning"
    >
      ⚠️ ATS作動
    </div>

    <div
      id="atsTimer"
      class="atsTimer"
    >
      自動終了まで 60 秒
    </div>


    <div class="slider">

      <div class="sliderText">
        スライドで解除
      </div>

      <div
        class="sliderButton"
        id="sliderButton"
      >
        →
      </div>

    </div>

  </div>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =====================================================
   基本変数
===================================================== */

let map = null;

let currentMarker = null;

let destination = null;

let destinationMarker = null;

let destinationName = "";

let viaPoints = [];

let viaNames = [];

let viaMarkers = [];

let currentViaIndex = 0;

let mode = "destination";

let watchID = null;

let speedLimit = 20;

let currentSpeed = 0;


/* =====================================================
   ATS
===================================================== */

let atsActive = false;

let atsTimer = null;

let atsCountdownTimer = null;

let atsSeconds = 60;

let atsType = "";


/* =====================================================
   ATS 1回制御
===================================================== */

let destinationATSUsed = false;

let viaATSUsed = [];

let overspeedATSUsed = false;


/* =====================================================
   キンコン
===================================================== */

let bellTimer = null;

let bellActive = false;


/* =====================================================
   Audio
===================================================== */

let audioContext = null;

let alarmOscillator = null;

let alarmGain = null;


/* =====================================================
   スライダー
===================================================== */

let startX = 0;

let sliderX = 0;


/* =====================================================
   Audio準備
===================================================== */

function prepareAudio(){

  if(!audioContext){

    audioContext =
      new(
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  if(
    audioContext.state ===
    "suspended"
  ){

    audioContext.resume();

  }

}


/* =====================================================
   ATS ジリリリ
===================================================== */

function startAlarm(){

  prepareAudio();

  stopAlarm();


  alarmOscillator =
    audioContext.createOscillator();

  alarmGain =
    audioContext.createGain();


  alarmOscillator.type =
    "square";


  alarmOscillator.frequency.value =
    760;


  alarmGain.gain.value =
    0.085;


  alarmOscillator.connect(
    alarmGain
  );

  alarmGain.connect(
    audioContext.destination
  );


  alarmOscillator.start();


  let flip = false;

  alarmOscillator._atsInterval =
    setInterval(
      function(){

        if(
          !alarmOscillator
        ){

          return;

        }

        flip = !flip;

        alarmOscillator.frequency.setValueAtTime(
          flip ? 880 : 720,
          audioContext.currentTime
        );

      },
      105
    );

}


/* =====================================================
   ATS停止
===================================================== */

function stopAlarm(){

  if(alarmOscillator){

    if(
      alarmOscillator._atsInterval
    ){

      clearInterval(
        alarmOscillator._atsInterval
      );

      alarmOscillator._atsInterval =
        null;

    }


    try{

      alarmOscillator.stop();

    }catch(e){}


    try{

      alarmOscillator.disconnect();

    }catch(e){}


    alarmOscillator = null;

  }


  if(alarmGain){

    try{

      alarmGain.disconnect();

    }catch(e){}


    alarmGain = null;

  }

}


/* =====================================================
   キンコン音
===================================================== */

function playBell(){

  prepareAudio();

  const now =
    audioContext.currentTime;


  const osc1 =
    audioContext.createOscillator();

  const gain1 =
    audioContext.createGain();


  osc1.type =
    "sine";

  osc1.frequency.setValueAtTime(
    1046,
    now
  );


  gain1.gain.setValueAtTime(
    0.0001,
    now
  );

  gain1.gain.exponentialRampToValueAtTime(
    0.20,
    now + 0.008
  );

  gain1.gain.exponentialRampToValueAtTime(
    0.001,
    now + 0.30
  );


  osc1.connect(gain1);

  gain1.connect(
    audioContext.destination
  );


  osc1.start(now);

  osc1.stop(
    now + 0.32
  );


  setTimeout(
    function(){

      if(
        !audioContext
      ){

        return;

      }


      const now2 =
        audioContext.currentTime;


      const osc2 =
        audioContext.createOscillator();

      const gain2 =
        audioContext.createGain();


      osc2.type =
        "sine";


      osc2.frequency.setValueAtTime(
        784,
        now2
      );


      gain2.gain.setValueAtTime(
        0.0001,
        now2
      );

      gain2.gain.exponentialRampToValueAtTime(
        0.18,
        now2 + 0.008
      );

      gain2.gain.exponentialRampToValueAtTime(
        0.001,
        now2 + 0.34
      );


      osc2.connect(gain2);

      gain2.connect(
        audioContext.destination
      );


      osc2.start(now2);

      osc2.stop(
        now2 + 0.36
      );

    },
    135
  );

}


/* =====================================================
   キンコン停止判定
===================================================== */

function canStopBell(){

  if(
    !currentMarker
  ){

    return true;

  }


  const current =
    currentMarker.getLatLng();


  /*
   * 現在向かっている経由地点
   */

  if(
    currentViaIndex <
    viaPoints.length
  ){

    if(
      current.distanceTo(
        viaPoints[currentViaIndex]
      ) <= 30
    ){

      return true;

    }

  }


  /*
   * 目的地
   */

  if(destination){

    if(
      current.distanceTo(
        destination
      ) <= 30
    ){

      return true;

    }

  }


  /*
   * 速度ATS
   */

  if(
    atsType === "overspeed"
  ){

    if(
      currentSpeed <=
      speedLimit - 3
    ){

      return true;

    }

  }


  return false;

}


/* =====================================================
   キンコン開始
===================================================== */

function startBell(){

  if(
    atsActive
  ){

    return;

  }


  if(
    canStopBell()
  ){

    return;

  }


  if(
    bellActive
  ){

    return;

  }


  bellActive = true;


  playBell();


  bellTimer =
    setInterval(
      function(){

        if(
          atsActive ||
          canStopBell()
        ){

          stopBell();

          return;

        }


        playBell();

      },
      700
    );

}


/* =====================================================
   キンコン停止
===================================================== */

function stopBell(){

  if(
    bellTimer !== null
  ){

    clearInterval(
      bellTimer
    );

    bellTimer = null;

  }


  bellActive = false;

}


/* =====================================================
   幕更新
===================================================== */

function updateBoardNext(){

  const next =
    document.getElementById(
      "boardNext"
    );


  if(
    currentViaIndex <
    viaNames.length

  else if(

  ){

  }
  else{

  }

}

/* =====================================================
   運転開始
===================================================== */

function startDrive(){

  const type =
    document.getElementById(
      "type"
    ).value;


  destinationName =
    document.getElementById(
      "destinationName"
    ).value.trim();

    );

  ){

    );

  }


  prepareAudio();


  document.getElementById(
    "boardDestination"
  ).textContent =

    type
  );

  ).textContent =

    "setup"
  ).style.display =

    "drive"
  ).style.display =

  overspeedATSUsed = false;

  viaNames = [];

  viaPoints = [];

  viaMarkers = [];

  currentViaIndex = 0;

  destination = null;

  destinationMarker = null;

    "destination";


  updateMode();

  updateBoardNext();

  updateRouteList();

  );

/* =====================================================
   地図
===================================================== */

function initMap(){

  if(map){

    map.invalidateSize();

    return;

  }


  map =
    L.map(
      "map",
      {
        zoomControl:true
      }
    );


  L.tileLayer(
    "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
    {

      maxZoom:20,

      attribution:
        "&copy; OpenStreetMap &copy; CARTO",

      subdomains:
        "abcd"

    }
  ).addTo(map);


  if(
    !navigator.geolocation
  ){

    alert(
      "この端末ではGPSを利用できません"
    );

    return;

  }


  navigator.geolocation.getCurrentPosition(

    function(position){

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;


      map.setView(
        [lat,lng],
        17
      );


      createCurrentMarker(
        lat,
        lng
      );


      startGPS();

    },


    function(){

      map.setView(
        [35.681236,139.767125],
        13
      );


      document.getElementById(
        "distanceBox"
      ).textContent =
        "📍 GPSを許可してください";

    },


    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:1000
    }

  );


  /*
   * 地図タップ
   */

  map.on(
    "click",
    function(e){

      setPoint(
        e.latlng.lat,
        e.latlng.lng
      );

    }
  );

}


/* =====================================================
   現在地マーカー
===================================================== */

function createCurrentMarker(
  lat,
  lng
){

  const icon =
    L.divIcon(
      {
        className:"",
        html:
          '<div class="current-marker"></div>',
        iconSize:
          [18,18],
        iconAnchor:
          [9,9]
      }
    );


  currentMarker =
    L.marker(
      [lat,lng],
      {
        icon:icon
      }
    )
    .addTo(map);

}


/* =====================================================
   地点設定
===================================================== */

function setPoint(
  lat,
  lng
){

  /*
   * 目的地
   */

  if(
    mode ===
    "destination"
  ){

    if(destinationMarker){

      map.removeLayer(
        destinationMarker
      );

    }


    destination =
      L.latLng(
        lat,
        lng
      );


    destinationMarker =
      L.marker(
        [lat,lng]
      )
      .addTo(map)
      .bindPopup(
        "🎯 " +
        destinationName
      );


    mode =
      "via";


    updateMode();

    updateRouteList();

    updateBoardNext();


    document.getElementById(
      "distanceBox"
    ).textContent =
      "📍 経由地点を設定できます";


    return;

  }


  /*
   * 経由地点
   */

  if(
    mode ===
    "via"
  ){

    const name =
      prompt(
        "経由地点の名前を入力してください\n例：ローソン"
      );


    /*
     * キャンセルまたは空欄
     */

    if(
      name === null
    ){

      return;

    }


    const cleanName =
      name.trim();


    if(
      !cleanName
    ){

      alert(
        "経由地点名を入力してください"
      );

      return;

    }


    addViaPoint(
      lat,
      lng,
      cleanName
    );

  }

}


/* =====================================================
   経由地点追加
===================================================== */

function addViaPoint(
  lat,
  lng,
  name
){

  const point =
    L.latLng(
      lat,
      lng
    );


  viaPoints.push(
    point
  );


  viaNames.push(
    name
  );


  viaATSUsed.push(
    false
  );


  const marker =
    L.marker(
      [lat,lng]
    )
    .addTo(map)
    .bindPopup(
      "📍 " +
      name
    );


  viaMarkers.push(
    marker
  );


  updateRouteList();

  updateBoardNext();

}


/* =====================================================
   モード
===================================================== */

function updateMode(){

  const box =
    document.getElementById(
      "modeBox"
    );


  if(
    mode ===
    "destination"
  ){

    box.textContent =
      "🎯 目的地設定";

  }
  else{

    box.textContent =
      "📍 経由地点設定";

  }

}


/* =====================================================
   地点一覧
===================================================== */

function updateRouteList(){

  const list =
    document.getElementById(
      "routeList"
    );


  list.innerHTML = "";


  /*
   * 目的地
   */

  if(destination){

    const item =
      document.createElement(
        "div"
      );


    item.className =
      "routeItem";


    const text =
      document.createElement(
        "span"
      );


    text.textContent =
      "🎯 " +
      destinationName;


    const button =
      document.createElement(
        "button"
      );


    button.className =
      "deleteRoute";


    button.textContent =
      "削除";


    button.onclick =
      function(){

        deleteDestination();

      };


    item.appendChild(
      text
    );

    item.appendChild(
      button
    );

    list.appendChild(
      item
    );

  }


  /*
   * 経由地点
   */

  viaPoints.forEach(
    function(point,index){

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "routeItem";


      const text =
        document.createElement(
          "span"
        );


      text.textContent =
        "📍 " +
        viaNames[index];


      const button =
        document.createElement(
          "button"
        );


      button.className =
        "deleteRoute";


      button.textContent =
        "削除";


      button.onclick =
        function(){

          deleteViaPoint(
            index
          );

        };


      item.appendChild(
        text
      );

      item.appendChild(
        button
      );

      list.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   目的地削除
===================================================== */

function deleteDestination(){

  if(
    !confirm(
      "目的地を削除しますか？"
    )
  ){

    return;

  }


  if(destinationMarker){

    map.removeLayer(
      destinationMarker
    );

  }


  destination = null;

  destinationMarker = null;


  /*
   * 目的地が消えたら
   * 目的地設定モードへ戻す
   */

  mode =
    "destination";


  destinationATSUsed =
    false;


  updateMode();

  updateRouteList();

  updateBoardNext();


  document.getElementById(
    "distanceBox"
  ).textContent =
    "🎯 新しい目的地を設定してください";

}


/* =====================================================
   経由地点削除
===================================================== */

function deleteViaPoint(
  index
){

  if(
    !confirm(
      "この経由地点を削除しますか？"
    )
  ){

    return;

  }


  if(
    viaMarkers[index]
  ){

    map.removeLayer(
      viaMarkers[index]
    );

  }


  viaMarkers.splice(
    index,
    1
  );


  viaPoints.splice(
    index,
    1
  );


  viaNames.splice(
    index,
    1
  );


  viaATSUsed.splice(
    index,
    1
  );


  if(
    currentViaIndex >
    index
  ){

    currentViaIndex--;

  }


  if(
    currentViaIndex < 0
  ){

    currentViaIndex = 0;

  }


  updateRouteList();

  updateBoardNext();

}

   地点一覧開閉

    document.getElementById(

    );


  if(

  }

/* =====================================================
   経由地点到着処理
===================================================== */

function arriveViaPoint(){

  stopBell();


  currentViaIndex++;


  /*
   * 次の地点へ
   */

  updateBoardNext();


  /*
   * まだ経由地点がある
   */

  if(
    currentViaIndex <
    viaPoints.length
  ){

    document.getElementById(
      "distanceBox"
    ).textContent =
      "📍 次の経由地点まで";

    return;

  }


  /*
   * 経由地点終了
   * ↓
   * 目的地へ
   */

  document.getElementById(
    "distanceBox"
  ).textContent =
    "🎯 目的地へ";


}


/* =====================================================
   GPS
===================================================== */

function startGPS(){

  if(
    watchID !== null
  ){

    navigator.geolocation.clearWatch(
      watchID
    );

  }


  watchID =
    navigator.geolocation.watchPosition(

      function(position){

        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;


        /*
         * =========================
         * 速度
         * =========================
         */

        let speed =
          position.coords.speed;


        if(
          speed === null ||
          speed < 0
        ){

          speed = 0;

        }


        speed =
          speed * 3.6;


        currentSpeed =
          speed;


        document.getElementById(
          "speed"
        ).textContent =
          Math.round(speed);


        /*
         * =========================
         * 現在地
         * =========================
         */

        if(currentMarker){

          currentMarker.setLatLng(
            [lat,lng]
          );

        }


        /*
         * =========================
         * 地図追従
         * =========================
         */

        const follow =
          document.getElementById(
            "followSwitch"
          ).checked;


        if(
          follow &&
          map
        ){

          map.panTo(
            [lat,lng],
            {
              animate:true,
              duration:.5
            }
          );

        }


        /*
         * =========================
         * 速度超過
         * =========================
         */

        if(
          speed > speedLimit
        ){

          document.getElementById(
            "overspeed"
          ).style.display =
            "block";


          if(
            !atsActive &&
            !overspeedATSUsed
          ){

            overspeedATSUsed =
              true;


            activateATS(
              "⚠️ 速度超過ATS",
              "overspeed"
            );

          }

        }
        else{

          document.getElementById(
            "overspeed"
          ).style.display =
            "none";

        }


        /*
         * =========================
         * 目的地未設定
         * =========================
         */

        if(
          !destination
        ){

          return;

        }


        const current =
          L.latLng(
            lat,
            lng
          );


        /*
         * =========================
         * 経由地点
         * =========================
         */

        if(
          currentViaIndex <
          viaPoints.length
        ){

          const via =
            viaPoints[
              currentViaIndex
            ];


          const distance =
            current.distanceTo(
              via
            );


          document.getElementById(
            "distanceBox"
          ).textContent =
            "📍 " +
            viaNames[currentViaIndex] +
            "まで " +
            Math.round(distance) +
            "m";


          /*
           * 100m以内
           *
           * ATS 1回
           */

          if(
            distance <= 100 &&
            !atsActive &&
            !viaATSUsed[currentViaIndex]
          ){

            viaATSUsed[currentViaIndex] =
              true;


            /*
             * ATS作動
             */

            activateATS(
              "⚠️ " +
              viaNames[currentViaIndex] +
              " ATS",
              "via"
            );


            return;

          }


          /*
           * ATS解除後など
           * 100m以内ならキンコン
           */

          if(
            distance <= 100 &&
            !atsActive
          ){

            startBell();

          }


          /*
           * 30m以内
           *
           * 到着扱い
           */

          if(
            distance <= 30
          ){

            stopBell();

            arriveViaPoint();

          }


          return;

        }


        /*
         * =========================
         * 目的地
         * =========================
         */

        const distance =
          current.distanceTo(
            destination
          );


        document.getElementById(
          "distanceBox"
        ).textContent =
          "🎯 " +
          destinationName +
          "まで " +
          Math.round(distance) +
          "m";


        /*
         * =========================
         * 到着ATS
         * =========================
         */

        if(
          distance <= 200 &&
          !atsActive &&
          !destinationATSUsed
        ){

          destinationATSUsed =
            true;


          activateATS(
            "🏁 " +
            destinationName +
            " 到着ATS",
            "destination"
          );


          return;

        }


        /*
         * 100m以内
         * キンコン
         */

        if(
          distance <= 100 &&
          !atsActive
        ){

          startBell();

        }


        /*
         * 30m以内
         * キンコン停止
         */

        if(
          distance <= 30
        ){

          stopBell();

        }

      },


      function(){

        document.getElementById(
          "distanceBox"
        ).textContent =
          "📍 GPS取得失敗";

      },


      {
        enableHighAccuracy:true,

        maximumAge:1000,

        timeout:10000

      }

    );

}


/* =====================================================
   ATS作動
===================================================== */

function activateATS(
  message,
  type
){

  /*
   * すでにATS中なら無視
   */

  if(
    atsActive
  ){

    return;

  }


  atsActive =
    true;


  atsType =
    type;


  atsSeconds =
    60;


  /*
   * キンコン停止
   */

  stopBell();


  /*
   * 終了ボタン
   */

  document.getElementById(
    "finishButton"
  ).style.display =
    "none";


  /*
   * ATS表示
   */

  document.getElementById(
    "ats"
  ).style.display =
    "block";


  document.getElementById(
    "atsText"
  ).textContent =
    message;


  document.getElementById(
    "atsTimer"
  ).textContent =
    "自動終了まで 60 秒";


  /*
   * ジリリリ
   */

  startAlarm();


  /*
   * バイブ
   */

  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      [300,200,300]
    );

  }


  /*
   * カウントダウン
   */

  clearInterval(
    atsCountdownTimer
  );


  atsCountdownTimer =
    setInterval(
      function(){

        if(
          !atsActive
        ){

          return;

        }


        atsSeconds--;


        document.getElementById(
          "atsTimer"
        ).textContent =
          "自動終了まで " +
          Math.max(
            0,
            atsSeconds
          ) +
          " 秒";


        if(
          atsSeconds <= 0
        ){

          releaseATS();

        }

      },
      1000
    );


  /*
   * 念のため60秒で強制解除
   */

  clearTimeout(
    atsTimer
  );


  atsTimer =
    setTimeout(
      function(){

        releaseATS();

      },
      60000
    );

}


/* =====================================================
   ATS解除
===================================================== */

function releaseATS(){

  if(
    !atsActive
  ){

    return;

  }


  atsActive =
    false;


  clearTimeout(
    atsTimer
  );


  clearInterval(
    atsCountdownTimer
  );


  atsTimer = null;

  atsCountdownTimer = null;


  /*
   * ジリリリ停止
   */

  stopAlarm();


  /*
   * バイブ停止
   */

  if(
    navigator.vibrate
  ){

    navigator.vibrate(0);

  }


  /*
   * ATS画面
   */

  document.getElementById(
    "ats"
  ).style.display =
    "none";


  /*
   * 終了ボタン復活
   */

  document.getElementById(
    "finishButton"
  ).style.display =
    "block";


  /*
   * ATS解除後
   * まだ100m以内ならキンコン再開
   */

  if(
    !canStopBell()
  ){

    startBell();

  }

}


/* =====================================================
   ATSスライダー
===================================================== */

const sliderButton =
  document.getElementById(
    "sliderButton"
  );


sliderButton.addEventListener(
  "touchstart",
  function(e){

    if(
      !atsActive
    ){

      return;

    }


    startX =
      e.touches[0].clientX;


    sliderX = 0;

  },
  {
    passive:true
  }
);


sliderButton.addEventListener(
  "touchmove",
  function(e){

    if(
      !atsActive
    ){

      return;

    }


    const x =
      e.touches[0].clientX;


    sliderX =
      x - startX;


    if(
      sliderX < 0
    ){

      sliderX = 0;

    }


    const slider =
      sliderButton.parentElement;


    const max =
      slider.clientWidth -
      sliderButton.clientWidth -
      10;


    if(
      sliderX > max
    ){

      sliderX = max;

    }


    sliderButton.style.transform =
      "translateX(" +
      sliderX +
      "px)";

  },
  {
    passive:true
  }
);


sliderButton.addEventListener(
  "touchend",
  function(){

    if(
      !atsActive
    ){

      return;

    }


    const slider =
      sliderButton.parentElement;


    const max =
      slider.clientWidth -
      sliderButton.clientWidth -
      10;


    if(
      sliderX >=
      max * 0.7
    ){

      releaseATS();

    }


    sliderButton.style.transform =
      "translateX(0)";


    sliderX = 0;

  }
);


/* =====================================================
   運転終了
===================================================== */

function finishDrive(){

  /*
   * ATS中は終了不可
   */

  if(
    atsActive
  ){

    return;

  }


  if(
    !confirm(
      "運転を終了しますか？"
    )
  ){

    return;

  }


  stopAlarm();

  stopBell();


  clearTimeout(
    atsTimer
  );

  clearInterval(
    atsCountdownTimer
  );


  atsTimer = null;

  atsCountdownTimer = null;


  /*
   * GPS停止
   */

  if(
    watchID !== null
  ){

    navigator.geolocation.clearWatch(
      watchID
    );

    watchID = null;

  }


  /*
   * 経由地点削除
   */

  viaMarkers.forEach(
    function(marker){

      if(map){

        map.removeLayer(
          marker
        );

      }

    }
  );


  /*
   * 目的地削除
   */

  if(
    destinationMarker &&
    map
  ){

    map.removeLayer(
      destinationMarker
    );

  }


  /*
   * 現在地削除
   */

  if(
    currentMarker &&
    map
  ){

    map.removeLayer(
      currentMarker
    );

  }


  /*
   * 初期化
   */

  destination = null;

  destinationMarker = null;

  destinationName = "";

  viaPoints = [];

  viaNames = [];

  viaMarkers = [];

  viaATSUsed = [];

  currentViaIndex = 0;

  destinationATSUsed = false;

  overspeedATSUsed = false;

  atsActive = false;

  atsType = "";

  mode =
    "destination";

  currentSpeed = 0;


  /*
   * 画面
   */

  document.getElementById(
    "drive"
  ).style.display =
    "none";


  document.getElementById(
    "setup"
  ).style.display =
    "block";


  /*
   * パネル
   */

  document.getElementById(
    "routePanel"
  ).style.display =
    "none";


  /*
   * 速度
   */

  document.getElementById(
    "speed"
  ).textContent =
    "0";


  /*
   * 速度超過
   */

  document.getElementById(
    "overspeed"
  ).style.display =
    "none";


  /*
   * ATS
   */

  document.getElementById(
    "ats"
  ).style.display =
    "none";


  /*
   * スライダー
   */

  sliderButton.style.transform =
    "translateX(0)";


  sliderX = 0;


  /*
   * 現在地
   */

  currentMarker = null;


  /*
   * マップは残しておく
   * 次回起動時にinvalidateSizeする
   */

}


/* =====================================================
   ページ終了
===================================================== */

window.addEventListener(
  "beforeunload",
  function(){

    stopAlarm();

    stopBell();

    if(
      watchID !== null &&
      navigator.geolocation
    ){

      navigator.geolocation.clearWatch(
        watchID
      );

    }

  }
);

</script>
