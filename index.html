<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>cycletrain</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

/* =====================================================
   基本
===================================================== */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{

  background:
    radial-gradient(
      circle at 20% 0%,
      rgba(255,255,255,.08),
      transparent 35%
    ),
    radial-gradient(
      circle at 100% 100%,
      rgba(255,140,40,.08),
      transparent 35%
    ),
    #08090c;

  color:white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    sans-serif;

}


/* =====================================================
   Liquid Glass 共通
===================================================== */

.glass{

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.13),
      rgba(255,255,255,.035)
    );

  border:
    1px solid
    rgba(255,255,255,.15);

  box-shadow:
    0 10px 35px
    rgba(0,0,0,.35),

    inset 0 1px 0
    rgba(255,255,255,.13),

    inset 0 -1px 0
    rgba(0,0,0,.2);

  backdrop-filter:
    blur(28px)
    saturate(160%);

  -webkit-backdrop-filter:
    blur(28px)
    saturate(160%);

}


/* =====================================================
   設定画面
===================================================== */

#setup{

  width:100%;
  height:100vh;

  padding:
    25px 20px
    calc(25px + env(safe-area-inset-bottom));

  overflow-y:auto;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(255,255,255,.09),
      transparent 45%
    );

}


.logo{

  text-align:center;

  font-size:34px;

  font-weight:850;

  letter-spacing:-1.5px;

  margin:
    30px 0 38px;

}


label{

  display:block;

  color:
    rgba(255,255,255,.58);

  margin:
    18px 4px 8px;

  font-size:14px;

  font-weight:600;

}


select,
input{

  width:100%;

  height:58px;

  padding:
    0 17px;

  border-radius:19px;

  border:
    1px solid
    rgba(255,255,255,.13);

  background:
    rgba(255,255,255,.075);

  color:white;

  font-size:18px;

  outline:none;

  backdrop-filter:
    blur(20px);

  -webkit-backdrop-filter:
    blur(20px);

  box-shadow:
    inset 0 1px 0
    rgba(255,255,255,.08),

    0 8px 25px
    rgba(0,0,0,.18);

}


select option{

  background:#17191e;
  color:white;

}


.speedSetting{

  display:flex;

  align-items:center;

  gap:10px;

}


.speedSetting input{

  flex:1;

}


.speedUnit{

  color:
    rgba(255,255,255,.55);

  font-size:15px;

}


/* =====================================================
   最初のボタン
===================================================== */

.startButton{

  width:100%;

  height:62px;

  margin-top:30px;

  border:0;

  border-radius:21px;

  background:
    linear-gradient(
      180deg,
      #4aa3ff,
      #1478e8
    );

  color:white;

  font-size:19px;

  font-weight:800;

  box-shadow:
    0 10px 30px
    rgba(20,120,232,.28),

    inset 0 1px 0
    rgba(255,255,255,.3);

  transition:
    transform .15s,
    filter .15s;

}


.startButton:active{

  transform:scale(.97);

  filter:brightness(.9);

}


/* =====================================================
   運転画面
===================================================== */

#drive{

  display:none;

  width:100%;
  height:100vh;

  position:relative;

  overflow:hidden;

}


/* =====================================================
   Liquid Glass 幕
===================================================== */

#board{

  position:absolute;

  top:
    calc(8px + env(safe-area-inset-top));

  left:10px;

  right:10px;

  height:68px;

  z-index:3000;

  border-radius:24px;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:0 18px;

  font-size:22px;

  font-weight:850;

  letter-spacing:-.5px;

  white-space:nowrap;

  overflow:hidden;

  background:
    linear-gradient(
      135deg,
      rgba(0,0,0,.78),
      rgba(20,20,23,.55)
    );

  border:
    1px solid
    rgba(255,255,255,.16);

  box-shadow:
    0 12px 35px
    rgba(0,0,0,.4),

    inset 0 1px 0
    rgba(255,255,255,.14);

  backdrop-filter:
    blur(30px)
    saturate(170%);

  -webkit-backdrop-filter:
    blur(30px)
    saturate(170%);

}


/* =====================================================
   種別カラー
===================================================== */

.board-normal{

  color:#ffffff;

}


.board-shinkaisoku{

  color:#4da3ff;

}


.board-other{

  color:#ff453a;

}


/* =====================================================
   MAP
===================================================== */

#map{

  width:100%;
  height:100%;

  background:#dfe5e9;

}


/*
 * Leaflet UIを少しApple Mapsっぽく
 */

.leaflet-control-zoom{

  border:0 !important;

  margin:
    90px 12px 0 0 !important;

}


.leaflet-control-zoom a{

  width:42px !important;
  height:42px !important;

  line-height:42px !important;

  border:0 !important;

  color:#222 !important;

  background:
    rgba(255,255,255,.78) !important;

  backdrop-filter:
    blur(20px);

  -webkit-backdrop-filter:
    blur(20px);

  box-shadow:
    0 4px 18px
    rgba(0,0,0,.18);

}


.leaflet-control-zoom a:first-child{

  border-radius:
    14px 14px 5px 5px !important;

}


.leaflet-control-zoom a:last-child{

  border-radius:
    5px 5px 14px 14px !important;

}


/* =====================================================
   距離表示
===================================================== */

#distanceBox{

  position:absolute;

  top:
    calc(88px + env(safe-area-inset-top));

  left:10px;

  z-index:2000;

  padding:
    10px 14px;

  border-radius:17px;

  background:
    rgba(0,0,0,.72);

  border:
    1px solid
    rgba(255,255,255,.12);

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.25);

  backdrop-filter:
    blur(25px);

  -webkit-backdrop-filter:
    blur(25px);

  font-size:13px;

}


/* =====================================================
   制限速度
===================================================== */

#limitBox{

  position:absolute;

  top:
    calc(88px + env(safe-area-inset-top));

  right:10px;

  z-index:2000;

  padding:
    10px 14px;

  border-radius:17px;

  background:
    rgba(0,0,0,.72);

  border:
    1px solid
    rgba(255,255,255,.12);

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.25);

  backdrop-filter:
    blur(25px);

  -webkit-backdrop-filter:
    blur(25px);

  font-size:13px;

}


/* =====================================================
   追従
===================================================== */

#followBox{

  position:absolute;

  top:
    calc(128px + env(safe-area-inset-top));

  left:10px;

  z-index:2100;

  padding:
    8px 10px;

  border-radius:16px;

  background:
    rgba(0,0,0,.68);

  border:
    1px solid
    rgba(255,255,255,.12);

  backdrop-filter:
    blur(22px);

  -webkit-backdrop-filter:
    blur(22px);

  font-size:13px;

  display:flex;

  align-items:center;

  gap:7px;

}


#followSwitch{

  width:45px;
  height:25px;

  appearance:none;

  background:
    rgba(255,255,255,.25);

  border-radius:20px;

  position:relative;

  outline:none;

  padding:0;

  border:0;

}


#followSwitch:checked{

  background:#238636;

}


#followSwitch::after{

  content:"";

  position:absolute;

  width:21px;
  height:21px;

  top:2px;
  left:2px;

  background:white;

  border-radius:50%;

  transition:.2s;

  box-shadow:
    0 2px 5px
    rgba(0,0,0,.25);

}


#followSwitch:checked::after{

  transform:
    translateX(20px);

}


/* =====================================================
   モード
===================================================== */

#modeBox{

  position:absolute;

  top:
    calc(128px + env(safe-area-inset-top));

  right:10px;

  z-index:2100;

  padding:
    9px 12px;

  border-radius:16px;

  background:
    rgba(0,0,0,.68);

  border:
    1px solid
    rgba(255,255,255,.12);

  backdrop-filter:
    blur(22px);

  -webkit-backdrop-filter:
    blur(22px);

  font-size:13px;

}


/* =====================================================
   地点一覧
===================================================== */

#routeButton{

  position:absolute;

  top:
    calc(168px + env(safe-area-inset-top));

  right:10px;

  z-index:2100;

  border:
    1px solid
    rgba(255,255,255,.12);

  border-radius:16px;

  background:
    rgba(0,0,0,.68);

  color:white;

  padding:
    10px 13px;

  font-size:13px;

  backdrop-filter:
    blur(22px);

  -webkit-backdrop-filter:
    blur(22px);

}


#routePanel{

  display:none;

  position:absolute;

  top:
    calc(212px + env(safe-area-inset-top));

  right:10px;

  width:240px;

  max-height:300px;

  overflow-y:auto;

  z-index:2500;

  padding:9px;

  background:
    rgba(10,12,16,.78);

  border:
    1px solid
    rgba(255,255,255,.14);

  border-radius:21px;

  box-shadow:
    0 15px 45px
    rgba(0,0,0,.45);

  backdrop-filter:
    blur(30px)
    saturate(160%);

  -webkit-backdrop-filter:
    blur(30px)
    saturate(160%);

}


.routeTitle{

  color:
    rgba(255,255,255,.55);

  font-size:13px;

  padding:
    5px 7px 9px;

}


.routeItem{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:5px;

  padding:9px;

  margin-bottom:6px;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid
    rgba(255,255,255,.07);

  border-radius:13px;

  font-size:13px;

}


.deleteRoute{

  border:0;

  border-radius:10px;

  background:
    rgba(255,69,58,.75);

  color:white;

  padding:
    6px 8px;

}


/* =====================================================
   速度
===================================================== */

#speedBox{

  position:absolute;

  bottom:
    calc(115px + env(safe-area-inset-bottom));

  left:0;

  width:100%;

  text-align:center;

  z-index:2000;

  pointer-events:none;

}


#speed{

  font-size:55px;

  font-weight:850;

  letter-spacing:-2px;

  text-shadow:
    0 4px 20px
    rgba(0,0,0,.5);

}


.kmh{

  color:
    rgba(255,255,255,.55);

  font-size:14px;

}


/* =====================================================
   速度超過
===================================================== */

#overspeed{

  display:none;

  position:absolute;

  bottom:
    calc(180px + env(safe-area-inset-bottom));

  left:0;

  width:100%;

  text-align:center;

  z-index:2600;

  color:#ff453a;

  font-size:19px;

  font-weight:bold;

  text-shadow:
    0 3px 15px
    rgba(0,0,0,.6);

}


/* =====================================================
   終了ボタン
===================================================== */

#finishButton{

  position:absolute;

  left:20px;

  bottom:
    calc(20px + env(safe-area-inset-bottom));

  width:
    calc(100% - 40px);

  height:62px;

  border:
    1px solid
    rgba(255,255,255,.13);

  border-radius:22px;

  background:
    rgba(0,0,0,.72);

  color:white;

  font-size:19px;

  font-weight:bold;

  z-index:2800;

  box-shadow:
    0 10px 35px
    rgba(0,0,0,.35),

    inset 0 1px 0
    rgba(255,255,255,.1);

  backdrop-filter:
    blur(28px);

  -webkit-backdrop-filter:
    blur(28px);

}


/* =====================================================
   ATS
===================================================== */

#ats{

  display:none;

  position:absolute;

  left:15px;

  bottom:
    calc(15px + env(safe-area-inset-bottom));

  width:
    calc(100% - 30px);

  z-index:4000;

  padding:15px;

  border-radius:27px;

  background:
    linear-gradient(
      135deg,
      rgba(0,0,0,.83),
      rgba(25,25,28,.64)
    );

  border:
    1px solid
    rgba(255,255,255,.15);

  box-shadow:
    0 18px 55px
    rgba(0,0,0,.55),

    inset 0 1px 0
    rgba(255,255,255,.13);

  backdrop-filter:
    blur(35px)
    saturate(170%);

  -webkit-backdrop-filter:
    blur(35px)
    saturate(170%);

}


.atsWarning{

  text-align:center;

  color:#ff453a;

  font-size:19px;

  font-weight:850;

  margin-bottom:7px;

}


.atsTimer{

  text-align:center;

  color:
    rgba(255,255,255,.55);

  font-size:13px;

  margin-bottom:8px;

}


.slider{

  position:relative;

  height:66px;

  border-radius:20px;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid
    rgba(255,255,255,.08);

  overflow:hidden;

  touch-action:none;

}


.sliderText{

  position:absolute;

  width:100%;
  height:100%;

  display:flex;

  align-items:center;
  justify-content:center;

  color:
    rgba(255,255,255,.48);

  font-size:17px;

}


.sliderButton{

  position:absolute;

  left:5px;

  top:5px;

  width:56px;

  height:56px;

  border-radius:17px;

  background:
    linear-gradient(
      180deg,
      #ff7043,
      #e63828
    );

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:25px;

  z-index:10;

  touch-action:none;

  box-shadow:
    0 5px 15px
    rgba(255,69,58,.25),

    inset 0 1px 0
    rgba(255,255,255,.25);

}


/* =====================================================
   Leaflet marker
===================================================== */

.current-marker{

  width:18px;
  height:18px;

  border-radius:50%;

  background:#1677ff;

  border:
    3px solid white;

  box-shadow:
    0 0 0 6px
    rgba(22,119,255,.22),

    0 4px 12px
    rgba(0,0,0,.35);

}


/* =====================================================
   スマホ用
===================================================== */

@media(max-width:500px){

  #board{

    font-size:21px;

  }

}

</style>

</head>

<body>


<!-- =====================================================
     設定画面
===================================================== -->

<div id="setup">

  <div class="logo">
    🚲 cycletrain
  </div>


  <label>
    種別
  </label>

  <select id="type">

    <option>普通</option>

    <option>快速</option>

    <option>急行</option>

    <option>特急</option>

    <option>新快速</option>

  </select>


  <label>
    行き先
  </label>

  <input
    id="destinationName"
    type="text"
    placeholder="例：別府駅"
  >


  <label>
    速度制限
  </label>

  <div class="speedSetting">

    <input
      id="speedLimit"
      type="number"
      min="1"
      max="200"
      value="20"
      inputmode="numeric"
    >

    <div class="speedUnit">
      km/h
    </div>

  </div>


  <button
    class="startButton"
    onclick="startDrive()"
  >
    🚃 運転開始
  </button>

</div>


<!-- =====================================================
     運転画面
===================================================== -->

<div id="drive">


  <div id="board">
    快速・別府駅
  </div>


  <div id="distanceBox">
    📍 目的地を設定してください
  </div>


  <div id="limitBox">
    🚦 制限 20 km/h
  </div>


  <div id="followBox">

    追従

    <input
      id="followSwitch"
      type="checkbox"
      checked
    >

  </div>


  <div id="modeBox">
    🎯 目的地設定
  </div>


  <button
    id="routeButton"
    onclick="toggleRoutePanel()"
  >
    📍 地点一覧
  </button>


  <div id="routePanel">

    <div class="routeTitle">
      設定地点
    </div>

    <div id="routeList"></div>

  </div>


  <div id="map"></div>


  <div id="overspeed">
    ⚠️ 速度超過
  </div>


  <div id="speedBox">

    <div id="speed">
      0
    </div>

    <div class="kmh">
      km/h
    </div>

  </div>


  <button
    id="finishButton"
    onclick="finishDrive()"
  >
    運転終了
  </button>


  <!-- ===================================================
       ATS
  =================================================== -->

  <div id="ats">

    <div
      id="atsText"
      class="atsWarning"
    >
      ⚠️ ATS作動
    </div>

    <div
      id="atsTimer"
      class="atsTimer"
    >
      自動終了まで 60 秒
    </div>


    <div class="slider">

      <div class="sliderText">
        スライドで解除
      </div>

      <div
        class="sliderButton"
        id="sliderButton"
      >
        →
      </div>

    </div>

  </div>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =====================================================
   基本変数
===================================================== */

let map = null;

let currentMarker = null;

let destination = null;

let destinationMarker = null;

let viaPoints = [];

let viaMarkers = [];

let currentViaIndex = 0;

let mode = "destination";

let watchID = null;

let speedLimit = 20;

let currentSpeed = 0;


/* =====================================================
   ATS
===================================================== */

let atsActive = false;

let atsTimer = null;

let atsCountdownTimer = null;

let atsSeconds = 60;

let atsType = "";


/*
 * 1回のATS作動につき
 * 一度だけ作動させるためのフラグ
 */

let destinationATSUsed = false;

let viaATSUsed = [];

let overspeedATSUsed = false;


/* =====================================================
   キンコン
===================================================== */

let bellTimer = null;

let bellActive = false;


/* =====================================================
   Audio
===================================================== */

let audioContext = null;

let alarmOscillator = null;

let alarmGain = null;


/* =====================================================
   スライダー
===================================================== */

let startX = 0;

let sliderX = 0;


/* =====================================================
   Audio準備
===================================================== */

function prepareAudio(){

  if(!audioContext){

    audioContext =
      new(
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  if(
    audioContext.state ===
    "suspended"
  ){

    audioContext.resume();

  }

}


/* =====================================================
   ATS ジリリリ開始
===================================================== */

function startAlarm(){

  prepareAudio();

  stopAlarm();


  /*
   * 連続するジリリリ音
   *
   * 700Hzと900Hzを交互に
   * 高速で切り替える
   */

  alarmOscillator =
    audioContext.createOscillator();

  alarmGain =
    audioContext.createGain();


  alarmOscillator.type =
    "square";


  alarmOscillator.frequency.value =
    760;


  alarmGain.gain.value =
    0.085;


  alarmOscillator.connect(
    alarmGain
  );

  alarmGain.connect(
    audioContext.destination
  );


  alarmOscillator.start();


  /*
   * 音程を周期的に変更
   */

  let flip = false;

  alarmOscillator._atsInterval =
    setInterval(
      function(){

        if(
          !alarmOscillator
        ){

          return;

        }

        flip = !flip;

        alarmOscillator.frequency.setValueAtTime(
          flip ? 880 : 720,
          audioContext.currentTime
        );

      },
      105
    );

}


/* =====================================================
   ATS ジリリリ停止
===================================================== */

function stopAlarm(){

  if(alarmOscillator){

    if(
      alarmOscillator._atsInterval
    ){

      clearInterval(
        alarmOscillator._atsInterval
      );

      alarmOscillator._atsInterval =
        null;

    }


    try{

      alarmOscillator.stop();

    }catch(e){}


    try{

      alarmOscillator.disconnect();

    }catch(e){}


    alarmOscillator = null;

  }


  if(alarmGain){

    try{

      alarmGain.disconnect();

    }catch(e){}


    alarmGain = null;

  }

}


/* =====================================================
   キン
===================================================== */

function playBell(){

  prepareAudio();

  const now =
    audioContext.currentTime;


  /*
   * キン
   */

  const osc1 =
    audioContext.createOscillator();

  const gain1 =
    audioContext.createGain();


  osc1.type =
    "sine";

  osc1.frequency.setValueAtTime(
    1046,
    now
  );


  gain1.gain.setValueAtTime(
    0.0001,
    now
  );

  gain1.gain.exponentialRampToValueAtTime(
    0.20,
    now + 0.008
  );

  gain1.gain.exponentialRampToValueAtTime(
    0.001,
    now + 0.30
  );


  osc1.connect(gain1);

  gain1.connect(
    audioContext.destination
  );


  osc1.start(now);

  osc1.stop(
    now + 0.32
  );


  /*
   * コン
   */

  setTimeout(
    function(){

      if(
        !audioContext
      ){

        return;

      }


      const now2 =
        audioContext.currentTime;


      const osc2 =
        audioContext.createOscillator();

      const gain2 =
        audioContext.createGain();


      osc2.type =
        "sine";


      osc2.frequency.setValueAtTime(
        784,
        now2
      );


      gain2.gain.setValueAtTime(
        0.0001,
        now2
      );

      gain2.gain.exponentialRampToValueAtTime(
        0.18,
        now2 + 0.008
      );

      gain2.gain.exponentialRampToValueAtTime(
        0.001,
        now2 + 0.34
      );


      osc2.connect(gain2);

      gain2.connect(
        audioContext.destination
      );


      osc2.start(now2);

      osc2.stop(
        now2 + 0.36
      );

    },
    135
  );

}


/* =====================================================
   キンコン停止条件
===================================================== */

function canStopBell(){

  if(
    !currentMarker
  ){

    return false;

  }


  const current =
    currentMarker.getLatLng();


  /*
   * 目的地30m以内
   */

  if(destination){

    if(
      current.distanceTo(
        destination
      ) <= 30
    ){

      return true;

    }

  }


  /*
   * 経由地点30m以内
   */

  for(
    let i = 0;
    i < viaPoints.length;
    i++
  ){

    if(
      current.distanceTo(
        viaPoints[i]
      ) <= 30
    ){

      return true;

    }

  }


  /*
   * 速度ATS
   *
   * 制限速度-3以下
   */

  if(
    atsType === "overspeed"
  ){

    if(
      currentSpeed <=
      speedLimit - 3
    ){

      return true;

    }

  }


  return false;

}


/* =====================================================
   キンコン開始
===================================================== */

function startBell(){

  stopBell();


  if(
    canStopBell()
  ){

    return;

  }


  bellActive = true;


  /*
   * すぐ1回
   */

  playBell();


  /*
   * 700msごと
   */

  bellTimer =
    setInterval(
      function(){

        if(
          canStopBell()
        ){

          stopBell();

          return;

        }


        playBell();

      },
      700
    );

}


/* =====================================================
   キンコン停止
===================================================== */

function stopBell(){

  if(
    bellTimer !== null
  ){

    clearInterval(
      bellTimer
    );

    bellTimer = null;

  }


  bellActive = false;

}


/* =====================================================
   種別カラー
===================================================== */

    );

    );

  else if(

  }
  else{

    );

}


/* =====================================================
   運転開始
===================================================== */

function startDrive(){

  const type =
    document.getElementById(
      "type"
    ).value;


  const name =
    document.getElementById(
      "destinationName"
    ).value.trim();


  speedLimit =
    Number(
      document.getElementById(
        "speedLimit"
      ).value
    );


  if(!name){

    alert(
      "行き先名を入力してください"
    );

    return;

  }


  if(
    !speedLimit ||
    speedLimit <= 0
  ){

    alert(
      "速度制限を設定してください"
    );

    return;

  }


  /*
   * iPhoneのユーザー操作中に
   * AudioContextを起動
   */

  prepareAudio();


  /*
   * 「行き」は付けない
   */

  document.getElementById(
    "board"
  ).textContent =
    type +
    "・" +
    name;


  /*
   * 種別カラー
   */

  updateBoardColor(
    type
  );


  document.getElementById(
    "limitBox"
  ).textContent =
    "🚦 制限 " +
    speedLimit +
    " km/h";


  document.getElementById(
    "setup"
  ).style.display =
    "none";


  document.getElementById(
    "drive"
  ).style.display =
    "block";


  /*
   * ATS関連リセット
   */

  destinationATSUsed = false;

  overspeedATSUsed = false;

  viaATSUsed = [];


  currentViaIndex = 0;

  mode =
    "destination";


  updateMode();


  setTimeout(
    initMap,
    100
  );

}


/* =====================================================
   地図初期化
===================================================== */

function initMap(){

  if(map){

    map.invalidateSize();

    return;

  }


  map =
    L.map(
      "map",
      {
        zoomControl:true
      }
    );


  /*
   * 明るくスッキリした
   * Apple Maps風の地図
   *
   * OSM標準よりも
   * 淡い地図タイルを使用
   */

  L.tileLayer(
    "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
    {

      maxZoom:20,

      attribution:
        "&copy; OpenStreetMap &copy; CARTO",

      subdomains:
        "abcd"

    }
  ).addTo(map);


  /*
   * GPS
   */

  if(
    !navigator.geolocation
  ){

    alert(
      "この端末ではGPSを利用できません"
    );

    return;

  }


  navigator.geolocation.getCurrentPosition(

    function(position){

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;


      map.setView(
        [lat,lng],
        17
      );


      createCurrentMarker(
        lat,
        lng
      );


      startGPS();

    },


    function(){

      map.setView(
        [35.681236,139.767125],
        13
      );


      document.getElementById(
        "distanceBox"
      ).textContent =
        "📍 GPSを許可してください";

    },


    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:1000
    }

  );


  /*
   * 地図タップ
   */

  map.on(
    "click",
    function(e){

      setPoint(
        e.latlng.lat,
        e.latlng.lng
      );

    }
  );

}


/* =====================================================
   現在地マーカー
===================================================== */

function createCurrentMarker(
  lat,
  lng
){

  const icon =
    L.divIcon(
      {
        className:"",
        html:
          '<div class="current-marker"></div>',
        iconSize:
          [18,18],
        iconAnchor:
          [9,9]
      }
    );


  currentMarker =
    L.marker(
      [lat,lng],
      {
        icon:icon
      }
    )
    .addTo(map);

}


/* =====================================================
   地点設定
===================================================== */

function setPoint(
  lat,
  lng
){

  /*
   * 目的地
   */

  if(
    mode ===
    "destination"
  ){

    if(destinationMarker){

      map.removeLayer(
        destinationMarker
      );

    }


    destination =
      L.latLng(
        lat,
        lng
      );


    destinationMarker =
      L.marker(
        [lat,lng]
      )
      .addTo(map)
      .bindPopup(
        "🎯 目的地"
      );


    mode =
      "via";


    updateMode();

    updateRouteList();


    document.getElementById(
      "distanceBox"
    ).textContent =
      "📍 経由地点を設定してください";


    return;

  }


  /*
   * 経由地点
   */

  if(
    mode ===
    "via"
  ){

    addViaPoint(
      lat,
      lng
    );

  }

}


/* =====================================================
   経由地点追加
===================================================== */

function addViaPoint(
  lat,
  lng
){

  const point =
    L.latLng(
      lat,
      lng
    );


  viaPoints.push(
    point
  );


  viaATSUsed.push(
    false
  );


  const marker =
    L.marker(
      [lat,lng]
    )
    .addTo(map)
    .bindPopup(
      "📍 経由地点 " +
      viaPoints.length
    );


  viaMarkers.push(
    marker
  );


  updateRouteList();

}


/* =====================================================
   モード表示
===================================================== */

function updateMode(){

  const box =
    document.getElementById(
      "modeBox"
    );


  if(
    mode ===
    "destination"
  ){

    box.textContent =
      "🎯 目的地設定";

  }
  else{

    box.textContent =
      "📍 経由地点設定";

  }

}


/* =====================================================
   地点一覧
===================================================== */

function updateRouteList(){

  const list =
    document.getElementById(
      "routeList"
    );


  list.innerHTML = "";


  /*
   * 目的地
   */

  if(destination){

    const item =
      document.createElement(
        "div"
      );


    item.className =
      "routeItem";


    const text =
      document.createElement(
        "span"
      );


    text.textContent =
      "🎯 目的地";


    const button =
      document.createElement(
        "button"
      );


    button.className =
      "deleteRoute";


    button.textContent =
      "削除";


    button.onclick =
      function(){

        deleteDestination();

      };


    item.appendChild(
      text
    );

    item.appendChild(
      button
    );

    list.appendChild(
      item
    );

  }


  /*
   * 経由地点
   */

  viaPoints.forEach(
    function(point,index){

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "routeItem";


      const text =
        document.createElement(
          "span"
        );


      text.textContent =
        "📍 経由 " +
        (index + 1);


      const button =
        document.createElement(
          "button"
        );


      button.className =
        "deleteRoute";


      button.textContent =
        "削除";


      button.onclick =
        function(){

          deleteViaPoint(
            index
          );

        };


      item.appendChild(
        text
      );

      item.appendChild(
        button
      );

      list.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   目的地削除
===================================================== */

function deleteDestination(){

  if(
    !confirm(
      "目的地を削除しますか？"
    )
  ){

    return;

  }


  if(destinationMarker){

    map.removeLayer(
      destinationMarker
    );

  }


  destination = null;

  destinationMarker = null;


  /*
   * 目的地削除
   * ↓
   * 目的地設定へ戻る
   */

  mode =
    "destination";


  destinationATSUsed =
    false;


  updateMode();

  updateRouteList();


  document.getElementById(
    "distanceBox"
  ).textContent =
    "🎯 新しい目的地を設定してください";

}


/* =====================================================
   経由地点削除
===================================================== */

function deleteViaPoint(
  index
){

  if(
    !confirm(
      "この経由地点を削除しますか？"
    )
  ){

    return;

  }


  if(
    viaMarkers[index]
  ){

    map.removeLayer(
      viaMarkers[index]
    );

  }


  viaMarkers.splice(
    index,
    1
  );


  viaPoints.splice(
    index,
    1
  );


  viaATSUsed.splice(
    index,
    1
  );


  if(
    currentViaIndex >
    index
  ){

    currentViaIndex--;

  }


  if(
    currentViaIndex < 0
  ){

    currentViaIndex = 0;

  }


  updateRouteList();

}

   地点一覧開閉
===================================================== */

function toggleRoutePanel(){

  const panel =
    document.getElementById(
      "routePanel"
    );


  if(
    panel.style.display ===
    "block"
  ){

    panel.style.display =
      "none";

  }
  else{

  }

}


/* =====================================================
   GPS
===================================================== */

function startGPS(){

  if(
    watchID !== null
  ){

    navigator.geolocation.clearWatch(
      watchID
    );

  }


  watchID =
    navigator.geolocation.watchPosition(

      function(position){

        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;


        /*
         * =========================
         * 速度
         * =========================
         */

        let speed =
          position.coords.speed;


        if(
          speed === null ||
          speed < 0
        ){

          speed = 0;

        }


        speed =
          speed * 3.6;


        currentSpeed =
          speed;


        document.getElementById(
          "speed"
        ).textContent =
          Math.round(speed);


        /*
         * =========================
         * 現在地
         * =========================
         */

        if(currentMarker){

          currentMarker.setLatLng(
            [lat,lng]
          );

        }


        /*
         * =========================
         * 地図追従
         * =========================
         */

        const follow =
          document.getElementById(
            "followSwitch"
          ).checked;


        if(
          follow &&
          map
        ){

          map.panTo(
            [lat,lng],
            {
              animate:true,
              duration:.5
            }
          );

        }


        /*
         * =========================
         * 速度超過
         * =========================
         */

        if(
          speed > speedLimit
        ){

          document.getElementById(
            "overspeed"
          ).style.display =
            "block";


          /*
           * ATSは一度だけ
           */

          if(
            !atsActive &&
            !overspeedATSUsed
          ){

            overspeedATSUsed =
              true;


            activateATS(
              "⚠️ 速度超過ATS",
              "overspeed"
            );

          }

        }
        else{

          document.getElementById(
            "overspeed"
          ).style.display =
            "none";

        }


        /*
         * =========================
         * 目的地なし
         * =========================
         */

        if(
          !destination
        ){

          return;

        }


        const current =
          L.latLng(
            lat,
            lng
          );


        /*
         * =========================
         * 経由地点
         * =========================
         */

        if(
          currentViaIndex <
          viaPoints.length
        ){

          const via =
            viaPoints[
              currentViaIndex
            ];


          const distance =
            current.distanceTo(
              via
            );


          document.getElementById(
            "distanceBox"
          ).textContent =
            "📍 経由 " +
            (currentViaIndex + 1) +
            "まで " +
            Math.round(distance) +
            "m";


          /*
           * 100m以内
           *
           * ATSは1回
           */

          if(
            distance <= 100 &&
            !atsActive &&
            !viaATSUsed[currentViaIndex]
          ){

            viaATSUsed[currentViaIndex] =
              true;


            activateATS(
              "⚠️ 経由地点ATS",
              "via"
            );


            return;

          }


          /*
           * 30m以内
           *
           * キンコン停止
           */

          if(
            distance <= 30
          ){

            stopBell();

          }


          return;

        }


        /*
         * =========================
         * 目的地
         * =========================
         */

        const distance =
          current.distanceTo(
            destination
          );


        document.getElementById(
          "distanceBox"
        ).textContent =
          "🎯 目的地まで " +
          Math.round(distance) +
          "m";


        /*
         * =========================
         * 到着ATS
         * =========================
         */

        if(
          distance <= 200 &&
          !atsActive &&
          !destinationATSUsed
        ){

          destinationATSUsed =
            true;


          activateATS(
            "🏁 目的地ATS",
            "destination"
          );


          return;

        }


        /*
         * =========================
         * 30m以内
         * =========================
         */

        if(
          distance <= 30
        ){

          stopBell();

        }

      },


      function(){

        document.getElementById(
          "distanceBox"
        ).textContent =
          "📍 GPS取得失敗";

      },


      {
        enableHighAccuracy:true,

        maximumAge:1000,

        timeout:10000

      }

    );

}


/* =====================================================
   ATS作動
===================================================== */

function activateATS(
  message,
  type
){

  /*
   * すでにATS中なら無視
   */

  if(
    atsActive
  ){

    return;

  }


  atsActive =
    true;


  atsType =
    type;


  atsSeconds =
    60;


  /*
   * キンコン停止
   */

  stopBell();


  /*
   * 終了ボタン消す
   */

  document.getElementById(
    "finishButton"
  ).style.display =
    "none";


  /*
   * ATS表示
   */

  document.getElementById(
    "ats"
  ).style.display =
    "block";


  document.getElementById(
    "atsText"
  ).textContent =
    message;


  document.getElementById(
    "atsTimer"
  ).textContent =
    "自動終了まで 60 秒";


  /*
   * ジリリリリ
   */

  startAlarm();


  /*
   * バイブ
   */

  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      [300,200,300]
    );

  }


  /*
   * カウントダウン
   */

  clearInterval(
    atsCountdownTimer
  );


  atsCountdownTimer =
    setInterval(
      function(){

        if(
          !atsActive
        ){

          return;

        }


        atsSeconds--;


        document.getElementById(
          "atsTimer"
        ).textContent =
          "自動終了まで " +
          Math.max(
            0,
            atsSeconds
          ) +
          " 秒";


        if(
          atsSeconds <= 0
        ){

          releaseATS();

        }

      },
      1000
    );


  /*
   * 60秒強制終了
   */

  clearTimeout(
    atsTimer
  );


  atsTimer =
    setTimeout(
      function(){

        releaseATS();

      },
      60000
    );

}


/* =====================================================
   ATS解除
===================================================== */

function releaseATS(){

  if(
    !atsActive
  ){

    return;

  }


  atsActive =
    false;


  clearTimeout(
    atsTimer
  );


  clearInterval(
    atsCountdownTimer
  );


  atsTimer = null;

  atsCountdownTimer = null;


  /*
   * ジリリリ停止
   */

  stopAlarm();


  /*
   * バイブ停止
   */

  if(
    navigator.vibrate
  ){

    navigator.vibrate(0);

  }


  /*
   * ATS画面消す
   */

  document.getElementById(
    "ats"
  ).style.display =
    "none";


  /*
   * 終了ボタン復活
   */

  document.getElementById(
    "finishButton"
  ).style.display =
    "block";


  /*
   * =========================
   * ATS解除後のキンコン
   * =========================
   *
   * ここを確実に実行
   */

  if(
    !canStopBell()
  ){

    startBell();

  }

}


/* =====================================================
   ATSスライダー
===================================================== */

const sliderButton =
  document.getElementById(
    "sliderButton"
  );


/*
 * タッチ開始
 */

sliderButton.addEventListener(
  "touchstart",
  function(e){

    if(
      !atsActive
    ){

      return;

    }


    startX =
      e.touches[0].clientX;


    sliderX = 0;

  },
  {
    passive:true
  }
);


/*
 * タッチ移動
 */

sliderButton.addEventListener(
  "touchmove",
  function(e){

    if(
      !atsActive
    ){

      return;

    }


    const x =
      e.touches[0].clientX;


    sliderX =
      x - startX;


    if(
      sliderX < 0
    ){

      sliderX = 0;

    }


    const slider =
      sliderButton.parentElement;


    const max =
      slider.clientWidth -
      sliderButton.clientWidth -
      10;


    if(
      sliderX > max
    ){

      sliderX = max;

    }


    sliderButton.style.transform =
      "translateX(" +
      sliderX +
      "px)";

  },
  {
    passive:true
  }
);


/*
 * タッチ終了
 */

sliderButton.addEventListener(
  "touchend",
  function(){

    if(
      !atsActive
    ){

      return;

    }


    const slider =
      sliderButton.parentElement;


    const max =
      slider.clientWidth -
      sliderButton.clientWidth -
      10;


    if(
      sliderX >=
      max * 0.7
    ){

      releaseATS();

    }


    sliderButton.style.transform =
      "translateX(0)";


    sliderX = 0;

  }
);


/* =====================================================
   運転終了
===================================================== */

function finishDrive(){

  /*
   * ATS中は終了不可
   */

  if(
    atsActive
  ){

    return;

  }


  if(
    !confirm(
      "運転を終了しますか？"
    )
  ){

    return;

  }


  /*
   * 音
   */

  stopAlarm();

  stopBell();


  /*
   * ATSタイマー
   */

  clearTimeout(
    atsTimer
  );

  clearInterval(
    atsCountdownTimer
  );


  atsTimer = null;

  atsCountdownTimer = null;


  /*
   * GPS停止
   */

  if(
    watchID !== null
  ){

    navigator.geolocation.clearWatch(
      watchID
    );

    watchID = null;

  }


  /*
   * 経由地点削除
   */

  viaMarkers.forEach(
    function(marker){

      if(map){

        map.removeLayer(
          marker
        );

      }

    }
  );


  /*
   * 目的地削除
   */

  if(
    destinationMarker &&
    map
  ){

    map.removeLayer(
      destinationMarker
    );

  }


  /*
   * 現在地削除
   */

  if(
    currentMarker &&
    map
  ){

    map.removeLayer(
      currentMarker
    );

  }


  /*
   * 初期化
   */

  destination = null;

  destinationMarker = null;

  viaPoints = [];

  viaMarkers = [];

  viaATSUsed = [];

  currentViaIndex = 0;

  destinationATSUsed = false;

  overspeedATSUsed = false;

  atsActive = false;

  atsType = "";

  mode =
    "destination";

  currentSpeed = 0;


  /*
   * 画面
   */

  document.getElementById(
    "drive"
  ).style.display =
    "none";


  document.getElementById(
    "setup"
  ).style.display =
    "block";


  /*
   * パネル
   */

  document.getElementById(
    "routePanel"
  ).style.display =
    "none";


  /*
   * 速度
   */

  document.getElementById(
    "speed"
  ).textContent =
    "0";


  /*
   * 速度超過
   */

  document.getElementById(
    "overspeed"
  ).style.display =
    "none";


  /*
   * ATS
   */

  document.getElementById(
    "ats"
  ).style.display =
    "none";


  /*
   * スライダー
   */

  sliderButton.style.transform =
    "translateX(0)";


  sliderX = 0;


  /*
   * 現在地
   */

  currentMarker = null;

}


/* =====================================================
   ページ終了時
===================================================== */

window.addEventListener(
  "beforeunload",
  function(){

    stopAlarm();

    stopBell();

    if(
      watchID !== null &&
      navigator.geolocation
    ){

      navigator.geolocation.clearWatch(
        watchID
      );

    }

  }
);

</script>

</body>
</html>
