<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>cycletrain</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#080b10;
  color:white;
  font-family:-apple-system,
  BlinkMacSystemFont,
  "Helvetica Neue",
  sans-serif;
  overflow:hidden;
}


/* =========================
   設定画面
========================= */

#setup{
  height:100vh;
  padding:25px 22px;
  overflow-y:auto;
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:800;
  margin:25px 0 35px;
}

label{
  display:block;
  color:#aaa;
  margin:18px 0 8px;
}

select,
input{
  width:100%;
  height:55px;
  padding:0 15px;
  border-radius:15px;
  border:1px solid #363d48;
  background:#171c24;
  color:white;
  font-size:18px;
  outline:none;
}

.speedSetting{
  display:flex;
  align-items:center;
  gap:10px;
}

.speedSetting input{
  flex:1;
}

.speedUnit{
  color:#aaa;
  font-size:17px;
}

.startButton{
  width:100%;
  height:60px;
  margin-top:28px;
  border:0;
  border-radius:17px;
  background:#238636;
  color:white;
  font-size:19px;
  font-weight:bold;
}


/* =========================
   運転画面
========================= */

#drive{
  display:none;
  height:100vh;
  position:relative;
}


/* 幕 */

#board{
  height:75px;
  background:#050505;
  border-bottom:3px solid #30343a;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:24px;
  font-weight:800;

  white-space:nowrap;
  overflow:hidden;
}


/* 地図 */

#map{
  width:100%;
  height:calc(100vh - 275px);
}


/* 距離 */

#distanceBox{
  position:absolute;
  top:85px;
  left:10px;

  z-index:1000;

  padding:9px 12px;

  border-radius:10px;

  background:rgba(0,0,0,.82);

  font-size:14px;
}


/* 制限速度 */

#limitBox{
  position:absolute;
  top:85px;
  right:10px;

  z-index:1000;

  padding:9px 12px;

  border-radius:10px;

  background:rgba(0,0,0,.82);

  font-size:14px;
}


/* 経由地点ボタン */

#routeButton{
  position:absolute;
  top:125px;
  right:10px;

  z-index:1600;

  border:0;
  border-radius:11px;

  background:#252b34;
  color:white;

  padding:10px 12px;

  font-size:13px;
}


/* 経由地点一覧 */

#routePanel{
  display:none;

  position:absolute;

  top:170px;
  right:10px;

  width:210px;
  max-height:240px;

  overflow-y:auto;

  z-index:1700;

  padding:8px;

  background:rgba(10,12,16,.95);

  border-radius:14px;
}

.routeTitle{
  color:#aaa;
  font-size:13px;
  padding:4px 5px 8px;
}

.routeItem{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:5px;

  padding:7px;
  margin-bottom:5px;

  background:#202630;

  border-radius:9px;

  font-size:13px;
}

.routeItem.passed{
  opacity:.45;
}

.deleteRoute{
  border:0;
  border-radius:7px;

  background:#713333;
  color:white;

  padding:5px 7px;
}


/* 速度 */

#speedBox{
  position:absolute;

  bottom:115px;
  left:0;

  width:100%;

  text-align:center;

  z-index:1000;

  pointer-events:none;
}

#speed{
  font-size:52px;
  font-weight:800;
}

.kmh{
  color:#aaa;
  font-size:15px;
}


/* 速度超過 */

#overspeed{
  display:none;

  position:absolute;

  bottom:180px;
  left:0;

  width:100%;

  text-align:center;

  z-index:1800;

  color:#ff453a;

  font-size:19px;
  font-weight:bold;
}


/* 終了 */

#finishButton{
  position:absolute;

  left:20px;
  bottom:20px;

  width:calc(100% - 40px);

  height:65px;

  border:0;
  border-radius:18px;

  background:#252b34;

  color:white;

  font-size:20px;
  font-weight:bold;

  z-index:2000;
}


/* =========================
   ATS
========================= */

#ats{
  display:none;

  position:absolute;

  left:20px;
  bottom:20px;

  width:calc(100% - 40px);

  z-index:3000;
}

.atsWarning{
  text-align:center;

  color:#ff453a;

  font-size:18px;
  font-weight:bold;

  margin-bottom:8px;
}

.slider{
  position:relative;

  height:65px;

  border-radius:18px;

  background:#252b34;

  overflow:hidden;

  touch-action:none;
}

.sliderText{
  position:absolute;

  width:100%;
  height:100%;

  display:flex;

  align-items:center;
  justify-content:center;

  color:#aaa;

  font-size:18px;
}

.sliderButton{
  position:absolute;

  left:5px;
  top:5px;

  width:55px;
  height:55px;

  border-radius:15px;

  background:#ff453a;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:25px;

  z-index:10;

  touch-action:none;
}

</style>
</head>


<body>


<!-- =====================================================
     設定
===================================================== -->

<div id="setup">

  <div class="logo">
    🚲 cycletrain
  </div>


  <label>種別</label>

  <select id="type">

    <option>普通</option>
    <option>快速</option>
    <option>急行</option>
    <option>特急</option>
    <option>新快速</option>

  </select>


  <label>行き先</label>

  <input
    id="destinationName"
    type="text"
    placeholder="例：別府駅"
  >


  <label>速度制限</label>

  <div class="speedSetting">

    <input
      id="speedLimit"
      type="number"
      min="1"
      max="200"
      value="20"
      inputmode="numeric"
    >

    <div class="speedUnit">
      km/h
    </div>

  </div>


  <button
    class="startButton"
    onclick="startDrive()"
  >
    🚃 運転開始
  </button>

</div>


<!-- =====================================================
     運転画面
===================================================== -->

<div id="drive">


  <div id="board">
    快速・別府駅行き
  </div>


  <div id="distanceBox">
    📍 GPS取得中...
  </div>


  <div id="limitBox">
    🚦 制限 20 km/h
  </div>


  <button
    id="routeButton"
    onclick="toggleRoutePanel()"
  >
    📍 経由地点
  </button>


  <div id="routePanel">

    <div class="routeTitle">
      経由地点
    </div>

    <div id="routeList"></div>

  </div>


  <div id="map"></div>


  <div id="overspeed">
    ⚠️ 速度超過
  </div>


  <div id="speedBox">

    <div id="speed">
      0
    </div>

    <div class="kmh">
      km/h
    </div>

  </div>


  <button
    id="finishButton"
    onclick="finishDrive()"
  >
    運転終了
  </button>


  <!-- ATS -->

  <div id="ats">

    <div
      id="atsText"
      class="atsWarning"
    >
      ⚠️ ATS作動
    </div>

    <div class="slider">

      <div class="sliderText">
        スライドで解除
      </div>

      <div
        class="sliderButton"
        id="sliderButton"
      >
        →
      </div>

    </div>

  </div>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =====================================================
   変数
===================================================== */

let map = null;

let currentMarker = null;

let routePoints = [];

let routeMarkers = [];

let currentRouteIndex = 0;

let watchID = null;

let atsActive = false;

let atsTriggered = false;

let overspeedActive = false;

let speedLimit = 20;

let startX = 0;

let sliderX = 0;


/* 音 */

let audioContext = null;

let alarmOscillator = null;

let alarmGain = null;

let bellTimer = null;


/* =====================================================
   音声準備
===================================================== */

function prepareAudio(){

  if(!audioContext){

    audioContext =
      new(
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  if(
    audioContext.state ===
    "suspended"
  ){

    audioContext.resume();

  }

}


/* =====================================================
   ジリリリリ
===================================================== */

function startAlarm(){

  prepareAudio();

  stopAlarm();

  alarmOscillator =
    audioContext.createOscillator();

  alarmGain =
    audioContext.createGain();

  alarmOscillator.type =
    "square";

  alarmOscillator.frequency.value =
    700;

  alarmGain.gain.value =
    0.12;

  alarmOscillator.connect(
    alarmGain
  );

  alarmGain.connect(
    audioContext.destination
  );

  alarmOscillator.start();

}


function stopAlarm(){

  if(alarmOscillator){

    try{
      alarmOscillator.stop();
    }catch(e){}

    alarmOscillator.disconnect();

    alarmOscillator = null;
  }

  if(alarmGain){

    alarmGain.disconnect();

    alarmGain = null;
  }

}


/* =====================================================
   キンコン
===================================================== */

function playBell(){

  prepareAudio();

  const now =
    audioContext.currentTime;


  const osc1 =
    audioContext.createOscillator();

  const gain1 =
    audioContext.createGain();

  osc1.type =
    "sine";

  osc1.frequency.value =
    880;

  gain1.gain.setValueAtTime(
    0.16,
    now
  );

  gain1.gain.exponentialRampToValueAtTime(
    0.001,
    now + 0.14
  );

  osc1.connect(gain1);

  gain1.connect(
    audioContext.destination
  );

  osc1.start(now);

  osc1.stop(
    now + 0.14
  );


  setTimeout(function(){

    if(!audioContext)
      return;

    const now2 =
      audioContext.currentTime;

    const osc2 =
      audioContext.createOscillator();

    const gain2 =
      audioContext.createGain();

    osc2.type =
      "sine";

    osc2.frequency.value =
      660;

    gain2.gain.setValueAtTime(
      0.16,
      now2
    );

    gain2.gain.exponentialRampToValueAtTime(
      0.001,
      now2 + 0.16
    );

    osc2.connect(gain2);

    gain2.connect(
      audioContext.destination
    );

    osc2.start(now2);

    osc2.stop(
      now2 + 0.16
    );

  },140);

}


function startBell(){

  stopBell();

  playBell();

  bellTimer =
    setInterval(
      playBell,
      700
    );

}


function stopBell(){

  if(
    bellTimer !== null
  ){

    clearInterval(
      bellTimer
    );

    bellTimer = null;
  }

}


/* =====================================================
   運転開始
===================================================== */

function startDrive(){

  const type =
    document.getElementById(
      "type"
    ).value;

  const name =
    document.getElementById(
      "destinationName"
    ).value.trim();

  speedLimit =
    Number(
      document.getElementById(
        "speedLimit"
      ).value
    );


  if(!name){

    alert(
      "行き先を入力してください"
    );

    return;
  }


  if(
    !speedLimit ||
    speedLimit <= 0
  ){

    alert(
      "速度制限を設定してください"
    );

    return;
  }


  prepareAudio();


  document.getElementById(
    "board"
  ).textContent =
    type +
    "・" +
    name +
    "行き";


  document.getElementById(
    "limitBox"
  ).textContent =
    "🚦 制限 " +
    speedLimit +
    " km/h";


  document.getElementById(
    "setup"
  ).style.display =
    "none";


  document.getElementById(
    "drive"
  ).style.display =
    "block";


  currentRouteIndex = 0;

  atsTriggered = false;

  overspeedActive = false;


  setTimeout(
    initMap,
    100
  );

}


/* =====================================================
   地図
===================================================== */

function initMap(){

  if(map){

    map.invalidateSize();

    return;
  }


  map =
    L.map("map");


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,

      attribution:
        "&copy; OpenStreetMap contributors"
    }
  ).addTo(map);


  if(
    !navigator.geolocation
  ){

    alert(
      "この端末ではGPSを利用できません"
    );

    return;
  }


  navigator.geolocation.getCurrentPosition(

    function(position){

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;


      map.setView(
        [lat,lng],
        17
      );


      currentMarker =
        L.marker(
          [lat,lng]
        )
        .addTo(map)
        .bindPopup(
          "🚲 現在地"
        );


      startGPS();

    },

    function(){

      map.setView(
        [35.681236,139.767125],
        13
      );


      document.getElementById(
        "distanceBox"
      ).textContent =
        "📍 GPSを許可してください";

    },

    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:1000
    }

  );


  /*
   * 地図タップ
   */

  map.on(
    "click",
    function(e){

      addRoutePoint(
        e.latlng.lat,
        e.latlng.lng
      );

    }
  );

}


/* =====================================================
   経由地点追加
===================================================== */

function addRoutePoint(
  lat,
  lng
){

  const point =
    L.latLng(
      lat,
      lng
    );


  routePoints.push(
    point
  );


  const number =
    routePoints.length;


  const marker =
    L.marker(
      [lat,lng]
    )
    .addTo(map)
    .bindPopup(
      "📍 経由地点 " +
      number
    );


  routeMarkers.push(
    marker
  );


  updateRouteList();

}


/* =====================================================
   経由地点一覧
===================================================== */

function updateRouteList(){

  const list =
    document.getElementById(
      "routeList"
    );


  list.innerHTML = "";


  routePoints.forEach(
    function(point,index){

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "routeItem";


      if(
        index <
        currentRouteIndex
      ){

        item.classList.add(
          "passed"
        );

      }


      const text =
        document.createElement(
          "span"
        );


      if(
        index <
        currentRouteIndex
      ){

        text.textContent =
          "✅ " +
          (index + 1) +
          " 通過";

      }else{

        text.textContent =
          "📍 " +
          (index + 1) +
          " 地点";
      }


      const button =
        document.createElement(
          "button"
        );


      button.className =
        "deleteRoute";

      button.textContent =
        "削除";


      button.onclick =
        function(){

          deleteRoutePoint(
            index
          );

        };


      item.appendChild(
        text
      );

      item.appendChild(
        button
      );

      list.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   経由地点削除
===================================================== */

function deleteRoutePoint(index){

  if(
    !confirm(
      "この経由地点を削除しますか？"
    )
  ){

    return;
  }


  if(
    routeMarkers[index]
  ){

    map.removeLayer(
      routeMarkers[index]
    );

  }


  routeMarkers.splice(
    index,
    1
  );

  routePoints.splice(
    index,
    1
  );


  if(
    index <
    currentRouteIndex
  ){

    currentRouteIndex--;

  }


  if(
    currentRouteIndex < 0
  ){

    currentRouteIndex = 0;

  }


  if(
    currentRouteIndex >=
    routePoints.length
  ){

    currentRouteIndex =
      Math.max(
        0,
        routePoints.length - 1
      );

  }


  if(
    routePoints.length === 0
  ){

    currentRouteIndex = 0;

    atsTriggered = false;

  }


  updateRouteList();

}


/* =====================================================
   パネル
===================================================== */

function toggleRoutePanel(){

  const panel =
    document.getElementById(
      "routePanel"
    );


  if(
    panel.style.display ===
    "block"
  ){

    panel.style.display =
      "none";

  }else{

    panel.style.display =
      "block";

  }

}


/* =====================================================
   GPS
===================================================== */

function startGPS(){

  if(
    watchID !== null
  ){

    navigator.geolocation.clearWatch(
      watchID
    );

  }


  watchID =
    navigator.geolocation.watchPosition(

      function(position){

        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;


        /* =====================
           速度
        ===================== */

        let speed =
          position.coords.speed;


        if(
          speed === null ||
          speed < 0
        ){

          speed = 0;

        }


        speed =
          speed * 3.6;


        const speedRounded =
          Math.round(speed);


        document.getElementById(
          "speed"
        ).textContent =
          speedRounded;


        /* =====================
           現在地
        ===================== */

        if(currentMarker){

          currentMarker.setLatLng(
            [lat,lng]
          );

        }


        /* =====================
           地図追従
        ===================== */

        if(map){

          map.panTo(
            [lat,lng],
            {
              animate:true,
              duration:.5
            }
          );

        }


        /* =====================
           速度超過
        ===================== */

        if(
          speed > speedLimit
        ){

          document.getElementById(
            "overspeed"
          ).style.display =
            "block";


          if(
            !overspeedActive &&
            !atsActive
          ){

            overspeedActive = true;

            activateATS(
              "⚠️ 速度超過ATS"
            );

          }

        }else{

          document.getElementById(
            "overspeed"
          ).style.display =
            "none";

        }


        /* =====================
           経由地点
        ===================== */

        if(
          routePoints.length === 0
        ){

          document.getElementById(
            "distanceBox"
          ).textContent =
            "📍 地図をタップして経由地点を追加";

          return;
        }


        if(
          currentRouteIndex >=
          routePoints.length
        ){

          return;
        }


        const current =
          L.latLng(
            lat,
            lng
          );


        const target =
          routePoints[
            currentRouteIndex
          ];


        const distance =
          current.distanceTo(
            target
          );


        /* =====================
           距離表示
        ===================== */

        if(
          distance >= 1000
        ){

          document.getElementById(
            "distanceBox"
          ).textContent =
            "📍 次の地点まで " +
            (distance / 1000)
              .toFixed(2) +
            " km";

        }else{

          document.getElementById(
            "distanceBox"
          ).textContent =
            "📍 次の地点まで " +
            Math.round(distance) +
            " m";

        }


        /* =====================
           ★ 経由地点ATS ★
        ===================== */

        if(
          distance <= 100 &&
          !atsActive
        ){

          currentRouteIndex++;

          updateRouteList();


          /*
           * まだ次の経由地点がある
           */

          if(
            currentRouteIndex <
            routePoints.length
          ){

            document.getElementById(
              "distanceBox"
            ).textContent =
              "📍 経由地点ATS";


            activateATS(
              "⚠️ 経由地点ATS"
            );

          }


          /*
           * 最後の地点
           */

          else{

            if(
              !atsTriggered
            ){

              atsTriggered = true;


              document.getElementById(
                "distanceBox"
              ).textContent =
                "🏁 目的地ATS";


              activateATS(
                "⚠️ 目的地ATS"
              );

            }

          }

        }

      },


      function(){

        document.getElementById(
          "distanceBox"
        ).textContent =
          "📍 GPS取得失敗";

      },


      {
        enableHighAccuracy:true,
        maximumAge:1000,
        timeout:10000
      }

    );

}


/* =====================================================
   ATS作動
===================================================== */

function activateATS(message){

  if(atsActive){

    return;
  }


  atsActive = true;


  document.getElementById(
    "finishButton"
  ).style.display =
    "none";


  document.getElementById(
    "ats"
  ).style.display =
    "block";


  document.getElementById(
    "atsText"
  ).textContent =
    message;


  startAlarm();


  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      [300,200]
    );

  }

}


/* =====================================================
   ATS解除
===================================================== */

function releaseATS(){

  if(!atsActive){

    return;
  }


  atsActive = false;


  stopAlarm();


  if(
    navigator.vibrate
  ){

    navigator.vibrate(0);

  }


  document.getElementById(
    "ats"
  ).style.display =
    "none";


  document.getElementById(
    "finishButton"
  ).style.display =
    "block";


  overspeedActive = false;


  /*
   * ATS解除後キンコン
   */

  startBell();

}


/* =====================================================
   スライド
===================================================== */

const sliderButton =
  document.getElementById(
    "sliderButton"
  );


sliderButton.addEventListener(
  "touchstart",
  function(e){

    if(!atsActive){

      return;
    }


    startX =
      e.touches[0].clientX;

  }
);


sliderButton.addEventListener(
  "touchmove",
  function(e){

    if(!atsActive){

      return;
    }


    const currentX =
      e.touches[0].clientX;


    sliderX =
      currentX - startX;


    if(
      sliderX < 0
    ){

      sliderX = 0;

    }


    if(
      sliderX > 250
    ){

      sliderX = 250;

    }


    sliderButton.style.transform =
      "translateX(" +
      sliderX +
      "px)";

  }
);


sliderButton.addEventListener(
  "touchend",
  function(){

    if(!atsActive){

      return;
    }


    if(
      sliderX >= 190
    ){

      releaseATS();


      sliderButton.style.transform =
        "translateX(250px)";


      setTimeout(
        function(){

          sliderButton.style.transform =
            "translateX(0)";

          sliderX = 0;

        },
        250
      );

    }else{

      sliderButton.style.transform =
        "translateX(0)";

      sliderX = 0;

    }

  }
);


/* =====================================================
   運転終了
===================================================== */

function finishDrive(){

  if(atsActive){

    return;
  }


  if(
    !confirm(
      "運転を終了しますか？"
    )
  ){

    return;
  }


  stopAlarm();

  stopBell();


  if(
    navigator.vibrate
  ){

    navigator.vibrate(0);

  }


  if(
    watchID !== null
  ){

    navigator.geolocation.clearWatch(
      watchID
    );

    watchID = null;

  }


  routeMarkers.forEach(
    function(marker){

      if(map){

        map.removeLayer(
          marker
        );

      }

    }
  );


  routeMarkers = [];

  routePoints = [];


  if(
    currentMarker &&
    map
  ){

    map.removeLayer(
      currentMarker
    );

  }


  currentMarker = null;


  currentRouteIndex = 0;

  atsActive = false;

  atsTriggered = false;

  overspeedActive = false;


  document.getElementById(
    "drive"
  ).style.display =
    "none";


  document.getElementById(
    "setup"
  ).style.display =
    "block";


  document.getElementById(
    "speed"
  ).textContent =
    "0";


  document.getElementById(
    "routePanel"
  ).style.display =
    "none";


  document.getElementById(
    "overspeed"
  ).style.display =
    "none";

}

</script>
