<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>cycletrain</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

/* =====================================================
   BASE
===================================================== */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:#eef1f5;
  color:#111;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    Arial,
    sans-serif;
}

/* =====================================================
   GLASS
===================================================== */

.glass{
  background:rgba(255,255,255,.72);
  border:1px solid rgba(255,255,255,.8);
  box-shadow:
    0 8px 30px rgba(0,0,0,.12),
    inset 0 1px 0 rgba(255,255,255,.8);
  backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
}

/* =====================================================
   SETUP
===================================================== */

#setup{
  height:100vh;
  padding:30px 22px;
  overflow-y:auto;
  background:
    radial-gradient(
      circle at 20% 10%,
      rgba(100,180,255,.25),
      transparent 35%
    ),
    radial-gradient(
      circle at 80% 80%,
      rgba(150,200,255,.22),
      transparent 35%
    ),
    #f2f4f7;
}

.logo{
  text-align:center;
  font-size:34px;
  font-weight:850;
  letter-spacing:-1px;
  margin:28px 0 40px;
  color:#111;
}

label{
  display:block;
  color:#6d737b;
  margin:19px 0 8px;
  font-size:14px;
  font-weight:600;
}

select,
input{
  width:100%;
  height:58px;
  padding:0 17px;
  border-radius:19px;
  border:1px solid rgba(0,0,0,.08);
  background:rgba(255,255,255,.76);
  color:#111;
  font-size:18px;
  outline:none;
  box-shadow:
    0 5px 20px rgba(0,0,0,.07),
    inset 0 1px 1px rgba(255,255,255,.9);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}

.speedSetting{
  display:flex;
  align-items:center;
  gap:10px;
}

.speedSetting input{
  flex:1;
}

.speedUnit{
  color:#777;
  font-size:15px;
}

.startButton{
  width:100%;
  height:62px;
  margin-top:30px;
  border:0;
  border-radius:20px;

  background:
    linear-gradient(
      180deg,
      #4da3ff,
      #1478ed
    );

  color:white;
  font-size:19px;
  font-weight:750;

  box-shadow:
    0 10px 25px rgba(20,120,237,.30),
    inset 0 1px 1px rgba(255,255,255,.4);
}

/* =====================================================
   DRIVE
===================================================== */

#drive{
  display:none;
  height:100vh;
  position:relative;
  background:#e9edf2;
}

/* =====================================================
   BOARD
===================================================== */

#board{
  height:76px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.94),
      rgba(245,247,250,.90)
    );

  border-bottom:1px solid rgba(0,0,0,.08);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:25px;
  font-weight:850;

  white-space:nowrap;
  overflow:hidden;

  position:relative;
  z-index:1200;

  box-shadow:
    0 5px 20px rgba(0,0,0,.08);

  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
}

/* =====================================================
   MAP
===================================================== */

#map{
  width:100%;
  height:calc(100vh - 76px);

  background:#e8edf2;
}

/*
 * Leafletを少しApple Maps風に
 */

.leaflet-container{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    sans-serif;

  background:#e7ecf1;
}

.leaflet-control-zoom{
  border:0 !important;
  border-radius:15px !important;
  overflow:hidden;

  box-shadow:
    0 5px 20px rgba(0,0,0,.18) !important;
}

.leaflet-control-zoom a{
  border:0 !important;
  background:rgba(255,255,255,.85) !important;
  backdrop-filter:blur(15px);
  color:#222 !important;
}

.leaflet-control-attribution{
  background:rgba(255,255,255,.65) !important;
  backdrop-filter:blur(10px);
}

/* =====================================================
   DISTANCE
===================================================== */

#distanceBox{
  position:absolute;
  top:88px;
  left:10px;
  z-index:1500;

  padding:10px 14px;

  border-radius:16px;

  background:rgba(255,255,255,.78);

  border:1px solid rgba(255,255,255,.9);

  box-shadow:
    0 7px 25px rgba(0,0,0,.13);

  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);

  color:#20242a;
  font-size:14px;
  font-weight:600;
}

/* =====================================================
   SPEED LIMIT
===================================================== */

#limitBox{
  position:absolute;
  top:88px;
  right:10px;
  z-index:1500;

  padding:10px 14px;

  border-radius:16px;

  background:rgba(255,255,255,.78);

  border:1px solid rgba(255,255,255,.9);

  box-shadow:
    0 7px 25px rgba(0,0,0,.13);

  backdrop-filter:blur(22px);

  color:#20242a;
  font-size:14px;
  font-weight:650;
}

/* =====================================================
   FOLLOW
===================================================== */

#followBox{
  position:absolute;
  top:135px;
  left:10px;
  z-index:1600;

  padding:8px 11px;

  border-radius:15px;

  background:rgba(255,255,255,.78);

  border:1px solid rgba(255,255,255,.9);

  box-shadow:
    0 7px 25px rgba(0,0,0,.13);

  backdrop-filter:blur(22px);

  font-size:13px;

  display:flex;
  align-items:center;
  gap:7px;
}

#followSwitch{
  width:45px;
  height:25px;

  appearance:none;

  background:#c7cbd1;

  border-radius:20px;

  position:relative;

  outline:none;
  padding:0;
  border:0;
}

#followSwitch:checked{
  background:#1683ff;
}

#followSwitch::after{
  content:"";

  position:absolute;

  width:21px;
  height:21px;

  top:2px;
  left:2px;

  background:white;

  border-radius:50%;

  box-shadow:0 2px 5px rgba(0,0,0,.2);

  transition:.2s;
}

#followSwitch:checked::after{
  transform:translateX(20px);
}

/* =====================================================
   MODE
===================================================== */

#modeBox{
  position:absolute;
  top:135px;
  right:10px;
  z-index:1600;

  padding:9px 12px;

  border-radius:15px;

  background:rgba(255,255,255,.78);

  border:1px solid rgba(255,255,255,.9);

  box-shadow:
    0 7px 25px rgba(0,0,0,.13);

  backdrop-filter:blur(22px);

  font-size:13px;
  font-weight:650;
}

/* =====================================================
   ROUTE BUTTON
===================================================== */

#routeButton{
  position:absolute;
  top:178px;
  right:10px;
  z-index:1600;

  border:1px solid rgba(255,255,255,.9);

  border-radius:15px;

  background:rgba(255,255,255,.80);

  color:#222;

  padding:10px 13px;

  font-size:13px;
  font-weight:650;

  box-shadow:
    0 7px 25px rgba(0,0,0,.13);

  backdrop-filter:blur(22px);
}

/* =====================================================
   ROUTE PANEL
===================================================== */

#routePanel{
  display:none;

  position:absolute;

  top:225px;
  right:10px;

  width:240px;
  max-height:290px;

  overflow-y:auto;

  z-index:1700;

  padding:10px;

  background:rgba(245,247,250,.84);

  border:1px solid rgba(255,255,255,.9);

  border-radius:20px;

  box-shadow:
    0 15px 40px rgba(0,0,0,.20);

  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
}

.routeTitle{
  color:#777;
  font-size:13px;
  padding:5px 6px 9px;
}

.routeItem{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:5px;

  padding:8px;

  margin-bottom:6px;

  background:rgba(255,255,255,.65);

  border:1px solid rgba(0,0,0,.05);

  border-radius:13px;

  font-size:13px;
}

.deleteRoute{
  border:0;

  border-radius:9px;

  background:#ffdddd;

  color:#d52828;

  padding:6px 8px;

  font-weight:600;
}

/* =====================================================
   SPEED
===================================================== */

#speedBox{
  position:absolute;

  bottom:115px;

  left:0;

  width:100%;

  text-align:center;

  z-index:1500;

  pointer-events:none;
}

#speed{
  font-size:55px;
  font-weight:850;
  color:#111;

  text-shadow:
    0 2px 8px rgba(255,255,255,.8);
}

.kmh{
  color:#777;
  font-size:14px;
}

/* =====================================================
   OVERSPEED
===================================================== */

#overspeed{
  display:none;

  position:absolute;

  bottom:180px;

  left:0;

  width:100%;

  text-align:center;

  z-index:1800;

  color:#ff3b30;

  font-size:19px;
  font-weight:800;
}

/* =====================================================
   FINISH
===================================================== */

#finishButton{
  position:absolute;

  left:20px;
  bottom:20px;

  width:calc(100% - 40px);

  height:62px;

  border:1px solid rgba(255,255,255,.9);

  border-radius:20px;

  background:rgba(255,255,255,.78);

  color:#111;

  font-size:19px;
  font-weight:750;

  z-index:2000;

  box-shadow:
    0 10px 30px rgba(0,0,0,.15);

  backdrop-filter:blur(25px);
}

/* =====================================================
   ATS
===================================================== */

#ats{
  display:none;

  position:absolute;

  left:20px;
  bottom:20px;

  width:calc(100% - 40px);

  z-index:3000;
}

.atsWarning{
  text-align:center;

  color:#ff3b30;

  font-size:19px;
  font-weight:850;

  margin-bottom:8px;

  text-shadow:
    0 2px 8px rgba(255,255,255,.8);
}

.atsTimer{
  text-align:center;

  color:#666;

  font-size:13px;

  margin-bottom:6px;
}

.slider{
  position:relative;

  height:66px;

  border-radius:20px;

  background:rgba(255,255,255,.80);

  border:1px solid rgba(255,255,255,.9);

  overflow:hidden;

  touch-action:none;

  box-shadow:
    0 10px 35px rgba(0,0,0,.18);

  backdrop-filter:blur(25px);
}

.sliderText{
  position:absolute;

  width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#777;

  font-size:17px;
  font-weight:600;
}

.sliderButton{
  position:absolute;

  left:5px;
  top:5px;

  width:56px;
  height:56px;

  border-radius:17px;

  background:
    linear-gradient(
      180deg,
      #ff5b52,
      #ff3b30
    );

  color:white;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:25px;

  z-index:10;

  touch-action:none;

  box-shadow:
    0 5px 15px rgba(255,59,48,.3);
}

/* =====================================================
   MARKER
===================================================== */

.current-location-marker{
  width:22px;
  height:22px;

  border-radius:50%;

  background:#1478ff;

  border:4px solid white;

  box-shadow:
    0 2px 10px rgba(0,0,0,.3);
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-height:700px){

  #speed{
    font-size:46px;
  }

  #speedBox{
    bottom:105px;
  }

}

</style>

</head>

<body>


<!-- =====================================================
     SETUP
===================================================== -->

<div id="setup">

  <div class="logo">
    🚲 cycletrain
  </div>

  <label>種別</label>

  <select id="type">

    <option>普通</option>

    <option>快速</option>

    <option>急行</option>

    <option>特急</option>

    <option>新快速</option>

  </select>


  <label>行き先</label>

  <input
    id="destinationName"
    type="text"
    placeholder="例：別府駅"
  >


  <label>速度制限</label>

  <div class="speedSetting">

    <input
      id="speedLimit"
      type="number"
      min="1"
      max="200"
      value="20"
      inputmode="numeric"
    >

    <div class="speedUnit">
      km/h
    </div>

  </div>


  <button
    class="startButton"
    onclick="startDrive()"
  >
    🚃 運転開始
  </button>

</div>


<!-- =====================================================
     DRIVE
===================================================== -->

<div id="drive">

  <div id="board">
    普通・別府駅
  </div>


  <div id="distanceBox">
    📍 目的地を設定してください
  </div>


  <div id="limitBox">
    🚦 制限 20 km/h
  </div>


  <div id="followBox">

    追従

    <input
      id="followSwitch"
      type="checkbox"
      checked
    >

  </div>


  <div id="modeBox">
    🎯 目的地設定
  </div>


  <button
    id="routeButton"
    onclick="toggleRoutePanel()"
  >
    📍 地点一覧
  </button>


  <div id="routePanel">

    <div class="routeTitle">
      設定地点
    </div>

    <div id="routeList"></div>

  </div>


  <div id="map"></div>


  <div id="overspeed">
    ⚠️ 速度超過
  </div>


  <div id="speedBox">

    <div id="speed">
      0
    </div>

    <div class="kmh">
      km/h
    </div>

  </div>


  <button
    id="finishButton"
    onclick="finishDrive()"
  >
    運転終了
  </button>


  <!-- ATS -->

  <div id="ats">

    <div
      id="atsText"
      class="atsWarning"
    >
      ⚠️ ATS作動
    </div>

    <div
      id="atsTimer"
      class="atsTimer"
    >
      自動終了まで 60 秒
    </div>

    <div class="slider">

      <div class="sliderText">
        スライドで解除
      </div>

      <div
        class="sliderButton"
        id="sliderButton"
      >
        →
      </div>

    </div>

  </div>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =====================================================
   BASIC VARIABLES
===================================================== */

let map = null;

let currentMarker = null;

let destination = null;

let destinationMarker = null;

let viaPoints = [];

let viaMarkers = [];

let currentViaIndex = 0;

let mode = "destination";

let watchID = null;

let speedLimit = 20;

let currentSpeed = 0;


/* =====================================================
   ATS
===================================================== */

let atsActive = false;

let atsTimer = null;

let atsCountdownTimer = null;

let atsSeconds = 60;

let atsType = "";


/*
 * 一度通過したATSは
 * 同じ場所では再発動させない
 */

let destinationATSUsed = false;

let viaATSUsed = new Set();

let overspeedATSUsed = false;


/* =====================================================
   BELL
===================================================== */

let bellTimer = null;

let bellActive = false;


/* =====================================================
   AUDIO
===================================================== */

let audioContext = null;

let alarmOscillators = [];

let alarmGain = null;


/* =====================================================
   SLIDER
===================================================== */

let startX = 0;

let sliderX = 0;


/* =====================================================
   AUDIO PREPARE
===================================================== */

function prepareAudio(){

  if(!audioContext){

    audioContext =
      new(
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  if(
    audioContext.state === "suspended"
  ){

    audioContext.resume();

  }

}


/* =====================================================
   JR九州 ATS風
   連続ジリリリリ音
===================================================== */

function startAlarm(){

  prepareAudio();

  stopAlarm();


  /*
   * 音量
   */

  alarmGain =
    audioContext.createGain();

  alarmGain.gain.value =
    0.10;

  alarmGain.connect(
    audioContext.destination
  );


  /*
   * 2つの周波数を重ねる
   * → 機械的な「ジリリリ」感
   */

  const frequencies =
    [720,760];


  frequencies.forEach(
    function(freq){

      const osc =
        audioContext.createOscillator();

      osc.type =
        "square";

      osc.frequency.value =
        freq;

      osc.connect(
        alarmGain
      );

      osc.start();

      alarmOscillators.push(
        osc
      );

    }
  );

}


/* =====================================================
   ATS停止
===================================================== */

function stopAlarm(){

  alarmOscillators.forEach(
    function(osc){

      try{
        osc.stop();
      }catch(e){}

      try{
        osc.disconnect();
      }catch(e){}

    }
  );


  alarmOscillators = [];


  if(alarmGain){

    try{
      alarmGain.disconnect();
    }catch(e){}

    alarmGain = null;

  }

}


/* =====================================================
   キンコン
===================================================== */

function playBell(){

  prepareAudio();

  const now =
    audioContext.currentTime;


  const osc1 =
    audioContext.createOscillator();

  const gain1 =
    audioContext.createGain();

  osc1.type =
    "sine";

  osc1.frequency.value =
    880;

  gain1.gain.setValueAtTime(
    0.15,
    now
  );

  gain1.gain.exponentialRampToValueAtTime(
    0.001,
    now + .14
  );

  osc1.connect(gain1);

  gain1.connect(
    audioContext.destination
  );

  osc1.start(now);

  osc1.stop(
    now + .14
  );


  setTimeout(
    function(){

      if(!audioContext){
        return;
      }

      const now2 =
        audioContext.currentTime;

      const osc2 =
        audioContext.createOscillator();

      const gain2 =
        audioContext.createGain();

      osc2.type =
        "sine";

      osc2.frequency.value =
        660;

      gain2.gain.setValueAtTime(
        .15,
        now2
      );

      gain2.gain.exponentialRampToValueAtTime(
        .001,
        now2 + .16
      );

      osc2.connect(gain2);

      gain2.connect(
        audioContext.destination
      );

      osc2.start(now2);

      osc2.stop(
        now2 + .16
      );

    },
    140
  );

}


/* =====================================================
   キンコン開始
===================================================== */

function startBell(){

  stopBell();

  if(
    canStopBell()
  ){

    return;

  }

  bellActive = true;

  playBell();

  bellTimer =
    setInterval(
      function(){

        if(
          canStopBell()
        ){

          stopBell();

          return;

        }

        playBell();

      },
      700
    );

}


/* =====================================================
   キンコン停止
===================================================== */

function stopBell(){

  if(
    bellTimer !== null
  ){

    clearInterval(
      bellTimer
    );

    bellTimer = null;

  }

  bellActive = false;

}


/* =====================================================
   キンコン停止条件
===================================================== */

function canStopBell(){

  if(!currentMarker){

    return false;

  }


  const current =
    currentMarker.getLatLng();


  /*
   * 目的地30m
   */

  if(destination){

    if(
      current.distanceTo(
        destination
      ) <= 30
    ){

      return true;

    }

  }


  /*
   * 経由地点30m
   */

  for(
    let i = 0;
    i < viaPoints.length;
    i++
  ){

    if(
      current.distanceTo(
        viaPoints[i]
      ) <= 30
    ){

      return true;

    }

  }


  /*
   * 速度ATS
   */

  if(
    atsType === "overspeed"
  ){

    if(
      currentSpeed <=
      speedLimit - 3
    ){

      return true;

    }

  }


  return false;

}


/* =====================================================
   種別カラー
   「背景ではなく文字だけ」
===================================================== */

function getTypeColor(type){

  if(
    type === "普通"
  ){

    return "#ffffff";

  }

  if(
    type === "新快速"
  ){

    return "#1478ff";

  }

  return "#ff3b30";

}


/* =====================================================
   運転開始
===================================================== */

function startDrive(){

  const type =
    document.getElementById(
      "type"
    ).value;

  const name =
    document.getElementById(
      "destinationName"
    ).value.trim();

  speedLimit =
    Number(
      document.getElementById(
        "speedLimit"
      ).value
    );


  if(!name){

    alert(
      "行き先名を入力してください"
    );

    return;

  }


  if(
    !speedLimit ||
    speedLimit <= 0
  ){

    alert(
      "速度制限を設定してください"
    );

    return;

  }


  prepareAudio();


  const board =
    document.getElementById(
      "board"
    );


  /*
   * 「行き」を付けない
   */

  board.textContent =
    type +
    "・" +
    name;


  /*
   * 普通だけ白
   * 新快速青
   * その他赤
   */

  board.style.color =
    getTypeColor(type);


  /*
   * 制限速度
   */

  document.getElementById(
    "limitBox"
  ).textContent =
    "🚦 制限 " +
    speedLimit +
    " km/h";


  document.getElementById(
    "setup"
  ).style.display =
    "none";


  document.getElementById(
    "drive"
  ).style.display =
    "block";


  mode =
    "destination";


  destinationATSUsed =
    false;

  viaATSUsed =
    new Set();

  overspeedATSUsed =
    false;


  updateMode();


  setTimeout(
    initMap,
    100
  );

}


/* =====================================================
   MAP
===================================================== */

function initMap(){

  if(map){

    map.invalidateSize();

    return;

  }


  map =
    L.map(
      "map",
      {
        zoomControl:true,
        attributionControl:true
      }
    );


  /*
   * 無料・高解像度系のCarto Voyager
   *
   * Apple Maps風の
   * スッキリした地図表現
   */

  L.tileLayer(
    "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
    {
      maxZoom:20,
      subdomains:"abcd",
      attribution:
        '&copy; OpenStreetMap &copy; CARTO'
    }
  ).addTo(map);


  if(
    !navigator.geolocation
  ){

    alert(
      "この端末ではGPSを利用できません"
    );

    return;

  }


  navigator.geolocation.getCurrentPosition(

    function(position){

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;


      map.setView(
        [lat,lng],
        17
      );


      createCurrentMarker(
        lat,
        lng
      );


      startGPS();

    },

    function(){

      map.setView(
        [35.681236,139.767125],
        13
      );


      document.getElementById(
        "distanceBox"
      ).textContent =
        "📍 GPSを許可してください";

    },

    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:1000
    }

  );


  map.on(
    "click",
    function(e){

      setPoint(
        e.latlng.lat,
        e.latlng.lng
      );

    }
  );

}


/* =====================================================
   現在地マーカー
===================================================== */

function createCurrentMarker(
  lat,
  lng
){

  const icon =
    L.divIcon({

      className:"",

      html:
        '<div class="current-location-marker"></div>',

      iconSize:[22,22],

      iconAnchor:[11,11]

    });


  currentMarker =
    L.marker(
      [lat,lng],
      {
        icon:icon
      }
    )
    .addTo(map);

}


/* =====================================================
   地点設定
===================================================== */

function setPoint(
  lat,
  lng
){

  /*
   * 目的地
   */

  if(
    mode === "destination"
  ){

    if(destinationMarker){

      map.removeLayer(
        destinationMarker
      );

    }


    destination =
      L.latLng(
        lat,
        lng
      );


    destinationMarker =
      L.marker(
        [lat,lng]
      )
      .addTo(map)
      .bindPopup(
        "🎯 目的地"
      );


    mode =
      "via";


    updateMode();

    updateRouteList();


    document.getElementById(
      "distanceBox"
    ).textContent =
      "📍 経由地点を設定してください";


    return;

  }


  /*
   * 経由地点
   */

  if(
    mode === "via"
  ){

    addViaPoint(
      lat,
      lng
    );

  }

}


/* =====================================================
   経由地点追加
===================================================== */

function addViaPoint(
  lat,
  lng
){

  const point =
    L.latLng(
      lat,
      lng
    );


  viaPoints.push(
    point
  );


  const index =
    viaPoints.length;


  const marker =
    L.marker(
      [lat,lng]
    )
    .addTo(map)
    .bindPopup(
      "📍 経由地点 " +
      index
    );


  viaMarkers.push(
    marker
  );


  updateRouteList();

}


/* =====================================================
   MODE
===================================================== */

function updateMode(){

  const box =
    document.getElementById(
      "modeBox"
    );


  if(
    mode === "destination"
  ){

    box.textContent =
      "🎯 目的地設定";

  }else{

    box.textContent =
      "📍 経由地点設定";

  }

}


/* =====================================================
   ROUTE LIST
===================================================== */

function updateRouteList(){

  const list =
    document.getElementById(
      "routeList"
    );


  list.innerHTML = "";


  if(destination){

    const item =
      document.createElement(
        "div"
      );

    item.className =
      "routeItem";


    const text =
      document.createElement(
        "span"
      );

    text.textContent =
      "🎯 目的地";


    const button =
      document.createElement(
        "button"
      );

    button.className =
      "deleteRoute";

    button.textContent =
      "削除";


    button.onclick =
      function(){

        deleteDestination();

      };


    item.appendChild(text);

    item.appendChild(button);

    list.appendChild(item);

  }


  viaPoints.forEach(
    function(point,index){

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "routeItem";


      const text =
        document.createElement(
          "span"
        );

      text.textContent =
        "📍 経由 " +
        (index + 1);


      const button =
        document.createElement(
          "button"
        );

      button.className =
        "deleteRoute";

      button.textContent =
        "削除";


      button.onclick =
        function(){

          deleteViaPoint(
            index
          );

        };


      item.appendChild(text);

      item.appendChild(button);

      list.appendChild(item);

    }
  );

}


/* =====================================================
   目的地削除
===================================================== */

function deleteDestination(){

  if(
    !confirm(
      "目的地を削除しますか？"
    )
  ){

    return;

  }


  if(destinationMarker){

    map.removeLayer(
      destinationMarker
    );

  }


  destination = null;

  destinationMarker = null;


  mode =
    "destination";


  /*
   * 目的地ATSをリセット
   */

  destinationATSUsed =
    false;


  updateMode();

  updateRouteList();


  document.getElementById(
    "distanceBox"
  ).textContent =
    "🎯 新しい目的地を設定してください";

}


/* =====================================================
   経由削除
===================================================== */

function deleteViaPoint(
  index
){

  if(
    !confirm(
      "この経由地点を削除しますか？"
    )
  ){

    return;

  }


  if(viaMarkers[index]){

    map.removeLayer(
      viaMarkers[index]
    );

  }


  viaMarkers.splice(
    index,
    1
  );

  viaPoints.splice(
    index,
    1
  );


  if(
    currentViaIndex > index
  ){

    currentViaIndex--;

  }


  if(
    currentViaIndex < 0
  ){

    currentViaIndex = 0;

  }


  /*
   * ATS管理も作り直す
   */

  viaATSUsed =
    new Set();


  updateRouteList();

}


/* =====================================================
   ROUTE PANEL
===================================================== */

function toggleRoutePanel(){

  const panel =
    document.getElementById(
      "routePanel"
    );


  panel.style.display =
    panel.style.display === "block"
      ? "none"
      : "block";

}


/* =====================================================
   GPS
===================================================== */

function startGPS(){

  if(
    watchID !== null
  ){

    navigator.geolocation.clearWatch(
      watchID
    );

  }


  watchID =
    navigator.geolocation.watchPosition(

      function(position){

        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;


        /*
         * SPEED
         */

        let speed =
          position.coords.speed;


        if(
          speed === null ||
          speed < 0
        ){

          speed = 0;

        }


        speed =
          speed * 3.6;


        currentSpeed =
          speed;


        document.getElementById(
          "speed"
        ).textContent =
          Math.round(speed);


        /*
         * CURRENT POSITION
         */

        if(currentMarker){

          currentMarker.setLatLng(
            [lat,lng]
          );

        }


        /*
         * FOLLOW
         */

        const follow =
          document.getElementById(
            "followSwitch"
          ).checked;


        if(
          follow &&
          map
        ){

          map.panTo(
            [lat,lng],
            {
              animate:true,
              duration:.5
            }
          );

        }


        /*
         * OVERSPEED
         */

        if(
          speed > speedLimit
        ){

          document.getElementById(
            "overspeed"
          ).style.display =
            "block";


          /*
           * 一度だけATS
           */

          if(
            !atsActive &&
            !overspeedATSUsed
          ){

            overspeedATSUsed =
              true;

            activateATS(
              "⚠️ 速度超過ATS",
              "overspeed"
            );

          }

        }else{

          document.getElementById(
            "overspeed"
          ).style.display =
            "none";


          /*
           * 十分減速したら
           * 次回速度超過ATSを許可
           */

          if(
            speed <=
            speedLimit - 3
          ){

            overspeedATSUsed =
              false;

          }

        }


        /*
         * DESTINATIONなし
         */

        if(!destination){

          return;

        }


        const current =
          L.latLng(
            lat,
            lng
          );


        /*
         * =================================================
         * VIA
         * =================================================
         */

        if(
          currentViaIndex <
          viaPoints.length
        ){

          const via =
            viaPoints[
              currentViaIndex
            ];


          const distance =
            current.distanceTo(
              via
            );


          document.getElementById(
            "distanceBox"
          ).textContent =
            "📍 経由 " +
            (currentViaIndex + 1) +
            "まで " +
            Math.round(distance) +
            "m";


          /*
           * 100m ATS
           *
           * その地点につき一回だけ
           */

          if(
            distance <= 100 &&
            !atsActive &&
            !viaATSUsed.has(
              currentViaIndex
            )
          ){

            viaATSUsed.add(
              currentViaIndex
            );


            activateATS(
              "⚠️ 経由地点ATS",
              "via"
            );

          }


          /*
           * 30mならキンコン停止
           */

          if(
            distance <= 30
          ){

            stopBell();

            /*
             * 経由地点到着
             *
             * ATS中でなければ
             * 次の地点へ
             */

            if(
              !atsActive &&
              currentViaIndex <
              viaPoints.length
            ){

              currentViaIndex++;

            }

          }


          return;

        }


        /*
         * =================================================
         * DESTINATION
         * =================================================
         */

        const distance =
          current.distanceTo(
            destination
          );


        document.getElementById(
          "distanceBox"
        ).textContent =
          "🎯 目的地まで " +
          Math.round(distance) +
          "m";


        /*
         * 200m以内
         *
         * 到着ATSは一回だけ
         */

        if(
          distance <= 200 &&
          !atsActive &&
          !destinationATSUsed
        ){

          destinationATSUsed =
            true;


          activateATS(
            "🏁 目的地ATS",
            "destination"
          );

        }


        /*
         * 30m以内なら
         * キンコン停止
         */

        if(
          distance <= 30
        ){

          stopBell();

        }

      },


      function(){

        document.getElementById(
          "distanceBox"
        ).textContent =
          "📍 GPS取得失敗";

      },


      {
        enableHighAccuracy:true,
        maximumAge:1000,
        timeout:10000
      }

    );

}


/* =====================================================
   ATS ACTIVATE
===================================================== */

function activateATS(
  message,
  type
){

  /*
   * ATS中なら絶対に重複作動させない
   */

  if(
    atsActive
  ){

    return;

  }


  atsActive =
    true;

  atsType =
    type;

  atsSeconds =
    60;


  stopBell();


  document.getElementById(
    "finishButton"
  ).style.display =
    "none";


  document.getElementById(
    "ats"
  ).style.display =
    "block";


  document.getElementById(
    "atsText"
  ).textContent =
    message;


  document.getElementById(
    "atsTimer"
  ).textContent =
    "自動終了まで 60 秒";


  /*
   * 連続ジリリリリ
   */

  startAlarm();


  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      [300,200]
    );

  }


  clearInterval(
    atsCountdownTimer
  );


  atsCountdownTimer =
    setInterval(
      function(){

        atsSeconds--;


        if(
          atsSeconds < 0
        ){

          atsSeconds = 0;

        }


        document.getElementById(
          "atsTimer"
        ).textContent =
          "自動終了まで " +
          atsSeconds +
          " 秒";


        if(
          atsSeconds <= 0
        ){

          releaseATS();

        }

      },
      1000
    );


  clearTimeout(
    atsTimer
  );


  atsTimer =
    setTimeout(
      function(){

        releaseATS();

      },
      60000
    );

}


/* =====================================================
   ATS RELEASE
===================================================== */

function releaseATS(){

  if(
    !atsActive
  ){

    return;

  }


  /*
   * ATS状態解除
   */

  atsActive =
    false;


  clearTimeout(
    atsTimer
  );

  clearInterval(
    atsCountdownTimer
  );


  atsTimer = null;

  atsCountdownTimer = null;


  /*
   * ジリリリ停止
   */

  stopAlarm();


  if(
    navigator.vibrate
  ){

    navigator.vibrate(0);

  }


  /*
   * ATS画面消す
   */

  document.getElementById(
    "ats"
  ).style.display =
    "none";


  /*
   * 終了ボタン復活
   */

  document.getElementById(
    "finishButton"
  ).style.display =
    "block";


  /*
   * 重要：
   *
   * 到着ATS解除後に
   * まだ30m以内なら
   * キンコンを鳴らさない
   *
   * 30mを超えてから鳴る
   */

  if(
    !canStopBell()
  ){

    startBell();

  }

}


/* =====================================================
   SLIDER
===================================================== */

const sliderButton =
  document.getElementById(
    "sliderButton"
  );


sliderButton.addEventListener(
  "touchstart",
  function(e){

    if(
      !atsActive
    ){

      return;

    }


    startX =
      e.touches[0].clientX;

  }
);


sliderButton.addEventListener(
  "touchmove",
  function(e){

    if(
      !atsActive
    ){

      return;

    }


    const x =
      e.touches[0].clientX;


    sliderX =
      x - startX;


    if(
      sliderX < 0
    ){

      sliderX = 0;

    }


    const slider =
      sliderButton.parentElement;


    const max =
      slider.clientWidth -
      sliderButton.clientWidth -
      10;


    if(
      sliderX > max
    ){

      sliderX = max;

    }


    sliderButton.style.transform =
      "translateX(" +
      sliderX +
      "px)";

  }
);


sliderButton.addEventListener(
  "touchend",
  function(){

    if(
      !atsActive
    ){

      return;

    }


    const slider =
      sliderButton.parentElement;


    const max =
      slider.clientWidth -
      sliderButton.clientWidth -
      10;


    if(
      sliderX >=
      max * .7
    ){

      releaseATS();


      sliderButton.style.transform =
        "translateX(0)";

      sliderX = 0;

    }else{

      sliderButton.style.transform =
        "translateX(0)";

      sliderX = 0;

    }

  }
);


/* =====================================================
   FINISH
===================================================== */

function finishDrive(){

  /*
   * ATS中は終了不可
   */

  if(
    atsActive
  ){

    return;

  }


  if(
    !confirm(
      "運転を終了しますか？"
    )
  ){

    return;

  }


  stopAlarm();

  stopBell();


  clearTimeout(
    atsTimer
  );

  clearInterval(
    atsCountdownTimer
  );


  if(
    watchID !== null
  ){

    navigator.geolocation.clearWatch(
      watchID
    );

    watchID = null;

  }


  /*
   * MARKERS
   */

  viaMarkers.forEach(
    function(marker){

      if(map){

        map.removeLayer(
          marker
        );

      }

    }
  );


  if(
    destinationMarker &&
    map
  ){

    map.removeLayer(
      destinationMarker
    );

  }


  if(
    currentMarker &&
    map
  ){

    map.removeLayer(
      currentMarker
    );

  }


  /*
   * RESET
   */

  destination = null;

  destinationMarker = null;

  viaPoints = [];

  viaMarkers = [];

  currentViaIndex = 0;

  atsActive = false;

  atsType = "";

  destinationATSUsed = false;

  viaATSUsed = new Set();

  overspeedATSUsed = false;

  mode = "destination";

  currentSpeed = 0;


  /*
   * RESET UI
   */

  document.getElementById(
    "drive"
  ).style.display =
    "none";


  document.getElementById(
    "setup"
  ).style.display =
    "block";


  document.getElementById(
    "routePanel"
  ).style.display =
    "none";


  document.getElementById(
    "speed"
  ).textContent =
    "0";


  document.getElementById(
    "overspeed"
  ).style.display =
    "none";


  document.getElementById(
    "ats"
  ).style.display =
    "none";


  document.getElementById(
    "finishButton"
  ).style.display =
    "block";


  sliderButton.style.transform =
    "translateX(0)";

  sliderX = 0;

}

</script>
