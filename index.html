<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>cycletrain</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #080b10;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont,
               "Helvetica Neue", sans-serif;
  overflow: hidden;
}


/* =========================
   設定画面
========================= */

#setup {
  height: 100vh;
  padding: 30px 22px;
  overflow-y: auto;
}

.logo {
  text-align: center;
  font-size: 32px;
  font-weight: 800;
  margin: 25px 0 40px;
}

label {
  display: block;
  color: #aaa;
  margin: 20px 0 8px;
}

select,
input {
  width: 100%;
  height: 55px;
  padding: 0 15px;

  border-radius: 15px;
  border: 1px solid #363d48;

  background: #171c24;
  color: white;

  font-size: 18px;
  outline: none;
}

.startButton,
.addButton {
  width: 100%;
  height: 56px;

  margin-top: 18px;

  border: none;
  border-radius: 16px;

  color: white;
  font-size: 18px;
  font-weight: bold;
}

.startButton {
  background: #238636;
}

.addButton {
  background: #303740;
}

.routeList {
  margin-top: 15px;
}

.routeItem {
  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 10px 12px;
  margin-bottom: 8px;

  background: #171c24;
  border-radius: 12px;

  font-size: 15px;
}

.routeNumber {
  color: #aaa;
  margin-right: 8px;
}

.removeButton {
  border: none;
  background: #522;
  color: white;
  border-radius: 8px;
  padding: 7px 10px;
}


/* =========================
   運転画面
========================= */

#drive {
  display: none;
  height: 100vh;
  position: relative;
}


/* 幕 */

#board {
  height: 75px;

  background: #050505;
  border-bottom: 3px solid #30343a;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 24px;
  font-weight: 800;

  white-space: nowrap;
  overflow: hidden;
}


/* =========================
   地図
========================= */

#map {
  width: 100%;
  height: calc(100vh - 275px);
}


/* =========================
   距離
========================= */

#distanceBox {
  position: absolute;

  top: 85px;
  left: 10px;

  z-index: 1000;

  padding: 9px 12px;

  border-radius: 10px;

  background: rgba(0,0,0,.78);

  font-size: 14px;
}


/* =========================
   速度
========================= */

#speedBox {
  position: absolute;

  bottom: 115px;
  left: 0;

  width: 100%;

  text-align: center;

  z-index: 1000;

  pointer-events: none;
}

#speed {
  font-size: 52px;
  font-weight: 800;
}

.kmh {
  color: #aaa;
  font-size: 15px;
}


/* =========================
   終了ボタン
========================= */

#finishButton {
  position: absolute;

  left: 20px;
  bottom: 20px;

  width: calc(100% - 40px);
  height: 65px;

  border: none;
  border-radius: 18px;

  background: #252b34;
  color: white;

  font-size: 20px;
  font-weight: bold;

  z-index: 2000;
}


/* =========================
   ATS
========================= */

#ats {
  display: none;

  position: absolute;

  left: 20px;
  bottom: 20px;

  width: calc(100% - 40px);

  z-index: 3000;
}

.atsWarning {
  text-align: center;

  color: #ff453a;

  font-size: 18px;
  font-weight: bold;

  margin-bottom: 8px;
}

.slider {
  position: relative;

  height: 65px;

  border-radius: 18px;

  background: #252b34;

  overflow: hidden;

  touch-action: none;
}

.sliderText {
  position: absolute;

  width: 100%;
  height: 100%;

  display: flex;
  align-items: center;
  justify-content: center;

  color: #aaa;

  font-size: 18px;
}

.sliderButton {
  position: absolute;

  left: 5px;
  top: 5px;

  width: 55px;
  height: 55px;

  border-radius: 15px;

  background: #ff453a;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 25px;

  z-index: 10;

  touch-action: none;
}

</style>

</head>


<body>


<!-- =====================================================
     設定画面
===================================================== -->

<div id="setup">

  <div class="logo">
    🚲 cycletrain
  </div>


  <label>
    種別
  </label>

  <select id="type">

    <option>普通</option>
    <option>快速</option>
    <option>急行</option>
    <option>特急</option>
    <option>新快速</option>

  </select>


  <label>
    行き先
  </label>

  <input
    id="destinationName"
    type="text"
    placeholder="例：別府駅"
  >


  <button
    class="addButton"
    onclick="startRouteSetting()"
  >
    📍 経由地点を地図で設定
  </button>


  <div
    id="routeList"
    class="routeList"
  >
  </div>


  <button
    class="startButton"
    onclick="startDrive()"
  >
    🚃 運転開始
  </button>

</div>


<!-- =====================================================
     運転画面
===================================================== -->

<div id="drive">


  <div id="board">
    快速・別府駅行き
  </div>


  <div id="distanceBox">
    📍 GPS待機中
  </div>


  <div id="map"></div>


  <div id="speedBox">

    <div id="speed">
      0
    </div>

    <div class="kmh">
      km/h
    </div>

  </div>


  <button
    id="finishButton"
    onclick="finishDrive()"
  >
    運転終了
  </button>


  <!-- ATS -->

  <div id="ats">

    <div class="atsWarning">
      ⚠️ ATS作動
    </div>

    <div class="slider">

      <div class="sliderText">
        スライドで解除
      </div>

      <div
        class="sliderButton"
        id="sliderButton"
      >
        →
      </div>

    </div>

  </div>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =====================================================
   変数
===================================================== */

let map = null;

let currentMarker = null;

let routeMarkers = [];

let routePoints = [];

let currentRouteIndex = 0;

let watchID = null;

let atsActive = false;

let atsTriggered = false;

let startX = 0;

let sliderX = 0;


/* 音 */

let audioContext = null;

let alarmOscillator = null;

let alarmGain = null;

let bellTimer = null;


/* =====================================================
   音声準備
===================================================== */

function prepareAudio() {

  if (!audioContext) {

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  if (audioContext.state === "suspended") {

    audioContext.resume();

  }

}


/* =====================================================
   ジリリリリ開始
===================================================== */

function startAlarm() {

  prepareAudio();

  stopAlarm();


  alarmOscillator =
    audioContext.createOscillator();

  alarmGain =
    audioContext.createGain();


  alarmOscillator.type =
    "square";

  alarmOscillator.frequency.value =
    700;

  alarmGain.gain.value =
    0.12;


  alarmOscillator.connect(
    alarmGain
  );

  alarmGain.connect(
    audioContext.destination
  );


  alarmOscillator.start();

}


/* =====================================================
   ジリリリリ停止
===================================================== */

function stopAlarm() {

  if (alarmOscillator) {

    try {

      alarmOscillator.stop();

    } catch (e) {}

    alarmOscillator.disconnect();

    alarmOscillator = null;

  }


  if (alarmGain) {

    alarmGain.disconnect();

    alarmGain = null;

  }

}


/* =====================================================
   キンコン
===================================================== */

function playBell() {

  prepareAudio();


  const now =
    audioContext.currentTime;


  /* キン */

  const osc1 =
    audioContext.createOscillator();

  const gain1 =
    audioContext.createGain();


  osc1.type =
    "sine";

  osc1.frequency.value =
    880;


  gain1.gain.setValueAtTime(
    0.16,
    now
  );

  gain1.gain.exponentialRampToValueAtTime(
    0.001,
    now + 0.14
  );


  osc1.connect(gain1);

  gain1.connect(
    audioContext.destination
  );


  osc1.start(now);

  osc1.stop(
    now + 0.14
  );


  /* コン */

  setTimeout(function() {

    if (!audioContext) return;


    const now2 =
      audioContext.currentTime;


    const osc2 =
      audioContext.createOscillator();

    const gain2 =
      audioContext.createGain();


    osc2.type =
      "sine";

    osc2.frequency.value =
      660;


    gain2.gain.setValueAtTime(
      0.16,
      now2
    );

    gain2.gain.exponentialRampToValueAtTime(
      0.001,
      now2 + 0.16
    );


    osc2.connect(gain2);

    gain2.connect(
      audioContext.destination
    );


    osc2.start(now2);

    osc2.stop(
      now2 + 0.16
    );

  }, 140);

}


/* =====================================================
   キンコン開始
   700ms間隔
===================================================== */

function startBell() {

  stopBell();

  playBell();


  bellTimer =
    setInterval(function() {

      playBell();

    }, 700);

}


/* =====================================================
   キンコン停止
===================================================== */

function stopBell() {

  if (bellTimer !== null) {

    clearInterval(
      bellTimer
    );

    bellTimer = null;

  }

}


/* =====================================================
   経由地点設定開始
===================================================== */

function startRouteSetting() {

  alert(
    "運転開始後の地図をタップすると、経由地点を追加できます。"
  );

}


/* =====================================================
   運転開始
===================================================== */

function startDrive() {

  const type =
    document.getElementById(
      "type"
    ).value;


  const destinationName =
    document.getElementById(
      "destinationName"
    ).value.trim();


  if (!destinationName) {

    alert(
      "行き先を入力してください"
    );

    return;

  }


  prepareAudio();


  document.getElementById(
    "board"
  ).textContent =
    type +
    "・" +
    destinationName +
    "行き";


  document.getElementById(
    "setup"
  ).style.display =
    "none";


  document.getElementById(
    "drive"
  ).style.display =
    "block";


  currentRouteIndex = 0;

  atsTriggered = false;


  setTimeout(function() {

    initMap();

  }, 100);

}


/* =====================================================
   地図初期化
===================================================== */

function initMap() {

  if (map) {

    map.invalidateSize();

    return;

  }


  map =
    L.map("map");


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {

      maxZoom: 19,

      attribution:
        "&copy; OpenStreetMap contributors"

    }
  ).addTo(map);


  /*
   * GPS取得
   */

  if (
    navigator.geolocation
  ) {

    navigator.geolocation.getCurrentPosition(

      function(position) {

        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;


        map.setView(
          [lat, lng],
          17
        );


        currentMarker =
          L.marker(
            [lat, lng]
          )
          .addTo(map)
          .bindPopup(
            "🚲 現在地"
          );


        startGPS();

      },


      function() {

        map.setView(
          [35.681236, 139.767125],
          13
        );


        document.getElementById(
          "distanceBox"
        ).textContent =
          "📍 GPSを許可してください";

      },


      {

        enableHighAccuracy: true,

        timeout: 10000,

        maximumAge: 1000

      }

    );

  }


  /*
   * 地図タップ
   */

  map.on(
    "click",
    function(e) {

      addRoutePoint(
        e.latlng.lat,
        e.latlng.lng
      );

    }
  );

}


/* =====================================================
   経由地点追加
===================================================== */

function addRoutePoint(
  lat,
  lng
) {

  const point =
    L.latLng(
      lat,
      lng
    );


  routePoints.push(point);


  const number =
    routePoints.length;


  const marker =
    L.marker(
      [lat, lng]
    )
    .addTo(map)
    .bindPopup(
      "📍 経由地点 " +
      number
    );


  routeMarkers.push(
    marker
  );


  updateRouteInfo();


  marker.openPopup();

}


/* =====================================================
   経由地点情報
===================================================== */

function updateRouteInfo() {

  if (routePoints.length === 0) {

    document.getElementById(
      "distanceBox"
    ).textContent =
      "📍 地図をタップして経由地点を追加";

    return;

  }


  document.getElementById(
    "distanceBox"
  ).textContent =
    "📍 経由地点 " +
    routePoints.length +
    "か所設定済み";

}


/* =====================================================
   GPS
===================================================== */

function startGPS() {

  if (watchID !== null) {

    navigator.geolocation.clearWatch(
      watchID
    );

  }


  watchID =
    navigator.geolocation.watchPosition(

      function(position) {

        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;


        let speed =
          position.coords.speed;


        if (
          speed === null ||
          speed < 0
        ) {

          speed = 0;

        }


        speed =
          speed * 3.6;


        document.getElementById(
          "speed"
        ).textContent =
          Math.round(speed);


        /*
         * 現在地更新
         */

        if (currentMarker) {

          currentMarker.setLatLng(
            [lat, lng]
          );

        }


        /*
         * 次の経由地点
         */

        if (
          routePoints.length === 0
        ) {

          document.getElementById(
            "distanceBox"
          ).textContent =
            "📍 経由地点を地図から設定";

          return;

        }


        if (
          currentRouteIndex >=
          routePoints.length
        ) {

          return;

        }


        const current =
          L.latLng(
            lat,
            lng
          );


        const target =
          routePoints[
            currentRouteIndex
          ];


        const distance =
          current.distanceTo(
            target
          );


        /*
         * 距離表示
         */

        if (distance >= 1000) {

          document.getElementById(
            "distanceBox"
          ).textContent =
            "📍 次の地点まで " +
            (distance / 1000)
              .toFixed(2) +
            " km";

        } else {

          document.getElementById(
            "distanceBox"
          ).textContent =
            "📍 次の地点まで " +
            Math.round(distance) +
            " m";

        }


        /*
         * 100m以内
         *
         * 経由地点通過
         */

        if (
          distance <= 100
        ) {

          currentRouteIndex++;


          if (
            currentRouteIndex <
            routePoints.length
          ) {

            document.getElementById(
              "distanceBox"
            ).textContent =
              "✅ 経由地点通過！ " +
              "次の地点へ";

          } else {

            /*
             * 最後の地点
             *
             * 200m以内でATS
             */

            if (
              !atsTriggered &&
              !atsActive
            ) {

              atsTriggered = true;

              activateATS();

            }

          }

        }

      },


      function() {

        document.getElementById(
          "distanceBox"
        ).textContent =
          "📍 GPS取得失敗";

      },


      {

        enableHighAccuracy: true,

        maximumAge: 1000,

        timeout: 10000

      }

    );

}


/* =====================================================
   ATS作動
===================================================== */

function activateATS() {

  if (atsActive) {

    return;

  }


  atsActive = true;


  document.getElementById(
    "finishButton"
  ).style.display =
    "none";


  document.getElementById(
    "ats"
  ).style.display =
    "block";


  /*
   * ジリリリリ
   */

  startAlarm();


  /*
   * 振動
   */

  if (
    navigator.vibrate
  ) {

    navigator.vibrate(
      [300, 200]
    );

  }

}


/* =====================================================
   ATS解除
===================================================== */

function releaseATS() {

  if (!atsActive) {

    return;

  }


  atsActive = false;


  /*
   * ジリリ停止
   */

  stopAlarm();


  /*
   * 振動停止
   */

  if (
    navigator.vibrate
  ) {

    navigator.vibrate(0);

  }


  document.getElementById(
    "ats"
  ).style.display =
    "none";


  document.getElementById(
    "finishButton"
  ).style.display =
    "block";


  /*
   * キンコン開始
   */

  startBell();

}


/* =====================================================
   スライド開始
===================================================== */

const sliderButton =
  document.getElementById(
    "sliderButton"
  );


sliderButton.addEventListener(
  "touchstart",
  function(e) {

    if (!atsActive) {

      return;

    }


    startX =
      e.touches[0].clientX;

  }
);


/* =====================================================
   スライド中
===================================================== */

sliderButton.addEventListener(
  "touchmove",
  function(e) {

    if (!atsActive) {

      return;

    }


    const currentX =
      e.touches[0].clientX;


    sliderX =
      currentX - startX;


    if (sliderX < 0) {

      sliderX = 0;

    }


    if (sliderX > 250) {

      sliderX = 250;

    }


    sliderButton.style.transform =
      "translateX(" +
      sliderX +
      "px)";

  }
);


/* =====================================================
   スライド終了
===================================================== */

sliderButton.addEventListener(
  "touchend",
  function() {

    if (!atsActive) {

      return;

    }


    if (sliderX >= 190) {

      releaseATS();


      sliderButton.style.transform =
        "translateX(250px)";


      setTimeout(function() {

        sliderButton.style.transform =
          "translateX(0)";

        sliderX = 0;

      }, 250);

    } else {

      sliderButton.style.transform =
        "translateX(0)";

      sliderX = 0;

    }

  }
);


/* =====================================================
   運転終了
===================================================== */

function finishDrive() {

  if (atsActive) {

    return;

  }


  if (
    !confirm(
      "運転を終了しますか？"
    )
  ) {

    return;

  }


  /*
   * 音停止
   */

  stopAlarm();

  stopBell();


  /*
   * 振動停止
   */

  if (
    navigator.vibrate
  ) {

    navigator.vibrate(0);

  }


  /*
   * GPS停止
   */

  if (watchID !== null) {

    navigator.geolocation.clearWatch(
      watchID
    );

    watchID = null;

  }


  /*
   * 画面を戻す
   */

  document.getElementById(
    "drive"
  ).style.display =
    "none";


  document.getElementById(
    "setup"
  ).style.display =
    "block";


  /*
   * リセット
   */

  atsActive = false;

  atsTriggered = false;

  currentRouteIndex = 0;

  routePoints = [];


  /*
   * マーカー削除
   */

  routeMarkers.forEach(
    function(marker) {

      if (map) {

        map.removeLayer(
          marker
        );

      }

    }
  );


  routeMarkers = [];


  if (destinationMarker) {

    destinationMarker = null;

  }


  document.getElementById(
    "speed"
  ).textContent =
    "0";

}

</script>

</body>
</html>
