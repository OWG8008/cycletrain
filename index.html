<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>cycletrain</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{

  background:
    radial-gradient(
      circle at 20% 0%,
      rgba(255,255,255,.10),
      transparent 35%
    ),
    radial-gradient(
      circle at 100% 100%,
      rgba(255,140,40,.08),
      transparent 35%
    ),
    #08090c;

  color:white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    sans-serif;
}


/* =====================================================
   設定画面
===================================================== */

#setup{

  width:100%;
  height:100vh;

  padding:
    25px 20px
    calc(25px + env(safe-area-inset-bottom));

  overflow-y:auto;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(255,255,255,.10),
      transparent 45%
    );
}

.logo{

  text-align:center;

  font-size:34px;

  font-weight:850;

  letter-spacing:-1.5px;

  margin:
    30px 0 32px;
}


.setupDescription{

  text-align:center;

  color:rgba(255,255,255,.50);

  font-size:13px;

  line-height:1.6;

  margin-bottom:24px;
}


label{

  display:block;

  color:
    rgba(255,255,255,.60);

  margin:
    18px 4px 8px;

  font-size:14px;

  font-weight:600;
}


input,
select{

  width:100%;

  height:58px;

  padding:
    0 17px;

  border-radius:21px;

  border:
    1px solid
    rgba(255,255,255,.14);

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.12),
      rgba(255,255,255,.045)
    );

  color:white;

  font-size:18px;

  outline:none;

  backdrop-filter:
    blur(25px)
    saturate(160%);

  -webkit-backdrop-filter:
    blur(25px)
    saturate(160%);

  box-shadow:
    0 8px 28px
    rgba(0,0,0,.20),

    inset 0 1px 0
    rgba(255,255,255,.10);
}


select option{

  background:#17191e;

  color:white;
}


/* =====================================================
   経由地入力
===================================================== */

.viaSetup{

  margin-top:10px;

  padding:15px;

  border-radius:25px;

  background:
    rgba(255,255,255,.045);

  border:
    1px solid
    rgba(255,255,255,.10);

  backdrop-filter:
    blur(25px);

  -webkit-backdrop-filter:
    blur(25px);
}


.viaRow{

  display:flex;

  gap:8px;

  margin-bottom:9px;
}


.viaRow input{

  flex:1;

  min-width:0;
}


.removeVia{

  width:52px;

  flex:none;

  border:0;

  border-radius:18px;

  background:
    rgba(255,69,58,.18);

  color:#ff453a;

  font-size:20px;

  font-weight:bold;
}


.addVia{

  width:100%;

  height:50px;

  border:0;

  border-radius:18px;

  background:
    rgba(255,255,255,.08);

  color:white;

  font-size:15px;

  font-weight:700;
}


/* =====================================================
   速度
===================================================== */

.speedSetting{

  display:flex;

  align-items:center;

  gap:10px;
}


.speedSetting input{

  flex:1;
}


.speedUnit{

  color:
    rgba(255,255,255,.55);

  font-size:15px;
}


/* =====================================================
   開始ボタン
===================================================== */

.startButton{

  width:100%;

  height:64px;

  margin-top:28px;

  border:0;

  border-radius:24px;

  background:
    linear-gradient(
      180deg,
      #4aa3ff,
      #1478e8
    );

  color:white;

  font-size:19px;

  font-weight:800;

  box-shadow:
    0 12px 35px
    rgba(20,120,232,.30),

    inset 0 1px 0
    rgba(255,255,255,.35);

  transition:
    transform .15s,
    filter .15s;
}


.startButton:active{

  transform:scale(.97);

  filter:brightness(.90);
}


/* =====================================================
   運転画面
===================================================== */

#drive{

  display:none;

  width:100%;
  height:100vh;

  position:relative;

  overflow:hidden;
}


/* =====================================================
   幕
===================================================== */

#board{

  position:absolute;

  top:
    calc(8px + env(safe-area-inset-top));

  left:10px;
  right:10px;

  height:68px;

  z-index:3000;

  border-radius:28px;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:0 18px;

  font-size:22px;

  font-weight:850;

  letter-spacing:-.5px;

  white-space:nowrap;

  overflow:hidden;

  background:
    linear-gradient(
      135deg,
      rgba(0,0,0,.78),
      rgba(25,25,28,.52)
    );

  border:
    1px solid
    rgba(255,255,255,.18);

  box-shadow:
    0 14px 40px
    rgba(0,0,0,.45),

    inset 0 1px 0
    rgba(255,255,255,.16),

    inset 0 -1px 0
    rgba(0,0,0,.25);

  backdrop-filter:
    blur(35px)
    saturate(180%);

  -webkit-backdrop-filter:
    blur(35px)
    saturate(180%);
}


/* =====================================================
   幕の流れる文字
===================================================== */

#nextMessage{

  position:absolute;

  top:
    calc(78px + env(safe-area-inset-top));

  left:0;

  width:100%;

  height:31px;

  z-index:2990;

  overflow:hidden;

  pointer-events:none;

  text-align:left;
}


.nextMessageText{

  display:inline-block;

  white-space:nowrap;

  padding-left:100%;

  font-size:14px;

  font-weight:700;

  color:
    rgba(255,255,255,.82);

  animation:
    nextScroll 9s linear infinite;

  text-shadow:
    0 2px 8px
    rgba(0,0,0,.6);
}


@keyframes nextScroll{

  from{
    transform:translateX(0);
  }

  to{
    transform:translateX(-100%);
  }

}


/* =====================================================
   種別カラー
===================================================== */

.board-normal{

  color:#ffffff;

}


.board-shinkaisoku{

  color:#4da3ff;

}


.board-other{

  color:#ff453a;

}


/* =====================================================
   MAP
===================================================== */

#map{

  width:100%;
  height:100%;

  background:#dfe5e9;
}


.leaflet-control-zoom{

  border:0 !important;

  margin:
    95px 12px 0 0 !important;
}


.leaflet-control-zoom a{

  width:43px !important;

  height:43px !important;

  line-height:43px !important;

  border:0 !important;

  color:#222 !important;

  background:
    rgba(255,255,255,.82) !important;

  backdrop-filter:
    blur(20px);

  -webkit-backdrop-filter:
    blur(20px);

  box-shadow:
    0 5px 20px
    rgba(0,0,0,.18);
}


.leaflet-control-zoom a:first-child{

  border-radius:
    15px 15px 6px 6px !important;
}


.leaflet-control-zoom a:last-child{

  border-radius:
    6px 6px 15px 15px !important;
}


/* =====================================================
   距離
===================================================== */

#distanceBox{

  position:absolute;

  top:
    calc(88px + env(safe-area-inset-top));

  left:10px;

  z-index:2000;

  padding:
    10px 14px;

  border-radius:19px;

  background:
    rgba(0,0,0,.72);

  border:
    1px solid
    rgba(255,255,255,.13);

  box-shadow:
    0 9px 28px
    rgba(0,0,0,.28);

  backdrop-filter:
    blur(25px);

  -webkit-backdrop-filter:
    blur(25px);

  font-size:13px;
}


/* =====================================================
   制限速度
===================================================== */

#limitBox{

  position:absolute;

  top:
    calc(88px + env(safe-area-inset-top));

  right:10px;

  z-index:2000;

  padding:
    10px 14px;

  border-radius:19px;

  background:
    rgba(0,0,0,.72);

  border:
    1px solid
    rgba(255,255,255,.13);

  box-shadow:
    0 9px 28px
    rgba(0,0,0,.28);

  backdrop-filter:
    blur(25px);

  -webkit-backdrop-filter:
    blur(25px);

  font-size:13px;
}


/* =====================================================
   追従
===================================================== */

#followBox{

  position:absolute;

  top:
    calc(130px + env(safe-area-inset-top));

  left:10px;

  z-index:2100;

  padding:
    8px 10px;

  border-radius:18px;

  background:
    rgba(0,0,0,.68);

  border:
    1px solid
    rgba(255,255,255,.12);

  backdrop-filter:
    blur(22px);

  -webkit-backdrop-filter:
    blur(22px);

  font-size:13px;

  display:flex;

  align-items:center;

  gap:7px;
}


#followSwitch{

  width:45px;
  height:25px;

  appearance:none;

  background:
    rgba(255,255,255,.25);

  border-radius:20px;

  position:relative;

  outline:none;

  padding:0;

  border:0;
}


#followSwitch:checked{

  background:#238636;
}


#followSwitch::after{

  content:"";

  position:absolute;

  width:21px;
  height:21px;

  top:2px;
  left:2px;

  background:white;

  border-radius:50%;

  transition:.2s;

  box-shadow:
    0 2px 5px
    rgba(0,0,0,.25);
}


#followSwitch:checked::after{

  transform:
    translateX(20px);
}


/* =====================================================
   モード
===================================================== */

#modeBox{

  position:absolute;

  top:
    calc(130px + env(safe-area-inset-top));

  right:10px;

  z-index:2100;

  padding:
    9px 12px;

  border-radius:18px;

  background:
    rgba(0,0,0,.68);

  border:
    1px solid
    rgba(255,255,255,.12);

  backdrop-filter:
    blur(22px);

  -webkit-backdrop-filter:
    blur(22px);

  font-size:13px;
}


/* =====================================================
   地点一覧
===================================================== */

#routeButton{

  position:absolute;

  top:
    calc(171px + env(safe-area-inset-top));

  right:10px;

  z-index:2100;

  border:
    1px solid
    rgba(255,255,255,.12);

  border-radius:18px;

  background:
    rgba(0,0,0,.68);

  color:white;

  padding:
    10px 13px;

  font-size:13px;

  backdrop-filter:
    blur(22px);

  -webkit-backdrop-filter:
    blur(22px);
}


#routePanel{

  display:none;

  position:absolute;

  top:
    calc(215px + env(safe-area-inset-top));

  right:10px;

  width:250px;

  max-height:320px;

  overflow-y:auto;

  z-index:2500;

  padding:10px;

  background:
    rgba(10,12,16,.80);

  border:
    1px solid
    rgba(255,255,255,.14);

  border-radius:25px;

  box-shadow:
    0 18px 50px
    rgba(0,0,0,.50);

  backdrop-filter:
    blur(32px)
    saturate(160%);

  -webkit-backdrop-filter:
    blur(32px)
    saturate(160%);
}


.routeTitle{

  color:
    rgba(255,255,255,.55);

  font-size:13px;

  padding:
    5px 7px 9px;
}


.routeItem{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:5px;

  padding:10px;

  margin-bottom:7px;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid
    rgba(255,255,255,.07);

  border-radius:16px;

  font-size:13px;
}


.deleteRoute{

  border:0;

  border-radius:11px;

  background:
    rgba(255,69,58,.75);

  color:white;

  padding:
    6px 8px;
}


/* =====================================================
   速度
===================================================== */

#speedBox{

  position:absolute;

  bottom:
    calc(115px + env(safe-area-inset-bottom));

  left:0;

  width:100%;

  text-align:center;

  z-index:2000;

  pointer-events:none;
}


#speed{

  font-size:55px;

  font-weight:850;

  letter-spacing:-2px;

  text-shadow:
    0 4px 20px
    rgba(0,0,0,.5);
}


.kmh{

  color:
    rgba(255,255,255,.55);

  font-size:14px;
}


/* =====================================================
   速度超過
===================================================== */

#overspeed{

  display:none;

  position:absolute;

  bottom:
    calc(180px + env(safe-area-inset-bottom));

  left:0;

  width:100%;

  text-align:center;

  z-index:2600;

  color:#ff453a;

  font-size:19px;

  font-weight:bold;

  text-shadow:
    0 3px 15px
    rgba(0,0,0,.6);
}


/* =====================================================
   終了
===================================================== */

#finishButton{

  position:absolute;

  left:20px;

  bottom:
    calc(20px + env(safe-area-inset-bottom));

  width:
    calc(100% - 40px);

  height:62px;

  border:
    1px solid
    rgba(255,255,255,.13);

  border-radius:25px;

  background:
    rgba(0,0,0,.72);

  color:white;

  font-size:19px;

  font-weight:bold;

  z-index:2800;

  box-shadow:
    0 10px 35px
    rgba(0,0,0,.35),

    inset 0 1px 0
    rgba(255,255,255,.1);

  backdrop-filter:
    blur(28px);

  -webkit-backdrop-filter:
    blur(28px);
}


/* =====================================================
   ATS
===================================================== */

#ats{

  display:none;

  position:absolute;

  left:15px;

  bottom:
    calc(15px + env(safe-area-inset-bottom));

  width:
    calc(100% - 30px);

  z-index:4000;

  padding:15px;

  border-radius:30px;

  background:
    linear-gradient(
      135deg,
      rgba(0,0,0,.86),
      rgba(25,25,28,.68)
    );

  border:
    1px solid
    rgba(255,255,255,.16);

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.60),

    inset 0 1px 0
    rgba(255,255,255,.14);

  backdrop-filter:
    blur(35px)
    saturate(170%);

  -webkit-backdrop-filter:
    blur(35px)
    saturate(170%);
}


.atsWarning{

  text-align:center;

  color:#ff453a;

  font-size:19px;

  font-weight:850;

  margin-bottom:7px;
}


.atsTimer{

  text-align:center;

  color:
    rgba(255,255,255,.55);

  font-size:13px;

  margin-bottom:8px;
}


.slider{

  position:relative;

  height:66px;

  border-radius:22px;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid
    rgba(255,255,255,.08);

  overflow:hidden;

  touch-action:none;
}


.sliderText{

  position:absolute;

  width:100%;
  height:100%;

  display:flex;

  align-items:center;

  justify-content:center;

  color:
    rgba(255,255,255,.48);

  font-size:17px;
}


.sliderButton{

  position:absolute;

  left:5px;

  top:5px;

  width:56px;

  height:56px;

  border-radius:19px;

  background:
    linear-gradient(
      180deg,
      #ff7043,
      #e63828
    );

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:25px;

  z-index:10;

  touch-action:none;

  box-shadow:
    0 5px 15px
    rgba(255,69,58,.25),

    inset 0 1px 0
    rgba(255,255,255,.25);
}


/* =====================================================
   現在地
===================================================== */

.current-marker{

  width:18px;
  height:18px;

  border-radius:50%;

  background:#1677ff;

  border:
    3px solid white;

  box-shadow:
    0 0 0 6px
    rgba(22,119,255,.22),

    0 4px 12px
    rgba(0,0,0,.35);
}


/* =====================================================
   スマホ
===================================================== */

@media(max-width:500px){

  #board{

    font-size:21px;
  }

}

</style>

</head>

<body>


<!-- =====================================================
     初期設定
===================================================== -->

<div id="setup">

  <div class="logo">
    🚲 cycletrain
  </div>

  <div class="setupDescription">
    運転開始前に行き先と経由地を設定
  </div>


  <label>
    種別
  </label>

  <select id="type">

    <option>普通</option>
    <option>快速</option>
    <option>急行</option>
    <option>特急</option>
    <option>新快速</option>

  </select>


  <label>
    行き先
  </label>

  <input
    id="destinationName"
    type="text"
    placeholder="例：別府駅"
  >


  <label>
    経由地
  </label>

  <div class="viaSetup">

    <div id="viaInputs"></div>

    <button
      class="addVia"
      onclick="addViaInput()"
    >
      ＋ 経由地を追加
    </button>

  </div>


  <label>
    速度制限
  </label>

  <div class="speedSetting">

    <input
      id="speedLimit"
      type="number"
      min="1"
      max="200"
      value="20"
      inputmode="numeric"
    >

    <div class="speedUnit">
      km/h
    </div>

  </div>


  <button
    class="startButton"
    onclick="startDrive()"
  >
    🚃 運転開始
  </button>

</div>


<!-- =====================================================
     運転画面
===================================================== -->

<div id="drive">

  <div id="board">
    普通
  </div>


  <div id="nextMessage">
    <span
      id="nextMessageText"
      class="nextMessageText"
    >
      次は、目的地
    </span>
  </div>


  <div id="distanceBox">
    📍 目的地を設定してください
  </div>


  <div id="limitBox">
    🚦 制限 20 km/h
  </div>


  <div id="followBox">

    追従

    <input
      id="followSwitch"
      type="checkbox"
      checked
    >

  </div>


  <div id="modeBox">
    🎯 目的地設定
  </div>


  <button
    id="routeButton"
    onclick="toggleRoutePanel()"
  >
    📍 地点一覧
  </button>


  <div id="routePanel">

    <div class="routeTitle">
      設定地点
    </div>

    <div id="routeList"></div>

  </div>


  <div id="map"></div>


  <div id="overspeed">
    ⚠️ 速度超過
  </div>


  <div id="speedBox">

    <div id="speed">
      0
    </div>

    <div class="kmh">
      km/h
    </div>

  </div>


  <button
    id="finishButton"
    onclick="finishDrive()"
  >
    運転終了
  </button>


  <!-- ATS -->

  <div id="ats">

    <div
      id="atsText"
      class="atsWarning"
    >
      ⚠️ ATS作動
    </div>

    <div
      id="atsTimer"
      class="atsTimer"
    >
      自動終了まで 60 秒
    </div>

    <div class="slider">

      <div class="sliderText">
        スライドで解除
      </div>

      <div
        class="sliderButton"
        id="sliderButton"
      >
        →
      </div>

    </div>

  </div>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =====================================================
   基本変数
===================================================== */

let map = null;

let currentMarker = null;

let destination = null;

let destinationMarker = null;

let destinationName = "";

let viaPoints = [];

let viaNames = [];

let viaMarkers = [];

let currentViaIndex = 0;

let mode = "destination";

let watchID = null;

let speedLimit = 20;

let currentSpeed = 0;


/* =====================================================
   ATS
===================================================== */

let atsActive = false;

let atsTimer = null;

let atsCountdownTimer = null;

let atsSeconds = 60;

let atsType = "";

let destinationATSUsed = false;

let viaATSUsed = [];

let overspeedATSUsed = false;


/* =====================================================
   キンコン
===================================================== */

let bellTimer = null;

let bellActive = false;


/* =====================================================
   Audio
===================================================== */

let audioContext = null;

let alarmTimeout = null;

let alarmRunning = false;


/* =====================================================
   ATS音用
===================================================== */

function prepareAudio(){

  if(!audioContext){

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }


  if(
    audioContext.state ===
    "suspended"
  ){

    audioContext.resume();

  }

}


/* =====================================================
   ATS音
   iPhone向けにAudioContextを毎回確認
===================================================== */

function playATSPulse(){

  if(!atsActive){

    return;

  }


  prepareAudio();


  if(
    !audioContext ||
    audioContext.state === "suspended"
  ){

    /*
     * iOSでサスペンドされた場合、
     * 次のパルスで再試行
     */

    alarmTimeout =
      setTimeout(
        playATSPulse,
        100
      );

    return;

  }


  const now =
    audioContext.currentTime;


  /*
   * ジリ
   */

  const osc =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();


  osc.type = "square";


  /*
   * JR系警報器っぽい
   * 少し高めの音
   */

  osc.frequency.setValueAtTime(
    760,
    now
  );


  osc.frequency.setValueAtTime(
    880,
    now + 0.075
  );


  osc.frequency.setValueAtTime(
    760,
    now + 0.15
  );


  gain.gain.setValueAtTime(
    0.0001,
    now
  );


  gain.gain.exponentialRampToValueAtTime(
    0.13,
    now + 0.008
  );


  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now + 0.19
  );


  osc.connect(gain);

  gain.connect(
    audioContext.destination
  );


  osc.start(now);

  osc.stop(
    now + 0.20
  );


  /*
   * 次のジリ
   */

  if(atsActive){

    alarmTimeout =
      setTimeout(
        playATSPulse,
        240
      );

  }

}


/* =====================================================
   ATS音開始
===================================================== */

function startAlarm(){

  stopAlarm();

  alarmRunning = true;

  prepareAudio();

  /*
   * 最初の音を即再生
   */

  playATSPulse();

}


/* =====================================================
   ATS音停止
===================================================== */

function stopAlarm(){

  alarmRunning = false;

  if(
    alarmTimeout !== null
  ){

    clearTimeout(
      alarmTimeout
    );

    alarmTimeout = null;

  }

}


/* =====================================================
   キンコン
===================================================== */

function playBell(){

  prepareAudio();

  if(
    !audioContext
  ){

    return;

  }


  const now =
    audioContext.currentTime;


  /*
   * キン
   */

  const osc1 =
    audioContext.createOscillator();

  const gain1 =
    audioContext.createGain();


  osc1.type =
    "sine";

  osc1.frequency.setValueAtTime(
    1046,
    now
  );


  gain1.gain.setValueAtTime(
    0.0001,
    now
  );

  gain1.gain.exponentialRampToValueAtTime(
    0.20,
    now + 0.008
  );

  gain1.gain.exponentialRampToValueAtTime(
    0.001,
    now + 0.30
  );


  osc1.connect(gain1);

  gain1.connect(
    audioContext.destination
  );


  osc1.start(now);

  osc1.stop(
    now + 0.32
  );


  /*
   * コン
   */

  setTimeout(
    function(){

      if(!audioContext){

        return;

      }


      const now2 =
        audioContext.currentTime;


      const osc2 =
        audioContext.createOscillator();

      const gain2 =
        audioContext.createGain();


      osc2.type =
        "sine";

      osc2.frequency.setValueAtTime(
        784,
        now2
      );


      gain2.gain.setValueAtTime(
        0.0001,
        now2
      );

      gain2.gain.exponentialRampToValueAtTime(
        0.18,
        now2 + 0.008
      );

      gain2.gain.exponentialRampToValueAtTime(
        0.001,
        now2 + 0.34
      );


      osc2.connect(gain2);

      gain2.connect(
        audioContext.destination
      );


      osc2.start(now2);

      osc2.stop(
        now2 + 0.36
      );

    },
    135
  );

}


/* =====================================================
   キンコン停止判定
===================================================== */

function canStopBell(){

  if(!currentMarker){

    return false;

  }


  const current =
    currentMarker.getLatLng();


  /*
   * 一番近い未到着経由地
   */

  for(
    let i = currentViaIndex;
    i < viaPoints.length;
    i++
  ){

    if(
      current.distanceTo(
        viaPoints[i]
      ) <= 30
    ){

      return true;

    }

  }


  /*
   * 目的地
   */

  if(destination){

    if(
      current.distanceTo(
        destination
      ) <= 30
    ){

      return true;

    }

  }


  /*
   * 速度ATS
   */

  if(
    atsType === "overspeed" &&
    currentSpeed <= speedLimit - 3
  ){

    return true;

  }


  return false;

}


/* =====================================================
   キンコン開始
===================================================== */

function startBell(){

  stopBell();


  if(
    canStopBell()
  ){

    return;

  }


  bellActive = true;


  playBell();


  bellTimer =
    setInterval(
      function(){

        if(
          canStopBell()
        ){

          stopBell();

          return;

        }


        playBell();

      },
      700
    );

}


/* =====================================================
   キンコン停止
===================================================== */

function stopBell(){

  if(
    bellTimer !== null
  ){

    clearInterval(
      bellTimer
    );

    bellTimer = null;

  }


  bellActive = false;

}

/* =====================================================
   運転開始
===================================================== */

function startDrive(){

  const type =
    document.getElementById(
      "type"
    ).value;


  destinationName =
    document.getElementById(
      "destinationName"
    ).value.trim();


  speedLimit =
    Number(
      document.getElementById(
        "speedLimit"
      ).value
    );


  if(!destinationName){

    alert(
      "行き先名を入力してください"
    );

    return;

  }


  if(
    !speedLimit ||
    speedLimit <= 0
  ){

    alert(
      "速度制限を設定してください"
    );

    return;

  }


  /*
   * 経由地名取得
   */

  viaNames = [];


  document
    .querySelectorAll(
      "#viaInputs input"
    )
    .forEach(
      function(input){

        const name =
          input.value.trim();


        if(name){

          viaNames.push(
            name
          );

        }

      }
    );


  /*
   * iPhoneのユーザー操作中に
   * AudioContextを起動
   */

  prepareAudio();


  /*
   * 幕
   */

  document.getElementById(
    "board"
  ).textContent =
    type +
    "・" +
    destinationName;


  updateBoardColor(
    type
  );


  /*
   * 次は
   */

  updateNextMessage();


  document.getElementById(
    "limitBox"
  ).textContent =
    "🚦 制限 " +
    speedLimit +
    " km/h";


  document.getElementById(
    "setup"
  ).style.display =
    "none";


  document.getElementById(
    "drive"
  ).style.display =
    "block";


  /*
   * リセット
   */

  destination = null;

  destinationMarker = null;

  viaPoints = [];

  viaMarkers = [];

  currentViaIndex = 0;

  mode = "destination";

  destinationATSUsed = false;

  viaATSUsed = [];

  overspeedATSUsed = false;

  updateMode();

  updateRouteList();


  setTimeout(
    initMap,
    100
  );

}


/* =====================================================
   次は表示
===================================================== */

function updateNextMessage(){

  const text =
    document.getElementById(
      "nextMessageText"
    );


  if(
    currentViaIndex <
    viaNames.length
  ){

    text.textContent =
      "次は、" +
      viaNames[
        currentViaIndex
      ];

  }
  else{

    text.textContent =
      "次は、" +
      destinationName;

  }


  /*
   * アニメーションを再起動
   */

  text.style.animation =
    "none";


  void text.offsetWidth;


  text.style.animation =
    "nextScroll 9s linear infinite";

}


/* =====================================================
   地図
===================================================== */

function initMap(){

  if(map){

    map.invalidateSize();

    return;

  }


  map =
    L.map(
      "map",
      {
        zoomControl:true
      }
    );


  L.tileLayer(
    "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
    {

      maxZoom:20,

      attribution:
        "&copy; OpenStreetMap &copy; CARTO",

      subdomains:
        "abcd"

    }
  ).addTo(map);


  if(
    !navigator.geolocation
  ){

    alert(
      "この端末ではGPSを利用できません"
    );

    return;

  }


  navigator.geolocation.getCurrentPosition(

    function(position){

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;


      map.setView(
        [lat,lng],
        17
      );


      createCurrentMarker(
        lat,
        lng
      );


      startGPS();

    },


    function(){

      map.setView(
        [35.681236,139.767125],
        13
      );


      document.getElementById(
        "distanceBox"
      ).textContent =
        "📍 GPSを許可してください";

    },


    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:1000
    }

  );


  map.on(
    "click",
    function(e){

      setPoint(
        e.latlng.lat,
        e.latlng.lng
      );

    }
  );

}


/* =====================================================
   現在地
===================================================== */

function createCurrentMarker(
  lat,
  lng
){

  const icon =
    L.divIcon(
      {
        className:"",
        html:
          '<div class="current-marker"></div>',
        iconSize:
          [18,18],
        iconAnchor:
          [9,9]
      }
    );


  currentMarker =
    L.marker(
      [lat,lng],
      {
        icon:icon
      }
    )
    .addTo(map);

}


/* =====================================================
   地点設定
===================================================== */

function setPoint(
  lat,
  lng
){

  /*
   * 目的地
   */

  if(
    mode === "destination"
  ){

    if(destinationMarker){

      map.removeLayer(
        destinationMarker
      );

    }


    destination =
      L.latLng(
        lat,
        lng
      );


    destinationMarker =
      L.marker(
        [lat,lng]
      )
      .addTo(map)
      .bindPopup(
        "🎯 " +
        destinationName
      );


    /*
     * 次は経由地
     */

    if(
      viaNames.length > 0
    ){

      mode = "via";

    }
    else{

      mode = "destination";

    }


    updateMode();

    updateRouteList();

    updateNextMessage();


    document.getElementById(
      "distanceBox"
    ).textContent =
      "🎯 " +
      destinationName +
      "を設定しました";


    return;

  }


  /*
   * 経由地
   */

  if(
    mode === "via"
  ){

    addViaPoint(
      lat,
      lng
    );

  }

}


/* =====================================================
   経由地点追加
===================================================== */

function addViaPoint(
  lat,
  lng
){

  if(
    viaPoints.length >=
    viaNames.length
  ){

    mode = "destination";

    updateMode();

    return;

  }


  const point =
    L.latLng(
      lat,
      lng
    );


  const index =
    viaPoints.length;


  viaPoints.push(
    point
  );


  viaATSUsed.push(
    false
  );


  const name =
    viaNames[index] ||
    "経由 " +
    (index + 1);


  const marker =
    L.marker(
      [lat,lng]
    )
    .addTo(map)
    .bindPopup(
      "📍 " +
      name
    );


  viaMarkers.push(
    marker
  );


  /*
   * 次の経由地へ
   */

  if(
    viaPoints.length <
    viaNames.length
  ){

    mode = "via";

  }
  else{

    mode = "destination";

  }


  updateMode();

  updateRouteList();

  updateNextMessage();

}


/* =====================================================
   モード
===================================================== */

function updateMode(){

  const box =
    document.getElementById(
      "modeBox"
    );


  if(
    mode === "destination"
  ){

    if(destination){

      box.textContent =
        "🎯 目的地設定";

    }
    else{

      box.textContent =
        "🎯 目的地を地図でタップ";

    }

  }
  else{

    box.textContent =
      "📍 経由地 " +
      (viaPoints.length + 1) +
      " を地図でタップ";

  }

}


/* =====================================================
   地点一覧
===================================================== */

function updateRouteList(){

  const list =
    document.getElementById(
      "routeList"
    );


  list.innerHTML = "";


  /*
   * 目的地
   */

  if(destination){

    const item =
      document.createElement(
        "div"
      );


    item.className =
      "routeItem";


    const text =
      document.createElement(
        "span"
      );


    text.textContent =
      "🎯 " +
      destinationName;


    const button =
      document.createElement(
        "button"
      );


    button.className =
      "deleteRoute";


    button.textContent =
      "削除";


    button.onclick =
      deleteDestination;


    item.appendChild(text);

    item.appendChild(button);

    list.appendChild(item);

  }


  /*
   * 経由地
   */

  viaPoints.forEach(
    function(point,index){

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "routeItem";


      const text =
        document.createElement(
          "span"
        );


      text.textContent =
        "📍 " +
        (
          viaNames[index] ||
          "経由 " +
          (index + 1)
        );


      const button =
        document.createElement(
          "button"
        );


      button.className =
        "deleteRoute";


      button.textContent =
        "削除";


      button.onclick =
        function(){

          deleteViaPoint(
            index
          );

        };


      item.appendChild(text);

      item.appendChild(button);

      list.appendChild(item);

    }
  );

}


/* =====================================================
   目的地削除
===================================================== */

function deleteDestination(){

  if(
    !confirm(
      "目的地を削除しますか？"
    )
  ){

    return;

  }


  if(destinationMarker){

    map.removeLayer(
      destinationMarker
    );

  }


  destination = null;

  destinationMarker = null;

  destinationATSUsed = false;

  mode = "destination";


  updateMode();

  updateRouteList();

  updateNextMessage();


  document.getElementById(
    "distanceBox"
  ).textContent =
    "🎯 新しい目的地を設定してください";

}


/* =====================================================
   経由地削除
===================================================== */

function deleteViaPoint(
  index
){

  if(
    !confirm(
      "この経由地点を削除しますか？"
    )
  ){

    return;

  }


  if(
    viaMarkers[index]
  ){

    map.removeLayer(
      viaMarkers[index]
    );

  }


  viaMarkers.splice(
    index,
    1
  );


  viaPoints.splice(
    index,
    1
  );


  viaATSUsed.splice(
    index,
    1
  );


  /*
   * 最初の未到着地点を再計算
   */

  if(
    currentViaIndex >
    index
  ){

    currentViaIndex--;

  }


  if(
    currentViaIndex >
    viaPoints.length
  ){

    currentViaIndex =
      viaPoints.length;

  }


  /*
   * まだ入力された経由地が
   * 残っているなら設定モード
   */

  if(
    viaPoints.length <
    viaNames.length
  ){

    mode = "via";

  }
  else{

    mode = "destination";

  }


  updateMode();

  updateRouteList();

  updateNextMessage();

}

/* =====================================================
   GPS
===================================================== */

function startGPS(){

  if(
    watchID !== null
  ){

    navigator.geolocation.clearWatch(
      watchID
    );

  }


  watchID =
    navigator.geolocation.watchPosition(

      function(position){

        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;


        /*
         * 速度
         */

        let speed =
          position.coords.speed;


        if(
          speed === null ||
          speed < 0
        ){

          speed = 0;

        }


        speed *= 3.6;

        currentSpeed =
          speed;


        document.getElementById(
          "speed"
        ).textContent =
          Math.round(speed);


        /*
         * 現在地
         */

        if(currentMarker){

          currentMarker.setLatLng(
            [lat,lng]
          );

        }


        /*
         * 地図追従
         */

        const follow =
          document.getElementById(
            "followSwitch"
          ).checked;


        if(
          follow &&
          map
        ){

          map.panTo(
            [lat,lng],
            {
              animate:true,
              duration:.5
            }
          );

        }


        /*
         * 速度ATS
         */

        if(
          speed > speedLimit
        ){

          document.getElementById(
            "overspeed"
          ).style.display =
            "block";


          if(
            !atsActive &&
            !overspeedATSUsed
          ){

            overspeedATSUsed =
              true;


            activateATS(
              "⚠️ 速度超過ATS",
              "overspeed"
            );

          }

        }
        else{

          document.getElementById(
            "overspeed"
          ).style.display =
            "none";

        }


        /*
         * 目的地未設定
         */

        if(
          !destination
        ){

          document.getElementById(
            "distanceBox"
          ).textContent =
            "🎯 目的地を地図でタップ";

          return;

        }


        const current =
          L.latLng(
            lat,
            lng
          );


        /*
         * ============================================
         * 一番近い「未到着」の経由地
         * ============================================
         */

        if(
          currentViaIndex <
          viaPoints.length
        ){

          const via =
            viaPoints[
              currentViaIndex
            ];


          const distance =
            current.distanceTo(
              via
            );


          const viaName =
            viaNames[
              currentViaIndex
            ] ||
            "経由 " +
            (currentViaIndex + 1);


          document.getElementById(
            "distanceBox"
          ).textContent =
            "📍 " +
            viaName +
            "まで " +
            formatDistance(distance);


          /*
           * 100m ATS
           */

          if(
            distance <= 100 &&
            !atsActive &&
            !viaATSUsed[currentViaIndex]
          ){

            viaATSUsed[
              currentViaIndex
            ] = true;


            activateATS(
              "⚠️ " +
              viaName +
              " ATS",
              "via"
            );

          }


          /*
           * 30m到着
           */

          if(
            distance <= 30
          ){

            stopBell();


            /*
             * 次の経由地へ
             */

            currentViaIndex++;


            updateNextMessage();


            /*
             * 次の経由地がある
             */

            if(
              currentViaIndex <
              viaPoints.length
            ){

              const next =
                current.distanceTo(
                  viaPoints[
                    currentViaIndex
                  ]
                );


              document.getElementById(
                "distanceBox"
              ).textContent =
                "📍 " +
                (
                  viaNames[
                    currentViaIndex
                  ] ||
                  "経由 " +
                  (currentViaIndex + 1)
                ) +
                "まで " +
                formatDistance(next);

            }
            else{

              /*
               * 最後の経由地到着
               * ↓
               * 目的地へ
               */

              const destinationDistance =
                current.distanceTo(
                  destination
                );


              document.getElementById(
                "distanceBox"
              ).textContent =
                "🎯 " +
                destinationName +
                "まで " +
                formatDistance(
                  destinationDistance
                );

            }

          }


          return;

        }


        /*
         * ============================================
         * 目的地
         * ============================================
         */

        const distance =
          current.distanceTo(
            destination
          );


        document.getElementById(
          "distanceBox"
        ).textContent =
          "🎯 " +
          destinationName +
          "まで " +
          formatDistance(distance);


        /*
         * 到着ATS
         */

        if(
          distance <= 200 &&
          !atsActive &&
          !destinationATSUsed
        ){

          destinationATSUsed =
            true;


          activateATS(
            "🏁 " +
            destinationName +
            " ATS",
            "destination"
          );

        }


        /*
         * 30m以内
         */

        if(
          distance <= 30
        ){

          stopBell();

        }

      },


      function(){

        document.getElementById(
          "distanceBox"
        ).textContent =
          "📍 GPS取得失敗";

      },


      {
        enableHighAccuracy:true,

        maximumAge:1000,

        timeout:10000

      }

    );

}


/* =====================================================
   距離表示
===================================================== */

function formatDistance(
  distance
){

  if(
    distance >= 1000
  ){

    return (
      (distance / 1000)
        .toFixed(1)
    ) +
    "km";

  }


  return (
    Math.round(distance)
  ) +
  "m";

}


/* =====================================================
   ATS作動
===================================================== */

function activateATS(
  message,
  type
){

  if(
    atsActive
  ){

    return;

  }


  atsActive = true;

  atsType = type;

  atsSeconds = 60;


  /*
   * キンコン停止
   */

  stopBell();


  /*
   * 終了ボタン非表示
   */

  document.getElementById(
    "finishButton"
  ).style.display =
    "none";


  /*
   * ATS表示
   */

  document.getElementById(
    "ats"
  ).style.display =
    "block";


  document.getElementById(
    "atsText"
  ).textContent =
    message;


  document.getElementById(
    "atsTimer"
  ).textContent =
    "自動終了まで 60 秒";


  /*
   * 🔊 ATS音開始
   */

  prepareAudio();

  startAlarm();


  /*
   * バイブ
   */

  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      [300,200,300]
    );

  }


  /*
   * カウントダウン
   */

  clearInterval(
    atsCountdownTimer
  );


  atsCountdownTimer =
    setInterval(
      function(){

        if(
          !atsActive
        ){

          return;

        }


        atsSeconds--;


        document.getElementById(
          "atsTimer"
        ).textContent =
          "自動終了まで " +
          Math.max(
            0,
            atsSeconds
          ) +
          " 秒";


        if(
          atsSeconds <= 0
        ){

          releaseATS();

        }

      },
      1000
    );


  /*
   * 60秒
   */

  clearTimeout(
    atsTimer
  );


  atsTimer =
    setTimeout(
      function(){

        releaseATS();

      },
      60000
    );

}


/* =====================================================
   ATS解除
===================================================== */

function releaseATS(){

  if(
    !atsActive
  ){

    return;

  }


  atsActive = false;


  clearTimeout(
    atsTimer
  );

  clearInterval(
    atsCountdownTimer
  );


  atsTimer = null;

  atsCountdownTimer = null;


  /*
   * ATS音停止
   */

  stopAlarm();


  /*
   * バイブ停止
   */

  if(
    navigator.vibrate
  ){

    navigator.vibrate(0);

  }


  /*
   * ATS画面
   */

  document.getElementById(
    "ats"
  ).style.display =
    "none";


  /*
   * 終了ボタン
   */

  document.getElementById(
    "finishButton"
  ).style.display =
    "block";


  /*
   * ATS解除後
   * 必要ならキンコン再開
   */

  if(
    !canStopBell()
  ){

    startBell();

  }

}


/* =====================================================
   ATSスライダー
===================================================== */

const sliderButton =
  document.getElementById(
    "sliderButton"
  );


let startX = 0;

let sliderX = 0;


sliderButton.addEventListener(
  "touchstart",
  function(e){

    if(
      !atsActive
    ){

      return;

    }


    startX =
      e.touches[0].clientX;

    sliderX = 0;

  },
  {
    passive:true
  }
);


sliderButton.addEventListener(
  "touchmove",
  function(e){

    if(
      !atsActive
    ){

      return;

    }


    const x =
      e.touches[0].clientX;


    sliderX =
      x - startX;


    if(
      sliderX < 0
    ){

      sliderX = 0;

    }


    const slider =
      sliderButton.parentElement;


    const max =
      slider.clientWidth -
      sliderButton.clientWidth -
      10;


    if(
      sliderX > max
    ){

      sliderX = max;

    }


    sliderButton.style.transform =
      "translateX(" +
      sliderX +
      "px)";

  },
  {
    passive:true
  }
);


sliderButton.addEventListener(
  "touchend",
  function(){

    if(
      !atsActive
    ){

      return;

    }


    const slider =
      sliderButton.parentElement;


    const max =
      slider.clientWidth -
      sliderButton.clientWidth -
      10;


    if(
      sliderX >=
      max * 0.7
    ){

      releaseATS();

    }


    sliderButton.style.transform =
      "translateX(0)";


    sliderX = 0;

  }
);


/* =====================================================
   運転終了
===================================================== */

function finishDrive(){

  if(
    atsActive
  ){

    return;

  }


  if(
    !confirm(
      "運転を終了しますか？"
    )
  ){

    return;

  }


  stopAlarm();

  stopBell();


  clearTimeout(
    atsTimer
  );

  clearInterval(
    atsCountdownTimer
  );


  if(
    watchID !== null
  ){

    navigator.geolocation.clearWatch(
      watchID
    );

    watchID = null;

  }


  viaMarkers.forEach(
    function(marker){

      if(map){

        map.removeLayer(
          marker
        );

      }

    }
  );


  if(
    destinationMarker &&
    map
  ){

    map.removeLayer(
      destinationMarker
    );

  }


  if(
    currentMarker &&
    map
  ){

    map.removeLayer(
      currentMarker
    );

  }


  destination = null;

  destinationMarker = null;

  viaPoints = [];

  viaNames = [];

  viaMarkers = [];

  viaATSUsed = [];

  currentViaIndex = 0;

  destinationATSUsed = false;

  overspeedATSUsed = false;

  atsActive = false;

  atsType = "";

  mode = "destination";

  currentSpeed = 0;


  document.getElementById(
    "drive"
  ).style.display =
    "none";


  document.getElementById(
    "setup"
  ).style.display =
    "block";


  document.getElementById(
    "routePanel"
  ).style.display =
    "none";


  document.getElementById(
    "speed"
  ).textContent =
    "0";


  document.getElementById(
    "overspeed"
  ).style.display =
    "none";


  document.getElementById(
    "ats"
  ).style.display =
    "none";


  document.getElementById(
    "viaInputs"
  ).innerHTML =
    "";


  sliderButton.style.transform =
    "translateX(0)";


  sliderX = 0;


  currentMarker = null;

}


/* =====================================================
   ページ終了
===================================================== */

window.addEventListener(
  "beforeunload",
  function(){

    stopAlarm();

    stopBell();

    if(
      watchID !== null &&
      navigator.geolocation
    ){

      navigator.geolocation.clearWatch(
        watchID
      );

    }

  }
);


/* =====================================================
   初期経由地
===================================================== */

addViaInput();

</script>
