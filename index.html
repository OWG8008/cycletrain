<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>cycletrain</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

/* =====================================================
   BASE
===================================================== */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:#eef2f6;
  color:#111;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    sans-serif;
}


/* =====================================================
   LIQUID GLASS 共通
===================================================== */

.glass{
  background:rgba(255,255,255,.62);

  backdrop-filter:
    blur(22px)
    saturate(180%);

  -webkit-backdrop-filter:
    blur(22px)
    saturate(180%);

  border:1px solid rgba(255,255,255,.72);

  box-shadow:
    0 8px 30px rgba(0,0,0,.13),
    inset 0 1px 1px rgba(255,255,255,.8);
}


/* =====================================================
   設定画面
===================================================== */

#setup{
  height:100vh;
  padding:28px 20px;
  overflow-y:auto;

  background:
    radial-gradient(
      circle at 20% 10%,
      rgba(100,160,255,.25),
      transparent 35%
    ),
    radial-gradient(
      circle at 90% 80%,
      rgba(180,120,255,.2),
      transparent 35%
    ),
    #eef2f6;
}

.setupCard{
  max-width:520px;
  margin:0 auto;
}

.logo{
  text-align:center;
  font-size:36px;
  font-weight:900;
  letter-spacing:-1.5px;
  margin:28px 0 40px;

  color:#111;

  text-shadow:
    0 2px 10px rgba(255,255,255,.9);
}

label{
  display:block;
  color:#68717c;
  font-size:14px;
  font-weight:600;
  margin:20px 4px 8px;
}

select,
input{
  width:100%;
  height:58px;

  padding:0 16px;

  border-radius:19px;

  border:1px solid rgba(255,255,255,.8);

  background:rgba(255,255,255,.67);

  color:#111;

  font-size:18px;

  outline:none;

  box-shadow:
    0 5px 20px rgba(0,0,0,.07),
    inset 0 1px 1px rgba(255,255,255,.9);

  backdrop-filter:
    blur(18px)
    saturate(170%);

  -webkit-backdrop-filter:
    blur(18px)
    saturate(170%);
}

select:focus,
input:focus{
  border-color:rgba(0,122,255,.45);
}

.speedSetting{
  display:flex;
  align-items:center;
  gap:10px;
}

.speedSetting input{
  flex:1;
}

.speedUnit{
  color:#777;
  font-size:15px;
}

.startButton{
  width:100%;
  height:62px;

  margin-top:30px;

  border:1px solid rgba(255,255,255,.45);

  border-radius:21px;

  background:
    linear-gradient(
      135deg,
      rgba(45,140,255,.92),
      rgba(0,95,230,.92)
    );

  color:white;

  font-size:19px;
  font-weight:800;

  box-shadow:
    0 10px 25px rgba(0,100,255,.25),
    inset 0 1px 1px rgba(255,255,255,.45);

  backdrop-filter:blur(15px);
}

.startButton:active{
  transform:scale(.98);
}


/* =====================================================
   運転画面
===================================================== */

#drive{
  display:none;

  height:100vh;
  width:100%;

  position:relative;

  background:#e8edf2;
}


/* =====================================================
   マップ
===================================================== */

#map{
  width:100%;
  height:100vh;

  background:#e9edf2;
}


/*
 * 地図をApple Maps風に明るくする
 */

#map .leaflet-tile{
  filter:
    saturate(.72)
    brightness(1.12)
    contrast(.92);

  transition:filter .3s;
}

.leaflet-container{
  background:#e9edf2;
}


/* Leafletコントロール */

.leaflet-control-zoom{
  border:0 !important;

  border-radius:17px !important;

  overflow:hidden;

  background:rgba(255,255,255,.65) !important;

  backdrop-filter:
    blur(20px)
    saturate(180%);

  -webkit-backdrop-filter:
    blur(20px)
    saturate(180%);

  box-shadow:
    0 6px 22px rgba(0,0,0,.16) !important;
}

.leaflet-control-zoom a{
  border:0 !important;

  background:rgba(255,255,255,.35) !important;

  color:#333 !important;
}


/* =====================================================
   上部行先表示
===================================================== */

#board{
  position:absolute;

  top:12px;
  left:50%;

  transform:translateX(-50%);

  z-index:1500;

  min-width:220px;

  height:56px;

  padding:0 24px;

  border-radius:28px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(20,24,30,.72);

  color:white;

  font-size:21px;
  font-weight:850;

  white-space:nowrap;

  overflow:hidden;

  border:1px solid rgba(255,255,255,.3);

  box-shadow:
    0 8px 28px rgba(0,0,0,.18),
    inset 0 1px 1px rgba(255,255,255,.2);

  backdrop-filter:
    blur(24px)
    saturate(180%);

  -webkit-backdrop-filter:
    blur(24px)
    saturate(180%);
}


/* 種別カラー */

#board.normal{
  color:white;
}

#board.shinkaisoku{
  color:#4da3ff;
}

#board.redType{
  color:#ff453a;
}


/* =====================================================
   距離
===================================================== */

#distanceBox{
  position:absolute;

  top:80px;
  left:12px;

  z-index:1500;

  padding:10px 14px;

  border-radius:17px;

  background:rgba(255,255,255,.68);

  color:#222;

  font-size:14px;
  font-weight:650;

  border:1px solid rgba(255,255,255,.8);

  box-shadow:
    0 7px 25px rgba(0,0,0,.12),
    inset 0 1px 1px rgba(255,255,255,.9);

  backdrop-filter:
    blur(20px)
    saturate(180%);

  -webkit-backdrop-filter:
    blur(20px)
    saturate(180%);
}


/* =====================================================
   制限速度
===================================================== */

#limitBox{
  position:absolute;

  top:80px;
  right:12px;

  z-index:1500;

  padding:10px 14px;

  border-radius:17px;

  background:rgba(255,255,255,.68);

  color:#222;

  font-size:14px;
  font-weight:700;

  border:1px solid rgba(255,255,255,.8);

  box-shadow:
    0 7px 25px rgba(0,0,0,.12),
    inset 0 1px 1px rgba(255,255,255,.9);

  backdrop-filter:
    blur(20px)
    saturate(180%);

  -webkit-backdrop-filter:
    blur(20px)
    saturate(180%);
}


/* =====================================================
   追従
===================================================== */

#followBox{
  position:absolute;

  top:135px;
  left:12px;

  z-index:1600;

  padding:8px 12px;

  border-radius:18px;

  background:rgba(255,255,255,.68);

  color:#333;

  font-size:13px;
  font-weight:650;

  display:flex;
  align-items:center;
  gap:8px;

  border:1px solid rgba(255,255,255,.8);

  box-shadow:
    0 7px 22px rgba(0,0,0,.1);

  backdrop-filter:
    blur(20px)
    saturate(180%);

  -webkit-backdrop-filter:
    blur(20px)
    saturate(180%);
}

#followSwitch{
  width:45px;
  height:25px;

  appearance:none;

  background:#9ba1a8;

  border-radius:20px;

  position:relative;

  outline:none;

  padding:0;

  border:0;
}

#followSwitch:checked{
  background:#34c759;
}

#followSwitch::after{
  content:"";

  position:absolute;

  width:21px;
  height:21px;

  top:2px;
  left:2px;

  background:white;

  border-radius:50%;

  box-shadow:
    0 2px 5px rgba(0,0,0,.2);

  transition:.2s;
}

#followSwitch:checked::after{
  transform:translateX(20px);
}


/* =====================================================
   モード
===================================================== */

#modeBox{
  position:absolute;

  top:135px;
  right:12px;

  z-index:1600;

  padding:9px 13px;

  border-radius:18px;

  background:rgba(255,255,255,.68);

  color:#333;

  font-size:13px;
  font-weight:700;

  border:1px solid rgba(255,255,255,.8);

  box-shadow:
    0 7px 22px rgba(0,0,0,.1);

  backdrop-filter:
    blur(20px)
    saturate(180%);

  -webkit-backdrop-filter:
    blur(20px)
    saturate(180%);
}


/* =====================================================
   地点一覧ボタン
===================================================== */

#routeButton{
  position:absolute;

  top:181px;
  right:12px;

  z-index:1600;

  border:1px solid rgba(255,255,255,.8);

  border-radius:18px;

  background:rgba(255,255,255,.68);

  color:#222;

  padding:10px 13px;

  font-size:13px;
  font-weight:700;

  box-shadow:
    0 7px 22px rgba(0,0,0,.1);

  backdrop-filter:
    blur(20px)
    saturate(180%);

  -webkit-backdrop-filter:
    blur(20px)
    saturate(180%);
}


/* =====================================================
   地点一覧
===================================================== */

#routePanel{
  display:none;

  position:absolute;

  top:230px;
  right:12px;

  width:245px;
  max-height:300px;

  overflow-y:auto;

  z-index:1700;

  padding:10px;

  background:rgba(245,247,250,.78);

  border-radius:21px;

  border:1px solid rgba(255,255,255,.85);

  box-shadow:
    0 12px 35px rgba(0,0,0,.2),
    inset 0 1px 1px rgba(255,255,255,.9);

  backdrop-filter:
    blur(28px)
    saturate(180%);

  -webkit-backdrop-filter:
    blur(28px)
    saturate(180%);
}

.routeTitle{
  color:#747b84;

  font-size:13px;
  font-weight:700;

  padding:4px 6px 9px;
}

.routeItem{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:5px;

  padding:9px;

  margin-bottom:6px;

  background:rgba(255,255,255,.7);

  border-radius:13px;

  font-size:13px;

  border:1px solid rgba(255,255,255,.8);
}

.deleteRoute{
  border:0;

  border-radius:10px;

  background:rgba(255,69,58,.15);

  color:#ff453a;

  padding:6px 8px;

  font-weight:700;
}


/* =====================================================
   速度
===================================================== */

#speedBox{
  position:absolute;

  bottom:105px;

  left:0;

  width:100%;

  text-align:center;

  z-index:1000;

  pointer-events:none;
}

#speed{
  font-size:60px;

  font-weight:900;

  letter-spacing:-2px;

  color:white;

  text-shadow:
    0 3px 12px rgba(0,0,0,.55);
}

.kmh{
  color:rgba(255,255,255,.8);

  font-size:14px;
}


/* =====================================================
   速度超過
===================================================== */

#overspeed{
  display:none;

  position:absolute;

  bottom:180px;
  left:0;

  width:100%;

  text-align:center;

  z-index:1800;

  color:#ff453a;

  font-size:19px;
  font-weight:850;

  text-shadow:
    0 2px 8px rgba(0,0,0,.4);
}


/* =====================================================
   終了ボタン
===================================================== */

#finishButton{
  position:absolute;

  left:20px;
  bottom:18px;

  width:calc(100% - 40px);

  height:61px;

  border:1px solid rgba(255,255,255,.5);

  border-radius:21px;

  background:rgba(35,40,48,.75);

  color:white;

  font-size:19px;
  font-weight:800;

  z-index:2000;

  box-shadow:
    0 8px 25px rgba(0,0,0,.22),
    inset 0 1px 1px rgba(255,255,255,.15);

  backdrop-filter:
    blur(24px)
    saturate(180%);

  -webkit-backdrop-filter:
    blur(24px)
    saturate(180%);
}


/* =====================================================
   ATS
===================================================== */

#ats{
  display:none;

  position:absolute;

  left:14px;
  bottom:14px;

  width:calc(100% - 28px);

  z-index:3000;

  padding:14px;

  border-radius:26px;

  background:rgba(245,247,250,.76);

  border:1px solid rgba(255,255,255,.85);

  box-shadow:
    0 15px 45px rgba(0,0,0,.25),
    inset 0 1px 1px rgba(255,255,255,.9);

  backdrop-filter:
    blur(30px)
    saturate(190%);

  -webkit-backdrop-filter:
    blur(30px)
    saturate(190%);
}

.atsWarning{
  text-align:center;

  color:#ff453a;

  font-size:18px;
  font-weight:850;

  margin-bottom:5px;
}

.atsTimer{
  text-align:center;

  color:#737981;

  font-size:13px;

  margin-bottom:9px;
}

.slider{
  position:relative;

  height:65px;

  border-radius:19px;

  background:rgba(20,25,30,.1);

  overflow:hidden;

  touch-action:none;

  border:1px solid rgba(255,255,255,.6);
}

.sliderText{
  position:absolute;

  width:100%;
  height:100%;

  display:flex;

  align-items:center;
  justify-content:center;

  color:#858b92;

  font-size:17px;
  font-weight:650;
}

.sliderButton{
  position:absolute;

  left:5px;
  top:5px;

  width:55px;
  height:55px;

  border-radius:16px;

  background:
    linear-gradient(
      135deg,
      #ff6258,
      #ff453a
    );

  color:white;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:25px;

  z-index:10;

  touch-action:none;

  box-shadow:
    0 4px 12px rgba(255,69,58,.3);

  transition:
    transform .15s ease;
}


/* =====================================================
   GPSマーカー
===================================================== */

.currentLocationMarker{
  width:22px;
  height:22px;

  border-radius:50%;

  background:#007aff;

  border:4px solid white;

  box-shadow:
    0 2px 10px rgba(0,0,0,.35);
}


/* =====================================================
   Leaflet attribution
===================================================== */

.leaflet-control-attribution{
  background:rgba(255,255,255,.55) !important;

  border-radius:10px 0 0 0;

  backdrop-filter:blur(10px);

  -webkit-backdrop-filter:blur(10px);
}


/* =====================================================
   小さい画面
===================================================== */

@media(max-width:380px){

  #board{
    min-width:190px;
    font-size:18px;
  }

  #distanceBox,
  #limitBox{
    font-size:12px;
  }

  #speed{
    font-size:52px;
  }

}

</style>

</head>


<body>


<!-- =====================================================
     設定
===================================================== -->

<div id="setup">

  <div class="setupCard">

    <div class="logo">
      🚲 cycletrain
    </div>


    <label>種別</label>

    <select id="type">

      <option>普通</option>

      <option>快速</option>

      <option>急行</option>

      <option>特急</option>

      <option>新快速</option>

    </select>


    <label>行き先</label>

    <input
      id="destinationName"
      type="text"
      placeholder="例：別府"
    >


    <label>速度制限</label>

    <div class="speedSetting">

      <input
        id="speedLimit"
        type="number"
        min="1"
        max="200"
        value="20"
        inputmode="numeric"
      >

      <div class="speedUnit">
        km/h
      </div>

    </div>


    <button
      class="startButton"
      onclick="startDrive()"
    >
      🚃 運転開始
    </button>

  </div>

</div>



<!-- =====================================================
     運転画面
===================================================== -->

<div id="drive">


  <div id="map"></div>


  <div id="board">
    快速・別府
  </div>


  <div id="distanceBox">
    📍 目的地を設定してください
  </div>


  <div id="limitBox">
    🚦 制限 20 km/h
  </div>


  <div id="followBox">

    追従

    <input
      id="followSwitch"
      type="checkbox"
      checked
    >

  </div>


  <div id="modeBox">
    🎯 目的地設定
  </div>


  <button
    id="routeButton"
    onclick="toggleRoutePanel()"
  >
    📍 地点一覧
  </button>


  <div id="routePanel">

    <div class="routeTitle">
      設定地点
    </div>

    <div id="routeList"></div>

  </div>


  <div id="overspeed">
    ⚠️ 速度超過
  </div>


  <div id="speedBox">

    <div id="speed">
      0
    </div>

    <div class="kmh">
      km/h
    </div>

  </div>


  <button
    id="finishButton"
    onclick="finishDrive()"
  >
    運転終了
  </button>


  <!-- ===================================================
       ATS
  =================================================== -->

  <div id="ats">

    <div
      id="atsText"
      class="atsWarning"
    >
      ⚠️ ATS作動
    </div>


    <div
      id="atsTimer"
      class="atsTimer"
    >
      自動終了まで 60 秒
    </div>


    <div class="slider">

      <div class="sliderText">
        スライドで解除
      </div>


      <div
        class="sliderButton"
        id="sliderButton"
      >
        →
      </div>

    </div>

  </div>

</div>



<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =====================================================
   基本変数
===================================================== */

let map = null;

let currentMarker = null;

let destination = null;

let destinationMarker = null;

let viaPoints = [];

let viaMarkers = [];

let currentViaIndex = 0;

let mode = "destination";

let watchID = null;

let speedLimit = 20;

let currentSpeed = 0;


/* =====================================================
   ATS
===================================================== */

let atsActive = false;

let atsTimer = null;

let atsCountdownTimer = null;

let atsSeconds = 60;

let atsType = "";


/*
 * 重要
 *
 * 1回の運転につきATSは1回だけ
 */

let atsUsed = false;


/* =====================================================
   キンコン
===================================================== */

let bellTimer = null;

let bellActive = false;


/* =====================================================
   Audio
===================================================== */

let audioContext = null;

let alarmOscillator = null;

let alarmGain = null;


/* =====================================================
   スライダー
===================================================== */

let startX = 0;

let sliderX = 0;


/* =====================================================
   Audio準備
===================================================== */

function prepareAudio(){

  if(!audioContext){

    audioContext =
      new(
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  if(
    audioContext.state ===
    "suspended"
  ){

    audioContext.resume();

  }

}


/* =====================================================
   ATS警報開始
===================================================== */

function startAlarm(){

  prepareAudio();

  stopAlarm();


  alarmOscillator =
    audioContext.createOscillator();

  alarmGain =
    audioContext.createGain();


  alarmOscillator.type =
    "square";

  alarmOscillator.frequency.value =
    700;


  alarmGain.gain.value =
    0.12;


  alarmOscillator.connect(
    alarmGain
  );

  alarmGain.connect(
    audioContext.destination
  );


  alarmOscillator.start();

}


/* =====================================================
   ATS警報停止
===================================================== */

function stopAlarm(){

  if(alarmOscillator){

    try{

      alarmOscillator.stop();

    }catch(e){}

    try{

      alarmOscillator.disconnect();

    }catch(e){}

    alarmOscillator = null;

  }


  if(alarmGain){

    try{

      alarmGain.disconnect();

    }catch(e){}

    alarmGain = null;

  }

}


/* =====================================================
   キンコン1回
===================================================== */

function playBell(){

  prepareAudio();


  const now =
    audioContext.currentTime;


  const osc1 =
    audioContext.createOscillator();

  const gain1 =
    audioContext.createGain();


  osc1.type =
    "sine";

  osc1.frequency.value =
    880;


  gain1.gain.setValueAtTime(
    0.16,
    now
  );

  gain1.gain.exponentialRampToValueAtTime(
    0.001,
    now + 0.14
  );


  osc1.connect(gain1);

  gain1.connect(
    audioContext.destination
  );


  osc1.start(now);

  osc1.stop(
    now + 0.14
  );


  setTimeout(
    function(){

      if(!audioContext){
        return;
      }


      const now2 =
        audioContext.currentTime;


      const osc2 =
        audioContext.createOscillator();

      const gain2 =
        audioContext.createGain();


      osc2.type =
        "sine";

      osc2.frequency.value =
        660;


      gain2.gain.setValueAtTime(
        0.16,
        now2
      );

      gain2.gain.exponentialRampToValueAtTime(
        0.001,
        now2 + 0.16
      );


      osc2.connect(gain2);

      gain2.connect(
        audioContext.destination
      );


      osc2.start(now2);

      osc2.stop(
        now2 + 0.16
      );

    },
    140
  );

}


/* =====================================================
   キンコン停止条件
===================================================== */

function canStopBell(){

  if(!currentMarker){

    return false;

  }


  const current =
    currentMarker.getLatLng();


  /*
   * 目的地30m
   */

  if(destination){

    const distance =
      current.distanceTo(
        destination
      );


    if(
      distance <= 30
    ){

      return true;

    }

  }


  /*
   * 経由地点30m
   */

  for(
    let i = 0;
    i < viaPoints.length;
    i++
  ){

    const distance =
      current.distanceTo(
        viaPoints[i]
      );


    if(
      distance <= 30
    ){

      return true;

    }

  }


  /*
   * 速度ATS
   *
   * 制限速度 - 3km/h以下
   */

  if(
    atsType ===
    "overspeed"
  ){

    if(
      currentSpeed <=
      speedLimit - 3
    ){

      return true;

    }

  }


  return false;

}


/* =====================================================
   キンコン開始
===================================================== */

function startBell(){

  stopBell();


  if(
    canStopBell()
  ){

    return;

  }


  bellActive = true;


  playBell();


  bellTimer =
    setInterval(
      function(){

        if(
          canStopBell()
        ){

          stopBell();

          return;

        }


        playBell();

      },
      700
    );

}


/* =====================================================
   キンコン停止
===================================================== */

function stopBell(){

  if(
    bellTimer !== null
  ){

    clearInterval(
      bellTimer
    );

    bellTimer = null;

  }


  bellActive = false;

}


/* =====================================================
   運転開始
===================================================== */

function startDrive(){

  const type =
    document.getElementById(
      "type"
    ).value;


  const name =
    document.getElementById(
      "destinationName"
    ).value.trim();


  speedLimit =
    Number(
      document.getElementById(
        "speedLimit"
      ).value
    );


  if(!name){

    alert(
      "行き先名を入力してください"
    );

    return;

  }


  if(
    !speedLimit ||
    speedLimit <= 0
  ){

    alert(
      "速度制限を設定してください"
    );

    return;

  }


  prepareAudio();


  const board =
    document.getElementById(
      "board"
    );


  /*
   * 「行き」を付けない
   */

  board.textContent =
    type +
    "・" +
    name;


  /*
   * 種別カラー
   */

  board.classList.remove(
    "normal",
    "shinkaisoku",
    "redType"
  );


  if(
    type ===
    "普通"
  ){

    board.classList.add(
      "normal"
    );

  }else if(
    type ===
    "新快速"
  ){

    board.classList.add(
      "shinkaisoku"
    );

  }else{

    board.classList.add(
      "redType"
    );

  }


  document.getElementById(
    "limitBox"
  ).textContent =
    "🚦 制限 " +
    speedLimit +
    " km/h";


  /*
   * ATSを今回の運転でリセット
   */

  atsUsed = false;

  atsActive = false;

  atsType = "";


  document.getElementById(
    "setup"
  ).style.display =
    "none";


  document.getElementById(
    "drive"
  ).style.display =
    "block";


  mode =
    "destination";


  updateMode();


  setTimeout(
    initMap,
    100
  );

}


/* =====================================================
   地図初期化
===================================================== */

function initMap(){

  if(map){

    map.invalidateSize();

    return;

  }


  map =
    L.map(
      "map",
      {
        zoomControl:true,
        attributionControl:true
      }
    );


  /*
   * 明るいOpenStreetMap
   *
   * Apple Maps風にCSSで調整
   */

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,

      attribution:
        "&copy; OpenStreetMap contributors"
    }
  ).addTo(map);


  if(
    !navigator.geolocation
  ){

    alert(
      "この端末ではGPSを利用できません"
    );

    return;

  }


  navigator.geolocation.getCurrentPosition(

    function(position){

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;


      map.setView(
        [lat,lng],
        17
      );


      currentMarker =
        L.marker(
          [lat,lng]
        )
        .addTo(map)
        .bindPopup(
          "🚲 現在地"
        );


      startGPS();

    },


    function(){

      map.setView(
        [35.681236,139.767125],
        13
      );


      document.getElementById(
        "distanceBox"
      ).textContent =
        "📍 GPSを許可してください";

    },


    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:1000
    }

  );


  /*
   * 地図タップ
   */

  map.on(
    "click",
    function(e){

      setPoint(
        e.latlng.lat,
        e.latlng.lng
      );

    }
  );

}


/* =====================================================
   地点設定
===================================================== */

function setPoint(
  lat,
  lng
){

  /*
   * 目的地設定
   */

  if(
    mode ===
    "destination"
  ){

    if(destinationMarker){

      map.removeLayer(
        destinationMarker
      );

    }


    destination =
      L.latLng(
        lat,
        lng
      );


    destinationMarker =
      L.marker(
        [lat,lng]
      )
      .addTo(map)
      .bindPopup(
        "🎯 目的地"
      );


    /*
     * 目的地設定後
     * 経由地点設定へ
     */

    mode =
      "via";


    updateMode();

    updateRouteList();


    document.getElementById(
      "distanceBox"
    ).textContent =
      "📍 経由地点を設定してください";


    return;

  }


  /*
   * 経由地点
   */

  if(
    mode ===
    "via"
  ){

    addViaPoint(
      lat,
      lng
    );

  }

}


/* =====================================================
   経由地点追加
===================================================== */

function addViaPoint(
  lat,
  lng
){

  const point =
    L.latLng(
      lat,
      lng
    );


  viaPoints.push(
    point
  );


  const marker =
    L.marker(
      [lat,lng]
    )
    .addTo(map)
    .bindPopup(
      "📍 経由地点 " +
      viaPoints.length
    );


  viaMarkers.push(
    marker
  );


  updateRouteList();

}


/* =====================================================
   モード表示
===================================================== */

function updateMode(){

  const box =
    document.getElementById(
      "modeBox"
    );


  if(
    mode ===
    "destination"
  ){

    box.textContent =
      "🎯 目的地設定";

  }else{

    box.textContent =
      "📍 経由地点設定";

  }

}


/* =====================================================
   地点一覧
===================================================== */

function updateRouteList(){

  const list =
    document.getElementById(
      "routeList"
    );


  list.innerHTML = "";


  /*
   * 目的地
   */

  if(destination){

    const item =
      document.createElement(
        "div"
      );


    item.className =
      "routeItem";


    const text =
      document.createElement(
        "span"
      );


    text.textContent =
      "🎯 目的地";


    const button =
      document.createElement(
        "button"
      );


    button.className =
      "deleteRoute";


    button.textContent =
      "削除";


    button.onclick =
      function(){

        deleteDestination();

      };


    item.appendChild(
      text
    );

    item.appendChild(
      button
    );


    list.appendChild(
      item
    );

  }


  /*
   * 経由地点
   */

  viaPoints.forEach(
    function(point,index){

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "routeItem";


      const text =
        document.createElement(
          "span"
        );


      text.textContent =
        "📍 経由 " +
        (index + 1);


      const button =
        document.createElement(
          "button"
        );


      button.className =
        "deleteRoute";


      button.textContent =
        "削除";


      button.onclick =
        function(){

          deleteViaPoint(
            index
          );

        };


      item.appendChild(
        text
      );

      item.appendChild(
        button
      );


      list.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   目的地削除
===================================================== */

function deleteDestination(){

  if(
    !confirm(
      "目的地を削除しますか？"
    )
  ){

    return;

  }


  if(destinationMarker){

    map.removeLayer(
      destinationMarker
    );

  }


  destination = null;

  destinationMarker = null;


  /*
   * 目的地設定に戻る
   */

  mode =
    "destination";


  updateMode();

  updateRouteList();


  document.getElementById(
    "distanceBox"
  ).textContent =
    "🎯 新しい目的地を設定してください";

}


/* =====================================================
   経由地点削除
===================================================== */

function deleteViaPoint(
  index
){

  if(
    !confirm(
      "この経由地点を削除しますか？"
    )
  ){

    return;

  }


  if(
    viaMarkers[index]
  ){

    map.removeLayer(
      viaMarkers[index]
    );

  }


  viaMarkers.splice(
    index,
    1
  );


  viaPoints.splice(
    index,
    1
  );


  if(
    currentViaIndex >
    index
  ){

    currentViaIndex--;

  }


  if(
    currentViaIndex < 0
  ){

    currentViaIndex = 0;

  }


  updateRouteList();

}


/* =====================================================
   地点一覧開閉
===================================================== */

function toggleRoutePanel(){

  const panel =
    document.getElementById(
      "routePanel"
    );


  if(
    panel.style.display ===
    "block"
  ){

    panel.style.display =
      "none";

  }else{

    panel.style.display =
      "block";

  }

}


/* =====================================================
   ATS作動
===================================================== */

function activateATS(
  message,
  type
){

  /*
   * すでにATSを使用済みなら
   * 絶対に再発動しない
   */

  if(
    atsUsed
  ){

    return;

  }


  if(
    atsActive
  ){

    return;

  }


  /*
   * ATS使用済みにする
   */

  atsUsed = true;

  atsActive = true;

  atsType = type;

  atsSeconds = 60;


  /*
   * キンコン停止
   */

  stopBell();


  /*
   * 終了ボタン非表示
   */

  document.getElementById(
    "finishButton"
  ).style.display =
    "none";


  /*
   * ATS表示
   */

  document.getElementById(
    "ats"
  ).style.display =
    "block";


  document.getElementById(
    "atsText"
  ).textContent =
    message;


  document.getElementById(
    "atsTimer"
  ).textContent =
    "自動終了まで 60 秒";


  /*
   * ATS警報
   */

  startAlarm();


  /*
   * バイブ
   */

  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      [300,200]
    );

  }


  /*
   * カウントダウン
   */

  clearInterval(
    atsCountdownTimer
  );


  atsCountdownTimer =
    setInterval(
      function(){

        if(
          !atsActive
        ){

          return;

        }


        atsSeconds--;


        if(
          atsSeconds < 0
        ){

          atsSeconds = 0;

        }


        document.getElementById(
          "atsTimer"
        ).textContent =
          "自動終了まで " +
          atsSeconds +
          " 秒";


        if(
          atsSeconds <= 0
        ){

          releaseATS();

        }

      },
      1000
    );


  /*
   * 60秒強制終了
   */

  clearTimeout(
    atsTimer
  );


  atsTimer =
    setTimeout(
      function(){

        releaseATS();

      },
      60000
    );

}


/* =====================================================
   ATS解除
===================================================== */

function releaseATS(){

  /*
   * すでに解除済みなら何もしない
   */

  if(
    !atsActive
  ){

    return;

  }


  atsActive = false;


  clearTimeout(
    atsTimer
  );


  clearInterval(
    atsCountdownTimer
  );


  atsTimer = null;

  atsCountdownTimer = null;


  /*
   * ATS警報停止
   */

  stopAlarm();


  /*
   * バイブ停止
   */

  if(
    navigator.vibrate
  ){

    navigator.vibrate(0);

  }


  /*
   * ATS画面消去
   */

  document.getElementById(
    "ats"
  ).style.display =
    "none";


  /*
   * 終了ボタン復活
   */

  document.getElementById(
    "finishButton"
  ).style.display =
    "block";


  /*
   * ATS解除後キンコン
   *
   * ただし30m以内なら鳴らさない
   */

  if(
    !canStopBell()
  ){

    startBell();

  }

}


/* =====================================================
   GPS
===================================================== */

function startGPS(){

  if(
    watchID !== null
  ){

    navigator.geolocation.clearWatch(
      watchID
    );

  }


  watchID =
    navigator.geolocation.watchPosition(

      function(position){

        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;


        /*
         * 速度
         */

        let speed =
          position.coords.speed;


        if(
          speed === null ||
          speed < 0
        ){

          speed = 0;

        }


        speed =
          speed * 3.6;


        currentSpeed =
          speed;


        document.getElementById(
          "speed"
        ).textContent =
          Math.round(speed);


        /*
         * 現在地
         */

        if(currentMarker){

          currentMarker.setLatLng(
            [lat,lng]
          );

        }


        /*
         * 追従
         */

        const follow =
          document.getElementById(
            "followSwitch"
          ).checked;


        if(
          follow &&
          map
        ){

          map.panTo(
            [lat,lng],
            {
              animate:true,
              duration:.5
            }
          );

        }


        /*
         * 速度超過
         */

        if(
          speed > speedLimit
        ){

          document.getElementById(
            "overspeed"
          ).style.display =
            "block";


          /*
           * ATS未使用なら作動
           */

          if(
            !atsActive &&
            !atsUsed
          ){

            activateATS(
              "⚠️ 速度超過ATS",
              "overspeed"
            );

          }

        }else{

          document.getElementById(
            "overspeed"
          ).style.display =
            "none";

        }


        /*
         * 目的地なし
         */

        if(
          !destination
        ){

          return;

        }


        const current =
          L.latLng(
            lat,
            lng
          );


        /*
         * 経由地点
         */

        if(
          currentViaIndex <
          viaPoints.length
        ){

          const via =
            viaPoints[
              currentViaIndex
            ];


          const distance =
            current.distanceTo(
              via
            );


          document.getElementById(
            "distanceBox"
          ).textContent =
            "📍 経由 " +
            (currentViaIndex + 1) +
            "まで " +
            Math.round(distance) +
            "m";


          /*
           * 30m以内
           *
           * 経由地点到着
           */

          if(
            distance <= 30
          ){

            stopBell();


            /*
             * 次の経由地点へ
             */

            currentViaIndex++;


            updateRouteList();


            /*
             * ATSは未使用なら
             * 100m以内到達時に作動
             *
             * ただし30m以内なら
             * その場でATSを作動させる
             */

            if(
              !atsActive &&
              !atsUsed
            ){

              activateATS(
                "⚠️ 経由地点ATS",
                "via"
              );

            }


            return;

          }


          /*
           * 100m以内ATS
           */

          if(
            distance <= 100 &&
            !atsActive &&
            !atsUsed
          ){

            activateATS(
              "⚠️ 経由地点ATS",
              "via"
            );

          }


          return;

        }


        /*
         * 目的地
         */

        const distance =
          current.distanceTo(
            destination
          );


        document.getElementById(
          "distanceBox"
        ).textContent =
          "🎯 目的地まで " +
          Math.round(distance) +
          "m";


        /*
         * 30m以内なら
         * キンコン停止
         */

        if(
          distance <= 30
        ){

          stopBell();

        }


        /*
         * 到着ATS
         *
         * 200m以内
         *
         * かつATS未使用
         */

        if(
          distance <= 200 &&
          !atsActive &&
          !atsUsed
        ){

          activateATS(
            "🏁 目的地ATS",
            "destination"
          );

        }

      },


      function(){

        document.getElementById(
          "distanceBox"
        ).textContent =
          "📍 GPS取得失敗";

      },


      {
        enableHighAccuracy:true,
        maximumAge:1000,
        timeout:10000
      }

    );

}


/* =====================================================
   ATSスライダー
===================================================== */

const sliderButton =
  document.getElementById(
    "sliderButton"
  );


/*
 * タッチ開始
 */

sliderButton.addEventListener(
  "touchstart",
  function(e){

    if(
      !atsActive
    ){

      return;

    }


    startX =
      e.touches[0].clientX;

    sliderX = 0;

  },
  {
    passive:true
  }
);


/*
 * タッチ移動
 */

sliderButton.addEventListener(
  "touchmove",
  function(e){

    if(
      !atsActive
    ){

      return;

    }


    const x =
      e.touches[0].clientX;


    sliderX =
      x - startX;


    if(
      sliderX < 0
    ){

      sliderX = 0;

    }


    const slider =
      sliderButton.parentElement;


    const max =
      slider.clientWidth -
      sliderButton.clientWidth -
      10;


    if(
      sliderX > max
    ){

      sliderX = max;

    }


    sliderButton.style.transform =
      "translateX(" +
      sliderX +
      "px)";

  },
  {
    passive:true
  }
);


/*
 * タッチ終了
 */

sliderButton.addEventListener(
  "touchend",
  function(){

    if(
      !atsActive
    ){

      return;

    }


    const slider =
      sliderButton.parentElement;


    const max =
      slider.clientWidth -
      sliderButton.clientWidth -
      10;


    /*
     * 70%以上
     */

    if(
      sliderX >=
      max * .7
    ){

      releaseATS();

    }


    /*
     * 元に戻す
     */

    sliderButton.style.transform =
      "translateX(0)";

    sliderX = 0;

  }
);


/* =====================================================
   運転終了
===================================================== */

function finishDrive(){

  /*
   * ATS中は終了不可
   */

  if(
    atsActive
  ){

    return;

  }


  if(
    !confirm(
      "運転を終了しますか？"
    )
  ){

    return;

  }


  /*
   * 音停止
   */

  stopAlarm();

  stopBell();


  /*
   * ATSタイマー停止
   */

  clearTimeout(
    atsTimer
  );

  clearInterval(
    atsCountdownTimer
  );


  atsTimer = null;

  atsCountdownTimer = null;


  /*
   * GPS停止
   */

  if(
    watchID !== null
  ){

    navigator.geolocation.clearWatch(
      watchID
    );

    watchID = null;

  }


  /*
   * 経由地点削除
   */

  viaMarkers.forEach(
    function(marker){

      if(map){

        map.removeLayer(
          marker
        );

      }

    }
  );


  /*
   * 目的地削除
   */

  if(
    destinationMarker &&
    map
  ){

    map.removeLayer(
      destinationMarker
    );

  }


  /*
   * 現在地削除
   */

  if(
    currentMarker &&
    map
  ){

    map.removeLayer(
      currentMarker
    );

  }


  /*
   * 初期化
   */

  destination = null;

  destinationMarker = null;

  viaPoints = [];

  viaMarkers = [];

  currentViaIndex = 0;

  atsActive = false;

  atsUsed = false;

  atsType = "";

  mode = "destination";

  currentSpeed = 0;


  /*
   * Leafletマップ破棄
   *
   * 次回開始時にGPS・地図を
   * 正しく初期化する
   */

  if(map){

    map.remove();

    map = null;

  }


  currentMarker = null;


  /*
   * 画面
   */

  document.getElementById(
    "drive"
  ).style.display =
    "none";


  document.getElementById(
    "setup"
  ).style.display =
    "block";


  /*
   * パネル
   */

  document.getElementById(
    "routePanel"
  ).style.display =
    "none";


  /*
   * 速度
   */

  document.getElementById(
    "speed"
  ).textContent =
    "0";


  /*
   * 速度超過
   */

  document.getElementById(
    "overspeed"
  ).style.display =
    "none";


  /*
   * ATS
   */

  document.getElementById(
    "ats"
  ).style.display =
    "none";


  /*
   * スライダー
   */

  sliderButton.style.transform =
    "translateX(0)";

  sliderX = 0;


  /*
   * モード
   */

  updateMode();

}

</script>
