<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>cycletrain</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

/* =====================================================
   基本
===================================================== */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{

  background:
    radial-gradient(
      circle at 20% 0%,
      rgba(255,255,255,.08),
      transparent 35%
    ),
    radial-gradient(
      circle at 100% 100%,
      rgba(255,140,40,.08),
      transparent 35%
    ),
    #08090c;

  color:white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    sans-serif;
}


/* =====================================================
   Liquid Glass
===================================================== */

.glass{

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.13),
      rgba(255,255,255,.035)
    );

  border:
    1px solid
    rgba(255,255,255,.15);

  box-shadow:
    0 10px 35px
    rgba(0,0,0,.35),

    inset 0 1px 0
    rgba(255,255,255,.13),

    inset 0 -1px 0
    rgba(0,0,0,.2);

  backdrop-filter:
    blur(28px)
    saturate(160%);

  -webkit-backdrop-filter:
    blur(28px)
    saturate(160%);
}


/* =====================================================
   設定画面
===================================================== */

#setup{

  width:100%;
  height:100vh;

  padding:
    25px 20px
    calc(25px + env(safe-area-inset-bottom));

  overflow-y:auto;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(255,255,255,.09),
      transparent 45%
    );
}


.logo{

  text-align:center;

  font-size:34px;

  font-weight:850;

  letter-spacing:-1.5px;

  margin:
    30px 0 32px;
}


label{

  display:block;

  color:
    rgba(255,255,255,.58);

  margin:
    18px 4px 8px;

  font-size:14px;

  font-weight:600;
}


select,
input{

  width:100%;

  height:58px;

  padding:
    0 17px;

  border-radius:20px;

  border:
    1px solid
    rgba(255,255,255,.13);

  background:
    rgba(255,255,255,.075);

  color:white;

  font-size:18px;

  outline:none;

  backdrop-filter:
    blur(20px);

  -webkit-backdrop-filter:
    blur(20px);

  box-shadow:
    inset 0 1px 0
    rgba(255,255,255,.08),

    0 8px 25px
    rgba(0,0,0,.18);
}


select option{

  background:#17191e;
  color:white;
}


.speedSetting{

  display:flex;

  align-items:center;

  gap:10px;
}


.speedSetting input{

  flex:1;
}


.speedUnit{

  color:
    rgba(255,255,255,.55);

  font-size:15px;
}


/* =====================================================
   地図選択カード
===================================================== */

.mapChoice{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:9px;
}


.mapChoice input{

  display:none;
}


.mapChoice label{

  margin:0;

  height:88px;

  border-radius:21px;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;

  font-size:13px;

  font-weight:700;

  color:
    rgba(255,255,255,.65);

  background:
    rgba(255,255,255,.07);

  border:
    1px solid
    rgba(255,255,255,.10);

  transition:
    .18s;
}


.mapChoice input:checked + label{

  color:white;

  background:
    linear-gradient(
      145deg,
      rgba(65,150,255,.35),
      rgba(65,150,255,.12)
    );

  border:
    1px solid
    rgba(80,160,255,.65);

  box-shadow:
    0 8px 25px
    rgba(30,120,255,.18),

    inset 0 1px 0
    rgba(255,255,255,.18);

  transform:
    scale(1.02);
}


.mapIcon{

  font-size:25px;

  margin-bottom:5px;
}


/* =====================================================
   スタート
===================================================== */

.startButton{

  width:100%;

  height:62px;

  margin-top:30px;

  border:0;

  border-radius:22px;

  background:
    linear-gradient(
      180deg,
      #4aa3ff,
      #1478e8
    );

  color:white;

  font-size:19px;

  font-weight:800;

  box-shadow:
    0 10px 30px
    rgba(20,120,232,.28),

    inset 0 1px 0
    rgba(255,255,255,.3);

  transition:
    transform .15s,
    filter .15s;
}


.startButton:active{

  transform:
    scale(.97);

  filter:
    brightness(.9);
}


/* =====================================================
   運転画面
===================================================== */

#drive{

  display:none;

  width:100%;
  height:100vh;

  position:relative;

  overflow:hidden;
}


/* =====================================================
   幕
===================================================== */

#board{

  position:absolute;

  top:
    calc(8px + env(safe-area-inset-top));

  left:10px;
  right:10px;

  height:68px;

  z-index:3000;

  border-radius:26px;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:0 18px;

  font-size:22px;

  font-weight:850;

  letter-spacing:-.5px;

  white-space:nowrap;

  overflow:hidden;

  background:
    linear-gradient(
      135deg,
      rgba(0,0,0,.78),
      rgba(25,25,28,.50)
    );

  border:
    1px solid
    rgba(255,255,255,.16);

  box-shadow:
    0 12px 35px
    rgba(0,0,0,.4),

    inset 0 1px 0
    rgba(255,255,255,.14);

  backdrop-filter:
    blur(30px)
    saturate(170%);

  -webkit-backdrop-filter:
    blur(30px)
    saturate(170%);
}


.board-normal{
  color:#fff;
}


.board-shinkaisoku{
  color:#4da3ff;
}


.board-other{
  color:#ff453a;
}


/* =====================================================
   次は○○ スクロール
===================================================== */

#nextBoard{

  position:absolute;

  top:
    calc(82px + env(safe-area-inset-top));

  left:10px;
  right:10px;

  height:38px;

  z-index:2990;

  border-radius:18px;

  overflow:hidden;

  background:
    rgba(0,0,0,.60);

  border:
    1px solid
    rgba(255,255,255,.10);

  backdrop-filter:
    blur(25px);

  -webkit-backdrop-filter:
    blur(25px);

  display:flex;

  align-items:center;
}


.nextText{

  white-space:nowrap;

  padding-left:100%;

  animation:
    nextScroll 12s linear infinite;

  font-size:15px;

  font-weight:700;

  color:
    rgba(255,255,255,.88);
}


@keyframes nextScroll{

  from{
    transform:
      translateX(0);
  }

  to{
    transform:
      translateX(-100%);
  }

}


/* =====================================================
   MAP
===================================================== */

#map{

  width:100%;
  height:100%;

  background:#dfe5e9;
}


/* Leaflet */

.leaflet-control-zoom{

  border:0 !important;

  margin:
    135px 12px 0 0 !important;
}


.leaflet-control-zoom a{

  width:43px !important;
  height:43px !important;

  line-height:43px !important;

  border:0 !important;

  color:#222 !important;

  background:
    rgba(255,255,255,.82) !important;

  backdrop-filter:
    blur(20px);

  -webkit-backdrop-filter:
    blur(20px);

  box-shadow:
    0 4px 18px
    rgba(0,0,0,.18);
}


.leaflet-control-zoom a:first-child{

  border-radius:
    15px 15px 5px 5px !important;
}


.leaflet-control-zoom a:last-child{

  border-radius:
    5px 5px 15px 15px !important;
}


/* =====================================================
   距離
===================================================== */

#distanceBox{

  position:absolute;

  top:
    calc(127px + env(safe-area-inset-top));

  left:10px;

  z-index:2000;

  padding:
    10px 14px;

  border-radius:18px;

  background:
    rgba(0,0,0,.72);

  border:
    1px solid
    rgba(255,255,255,.12);

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.25);

  backdrop-filter:
    blur(25px);

  -webkit-backdrop-filter:
    blur(25px);

  font-size:13px;

  max-width:
    calc(100% - 20px);

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}


/* =====================================================
   制限速度
===================================================== */

#limitBox{

  position:absolute;

  top:
    calc(127px + env(safe-area-inset-top));

  right:10px;

  z-index:2000;

  padding:
    10px 14px;

  border-radius:18px;

  background:
    rgba(0,0,0,.72);

  border:
    1px solid
    rgba(255,255,255,.12);

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.25);

  backdrop-filter:
    blur(25px);

  -webkit-backdrop-filter:
    blur(25px);

  font-size:13px;
}


/* =====================================================
   追従
===================================================== */

#followBox{

  position:absolute;

  top:
    calc(169px + env(safe-area-inset-top));

  left:10px;

  z-index:2100;

  padding:
    8px 10px;

  border-radius:17px;

  background:
    rgba(0,0,0,.68);

  border:
    1px solid
    rgba(255,255,255,.12);

  backdrop-filter:
    blur(22px);

  -webkit-backdrop-filter:
    blur(22px);

  font-size:13px;

  display:flex;

  align-items:center;

  gap:7px;
}


#followSwitch{

  width:45px;
  height:25px;

  appearance:none;

  background:
    rgba(255,255,255,.25);

  border-radius:20px;

  position:relative;

  outline:none;

  padding:0;

  border:0;
}


#followSwitch:checked{

  background:#238636;
}


#followSwitch::after{

  content:"";

  position:absolute;

  width:21px;
  height:21px;

  top:2px;
  left:2px;

  background:white;

  border-radius:50%;

  transition:.2s;
}


#followSwitch:checked::after{

  transform:
    translateX(20px);
}


/* =====================================================
   モード
===================================================== */

#modeBox{

  position:absolute;

  top:
    calc(169px + env(safe-area-inset-top));

  right:10px;

  z-index:2100;

  padding:
    9px 12px;

  border-radius:17px;

  background:
    rgba(0,0,0,.68);

  border:
    1px solid
    rgba(255,255,255,.12);

  backdrop-filter:
    blur(22px);

  -webkit-backdrop-filter:
    blur(22px);

  font-size:13px;
}


/* =====================================================
   地点一覧
===================================================== */

#routeButton{

  position:absolute;

  top:
    calc(210px + env(safe-area-inset-top));

  right:10px;

  z-index:2100;

  border:
    1px solid
    rgba(255,255,255,.12);

  border-radius:17px;

  background:
    rgba(0,0,0,.68);

  color:white;

  padding:
    10px 13px;

  font-size:13px;

  backdrop-filter:
    blur(22px);

  -webkit-backdrop-filter:
    blur(22px);
}


#routePanel{

  display:none;

  position:absolute;

  top:
    calc(253px + env(safe-area-inset-top));

  right:10px;

  width:245px;

  max-height:320px;

  overflow-y:auto;

  z-index:2500;

  padding:9px;

  background:
    rgba(10,12,16,.78);

  border:
    1px solid
    rgba(255,255,255,.14);

  border-radius:23px;

  box-shadow:
    0 15px 45px
    rgba(0,0,0,.45);

  backdrop-filter:
    blur(30px)
    saturate(160%);

  -webkit-backdrop-filter:
    blur(30px)
    saturate(160%);
}


.routeTitle{

  color:
    rgba(255,255,255,.55);

  font-size:13px;

  padding:
    5px 7px 9px;
}


.routeItem{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:5px;

  padding:9px;

  margin-bottom:6px;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid
    rgba(255,255,255,.07);

  border-radius:14px;

  font-size:13px;
}


.deleteRoute{

  border:0;

  border-radius:10px;

  background:
    rgba(255,69,58,.75);

  color:white;

  padding:
    6px 8px;
}


/* =====================================================
   速度
===================================================== */

#speedBox{

  position:absolute;

  bottom:
    calc(115px + env(safe-area-inset-bottom));

  left:0;

  width:100%;

  text-align:center;

  z-index:2000;

  pointer-events:none;
}


#speed{

  font-size:55px;

  font-weight:850;

  letter-spacing:-2px;

  text-shadow:
    0 4px 20px
    rgba(0,0,0,.5);
}


.kmh{

  color:
    rgba(255,255,255,.55);

  font-size:14px;
}


/* =====================================================
   速度超過
===================================================== */

#overspeed{

  display:none;

  position:absolute;

  bottom:
    calc(180px + env(safe-area-inset-bottom));

  left:0;

  width:100%;

  text-align:center;

  z-index:2600;

  color:#ff453a;

  font-size:19px;

  font-weight:bold;
}


/* =====================================================
   終了
===================================================== */

#finishButton{

  position:absolute;

  left:20px;

  bottom:
    calc(20px + env(safe-area-inset-bottom));

  width:
    calc(100% - 40px);

  height:62px;

  border:
    1px solid
    rgba(255,255,255,.13);

  border-radius:23px;

  background:
    rgba(0,0,0,.72);

  color:white;

  font-size:19px;

  font-weight:bold;

  z-index:2800;

  box-shadow:
    0 10px 35px
    rgba(0,0,0,.35),

    inset 0 1px 0
    rgba(255,255,255,.1);

  backdrop-filter:
    blur(28px);

  -webkit-backdrop-filter:
    blur(28px);
}


/* =====================================================
   ATS
===================================================== */

#ats{

  display:none;

  position:absolute;

  left:15px;

  bottom:
    calc(15px + env(safe-area-inset-bottom));

  width:
    calc(100% - 30px);

  z-index:4000;

  padding:15px;

  border-radius:29px;

  background:
    linear-gradient(
      135deg,
      rgba(0,0,0,.88),
      rgba(30,30,34,.67)
    );

  border:
    1px solid
    rgba(255,255,255,.16);

  box-shadow:
    0 18px 55px
    rgba(0,0,0,.55),

    inset 0 1px 0
    rgba(255,255,255,.13);

  backdrop-filter:
    blur(35px)
    saturate(170%);

  -webkit-backdrop-filter:
    blur(35px)
    saturate(170%);
}


.atsWarning{

  text-align:center;

  color:#ff453a;

  font-size:19px;

  font-weight:850;

  margin-bottom:7px;
}


.atsTimer{

  text-align:center;

  color:
    rgba(255,255,255,.55);

  font-size:13px;

  margin-bottom:8px;
}


.slider{

  position:relative;

  height:66px;

  border-radius:21px;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid
    rgba(255,255,255,.08);

  overflow:hidden;

  touch-action:none;
}


.sliderText{

  position:absolute;

  width:100%;
  height:100%;

  display:flex;

  align-items:center;
  justify-content:center;

  color:
    rgba(255,255,255,.48);

  font-size:17px;
}


.sliderButton{

  position:absolute;

  left:5px;
  top:5px;

  width:56px;
  height:56px;

  border-radius:18px;

  background:
    linear-gradient(
      180deg,
      #ff7043,
      #e63828
    );

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:25px;

  z-index:10;

  touch-action:none;

  box-shadow:
    0 5px 15px
    rgba(255,69,58,.25),

    inset 0 1px 0
    rgba(255,255,255,.25);
}


/* =====================================================
   現在地
===================================================== */

.current-marker{

  width:18px;
  height:18px;

  border-radius:50%;

  background:#1677ff;

  border:
    3px solid white;

  box-shadow:
    0 0 0 6px
    rgba(22,119,255,.22),

    0 4px 12px
    rgba(0,0,0,.35);
}


@media(max-width:500px){

  #board{
    font-size:21px;
  }

}

</style>

</head>

<body>


<!-- =====================================================
     設定
===================================================== -->

<div id="setup">

  <div class="logo">
    🚲 cycletrain
  </div>


  <label>
    地図
  </label>

  <div class="mapChoice">

    <input
      type="radio"
      name="mapType"
      id="mapApple"
      value="apple"
      checked
    >

    <label for="mapApple">

      <div class="mapIcon">
        🍎
      </div>

      Apple風

    </label>


    <input
      type="radio"
      name="mapType"
      id="mapOSM"
      value="osm"
    >

    <label for="mapOSM">

      <div class="mapIcon">
        🗺️
      </div>

      OSM

    </label>


    <input
      type="radio"
      name="mapType"
      id="mapDark"
      value="dark"
    >

    <label for="mapDark">

      <div class="mapIcon">
        🌙
      </div>

      ダーク

    </label>

  </div>


  <label>
    種別
  </label>

  <select id="type">

    <option>普通</option>
    <option>快速</option>
    <option>急行</option>
    <option>特急</option>
    <option>新快速</option>

  </select>


  <label>
    行き先
  </label>

  <input
    id="destinationName"
    type="text"
    placeholder="例：別府駅"
  >


  <label>
    速度制限
  </label>

  <div class="speedSetting">

    <input
      id="speedLimit"
      type="number"
      min="1"
      max="200"
      value="20"
      inputmode="numeric"
    >

    <div class="speedUnit">
      km/h
    </div>

  </div>


  <button
    class="startButton"
    onclick="startDrive()"
  >
    🚃 運転開始
  </button>

</div>


<!-- =====================================================
     運転画面
===================================================== -->

<div id="drive">


  <div id="board">
    快速・別府駅
  </div>


  <div id="nextBoard">

    <div
      id="nextText"
      class="nextText"
    >
      次は、経由地点を設定してください
    </div>

  </div>


  <div id="distanceBox">
    📍 目的地を設定してください
  </div>


  <div id="limitBox">
    🚦 制限 20 km/h
  </div>


  <div id="followBox">

    追従

    <input
      id="followSwitch"
      type="checkbox"
      checked
    >

  </div>


  <div id="modeBox">
    🎯 目的地設定
  </div>


  <button
    id="routeButton"
    onclick="toggleRoutePanel()"
  >
    📍 地点一覧
  </button>


  <div id="routePanel">

    <div class="routeTitle">
      設定地点
    </div>

    <div id="routeList"></div>

  </div>


  <div id="map"></div>


  <div id="overspeed">
    ⚠️ 速度超過
  </div>


  <div id="speedBox">

    <div id="speed">
      0
    </div>

    <div class="kmh">
      km/h
    </div>

  </div>


  <button
    id="finishButton"
    onclick="finishDrive()"
  >
    運転終了
  </button>


  <!-- ATS -->

  <div id="ats">

    <div
      id="atsText"
      class="atsWarning"
    >
      ⚠️ ATS作動
    </div>

    <div
      id="atsTimer"
      class="atsTimer"
    >
      自動終了まで 60 秒
    </div>

    <div class="slider">

      <div class="sliderText">
        スライドで解除
      </div>

      <div
        class="sliderButton"
        id="sliderButton"
      >
        →
      </div>

    </div>

  </div>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =====================================================
   基本変数
===================================================== */

let map = null;

let mapType = "apple";

let currentMarker = null;

let destination = null;

let destinationName = "";

let destinationMarker = null;

let viaPoints = [];

let viaNames = [];

let viaMarkers = [];

let currentViaIndex = 0;

let mode = "destination";

let watchID = null;

let speedLimit = 20;

let currentSpeed = 0;


/* =====================================================
   ATS
===================================================== */

let atsActive = false;

let atsTimer = null;

let atsCountdownTimer = null;

let atsSeconds = 60;

let atsType = "";

let destinationATSUsed = false;

let viaATSUsed = [];

let overspeedATSUsed = false;


/* =====================================================
   キンコン
===================================================== */

let bellTimer = null;

let bellActive = false;


/* =====================================================
   Audio
===================================================== */

let audioContext = null;

let atsSoundTimer = null;


/* =====================================================
   スライダー
===================================================== */

let startX = 0;

let sliderX = 0;


/* =====================================================
   Audio初期化
===================================================== */

function prepareAudio(){

  try{

    if(!audioContext){

      audioContext =
        new(
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    if(
      audioContext.state ===
      "suspended"
    ){

      audioContext.resume();

    }

  }catch(e){

    console.log(
      "Audio initialization error",
      e
    );

  }

}


/* =====================================================
   ATS 1発のジリリリ音
===================================================== */

function playATSBeep(){

  if(
    !audioContext
  ){

    prepareAudio();

  }


  if(
    !audioContext
  ){

    return;

  }


  const now =
    audioContext.currentTime;


  /*
   * 3つの短い音を連続させる
   * ジリリリ感を出す
   */

  for(
    let i=0;
    i<3;
    i++
  ){

    const start =
      now +
      i * 0.105;


    const osc =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();


    osc.type =
      "square";


    osc.frequency.setValueAtTime(
      i % 2 === 0
        ? 720
        : 880,
      start
    );


    gain.gain.setValueAtTime(
      0.0001,
      start
    );


    gain.gain.exponentialRampToValueAtTime(
      0.11,
      start + 0.008
    );


    gain.gain.exponentialRampToValueAtTime(
      0.001,
      start + 0.085
    );


    osc.connect(gain);

    gain.connect(
      audioContext.destination
    );


    osc.start(start);

    osc.stop(
      start + 0.09
    );

  }

}


/* =====================================================
   ATS開始
===================================================== */

function startAlarm(){

  prepareAudio();

  stopAlarm();


  /*
   * 0.45秒ごとに
   * ジリリリを繰り返す
   */

  playATSBeep();


  atsSoundTimer =
    setInterval(
      function(){

        if(
          atsActive
        ){

          playATSBeep();

        }

      },
      450
    );

}


/* =====================================================
   ATS停止
===================================================== */

function stopAlarm(){

  if(
    atsSoundTimer !== null
  ){

    clearInterval(
      atsSoundTimer
    );

    atsSoundTimer = null;

  }

}


/* =====================================================
   キンコン
===================================================== */

function playBell(){

  prepareAudio();

  if(
    !audioContext
  ){

    return;

  }


  const now =
    audioContext.currentTime;


  const osc1 =
    audioContext.createOscillator();

  const gain1 =
    audioContext.createGain();


  osc1.type =
    "sine";


  osc1.frequency.setValueAtTime(
    1046,
    now
  );


  gain1.gain.setValueAtTime(
    0.0001,
    now
  );


  gain1.gain.exponentialRampToValueAtTime(
    0.20,
    now + 0.008
  );


  gain1.gain.exponentialRampToValueAtTime(
    0.001,
    now + 0.30
  );


  osc1.connect(gain1);

  gain1.connect(
    audioContext.destination
  );


  osc1.start(now);

  osc1.stop(
    now + 0.32
  );


  setTimeout(
    function(){

      if(
        !audioContext
      ){

        return;

      }


      const now2 =
        audioContext.currentTime;


      const osc2 =
        audioContext.createOscillator();

      const gain2 =
        audioContext.createGain();


      osc2.type =
        "sine";


      osc2.frequency.setValueAtTime(
        784,
        now2
      );


      gain2.gain.setValueAtTime(
        0.0001,
        now2
      );


      gain2.gain.exponentialRampToValueAtTime(
        0.18,
        now2 + 0.008
      );


      gain2.gain.exponentialRampToValueAtTime(
        0.001,
        now2 + 0.34
      );


      osc2.connect(gain2);

      gain2.connect(
        audioContext.destination
      );


      osc2.start(now2);

      osc2.stop(
        now2 + 0.36
      );

    },
    135
  );

}


/* =====================================================
   30m判定
===================================================== */

function isWithin30m(point){

  if(
    !currentMarker ||
    !point
  ){

    return false;

  }


  return (
    currentMarker
      .getLatLng()
      .distanceTo(point)
    <= 30
  );

}


/* =====================================================
   キンコン停止条件
===================================================== */

function canStopBell(){

  if(
    !currentMarker
  ){

    return true;

  }


  /*
   * 一番近い経由地
   */

  for(
    let i=0;
    i<viaPoints.length;
    i++
  ){

    if(
      isWithin30m(
        viaPoints[i]
      )
    ){

      return true;

    }

  }


  /*
   * 目的地
   */

  if(
    destination &&
    isWithin30m(destination)
  ){

    return true;

  }


  /*
   * 速度ATS
   */

  if(
    atsType === "overspeed" &&
    currentSpeed <=
      Math.max(
        0,
        speedLimit - 3
      )
  ){

    return true;

  }


  return false;

}


/* =====================================================
   キンコン開始
===================================================== */

function startBell(){

  stopBell();


  if(
    canStopBell()
  ){

    return;

  }


  bellActive = true;

  playBell();


  bellTimer =
    setInterval(
      function(){

        if(
          canStopBell()
        ){

          stopBell();

          return;

        }


        playBell();

      },
      700
    );

}


/* =====================================================
   キンコン停止
===================================================== */

function stopBell(){

  if(
    bellTimer !== null
  ){

    clearInterval(
      bellTimer
    );

    bellTimer = null;

  }


  bellActive = false;

}

/* =====================================================
   地図初期化
===================================================== */

function initMap(){

  if(map){

    map.remove();

    map = null;

  }


  map =
    L.map(
      "map",
      {
        zoomControl:true
      }
    );


  let tileURL = "";

  let attribution = "";


  /*
   * Apple Maps風
   */

  if(
    mapType === "apple"
  ){

    tileURL =
      "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png";

    attribution =
      "&copy; OpenStreetMap &copy; CARTO";

  }


  /*
   * OSM
   */

  else if(
    mapType === "osm"
  ){

    tileURL =
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png";

    attribution =
      "&copy; OpenStreetMap contributors";

  }


  /*
   * ダーク
   */

  else{

    tileURL =
      "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png";

    attribution =
      "&copy; OpenStreetMap &copy; CARTO";

  }


  L.tileLayer(
    tileURL,
    {

      maxZoom:20,

      attribution:
        attribution,

      subdomains:
        "abcd"

    }
  ).addTo(map);


  /*
   * GPS
   */

  if(
    !navigator.geolocation
  ){

    alert(
      "この端末ではGPSを利用できません"
    );

    return;

  }


  navigator.geolocation.getCurrentPosition(

    function(position){

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;


      map.setView(
        [lat,lng],
        17
      );


      createCurrentMarker(
        lat,
        lng
      );


      startGPS();

    },


    function(){

      map.setView(
        [35.681236,139.767125],
        13
      );


      document.getElementById(
        "distanceBox"
      ).textContent =
        "📍 GPSを許可してください";

    },


    {
      enableHighAccuracy:true,

      timeout:10000,

      maximumAge:1000

    }

  );


  /*
   * 地図タップ
   */

  map.on(
    "click",
    function(e){

      setPoint(
        e.latlng.lat,
        e.latlng.lng
      );

    }
  );

}

   現在地マーカー

  lng
){

  const icon =
    L.divIcon(

        html:
          '<div class="current-marker"></div>',

        iconSize:
          [18,18],

        iconAnchor:
          [9,9]
      }
    );


  currentMarker =

      [lat,lng],
      {

      }
    )
    .addTo(map);

}


/* =====================================================
   地点設定
===================================================== */

function setPoint(
  lat,
  lng
){

  /*
   * 目的地
   */

  if(
    mode ===
    "destination"
  ){

    if(
      destinationMarker
    ){

      map.removeLayer(
        destinationMarker
      );

    }


    destination =
      L.latLng(
        lat,
        lng
      );


    destinationMarker =
      L.marker(
        [lat,lng]
      )
      .addTo(map)
      .bindPopup(
        "🎯 " +
        destinationName
      );


    mode =
      "via";


    updateMode();

    updateRouteList();

    updateNextBoard();


    document.getElementById(
      "distanceBox"
    ).textContent =
      "📍 経由地点を設定してください";


    return;

  }


  /*
   * 経由地点
   */

  if(
    mode ===
    "via"
  ){

    /*
     * 経由地点名を入力
     */

    const name =
      prompt(
        "経由地点の名前を入力してください",
        "ローソン"
      );


    if(
      name === null
    ){

      return;

    }


    addViaPoint(
      lat,
      lng,
      name.trim() ||
      "経由地点 " +
      (viaPoints.length + 1)
    );

  }

}


/* =====================================================
   経由追加
===================================================== */

function addViaPoint(
  lat,
  lng,
  name
){

  const point =
    L.latLng(
      lat,
      lng
    );


  viaPoints.push(
    point
  );


  viaNames.push(
    name
  );


  viaATSUsed.push(
    false
  );


  const marker =
    L.marker(
      [lat,lng]
    )
    .addTo(map)
    .bindPopup(
      "📍 " +
      name
    );


  viaMarkers.push(
    marker
  );


  updateRouteList();

  updateNextBoard();

}

  }

}


/* =====================================================
   一番近い未到達地点
===================================================== */

function getNearestTarget(){

  if(
    !currentMarker
  ){

    return null;

  }


  const current =
    currentMarker.getLatLng();


  let nearest = null;

  let nearestDistance =
    Infinity;


  /*
   * まだ到達していない
   * 経由地を全部検索
   */

  for(
    let i =
      currentViaIndex;
    i <
      viaPoints.length;
    i++
  ){

    const distance =
      current.distanceTo(
        viaPoints[i]
      );


    if(
      distance <
      nearestDistance
    ){

      nearestDistance =
        distance;


      nearest = {

        type:"via",

        index:i,

        name:
          viaNames[i],

        point:
          viaPoints[i],

        distance:
          distance

      };

    }

  }


  /*
   * 目的地
   */

  if(
    destination
  ){

    const distance =
      current.distanceTo(
        destination
      );


    /*
     * 経由地がない場合、
     * または目的地のほうが近い場合
     */

    if(
      distance <
      nearestDistance
    ){

      nearest = {

        type:"destination",

        index:-1,

        name:
          destinationName,

        point:
          destination,

        distance:
          distance

      };

    }

  }


  return nearest;

}


/* =====================================================
   距離表示更新
===================================================== */

function updateDistanceDisplay(){

  const target =
    getNearestTarget();


  const box =
    document.getElementById(
      "distanceBox"
    );


  if(
    !target
  ){

    box.textContent =
      "📍 目的地を設定してください";

    return;

  }


  const km =
    target.distance / 1000;


  let distanceText;


  if(
    target.distance >= 1000
  ){

    distanceText =
      km.toFixed(1) +
      " km";

  }
  else{

    distanceText =
      Math.round(
        target.distance
      ) +
      " m";

  }


  if(
    target.type ===
    "via"
  ){

    box.textContent =
      "📍 " +
      target.name +
      "まで " +
      distanceText;

  }
  else{

    box.textContent =
      "🎯 " +
      target.name +
      "まで " +
      distanceText;

  }

}

   地点一覧
===================================================== */

function updateRouteList(){

  const list =
    document.getElementById(
      "routeList"
    );


  list.innerHTML = "";


  /*

   */

  if(
    destination

    button.onclick =

        deleteDestination();

      };


    item.appendChild(text);

  viaPoints.forEach(

      button.textContent =

      item.appendChild(text);

/* =====================================================
   目的地削除
===================================================== */

function deleteDestination(){

  if(
    !confirm(
      "目的地を削除しますか？"
    )
  ){

    return;

  }


  if(
    destinationMarker
  ){

    map.removeLayer(
      destinationMarker
    );

  }


  destination =
    null;

  destinationMarker =
    null;


  mode =
    "destination";


  destinationATSUsed =
    false;


  updateMode();

  updateRouteList();

  updateNextBoard();


  document.getElementById(
    "distanceBox"
  ).textContent =
    "🎯 新しい目的地を設定してください";

}


/* =====================================================
   経由削除
===================================================== */

function deleteViaPoint(
  index
){

  if(
    !confirm(
      "この経由地点を削除しますか？"
    )
  ){

    return;

  }


  if(
    viaMarkers[index]
  ){

    map.removeLayer(
      viaMarkers[index]
    );

  }


  viaMarkers.splice(
    index,
    1
  );


  viaPoints.splice(
    index,
    1
  );


  viaNames.splice(
    index,
    1
  );


  viaATSUsed.splice(
    index,
    1
  );


  if(
    currentViaIndex >
    index
  ){

    currentViaIndex--;

  }


  if(
    currentViaIndex >=
    viaPoints.length
  ){

    currentViaIndex =
      Math.max(
        0,
        viaPoints.length - 1
      );

  }


  updateRouteList();

  updateNextBoard();

}

/* =====================================================
   GPS
===================================================== */

function startGPS(){

  if(
    watchID !== null
  ){

    navigator.geolocation.clearWatch(
      watchID
    );

  }


  watchID =
    navigator.geolocation.watchPosition(

      function(position){

        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;


        /* =========================
           速度
        ========================= */

        let speed =
          position.coords.speed;


        if(
          speed === null ||
          speed < 0
        ){

          speed = 0;

        }


        speed =
          speed * 3.6;


        currentSpeed =
          speed;


        document.getElementById(
          "speed"
        ).textContent =
          Math.round(
            speed
          );


        /* =========================
           現在地
        ========================= */

        if(
          currentMarker
        ){

          currentMarker.setLatLng(
            [lat,lng]
          );

        }


        /* =========================
           追従
        ========================= */

        const follow =
          document.getElementById(
            "followSwitch"
          ).checked;


        if(
          follow &&
          map
        ){

          map.panTo(
            [lat,lng],
            {
              animate:true,
              duration:.5
            }
          );

        }


        /* =========================
           速度超過
        ========================= */

        if(
          speed >
          speedLimit
        ){

          document.getElementById(
            "overspeed"
          ).style.display =
            "block";


          if(
            !atsActive &&
            !overspeedATSUsed
          ){

            overspeedATSUsed =
              true;


            activateATS(
              "⚠️ 速度超過ATS",
              "overspeed"
            );

          }

        }
        else{

          document.getElementById(
            "overspeed"
          ).style.display =
            "none";

          /*
           * 制限速度-3まで戻ったら
           * キンコン停止
           */

          if(
            atsType ===
            "overspeed" &&
            speed <=
            Math.max(
              0,
              speedLimit - 3
            )
          ){

            stopBell();

          }

        }


        /* =========================
           距離更新
        ========================= */

        updateDistanceDisplay();


        if(
          !destination
        ){

          return;

        }


        const current =
          L.latLng(
            lat,
            lng
          );


        /* =========================
           経由地点判定
        ========================= */

        if(
          currentViaIndex <
          viaPoints.length
        ){

          const via =
            viaPoints[
              currentViaIndex
            ];


          const distance =
            current.distanceTo(
              via
            );


          /*
           * 30m到達
           */

          if(
            distance <= 30
          ){

            stopBell();


            /*
             * 次の経由地点へ
             */

            currentViaIndex++;


            updateNextBoard();

            updateDistanceDisplay();


            /*
             * まだ経由地があれば
             * その地点へ
             */

            return;

          }


          /*
           * 100mでATS
           */

          if(
            distance <= 100 &&
            !atsActive &&
            !viaATSUsed[
              currentViaIndex
            ]
          ){

            viaATSUsed[
              currentViaIndex
            ] = true;


            activateATS(
              "⚠️ " +
              viaNames[
                currentViaIndex
              ] +
              " ATS",
              "via"
            );

            return;

          }


          return;

        }


        /* =========================
           目的地
        ========================= */

        const distance =
          current.distanceTo(
            destination
          );


        /*
         * 30m到達
         */

        if(
          distance <= 30
        ){

          stopBell();

        }


        /*
         * 200m ATS
         */

        if(
          distance <= 200 &&
          !atsActive &&
          !destinationATSUsed
        ){

          destinationATSUsed =
            true;


          activateATS(
            "🏁 " +
            destinationName +
            " 到着ATS",
            "destination"
          );

        }

      },


      function(error){

        console.log(
          "GPS error:",
          error
        );


        document.getElementById(
          "distanceBox"
        ).textContent =
          "📍 GPS取得失敗";

      },


      {

        enableHighAccuracy:true,

        maximumAge:1000,

        timeout:10000

      }

    );

}


/* =====================================================
   ATS作動
===================================================== */

function activateATS(
  message,
  type
){

  /*
   * すでにATSなら何もしない
   */

  if(
    atsActive
  ){

    return;

  }


  atsActive =
    true;


  atsType =
    type;


  atsSeconds =
    60;


  /*
   * キンコン停止
   */

  stopBell();


  /*
   * 終了ボタン
   */

  document.getElementById(
    "finishButton"
  ).style.display =
    "none";


  /*
   * ATS表示
   */

  document.getElementById(
    "ats"
  ).style.display =
    "block";


  document.getElementById(
    "atsText"
  ).textContent =
    message;


  document.getElementById(
    "atsTimer"
  ).textContent =
    "自動終了まで 60 秒";


  /*
   * Audio再開
   */

  prepareAudio();


  if(
    audioContext &&
    audioContext.state ===
    "suspended"
  ){

    audioContext.resume();

  }


  /*
   * ジリリリ開始
   */

  startAlarm();


  /*
   * バイブ
   */

  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      [300,200,300]
    );

  }


  /*
   * カウントダウン
   */

  clearInterval(
    atsCountdownTimer
  );


  atsCountdownTimer =
    setInterval(
      function(){

        if(
          !atsActive
        ){

          return;

        }


        atsSeconds--;


        document.getElementById(
          "atsTimer"
        ).textContent =
          "自動終了まで " +
          Math.max(
            0,
            atsSeconds
          ) +
          " 秒";


        if(
          atsSeconds <= 0
        ){

          releaseATS();

        }

      },
      1000
    );


  /*
   * 念のため60秒で強制解除
   */

  clearTimeout(
    atsTimer
  );


  atsTimer =
    setTimeout(
      function(){

        releaseATS();

      },
      60000
    );

}


/* =====================================================
   ATS解除
===================================================== */

function releaseATS(){

  if(
    !atsActive
  ){

    return;

  }


  atsActive =
    false;


  clearTimeout(
    atsTimer
  );


  clearInterval(
    atsCountdownTimer
  );


  atsTimer = null;

  atsCountdownTimer = null;


  /*
   * 音停止
   */

  stopAlarm();


  /*
   * バイブ停止
   */

  if(
    navigator.vibrate
  ){

    navigator.vibrate(0);

  }


  /*
   * ATS画面
   */

  document.getElementById(
    "ats"
  ).style.display =
    "none";


  /*
   * 終了ボタン
   */

  document.getElementById(
    "finishButton"
  ).style.display =
    "block";


  /*
   * 速度ATSなら
   * 速度がまだ高ければキンコンを
   * 再開しない
   */

  if(
    atsType ===
    "overspeed" &&
    currentSpeed >
    speedLimit - 3
  ){

    return;

  }


  /*
   * 30m以内なら鳴らさない
   */

  if(
    canStopBell()
  ){

    return;

  }


  /*
   * ATS解除後
   * キンコン再開
   */

  startBell();

}


/* =====================================================
   ATSスライダー
===================================================== */

const sliderButton =
  document.getElementById(
    "sliderButton"
  );


sliderButton.addEventListener(
  "touchstart",
  function(e){

    if(
      !atsActive
    ){

      return;

    }


    startX =
      e.touches[0].clientX;

    sliderX = 0;

  },
  {
    passive:true
  }
);


sliderButton.addEventListener(
  "touchmove",
  function(e){

    if(
      !atsActive
    ){

      return;

    }


    const x =
      e.touches[0].clientX;


    sliderX =
      x - startX;


    if(
      sliderX < 0
    ){

      sliderX = 0;

    }


    const slider =
      sliderButton.parentElement;


    const max =
      slider.clientWidth -
      sliderButton.clientWidth -
      10;


    if(
      sliderX > max
    ){

      sliderX = max;

    }


    sliderButton.style.transform =
      "translateX(" +
      sliderX +
      "px)";

  },
  {
    passive:true
  }
);


sliderButton.addEventListener(
  "touchend",
  function(){

    if(
      !atsActive
    ){

      return;

    }


    const slider =
      sliderButton.parentElement;


    const max =
      slider.clientWidth -
      sliderButton.clientWidth -
      10;


    if(
      sliderX >=
      max * .7
    ){

      releaseATS();

    }


    sliderButton.style.transform =
      "translateX(0)";


    sliderX = 0;

  }
);


/* =====================================================
   運転終了
===================================================== */

function finishDrive(){

  if(
    atsActive
  ){

    return;

  }


  if(
    !confirm(
      "運転を終了しますか？"
    )
  ){

    return;

  }


  stopAlarm();

  stopBell();


  clearTimeout(
    atsTimer
  );

  clearInterval(
    atsCountdownTimer
  );


  if(
    watchID !== null
  ){

    navigator.geolocation.clearWatch(
      watchID
    );

    watchID = null;

  }


  viaMarkers.forEach(
    function(marker){

      if(map){

        map.removeLayer(
          marker
        );

      }

    }
  );


  if(
    destinationMarker &&
    map
  ){

    map.removeLayer(
      destinationMarker
    );

  }


  if(
    currentMarker &&
    map
  ){

    map.removeLayer(
      currentMarker
    );

  }


  destination = null;

  destinationMarker = null;

  viaPoints = [];

  viaNames = [];

  viaMarkers = [];

  viaATSUsed = [];

  currentViaIndex = 0;

  destinationATSUsed = false;

  overspeedATSUsed = false;

  atsActive = false;

  atsType = "";

  mode =
    "destination";

  currentSpeed = 0;


  document.getElementById(
    "drive"
  ).style.display =
    "none";


  document.getElementById(
    "setup"
  ).style.display =
    "block";


  document.getElementById(
    "routePanel"
  ).style.display =
    "none";


  document.getElementById(
    "speed"
  ).textContent =
    "0";


  document.getElementById(
    "overspeed"
  ).style.display =
    "none";


  document.getElementById(
    "ats"
  ).style.display =
    "none";


  sliderButton.style.transform =
    "translateX(0)";


  sliderX = 0;


  currentMarker = null;

}


/* =====================================================
   終了時
===================================================== */

window.addEventListener(
  "beforeunload",
  function(){

    stopAlarm();

    stopBell();


    if(
      watchID !== null &&
      navigator.geolocation
    ){

      navigator.geolocation.clearWatch(
        watchID
      );

    }

  }
);

</script>
