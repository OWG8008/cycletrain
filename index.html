<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>cycletrain</title>

<!-- Leaflet -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080b10;
  color: white;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    sans-serif;
}

/* =====================
   設定画面
===================== */

#setup {
  height: 100vh;
  padding: 30px 22px;
}

.logo {
  text-align: center;
  font-size: 32px;
  font-weight: bold;
  margin: 25px 0 40px;
}

label {
  display: block;
  margin: 20px 0 8px;
  color: #aaa;
}

select,
input {
  width: 100%;
  height: 55px;
  padding: 0 15px;

  border-radius: 15px;
  border: 1px solid #363d48;

  background: #171c24;
  color: white;

  font-size: 18px;
}

.startButton {
  width: 100%;
  height: 60px;

  margin-top: 25px;

  border: none;
  border-radius: 17px;

  background: #238636;
  color: white;

  font-size: 19px;
  font-weight: bold;
}

/* =====================
   運転画面
===================== */

#drive {
  display: none;
  height: 100vh;
  position: relative;
}

/* 幕 */

#board {
  height: 75px;

  background: #050505;
  border-bottom: 3px solid #333;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 24px;
  font-weight: bold;

  white-space: nowrap;
}

/* 地図 */

#map {
  height: calc(100vh - 280px);
  width: 100%;
}

/* Leafletの現在地マーカー */

.currentMarker {
  font-size: 35px;
}

/* 目的地 */

.destinationMarker {
  font-size: 35px;
}

/* 目的地表示 */

#destinationInfo {

  position: absolute;

  top: 85px;
  left: 10px;

  z-index: 1000;

  background: rgba(0,0,0,0.75);

  padding: 8px 12px;

  border-radius: 10px;

  font-size: 13px;
}

/* =====================
   速度
===================== */

#speedBox {

  position: absolute;

  bottom: 120px;
  left: 0;

  width: 100%;

  text-align: center;

  z-index: 1000;

  pointer-events: none;
}

#speed {

  font-size: 50px;
  font-weight: bold;
}

.kmh {

  color: #aaa;
}

/* =====================
   下ボタン
===================== */

#finishButton {

  position: absolute;

  bottom: 20px;
  left: 20px;

  width: calc(100% - 40px);

  height: 65px;

  border: none;
  border-radius: 18px;

  background: #252b34;

  color: white;

  font-size: 20px;
  font-weight: bold;

  z-index: 1000;
}

/* =====================
   ATS
===================== */

#ats {

  display: none;

  position: absolute;

  bottom: 20px;
  left: 20px;

  width: calc(100% - 40px);

  z-index: 2000;
}

.atsWarning {

  text-align: center;

  color: #ff453a;

  font-weight: bold;

  margin-bottom: 8px;
}

.slider {

  height: 65px;

  background: #252b34;

  border-radius: 18px;

  position: relative;

  overflow: hidden;

  touch-action: none;
}

.sliderText {

  position: absolute;

  width: 100%;
  height: 100%;

  display: flex;

  justify-content: center;
  align-items: center;

  color: #aaa;
}

.sliderButton {

  position: absolute;

  left: 5px;
  top: 5px;

  width: 55px;
  height: 55px;

  border-radius: 15px;

  background: #ff453a;

  display: flex;

  justify-content: center;
  align-items: center;

  font-size: 25px;

  touch-action: none;
}

</style>

</head>


<body>


<!-- =====================
     設定
===================== -->

<div id="setup">

  <div class="logo">
    🚲 cycletrain
  </div>

  <label>
    種別
  </label>

  <select id="type">

    <option>普通</option>
    <option>快速</option>
    <option>急行</option>
    <option>特急</option>
    <option>新快速</option>

  </select>


  <label>
    行き先
  </label>

  <input
    id="destination"
    placeholder="例：別府駅"
  >


  <button
    class="startButton"
    onclick="startDrive()"
  >

    🚃 運転開始

  </button>

</div>


<!-- =====================
     運転
===================== -->

<div id="drive">

  <div id="board">
    快速・別府駅行き
  </div>


  <div id="destinationInfo">
    📍 地図をタップして目的地設定
  </div>


  <div id="map"></div>


  <div id="speedBox">

    <div id="speed">
      0
    </div>

    <div class="kmh">
      km/h
    </div>

  </div>


  <button
    id="finishButton"
    onclick="finishDrive()"
  >

    運転終了

  </button>


  <!-- ATS -->

  <div id="ats">

    <div class="atsWarning">
      ⚠️ ATS作動
    </div>

    <div class="slider">

      <div class="sliderText">
        スライドで解除
      </div>

      <div
        class="sliderButton"
        id="sliderButton"
      >
        →
      </div>

    </div>

  </div>

</div>


<!-- Leaflet -->

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =====================
   変数
===================== */

let map;

let currentMarker;

let destinationMarker;

let watchID;

let destination = null;

let atsActive = false;

let startX = 0;

let sliderX = 0;


/* =====================
   運転開始
===================== */

function startDrive() {

  const type =
    document.getElementById("type").value;

  const destinationName =
    document
      .getElementById("destination")
      .value
      .trim();


  if (!destinationName) {

    alert("行き先を入力してください");

    return;

  }


  document.getElementById("board")
    .textContent =
      type + "・" +
      destinationName +
      "行き";


  document.getElementById("setup")
    .style.display = "none";

  document.getElementById("drive")
    .style.display = "block";


  /* 地図作成 */

  initMap();

}


/* =====================
   地図
===================== */

function initMap() {

  if (map) {

    map.invalidateSize();

    return;

  }


  /*
   * 最初は日本中心
   */

  map =
    L.map("map");


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,

      attribution:
        '&copy; OpenStreetMap contributors'
    }
  ).addTo(map);


  /*
   * GPS取得
   */

  if (
    navigator.geolocation
  ) {

    navigator.geolocation.getCurrentPosition(

      function(position) {

        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;


        map.setView(
          [lat, lng],
          17
        );


        currentMarker =
          L.marker(
            [lat, lng]
          )
          .addTo(map)
          .bindPopup(
            "🚲 現在地"
          );


        startGPS();

      },

      function() {

        /*
         * GPS失敗時
         */

        map.setView(
          [35.681236, 139.767125],
          13
        );

      },

      {
        enableHighAccuracy: true,
        timeout: 10000
      }

    );

  }

  else {

    map.setView(
      [35.681236, 139.767125],
      13
    );

  }


  /*
   * 地図をタップ
   */

  map.on(
    "click",
    function(e) {

      setDestination(
        e.latlng.lat,
        e.latlng.lng
      );

    }
  );

}


/* =====================
   目的地設定
===================== */

function setDestination(
  lat,
  lng
) {

  destination =
    L.latLng(lat, lng);


  /* 古い目的地を消す */

  if (destinationMarker) {

    map.removeLayer(
      destinationMarker
    );

  }


  /* 新しい目的地 */

  destinationMarker =
    L.marker(
      [lat, lng]
    )
    .addTo(map)
    .bindPopup(
      "📍 目的地"
    )
    .openPopup();


  document.getElementById(
    "destinationInfo"
  ).textContent =
    "📍 目的地設定済み";


}


/* =====================
   GPS
===================== */

function startGPS() {

  watchID =
    navigator.geolocation.watchPosition(

      function(position) {

        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;


        let speed =
          position.coords.speed;


        if (
          speed === null ||
          speed < 0
        ) {

          speed = 0;

        }


        speed =
          speed * 3.6;


        document.getElementById(
          "speed"
        ).textContent =
          Math.round(speed);


        /*
         * 現在地マーカー更新
         */

        if (currentMarker) {

          currentMarker.setLatLng(
            [lat, lng]
          );

        }


        /*
         * 目的地が設定されている場合
         */

        if (destination) {

          const current =
            L.latLng(lat, lng);


          const distance =
            current.distanceTo(
              destination
            );


          document.getElementById(
            "destinationInfo"
          ).textContent =
            "📍 目的地まで " +
            Math.round(distance) +
            " m";


          /*
           * 200m以内
           */

          if (
            distance <= 200 &&
            !atsActive
          ) {

            activateATS();

          }

        }

      },

      function() {

        document.getElementById(
          "destinationInfo"
        ).textContent =
          "📍 GPSを取得できません";

      },

      {
        enableHighAccuracy: true,

        maximumAge: 1000,

        timeout: 10000

      }

    );

}


/* =====================
   ATS
===================== */

function activateATS() {

  atsActive = true;


  document.getElementById(
    "finishButton"
  ).style.display = "none";


  document.getElementById(
    "ats"
  ).style.display = "block";


  /* テスト用音 */

  beep();

}


/* =====================
   ATS音
===================== */

function beep() {

  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;


  if (!AudioContext) return;


  const audio =
    new AudioContext();


  const oscillator =
    audio.createOscillator();

  const gain =
    audio.createGain();


  oscillator.type =
    "square";

  oscillator.frequency.value =
    700;

  gain.gain.value =
    0.12;


  oscillator.connect(gain);

  gain.connect(
    audio.destination
  );


  oscillator.start();


  setTimeout(
    function() {

      oscillator.stop();

      audio.close();

    },
    300
  );

}


/* =====================
   スライド
===================== */

const sliderButton =
  document.getElementById(
    "sliderButton"
  );


sliderButton.addEventListener(
  "touchstart",
  function(e) {

    if (!atsActive) return;

    startX =
      e.touches[0].clientX;

  }
);


sliderButton.addEventListener(
  "touchmove",
  function(e) {

    if (!atsActive) return;


    const x =
      e.touches[0].clientX;


    sliderX =
      x - startX;


    if (sliderX < 0)
      sliderX = 0;


    if (sliderX > 250)
      sliderX = 250;


    sliderButton.style.transform =
      "translateX(" +
      sliderX +
      "px)";

  }
);


sliderButton.addEventListener(
  "touchend",
  function() {

    if (!atsActive) return;


    if (sliderX >= 190) {

      atsActive = false;


      document.getElementById(
        "ats"
      ).style.display =
        "none";


      document.getElementById(
        "finishButton"
      ).style.display =
        "block";


      sliderButton.style.transform =
        "translateX(0)";


      sliderX = 0;

    }

    else {

      sliderButton.style.transform =
        "translateX(0)";

      sliderX = 0;

    }

  }
);


/* =====================
   終了
===================== */

function finishDrive() {

  if (atsActive) return;


  if (
    !confirm(
      "運転を終了しますか？"
    )
  ) return;


  if (watchID) {

    navigator.geolocation.clearWatch(
      watchID
    );

    watchID = null;

  }


  document.getElementById(
    "drive"
  ).style.display =
    "none";


  document.getElementById(
    "setup"
  ).style.display =
    "block";

}

</script>

</body>
</html>
