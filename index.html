<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>cycletrain</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


<style>

/* =====================================================
   基本
===================================================== */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
}

body{
  background:#f2f2f7;
  color:#111;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    sans-serif;

  overflow:hidden;
}


/* =====================================================
   設定画面
===================================================== */

#setup{

  width:100%;
  height:100vh;

  padding:28px 20px;

  overflow-y:auto;

  background:
    radial-gradient(
      circle at 20% 0%,
      rgba(0,122,255,.20),
      transparent 35%
    ),
    radial-gradient(
      circle at 100% 100%,
      rgba(120,100,255,.18),
      transparent 40%
    ),
    #f2f2f7;

}


.logo{

  text-align:center;

  font-size:34px;

  font-weight:850;

  letter-spacing:-1px;

  margin:25px 0 40px;

}


label{

  display:block;

  color:#666;

  margin:20px 4px 8px;

  font-size:14px;

  font-weight:600;

}


select,
input{

  width:100%;

  height:57px;

  padding:0 16px;

  border-radius:18px;

  border:1px solid rgba(0,0,0,.08);

  background:rgba(255,255,255,.72);

  color:#111;

  font-size:18px;

  outline:none;

  backdrop-filter:blur(18px);

  -webkit-backdrop-filter:blur(18px);

  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.8),
    0 5px 18px rgba(0,0,0,.06);

}


select:focus,
input:focus{

  border-color:#007aff;

}


.speedSetting{

  display:flex;

  align-items:center;

  gap:10px;

}


.speedSetting input{

  flex:1;

}


.speedUnit{

  color:#777;

  font-size:15px;

}


/* =====================================================
   運転開始ボタン
===================================================== */

.startButton{

  width:100%;

  height:62px;

  margin-top:30px;

  border:0;

  border-radius:21px;

  background:#007aff;

  color:white;

  font-size:19px;

  font-weight:750;

  box-shadow:
    0 8px 20px rgba(0,122,255,.28),
    inset 0 1px 0 rgba(255,255,255,.3);

  transition:.15s;

}


.startButton:active{

  transform:scale(.97);

}


/* =====================================================
   運転画面
===================================================== */

#drive{

  display:none;

  height:100vh;

  position:relative;

  background:#e9eef3;

}


/* =====================================================
   行先表示
===================================================== */

#board{

  height:72px;

  display:flex;

  align-items:center;

  justify-content:center;

  position:absolute;

  top:12px;

  left:50%;

  transform:translateX(-50%);

  width:calc(100% - 24px);

  z-index:1500;

  border-radius:24px;

  font-size:24px;

  font-weight:850;

  white-space:nowrap;

  overflow:hidden;

  background:rgba(255,255,255,.72);

  backdrop-filter:
    blur(28px)
    saturate(180%);

  -webkit-backdrop-filter:
    blur(28px)
    saturate(180%);

  border:1px solid rgba(255,255,255,.8);

  box-shadow:
    0 8px 30px rgba(0,0,0,.13),
    inset 0 1px 0 rgba(255,255,255,.9);

}


/* =====================================================
   種別カラー
===================================================== */

.board-normal{
  color:#ffffff;
  background:rgba(80,80,85,.72)!important;
}

.board-newrapid{
  color:#ffffff;
  background:rgba(0,122,255,.78)!important;
}

.board-other{
  color:#ffffff;
  background:rgba(255,59,48,.78)!important;
}


/* =====================================================
   マップ
===================================================== */

#map{

  width:100%;

  height:100vh;

  background:#e8edf1;

}


.leaflet-tile{

  filter:
    saturate(1.08)
    contrast(.96)
    brightness(1.04);

}


.leaflet-control-zoom{

  border:0!important;

  border-radius:17px!important;

  overflow:hidden;

  box-shadow:
    0 6px 20px rgba(0,0,0,.16)!important;

}


.leaflet-control-zoom a{

  background:rgba(255,255,255,.75)!important;

  backdrop-filter:blur(20px);

  -webkit-backdrop-filter:blur(20px);

  color:#222!important;

  border:0!important;

}


.leaflet-control-attribution{

  background:rgba(255,255,255,.55)!important;

  backdrop-filter:blur(12px);

  -webkit-backdrop-filter:blur(12px);

}


/* =====================================================
   距離
===================================================== */

#distanceBox{

  position:absolute;

  top:96px;

  left:12px;

  z-index:1600;

  padding:10px 14px;

  border-radius:16px;

  background:rgba(255,255,255,.70);

  backdrop-filter:blur(22px);

  -webkit-backdrop-filter:blur(22px);

  border:1px solid rgba(255,255,255,.8);

  box-shadow:
    0 6px 22px rgba(0,0,0,.12);

  font-size:14px;

  color:#111;

}


/* =====================================================
   制限速度
===================================================== */

#limitBox{

  position:absolute;

  top:96px;

  right:12px;

  z-index:1600;

  padding:10px 14px;

  border-radius:16px;

  background:rgba(255,255,255,.70);

  backdrop-filter:blur(22px);

  -webkit-backdrop-filter:blur(22px);

  border:1px solid rgba(255,255,255,.8);

  box-shadow:
    0 6px 22px rgba(0,0,0,.12);

  font-size:14px;

}


/* =====================================================
   追従
===================================================== */

#followBox{

  position:absolute;

  top:145px;

  left:12px;

  z-index:1600;

  padding:8px 11px;

  border-radius:16px;

  background:rgba(255,255,255,.70);

  backdrop-filter:blur(22px);

  -webkit-backdrop-filter:blur(22px);

  border:1px solid rgba(255,255,255,.8);

  display:flex;

  align-items:center;

  gap:7px;

  font-size:13px;

}


#followSwitch{

  width:45px;

  height:25px;

  appearance:none;

  background:#aaa;

  border-radius:20px;

  position:relative;

  outline:none;

  padding:0;

  border:0;

}


#followSwitch:checked{

  background:#34c759;

}


#followSwitch::after{

  content:"";

  position:absolute;

  width:21px;

  height:21px;

  top:2px;

  left:2px;

  background:white;

  border-radius:50%;

  transition:.2s;

  box-shadow:
    0 2px 5px rgba(0,0,0,.2);

}


#followSwitch:checked::after{

  transform:translateX(20px);

}


/* =====================================================
   モード
===================================================== */

#modeBox{

  position:absolute;

  top:145px;

  right:12px;

  z-index:1600;

  padding:9px 12px;

  border-radius:16px;

  background:rgba(255,255,255,.70);

  backdrop-filter:blur(22px);

  -webkit-backdrop-filter:blur(22px);

  border:1px solid rgba(255,255,255,.8);

  font-size:13px;

}


/* =====================================================
   地点一覧
===================================================== */

#routeButton{

  position:absolute;

  top:190px;

  right:12px;

  z-index:1600;

  border:1px solid rgba(255,255,255,.8);

  border-radius:16px;

  background:rgba(255,255,255,.72);

  backdrop-filter:blur(22px);

  -webkit-backdrop-filter:blur(22px);

  color:#111;

  padding:10px 13px;

  font-size:13px;

  box-shadow:
    0 6px 18px rgba(0,0,0,.10);

}


#routePanel{

  display:none;

  position:absolute;

  top:240px;

  right:12px;

  width:240px;

  max-height:300px;

  overflow-y:auto;

  z-index:1700;

  padding:10px;

  border-radius:20px;

  background:rgba(255,255,255,.72);

  backdrop-filter:blur(28px);

  -webkit-backdrop-filter:blur(28px);

  border:1px solid rgba(255,255,255,.85);

  box-shadow:
    0 12px 35px rgba(0,0,0,.18);

}


.routeTitle{

  color:#777;

  font-size:13px;

  padding:5px 7px 9px;

}


.routeItem{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:5px;

  padding:9px;

  margin-bottom:6px;

  background:rgba(255,255,255,.65);

  border-radius:13px;

  font-size:13px;

}


.deleteRoute{

  border:0;

  border-radius:9px;

  background:#ff3b30;

  color:white;

  padding:6px 8px;

  font-weight:600;

}


/* =====================================================
   速度
===================================================== */

#speedBox{

  position:absolute;

  bottom:118px;

  left:0;

  width:100%;

  text-align:center;

  z-index:1600;

  pointer-events:none;

}


#speed{

  font-size:55px;

  font-weight:850;

  letter-spacing:-2px;

  text-shadow:
    0 2px 10px rgba(0,0,0,.15);

}


.kmh{

  color:#666;

  font-size:15px;

}


/* =====================================================
   速度超過
===================================================== */

#overspeed{

  display:none;

  position:absolute;

  bottom:185px;

  left:0;

  width:100%;

  text-align:center;

  z-index:1800;

  color:#ff3b30;

  font-size:19px;

  font-weight:800;

}


/* =====================================================
   終了ボタン
===================================================== */

#finishButton{

  position:absolute;

  left:20px;

  bottom:20px;

  width:calc(100% - 40px);

  height:62px;

  border:1px solid rgba(255,255,255,.8);

  border-radius:21px;

  background:rgba(255,255,255,.70);

  backdrop-filter:blur(25px);

  -webkit-backdrop-filter:blur(25px);

  color:#111;

  font-size:19px;

  font-weight:750;

  z-index:2000;

  box-shadow:
    0 8px 25px rgba(0,0,0,.13);

}


/* =====================================================
   ATS
===================================================== */

#ats{

  display:none;

  position:absolute;

  left:14px;

  bottom:14px;

  width:calc(100% - 28px);

  z-index:3000;

  padding:14px;

  border-radius:25px;

  background:rgba(255,255,255,.66);

  backdrop-filter:
    blur(30px)
    saturate(180%);

  -webkit-backdrop-filter:
    blur(30px)
    saturate(180%);

  border:1px solid rgba(255,255,255,.85);

  box-shadow:
    0 15px 45px rgba(0,0,0,.22),
    inset 0 1px 0 rgba(255,255,255,.9);

}


.atsWarning{

  text-align:center;

  color:#ff3b30;

  font-size:18px;

  font-weight:800;

  margin-bottom:7px;

}


.atsTimer{

  text-align:center;

  color:#777;

  font-size:13px;

  margin-bottom:7px;

}


.slider{

  position:relative;

  height:65px;

  border-radius:19px;

  background:rgba(0,0,0,.08);

  overflow:hidden;

  touch-action:none;

}


.sliderText{

  position:absolute;

  width:100%;

  height:100%;

  display:flex;

  align-items:center;

  justify-content:center;

  color:#888;

  font-size:17px;

}


.sliderButton{

  position:absolute;

  left:5px;

  top:5px;

  width:55px;

  height:55px;

  border-radius:16px;

  background:#ff3b30;

  color:white;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:25px;

  z-index:10;

  touch-action:none;

  box-shadow:
    0 5px 12px rgba(255,59,48,.3);

}


/* =====================================================
   マーカー
===================================================== */

.current-location-marker{

  width:22px;

  height:22px;

  background:#007aff;

  border:4px solid white;

  border-radius:50%;

  box-shadow:
    0 2px 12px rgba(0,122,255,.45);

}


.destination-marker{

  width:24px;

  height:24px;

  background:#ff3b30;

  border:4px solid white;

  border-radius:50%;

  box-shadow:
    0 3px 12px rgba(255,59,48,.4);

}


.leaflet-popup-content-wrapper,
.leaflet-popup-tip{

  background:rgba(255,255,255,.78)!important;

  backdrop-filter:blur(18px);

  -webkit-backdrop-filter:blur(18px);

  border:1px solid rgba(255,255,255,.8);

}


.leaflet-popup-content{

  font-weight:600;

}


/* =====================================================
   スマホ
===================================================== */

@media(max-width:430px){

  #board{

    font-size:22px;

  }

  #speed{

    font-size:50px;

  }

}

</style>

</head>


<body>


<!-- =====================================================
     設定
===================================================== -->

<div id="setup">

  <div class="logo">
    🚲 cycletrain
  </div>


  <label>
    種別
  </label>


  <select id="type">

    <option>普通</option>

    <option>快速</option>

    <option>急行</option>

    <option>特急</option>

    <option>新快速</option>

  </select>


  <label>
    行き先
  </label>


  <input
    id="destinationName"
    type="text"
    placeholder="例：別府駅"
  >


  <label>
    速度制限
  </label>


  <div class="speedSetting">

    <input
      id="speedLimit"
      type="number"
      min="1"
      max="200"
      value="20"
      inputmode="numeric"
    >

    <div class="speedUnit">
      km/h
    </div>

  </div>


  <button
    class="startButton"
    onclick="startDrive()"
  >
    🚃 運転開始
  </button>

</div>



<!-- =====================================================
     運転
===================================================== -->

<div id="drive">


  <div id="board">
    別府駅
  </div>


  <div id="distanceBox">
    📍 目的地を設定してください
  </div>


  <div id="limitBox">
    🚦 制限 20 km/h
  </div>


  <div id="followBox">

    追従

    <input
      id="followSwitch"
      type="checkbox"
      checked
    >

  </div>


  <div id="modeBox">
    🎯 目的地設定
  </div>


  <button
    id="routeButton"
    onclick="toggleRoutePanel()"
  >
    📍 地点一覧
  </button>


  <div id="routePanel">

    <div class="routeTitle">
      設定地点
    </div>

    <div id="routeList"></div>

  </div>


  <div id="map"></div>


  <div id="overspeed">
    ⚠️ 速度超過
  </div>


  <div id="speedBox">

    <div id="speed">
      0
    </div>

    <div class="kmh">
      km/h
    </div>

  </div>


  <button
    id="finishButton"
    onclick="finishDrive()"
  >
    運転終了
  </button>


  <!-- ===================================================
       ATS
  =================================================== -->

  <div id="ats">

    <div
      id="atsText"
      class="atsWarning"
    >
      ⚠️ ATS作動
    </div>


    <div
      id="atsTimer"
      class="atsTimer"
    >
      自動終了まで 60 秒
    </div>


    <div class="slider">

      <div class="sliderText">
        スライドで解除
      </div>

      <div
        class="sliderButton"
        id="sliderButton"
      >
        →
      </div>

    </div>

  </div>

</div>



<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =====================================================
   基本変数
===================================================== */

let map = null;

let currentMarker = null;

let destination = null;

let destinationMarker = null;

let viaPoints = [];

let viaMarkers = [];

let currentViaIndex = 0;

let mode = "destination";

let watchID = null;

let speedLimit = 20;

let currentSpeed = 0;


/* =====================================================
   ATS
===================================================== */

let atsActive = false;

let atsTimer = null;

let atsCountdownTimer = null;

let atsSeconds = 60;

let atsType = "";


/*
 * 各ATSを一度だけ作動させるためのフラグ
 */

let destinationATSUsed = false;

let viaATSUsed = [];

let overspeedATSUsed = false;


/* =====================================================
   キンコン
===================================================== */

let bellTimer = null;

let bellActive = false;


/* =====================================================
   音
===================================================== */

let audioContext = null;

let alarmOscillator = null;

let alarmGain = null;


/* =====================================================
   スライダー
===================================================== */

let startX = 0;

let sliderX = 0;


/* =====================================================
   Audio
===================================================== */

function prepareAudio(){

  if(!audioContext){

    audioContext =
      new(
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }


  if(
    audioContext.state ===
    "suspended"
  ){

    audioContext.resume();

  }

}


/* =====================================================
   ATS警報音
===================================================== */

function startAlarm(){

  prepareAudio();

  stopAlarm();


  alarmOscillator =
    audioContext.createOscillator();

  alarmGain =
    audioContext.createGain();


  alarmOscillator.type =
    "square";

  alarmOscillator.frequency.value =
    700;

  alarmGain.gain.value =
    0.12;


  alarmOscillator.connect(
    alarmGain
  );

  alarmGain.connect(
    audioContext.destination
  );


  alarmOscillator.start();

}


function stopAlarm(){

  if(alarmOscillator){

    try{

      alarmOscillator.stop();

    }catch(e){}


    alarmOscillator.disconnect();

    alarmOscillator = null;

  }


  if(alarmGain){

    alarmGain.disconnect();

    alarmGain = null;

  }

}


/* =====================================================
   キンコン
===================================================== */

function playBell(){

  prepareAudio();


  const now =
    audioContext.currentTime;


  const osc1 =
    audioContext.createOscillator();

  const gain1 =
    audioContext.createGain();


  osc1.type =
    "sine";

  osc1.frequency.value =
    880;


  gain1.gain.setValueAtTime(
    0.16,
    now
  );


  gain1.gain.exponentialRampToValueAtTime(
    0.001,
    now + .14
  );


  osc1.connect(gain1);

  gain1.connect(
    audioContext.destination
  );


  osc1.start(now);

  osc1.stop(
    now + .14
  );


  setTimeout(
    function(){

      if(!audioContext){

        return;

      }


      const now2 =
        audioContext.currentTime;


      const osc2 =
        audioContext.createOscillator();

      const gain2 =
        audioContext.createGain();


      osc2.type =
        "sine";

      osc2.frequency.value =
        660;


      gain2.gain.setValueAtTime(
        0.16,
        now2
      );


      gain2.gain.exponentialRampToValueAtTime(
        0.001,
        now2 + .16
      );


      osc2.connect(gain2);

      gain2.connect(
        audioContext.destination
      );


      osc2.start(now2);

      osc2.stop(
        now2 + .16
      );

    },
    140
  );

}


/* =====================================================
   キンコン停止条件
===================================================== */

function canStopBell(){

  if(!currentMarker){

    return false;

  }


  const current =
    currentMarker.getLatLng();


  /* 目的地30m */

  if(destination){

    const distance =
      current.distanceTo(
        destination
      );


    if(distance <= 30){

      return true;

    }

  }


  /* 経由地点30m */

  for(
    let i = 0;
    i < viaPoints.length;
    i++
  ){

    const distance =
      current.distanceTo(
        viaPoints[i]
      );


    if(distance <= 30){

      return true;

    }

  }


  /* 速度ATS解除条件 */

  if(
    atsType ===
    "overspeed"
  ){

    if(
      currentSpeed <=
      speedLimit - 3
    ){

      return true;

    }

  }


  return false;

}


/* =====================================================
   キンコン開始
===================================================== */

function startBell(){

  stopBell();


  if(
    atsActive
  ){

    return;

  }


  if(
    canStopBell()
  ){

    return;

  }


  bellActive = true;

  playBell();


  bellTimer =
    setInterval(
      function(){

        if(
          atsActive ||
          canStopBell()
        ){

          stopBell();

          return;

        }


        playBell();

      },
      700
    );

}


/* =====================================================
   キンコン停止
===================================================== */

function stopBell(){

  if(
    bellTimer !== null
  ){

    clearInterval(
      bellTimer
    );

    bellTimer = null;

  }


  bellActive = false;

}


/* =====================================================
   種別カラー
===================================================== */

function updateBoardColor(type){

  const board =
    document.getElementById(
      "board"
    );


  board.classList.remove(
    "board-normal",
    "board-newrapid",
    "board-other"
  );


  if(
    type ===
    "普通"
  ){

    board.classList.add(
      "board-normal"
    );

  }
  else if(
    type ===
    "新快速"
  ){

    board.classList.add(
      "board-newrapid"
    );

  }
  else{

    board.classList.add(
      "board-other"
    );

  }

}


/* =====================================================
   運転開始
===================================================== */

function startDrive(){

  const type =
    document.getElementById(
      "type"
    ).value;


  const name =
    document.getElementById(
      "destinationName"
    ).value.trim();


  speedLimit =
    Number(
      document.getElementById(
        "speedLimit"
      ).value
    );


  if(!name){

    alert(
      "行き先名を入力してください"
    );

    return;

  }


  if(
    !speedLimit ||
    speedLimit <= 0
  ){

    alert(
      "速度制限を設定してください"
    );

    return;

  }


  prepareAudio();


  /*
   * 「行き」は付けない
   */

  document.getElementById(
    "board"
  ).textContent =
    type +
    "・" +
    name;


  updateBoardColor(
    type
  );


  document.getElementById(
    "limitBox"
  ).textContent =
    "🚦 制限 " +
    speedLimit +
    " km/h";


  document.getElementById(
    "setup"
  ).style.display =
    "none";


  document.getElementById(
    "drive"
  ).style.display =
    "block";


  mode =
    "destination";


  updateMode();


  setTimeout(
    initMap,
    100
  );

}


/* =====================================================
   地図
===================================================== */

function initMap(){

  if(map){

    map.invalidateSize();

    return;

  }


  map =
    L.map(
      "map",
      {
        zoomControl:false
      }
    );


  /*
   * Apple Maps風に見える
   * 無料OpenStreetMap
   */

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,

      attribution:
        "&copy; OpenStreetMap contributors"

    }
  ).addTo(map);


  L.control.zoom({
    position:"bottomright"
  }).addTo(map);


  if(
    !navigator.geolocation
  ){

    alert(
      "この端末ではGPSを利用できません"
    );

    return;

  }


  navigator.geolocation.getCurrentPosition(

    function(position){

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;


      map.setView(
        [lat,lng],
        17
      );


      currentMarker =
        L.marker(
          [lat,lng],
          {
            icon:
              L.divIcon({
                className:"",
                html:
                  '<div class="current-location-marker"></div>',
                iconSize:[22,22],
                iconAnchor:[11,11]
              })
          }
        )
        .addTo(map)
        .bindPopup(
          "🚲 現在地"
        );


      startGPS();

    },


    function(){

      map.setView(
        [35.681236,139.767125],
        13
      );


      document.getElementById(
        "distanceBox"
      ).textContent =
        "📍 GPSを許可してください";

    },


    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:1000
    }

  );


  /*
   * 地図タップ
   */

  map.on(
    "click",
    function(e){

      setPoint(
        e.latlng.lat,
        e.latlng.lng
      );

    }
  );

}


/* =====================================================
   地点設定
===================================================== */

function setPoint(
  lat,
  lng
){

  /*
   * 目的地
   */

  if(
    mode ===
    "destination"
  ){

    if(destinationMarker){

      map.removeLayer(
        destinationMarker
      );

    }


    destination =
      L.latLng(
        lat,
        lng
      );


    destinationMarker =
      L.marker(
        [lat,lng],
        {
          icon:
            L.divIcon({
              className:"",
              html:
                '<div class="destination-marker"></div>',
              iconSize:[24,24],
              iconAnchor:[12,12]
            })
        }
      )
      .addTo(map)
      .bindPopup(
        "🎯 目的地"
      );


    mode =
      "via";


    updateMode();

    updateRouteList();


    document.getElementById(
      "distanceBox"
    ).textContent =
      "📍 経由地点を設定してください";


    return;

  }


  /*
   * 経由地点
   */

  if(
    mode ===
    "via"
  ){

    addViaPoint(
      lat,
      lng
    );

  }

}


/* =====================================================
   経由地点追加
===================================================== */

function addViaPoint(
  lat,
  lng
){

  const point =
    L.latLng(
      lat,
      lng
    );


  viaPoints.push(
    point
  );


  viaATSUsed.push(
    false
  );


  const marker =
    L.marker(
      [lat,lng]
    )
    .addTo(map)
    .bindPopup(
      "📍 経由地点 " +
      viaPoints.length
    );


  viaMarkers.push(
    marker
  );


  updateRouteList();

}


/* =====================================================
   モード
===================================================== */

function updateMode(){

  const box =
    document.getElementById(
      "modeBox"
    );


  if(
    mode ===
    "destination"
  ){

    box.textContent =
      "🎯 目的地設定";

  }
  else{

    box.textContent =
      "📍 経由地点設定";

  }

}


/* =====================================================
   地点一覧
===================================================== */

function updateRouteList(){

  const list =
    document.getElementById(
      "routeList"
    );


  list.innerHTML = "";


  if(destination){

    const item =
      document.createElement(
        "div"
      );


    item.className =
      "routeItem";


    const text =
      document.createElement(
        "span"
      );


    text.textContent =
      "🎯 目的地";


    const button =
      document.createElement(
        "button"
      );


    button.className =
      "deleteRoute";


    button.textContent =
      "削除";


    button.onclick =
      function(){

        deleteDestination();

      };


    item.appendChild(
      text
    );


    item.appendChild(
      button
    );


    list.appendChild(
      item
    );

  }


  viaPoints.forEach(
    function(point,index){

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "routeItem";


      const text =
        document.createElement(
          "span"
        );


      text.textContent =
        "📍 経由 " +
        (index + 1);


      const button =
        document.createElement(
          "button"
        );


      button.className =
        "deleteRoute";


      button.textContent =
        "削除";


      button.onclick =
        function(){

          deleteViaPoint(
            index
          );

        };


      item.appendChild(
        text
      );


      item.appendChild(
        button
      );


      list.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   目的地削除
===================================================== */

function deleteDestination(){

  if(
    !confirm(
      "目的地を削除しますか？"
    )
  ){

    return;

  }


  if(destinationMarker){

    map.removeLayer(
      destinationMarker
    );

  }


  destination = null;

  destinationMarker = null;


  destinationATSUsed = false;


  /*
   * 目的地設定に戻す
   */

  mode =
    "destination";


  updateMode();

  updateRouteList();


  document.getElementById(
    "distanceBox"
  ).textContent =
    "🎯 新しい目的地を設定してください";

}


/* =====================================================
   経由地点削除
===================================================== */

function deleteViaPoint(
  index
){

  if(
    !confirm(
      "この経由地点を削除しますか？"
    )
  ){

    return;

  }


  if(
    viaMarkers[index]
  ){

    map.removeLayer(
      viaMarkers[index]
    );

  }


  viaMarkers.splice(
    index,
    1
  );


  viaPoints.splice(
    index,
    1
  );


  viaATSUsed.splice(
    index,
    1
  );


  if(
    currentViaIndex >
    index
  ){

    currentViaIndex--;

  }


  if(
    currentViaIndex < 0
  ){

    currentViaIndex = 0;

  }


  updateRouteList();

}


/* =====================================================
   地点一覧開閉
===================================================== */

function toggleRoutePanel(){

  const panel =
    document.getElementById(
      "routePanel"
    );


  if(
    panel.style.display ===
    "block"
  ){

    panel.style.display =
      "none";

  }
  else{

    panel.style.display =
      "block";

  }

}


/* =====================================================
   GPS
===================================================== */

function startGPS(){

  if(
    watchID !== null
  ){

    navigator.geolocation.clearWatch(
      watchID
    );

  }


  watchID =
    navigator.geolocation.watchPosition(

      function(position){

        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;


        /* =========================
           速度
        ========================= */

        let speed =
          position.coords.speed;


        if(
          speed === null ||
          speed < 0
        ){

          speed = 0;

        }


        speed =
          speed * 3.6;


        currentSpeed =
          speed;


        document.getElementById(
          "speed"
        ).textContent =
          Math.round(speed);


        /* =========================
           現在地
        ========================= */

        if(currentMarker){

          currentMarker.setLatLng(
            [lat,lng]
          );

        }


        /* =========================
           追従
        ========================= */

        const follow =
          document.getElementById(
            "followSwitch"
          ).checked;


        if(
          follow &&
          map
        ){

          map.panTo(
            [lat,lng],
            {
              animate:true,
              duration:.5
            }
          );

        }


        const current =
          L.latLng(
            lat,
            lng
          );


        /* =========================
           速度超過
        ========================= */

        if(
          speed > speedLimit
        ){

          document.getElementById(
            "overspeed"
          ).style.display =
            "block";


          /*
           * 速度ATSは1回だけ
           */

          if(
            !atsActive &&
            !overspeedATSUsed
          ){

            overspeedATSUsed = true;


            activateATS(
              "⚠️ 速度超過ATS",
              "overspeed"
            );

          }

        }
        else{

          document.getElementById(
            "overspeed"
          ).style.display =
            "none";


          /*
           * 速度が安全域まで落ちたら
           * 次の速度超過で再びATS可能
           */

          if(
            speed <=
            speedLimit - 3
          ){

            overspeedATSUsed = false;

          }

        }


        /* =========================
           目的地なし
        ========================= */

        if(
          !destination
        ){

          return;

        }


        /* =========================
           経由地点
        ========================= */

        if(
          currentViaIndex <
          viaPoints.length
        ){

          const via =
            viaPoints[
              currentViaIndex
            ];


          const distance =
            current.distanceTo(
              via
            );


          document.getElementById(
            "distanceBox"
          ).textContent =
            "📍 経由 " +
            (currentViaIndex + 1) +
            "まで " +
            Math.round(distance) +
            "m";


          /*
           * 100m以内でATS
           *
           * 同じ経由地点では1回だけ
           */

          if(
            distance <= 100 &&
            !atsActive &&
            !viaATSUsed[currentViaIndex]
          ){

            viaATSUsed[
              currentViaIndex
            ] = true;


            activateATS(
              "⚠️ 経由地点ATS",
              "via"
            );


            return;

          }


          /*
           * 30m以内
           */

          if(
            distance <= 30
          ){

            stopBell();

          }


          /*
           * 30m以内に入ったら
           * 次の経由地点へ
           */

          if(
            distance <= 30
          ){

            currentViaIndex++;

            updateRouteList();

          }


          return;

        }


        /* =========================
           目的地
        ========================= */

        const distance =
          current.distanceTo(
            destination
          );


        document.getElementById(
          "distanceBox"
        ).textContent =
          "🎯 目的地まで " +
          Math.round(distance) +
          "m";


        /*
         * 目的地ATS
         *
         * 200m以内
         * ただし1回だけ
         */

        if(
          distance <= 200 &&
          !atsActive &&
          !destinationATSUsed
        ){

          destinationATSUsed = true;


          activateATS(
            "🏁 目的地ATS",
            "destination"
          );


          return;

        }


        /*
         * 30m以内
         */

        if(
          distance <= 30
        ){

          stopBell();

        }

      },


      function(){

        document.getElementById(
          "distanceBox"
        ).textContent =
          "📍 GPS取得失敗";

      },


      {
        enableHighAccuracy:true,
        maximumAge:1000,
        timeout:10000
      }

    );

}


/* =====================================================
   ATS作動
===================================================== */

function activateATS(
  message,
  type
){

  if(
    atsActive
  ){

    return;

  }


  atsActive = true;

  atsType = type;

  atsSeconds = 60;


  /*
   * ATS中はキンコン停止
   */

  stopBell();


  /*
   * 終了ボタン非表示
   */

  document.getElementById(
    "finishButton"
  ).style.display =
    "none";


  /*
   * ATS表示
   */

  document.getElementById(
    "ats"
  ).style.display =
    "block";


  document.getElementById(
    "atsText"
  ).textContent =
    message;


  document.getElementById(
    "atsTimer"
  ).textContent =
    "自動終了まで 60 秒";


  /*
   * ATS警報
   */

  startAlarm();


  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      [300,200]
    );

  }


  /*
   * カウントダウン
   */

  clearInterval(
    atsCountdownTimer
  );


  atsCountdownTimer =
    setInterval(
      function(){

        if(!atsActive){

          return;

        }


        atsSeconds--;


        document.getElementById(
          "atsTimer"
        ).textContent =
          "自動終了まで " +
          Math.max(
            0,
            atsSeconds
          ) +
          " 秒";


        if(
          atsSeconds <= 0
        ){

          releaseATS();

        }

      },
      1000
    );


  /*
   * 60秒強制解除
   */

  clearTimeout(
    atsTimer
  );


  atsTimer =
    setTimeout(
      function(){

        releaseATS();

      },
      60000
    );

}


/* =====================================================
   ATS解除
===================================================== */

function releaseATS(){

  if(
    !atsActive
  ){

    return;

  }


  atsActive = false;


  clearTimeout(
    atsTimer
  );


  clearInterval(
    atsCountdownTimer
  );


  atsTimer = null;

  atsCountdownTimer = null;


  /*
   * ATS音停止
   */

  stopAlarm();


  /*
   * バイブ停止
   */

  if(
    navigator.vibrate
  ){

    navigator.vibrate(0);

  }


  /*
   * ATS表示OFF
   */

  document.getElementById(
    "ats"
  ).style.display =
    "none";


  /*
   * 終了ボタン復活
   */

  document.getElementById(
    "finishButton"
  ).style.display =
    "block";


  /*
   * ATS解除後
   *
   * 30m以内なら鳴らさない
   *
   * それ以外ならキンコン再開
   */

  if(
    !canStopBell()
  ){

    startBell();

  }

}


/* =====================================================
   ATSスライダー
===================================================== */

const sliderButton =
  document.getElementById(
    "sliderButton"
  );


sliderButton.addEventListener(
  "touchstart",
  function(e){

    if(
      !atsActive
    ){

      return;

    }


    startX =
      e.touches[0].clientX;

  },
  {
    passive:true
  }
);


sliderButton.addEventListener(
  "touchmove",
  function(e){

    if(
      !atsActive
    ){

      return;

    }


    const x =
      e.touches[0].clientX;


    sliderX =
      x - startX;


    if(
      sliderX < 0
    ){

      sliderX = 0;

    }


    const slider =
      sliderButton.parentElement;


    const max =
      slider.clientWidth -
      sliderButton.clientWidth -
      10;


    if(
      sliderX > max
    ){

      sliderX = max;

    }


    sliderButton.style.transform =
      "translateX(" +
      sliderX +
      "px)";


  },
  {
    passive:true
  }
);


sliderButton.addEventListener(
  "touchend",
  function(){

    if(
      !atsActive
    ){

      return;

    }


    const slider =
      sliderButton.parentElement;


    const max =
      slider.clientWidth -
      sliderButton.clientWidth -
      10;


    if(
      sliderX >=
      max * .7
    ){

      releaseATS();

    }


    sliderButton.style.transform =
      "translateX(0)";


    sliderX = 0;

  }
);


/* =====================================================
   運転終了
===================================================== */

function finishDrive(){

  if(
    atsActive
  ){

    return;

  }


  if(
    !confirm(
      "運転を終了しますか？"
    )
  ){

    return;

  }


  /*
   * 音停止
   */

  stopAlarm();

  stopBell();


  /*
   * タイマー
   */

  clearTimeout(
    atsTimer
  );

  clearInterval(
    atsCountdownTimer
  );


  /*
   * GPS
   */

  if(
    watchID !== null
  ){

    navigator.geolocation.clearWatch(
      watchID
    );

    watchID = null;

  }


  /*
   * 経由地点削除
   */

  viaMarkers.forEach(
    function(marker){

      if(map){

        map.removeLayer(
          marker
        );

      }

    }
  );


  /*
   * 目的地削除
   */

  if(
    destinationMarker &&
    map
  ){

    map.removeLayer(
      destinationMarker
    );

  }


  /*
   * 現在地削除
   */

  if(
    currentMarker &&
    map
  ){

    map.removeLayer(
      currentMarker
    );

  }


  /*
   * 初期化
   */

  destination = null;

  destinationMarker = null;

  viaPoints = [];

  viaMarkers = [];

  viaATSUsed = [];

  currentViaIndex = 0;

  destinationATSUsed = false;

  overspeedATSUsed = false;

  atsActive = false;

  atsType = "";

  mode = "destination";

  currentSpeed = 0;


  /*
   * マップを破棄
   */

  if(map){

    map.remove();

    map = null;

  }


  currentMarker = null;


  /*
   * 画面
   */

  document.getElementById(
    "drive"
  ).style.display =
    "none";


  document.getElementById(
    "setup"
  ).style.display =
    "block";


  /*
   * パネル
   */

  document.getElementById(
    "routePanel"
  ).style.display =
    "none";


  /*
   * 速度
   */

  document.getElementById(
    "speed"
  ).textContent =
    "0";


  /*
   * 速度超過
   */

  document.getElementById(
    "overspeed"
  ).style.display =
    "none";


  /*
   * ATS
   */

  document.getElementById(
    "ats"
  ).style.display =
    "none";


  /*
   * ATSスライダー
   */

  sliderButton.style.transform =
    "translateX(0)";


  sliderX = 0;


  /*
   * 初期表示
   */

  document.getElementById(
    "board"
  ).textContent =
    "cycletrain";


  document.getElementById(
    "distanceBox"
  ).textContent =
    "📍 目的地を設定してください";


  document.getElementById(
    "modeBox"
  ).textContent =
    "🎯 目的地設定";

}

</script>
