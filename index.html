<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>cycletrain</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

/* =====================================================
   基本
===================================================== */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
}

body{

  background:
    radial-gradient(
      circle at 20% 10%,
      rgba(70,110,255,.18),
      transparent 35%
    ),
    radial-gradient(
      circle at 90% 80%,
      rgba(0,210,255,.12),
      transparent 35%
    ),
    #07090d;

  color:white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    sans-serif;

  overflow:hidden;

  -webkit-font-smoothing:antialiased;
}


/* =====================================================
   Liquid Glass 共通
===================================================== */

.glass{

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.14),
      rgba(255,255,255,.055)
    );

  border:1px solid rgba(255,255,255,.16);

  box-shadow:
    0 10px 35px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.12);

  backdrop-filter:
    blur(25px)
    saturate(160%);

  -webkit-backdrop-filter:
    blur(25px)
    saturate(160%);
}


/* =====================================================
   設定画面
===================================================== */

#setup{

  height:100vh;

  padding:
    calc(25px + env(safe-area-inset-top))
    22px
    calc(25px + env(safe-area-inset-bottom));

  overflow-y:auto;

  background:
    radial-gradient(
      circle at 20% 0%,
      rgba(65,120,255,.22),
      transparent 40%
    ),
    radial-gradient(
      circle at 100% 100%,
      rgba(0,200,255,.13),
      transparent 40%
    );

}


/* ロゴ */

.logo{

  text-align:center;

  font-size:34px;

  font-weight:850;

  letter-spacing:-1.5px;

  margin:
    35px 0
    40px;

  text-shadow:
    0 4px 25px
    rgba(100,160,255,.35);

}


/* ラベル */

label{

  display:block;

  color:rgba(255,255,255,.62);

  font-size:14px;

  font-weight:600;

  margin:
    20px 4px
    9px;

}


/* 入力 */

select,
input{

  width:100%;

  height:55px;

  padding:
    0 16px;

  border-radius:17px;

  border:
    1px solid
    rgba(255,255,255,.14);

  background:
    rgba(255,255,255,.075);

  color:white;

  font-size:17px;

  outline:none;

  backdrop-filter:
    blur(18px);

  -webkit-backdrop-filter:
    blur(18px);

  box-shadow:
    inset 0 1px 0
    rgba(255,255,255,.08),
    0 8px 25px
    rgba(0,0,0,.18);

}


select:focus,
input:focus{

  border-color:
    rgba(120,170,255,.55);

  box-shadow:
    0 0 0 3px
    rgba(80,130,255,.12),
    inset 0 1px 0
    rgba(255,255,255,.12);

}


/* 速度設定 */

.speedSetting{

  display:flex;

  align-items:center;

  gap:10px;

}


.speedSetting input{

  flex:1;

}


.speedUnit{

  color:
    rgba(255,255,255,.5);

  font-size:15px;

}


/* 開始ボタン */

.startButton{

  width:100%;

  height:61px;

  margin-top:30px;

  border:0;

  border-radius:20px;

  background:
    linear-gradient(
      135deg,
      rgba(60,145,255,.9),
      rgba(45,95,230,.85)
    );

  color:white;

  font-size:18px;

  font-weight:750;

  box-shadow:
    0 12px 30px
    rgba(40,100,255,.3),
    inset 0 1px 0
    rgba(255,255,255,.3);

}


.startButton:active{

  transform:scale(.97);

}


/* =====================================================
   運転画面
===================================================== */

#drive{

  display:none;

  height:100vh;

  position:relative;

}


/* =====================================================
   行先表示
===================================================== */

#board{

  height:
    calc(
      75px +
      env(safe-area-inset-top)
    );

  padding-top:
    env(safe-area-inset-top);

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.88),
      rgba(8,10,14,.82)
    );

  border-bottom:
    1px solid
    rgba(255,255,255,.14);

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:23px;

  font-weight:800;

  letter-spacing:-.5px;

  white-space:nowrap;

  overflow:hidden;

  position:relative;

  z-index:1500;

  backdrop-filter:
    blur(25px);

  -webkit-backdrop-filter:
    blur(25px);

}


#board::after{

  content:"";

  position:absolute;

  left:15%;

  right:15%;

  bottom:0;

  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.4),
      transparent
    );

}


/* =====================================================
   地図
===================================================== */

#map{

  width:100%;

  height:
    calc(
      100vh -
      275px
    );

}


/* =====================================================
   距離表示
===================================================== */

#distanceBox{

  position:absolute;

  top:
    calc(
      85px +
      env(safe-area-inset-top)
    );

  left:10px;

  z-index:1600;

  padding:
    10px 13px;

  border-radius:14px;

  background:
    rgba(10,12,18,.66);

  border:
    1px solid
    rgba(255,255,255,.15);

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.3),
    inset 0 1px 0
    rgba(255,255,255,.1);

  backdrop-filter:
    blur(22px)
    saturate(150%);

  -webkit-backdrop-filter:
    blur(22px)
    saturate(150%);

  font-size:13px;

}


/* =====================================================
   制限速度
===================================================== */

#limitBox{

  position:absolute;

  top:
    calc(
      85px +
      env(safe-area-inset-top)
    );

  right:10px;

  z-index:1600;

  padding:
    10px 13px;

  border-radius:14px;

  background:
    rgba(10,12,18,.66);

  border:
    1px solid
    rgba(255,255,255,.15);

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.3),
    inset 0 1px 0
    rgba(255,255,255,.1);

  backdrop-filter:
    blur(22px);

  -webkit-backdrop-filter:
    blur(22px);

  font-size:13px;

}


/* =====================================================
   追従
===================================================== */

#followBox{

  position:absolute;

  top:
    calc(
      128px +
      env(safe-area-inset-top)
    );

  left:10px;

  z-index:1600;

  padding:
    8px 11px;

  border-radius:14px;

  background:
    rgba(10,12,18,.66);

  border:
    1px solid
    rgba(255,255,255,.14);

  backdrop-filter:
    blur(22px);

  -webkit-backdrop-filter:
    blur(22px);

  font-size:13px;

  display:flex;

  align-items:center;

  gap:8px;

}


#followSwitch{

  width:46px;

  height:26px;

  appearance:none;

  background:
    rgba(255,255,255,.2);

  border-radius:20px;

  position:relative;

  outline:none;

  padding:0;

  border:0;

  transition:.2s;

}


#followSwitch:checked{

  background:#34c759;

}


#followSwitch::after{

  content:"";

  position:absolute;

  width:22px;

  height:22px;

  top:2px;

  left:2px;

  background:white;

  border-radius:50%;

  box-shadow:
    0 2px 7px
    rgba(0,0,0,.3);

  transition:.2s;

}


#followSwitch:checked::after{

  transform:
    translateX(20px);

}


/* =====================================================
   モード
===================================================== */

#modeBox{

  position:absolute;

  top:
    calc(
      128px +
      env(safe-area-inset-top)
    );

  right:10px;

  z-index:1600;

  padding:
    9px 12px;

  border-radius:14px;

  background:
    rgba(10,12,18,.66);

  border:
    1px solid
    rgba(255,255,255,.14);

  backdrop-filter:
    blur(22px);

  -webkit-backdrop-filter:
    blur(22px);

  font-size:13px;

}


/* =====================================================
   地点一覧ボタン
===================================================== */

#routeButton{

  position:absolute;

  top:
    calc(
      170px +
      env(safe-area-inset-top)
    );

  right:10px;

  z-index:1600;

  border:
    1px solid
    rgba(255,255,255,.15);

  border-radius:14px;

  background:
    rgba(30,34,43,.72);

  color:white;

  padding:
    10px 13px;

  font-size:13px;

  backdrop-filter:
    blur(20px);

  -webkit-backdrop-filter:
    blur(20px);

  box-shadow:
    0 8px 22px

}


#routeButton:active{

  transform:scale(.95);

}


/* =====================================================
   地点一覧
===================================================== */

#routePanel{

  display:none;

  position:absolute;

  top:
    calc(
      215px +
      env(safe-area-inset-top)
    );

  right:10px;

  width:235px;

  max-height:285px;

  overflow-y:auto;

  z-index:1700;

  padding:9px;

  background:
    rgba(10,12,16,.78);

  border:
    1px solid
    rgba(255,255,255,.16);

  border-radius:18px;

  box-shadow:
    0 15px 45px
    rgba(0,0,0,.45),
    inset 0 1px 0
    rgba(255,255,255,.1);

  backdrop-filter:
    blur(28px)
    saturate(150%);

  -webkit-backdrop-filter:
    blur(28px)
    saturate(150%);

}


.routeTitle{

  color:
    rgba(255,255,255,.5);

  font-size:12px;

  padding:
    5px 6px 9px;

}


.routeItem{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:5px;

  padding:8px;

  margin-bottom:5px;

  background:
    rgba(255,255,255,.075);

  border:
    1px solid

  border-radius:12px;

  font-size:13px;

}


.deleteRoute{

  border:0;

  border-radius:9px;

  background:
    rgba(255,69,58,.7);

  color:white;

  padding:
    6px 8px;

}


/* =====================================================
   速度
===================================================== */

#speedBox{

  position:absolute;

  bottom:
    calc(
      115px +
      env(safe-area-inset-bottom)
    );

  left:0;

  width:100%;

  text-align:center;

  z-index:1000;

  pointer-events:none;

}


#speed{

  font-size:56px;

  font-weight:850;

  letter-spacing:-3px;

  text-shadow:
    0 5px 25px
    rgba(0,0,0,.45);

}


.kmh{

  color:
    rgba(255,255,255,.5);

  font-size:14px;

}


/* =====================================================
   速度超過
===================================================== */

#overspeed{

  display:none;

  position:absolute;

  bottom:
    calc(
      180px +
      env(safe-area-inset-bottom)
    );

  left:0;

  width:100%;

  text-align:center;

  z-index:1800;

  color:#ff453a;

  font-size:19px;

  font-weight:bold;

  text-shadow:
    0 3px 15px
    rgba(255,69,58,.35);

}


/* =====================================================
   終了ボタン
===================================================== */

#finishButton{

  position:absolute;

  left:20px;

  bottom:
    calc(
      20px +
      env(safe-area-inset-bottom)
    );

  width:
    calc(
      100% - 40px
    );

  height:65px;

  border:
    1px solid
    rgba(255,255,255,.13);

  border-radius:20px;

  background:
    rgba(30,34,43,.72);

  color:white;

  font-size:19px;

  font-weight:750;

  z-index:2000;

  backdrop-filter:
    blur(25px);

  -webkit-backdrop-filter:
    blur(25px);

  box-shadow:
    0 12px 35px
    rgba(0,0,0,.3),
    inset 0 1px 0
    rgba(255,255,255,.1);

}


#finishButton:active{

  transform:scale(.97);

}


/* =====================================================
   ATS
===================================================== */

#ats{

  display:none;

  position:absolute;

  left:20px;

  bottom:
    calc(
      20px +
      env(safe-area-inset-bottom)
    );

  width:
    calc(
      100% - 40px
    );

  z-index:3000;

  padding:15px;

  border-radius:22px;

  background:
    rgba(12,14,19,.78);

  border:
    1px solid
    rgba(255,255,255,.17);

  box-shadow:
    0 18px 50px
    rgba(0,0,0,.5),
    inset 0 1px 0
    rgba(255,255,255,.12);

  backdrop-filter:
    blur(30px)
    saturate(160%);

  -webkit-backdrop-filter:
    blur(30px)
    saturate(160%);

}


.atsWarning{

  text-align:center;

  color:#ff453a;

  font-size:18px;

  font-weight:bold;

  margin-bottom:8px;

}


.atsTimer{

  text-align:center;

  color:
    rgba(255,255,255,.55);

  font-size:13px;

  margin-bottom:7px;

}


/* =====================================================
   ATSスライダー
===================================================== */

.slider{

  position:relative;

  height:65px;

  border-radius:18px;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid
    rgba(255,255,255,.1);

  overflow:hidden;

  touch-action:none;

}


.sliderText{

  position:absolute;

  width:100%;

  height:100%;

  display:flex;

  align-items:center;

  justify-content:center;

  color:
    rgba(255,255,255,.5);

  font-size:17px;

}


.sliderButton{

  position:absolute;

  left:5px;

  top:5px;

  width:55px;

  height:55px;

  border-radius:15px;

  background:
    linear-gradient(
      135deg,
      #ff6257,
      #ff453a
    );

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:25px;

  z-index:10;

  touch-action:none;

  box-shadow:
    0 5px 18px
    rgba(255,69,58,.3),
    inset 0 1px 0
    rgba(255,255,255,.25);

}


/* =====================================================
   Leaflet
===================================================== */

.leaflet-control-zoom{

  border:0!important;

  overflow:hidden;

  border-radius:14px!important;

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.35)!important;

}


.leaflet-control-zoom a{

  background:
    rgba(20,24,30,.72)!important;

  color:white!important;

  border:0!important;

  backdrop-filter:
    blur(20px);

  -webkit-backdrop-filter:
    blur(20px);

}


.leaflet-control-attribution{

  background:
    rgba(0,0,0,.45)!important;

  color:
    rgba(255,255,255,.55)!important;

  backdrop-filter:
    blur(12px);

}


</style>

</head>


<body>


<!-- =====================================================
     設定画面
===================================================== -->

<div id="setup">

  <div class="logo">
    🚲 cycletrain
  </div>


  <label>
    種別
  </label>

  <select id="type">

    <option>普通</option>
    <option>快速</option>
    <option>急行</option>
    <option>特急</option>
    <option>新快速</option>

  </select>


  <label>
    行き先
  </label>

  <input
    id="destinationName"
    type="text"
    placeholder="例：別府駅"
  >


  <label>
    速度制限
  </label>

  <div class="speedSetting">

    <input
      id="speedLimit"
      type="number"
      min="1"
      max="200"
      value="20"
      inputmode="numeric"
    >

    <div class="speedUnit">
      km/h
    </div>

  </div>


  <button
    class="startButton"
    onclick="startDrive()"
  >
    🚃 運転開始
  </button>

</div>



<!-- =====================================================
     運転画面
===================================================== -->

<div id="drive">


  <div id="board">
    快速・別府駅行き
  </div>


  <div id="distanceBox">
    📍 目的地を設定してください
  </div>


  <div id="limitBox">
    🚦 制限 20 km/h
  </div>


  <div id="followBox">

    追従

    <input
      id="followSwitch"
      type="checkbox"
      checked
    >

  </div>


  <div id="modeBox">
    🎯 目的地設定
  </div>


  <button
    id="routeButton"
    onclick="toggleRoutePanel()"
  >
    📍 地点一覧
  </button>


  <div id="routePanel">

    <div class="routeTitle">
      設定地点
    </div>

    <div id="routeList"></div>

  </div>


  <div id="map"></div>


  <div id="overspeed">
    ⚠️ 速度超過
  </div>


  <div id="speedBox">

    <div id="speed">
      0
    </div>

    <div class="kmh">
      km/h
    </div>

  </div>


  <button
    id="finishButton"
    onclick="finishDrive()"
  >
    運転終了
  </button>


  <!-- ===================================================
       ATS
  =================================================== -->

  <div id="ats">

    <div
      id="atsText"
      class="atsWarning"
    >
      ⚠️ ATS作動
    </div>


    <div
      id="atsTimer"
      class="atsTimer"
    >
      自動終了まで 60 秒
    </div>


    <div class="slider">

      <div class="sliderText">
        スライドで解除
      </div>

      <div
        class="sliderButton"
        id="sliderButton"
      >
        →
      </div>

    </div>

  </div>


</div>



<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =====================================================
   基本変数
===================================================== */

let map = null;

let currentMarker = null;

let destination = null;

let destinationMarker = null;

let viaPoints = [];

let viaMarkers = [];

let currentViaIndex = 0;

let mode = "destination";

let watchID = null;

let speedLimit = 20;


/* =====================================================
   ATS
===================================================== */

let atsActive = false;

let atsTimer = null;

let atsCountdownTimer = null;

let atsSeconds = 60;

let atsType = "";


/*
 * 到着ATSを一度発動したら
 * 同じ到着地点で再発動しない
 */

let destinationATSFinished = false;


/*
 * 経由ATSも同じ地点で
 * 何度も発動しないようにする
 */

let viaATSFinished = [];


/* =====================================================
   キンコン
===================================================== */

let bellTimer = null;

let bellActive = false;


/* =====================================================
   音
===================================================== */

let audioContext = null;

let alarmOscillator = null;

let alarmGain = null;


/* =====================================================
   スライダー
===================================================== */

let startX = 0;

let sliderX = 0;


/* =====================================================
   速度
===================================================== */

let currentSpeed = 0;


/* =====================================================
   Audio
===================================================== */

function prepareAudio(){

  if(!audioContext){

    audioContext =
      new(
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }


  if(
    audioContext.state ===
    "suspended"
  ){

    audioContext.resume();

  }

}


/* =====================================================
   ATS ジリリリリ開始
===================================================== */

function startAlarm(){

  prepareAudio();

  stopAlarm();


  alarmOscillator =
    audioContext.createOscillator();


  alarmGain =
    audioContext.createGain();


  alarmOscillator.type =
    "square";


  alarmOscillator.frequency.value =
    700;


  alarmGain.gain.value =
    0.12;


  alarmOscillator.connect(
    alarmGain
  );


  alarmGain.connect(
    audioContext.destination
  );


  alarmOscillator.start();

}


/* =====================================================
   ATS ジリリリリ停止
===================================================== */

function stopAlarm(){

  if(alarmOscillator){

    try{

      alarmOscillator.stop();

    }catch(e){}


    alarmOscillator.disconnect();

    alarmOscillator = null;

  }


  if(alarmGain){

    alarmGain.disconnect();

    alarmGain = null;

  }

}


/* =====================================================
   キンコン
===================================================== */

function playBell(){

  prepareAudio();


  const now =
    audioContext.currentTime;


  const osc1 =
    audioContext.createOscillator();


  const gain1 =
    audioContext.createGain();


  osc1.type =
    "sine";


  osc1.frequency.value =
    880;


  gain1.gain.setValueAtTime(
    0.16,
    now
  );


  gain1.gain.exponentialRampToValueAtTime(
    0.001,
    now + 0.14
  );


  osc1.connect(gain1);

  gain1.connect(
    audioContext.destination
  );


  osc1.start(now);

  osc1.stop(
    now + 0.14
  );


  setTimeout(
    function(){

      if(!audioContext){

        return;

      }


      const now2 =
        audioContext.currentTime;


      const osc2 =
        audioContext.createOscillator();


      const gain2 =
        audioContext.createGain();


      osc2.type =
        "sine";


      osc2.frequency.value =
        660;


      gain2.gain.setValueAtTime(
        0.16,
        now2
      );


      gain2.gain.exponentialRampToValueAtTime(
        0.001,
        now2 + 0.16
      );


      osc2.connect(gain2);

      gain2.connect(
        audioContext.destination
      );


      osc2.start(now2);

      osc2.stop(
        now2 + 0.16
      );

    },
    140
  );

}


/* =====================================================
   30m以内判定
===================================================== */

function isWithin30m(){

  if(!currentMarker){

    return false;

  }


  const current =
    currentMarker.getLatLng();


  /*
   * 目的地
   */

  if(destination){

    if(
      current.distanceTo(
        destination
      ) <= 30
    ){

      return true;

    }

  }


  /*
   * 経由地点
   */

  for(
    let i = 0;
    i < viaPoints.length;
    i++
  ){

    if(
      current.distanceTo(
        viaPoints[i]
      ) <= 30
    ){

      return true;

    }

  }


  return false;

}


/* =====================================================
   キンコン停止条件
===================================================== */

function canStopBell(){

  /*
   * どこかの地点30m以内
   */

  if(
    isWithin30m()
  ){

    return true;

  }


  /*
   * 速度ATS
   *
   * 制限速度 - 3km/h以下
   */

  if(
    atsType === "overspeed"
  ){

    if(
      currentSpeed <=
      speedLimit - 3
    ){

      return true;

    }

  }


  return false;

}


/* =====================================================
   キンコン開始
===================================================== */

function startBell(){

  stopBell();


  /*
   * すでに停止条件なら
   * 鳴らさない
   */

  if(
    canStopBell()
  ){

    return;

  }


  bellActive = true;


  playBell();


  bellTimer =
    setInterval(
      function(){

        if(
          canStopBell()
        ){

          stopBell();

          return;

        }


        playBell();

      },
      700
    );

}


/* =====================================================
   キンコン停止
===================================================== */

function stopBell(){

  if(
    bellTimer !== null
  ){

    clearInterval(
      bellTimer
    );

    bellTimer = null;

  }


  bellActive = false;

}


/* =====================================================
   運転開始
===================================================== */

function startDrive(){

  const type =
    document.getElementById(
      "type"
    ).value;


  const name =
    document.getElementById(
      "destinationName"
    ).value.trim();


  speedLimit =
    Number(
      document.getElementById(
        "speedLimit"
      ).value
    );


  if(!name){

    alert(
      "行き先名を入力してください"
    );

    return;

  }


  if(
    !speedLimit ||
    speedLimit <= 0
  ){

    alert(
      "速度制限を設定してください"
    );

    return;

  }


  prepareAudio();


  document.getElementById(
    "board"
  ).textContent =
    type +
    "・" +
    name +
    "行き";


  document.getElementById(
    "limitBox"
  ).textContent =
    "🚦 制限 " +
    speedLimit +
    " km/h";


  document.getElementById(
    "setup"
  ).style.display =
    "none";


  document.getElementById(
    "drive"
  ).style.display =
    "block";


  mode =
    "destination";


  destinationATSFinished =
    false;


  viaATSFinished = [];


  currentViaIndex = 0;


  updateMode();


  setTimeout(
    initMap,
    100
  );

}


/* =====================================================
   地図
===================================================== */

function initMap(){

  if(map){

    map.invalidateSize();

    return;

  }


  map =
    L.map("map");


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,
      attribution:
        "&copy; OpenStreetMap contributors"
    }
  ).addTo(map);


  if(
    !navigator.geolocation
  ){

    alert(
      "この端末ではGPSを利用できません"
    );

    return;

  }


  navigator.geolocation.getCurrentPosition(

    function(position){

      const lat =
        position.coords.latitude;


      const lng =
        position.coords.longitude;


      map.setView(
        [lat,lng],
        17
      );


      currentMarker =
        L.marker(
          [lat,lng]
        )
        .addTo(map)
        .bindPopup(
          "🚲 現在地"
        );


      startGPS();

    },


    function(){

      map.setView(
        [35.681236,139.767125],
        13
      );


      document.getElementById(
        "distanceBox"
      ).textContent =
        "📍 GPSを許可してください";

    },


    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:1000
    }

  );


  map.on(
    "click",
    function(e){

      setPoint(
        e.latlng.lat,
        e.latlng.lng
      );

    }
  );

}


/* =====================================================
   地点設定
===================================================== */

function setPoint(
  lat,
  lng
){

  /*
   * 目的地設定
   */

  if(
    mode ===
    "destination"
  ){

    if(destinationMarker){

      map.removeLayer(
        destinationMarker
      );

    }


    destination =
      L.latLng(
        lat,
        lng
      );


    destinationMarker =
      L.marker(
        [lat,lng]
      )
      .addTo(map)
      .bindPopup(
        "🎯 目的地"
      );


    mode =
      "via";


    destinationATSFinished =
      false;


    updateMode();

    updateRouteList();


    document.getElementById(
      "distanceBox"
    ).textContent =
      "📍 経由地点を設定してください";


    return;

  }


  /*
   * 経由地点設定
   */

  if(
    mode ===
    "via"
  ){

    addViaPoint(
      lat,
      lng
    );

  }

}


/* =====================================================
   経由地点追加
===================================================== */

function addViaPoint(
  lat,
  lng
){

  const point =
    L.latLng(
      lat,
      lng
    );


  viaPoints.push(
    point
  );


  viaATSFinished.push(
    false
  );


  const marker =
    L.marker(
      [lat,lng]
    )
    .addTo(map)
    .bindPopup(
      "📍 経由地点 " +
      viaPoints.length
    );


  viaMarkers.push(
    marker
  );


  updateRouteList();

}


/* =====================================================
   モード
===================================================== */

function updateMode(){

  const box =
    document.getElementById(
      "modeBox"
    );


  if(
    mode ===
    "destination"
  ){

    box.textContent =
      "🎯 目的地設定";

  }else{

    box.textContent =
      "📍 経由地点設定";

  }

}


/* =====================================================
   地点一覧
===================================================== */

function updateRouteList(){

  const list =
    document.getElementById(
      "routeList"
    );


  list.innerHTML = "";


  /*
   * 目的地
   */

  if(destination){

    const item =
      document.createElement(
        "div"
      );


    item.className =
      "routeItem";


    const text =
      document.createElement(
        "span"
      );


    text.textContent =
      "🎯 目的地";


    const button =
      document.createElement(
        "button"
      );


    button.className =
      "deleteRoute";


    button.textContent =
      "削除";


    button.onclick =
      function(){

        deleteDestination();

      };


    item.appendChild(text);

    item.appendChild(button);

    list.appendChild(item);

  }


  /*
   * 経由地点
   */

  viaPoints.forEach(
    function(point,index){

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "routeItem";


      const text =
        document.createElement(
          "span"
        );


      text.textContent =
        "📍 経由 " +
        (index + 1);


      const button =
        document.createElement(
          "button"
        );


      button.className =
        "deleteRoute";


      button.textContent =
        "削除";


      button.onclick =
        function(){

          deleteViaPoint(
            index
          );

        };


      item.appendChild(text);

      item.appendChild(button);

      list.appendChild(item);

    }
  );

}


/* =====================================================
   目的地削除
===================================================== */

function deleteDestination(){

  if(
    !confirm(
      "目的地を削除しますか？"
    )
  ){

    return;

  }


  if(
    destinationMarker
  ){

    map.removeLayer(
      destinationMarker
    );

  }


  destination = null;

  destinationMarker = null;


  /*
   * ★重要
   *
   * 目的地が消えたら
   * 目的地設定モードへ戻す
   */

  mode =
    "destination";


  destinationATSFinished =
    false;


  updateMode();

  updateRouteList();


  document.getElementById(
    "distanceBox"
  ).textContent =
    "🎯 新しい目的地を設定してください";

}


/* =====================================================
   経由地点削除
===================================================== */

function deleteViaPoint(
  index
){

  if(
    !confirm(
      "この経由地点を削除しますか？"
    )
  ){

    return;

  }


  if(
    viaMarkers[index]
  ){

    map.removeLayer(
      viaMarkers[index]
    );

  }


  viaMarkers.splice(
    index,
    1
  );


  viaPoints.splice(
    index,
    1
  );


  viaATSFinished.splice(
    index,
    1
  );


  if(
    currentViaIndex >
    index
  ){

    currentViaIndex--;

  }


  if(
    currentViaIndex < 0
  ){

    currentViaIndex = 0;

  }


  if(
    currentViaIndex >=
    viaPoints.length
  ){

    currentViaIndex =
      viaPoints.length;

  }


  updateRouteList();

}


/* =====================================================
   地点一覧開閉
===================================================== */

function toggleRoutePanel(){

  const panel =
    document.getElementById(
      "routePanel"
    );


  if(
    panel.style.display ===
    "block"
  ){

    panel.style.display =
      "none";

  }else{

    panel.style.display =
      "block";

  }

}


/* =====================================================
   GPS
===================================================== */

function startGPS(){

  if(
    watchID !== null
  ){

    navigator.geolocation.clearWatch(
      watchID
    );

  }


  watchID =
    navigator.geolocation.watchPosition(

      function(position){

        const lat =
          position.coords.latitude;


        const lng =
          position.coords.longitude;


        /*
         * 速度
         */

        let speed =
          position.coords.speed;


        if(
          speed === null ||
          speed < 0
        ){

          speed = 0;

        }


        speed =
          speed * 3.6;


        currentSpeed =
          speed;


        document.getElementById(
          "speed"
        ).textContent =
          Math.round(speed);


        /*
         * 現在地
         */

        if(currentMarker){

          currentMarker.setLatLng(
            [lat,lng]
          );

        }


        /*
         * 地図追従
         */

        const follow =
          document.getElementById(
            "followSwitch"
          ).checked;


        if(
          follow &&
          map
        ){

          map.panTo(
            [lat,lng],
            {
              animate:true,
              duration:.5
            }
          );

        }


        /*
         * =============================================
         * 速度超過
         * =============================================
         */

        if(
          speed > speedLimit
        ){

          document.getElementById(
            "overspeed"
          ).style.display =
            "block";


          if(
            !atsActive
          ){

            activateATS(
              "⚠️ 速度超過ATS",
              "overspeed"
            );

          }

        }else{

          document.getElementById(
            "overspeed"
          ).style.display =
            "none";

        }


        /*
         * 目的地なし
         */

        if(
          !destination
        ){

          return;

        }


        const current =
          L.latLng(
            lat,
            lng
          );


        /*
         * =============================================
         * 経由地点
         * =============================================
         */

        if(
          currentViaIndex <
          viaPoints.length
        ){

          const via =
            viaPoints[
              currentViaIndex
            ];


          const distance =
            current.distanceTo(
              via
            );


          document.getElementById(
            "distanceBox"
          ).textContent =
            "📍 経由 " +
            (currentViaIndex + 1) +
            "まで " +
            Math.round(distance) +
            "m";


          /*
           * 30m以内
           *
           * キンコン停止
           */

          if(
            distance <= 30
          ){

            stopBell();

          }


          /*
           * 100m以内でATS
           *
           * まだ処理していない
           * 経由地点だけ
           */

          if(
            distance <= 100 &&
            !atsActive &&
            !viaATSFinished[currentViaIndex]
          ){

            /*
             * 先に「処理済み」にする
             * ことで連続発動防止
             */

            viaATSFinished[
              currentViaIndex
            ] = true;


            /*
             * 次の経由地点へ進める
             */

            const activatedIndex =
              currentViaIndex;


            currentViaIndex++;


            updateRouteList();


            activateATS(
              "⚠️ 経由地点ATS",
              "via"
            );


            return;

          }


          return;

        }


        /*
         * =============================================
         * 目的地
         * =============================================
         */

        const distance =
          current.distanceTo(
            destination
          );


        document.getElementById(
          "distanceBox"
        ).textContent =
          "🎯 目的地まで " +
          Math.round(distance) +
          "m";


        /*
         * =============================================
         * ★30m以内なら
         * 到着ATSを解除
         * =============================================
         */

        if(
          distance <= 30
        ){

          /*
           * キンコン停止
           */

          stopBell();


          /*
           * ★到着ATS中なら即解除
           *
           * ここが今回の重要修正
           */

          if(
            atsActive &&
            atsType ===
            "destination"
          ){

            releaseATS();

          }


          /*
           * 到着ATS済みにする
           */

          destinationATSFinished =
            true;


          return;

        }


        /*
         * =============================================
         * 200m以内
         *
         * 到着ATS
         * =============================================
         */

        if(
          distance <= 200 &&
          !atsActive &&
          !destinationATSFinished
        ){

          activateATS(
            "🏁 目的地ATS",
            "destination"
          );

        }


        /*
         * 30m以内なら
         * キンコン停止
         */

        if(
          distance <= 30
        ){

          stopBell();

        }

      },


      function(){

        document.getElementById(
          "distanceBox"
        ).textContent =
          "📍 GPS取得失敗";

      },


      {
        enableHighAccuracy:true,
        maximumAge:1000,
        timeout:10000
      }

    );

}


/* =====================================================
   ATS作動
===================================================== */

function activateATS(
  message,
  type
){

  if(
    atsActive
  ){

    return;

  }


  atsActive = true;

  atsType = type;

  atsSeconds = 60;


  /*
   * キンコン停止
   */

  stopBell();


  /*
   * 終了ボタン非表示
   */

  document.getElementById(
    "finishButton"
  ).style.display =
    "none";


  /*
   * ATS表示
   */

  document.getElementById(
    "ats"
  ).style.display =
    "block";


  document.getElementById(
    "atsText"
  ).textContent =
    message;


  document.getElementById(
    "atsTimer"
  ).textContent =
    "自動終了まで 60 秒";


  /*
   * ジリリリリ
   */

  startAlarm();


  /*
   * 振動
   */

  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      [300,200]
    );

  }


  /*
   * カウントダウン
   */

  clearInterval(
    atsCountdownTimer
  );


  atsCountdownTimer =
    setInterval(
      function(){

        atsSeconds--;


        if(
          atsSeconds < 0
        ){

          atsSeconds = 0;

        }


        document.getElementById(
          "atsTimer"
        ).textContent =
          "自動終了まで " +
          atsSeconds +
          " 秒";


        if(
          atsSeconds <= 0
        ){

          releaseATS();

        }

      },
      1000
    );


  /*
   * 60秒強制終了
   */

  clearTimeout(
    atsTimer
  );


  atsTimer =
    setTimeout(
      function(){

        releaseATS();

      },
      60000
    );

}


/* =====================================================
   ATS解除
===================================================== */

function releaseATS(){

  if(
    !atsActive
  ){

    return;

  }


  const releasedType =
    atsType;


  atsActive = false;


  clearTimeout(
    atsTimer
  );


  clearInterval(
    atsCountdownTimer
  );


  atsTimer = null;

  atsCountdownTimer = null;


  /*
   * ジリリリリ停止
   */

  stopAlarm();


  /*
   * バイブ停止
   */

  if(
    navigator.vibrate
  ){

    navigator.vibrate(0);

  }


  /*
   * ATS画面消す
   */

  document.getElementById(
    "ats"
  ).style.display =
    "none";


  /*
   * 終了ボタン復活
   */

  document.getElementById(
    "finishButton"
  ).style.display =
    "block";


  /*
   * =============================================
   * 到着ATS
   * =============================================
   *
   * 解除したあと30m以内なら
   * キンコンを鳴らさない
   */

  if(
    releasedType ===
    "destination"
  ){

    if(
      isWithin30m()
    ){

      stopBell();

      return;

    }

  }


  /*
   * =============================================
   * 経由ATS
   * =============================================
   *
   * 経由地点を通過した後なら
   * 普通にキンコンへ
   */

  if(
    !canStopBell()
  ){

    startBell();

  }

}


/* =====================================================
   ATSスライダー
===================================================== */

const sliderButton =
  document.getElementById(
    "sliderButton"
  );


/*
 * タッチ開始
 */

sliderButton.addEventListener(
  "touchstart",
  function(e){

    if(
      !atsActive
    ){

      return;

    }


    startX =
      e.touches[0].clientX;

  }
);


/*
 * タッチ移動
 */

sliderButton.addEventListener(
  "touchmove",
  function(e){

    if(
      !atsActive
    ){

      return;

    }


    const x =
      e.touches[0].clientX;


    sliderX =
      x - startX;


    if(
      sliderX < 0
    ){

      sliderX = 0;

    }


    const slider =
      sliderButton.parentElement;


    const max =
      slider.clientWidth -
      sliderButton.clientWidth -
      10;


    if(
      sliderX > max
    ){

      sliderX = max;

    }


    sliderButton.style.transform =
      "translateX(" +
      sliderX +
      "px)";

  }
);


/*
 * タッチ終了
 */

sliderButton.addEventListener(
  "touchend",
  function(){

    if(
      !atsActive
    ){

      return;

    }


    const slider =
      sliderButton.parentElement;


    const max =
      slider.clientWidth -
      sliderButton.clientWidth -
      10;


    /*
     * 70%以上
     */

    if(
      sliderX >=
      max * 0.7
    ){

      releaseATS();


      sliderButton.style.transform =
        "translateX(0)";


      sliderX = 0;

    }else{

      sliderButton.style.transform =
        "translateX(0)";


      sliderX = 0;

    }

  }
);


/* =====================================================
   運転終了
===================================================== */

function finishDrive(){

  /*
   * ATS中は終了不可
   */

  if(
    atsActive
  ){

    return;

  }


  if(
    !confirm(
      "運転を終了しますか？"
    )
  ){

    return;

  }


  /*
   * 音停止
   */

  stopAlarm();

  stopBell();


  /*
   * タイマー停止
   */

  clearTimeout(
    atsTimer
  );


  clearInterval(
    atsCountdownTimer
  );


  /*
   * GPS停止
   */

  if(
    watchID !== null
  ){

    navigator.geolocation.clearWatch(
      watchID
    );

    watchID = null;

  }


  /*
   * 経由地点削除
   */

  viaMarkers.forEach(
    function(marker){

      if(map){

        map.removeLayer(
          marker
        );

      }

    }
  );


  /*
   * 目的地削除
   */

  if(
    destinationMarker &&
    map
  ){

    map.removeLayer(
      destinationMarker
    );

  }


  /*
   * 現在地削除
   */

  if(
    currentMarker &&
    map
  ){

    map.removeLayer(
      currentMarker
    );

  }


  /*
   * 初期化
   */

  destination = null;

  destinationMarker = null;

  viaPoints = [];

  viaMarkers = [];

  currentViaIndex = 0;

  viaATSFinished = [];

  destinationATSFinished = false;

  atsActive = false;

  atsType = "";

  mode = "destination";

  currentSpeed = 0;


  /*
   * 画面
   */

  document.getElementById(
    "drive"
  ).style.display =
    "none";


  document.getElementById(
    "setup"
  ).style.display =
    "block";


  /*
   * パネル
   */

  document.getElementById(
    "routePanel"
  ).style.display =
    "none";


  /*
   * 速度
   */

  document.getElementById(
    "speed"
  ).textContent =
    "0";


  /*
   * 速度超過
   */

  document.getElementById(
    "overspeed"
  ).style.display =
    "none";


  /*
   * ATS
   */

  document.getElementById(
    "ats"
  ).style.display =
    "none";


  /*
   * スライダー
   */

  sliderButton.style.transform =
    "translateX(0)";


  sliderX = 0;

}

</script>
