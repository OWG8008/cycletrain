<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>cycletrain</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

/* =====================================================
   Liquid Glass Base
===================================================== */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
}

body{
  margin:0;
  background:
    radial-gradient(
      circle at 20% 10%,
      rgba(90,120,255,.18),
      transparent 35%
    ),
    radial-gradient(
      circle at 90% 90%,
      rgba(0,210,255,.12),
      transparent 35%
    ),
    #070a10;

  color:white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    sans-serif;

  overflow:hidden;
}

button,
input,
select{
  font-family:inherit;
}


/* =====================================================
   共通Glass
===================================================== */

.glass{
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.16),
      rgba(255,255,255,.055)
    );

  border:1px solid
    rgba(255,255,255,.20);

  box-shadow:
    0 12px 35px rgba(0,0,0,.30),
    inset 0 1px 1px
      rgba(255,255,255,.20);

  backdrop-filter:
    blur(24px)
    saturate(180%);

  -webkit-backdrop-filter:
    blur(24px)
    saturate(180%);
}


/* =====================================================
   設定画面
===================================================== */

#setup{

  height:100vh;

  padding:
    25px
    22px
    35px;

  overflow-y:auto;

  background:
    radial-gradient(
      circle at 10% 0%,
      rgba(80,120,255,.16),
      transparent 40%
    ),
    radial-gradient(
      circle at 100% 100%,
      rgba(0,220,255,.10),
      transparent 40%
    );
}


/* ロゴ */

.logo{

  text-align:center;

  font-size:34px;

  font-weight:800;

  letter-spacing:-1.5px;

  margin:
    30px
    0
    42px;

  text-shadow:
    0 4px 20px
    rgba(100,160,255,.35);

}


/* ラベル */

label{

  display:block;

  color:
    rgba(255,255,255,.65);

  margin:
    20px
    0
    9px;

  font-size:14px;

  font-weight:600;

}


/* input / select */

select,
input{

  width:100%;

  height:58px;

  padding:
    0
    17px;

  border-radius:20px;

  border:1px solid
    rgba(255,255,255,.18);

  background:
    rgba(255,255,255,.075);

  color:white;

  font-size:18px;

  outline:none;

  box-shadow:
    inset 0 1px 1px
      rgba(255,255,255,.10),
    0 8px 25px
      rgba(0,0,0,.18);

  backdrop-filter:
    blur(22px)
    saturate(170%);

  -webkit-backdrop-filter:
    blur(22px)
    saturate(170%);

}


select{
  appearance:none;
  -webkit-appearance:none;
}


select option{
  background:#171b23;
  color:white;
}


input::placeholder{
  color:
    rgba(255,255,255,.38);
}


/* 速度 */

.speedSetting{

  display:flex;

  align-items:center;

  gap:10px;

}


.speedSetting input{
  flex:1;
}


.speedUnit{

  color:
    rgba(255,255,255,.55);

  font-size:15px;

}


/* 開始ボタン */

.startButton{

  width:100%;

  height:62px;

  margin-top:30px;

  border:1px solid
    rgba(255,255,255,.22);

  border-radius:22px;

  background:
    linear-gradient(
      135deg,
      rgba(40,220,110,.75),
      rgba(20,150,75,.65)
    );

  color:white;

  font-size:19px;

  font-weight:700;

  box-shadow:
    0 10px 30px
      rgba(30,200,90,.22),
    inset 0 1px 1px
      rgba(255,255,255,.30);

  backdrop-filter:
    blur(20px);

  -webkit-backdrop-filter:
    blur(20px);

  transition:
    transform .15s,
    filter .15s;

}


.startButton:active{

  transform:scale(.97);

  filter:brightness(.9);

}


/* =====================================================
   運転画面
===================================================== */

#drive{

  display:none;

  height:100vh;

  position:relative;

}


/* =====================================================
   幕
===================================================== */

#board{

  position:absolute;

  top:0;
  left:0;

  width:100%;

  height:75px;

  z-index:1500;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:24px;

  font-weight:800;

  white-space:nowrap;

  overflow:hidden;

  background:
    linear-gradient(
      180deg,
      rgba(5,7,10,.88),
      rgba(5,7,10,.70)
    );

  border-bottom:
    1px solid
    rgba(255,255,255,.15);

  box-shadow:
    0 10px 30px
    rgba(0,0,0,.30);

  backdrop-filter:
    blur(25px)
    saturate(150%);

  -webkit-backdrop-filter:
    blur(25px)
    saturate(150%);

}


/* =====================================================
   地図
===================================================== */

#map{

  width:100%;

  height:100vh;

}


/* =====================================================
   地図上Glass UI
===================================================== */

#distanceBox,
#limitBox,
#followBox,
#modeBox,
#routeButton,
#routePanel{

  background:
    linear-gradient(
      135deg,
      rgba(20,25,35,.70),
      rgba(15,18,25,.48)
    );

  border:
    1px solid
    rgba(255,255,255,.20);

  box-shadow:
    0 10px 30px
      rgba(0,0,0,.30),
    inset 0 1px 1px
      rgba(255,255,255,.15);

  backdrop-filter:
    blur(22px)
    saturate(170%);

  -webkit-backdrop-filter:
    blur(22px)
    saturate(170%);

}


/* =====================================================
   距離
===================================================== */

#distanceBox{

  position:absolute;

  top:87px;
  left:10px;

  z-index:1000;

  padding:
    10px
    14px;

  border-radius:17px;

  font-size:14px;

}


/* =====================================================
   制限速度
===================================================== */

#limitBox{

  position:absolute;

  top:87px;
  right:10px;

  z-index:1000;

  padding:
    10px
    14px;

  border-radius:17px;

  font-size:14px;

}


/* =====================================================
   追従
===================================================== */

#followBox{

  position:absolute;

  top:133px;
  left:10px;

  z-index:1600;

  padding:
    8px
    11px;

  border-radius:17px;

  font-size:13px;

  display:flex;

  align-items:center;

  gap:7px;

}


#followSwitch{

  width:45px;

  height:25px;

  appearance:none;

  -webkit-appearance:none;

  background:
    rgba(255,255,255,.20);

  border-radius:20px;

  position:relative;

  outline:none;

  padding:0;

  border:
    1px solid
    rgba(255,255,255,.15);

}


#followSwitch:checked{

  background:
    rgba(35,134,54,.85);

}


#followSwitch::after{

  content:"";

  position:absolute;

  width:21px;
  height:21px;

  top:1px;
  left:1px;

  background:white;

  border-radius:50%;

  box-shadow:
    0 2px 8px
    rgba(0,0,0,.30);

  transition:
    transform .2s;

}


#followSwitch:checked::after{

  transform:
    translateX(20px);

}


/* =====================================================
   モード
===================================================== */

#modeBox{

  position:absolute;

  top:133px;
  right:10px;

  z-index:1600;

  padding:
    9px
    12px;

  border-radius:17px;

  font-size:13px;

}


/* =====================================================
   地点一覧ボタン
===================================================== */

#routeButton{

  position:absolute;

  top:178px;
  right:10px;

  z-index:1600;

  border-radius:17px;

  color:white;

  padding:
    10px
    13px;

  font-size:13px;

  transition:
    transform .15s;

}


#routeButton:active{

  transform:
    scale(.95);

}


/* =====================================================
   地点一覧
===================================================== */

#routePanel{

  display:none;

  position:absolute;

  top:225px;
  right:10px;

  width:245px;

  max-height:300px;

  overflow-y:auto;

  z-index:1700;

  padding:10px;

  border-radius:22px;

}


.routeTitle{

  color:
    rgba(255,255,255,.55);

  font-size:13px;

  padding:
    5px
    6px
    9px;

}


.routeItem{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:5px;

  padding:9px;

  margin-bottom:6px;

  background:
    rgba(255,255,255,.075);

  border:
    1px solid
    rgba(255,255,255,.10);

  border-radius:15px;

  font-size:13px;

}


.deleteRoute{

  border:
    1px solid
    rgba(255,255,255,.12);

  border-radius:11px;

  background:
    rgba(255,70,60,.35);

  color:white;

  padding:
    6px
    9px;

}


/* =====================================================
   速度表示
===================================================== */

#speedBox{

  position:absolute;

  bottom:112px;

  left:0;

  width:100%;

  text-align:center;

  z-index:1000;

  pointer-events:none;

}


#speed{

  font-size:58px;

  font-weight:800;

  letter-spacing:-2px;

  text-shadow:
    0 5px 25px
    rgba(0,0,0,.35);

}


.kmh{

  color:
    rgba(255,255,255,.58);

  font-size:15px;

}


/* =====================================================
   速度超過
===================================================== */

#overspeed{

  display:none;

  position:absolute;

  bottom:181px;

  left:0;

  width:100%;

  text-align:center;

  z-index:1800;

  color:#ff453a;

  font-size:19px;

  font-weight:bold;

  text-shadow:
    0 3px 15px
    rgba(0,0,0,.5);

}


/* =====================================================
   終了ボタン
===================================================== */

#finishButton{

  position:absolute;

  left:20px;

  bottom:20px;

  width:calc(100% - 40px);

  height:64px;

  border:
    1px solid
    rgba(255,255,255,.18);

  border-radius:22px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.14),
      rgba(255,255,255,.055)
    );

  color:white;

  font-size:20px;

  font-weight:700;

  z-index:2000;

  box-shadow:
    0 10px 30px
      rgba(0,0,0,.30),
    inset 0 1px 1px
      rgba(255,255,255,.18);

  backdrop-filter:
    blur(25px)
    saturate(180%);

  -webkit-backdrop-filter:
    blur(25px)
    saturate(180%);

}


/* =====================================================
   ATS
===================================================== */

#ats{

  display:none;

  position:absolute;

  left:15px;

  bottom:15px;

  width:calc(100% - 30px);

  z-index:3000;

  padding:14px;

  border-radius:28px;

  background:
    linear-gradient(
      135deg,
      rgba(25,28,36,.80),
      rgba(15,18,25,.62)
    );

  border:
    1px solid
    rgba(255,255,255,.22);

  box-shadow:
    0 18px 50px
      rgba(0,0,0,.40),
    inset 0 1px 1px
      rgba(255,255,255,.20);

  backdrop-filter:
    blur(30px)
    saturate(180%);

  -webkit-backdrop-filter:
    blur(30px)
    saturate(180%);

}


.atsWarning{

  text-align:center;

  color:#ff453a;

  font-size:18px;

  font-weight:800;

  margin-bottom:8px;

}


.atsTimer{

  text-align:center;

  color:
    rgba(255,255,255,.58);

  font-size:13px;

  margin-bottom:8px;

}


/* =====================================================
   ATSスライダー
===================================================== */

.slider{

  position:relative;

  height:65px;

  border-radius:20px;

  background:
    rgba(255,255,255,.075);

  border:
    1px solid
    rgba(255,255,255,.13);

  overflow:hidden;

  touch-action:none;

  box-shadow:
    inset 0 1px 2px
    rgba(255,255,255,.10);

}


.sliderText{

  position:absolute;

  width:100%;
  height:100%;

  display:flex;

  align-items:center;

  justify-content:center;

  color:
    rgba(255,255,255,.52);

  font-size:17px;

}


.sliderButton{

  position:absolute;

  left:5px;
  top:5px;

  width:55px;
  height:55px;

  border-radius:17px;

  background:
    linear-gradient(
      135deg,
      rgba(255,80,70,.95),
      rgba(210,45,40,.78)
    );

  border:
    1px solid
    rgba(255,255,255,.25);

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:25px;

  z-index:10;

  touch-action:none;

  box-shadow:
    0 5px 18px
      rgba(255,60,50,.25),
    inset 0 1px 1px
      rgba(255,255,255,.25);

}


/* =====================================================
   Leafletも少しGlass化
===================================================== */

.leaflet-control-zoom{

  border:none!important;

  box-shadow:none!important;

}


.leaflet-control-zoom a{

  background:
    rgba(20,25,35,.68)!important;

  color:white!important;

  border:
    1px solid
    rgba(255,255,255,.18)!important;

  backdrop-filter:
    blur(20px);

  -webkit-backdrop-filter:
    blur(20px);

}


.leaflet-control-attribution{

  background:
    rgba(10,12,16,.55)!important;

  color:
    rgba(255,255,255,.55)!important;

  backdrop-filter:
    blur(15px);

}


.leaflet-control-attribution a{

  color:
    rgba(255,255,255,.75)!important;

}


/* =====================================================
   小さい画面
===================================================== */

@media(max-height:650px){

  #speed{

    font-size:48px;

  }

  #speedBox{

    bottom:105px;

  }

  #finishButton{

    height:58px;

  }

}


/* =====================================================
   Safe Area
===================================================== */

@supports(padding:max(0px)){

  #setup{

    padding-top:
      max(
        25px,
        env(safe-area-inset-top)
      );

    padding-bottom:
      max(
        35px,
        env(safe-area-inset-bottom)
      );

  }

  #board{

    padding-top:
      env(safe-area-inset-top);

    height:
      calc(
        75px +
        env(safe-area-inset-top)
      );

  }

  #finishButton{

    bottom:
      max(
        20px,
        env(safe-area-inset-bottom)
      );

  }

  #ats{

    bottom:
      max(
        15px,
        env(safe-area-inset-bottom)
      );

  }

}


/* =====================================================
   Reduced Motion
===================================================== */

@media(prefers-reduced-motion:reduce){

  *{

    scroll-behavior:auto!important;

    transition:none!important;

  }

}

</style>

</head>

<body>


<!-- =====================================================
     設定画面
===================================================== -->

<div id="setup">

  <div class="logo">
    🚲 cycletrain
  </div>


  <label>
    種別
  </label>

  <select id="type">

    <option>
      普通
    </option>

    <option>
      快速
    </option>

    <option>
      急行
    </option>

    <option>
      特急
    </option>

    <option>
      新快速
    </option>

  </select>


  <label>
    行き先
  </label>

  <input
    id="destinationName"
    type="text"
    placeholder="例：別府駅"
  >


  <label>
    速度制限
  </label>

  <div class="speedSetting">

    <input
      id="speedLimit"
      type="number"
      min="1"
      max="200"
      value="20"
      inputmode="numeric"
    >

    <div class="speedUnit">
      km/h
    </div>

  </div>


  <button
    class="startButton"
    onclick="startDrive()"
  >
    🚃 運転開始
  </button>

</div>



<!-- =====================================================
     運転画面
===================================================== -->

<div id="drive">


  <div id="board">
    快速・別府駅行き
  </div>


  <div id="distanceBox">
    📍 目的地を設定してください
  </div>


  <div id="limitBox">
    🚦 制限 20 km/h
  </div>


  <div id="followBox">

    追従

    <input
      id="followSwitch"
      type="checkbox"
      checked
    >

  </div>


  <div id="modeBox">
    🎯 目的地設定
  </div>


  <button
    id="routeButton"
    onclick="toggleRoutePanel()"
  >
    📍 地点一覧
  </button>


  <div id="routePanel">

    <div class="routeTitle">
      設定地点
    </div>

    <div id="routeList"></div>

  </div>


  <div id="map"></div>


  <div id="overspeed">
    ⚠️ 速度超過
  </div>


  <div id="speedBox">

    <div id="speed">
      0
    </div>

    <div class="kmh">
      km/h
    </div>

  </div>


  <button
    id="finishButton"
    onclick="finishDrive()"
  >
    運転終了
  </button>



  <!-- =================================================
       ATS
  ================================================== -->

  <div id="ats">

    <div
      id="atsText"
      class="atsWarning"
    >
      ⚠️ ATS作動
    </div>

    <div
      id="atsTimer"
      class="atsTimer"
    >
      自動終了まで 60 秒
    </div>

    <div class="slider">

      <div class="sliderText">
        スライドで解除
      </div>

      <div
        class="sliderButton"
        id="sliderButton"
      >
        →
      </div>

    </div>

  </div>

</div>



<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =====================================================
   基本変数
===================================================== */

let map = null;

let currentMarker = null;

let destination = null;

let destinationMarker = null;

let viaPoints = [];

let viaMarkers = [];

let currentViaIndex = 0;

let mode = "destination";

let watchID = null;

let speedLimit = 20;

let currentSpeed = 0;


/* =====================================================
   ATS
===================================================== */

let atsActive = false;

let atsTimer = null;

let atsCountdownTimer = null;

let atsSeconds = 60;

let atsType = "";


/*
 * ATS一回発動管理
 *
 * 目的地ATS
 * 経由地点ATS
 * 速度超過ATS
 */

let destinationATSUsed = false;

let viaATSUsed = [];

let overspeedATSUsed = false;


/* =====================================================
   キンコン
===================================================== */

let bellTimer = null;

let bellActive = false;


/* =====================================================
   音
===================================================== */

let audioContext = null;

let alarmOscillator = null;

let alarmGain = null;


/* =====================================================
   スライド
===================================================== */

let startX = 0;

let sliderX = 0;


/* =====================================================
   Audio準備
===================================================== */

function prepareAudio(){

  if(!audioContext){

    audioContext =
      new(
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  if(
    audioContext.state ===
    "suspended"
  ){

    audioContext.resume();

  }

}


/* =====================================================
   ATS ジリリリリ
===================================================== */

function startAlarm(){

  prepareAudio();

  stopAlarm();


  alarmOscillator =
    audioContext.createOscillator();

  alarmGain =
    audioContext.createGain();


  alarmOscillator.type =
    "square";


  alarmOscillator.frequency.value =
    700;


  alarmGain.gain.value =
    0.12;


  alarmOscillator.connect(
    alarmGain
  );

  alarmGain.connect(
    audioContext.destination
  );


  alarmOscillator.start();

}


/* =====================================================
   ATS音停止
===================================================== */

function stopAlarm(){

  if(alarmOscillator){

    try{

      alarmOscillator.stop();

    }catch(e){}

    try{

      alarmOscillator.disconnect();

    }catch(e){}

    alarmOscillator = null;

  }


  if(alarmGain){

    try{

      alarmGain.disconnect();

    }catch(e){}

    alarmGain = null;

  }

}


/* =====================================================
   キンコン
===================================================== */

function playBell(){

  prepareAudio();


  const now =
    audioContext.currentTime;


  /* キン */

  const osc1 =
    audioContext.createOscillator();

  const gain1 =
    audioContext.createGain();


  osc1.type =
    "sine";


  osc1.frequency.value =
    880;


  gain1.gain.setValueAtTime(
    0.16,
    now
  );


  gain1.gain.exponentialRampToValueAtTime(
    0.001,
    now + 0.14
  );


  osc1.connect(gain1);

  gain1.connect(
    audioContext.destination
  );


  osc1.start(now);

  osc1.stop(
    now + 0.14
  );


  /* コン */

  setTimeout(

    function(){

      if(!audioContext){

        return;

      }


      const now2 =
        audioContext.currentTime;


      const osc2 =
        audioContext.createOscillator();

      const gain2 =
        audioContext.createGain();


      osc2.type =
        "sine";


      osc2.frequency.value =
        660;


      gain2.gain.setValueAtTime(
        0.16,
        now2
      );


      gain2.gain.exponentialRampToValueAtTime(
        0.001,
        now2 + 0.16
      );


      osc2.connect(gain2);

      gain2.connect(
        audioContext.destination
      );


      osc2.start(now2);

      osc2.stop(
        now2 + 0.16
      );

    },

    140

  );

}


/* =====================================================
   キンコン開始
===================================================== */

function startBell(){

  stopBell();


  if(
    canStopBell()
  ){

    return;

  }


  bellActive = true;


  playBell();


  bellTimer =
    setInterval(

      function(){

        if(
          canStopBell()
        ){

          stopBell();

          return;

        }


        playBell();

      },

      700

    );

}


/* =====================================================
   キンコン停止
===================================================== */

function stopBell(){

  if(
    bellTimer !== null
  ){

    clearInterval(
      bellTimer
    );

    bellTimer = null;

  }


  bellActive = false;

}


/* =====================================================
   キンコン停止条件
===================================================== */

function canStopBell(){

  if(
    !currentMarker
  ){

    return false;

  }


  const current =
    currentMarker.getLatLng();


  /*
   * 目的地30m
   */

  if(destination){

    const distance =
      current.distanceTo(
        destination
      );


    if(
      distance <= 30
    ){

      return true;

    }

  }


  /*
   * 経由地点30m
   */

  for(
    let i = 0;
    i < viaPoints.length;
    i++
  ){

    const distance =
      current.distanceTo(
        viaPoints[i]
      );


    if(
      distance <= 30
    ){

      return true;

    }

  }


  /*
   * 速度ATS
   *
   * 制限速度 - 3km/h以下
   */

  if(
    atsType ===
    "overspeed"
  ){

    if(
      currentSpeed <=
      speedLimit - 3
    ){

      return true;

    }

  }


  return false;

}


/* =====================================================
   運転開始
===================================================== */

function startDrive(){

  const type =
    document.getElementById(
      "type"
    ).value;


  const name =
    document.getElementById(
      "destinationName"
    ).value.trim();


  speedLimit =
    Number(
      document.getElementById(
        "speedLimit"
      ).value
    );


  if(!name){

    alert(
      "行き先名を入力してください"
    );

    return;

  }


  if(
    !speedLimit ||
    speedLimit <= 0
  ){

    alert(
      "速度制限を設定してください"
    );

    return;

  }


  prepareAudio();


  document.getElementById(
    "board"
  ).textContent =
    type +
    "・" +
    name +
    "行き";


  document.getElementById(
    "limitBox"
  ).textContent =
    "🚦 制限 " +
    speedLimit +
    " km/h";


  document.getElementById(
    "setup"
  ).style.display =
    "none";


  document.getElementById(
    "drive"
  ).style.display =
    "block";


  /*
   * 完全リセット
   */

  destination = null;

  destinationMarker = null;

  viaPoints = [];

  viaMarkers = [];

  currentViaIndex = 0;

  destinationATSUsed = false;

  viaATSUsed = [];

  overspeedATSUsed = false;

  atsActive = false;

  atsType = "";

  mode = "destination";


  updateMode();


  setTimeout(
    initMap,
    100
  );

}


/* =====================================================
   地図
===================================================== */

function initMap(){

  if(map){

    map.invalidateSize();

    return;

  }


  map =
    L.map("map");


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,

      attribution:
        "&copy; OpenStreetMap contributors"
    }
  ).addTo(map);


  if(
    !navigator.geolocation
  ){

    alert(
      "この端末ではGPSを利用できません"
    );

    return;

  }


  navigator.geolocation.getCurrentPosition(

    function(position){

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;


      map.setView(
        [lat,lng],
        17
      );


      currentMarker =
        L.marker(
          [lat,lng]
        )
        .addTo(map)
        .bindPopup(
          "🚲 現在地"
        );


      startGPS();

    },


    function(){

      map.setView(
        [35.681236,139.767125],
        13
      );


      document.getElementById(
        "distanceBox"
      ).textContent =
        "📍 GPSを許可してください";

    },


    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:1000
    }

  );


  /*
   * 地図タップ
   */

  map.on(
    "click",
    function(e){

      setPoint(
        e.latlng.lat,
        e.latlng.lng
      );

    }
  );

}


/* =====================================================
   地点設定
===================================================== */

function setPoint(
  lat,
  lng
){

  /*
   * 目的地設定
   */

  if(
    mode ===
    "destination"
  ){

    if(destinationMarker){

      map.removeLayer(
        destinationMarker
      );

    }


    destination =
      L.latLng(
        lat,
        lng
      );


    destinationMarker =
      L.marker(
        [lat,lng]
      )
      .addTo(map)
      .bindPopup(
        "🎯 目的地"
      );


    /*
     * ATS使用フラグをリセット
     */

    destinationATSUsed = false;


    /*
     * 次は経由地点
     */

    mode =
      "via";


    updateMode();

    updateRouteList();


    document.getElementById(
      "distanceBox"
    ).textContent =
      "📍 経由地点を設定してください";


    return;

  }


  /*
   * 経由地点
   */

  if(
    mode ===
    "via"
  ){

    addViaPoint(
      lat,
      lng
    );

  }

}


/* =====================================================
   経由地点追加
===================================================== */

function addViaPoint(
  lat,
  lng
){

  const point =
    L.latLng(
      lat,
      lng
    );


  viaPoints.push(
    point
  );


  viaATSUsed.push(
    false
  );


  const marker =
    L.marker(
      [lat,lng]
    )
    .addTo(map)
    .bindPopup(
      "📍 経由地点 " +
      viaPoints.length
    );


  viaMarkers.push(
    marker
  );


  updateRouteList();

}


/* =====================================================
   モード表示
===================================================== */

function updateMode(){

  const box =
    document.getElementById(
      "modeBox"
    );


  if(
    mode ===
    "destination"
  ){

    box.textContent =
      "🎯 目的地設定";

  }else{

    box.textContent =
      "📍 経由地点設定";

  }

}


/* =====================================================
   地点一覧
===================================================== */

function updateRouteList(){

  const list =
    document.getElementById(
      "routeList"
    );


  list.innerHTML = "";


  /*
   * 目的地
   */

  if(destination){

    const item =
      document.createElement(
        "div"
      );


    item.className =
      "routeItem";


    const text =
      document.createElement(
        "span"
      );


    text.textContent =
      "🎯 目的地";


    const button =
      document.createElement(
        "button"
      );


    button.className =
      "deleteRoute";


    button.textContent =
      "削除";


    button.onclick =
      function(){

        deleteDestination();

      };


    item.appendChild(
      text
    );

    item.appendChild(
      button
    );

    list.appendChild(
      item
    );

  }


  /*
   * 経由地点
   */

  viaPoints.forEach(

    function(point,index){

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "routeItem";


      const text =
        document.createElement(
          "span"
        );


      text.textContent =
        "📍 経由 " +
        (index + 1);


      const button =
        document.createElement(
          "button"
        );


      button.className =
        "deleteRoute";


      button.textContent =
        "削除";


      button.onclick =
        function(){

          deleteViaPoint(
            index
          );

        };


      item.appendChild(
        text
      );

      item.appendChild(
        button
      );


      list.appendChild(
        item
      );

    }

  );

}


/* =====================================================
   目的地削除
===================================================== */

function deleteDestination(){

  if(
    !confirm(
      "目的地を削除しますか？"
    )
  ){

    return;

  }


  if(destinationMarker){

    map.removeLayer(
      destinationMarker
    );

  }


  destination = null;

  destinationMarker = null;


  /*
   * 目的地ATSもリセット
   */

  destinationATSUsed = false;


  /*
   * 目的地設定へ戻す
   */

  mode =
    "destination";


  updateMode();

  updateRouteList();


  document.getElementById(
    "distanceBox"
  ).textContent =
    "🎯 新しい目的地を設定してください";

}


/* =====================================================
   経由地点削除
===================================================== */

function deleteViaPoint(
  index
){

  if(
    !confirm(
      "この経由地点を削除しますか？"
    )
  ){

    return;

  }


  if(
    viaMarkers[index]
  ){

    map.removeLayer(
      viaMarkers[index]
    );

  }


  viaMarkers.splice(
    index,
    1
  );


  viaPoints.splice(
    index,
    1
  );


  viaATSUsed.splice(
    index,
    1
  );


  if(
    currentViaIndex >
    index
  ){

    currentViaIndex--;

  }


  if(
    currentViaIndex < 0
  ){

    currentViaIndex = 0;

  }


  updateRouteList();

}


/* =====================================================
   地点一覧開閉
===================================================== */

function toggleRoutePanel(){

  const panel =
    document.getElementById(
      "routePanel"
    );


  if(
    panel.style.display ===
    "block"
  ){

    panel.style.display =
      "none";

  }else{

    panel.style.display =
      "block";

  }

}


/* =====================================================
   GPS
===================================================== */

function startGPS(){

  if(
    watchID !== null
  ){

    navigator.geolocation.clearWatch(
      watchID
    );

  }


  watchID =
    navigator.geolocation.watchPosition(

      function(position){

        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;


        /*
         * 速度
         */

        let speed =
          position.coords.speed;


        if(
          speed === null ||
          speed < 0
        ){

          speed = 0;

        }


        speed =
          speed * 3.6;


        currentSpeed =
          speed;


        document.getElementById(
          "speed"
        ).textContent =
          Math.round(speed);


        /*
         * 現在地
         */

        if(currentMarker){

          currentMarker.setLatLng(
            [lat,lng]
          );

        }


        /*
         * 地図追従
         */

        const follow =
          document.getElementById(
            "followSwitch"
          ).checked;


        if(
          follow &&
          map
        ){

          map.panTo(
            [lat,lng],
            {
              animate:true,
              duration:.5
            }
          );

        }


        /*
         * 現在地
         */

        const current =
          L.latLng(
            lat,
            lng
          );


        /* =================================================
           速度超過ATS
        ================================================= */

        if(
          speed > speedLimit
        ){

          document.getElementById(
            "overspeed"
          ).style.display =
            "block";


          /*
           * ATSは1回だけ
           */

          if(
            !atsActive &&
            !overspeedATSUsed
          ){

            overspeedATSUsed = true;


            activateATS(
              "⚠️ 速度超過ATS",
              "overspeed"
            );

          }

        }else{

          document.getElementById(
            "overspeed"
          ).style.display =
            "none";

        }


        /*
         * 目的地なし
         */

        if(
          !destination
        ){

          return;

        }


        /* =================================================
           経由地点
        ================================================= */

        if(
          currentViaIndex <
          viaPoints.length
        ){

          const via =
            viaPoints[
              currentViaIndex
            ];


          const distance =
            current.distanceTo(
              via
            );


          document.getElementById(
            "distanceBox"
          ).textContent =
            "📍 経由 " +
            (currentViaIndex + 1) +
            "まで " +
            Math.round(distance) +
            "m";


          /*
           * 100m以内 ATS
           *
           * この経由地点で一回だけ
           */

          if(
            distance <= 100 &&
            !atsActive &&
            !viaATSUsed[currentViaIndex]
          ){

            viaATSUsed[
              currentViaIndex
            ] = true;


            activateATS(
              "⚠️ 経由地点ATS",
              "via"
            );


            return;

          }


          /*
           * 30m以内キンコン停止
           */

          if(
            distance <= 30
          ){

            stopBell();

          }


          return;

        }


        /* =================================================
           目的地
        ================================================= */

        const distance =
          current.distanceTo(
            destination
          );


        document.getElementById(
          "distanceBox"
        ).textContent =
          "🎯 目的地まで " +
          Math.round(distance) +
          "m";


        /*
         * 200m以内ATS
         *
         * 目的地ATSは一回だけ
         */

        if(
          distance <= 200 &&
          !atsActive &&
          !destinationATSUsed
        ){

          destinationATSUsed = true;


          activateATS(
            "🏁 目的地ATS",
            "destination"
          );


          return;

        }


        /*
         * 30m以内
         */

        if(
          distance <= 30
        ){

          stopBell();

        }

      },


      function(){

        document.getElementById(
          "distanceBox"
        ).textContent =
          "📍 GPS取得失敗";

      },


      {
        enableHighAccuracy:true,
        maximumAge:1000,
        timeout:10000
      }

    );

}


/* =====================================================
   ATS作動
===================================================== */

function activateATS(
  message,
  type
){

  /*
   * すでにATS中なら何もしない
   */

  if(
    atsActive
  ){

    return;

  }


  atsActive = true;

  atsType = type;

  atsSeconds = 60;


  /*
   * キンコン停止
   */

  stopBell();


  /*
   * 終了ボタン非表示
   */

  document.getElementById(
    "finishButton"
  ).style.display =
    "none";


  /*
   * ATS表示
   */

  document.getElementById(
    "ats"
  ).style.display =
    "block";


  document.getElementById(
    "atsText"
  ).textContent =
    message;


  document.getElementById(
    "atsTimer"
  ).textContent =
    "自動終了まで 60 秒";


  /*
   * ジリリリリ
   */

  startAlarm();


  /*
   * バイブ
   */

  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      [300,200]
    );

  }


  /*
   * カウントダウン
   */

  clearInterval(
    atsCountdownTimer
  );


  atsCountdownTimer =
    setInterval(

      function(){

        atsSeconds--;


        if(
          atsSeconds < 0
        ){

          atsSeconds = 0;

        }


        document.getElementById(
          "atsTimer"
        ).textContent =
          "自動終了まで " +
          atsSeconds +
          " 秒";


        if(
          atsSeconds <= 0
        ){

          releaseATS();

        }

      },

      1000

    );


  /*
   * 60秒強制終了
   */

  clearTimeout(
    atsTimer
  );


  atsTimer =
    setTimeout(

      function(){

        releaseATS();

      },

      60000

    );

}


/* =====================================================
   ATS解除
===================================================== */

function releaseATS(){

  if(
    !atsActive
  ){

    return;

  }


  atsActive = false;


  clearTimeout(
    atsTimer
  );


  clearInterval(
    atsCountdownTimer
  );


  atsTimer = null;

  atsCountdownTimer = null;


  /*
   * ATS音停止
   */

  stopAlarm();


  /*
   * バイブ停止
   */

  if(
    navigator.vibrate
  ){

    navigator.vibrate(0);

  }


  /*
   * ATS画面を消す
   */

  document.getElementById(
    "ats"
  ).style.display =
    "none";


  /*
   * 終了ボタン復活
   */

  document.getElementById(
    "finishButton"
  ).style.display =
    "block";


  /*
   * ATS解除後
   *
   * キンコン再開
   *
   * ただし30m以内なら鳴らさない
   * 速度ATSなら速度が十分下がるまで鳴らさない
   */

  if(
    !canStopBell()
  ){

    startBell();

  }

}


/* =====================================================
   ATSスライダー
===================================================== */

const sliderButton =
  document.getElementById(
    "sliderButton"
  );


/*
 * タッチ開始
 */

sliderButton.addEventListener(
  "touchstart",
  function(e){

    if(
      !atsActive
    ){

      return;

    }


    startX =
      e.touches[0].clientX;

  },
  {
    passive:true
  }
);


/*
 * タッチ移動
 */

sliderButton.addEventListener(
  "touchmove",
  function(e){

    if(
      !atsActive
    ){

      return;

    }


    const x =
      e.touches[0].clientX;


    sliderX =
      x - startX;


    if(
      sliderX < 0
    ){

      sliderX = 0;

    }


    const slider =
      sliderButton.parentElement;


    const max =
      slider.clientWidth -
      sliderButton.clientWidth -
      10;


    if(
      sliderX > max
    ){

      sliderX = max;

    }


    sliderButton.style.transform =
      "translateX(" +
      sliderX +
      "px)";

  },
  {
    passive:true
  }
);


/*
 * タッチ終了
 */

sliderButton.addEventListener(
  "touchend",
  function(){

    if(
      !atsActive
    ){

      return;

    }


    const slider =
      sliderButton.parentElement;


    const max =
      slider.clientWidth -
      sliderButton.clientWidth -
      10;


    /*
     * 70%以上
     */

    if(
      sliderX >=
      max * 0.7
    ){

      releaseATS();


      sliderButton.style.transform =
        "translateX(0)";


      sliderX = 0;

    }else{

      sliderButton.style.transform =
        "translateX(0)";


      sliderX = 0;

    }

  }
);


/* =====================================================
   運転終了
===================================================== */

function finishDrive(){

  /*
   * ATS中は終了不可
   */

  if(
    atsActive
  ){

    return;

  }


  if(
    !confirm(
      "運転を終了しますか？"
    )
  ){

    return;

  }


  /*
   * 音停止
   */

  stopAlarm();

  stopBell();


  /*
   * タイマー停止
   */

  clearTimeout(
    atsTimer
  );

  clearInterval(
    atsCountdownTimer
  );


  atsTimer = null;

  atsCountdownTimer = null;


  /*
   * GPS停止
   */

  if(
    watchID !== null
  ){

    navigator.geolocation.clearWatch(
      watchID
    );

    watchID = null;

  }


  /*
   * 経由地点削除
   */

  viaMarkers.forEach(

    function(marker){

      if(map){

        map.removeLayer(
          marker
        );

      }

    }

  );


  /*
   * 目的地削除
   */

  if(
    destinationMarker &&
    map
  ){

    map.removeLayer(
      destinationMarker
    );

  }


  /*
   * 現在地削除
   */

  if(
    currentMarker &&
    map
  ){

    map.removeLayer(
      currentMarker
    );

  }


  /*
   * 初期化
   */

  destination = null;

  destinationMarker = null;

  viaPoints = [];

  viaMarkers = [];

  viaATSUsed = [];

  currentViaIndex = 0;


  destinationATSUsed = false;

  overspeedATSUsed = false;


  atsActive = false;

  atsType = "";

  mode = "destination";

  currentSpeed = 0;


  /*
   * 現在地
   */

  currentMarker = null;


  /*
   * 画面
   */

  document.getElementById(
    "drive"
  ).style.display =
    "none";


  document.getElementById(
    "setup"
  ).style.display =
    "block";


  /*
   * パネル
   */

  document.getElementById(
    "routePanel"
  ).style.display =
    "none";


  /*
   * 速度
   */

  document.getElementById(
    "speed"
  ).textContent =
    "0";


  /*
   * 速度超過
   */

  document.getElementById(
    "overspeed"
  ).style.display =
    "none";


  /*
   * モード
   */

  updateMode();


  /*
   * ATSスライダー
   */

  sliderButton.style.transform =
    "translateX(0)";

  sliderX = 0;

}


/* =====================================================
   初期状態
===================================================== */

updateMode();

</script>
