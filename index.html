<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>cycletrain</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #080b10;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  overflow: hidden;
}

/* =========================
   設定画面
========================= */

#setup {
  height: 100vh;
  padding: 35px 22px;
}

.logo {
  text-align: center;
  font-size: 32px;
  font-weight: 800;
  margin-top: 20px;
  margin-bottom: 45px;
}

label {
  display: block;
  color: #aaa;
  font-size: 15px;
  margin-bottom: 8px;
  margin-top: 22px;
}

select,
input {
  width: 100%;
  height: 56px;
  padding: 0 16px;
  border-radius: 15px;
  border: 1px solid #363d48;
  background: #171c24;
  color: white;
  font-size: 18px;
  outline: none;
}

.startButton {
  width: 100%;
  height: 60px;
  margin-top: 32px;
  border: none;
  border-radius: 17px;
  background: #238636;
  color: white;
  font-size: 19px;
  font-weight: bold;
}

/* =========================
   運転画面
========================= */

#drive {
  display: none;
  height: 100vh;
  position: relative;
}

/* 幕 */

#board {
  height: 78px;
  background: #050505;
  border-bottom: 3px solid #30343a;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 25px;
  font-weight: 800;

  white-space: nowrap;
  overflow: hidden;
}

/* マップ */

#map {
  height: calc(100vh - 285px);
  position: relative;
  overflow: hidden;

  background-color: #20252b;

  background-image:
    linear-gradient(#343a42 1px, transparent 1px),
    linear-gradient(90deg, #343a42 1px, transparent 1px);

  background-size: 45px 45px;
}

/* 道っぽい線 */

.road1 {
  position: absolute;
  width: 140%;
  height: 18px;
  background: #555d66;
  transform: rotate(-18deg);
  top: 45%;
  left: -20%;
}

.road2 {
  position: absolute;
  width: 140%;
  height: 18px;
  background: #555d66;
  transform: rotate(35deg);
  top: 55%;
  left: -20%;
}

/* 自転車 */

.bike {
  position: absolute;
  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  font-size: 45px;
  z-index: 5;

  filter: drop-shadow(0 3px 4px #000);
}

/* 現在地 */

.locationText {
  position: absolute;
  top: 15px;
  left: 15px;

  padding: 8px 12px;

  background: rgba(0,0,0,0.7);
  border-radius: 10px;

  font-size: 13px;
  color: #ddd;
}

/* =========================
   速度
========================= */

#speedBox {
  position: absolute;

  bottom: 125px;
  left: 0;

  width: 100%;

  text-align: center;
}

#speed {
  font-size: 52px;
  font-weight: 800;
}

.kmh {
  color: #aaa;
  font-size: 16px;
}

/* =========================
   終了ボタン
========================= */

#finishButton {
  position: absolute;

  bottom: 20px;
  left: 20px;

  width: calc(100% - 40px);
  height: 65px;

  border: none;
  border-radius: 18px;

  background: #252b34;
  color: white;

  font-size: 20px;
  font-weight: bold;
}

/* =========================
   ATS
========================= */

#ats {
  display: none;

  position: absolute;

  bottom: 20px;
  left: 20px;

  width: calc(100% - 40px);
}

.atsWarning {
  text-align: center;

  color: #ff453a;

  font-size: 18px;
  font-weight: bold;

  margin-bottom: 9px;
}

/* スライダー */

.slider {
  position: relative;

  height: 65px;

  border-radius: 18px;

  background: #252b34;

  overflow: hidden;

  touch-action: none;
}

.sliderText {
  position: absolute;

  width: 100%;
  height: 100%;

  display: flex;
  align-items: center;
  justify-content: center;

  color: #aaa;

  font-size: 18px;
}

.sliderButton {
  position: absolute;

  left: 5px;
  top: 5px;

  width: 55px;
  height: 55px;

  border-radius: 15px;

  background: #ff453a;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 25px;
  font-weight: bold;

  z-index: 10;

  touch-action: none;
}
</style>
</head>


<body>

<!-- =========================
     設定画面
========================= -->

<div id="setup">

  <div class="logo">
    🚲 cycletrain
  </div>

  <label>種別</label>

  <select id="type">
    <option>普通</option>
    <option>快速</option>
    <option>急行</option>
    <option>特急</option>
    <option>新快速</option>
  </select>


  <label>行き先</label>

  <input
    id="destination"
    type="text"
    placeholder="例：別府駅"
  >


  <button
    class="startButton"
    onclick="startDrive()"
  >
    運転開始
  </button>

</div>


<!-- =========================
     運転画面
========================= -->

<div id="drive">

  <!-- 幕 -->

  <div id="board">
    快速・別府駅行き
  </div>


  <!-- マップ -->

  <div id="map">

    <div class="road1"></div>
    <div class="road2"></div>

    <div class="locationText">
      📍 GPS待機中
    </div>

    <div class="bike">
      🚲
    </div>

  </div>


  <!-- 速度 -->

  <div id="speedBox">

    <div id="speed">
      0
    </div>

    <div class="kmh">
      km/h
    </div>

  </div>


  <!-- 終了 -->

  <button
    id="finishButton"
    onclick="finishDrive()"
  >
    運転終了
  </button>


  <!-- ATS -->

  <div id="ats">

    <div class="atsWarning">
      ⚠️ ATS作動
    </div>

    <div class="slider">

      <div class="sliderText">
        スライドで解除
      </div>

      <div
        class="sliderButton"
        id="sliderButton"
      >
        →
      </div>

    </div>

  </div>

</div>


<script>

let atsActive = false;

let startX = 0;

let sliderX = 0;

let watchID = null;


/* =========================
   運転開始
========================= */

function startDrive() {

  const type =
    document.getElementById("type").value;

  const destination =
    document.getElementById("destination").value.trim();


  if (destination === "") {

    alert("行き先を入力してください");

    return;

  }


  /* 幕 */

  document.getElementById("board").textContent =
    type + "・" + destination + "行き";


  /* 画面切り替え */

  document.getElementById("setup").style.display =
    "none";

  document.getElementById("drive").style.display =
    "block";


  /* GPS開始 */

  startGPS();


  /*
    ATSテスト

    本番ではここを
    「目的地まで200m」
    の判定に変更する
  */

  setTimeout(function() {

    activateATS();

  }, 5000);

}


/* =========================
   GPS
========================= */

function startGPS() {

  if (!navigator.geolocation) {

    document.querySelector(".locationText").textContent =
      "📍 GPS非対応";

    return;

  }


  watchID =
    navigator.geolocation.watchPosition(

      function(position) {

        let speed =
          position.coords.speed;


        if (speed === null || speed < 0) {

          speed = 0;

        }


        /* m/s → km/h */

        speed = speed * 3.6;


        document.getElementById("speed").textContent =
          Math.round(speed);


        document.querySelector(".locationText").textContent =
          "📍 GPS取得中";

      },


      function() {

        document.querySelector(".locationText").textContent =
          "📍 GPS取得失敗";

      },

      {
        enableHighAccuracy: true,
        maximumAge: 1000,
        timeout: 10000
      }

    );

}


/* =========================
   ATS作動
========================= */

function activateATS() {

  atsActive = true;


  document.getElementById("finishButton").style.display =
    "none";


  document.getElementById("ats").style.display =
    "block";


  /* ATS音 */

  playATS();

}


/* =========================
   ATS音
========================= */

function playATS() {

  if (!atsActive) return;


  const audioContext =
    new (window.AudioContext ||
    window.webkitAudioContext)();


  const oscillator =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();


  oscillator.frequency.value = 880;

  gain.gain.value = 0.12;


  oscillator.connect(gain);

  gain.connect(audioContext.destination);


  oscillator.start();


  setTimeout(function() {

    oscillator.stop();

  }, 180);


}


/* =========================
   スライド開始
========================= */

const sliderButton =
  document.getElementById("sliderButton");


sliderButton.addEventListener(
  "touchstart",
  function(event) {

    if (!atsActive) return;

    startX =
      event.touches[0].clientX;

  }
);


/* =========================
   スライド中
========================= */

sliderButton.addEventListener(
  "touchmove",
  function(event) {

    if (!atsActive) return;


    const currentX =
      event.touches[0].clientX;


    sliderX =
      currentX - startX;


    if (sliderX < 0) {

      sliderX = 0;

    }


    if (sliderX > 250) {

      sliderX = 250;

    }


    sliderButton.style.transform =
      "translateX(" + sliderX + "px)";

  }
);


/* =========================
   スライド終了
========================= */

sliderButton.addEventListener(
  "touchend",
  function() {

    if (!atsActive) return;


    if (sliderX >= 190) {

      /* ATS解除 */

      atsActive = false;


      sliderButton.style.transform =
        "translateX(250px)";


      setTimeout(function() {

        document.getElementById("ats").style.display =
          "none";


        document.getElementById("finishButton").style.display =
          "block";


        sliderButton.style.transform =
          "translateX(0)";


        sliderX = 0;

      }, 250);

    }

    else {

      /* 戻す */

      sliderButton.style.transform =
        "translateX(0)";

      sliderX = 0;

    }

  }
);


/* =========================
   運転終了
========================= */

function finishDrive() {

  if (atsActive) {

    return;

  }


  const answer =
    confirm("運転を終了しますか？");


  if (!answer) return;


  /* GPS停止 */

  if (watchID !== null) {

    navigator.geolocation.clearWatch(
      watchID
    );

    watchID = null;

  }


  /* 画面を戻す */

  document.getElementById("drive").style.display =
    "none";

  document.getElementById("setup").style.display =
    "block";


  document.getElementById("speed").textContent =
    "0";

}

</script>

</body>
</html>
