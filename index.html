<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>cycletrain</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #080b10;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  overflow: hidden;
}

/* =========================
   設定画面
========================= */

#setup {
  height: 100vh;
  padding: 30px 22px;
}

.logo {
  text-align: center;
  font-size: 32px;
  font-weight: 800;
  margin-top: 25px;
  margin-bottom: 45px;
}

label {
  display: block;
  margin-top: 20px;
  margin-bottom: 8px;
  color: #aaa;
}

select,
input {
  width: 100%;
  height: 56px;
  padding: 0 16px;
  border-radius: 15px;
  border: 1px solid #363d48;
  background: #171c24;
  color: white;
  font-size: 18px;
  outline: none;
}

.startButton {
  width: 100%;
  height: 60px;
  margin-top: 32px;
  border: none;
  border-radius: 17px;
  background: #238636;
  color: white;
  font-size: 19px;
  font-weight: bold;
}

/* =========================
   運転画面
========================= */

#drive {
  display: none;
  height: 100vh;
  position: relative;
}

/* 幕 */

#board {
  height: 78px;
  background: #050505;
  border-bottom: 3px solid #30343a;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 25px;
  font-weight: 800;

  white-space: nowrap;
  overflow: hidden;
}

/* =========================
   マップ
========================= */

#map {
  height: calc(100vh - 285px);
  position: relative;
  overflow: hidden;

  background-color: #20252b;

  background-image:
    linear-gradient(#343a42 1px, transparent 1px),
    linear-gradient(90deg, #343a42 1px, transparent 1px);

  background-size: 45px 45px;
}

.road1 {
  position: absolute;
  width: 140%;
  height: 18px;
  background: #555d66;
  transform: rotate(-18deg);
  top: 45%;
  left: -20%;
}

.road2 {
  position: absolute;
  width: 140%;
  height: 18px;
  background: #555d66;
  transform: rotate(35deg);
  top: 55%;
  left: -20%;
}

.bike {
  position: absolute;
  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  font-size: 45px;
  z-index: 5;
}

.locationText {
  position: absolute;
  top: 15px;
  left: 15px;

  padding: 8px 12px;

  background: rgba(0,0,0,0.7);
  border-radius: 10px;

  font-size: 13px;
  color: #ddd;
}

/* =========================
   速度
========================= */

#speedBox {
  position: absolute;
  bottom: 125px;
  left: 0;
  width: 100%;
  text-align: center;
}

#speed {
  font-size: 52px;
  font-weight: 800;
}

.kmh {
  color: #aaa;
  font-size: 16px;
}

/* =========================
   終了ボタン
========================= */

#finishButton {
  position: absolute;

  bottom: 20px;
  left: 20px;

  width: calc(100% - 40px);
  height: 65px;

  border: none;
  border-radius: 18px;

  background: #252b34;
  color: white;

  font-size: 20px;
  font-weight: bold;
}

/* =========================
   ATS
========================= */

#ats {
  display: none;

  position: absolute;

  bottom: 20px;
  left: 20px;

  width: calc(100% - 40px);
}

.atsWarning {
  text-align: center;

  color: #ff453a;

  font-size: 18px;
  font-weight: bold;

  margin-bottom: 9px;
}

.slider {
  position: relative;

  height: 65px;

  border-radius: 18px;

  background: #252b34;

  overflow: hidden;

  touch-action: none;
}

.sliderText {
  position: absolute;

  width: 100%;
  height: 100%;

  display: flex;
  align-items: center;
  justify-content: center;

  color: #aaa;

  font-size: 18px;
}

.sliderButton {
  position: absolute;

  left: 5px;
  top: 5px;

  width: 55px;
  height: 55px;

  border-radius: 15px;

  background: #ff453a;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 25px;
  font-weight: bold;

  z-index: 10;

  touch-action: none;
}
</style>
</head>


<body>

<!-- =========================
     設定
========================= -->

<div id="setup">

  <div class="logo">
    🚲 cycletrain
  </div>

  <label>種別</label>

  <select id="type">
    <option>普通</option>
    <option>快速</option>
    <option>急行</option>
    <option>特急</option>
    <option>新快速</option>
  </select>


  <label>行き先</label>

  <input
    id="destination"
    type="text"
    placeholder="例：別府駅"
  >


  <button
    class="startButton"
    onclick="startDrive()"
  >
    🚃 運転開始
  </button>

</div>


<!-- =========================
     運転画面
========================= -->

<div id="drive">

  <div id="board">
    快速・別府駅行き
  </div>


  <div id="map">

    <div class="road1"></div>
    <div class="road2"></div>

    <div class="locationText">
      📍 GPS待機中
    </div>

    <div class="bike">
      🚲
    </div>

  </div>


  <!-- 速度 -->

  <div id="speedBox">

    <div id="speed">
      0
    </div>

    <div class="kmh">
      km/h
    </div>

  </div>


  <!-- 通常時 -->

  <button
    id="finishButton"
    onclick="finishDrive()"
  >
    運転終了
  </button>


  <!-- ATS -->

  <div id="ats">

    <div class="atsWarning">
      ⚠️ ATS作動
    </div>

    <div class="slider">

      <div class="sliderText">
        スライドで解除
      </div>

      <div
        class="sliderButton"
        id="sliderButton"
      >
        →
      </div>

    </div>

  </div>

</div>


<script>

/* =========================
   変数
========================= */

let atsActive = false;

let startX = 0;

let sliderX = 0;

let watchID = null;

let alarmInterval = null;

let bellInterval = null;

let audioContext = null;


/* =========================
   音声システム準備
========================= */

function prepareAudio() {

  if (!audioContext) {

    audioContext =
      new (window.AudioContext ||
      window.webkitAudioContext)();

  }

  if (audioContext.state === "suspended") {

    audioContext.resume();

  }

}


/* =========================
   ジリリリ音
========================= */

function ringAlarm() {

  if (!audioContext) return;

  const oscillator =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();

  oscillator.type = "square";

  oscillator.frequency.value = 700;

  gain.gain.value = 0.12;

  oscillator.connect(gain);

  gain.connect(audioContext.destination);

  oscillator.start();

  setTimeout(function() {

    oscillator.stop();

  }, 350);

}


/* =========================
   ATS警報開始
========================= */

function startAlarm() {

  stopAlarm();

  ringAlarm();

  alarmInterval =
    setInterval(function() {

      if (atsActive) {

        ringAlarm();

      }

    }, 450);

}


/* =========================
   ATS警報停止
========================= */

function stopAlarm() {

  if (alarmInterval !== null) {

    clearInterval(alarmInterval);

    alarmInterval = null;

  }

}


/* =========================
   キンコン音
========================= */

function playBell() {

  if (!audioContext) return;

  /* キン */

  const osc1 =
    audioContext.createOscillator();

  const gain1 =
    audioContext.createGain();

  osc1.type = "sine";

  osc1.frequency.value = 880;

  gain1.gain.value = 0.15;

  osc1.connect(gain1);

  gain1.connect(audioContext.destination);

  osc1.start();

  setTimeout(function() {

    osc1.stop();

  }, 180);


  /* コン */

  setTimeout(function() {

    if (!audioContext) return;

    const osc2 =
      audioContext.createOscillator();

    const gain2 =
      audioContext.createGain();

    osc2.type = "sine";

    osc2.frequency.value = 660;

    gain2.gain.value = 0.15;

    osc2.connect(gain2);

    gain2.connect(audioContext.destination);

    osc2.start();

    setTimeout(function() {

      osc2.stop();

    }, 220);

  }, 180);

}


/* =========================
   キンコン開始
========================= */

function startBell() {

  stopBell();

  playBell();

  bellInterval =
    setInterval(function() {

      playBell();

    }, 1300);

}


/* =========================
   キンコン停止
========================= */

function stopBell() {

  if (bellInterval !== null) {

    clearInterval(bellInterval);

    bellInterval = null;

  }

}


/* =========================
   運転開始
========================= */

function startDrive() {

  prepareAudio();

  const type =
    document.getElementById("type").value;

  const destination =
    document.getElementById("destination").value.trim();


  if (destination === "") {

    alert("行き先を入力してください");

    return;

  }


  document.getElementById("board").textContent =
    type + "・" + destination + "行き";


  document.getElementById("setup").style.display =
    "none";

  document.getElementById("drive").style.display =
    "block";


  startGPS();


  /*
   * 今はテスト用
   * 5秒後にATS作動
   *
   * 後でここを
   * 「目的地まで200m」
   * のGPS判定に変更する
   */

  setTimeout(function() {

    activateATS();

  }, 5000);

}


/* =========================
   GPS
========================= */

function startGPS() {

  if (!navigator.geolocation) {

    document.querySelector(".locationText").textContent =
      "📍 GPS非対応";

    return;

  }


  watchID =
    navigator.geolocation.watchPosition(

      function(position) {

        let speed =
          position.coords.speed;


        if (speed === null || speed < 0) {

          speed = 0;

        }


        speed =
          speed * 3.6;


        document.getElementById("speed").textContent =
          Math.round(speed);


        document.querySelector(".locationText").textContent =
          "📍 GPS取得中";

      },


      function() {

        document.querySelector(".locationText").textContent =
          "📍 GPS取得失敗";

      },


      {
        enableHighAccuracy: true,
        maximumAge: 1000,
        timeout: 10000
      }

    );

}


/* =========================
   ATS作動
========================= */

function activateATS() {

  if (atsActive) return;

  atsActive = true;


  document.getElementById("finishButton").style.display =
    "none";

  document.getElementById("ats").style.display =
    "block";


  /* ジリリリ開始 */

  startAlarm();

}


/* =========================
   ATSスライド
========================= */

const sliderButton =
  document.getElementById("sliderButton");


sliderButton.addEventListener(
  "touchstart",
  function(event) {

    if (!atsActive) return;

    startX =
      event.touches[0].clientX;

  }
);


sliderButton.addEventListener(
  "touchmove",
  function(event) {

    if (!atsActive) return;


    const currentX =
      event.touches[0].clientX;


    sliderX =
      currentX - startX;


    if (sliderX < 0) {

      sliderX = 0;

    }


    if (sliderX > 250) {

      sliderX = 250;

    }


    sliderButton.style.transform =
      "translateX(" + sliderX + "px)";

  }
);


sliderButton.addEventListener(
  "touchend",
  function() {

    if (!atsActive) return;


    if (sliderX >= 190) {

      /*
       * ATS解除
       */

      atsActive = false;


      /* ジリリ停止 */

      stopAlarm();


      sliderButton.style.transform =
        "translateX(250px)";


      setTimeout(function() {

        document.getElementById("ats").style.display =
          "none";


        document.getElementById("finishButton").style.display =
          "block";


        sliderButton.style.transform =
          "translateX(0)";


        sliderX = 0;


        /*
         * 解除後から
         * キンコン開始
         */

        startBell();

      }, 250);

    }

    else {

      sliderButton.style.transform =
        "translateX(0)";

      sliderX = 0;

    }

  }
);


/* =========================
   運転終了
========================= */

function finishDrive() {

  if (atsActive) {

    return;

  }


  if (!confirm("運転を終了しますか？")) {

    return;

  }


  /* 全音停止 */

  stopAlarm();

  stopBell();


  /* GPS停止 */

  if (watchID !== null) {

    navigator.geolocation.clearWatch(
      watchID
    );

    watchID = null;

  }


  /* 画面を戻す */

  document.getElementById("drive").style.display =
    "none";

  document.getElementById("setup").style.display =
    "block";


  document.getElementById("speed").textContent =
    "0";

}

</script>

</body>
</html>
