<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>cycletrain</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}
body{
  background:#08090c;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
}
/* =========================
   共通Liquid Glass
========================= */
.glass{
  background:rgba(20,20,24,.72);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:
    0 15px 45px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.12);
  backdrop-filter:blur(30px) saturate(170%);
  -webkit-backdrop-filter:blur(30px) saturate(170%);
}
/* =========================
   設定画面
========================= */
#setup{
  width:100%;
  height:100vh;
  padding:20px;
  overflow-y:auto;
}
.logo{
  text-align:center;
  font-size:34px;
  font-weight:850;
  letter-spacing:-1.5px;
  margin:20px 0;
}
/* =========================
   設定マップ
========================= */
#setupMapArea{
  position:relative;
  width:100%;
  height:43vh;
  min-height:300px;
  border-radius:30px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 15px 50px rgba(0,0,0,.45);
}
#setupMap{
  width:100%;
  height:100%;
}
.setupHint{
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  z-index:1000;
  padding:11px 14px;
  border-radius:20px;
  background:rgba(0,0,0,.72);
  border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  text-align:center;
  font-size:13px;
  font-weight:700;
}
/* =========================
   入力
========================= */
label{
  display:block;
  margin:16px 4px 7px;
  color:rgba(255,255,255,.58);
  font-size:14px;
  font-weight:650;
}
select,input{
  width:100%;
  height:56px;
  padding:0 16px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,.13);
  background:rgba(255,255,255,.075);
  color:#fff;
  font-size:17px;
  outline:none;
}
select option{
  background:#17191e;
  color:#fff;
}
/* =========================
   ルート設定情報
========================= */
#setupInfo{
  margin-top:12px;
  padding:14px;
  border-radius:21px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.09);
  font-size:14px;
  line-height:1.75;
}
.small{
  color:rgba(255,255,255,.55);
  font-size:12px;
}
/* =========================
   経由地名入力
========================= */
#viaNameArea{
  display:none;
  margin-top:10px;
}
#viaNameRow{
  display:flex;
  gap:8px;
}
#viaNameRow input{
  flex:1;
}
.smallButton{
  width:90px;
  border:0;
  border-radius:18px;
  background:#ff9500;
  color:#fff;
  font-weight:800;
}
/* =========================
   開始
========================= */
.startButton{
  width:100%;
  height:62px;
  margin-top:16px;
  border:0;
  border-radius:23px;
  background:linear-gradient(
    180deg,
    #4aa3ff,
    #1478e8
  );
  color:#fff;
  font-size:19px;
  font-weight:800;
  box-shadow:
    0 12px 35px rgba(20,120,232,.30),
    inset 0 1px 0 rgba(255,255,255,.32);
}
.startButton:active{
  transform:scale(.97);
}
/* =========================
   運転画面
========================= */
#drive{
  display:none;
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
}
/* =========================
   行先幕
========================= */
#board{
  position:absolute;
  top:calc(8px + env(safe-area-inset-top));
  left:10px;
  right:10px;
  height:70px;
  z-index:3000;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:0 14px;
  border-radius:26px;
  background:linear-gradient(
    135deg,
    rgba(0,0,0,.88),
    rgba(28,28,31,.64)
  );
  border:1px solid rgba(255,255,255,.17);
  box-shadow:
    0 14px 42px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.14);
  backdrop-filter:blur(32px) saturate(180%);
  -webkit-backdrop-filter:blur(32px) saturate(180%);
}
/* 種別 */
#boardType{
  font-size:21px;
  font-weight:850;
  white-space:nowrap;
}
/* 行先幕 */
#destinationDisplay{
  padding:7px 14px;
  border-radius:15px;
  background:
    linear-gradient(
      180deg,
      rgba(40,40,43,.95),
      rgba(5,5,7,.9)
    );
  border:1px solid rgba(255,255,255,.13);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.1),
    0 4px 15px rgba(0,0,0,.3);
  font-size:20px;
  font-weight:850;
  white-space:nowrap;
}
.board-normal{
  color:#fff;
}
.board-shinkaisoku{
  color:#4da3ff;
}
.board-other{
  color:#ff453a;
}
/* =========================
   次は
========================= */
#nextBoard{
  position:absolute;
  top:calc(86px + env(safe-area-inset-top));
  left:10px;
  right:10px;
  height:38px;
  z-index:2900;
  overflow:hidden;
  display:flex;
  align-items:center;
  border-radius:19px;
  background:rgba(0,0,0,.68);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
}
#nextText{
  white-space:nowrap;
  padding-left:100%;
  font-size:14px;
  font-weight:700;
  animation:scrollText 10s linear infinite;
}
@keyframes scrollText{
  from{
    transform:translateX(0);
  }
  to{
    transform:translateX(-180%);
  }
}
/* =========================
   マップ
========================= */
#map{
  width:100%;
  height:100%;
  background:#e3e8ec;
}
.leaflet-control-zoom{
  border:0!important;
  margin:135px 12px 0 0!important;
}
.leaflet-control-zoom a{
  width:42px!important;
  height:42px!important;
  line-height:42px!important;
  border:0!important;
  color:#222!important;
  background:rgba(255,255,255,.82)!important;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:0 5px 20px rgba(0,0,0,.18);
}
.leaflet-control-zoom a:first-child{
  border-radius:15px 15px 5px 5px!important;
}
.leaflet-control-zoom a:last-child{
  border-radius:5px 5px 15px 15px!important;
}
/* =========================
   上部情報
========================= */
#distanceBox,
#limitBox,
#modeBox,
#followBox,
#routeButton{
  position:absolute;
  z-index:2100;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(0,0,0,.70);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}
/* 距離 */
#distanceBox{
  top:calc(132px + env(safe-area-inset-top));
  left:10px;
  padding:10px 14px;
  border-radius:18px;
  font-size:13px;
}
/* 制限 */
#limitBox{
  top:calc(132px + env(safe-area-inset-top));
  right:10px;
  padding:10px 14px;
  border-radius:18px;
  font-size:13px;
}
/* 追従 */
#followBox{
  top:calc(172px + env(safe-area-inset-top));
  left:10px;
  padding:8px 11px;
  border-radius:17px;
  display:flex;
  align-items:center;
  gap:7px;
  font-size:13px;
}
/* モード */
#modeBox{
  top:calc(172px + env(safe-area-inset-top));
  right:10px;
  padding:9px 12px;
  border-radius:17px;
  font-size:13px;
}
/* スイッチ */
#followSwitch{
  width:45px;
  height:25px;
  appearance:none;
  padding:0;
  border:0;
  background:rgba(255,255,255,.25);
  border-radius:20px;
  position:relative;
}
#followSwitch:checked{
  background:#238636;
}
#followSwitch::after{
  content:"";
  position:absolute;
  width:21px;
  height:21px;
  top:2px;
  left:2px;
  border-radius:50%;
  background:#fff;
  transition:.2s;
}
#followSwitch:checked::after{
  transform:translateX(20px);
}
/* =========================
   地点一覧
========================= */
#routeButton{
  top:calc(211px + env(safe-area-inset-top));
  right:10px;
  color:#fff;
  padding:9px 13px;
  border-radius:17px;
  font-size:13px;
}
#routePanel{
  display:none;
  position:absolute;
  top:calc(255px + env(safe-area-inset-top));
  right:10px;
  width:250px;
  max-height:310px;
  overflow-y:auto;
  z-index:2500;
  padding:10px;
  border-radius:23px;
  background:rgba(10,12,16,.84);
  border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(30px) saturate(160%);
  -webkit-backdrop-filter:blur(30px) saturate(160%);
}
.routeTitle{
  color:rgba(255,255,255,.55);
  font-size:13px;
  padding:5px 7px 9px;
}
.routeItem{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:6px;
  padding:10px;
  margin-bottom:6px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.07);
  border-radius:15px;
  font-size:13px;
}
.deleteRoute{
  border:0;
  border-radius:10px;
  background:rgba(255,69,58,.8);
  color:#fff;
  padding:6px 8px;
}
/* =========================
   速度
========================= */
#speedBox{
  position:absolute;
  bottom:calc(115px + env(safe-area-inset-bottom));
  left:0;
  width:100%;
  z-index:2000;
  text-align:center;
  pointer-events:none;
}
#speed{
  font-size:55px;
  font-weight:850;
  letter-spacing:-2px;
  text-shadow:0 4px 20px rgba(0,0,0,.5);
}
.kmh{
  color:rgba(255,255,255,.55);
  font-size:14px;
}
/* =========================
   速度超過
========================= */
#overspeed{
  display:none;
  position:absolute;
  bottom:calc(180px + env(safe-area-inset-bottom));
  left:0;
  width:100%;
  z-index:2600;
  text-align:center;
  color:#ff453a;
  font-size:19px;
  font-weight:800;
}
/* =========================
   終了
========================= */
#finishButton{
  position:absolute;
  left:20px;
  bottom:calc(20px + env(safe-area-inset-bottom));
  width:calc(100% - 40px);
  height:62px;
  z-index:2800;
  border:1px solid rgba(255,255,255,.13);
  border-radius:23px;
  background:rgba(0,0,0,.73);
  color:#fff;
  font-size:19px;
  font-weight:800;
  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);
}
/* =========================
   ATS
========================= */
#ats{
  display:none;
  position:absolute;
  left:15px;
  bottom:calc(15px + env(safe-area-inset-bottom));
  width:calc(100% - 30px);
  z-index:4000;
  padding:17px;
  border-radius:30px;
  background:
    linear-gradient(
      135deg,
      rgba(0,0,0,.92),
      rgba(25,25,28,.70)
    );
  border:1px solid rgba(255,255,255,.17);
  box-shadow:
    0 20px 60px rgba(0,0,0,.58),
    inset 0 1px 0 rgba(255,255,255,.14);
  backdrop-filter:blur(35px) saturate(180%);
  -webkit-backdrop-filter:blur(35px) saturate(180%);
}
.atsWarning{
  text-align:center;
  color:#ff453a;
  font-size:20px;
  font-weight:850;
  margin-bottom:6px;
}
.atsTimer{
  text-align:center;
  color:rgba(255,255,255,.55);
  font-size:13px;
  margin-bottom:10px;
}
/* =========================
   ATS解除スライダー
========================= */
.slider{
  position:relative;
  height:66px;
  border-radius:21px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.08);
  overflow:hidden;
  touch-action:none;
}
.sliderText{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(255,255,255,.48);
  font-size:17px;
}
.sliderButton{
  position:absolute;
  left:5px;
  top:5px;
  width:56px;
  height:56px;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(
    180deg,
    #ff7043,
    #e63828
  );
  font-size:25px;
  box-shadow:
    0 5px 15px rgba(255,69,58,.25),
    inset 0 1px 0 rgba(255,255,255,.25);
  touch-action:none;
}
/* =========================
   マーカー
========================= */
.current-marker{
  width:18px;
  height:18px;
  border-radius:50%;
  background:#1677ff;
  border:3px solid #fff;
  box-shadow:
    0 0 0 6px rgba(22,119,255,.22),
    0 4px 12px rgba(0,0,0,.35);
}
.destination-marker{
  width:24px;
  height:24px;
  border-radius:50%;
  background:#ff453a;
  border:4px solid #fff;
  box-shadow:0 3px 12px rgba(0,0,0,.35);
}
.via-marker{
  width:20px;
  height:20px;
  border-radius:50%;
  background:#ff9500;
  border:3px solid #fff;
  box-shadow:0 3px 10px rgba(0,0,0,.3);
}
/* =========================
   小さい画面
========================= */
@media(max-width:500px){
  #boardType{
    font-size:19px;
  }
  #destinationDisplay{
    font-size:18px;
  }
  .nextText{
    font-size:13px;
  }
}
</style>
</head>
<body>
<!-- =====================================================
     初期設定
===================================================== -->
<div id="setup">
  <div class="logo">
    🚲 cycletrain
  </div>
  <div id="setupMapArea">
<div id="setupMap"></div>
<div class="setupHint">
  🎯 地図をタップして目的地を設定<br>
  その後もう一度タップすると経由地を追加
</div>
  </div>

種別

  <select id="type">
<option>普通</option>
<option>快速</option>
<option>急行</option>
<option>特急</option>
<option>新快速</option>
  </select>

行き先

<input
id=“destinationName”
type=“text”
placeholder=“例：別府”

  <div id="setupInfo">
🎯 目的地：未設定<br>
<span class="small">
  📍 経由地：まだありません
</span>
  </div>
  <div id="viaNameArea">
<label>
  今追加する経由地の名前
</label>
<div id="viaNameRow">
  <input
    id="viaName"
    type="text"
    placeholder="例：ローソン"
  >
  <button
    class="smallButton"
    onclick="finishViaName()"

  </div>

速度制限

type=“number”
min=“1”

<button

🚃 運転開始
  </button>
</div>
<!-- =====================================================
     運転画面
===================================================== -->
<div id="drive">
  <div id="board">
<div
  id="boardType"
  class="board-other"
>
  急行
</div>
<div id="destinationDisplay">
  別府
</div>
  </div>
  <div id="nextBoard">
<div id="nextText">
  次は、設定地点
</div>
  </div>
  <div id="distanceBox">
    📍 地点未設定
  </div>
  <div id="limitBox">
    🚦 制限 20 km/h
  </div>
  <div id="followBox">
追従
<input
  id="followSwitch"
  type="checkbox"
  checked
>
  </div>
  <div id="modeBox">
    🚃 運転中
  </div>

<button
id=“routeButton”
onclick=“toggleRoutePanel()”

📍 地点一覧

</div>

  km/h

<button

運転終了

  <!-- ATS -->

<div
  id="atsText"

>

</div>

  <div class="sliderText">

  </div>

  >

  </div>
</div>

</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* =====================================================
   変数
===================================================== */
let setupMap=null;
let map=null;
let currentMarker=null;
let destination=null;
let destinationMarker=null;
let viaPoints=[];
let viaMarkers=[];
let viaNames=[];
let currentViaIndex=0;
let destinationName="";
let currentSpeed=0;
let speedLimit=20;
let watchID=null;
/* =====================================================
   設定マップ用
===================================================== */
let setupMode="destination";
let setupCurrentMarker=null;
/* =====================================================
   ATS
===================================================== */
let atsActive=false;
let atsType="";
let destinationATSUsed=false;
let viaATSUsed=[];
let overspeedATSUsed=false;
let atsSeconds=60;
let atsTimer=null;
let atsCountdownTimer=null;
/* =====================================================
   音
===================================================== */
let audioContext=null;
let atsOscillator=null;
let atsGain=null;
let bellTimer=null;
/* =====================================================
   スライダー
===================================================== */
let sliderStartX=0;
let sliderMoveX=0;
/* =====================================================
   AudioContext
===================================================== */
function prepareAudio(){
  try{
    if(!audioContext){
      audioContext=
        new(
          window.AudioContext ||
          window.webkitAudioContext
        )();
    }
    if(
      audioContext.state==="suspended"
    ){
      audioContext.resume();
    }
  }catch(e){
    console.log(e);
  }
}
/* =====================================================
   ATS連続音
   リーーーーーーーー
===================================================== */
function startATSAlarm(){
  prepareAudio();
  stopATSAlarm();
  if(!audioContext){
    return;
  }
  atsOscillator=
    audioContext.createOscillator();
  atsGain=
    audioContext.createGain();
  /*
   * 連続した警報音
   */
  atsOscillator.type="sawtooth";
  atsOscillator.frequency.setValueAtTime(
    760,
    audioContext.currentTime
  );
  atsGain.gain.setValueAtTime(
    0.0001,
    audioContext.currentTime
  );
  atsGain.gain.linearRampToValueAtTime(
    0.12,
    audioContext.currentTime+0.05
  );
  atsOscillator.connect(
    atsGain
  );
  atsGain.connect(
    audioContext.destination
  );
  atsOscillator.start();
  /*
   * 音をほんの少し揺らす
   */
  const lfo=
    audioContext.createOscillator();
  const lfoGain=
    audioContext.createGain();
  lfo.frequency.value=5;
  lfoGain.gain.value=.025;
  lfo.connect(lfoGain);
  lfoGain.connect(atsGain.gain);
  lfo.start();
  atsOscillator._lfo=lfo;
  atsOscillator._lfoGain=lfoGain;
}
/* =====================================================
   ATS停止
===================================================== */
function stopATSAlarm(){
  if(atsOscillator){
    if(atsOscillator._lfo){
      try{
        atsOscillator._lfo.stop();
      }catch(e){}
      try{
        atsOscillator._lfo.disconnect();
      }catch(e){}
    }
    try{
      atsOscillator.stop();
    }catch(e){}
    try{
      atsOscillator.disconnect();
    }catch(e){}
    atsOscillator=null;
  }
  if(atsGain){
    try{
      atsGain.disconnect();
    }catch(e){}
    atsGain=null;
  }
}
/* =====================================================
   キンコン
===================================================== */
function playBell(){
  prepareAudio();
  if(!audioContext){
    return;
  }
  const now=
    audioContext.currentTime;
  const osc1=
    audioContext.createOscillator();
  const gain1=
    audioContext.createGain();
  osc1.type="sine";
  osc1.frequency.value=1046;
  gain1.gain.setValueAtTime(
    .0001,
    now
  );
  gain1.gain.exponentialRampToValueAtTime(
    .16,
    now+.01
  );
  gain1.gain.exponentialRampToValueAtTime(
    .001,
    now+.28
  );
  osc1.connect(gain1);
  gain1.connect(audioContext.destination);
  osc1.start(now);
  osc1.stop(now+.3);
  setTimeout(()=>{
    if(!audioContext){
      return;
    }
    const now2=
      audioContext.currentTime;
    const osc2=
      audioContext.createOscillator();
    const gain2=
      audioContext.createGain();
    osc2.type="sine";
    osc2.frequency.value=784;
    gain2.gain.setValueAtTime(
      .0001,
      now2
    );
    gain2.gain.exponentialRampToValueAtTime(
      .14,
      now2+.01
    );
    gain2.gain.exponentialRampToValueAtTime(
      .001,
      now2+.32
    );
    osc2.connect(gain2);
    gain2.connect(audioContext.destination);
    osc2.start(now2);
    osc2.stop(now2+.34);
  },135);
}
/* =====================================================
   キンコン停止判定
===================================================== */
function bellShouldStop(){
  if(!currentMarker){
    return false;
  }
  const current=
    currentMarker.getLatLng();
  /*
   * 現在の経由地
   */
  if(
    currentViaIndex<
    viaPoints.length
  ){
    if(
      current.distanceTo(
        viaPoints[currentViaIndex]
      )<=30
    ){
      return true;
    }
  }
  /*
   * 目的地
   */
  if(destination){
    if(
      current.distanceTo(destination)<=30
    ){
      return true;
    }
  }
  /*
   * 速度ATS
   */
  if(
    atsType==="overspeed" &&
    currentSpeed<=speedLimit-3
  ){
    return true;
  }
  return false;
}
/* =====================================================
   キンコン開始
===================================================== */
function startBell(){
  stopBell();
  if(bellShouldStop()){
    return;
  }
  playBell();
  bellTimer=
    setInterval(()=>{
      if(bellShouldStop()){
        stopBell();
        return;
      }
      playBell();
    },700);
}
/* =====================================================
   キンコン停止
===================================================== */
function stopBell(){
  if(bellTimer){
    clearInterval(bellTimer);
    bellTimer=null;
  }
}

/* =====================================================
   GPS
===================================================== */
function startGPS(){
  if(
    watchID!==null
  ){
    navigator.geolocation.clearWatch(
      watchID
    );
  }
  watchID=
    navigator.geolocation.watchPosition(
      position=>{
        const lat=
          position.coords.latitude;
        const lng=
          position.coords.longitude;
        /*
         * 速度
         */
        let speed=
          position.coords.speed;
        if(
          speed===null ||
          speed<0
        ){
          speed=0;
        }
        currentSpeed=
          speed*3.6;
        document.getElementById(
          "speed"
        ).textContent=
          Math.round(currentSpeed);
        /*
         * 現在地
         */
        if(currentMarker){
          currentMarker.setLatLng(
            [lat,lng]
          );
        }
        /*
         * 追従
         */
        if(
          document.getElementById(
            "followSwitch"
          ).checked &&
          map
        ){
          map.panTo(
            [lat,lng],
            {
              animate:true,
              duration:.4
            }
          );
        }
        /*
         * 速度超過
         */
        if(
          currentSpeed>speedLimit
        ){
          document.getElementById(
            "overspeed"
          ).style.display="block";
          /*
           * 速度ATSは一回だけ
           */
          if(
            !atsActive &&
            !overspeedATSUsed
          ){
            overspeedATSUsed=true;
            activateATS(
              "⚠️ 速度超過ATS",
              "overspeed"
            );
          }
        }
        else{
          document.getElementById(
            "overspeed"
          ).style.display="none";
        }
        if(!destination){
          return;
        }
        const current=
          L.latLng(
            lat,
            lng
          );
        /*
         * ===================================
         * 経由地
         * ===================================
         */
        if(
          currentViaIndex<
          viaPoints.length
        ){
          const via=
            viaPoints[
              currentViaIndex
            ];
          const distance=
            current.distanceTo(
              via
            );
          document.getElementById(
            "distanceBox"
          ).textContent=
            "📍 "+
            viaNames[currentViaIndex]+
            "まで "+
            formatDistance(distance);
          /*
           * 次は
           */
          updateNextBoard();
          /*
           * 100m以内
           *
           * ATS確実に一回
           */
          if(
            distance<=100 &&
            !viaATSUsed[currentViaIndex] &&
            !atsActive
          ){
            viaATSUsed[currentViaIndex]=true;
            activateATS(
              "⚠️ 経由地ATS\n"+
              viaNames[currentViaIndex],
              "via"
            );
            return;
          }
          /*
           * 30m以内
           *
           * 到達
           */
          if(
            distance<=30
          ){
            stopBell();
            /*
             * 次の経由地へ
             */
            currentViaIndex++;
            updateNextBoard();
            /*
             * 次の地点があれば
             * 再びキンコン
             */
            if(
              currentViaIndex<
              viaPoints.length
            ){
              startBell();
            }
            else{
              /*
               * 最後の経由地を過ぎたら
               * 目的地へ
               */
              startBell();
            }
          }
          return;
        }
        /*
         * ===================================
         * 目的地
         * ===================================
         */
        const distance=
          current.distanceTo(
            destination
          );
        document.getElementById(
          "distanceBox"
        ).textContent=
          "🎯 "+
          destinationName+
          "まで "+
          formatDistance(distance);
        updateNextBoard();
        /*
         * 目的地ATS
         *
         * 200m以内で一回
         */
        if(
          distance<=200 &&
          !destinationATSUsed &&
          !atsActive
        ){
          destinationATSUsed=true;
          activateATS(
            "🏁 目的地ATS",
            "destination"
          );
          return;
        }
        /*
         * 30m以内
         */
        if(
          distance<=30
        ){
          stopBell();
        }
      },
      ()=>{
        document.getElementById(
          "distanceBox"
        ).textContent=
          "📍 GPS取得失敗";
      },
      {
        enableHighAccuracy:true,
        maximumAge:1000,
        timeout:10000
      }
    );
}
/* =====================================================
   距離表示
===================================================== */
function formatDistance(distance){
  if(distance>=1000){
    return(
      (distance/1000)
      .toFixed(2)+
      " km"
    );
  }
  return(
    Math.round(distance)+
    " m"
  );
}

/* =====================================================
   経由地削除
===================================================== */
function deleteVia(index){
  if(
    !confirm(
      "この経由地を削除しますか？"
    )
  ){
    return;
  }
  if(viaMarkers[index] && map){
    map.removeLayer(
      viaMarkers[index]
    );
  }
  viaPoints.splice(
    index,
    1
  );
  viaNames.splice(
    index,
    1
  );
  viaATSUsed.splice(
    index,
    1
  );
  if(
    currentViaIndex>index
  ){
    currentViaIndex--;
  }
  if(
    currentViaIndex<0
  ){
    currentViaIndex=0;
  }
  updateRouteList();
  updateNextBoard();
}

/* =====================================================
   ATS作動
===================================================== */
function activateATS(
  message,
  type
){
  /*
   * ATS中なら何もしない
   */
  if(atsActive){
    return;
  }
  atsActive=true;
  atsType=type;
  atsSeconds=60;
  /*
   * キンコン停止
   */
  stopBell();
  /*
   * 終了ボタンOFF
   */
  document.getElementById(
    "finishButton"
  ).style.display="none";
  /*
   * ATS画面
   */
  document.getElementById(
    "ats"
  ).style.display="block";
  document.getElementById(
    "atsText"
  ).textContent=
    message;
  document.getElementById(
    "atsTimer"
  ).textContent=
    "自動終了まで 60 秒";
  /*
   * ATS音
   *
   * ここが今回の重要部分
   */
  prepareAudio();
  startATSAlarm();
  /*
   * バイブ
   */
  if(navigator.vibrate){
    navigator.vibrate(
      [500,150,500]
    );
  }
  /*
   * カウントダウン
   */
  clearInterval(
    atsCountdownTimer
  );
  atsCountdownTimer=
    setInterval(()=>{
      if(!atsActive){
        return;
      }
      atsSeconds--;
      document.getElementById(
        "atsTimer"
      ).textContent=
        "自動終了まで "+
        Math.max(
          0,
          atsSeconds
        )+
        " 秒";
      if(
        atsSeconds<=0
      ){
        releaseATS();
      }
    },1000);
  /*
   * 念のため
   * 60秒で強制解除
   */
  clearTimeout(atsTimer);
  atsTimer=
    setTimeout(
      releaseATS,
      60000
    );
}
/* =====================================================
   ATS解除
===================================================== */
function releaseATS(){
  if(!atsActive){
    return;
  }
  atsActive=false;
  clearTimeout(atsTimer);
  clearInterval(atsCountdownTimer);
  atsTimer=null;
  atsCountdownTimer=null;
  /*
   * 音停止
   */
  stopATSAlarm();
  /*
   * バイブ停止
   */
  if(navigator.vibrate){
    navigator.vibrate(0);
  }
  /*
   * ATS画面OFF
   */
  document.getElementById(
    "ats"
  ).style.display="none";
  /*
   * 終了ボタンON
   */
  document.getElementById(
    "finishButton"
  ).style.display="block";
  /*
   * 解除後のキンコン
   */
  if(
    !bellShouldStop()
  ){
    startBell();
  }
}
/* =====================================================
   ATSスライダー
===================================================== */
const sliderButton=
  document.getElementById(
    "sliderButton"
  );
sliderButton.addEventListener(
  "touchstart",
  e=>{
    if(!atsActive){
      return;
    }
    sliderStartX=
      e.touches[0].clientX;
    sliderMoveX=0;
  },
  {passive:true}
);
sliderButton.addEventListener(
  "touchmove",
  e=>{
    if(!atsActive){
      return;
    }
    sliderMoveX=
      e.touches[0].clientX-
      sliderStartX;
    if(sliderMoveX<0){
      sliderMoveX=0;
    }
    const slider=
      sliderButton.parentElement;
    const max=
      slider.clientWidth-
      sliderButton.clientWidth-
      10;
    if(sliderMoveX>max){
      sliderMoveX=max;
    }
    sliderButton.style.transform=
      "translateX("+
      sliderMoveX+
      "px)";
  },
  {passive:true}
);
sliderButton.addEventListener(
  "touchend",
  ()=>{
    if(!atsActive){
      return;
    }
    const slider=
      sliderButton.parentElement;
    const max=
      slider.clientWidth-
      sliderButton.clientWidth-
      10;
    if(
      sliderMoveX>=
      max*.7
    ){
      releaseATS();
    }
    sliderButton.style.transform=
      "translateX(0)";
    sliderMoveX=0;
  }
);
/* =====================================================
   運転終了
===================================================== */
function finishDrive(){
  if(atsActive){
    return;
  }
  if(
    !confirm(
      "運転を終了しますか？"
    )
  ){
    return;
  }
  /*
   * 音停止
   */
  stopATSAlarm();
  stopBell();
  /*
   * GPS停止
   */
  if(
    watchID!==null
  ){
    navigator.geolocation.clearWatch(
      watchID
    );
    watchID=null;
  }
  /*
   * マップ破棄
   */
  if(map){
    map.remove();
    map=null;
  }
  /*
   * 目的地・経由地
   */
  destination=null;
  destinationMarker=null;
  viaPoints=[];
  viaMarkers=[];
  viaNames=[];
  viaATSUsed=[];
  currentViaIndex=0;
  destinationATSUsed=false;
  overspeedATSUsed=false;
  currentMarker=null;
  /*
   * 初期状態
   */
  setupMode="destination";
  /*
   * 設定画面
   */
  document.getElementById(
    "drive"
  ).style.display="none";
  document.getElementById(
    "setup"
  ).style.display="block";
  document.getElementById(
    "routePanel"
  ).style.display="none";
  document.getElementById(
    "viaNameArea"
  ).style.display="none";
  document.getElementById(
    "setupInfo"
  ).innerHTML=
    "🎯 目的地：未設定<br>"+
    '<span class="small">📍 経由地：まだありません</span>';
  /*
   * 設定マップを作り直す
   */
  if(setupMap){
    setupMap.remove();
    setupMap=null;
  }
  setTimeout(
    initSetupMap,
    100
  );
}
/* =====================================================
   初期起動
===================================================== */
window.addEventListener(
  "load",
  ()=>{
    initSetupMap();
  }
);
/* =====================================================
   ページ終了
===================================================== */
window.addEventListener(
  "beforeunload",
  ()=>{
    stopATSAlarm();
    stopBell();
    if(
      watchID!==null &&
      navigator.geolocation
    ){
      navigator.geolocation.clearWatch(
        watchID
      );
    }
  }
);
</script>
