<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>cycletrain</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

/* =====================================================
   基本
===================================================== */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:#08090c;
  color:white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    sans-serif;
}


/* =====================================================
   Liquid Glass
===================================================== */

.glass{
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.14),
      rgba(255,255,255,.035)
    );

  border:
    1px solid
    rgba(255,255,255,.16);

  box-shadow:
    0 12px 40px
    rgba(0,0,0,.35),

    inset 0 1px 0
    rgba(255,255,255,.14);

  backdrop-filter:
    blur(30px)
    saturate(170%);

  -webkit-backdrop-filter:
    blur(30px)
    saturate(170%);
}


/* =====================================================
   最初の設定画面
===================================================== */

#setup{

  position:relative;

  width:100%;
  height:100vh;

  overflow:hidden;

  background:#dfe5e9;
}


/* 最初から地図 */

#setupMap{

  position:absolute;

  inset:0;

  z-index:1;
}


/* =====================================================
   上部タイトル
===================================================== */

.setupTop{

  position:absolute;

  top:
    calc(10px + env(safe-area-inset-top));

  left:10px;
  right:10px;

  height:62px;

  z-index:3000;

  border-radius:24px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 17px;

  background:
    rgba(0,0,0,.70);

  border:
    1px solid
    rgba(255,255,255,.16);

  backdrop-filter:
    blur(30px)
    saturate(170%);

  -webkit-backdrop-filter:
    blur(30px)
    saturate(170%);

  box-shadow:
    0 10px 35px
    rgba(0,0,0,.35);
}


.setupTitle{

  font-size:21px;

  font-weight:850;

  letter-spacing:-.5px;
}


.setupStep{

  font-size:13px;

  color:
    rgba(255,255,255,.58);
}


/* =====================================================
   設定パネル
===================================================== */

.setupPanel{

  position:absolute;

  left:10px;
  right:10px;

  bottom:
    calc(10px + env(safe-area-inset-bottom));

  z-index:3000;

  padding:15px;

  border-radius:28px;

  background:
    rgba(10,11,15,.78);

  border:
    1px solid
    rgba(255,255,255,.15);

  box-shadow:
    0 18px 55px
    rgba(0,0,0,.48),

    inset 0 1px 0
    rgba(255,255,255,.12);

  backdrop-filter:
    blur(35px)
    saturate(170%);

  -webkit-backdrop-filter:
    blur(35px)
    saturate(170%);

}


.setupRow{

  display:flex;

  gap:8px;

  margin-bottom:9px;
}


.setupField{

  flex:1;

  min-width:0;
}


.setupField label{

  display:block;

  margin:
    0 0 6px 4px;

  font-size:12px;

  color:
    rgba(255,255,255,.55);
}


select,
input{

  width:100%;

  height:48px;

  padding:
    0 13px;

  border-radius:16px;

  border:
    1px solid
    rgba(255,255,255,.12);

  outline:none;

  background:
    rgba(255,255,255,.08);

  color:white;

  font-size:16px;

  -webkit-appearance:none;

  backdrop-filter:
    blur(20px);

  -webkit-backdrop-filter:
    blur(20px);
}


select option{

  background:#17191e;

  color:white;
}


.setupHint{

  text-align:center;

  color:
    rgba(255,255,255,.60);

  font-size:12px;

  margin:
    5px 0 10px;
}


.setupButtons{

  display:flex;

  gap:8px;
}


.setupButton{

  flex:1;

  height:53px;

  border:0;

  border-radius:19px;

  font-size:16px;

  font-weight:800;

  color:white;

  background:
    rgba(255,255,255,.10);

  border:
    1px solid
    rgba(255,255,255,.12);

}


.setupButton.blue{

  background:
    linear-gradient(
      180deg,
      #4aa3ff,
      #1478e8
    );

  box-shadow:
    0 8px 25px
    rgba(20,120,232,.28);
}


.setupButton:active{

  transform:scale(.97);

}


/* =====================================================
   地図上の設定モード
===================================================== */

#setupMode{

  position:absolute;

  top:
    calc(82px + env(safe-area-inset-top));

  left:10px;

  z-index:3000;

  padding:
    9px 14px;

  border-radius:17px;

  background:
    rgba(0,0,0,.72);

  border:
    1px solid
    rgba(255,255,255,.13);

  backdrop-filter:
    blur(25px);

  -webkit-backdrop-filter:
    blur(25px);

  font-size:13px;

  font-weight:700;
}


/* =====================================================
   地点リスト
===================================================== */

#setupRouteList{

  max-height:100px;

  overflow-y:auto;

  margin-bottom:8px;
}


.setupRouteItem{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:8px;

  padding:
    8px 10px;

  margin-bottom:5px;

  border-radius:13px;

  background:
    rgba(255,255,255,.07);

  font-size:13px;
}


.setupRouteItem span{

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;
}


.deleteButton{

  flex:none;

  border:0;

  border-radius:10px;

  padding:
    6px 9px;

  background:
    rgba(255,69,58,.75);

  color:white;

}


/* =====================================================
   運転画面
===================================================== */

#drive{

  display:none;

  position:relative;

  width:100%;
  height:100vh;

  overflow:hidden;
}


#map{

  position:absolute;

  inset:0;

  z-index:1;
}


/* =====================================================
   行先表示
===================================================== */

#board{

  position:absolute;

  top:
    calc(8px + env(safe-area-inset-top));

  left:10px;
  right:10px;

  height:68px;

  z-index:3000;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:
    0 18px;

  border-radius:25px;

  overflow:hidden;

  white-space:nowrap;

  font-size:22px;

  font-weight:850;

  letter-spacing:-.5px;

  background:
    linear-gradient(
      135deg,
      rgba(0,0,0,.80),
      rgba(25,25,28,.58)
    );

  border:
    1px solid
    rgba(255,255,255,.17);

  box-shadow:
    0 12px 35px
    rgba(0,0,0,.42),

    inset 0 1px 0
    rgba(255,255,255,.14);

  backdrop-filter:
    blur(32px)
    saturate(175%);

  -webkit-backdrop-filter:
    blur(32px)
    saturate(175%);
}


.board-normal{
  color:white;
}


.board-shinkaisoku{
  color:#4da3ff;
}


.board-other{
  color:#ff453a;
}


/* =====================================================
   次は ○○
===================================================== */

#nextBoard{

  position:absolute;

  top:
    calc(82px + env(safe-area-inset-top));

  left:10px;
  right:10px;

  height:38px;

  z-index:2900;

  display:flex;

  align-items:center;

  justify-content:center;

  overflow:hidden;

  border-radius:18px;

  background:
    rgba(0,0,0,.68);

  border:
    1px solid
    rgba(255,255,255,.11);

  backdrop-filter:
    blur(25px);

  -webkit-backdrop-filter:
    blur(25px);

  font-size:14px;

  font-weight:700;

}


.nextText{

  display:inline-block;

  white-space:nowrap;

}


/* =====================================================
   距離
===================================================== */

#distanceBox{

  position:absolute;

  top:
    calc(128px + env(safe-area-inset-top));

  left:10px;

  z-index:2500;

  padding:
    9px 13px;

  border-radius:17px;

  background:
    rgba(0,0,0,.70);

  border:
    1px solid
    rgba(255,255,255,.12);

  backdrop-filter:
    blur(25px);

  -webkit-backdrop-filter:
    blur(25px);

  font-size:13px;
}


/* =====================================================
   制限速度
===================================================== */

#limitBox{

  position:absolute;

  top:
    calc(128px + env(safe-area-inset-top));

  right:10px;

  z-index:2500;

  padding:
    9px 13px;

  border-radius:17px;

  background:
    rgba(0,0,0,.70);

  border:
    1px solid
    rgba(255,255,255,.12);

  backdrop-filter:
    blur(25px);

  -webkit-backdrop-filter:
    blur(25px);

  font-size:13px;
}


/* =====================================================
   追従
===================================================== */

#followBox{

  position:absolute;

  top:
    calc(168px + env(safe-area-inset-top));

  left:10px;

  z-index:2500;

  display:flex;

  align-items:center;

  gap:7px;

  padding:
    8px 10px;

  border-radius:16px;

  background:
    rgba(0,0,0,.68);

  border:
    1px solid
    rgba(255,255,255,.12);

  backdrop-filter:
    blur(22px);

  -webkit-backdrop-filter:
    blur(22px);

  font-size:13px;
}


#followSwitch{

  width:45px;
  height:25px;

  appearance:none;

  padding:0;

  border:0;

  background:
    rgba(255,255,255,.25);

  border-radius:20px;

  position:relative;
}


#followSwitch:checked{

  background:#238636;
}


#followSwitch::after{

  content:"";

  position:absolute;

  width:21px;
  height:21px;

  top:2px;
  left:2px;

  border-radius:50%;

  background:white;

  transition:.2s;
}


#followSwitch:checked::after{

  transform:
    translateX(20px);
}


/* =====================================================
   地点一覧
===================================================== */

#routeButton{

  position:absolute;

  top:
    calc(168px + env(safe-area-inset-top));

  right:10px;

  z-index:2500;

  border:
    1px solid
    rgba(255,255,255,.12);

  border-radius:16px;

  background:
    rgba(0,0,0,.68);

  color:white;

  padding:
    9px 12px;

  font-size:13px;

  backdrop-filter:
    blur(22px);

  -webkit-backdrop-filter:
    blur(22px);
}


#routePanel{

  display:none;

  position:absolute;

  top:
    calc(210px + env(safe-area-inset-top));

  right:10px;

  width:250px;

  max-height:300px;

  overflow-y:auto;

  z-index:4000;

  padding:9px;

  border-radius:22px;

  background:
    rgba(10,12,16,.80);

  border:
    1px solid
    rgba(255,255,255,.14);

  box-shadow:
    0 15px 45px
    rgba(0,0,0,.45);

  backdrop-filter:
    blur(30px)
    saturate(160%);

  -webkit-backdrop-filter:
    blur(30px)
    saturate(160%);
}


.routeTitle{

  color:
    rgba(255,255,255,.55);

  font-size:13px;

  padding:
    5px 7px 9px;
}


/* =====================================================
   速度
===================================================== */

#speedBox{

  position:absolute;

  left:0;

  bottom:
    calc(115px + env(safe-area-inset-bottom));

  width:100%;

  z-index:2200;

  text-align:center;

  pointer-events:none;
}


#speed{

  font-size:55px;

  font-weight:850;

  letter-spacing:-2px;

  text-shadow:
    0 4px 20px
    rgba(0,0,0,.5);
}


.kmh{

  color:
    rgba(255,255,255,.55);

  font-size:14px;
}


/* =====================================================
   速度超過
===================================================== */

#overspeed{

  display:none;

  position:absolute;

  bottom:
    calc(180px + env(safe-area-inset-bottom));

  left:0;

  width:100%;

  z-index:2600;

  text-align:center;

  color:#ff453a;

  font-size:19px;

  font-weight:bold;
}


/* =====================================================
   終了
===================================================== */

#finishButton{

  position:absolute;

  left:20px;

  bottom:
    calc(20px + env(safe-area-inset-bottom));

  width:
    calc(100% - 40px);

  height:62px;

  z-index:2800;

  border:
    1px solid
    rgba(255,255,255,.13);

  border-radius:23px;

  background:
    rgba(0,0,0,.72);

  color:white;

  font-size:19px;

  font-weight:bold;

  backdrop-filter:
    blur(28px);

  -webkit-backdrop-filter:
    blur(28px);

}


/* =====================================================
   ATS
===================================================== */

#ats{

  display:none;

  position:absolute;

  left:15px;

  bottom:
    calc(15px + env(safe-area-inset-bottom));

  width:
    calc(100% - 30px);

  z-index:5000;

  padding:16px;

  border-radius:29px;

  background:
    linear-gradient(
      135deg,
      rgba(0,0,0,.88),
      rgba(25,25,28,.68)
    );

  border:
    1px solid
    rgba(255,255,255,.16);

  box-shadow:
    0 18px 55px
    rgba(0,0,0,.58),

    inset 0 1px 0
    rgba(255,255,255,.13);

  backdrop-filter:
    blur(35px)
    saturate(175%);

  -webkit-backdrop-filter:
    blur(35px)
    saturate(175%);
}


.atsWarning{

  text-align:center;

  color:#ff453a;

  font-size:20px;

  font-weight:850;

  margin-bottom:6px;
}


.atsTimer{

  text-align:center;

  color:
    rgba(255,255,255,.55);

  font-size:13px;

  margin-bottom:9px;
}


.slider{

  position:relative;

  height:66px;

  border-radius:21px;

  background:
    rgba(255,255,255,.08);

  overflow:hidden;

  touch-action:none;
}


.sliderText{

  position:absolute;

  inset:0;

  display:flex;

  align-items:center;

  justify-content:center;

  color:
    rgba(255,255,255,.48);

  font-size:17px;
}


.sliderButton{

  position:absolute;

  left:5px;
  top:5px;

  width:56px;
  height:56px;

  border-radius:18px;

  background:
    linear-gradient(
      180deg,
      #ff7043,
      #e63828
    );

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:25px;

  z-index:10;

  touch-action:none;

}


/* =====================================================
   現在地
===================================================== */

.current-marker{

  width:18px;
  height:18px;

  border-radius:50%;

  background:#1677ff;

  border:3px solid white;

  box-shadow:
    0 0 0 6px
    rgba(22,119,255,.22),

    0 4px 12px
    rgba(0,0,0,.35);
}


/* =====================================================
   Leaflet
===================================================== */

.leaflet-control-zoom{

  border:0 !important;

  margin:
    95px 12px 0 0 !important;
}


.leaflet-control-zoom a{

  width:42px !important;
  height:42px !important;

  line-height:42px !important;

  border:0 !important;

  color:#222 !important;

  background:
    rgba(255,255,255,.82) !important;

  backdrop-filter:
    blur(20px);

  box-shadow:
    0 4px 18px
    rgba(0,0,0,.18);
}


.leaflet-control-zoom a:first-child{

  border-radius:
    14px 14px 5px 5px !important;
}


.leaflet-control-zoom a:last-child{

  border-radius:
    5px 5px 14px 14px !important;
}

</style>

</head>


<body>


<!-- =====================================================
     最初の設定画面
===================================================== -->

<div id="setup">


  <div id="setupMap"></div>


  <div class="setupTop">

    <div class="setupTitle">
      🚃 cycletrain
    </div>

    <div
      class="setupStep"
      id="setupStep"
    >
      目的地を設定
    </div>

  </div>


  <div id="setupMode">
    🎯 地図をタップして目的地を設定
  </div>


  <div class="setupPanel">


    <div id="setupRouteList"></div>


    <div class="setupRow">

      <div class="setupField">

        <label>
          種別
        </label>

        <select id="type">

          <option>普通</option>
          <option>快速</option>
          <option>急行</option>
          <option>特急</option>
          <option>新快速</option>

        </select>

      </div>


      <div class="setupField">

        <label>
          速度制限
        </label>

        <input
          id="speedLimit"
          type="number"
          min="1"
          max="200"
          value="20"
          inputmode="numeric"
        >

      </div>

    </div>


    <div class="setupField">

      <label>
        行き先名
      </label>

      <input
        id="destinationName"
        type="text"
        placeholder="例：別府駅"
      >

    </div>


    <div class="setupHint">
      地図をタップ → 名前を入力 → 地点を追加
    </div>


    <div class="setupButtons">

      <button
        class="setupButton"
        onclick="changeSetupMode()"
      >
        📍 経由地を追加
      </button>

      <button
        class="setupButton blue"
        onclick="startDrive()"
      >
        🚃 運転開始
      </button>

    </div>

  </div>

</div>


<!-- =====================================================
     運転画面
===================================================== -->

<div id="drive">


  <div id="map"></div>


  <div id="board">
    普通
  </div>


  <div id="nextBoard">
    <span
      class="nextText"
      id="nextText"
    >
      次は、目的地
    </span>
  </div>


  <div id="distanceBox">
    📍 地点を設定してください
  </div>


  <div id="limitBox">
    🚦 制限 20 km/h
  </div>


  <div id="followBox">

    追従

    <input
      id="followSwitch"
      type="checkbox"
      checked
    >

  </div>


  <button
    id="routeButton"
    onclick="toggleRoutePanel()"
  >
    📍 地点一覧
  </button>


  <div id="routePanel">

    <div class="routeTitle">
      設定地点
    </div>

    <div id="routeList"></div>

  </div>


  <div id="overspeed">
    ⚠️ 速度超過
  </div>


  <div id="speedBox">

    <div id="speed">
      0
    </div>

    <div class="kmh">
      km/h
    </div>

  </div>


  <button
    id="finishButton"
    onclick="finishDrive()"
  >
    運転終了
  </button>


  <!-- ATS -->

  <div id="ats">

    <div
      id="atsText"
      class="atsWarning"
    >
      ⚠️ ATS作動
    </div>

    <div
      id="atsTimer"
      class="atsTimer"
    >
      自動終了まで 60 秒
    </div>


    <div class="slider">

      <div class="sliderText">
        スライドで解除
      </div>

      <div
        class="sliderButton"
        id="sliderButton"
      >
        →
      </div>

    </div>

  </div>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =====================================================
   変数
===================================================== */

let setupMap = null;

let map = null;

let currentMarker = null;

let destination = null;

let destinationName = "";

let destinationMarker = null;

let viaPoints = [];

let viaNames = [];

let viaMarkers = [];

let currentViaIndex = 0;

let setupMode = "destination";

let watchID = null;

let speedLimit = 20;

let currentSpeed = 0;


/* =====================================================
   ATS
===================================================== */

let atsActive = false;

let atsType = "";

let atsTimer = null;

let atsCountdownTimer = null;

let atsSeconds = 60;

let destinationATSUsed = false;

let viaATSUsed = [];

let overspeedATSUsed = false;


/* =====================================================
   キンコン
===================================================== */

let bellTimer = null;

let bellActive = false;


/* =====================================================
   Audio
===================================================== */

let audioContext = null;

let atsOscillator = null;

let atsGain = null;

let atsLfo = null;

let atsLfoGain = null;


/* =====================================================
   スライダー
===================================================== */

let startX = 0;

let sliderX = 0;


/* =====================================================
   Audio開始
===================================================== */

function prepareAudio(){

  try{

    if(!audioContext){

      audioContext =
        new(
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    if(
      audioContext.state ===
      "suspended"
    ){

      audioContext.resume();

    }

  }catch(e){

    console.log(
      "Audio error:",
      e
    );

  }

}


/* =====================================================
   ATS音
   「リーーーーーーー」
===================================================== */

function startAlarm(){

  prepareAudio();

  stopAlarm();


  if(!audioContext){

    return;

  }


  /*
   * 連続したATS音
   *
   * squareではなく
   * sawtooth＋AM変調
   * にして「リーーーーー」
   * と鳴らす
   */

  atsOscillator =
    audioContext.createOscillator();

  atsGain =
    audioContext.createGain();

  atsLfo =
    audioContext.createOscillator();

  atsLfoGain =
    audioContext.createGain();


  atsOscillator.type =
    "sawtooth";


  atsOscillator.frequency.value =
    730;


  /*
   * 音量
   */

  atsGain.gain.value =
    0.055;


  /*
   * リリリではなく
   * ゆっくりした揺れ
   */

  atsLfo.type =
    "sine";

  atsLfo.frequency.value =
    7;


  atsLfoGain.gain.value =
    0.018;


  atsLfo.connect(
    atsLfoGain
  );

  atsLfoGain.connect(
    atsGain.gain
  );


  atsOscillator.connect(
    atsGain
  );

  atsGain.connect(
    audioContext.destination
  );


  atsOscillator.start();

  atsLfo.start();


  /*
   * iPhoneで無音にならないよう
   * AudioContextを確認
   */

  if(
    audioContext.state ===
    "suspended"
  ){

    audioContext.resume();

  }

}


/* =====================================================
   ATS音停止
===================================================== */

function stopAlarm(){

  try{

    if(atsOscillator){

      atsOscillator.stop();

      atsOscillator.disconnect();

      atsOscillator = null;

    }

  }catch(e){}


  try{

    if(atsLfo){

      atsLfo.stop();

      atsLfo.disconnect();

      atsLfo = null;

    }

  }catch(e){}


  if(atsGain){

    try{
      atsGain.disconnect();
    }catch(e){}

    atsGain = null;

  }


  if(atsLfoGain){

    try{
      atsLfoGain.disconnect();
    }catch(e){}

    atsLfoGain = null;

  }

}


/* =====================================================
   キンコン
===================================================== */

function playBell(){

  prepareAudio();

  if(!audioContext){

    return;

  }


  const now =
    audioContext.currentTime;


  const osc1 =
    audioContext.createOscillator();

  const gain1 =
    audioContext.createGain();


  osc1.type =
    "sine";

  osc1.frequency.value =
    1046;


  gain1.gain.setValueAtTime(
    .0001,
    now
  );

  gain1.gain.exponentialRampToValueAtTime(
    .18,
    now + .01
  );

  gain1.gain.exponentialRampToValueAtTime(
    .001,
    now + .30
  );


  osc1.connect(gain1);

  gain1.connect(
    audioContext.destination
  );


  osc1.start(now);

  osc1.stop(
    now + .32
  );


  setTimeout(
    function(){

      if(!audioContext){
        return;
      }


      const now2 =
        audioContext.currentTime;


      const osc2 =
        audioContext.createOscillator();

      const gain2 =
        audioContext.createGain();


      osc2.type =
        "sine";

      osc2.frequency.value =
        784;


      gain2.gain.setValueAtTime(
        .0001,
        now2
      );

      gain2.gain.exponentialRampToValueAtTime(
        .16,
        now2 + .01
      );

      gain2.gain.exponentialRampToValueAtTime(
        .001,
        now2 + .34
      );


      osc2.connect(gain2);

      gain2.connect(
        audioContext.destination
      );


      osc2.start(now2);

      osc2.stop(
        now2 + .36
      );

    },
    135
  );

}


/* =====================================================
   キンコン停止判定
===================================================== */

function canStopBell(){

  if(!currentMarker){

    return false;

  }


  const current =
    currentMarker.getLatLng();


  /*
   * 一番近い未到達地点が30m以内
   */

  if(
    currentViaIndex <
    viaPoints.length
  ){

    if(
      current.distanceTo(
        viaPoints[currentViaIndex]
      ) <= 30
    ){

      return true;

    }

  }


  /*
   * 目的地
   */

  if(
    currentViaIndex >=
    viaPoints.length &&
    destination
  ){

    if(
      current.distanceTo(
        destination
      ) <= 30
    ){

      return true;

    }

  }


  /*
   * 速度ATS解除
   */

  if(
    atsType === "overspeed" &&
    currentSpeed <=
    speedLimit - 3
  ){

    return true;

  }


  return false;

}


/* =====================================================
   キンコン開始
===================================================== */

function startBell(){

  stopBell();


  if(canStopBell()){

    return;

  }


  bellActive = true;

  playBell();


  bellTimer =
    setInterval(
      function(){

        if(canStopBell()){

          stopBell();

          return;

        }

        playBell();

      },
      700
    );

}


/* =====================================================
   キンコン停止
===================================================== */

function stopBell(){

  if(
    bellTimer !== null
  ){

    clearInterval(
      bellTimer
    );

    bellTimer = null;

  }


  bellActive = false;

}

/* =====================================================
   設定画面で地点をタップ
===================================================== */

function setupMapPoint(latlng){

  /*
   * 目的地
   */

  if(
    setupMode ===
    "destination"
  ){

    if(destinationMarker){

      setupMap.removeLayer(
        destinationMarker
      );

    }


    destination =
      L.latLng(
        latlng.lat,
        latlng.lng
      );


    const name =
      prompt(
        "目的地の名前を入力してください",
        "別府駅"
      );


    if(
      !name ||
      !name.trim()
    ){

      destination = null;

      return;

    }


    destinationName =
      name.trim();


    destinationMarker =
      L.marker(
        latlng
      )
      .addTo(setupMap)
      .bindPopup(
        "🎯 " +
        destinationName
      )
      .openPopup();


    setupMode =
      "via";


    updateSetupMode();

    updateSetupRouteList();

    return;

  }


  /*
   * 経由地点
   */

  if(
    setupMode ===
    "via"
  ){

    const name =
      prompt(
        "経由地の名前を入力してください",
        "ローソン"
      );


    if(
      !name ||
      !name.trim()
    ){

      return;

    }


    addSetupViaPoint(
      latlng,
      name.trim()
    );

  }

}


/* =====================================================
   経由地追加
===================================================== */

function addSetupViaPoint(
  latlng,
  name
){

  const point =
    L.latLng(
      latlng.lat,
      latlng.lng
    );


  viaPoints.push(
    point
  );


  viaNames.push(
    name
  );


  viaATSUsed.push(
    false
  );


  const marker =
    L.marker(
      latlng
    )
    .addTo(setupMap)
    .bindPopup(
      "📍 " +
      name
    );


  viaMarkers.push(
    marker
  );


  updateSetupRouteList();

}

function changeSetupMode(){

===================================================== */

function updateSetupRouteList(){

    document.getElementById(
      "setupRouteList"
    );


  list.innerHTML = "";


  if(destination){

/* =====================================================
   目的地削除
===================================================== */

function deleteDestination(){

  if(
    !confirm(
      "目的地を削除しますか？"
    )
  ){

    return;

  }


  if(
    destinationMarker &&
    setupMap
  ){

    setupMap.removeLayer(
      destinationMarker
    );

  }


  destination = null;

  destinationName = "";

  destinationMarker = null;


  /*
   * 目的地を削除したら
   * 目的地設定へ戻る
   */

  setupMode =
    "destination";


  updateSetupMode();

  updateSetupRouteList();

}


/* =====================================================
   経由地削除
===================================================== */

function deleteSetupVia(index){

  if(
    !confirm(
      "この経由地を削除しますか？"
    )
  ){

    return;

  }


  if(
    viaMarkers[index] &&
    setupMap
  ){

    setupMap.removeLayer(
      viaMarkers[index]
    );

  }


  viaMarkers.splice(
    index,
    1
  );

  viaPoints.splice(
    index,
    1
  );

  viaNames.splice(
    index,
    1
  );

  viaATSUsed.splice(
    index,
    1
  );


  updateSetupRouteList();

}


/* =====================================================
   種別カラー
===================================================== */

function updateBoardColor(type){

  const board =
    document.getElementById(
      "board"
    );


  board.classList.remove(
    "board-normal",

  if(

    );

  }
  else if(

    "新快速"
  ){

    board.classList.add(
      "board-shinkaisoku"
    );

  }
  else{

    board.classList.add(
      "board-other"
    );

  }

}

   運転開始
===================================================== */

function startDrive(){

  if(!destination){

    alert(

    );

  }


  /*
   * ここが重要
   *

    ).value;

        "speedLimit"

    );

  ){

      "速度制限を設定してください"
    );

  }


  /*

   */

  document.getElementById(
    "board"
  ).textContent =
    type;


  updateBoardColor(type);


  document.getElementById(
    "limitBox"
  ).textContent =

  ).style.display =

  document.getElementById(
    "drive"
  ).style.display =

   */

  overspeedATSUsed = false;

      }
    );

  );

/* =====================================================
   運転地図
===================================================== */

function initDriveMap(){

  if(map){

    map.invalidateSize();

    return;

  }


  map =
    L.map(
      "map",
      {
        zoomControl:true
      }
    );


  L.tileLayer(
    "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
    {

      maxZoom:20,

      attribution:
        "&copy; OpenStreetMap &copy; CARTO",

      subdomains:
        "abcd"

    }
  ).addTo(map);


  /*
   * 保存していた地点を
   * 運転地図にも表示
   */

  destinationMarker =
    L.marker(
      destination
    )
    .addTo(map)
    .bindPopup(
      "🎯 " +
      destinationName
    );


  viaMarkers.forEach(
    function(marker){

      /*
       * setupMapのマーカーは
       * 運転地図には移さない
       */

    }
  );


  /*
   * 運転用に経由地マーカー生成
   */

  viaMarkers = [];


  viaPoints.forEach(
    function(point,index){

      const marker =
        L.marker(
          point
        )
        .addTo(map)
        .bindPopup(
          "📍 " +
          viaNames[index]
        );


      viaMarkers.push(
        marker
      );

    }
  );


  /*
   * GPS
   */

  if(
    navigator.geolocation
  ){

    navigator.geolocation.getCurrentPosition(

      function(position){

        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;


        map.setView(
          [lat,lng],
          17
        );


        createCurrentMarker(
          lat,
          lng
        );


        startGPS();

      },

      function(){

        map.fitBounds(
          createRouteBounds()
        );

      },

      {
        enableHighAccuracy:true,
        timeout:10000,
        maximumAge:1000
      }

    );

  }

}


/* =====================================================
   ルート範囲
===================================================== */

function createRouteBounds(){

  const points = [];


  if(destination){

    points.push(
      destination
    );

  }


  viaPoints.forEach(
    function(point){

      points.push(
        point
      );

    }
  );


  if(points.length){

    return L.latLngBounds(
      points
    );

  }


  return L.latLngBounds(
    [
      [35.68,139.76],
      [35.69,139.77]
    ]
  );

}

/* =====================================================
   一番近い未到達地点を表示
===================================================== */

function updateNearestDistance(
  current
){

  /*
   * まず経由地を順番に処理
   *
   * 「一番近い未到達の経由地」
   */

  if(
    currentViaIndex <
    viaPoints.length
  ){

    const via =
      viaPoints[
        currentViaIndex
      ];


    const distance =
      current.distanceTo(
        via
      );


    document.getElementById(
      "distanceBox"
    ).textContent =
      "📍 " +
      viaNames[
        currentViaIndex
      ] +
      "まで " +
      formatDistance(distance);


    return distance;

  }


  /*
   * 経由地が全部終わったら目的地
   */

  if(destination){

    const distance =
      current.distanceTo(
        destination
      );


    document.getElementById(
      "distanceBox"
    ).textContent =
      "🎯 " +
      destinationName +
      "まで " +
      formatDistance(distance);


    return distance;

  }


  return Infinity;

}


/* =====================================================
   距離表示
===================================================== */

function formatDistance(distance){

  if(
    distance >= 1000
  ){

    return (
      distance / 1000
    ).toFixed(2) +
    " km";

  }


  return (
    Math.round(distance)
  ) +
  " m";

}


/* =====================================================
   GPS
===================================================== */

function startGPS(){

  if(
    watchID !== null
  ){

    navigator.geolocation.clearWatch(
      watchID
    );

  }


  watchID =
    navigator.geolocation.watchPosition(

      function(position){

        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;


        let speed =
          position.coords.speed;


        if(
          speed === null ||
          speed < 0
        ){

          speed = 0;

        }


        speed *= 3.6;

        currentSpeed =
          speed;


        document.getElementById(
          "speed"
        ).textContent =
          Math.round(speed);


        /*
         * 現在地
         */

        if(currentMarker){

          currentMarker.setLatLng(
            [lat,lng]
          );

        }


        /*
         * 追従
         */

        if(
          document.getElementById(
            "followSwitch"
          ).checked &&
          map
        ){

          map.panTo(
            [lat,lng],
            {
              animate:true,
              duration:.5
            }
          );

        }


        /*
         * 速度超過
         */

        if(
          speed >
          speedLimit
        ){

          document.getElementById(
            "overspeed"
          ).style.display =
            "block";


          if(
            !atsActive &&
            !overspeedATSUsed
          ){

            overspeedATSUsed =
              true;


            activateATS(
              "⚠️ 速度超過ATS",
              "overspeed"
            );

          }

        }
        else{

          document.getElementById(
            "overspeed"
          ).style.display =
            "none";

        }


        const current =
          L.latLng(
            lat,
            lng
          );


        /*
         * 距離表示
         */

        const distance =
          updateNearestDistance(
            current
          );


        /*
         * 経由地
         */

        if(
          currentViaIndex <
          viaPoints.length
        ){

          const via =
            viaPoints[
              currentViaIndex
            ];


          const viaDistance =
            current.distanceTo(
              via
            );


          /*
           * 100mでATS
           */

          if(
            viaDistance <= 100 &&
            !atsActive &&
            !viaATSUsed[
              currentViaIndex
            ]
          ){

            viaATSUsed[
              currentViaIndex
            ] = true;


            activateATS(
              "⚠️ " +
              viaNames[
                currentViaIndex
              ] +
              " ATS",
              "via"
            );

          }


          /*
           * 30m到達
           */

          if(
            viaDistance <= 30
          ){

            stopBell();


            currentViaIndex++;


            updateNextBoard();


            updateNearestDistance(
              current
            );

          }

          else if(
            !atsActive
          ){

            /*
             * ATSが出ていない間
             * 接近キンコン
             */

            if(
              viaDistance > 30
            ){

              startBell();

            }

          }


          return;

        }


        /*
         * 目的地
         */

        if(destination){

          const destinationDistance =
            current.distanceTo(
              destination
            );


          /*
           * 200mで到着ATS
           */

          if(
            destinationDistance <= 200 &&
            !atsActive &&
            !destinationATSUsed
          ){

            destinationATSUsed =
              true;


            activateATS(
              "🏁 目的地ATS",
              "destination"
            );

          }


          /*
           * 30mでキンコン停止
           */

          if(
            destinationDistance <= 30
          ){

            stopBell();

          }
          else if(
            !atsActive
          ){

            startBell();

          }

        }

      },

      function(){

        document.getElementById(
          "distanceBox"
        ).textContent =
          "📍 GPS取得失敗";

      },

      {

        enableHighAccuracy:true,

        maximumAge:1000,

        timeout:10000

      }

    );

}


/* =====================================================
   ATS作動
===================================================== */

function activateATS(
  message,
  type
){

  if(atsActive){

    return;

  }


  atsActive = true;

  atsType = type;

  atsSeconds = 60;


  /*
   * キンコン停止
   */

  stopBell();


  /*
   * 終了ボタン停止
   */

  document.getElementById(
    "finishButton"
  ).style.display =
    "none";


  /*
   * ATS表示
   */

  document.getElementById(
    "ats"
  ).style.display =
    "block";


  document.getElementById(
    "atsText"
  ).textContent =
    message;


  document.getElementById(
    "atsTimer"
  ).textContent =
    "自動終了まで 60 秒";


  /*
   * ★ここで連続ATS音
   */

  startAlarm();


  /*
   * バイブ
   */

  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      [500,200,500]
    );

  }


  /*
   * カウントダウン
   */

  clearInterval(
    atsCountdownTimer
  );


  atsCountdownTimer =
    setInterval(
      function(){

        if(!atsActive){

          return;

        }


        atsSeconds--;


        document.getElementById(
          "atsTimer"
        ).textContent =
          "自動終了まで " +
          Math.max(
            0,
            atsSeconds
          ) +
          " 秒";


        if(
          atsSeconds <= 0
        ){

          releaseATS();

        }

      },
      1000
    );


  /*
   * 念のため60秒タイマー
   */

  clearTimeout(
    atsTimer
  );


  atsTimer =
    setTimeout(
      function(){

        releaseATS();

      },
      60000
    );

}


/* =====================================================
   ATS解除
===================================================== */

function releaseATS(){

  if(!atsActive){

    return;

  }


  atsActive = false;


  clearTimeout(
    atsTimer
  );

  clearInterval(
    atsCountdownTimer
  );


  atsTimer = null;

  atsCountdownTimer = null;


  /*
   * ★連続音を確実に停止
   */

  stopAlarm();


  if(
    navigator.vibrate
  ){

    navigator.vibrate(0);

  }


  document.getElementById(
    "ats"
  ).style.display =
    "none";


  document.getElementById(
    "finishButton"
  ).style.display =
    "block";


  /*
   * ATS解除後
   * まだ地点から30m以上なら
   * キンコン再開
   */

  if(
    !canStopBell()
  ){

    startBell();

  }

}


/* =====================================================
   ATSスライダー
===================================================== */

const sliderButton =
  document.getElementById(
    "sliderButton"
  );


sliderButton.addEventListener(
  "touchstart",
  function(e){

    if(!atsActive){

      return;

    }


    startX =
      e.touches[0].clientX;

    sliderX = 0;

  },
  {
    passive:true
  }
);


sliderButton.addEventListener(
  "touchmove",
  function(e){

    if(!atsActive){

      return;

    }


    sliderX =
      e.touches[0].clientX -
      startX;


    if(sliderX < 0){

      sliderX = 0;

    }


    const slider =
      sliderButton.parentElement;


    const max =
      slider.clientWidth -
      sliderButton.clientWidth -
      10;


    if(sliderX > max){

      sliderX = max;

    }


    sliderButton.style.transform =
      "translateX(" +
      sliderX +
      "px)";

  },
  {
    passive:true
  }
);


sliderButton.addEventListener(
  "touchend",
  function(){

    if(!atsActive){

      return;

    }


    const slider =
      sliderButton.parentElement;


    const max =
      slider.clientWidth -
      sliderButton.clientWidth -
      10;


    if(
      sliderX >=
      max * .7
    ){

      releaseATS();

    }


    sliderButton.style.transform =
      "translateX(0)";

    sliderX = 0;

  }
);


/* =====================================================
   地点一覧
===================================================== */

function updateRouteList(){

  const list =
    document.getElementById(
      "routeList"
    );


  list.innerHTML = "";


  viaPoints.forEach(
    function(point,index){

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "setupRouteItem";


      const text =
        document.createElement(
          "span"
        );


      text.textContent =
        "📍 " +
        (index + 1) +
        ". " +
        viaNames[index];


      item.appendChild(
        text
      );


      list.appendChild(
        item
      );

    }
  );


  if(destination){

    const item =
      document.createElement(
        "div"
      );


    item.className =
      "setupRouteItem";


    const text =
      document.createElement(
        "span"
      );


    text.textContent =
      "🎯 " +
      destinationName;


    item.appendChild(
      text
    );


    list.appendChild(
      item
    );

  }

}


/* =====================================================
   地点一覧開閉
===================================================== */

function toggleRoutePanel(){

  const panel =
    document.getElementById(
      "routePanel"
    );


  panel.style.display =
    panel.style.display ===
    "block"
      ? "none"
      : "block";

}


/* =====================================================
   運転終了
===================================================== */

function finishDrive(){

  if(atsActive){

    return;

  }


  if(
    !confirm(
      "運転を終了しますか？"
    )
  ){

    return;

  }


  stopAlarm();

  stopBell();


  clearTimeout(
    atsTimer
  );

  clearInterval(
    atsCountdownTimer
  );


  if(
    watchID !== null
  ){

    navigator.geolocation.clearWatch(
      watchID
    );

    watchID = null;

  }


  /*
   * 運転画面のマーカー削除
   */

  if(destinationMarker && map){

    map.removeLayer(
      destinationMarker
    );

  }


  viaMarkers.forEach(
    function(marker){

      if(map){

        map.removeLayer(
          marker
        );

      }

    }
  );


  if(currentMarker && map){

    map.removeLayer(
      currentMarker
    );

  }


  destination = null;

  destinationName = "";

  viaPoints = [];

  viaNames = [];

  viaMarkers = [];

  destinationMarker = null;

  currentMarker = null;

  currentViaIndex = 0;

  destinationATSUsed = false;

  overspeedATSUsed = false;

  viaATSUsed = [];

  atsActive = false;

  atsType = "";

  currentSpeed = 0;


  /*
   * 設定画面に戻る
   */

  document.getElementById(
    "drive"
  ).style.display =
    "none";


  document.getElementById(
    "setup"
  ).style.display =
    "block";


  /*
   * 地図を作り直す
   */

  if(setupMap){

    setupMap.remove();

    setupMap = null;

  }


  if(map){

    map.remove();

    map = null;

  }


  setupMode =
    "destination";


  updateSetupMode();

  updateSetupRouteList();


  document.getElementById(
    "speed"
  ).textContent =
    "0";


  document.getElementById(
    "overspeed"
  ).style.display =
    "none";


  document.getElementById(
    "ats"
  ).style.display =
    "none";


  setTimeout(
    initSetupMap,
    100
  );

}


/* =====================================================
   初期化
===================================================== */

window.addEventListener(
  "load",
  function(){

    initSetupMap();

  }
);


/* =====================================================
   ページ終了
===================================================== */

window.addEventListener(
  "beforeunload",
  function(){

    stopAlarm();

    stopBell();

    if(
      watchID !== null &&
      navigator.geolocation
    ){

      navigator.geolocation.clearWatch(
        watchID
      );

    }

  }
);

</script>
