<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>cycletrain</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

/* =====================================================
   BASE
===================================================== */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:#eef1f5;
  color:#111;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    sans-serif;
}


/* =====================================================
   LIQUID GLASS
===================================================== */

.glass{
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.72),
      rgba(255,255,255,.38)
    );

  backdrop-filter:
    blur(28px)
    saturate(180%);

  -webkit-backdrop-filter:
    blur(28px)
    saturate(180%);

  border:
    1px solid rgba(255,255,255,.75);

  box-shadow:
    0 12px 35px rgba(0,0,0,.12),
    inset 0 1px 1px rgba(255,255,255,.9);
}


/* =====================================================
   SETUP
===================================================== */

#setup{

  height:100vh;

  padding:
    35px
    22px
    30px;

  overflow-y:auto;

  background:
    radial-gradient(
      circle at 20% 10%,
      #ffffff 0,
      #eef2f7 45%,
      #dfe5ec 100%
    );

}

.logo{

  text-align:center;

  font-size:34px;

  font-weight:800;

  letter-spacing:-1px;

  margin:
    20px
    0
    40px;

}

label{

  display:block;

  color:#66707d;

  margin:
    20px
    0
    8px;

  font-size:14px;

  font-weight:600;

}

select,
input{

  width:100%;

  height:58px;

  padding:
    0
    17px;

  border-radius:19px;

  border:
    1px solid
    rgba(255,255,255,.8);

  background:
    rgba(255,255,255,.6);

  backdrop-filter:
    blur(20px);

  -webkit-backdrop-filter:
    blur(20px);

  color:#111;

  font-size:18px;

  outline:none;

  box-shadow:
    inset 0 1px 2px rgba(0,0,0,.04),
    0 5px 18px rgba(0,0,0,.05);

}

.speedSetting{

  display:flex;

  align-items:center;

  gap:10px;

}

.speedSetting input{

  flex:1;

}

.speedUnit{

  color:#69727e;

  font-weight:600;

}


/* =====================================================
   START BUTTON
===================================================== */

.startButton{

  width:100%;

  height:64px;

  margin-top:30px;

  border:0;

  border-radius:22px;

  background:
    linear-gradient(
      135deg,
      #0a84ff,
      #007aff
    );

  color:white;

  font-size:19px;

  font-weight:700;

  box-shadow:
    0 10px 25px
    rgba(0,122,255,.28);

}


/* =====================================================
   DRIVE
===================================================== */

#drive{

  display:none;

  height:100vh;

  position:relative;

  background:#dfe4e9;

}


/* =====================================================
   DESTINATION BOARD
===================================================== */

#board{

  position:absolute;

  top:12px;

  left:50%;

  transform:
    translateX(-50%);

  width:
    calc(100% - 24px);

  height:62px;

  z-index:3000;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:22px;

  font-size:23px;

  font-weight:800;

  white-space:nowrap;

  overflow:hidden;

  color:#111;

  background:
    rgba(255,255,255,.74);

  backdrop-filter:
    blur(28px)
    saturate(180%);

  -webkit-backdrop-filter:
    blur(28px)
    saturate(180%);

  border:
    1px solid
    rgba(255,255,255,.85);

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.13);

}


/* =====================================================
   MAP
===================================================== */

#map{

  width:100%;

  height:100%;

  background:#dfe4e9;

}


/*
 * Leafletを少し柔らかく
 */

.leaflet-tile{

  filter:
    saturate(.92)
    contrast(.98)
    brightness(1.04);

}

.leaflet-control-zoom{

  border:0 !important;

  border-radius:17px !important;

  overflow:hidden;

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.16) !important;

}

.leaflet-control-zoom a{

  background:
    rgba(255,255,255,.78) !important;

  backdrop-filter:
    blur(20px);

  color:#111 !important;

  border:0 !important;

}


/* =====================================================
   FLOATING BOXES
===================================================== */

#distanceBox,
#limitBox,
#followBox,
#modeBox,
#routeButton{

  background:
    rgba(255,255,255,.72);

  backdrop-filter:
    blur(24px)
    saturate(180%);

  -webkit-backdrop-filter:
    blur(24px)
    saturate(180%);

  border:
    1px solid
    rgba(255,255,255,.8);

  color:#111;

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.12);

}


/* =====================================================
   DISTANCE
===================================================== */

#distanceBox{

  position:absolute;

  top:88px;

  left:10px;

  z-index:1500;

  padding:
    10px
    13px;

  border-radius:15px;

  font-size:14px;

}


/* =====================================================
   LIMIT
===================================================== */

#limitBox{

  position:absolute;

  top:88px;

  right:10px;

  z-index:1500;

  padding:
    10px
    13px;

  border-radius:15px;

  font-size:14px;

}


/* =====================================================
   FOLLOW
===================================================== */

#followBox{

  position:absolute;

  top:135px;

  left:10px;

  z-index:1600;

  padding:
    8px
    11px;

  border-radius:15px;

  font-size:13px;

  display:flex;

  align-items:center;

  gap:7px;

}

#followSwitch{

  width:45px;

  height:25px;

  appearance:none;

  background:#b7bec7;

  border-radius:20px;

  position:relative;

  outline:none;

  padding:0;

  border:0;

}

#followSwitch:checked{

  background:#34c759;

}

#followSwitch::after{

  content:"";

  position:absolute;

  width:21px;

  height:21px;

  top:2px;

  left:2px;

  background:white;

  border-radius:50%;

  transition:.2s;

  box-shadow:
    0 2px 5px
    rgba(0,0,0,.18);

}

#followSwitch:checked::after{

  transform:
    translateX(20px);

}


/* =====================================================
   MODE
===================================================== */

#modeBox{

  position:absolute;

  top:135px;

  right:10px;

  z-index:1600;

  padding:
    9px
    12px;

  border-radius:15px;

  font-size:13px;

}


/* =====================================================
   ROUTE BUTTON
===================================================== */

#routeButton{

  position:absolute;

  top:178px;

  right:10px;

  z-index:1600;

  border:0;

  border-radius:15px;

  padding:
    10px
    13px;

  font-size:13px;

}


/* =====================================================
   ROUTE PANEL
===================================================== */

#routePanel{

  display:none;

  position:absolute;

  top:225px;

  right:10px;

  width:235px;

  max-height:300px;

  overflow-y:auto;

  z-index:3000;

  padding:10px;

  background:
    rgba(255,255,255,.78);

  backdrop-filter:
    blur(28px)
    saturate(180%);

  -webkit-backdrop-filter:
    blur(28px)
    saturate(180%);

  border:
    1px solid
    rgba(255,255,255,.85);

  border-radius:20px;

  box-shadow:
    0 15px 40px
    rgba(0,0,0,.18);

}

.routeTitle{

  color:#68717c;

  font-size:13px;

  padding:
    4px
    5px
    8px;

}

.routeItem{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:5px;

  padding:9px;

  margin-bottom:6px;

  background:
    rgba(240,243,247,.85);

  border-radius:13px;

  font-size:13px;

}

.deleteRoute{

  border:0;

  border-radius:9px;

  background:#ff3b30;

  color:white;

  padding:
    6px
    8px;

}


/* =====================================================
   SPEED
===================================================== */

#speedBox{

  position:absolute;

  bottom:118px;

  left:0;

  width:100%;

  text-align:center;

  z-index:1600;

  pointer-events:none;

}

#speed{

  font-size:58px;

  font-weight:800;

  letter-spacing:-2px;

  text-shadow:
    0 3px 12px
    rgba(255,255,255,.9);

}

.kmh{

  color:#555f6b;

  font-size:15px;

}


/* =====================================================
   OVERSPEED
===================================================== */

#overspeed{

  display:none;

  position:absolute;

  bottom:185px;

  left:0;

  width:100%;

  text-align:center;

  z-index:1800;

  color:#ff3b30;

  font-size:19px;

  font-weight:800;

}


/* =====================================================
   FINISH BUTTON
===================================================== */

#finishButton{

  position:absolute;

  left:20px;

  bottom:20px;

  width:
    calc(100% - 40px);

  height:64px;

  border:0;

  border-radius:21px;

  background:
    rgba(255,255,255,.76);

  backdrop-filter:
    blur(28px);

  -webkit-backdrop-filter:
    blur(28px);

  color:#111;

  font-size:19px;

  font-weight:700;

  z-index:2000;

  box-shadow:
    0 10px 30px
    rgba(0,0,0,.15);

}


/* =====================================================
   ATS
===================================================== */

#ats{

  display:none;

  position:absolute;

  left:16px;

  bottom:18px;

  width:
    calc(100% - 32px);

  z-index:5000;

}

.atsWarning{

  text-align:center;

  color:#ff3b30;

  font-size:18px;

  font-weight:800;

  margin-bottom:7px;

}

.atsTimer{

  text-align:center;

  color:#5f6873;

  font-size:13px;

  margin-bottom:6px;

}

.slider{

  position:relative;

  height:66px;

  border-radius:21px;

  background:
    rgba(255,255,255,.78);

  backdrop-filter:
    blur(30px);

  -webkit-backdrop-filter:
    blur(30px);

  overflow:hidden;

  touch-action:none;

  border:
    1px solid
    rgba(255,255,255,.85);

  box-shadow:
    0 12px 35px
    rgba(0,0,0,.18);

}

.sliderText{

  position:absolute;

  width:100%;

  height:100%;

  display:flex;

  align-items:center;

  justify-content:center;

  color:#68717c;

  font-size:17px;

}

.sliderButton{

  position:absolute;

  left:5px;

  top:5px;

  width:56px;

  height:56px;

  border-radius:17px;

  background:
    linear-gradient(
      135deg,
      #ff453a,
      #ff2d55
    );

  color:white;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:25px;

  z-index:10;

  touch-action:none;

  box-shadow:
    0 5px 15px
    rgba(255,59,48,.3);

}


/* =====================================================
   MAP MARKER
===================================================== */

.current-location-marker{

  width:18px;

  height:18px;

  border-radius:50%;

  background:#007aff;

  border:
    3px solid white;

  box-shadow:
    0 2px 10px
    rgba(0,122,255,.5);

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:500px){

  #board{

    font-size:21px;

  }

}

</style>

</head>


<body>


<!-- =====================================================
     SETUP
===================================================== -->

<div id="setup">

  <div class="logo">
    🚲 cycletrain
  </div>

  <label>
    種別
  </label>

  <select id="type">

    <option>普通</option>

    <option>快速</option>

    <option>急行</option>

    <option>特急</option>

    <option>新快速</option>

  </select>


  <label>
    行き先
  </label>

  <input
    id="destinationName"
    type="text"
    placeholder="例：別府駅"
  >


  <label>
    速度制限
  </label>

  <div class="speedSetting">

    <input
      id="speedLimit"
      type="number"
      min="1"
      max="200"
      value="20"
      inputmode="numeric"
    >

    <div class="speedUnit">
      km/h
    </div>

  </div>


  <button
    class="startButton"
    onclick="startDrive()"
  >
    🚃 運転開始
  </button>

</div>


<!-- =====================================================
     DRIVE
===================================================== -->

<div id="drive">


  <div id="board">
    普通・別府駅
  </div>


  <div id="distanceBox">
    📍 目的地を設定してください
  </div>


  <div id="limitBox">
    🚦 制限 20 km/h
  </div>


  <div id="followBox">

    追従

    <input
      id="followSwitch"
      type="checkbox"
      checked
    >

  </div>


  <div id="modeBox">
    🎯 目的地設定
  </div>


  <button
    id="routeButton"
    onclick="toggleRoutePanel()"
  >
    📍 地点一覧
  </button>


  <div id="routePanel">

    <div class="routeTitle">
      設定地点
    </div>

    <div id="routeList"></div>

  </div>


  <div id="map"></div>


  <div id="overspeed">
    ⚠️ 速度超過
  </div>


  <div id="speedBox">

    <div id="speed">
      0
    </div>

    <div class="kmh">
      km/h
    </div>

  </div>


  <button
    id="finishButton"
    onclick="finishDrive()"
  >
    運転終了
  </button>


  <!-- ===================================================
       ATS
  ==================================================== -->

  <div id="ats">

    <div
      id="atsText"
      class="atsWarning"
    >
      ⚠️ ATS作動
    </div>

    <div
      id="atsTimer"
      class="atsTimer"
    >
      自動終了まで 60 秒
    </div>


    <div class="slider">

      <div class="sliderText">
        スライドで解除
      </div>

      <div
        class="sliderButton"
        id="sliderButton"
      >
        →
      </div>

    </div>

  </div>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =====================================================
   BASIC VARIABLES
===================================================== */

let map = null;

let currentMarker = null;

let destination = null;

let destinationMarker = null;

let viaPoints = [];

let viaMarkers = [];

let currentViaIndex = 0;

let mode = "destination";

let watchID = null;

let speedLimit = 20;

let currentSpeed = 0;


/* =====================================================
   ATS
===================================================== */

let atsActive = false;

let atsTimer = null;

let atsCountdownTimer = null;

let atsSeconds = 60;

let atsType = "";

let atsAlreadyTriggered = {

  destination:false,

  via:false,

  overspeed:false

};


/* =====================================================
   BELL
===================================================== */

let bellTimer = null;

let bellActive = false;


/* =====================================================
   AUDIO
===================================================== */

let audioContext = null;

let alarmOscillator = null;

let alarmGain = null;

let alarmInterval = null;


/* =====================================================
   SLIDER
===================================================== */

let startX = 0;

let sliderX = 0;


/* =====================================================
   AUDIO PREPARE
===================================================== */

function prepareAudio(){

  if(!audioContext){

    audioContext =
      new(
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  if(
    audioContext.state ===
    "suspended"
  ){

    audioContext.resume();

  }

}


/* =====================================================
   JR-KYUSHU STYLE ATS
   オリジナル合成音
===================================================== */

function playATSBeep(){

  prepareAudio();

  const ctx =
    audioContext;

  const now =
    ctx.currentTime;


  /*
   * 鋭い金属系の警報音
   */

  const osc =
    ctx.createOscillator();

  const gain =
    ctx.createGain();


  osc.type =
    "square";


  /*
   * 少し高めの周波数
   */

  osc.frequency.setValueAtTime(
    760,
    now
  );

  osc.frequency.linearRampToValueAtTime(
    690,
    now + .075
  );


  gain.gain.setValueAtTime(
    0.0001,
    now
  );

  gain.gain.linearRampToValueAtTime(
    0.14,
    now + .008
  );

  gain.gain.setValueAtTime(
    0.12,
    now + .055
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now + .095
  );


  osc.connect(gain);

  gain.connect(
    ctx.destination
  );


  osc.start(now);

  osc.stop(
    now + .1
  );


  /*
   * 少し高い倍音
   */

  const osc2 =
    ctx.createOscillator();

  const gain2 =
    ctx.createGain();


  osc2.type =
    "triangle";

  osc2.frequency.value =
    1520;


  gain2.gain.setValueAtTime(
    0.045,
    now
  );

  gain2.gain.exponentialRampToValueAtTime(
    0.0001,
    now + .08
  );


  osc2.connect(gain2);

  gain2.connect(
    ctx.destination
  );


  osc2.start(now);

  osc2.stop(
    now + .085
  );

}


/* =====================================================
   ATS START
===================================================== */

function startAlarm(){

  prepareAudio();

  stopAlarm();


  /*
   * 連続した警報パターン
   *
   * 「ジリリリリ」系
   */

  playATSBeep();

  alarmInterval =
    setInterval(
      function(){

        if(
          !atsActive
        ){

          return;

        }

        playATSBeep();

      },
      155
    );

}


/* =====================================================
   ATS STOP
===================================================== */

function stopAlarm(){

  if(
    alarmInterval !== null
  ){

    clearInterval(
      alarmInterval
    );

    alarmInterval = null;

  }


  if(alarmOscillator){

    try{

      alarmOscillator.stop();

    }catch(e){}

    alarmOscillator = null;

  }

}


/* =====================================================
   KIN-KON
===================================================== */

function playBell(){

  prepareAudio();

  const now =
    audioContext.currentTime;


  const osc1 =
    audioContext.createOscillator();

  const gain1 =
    audioContext.createGain();


  osc1.type =
    "sine";

  osc1.frequency.value =
    880;


  gain1.gain.setValueAtTime(
    .16,
    now
  );

  gain1.gain.exponentialRampToValueAtTime(
    .001,
    now + .14
  );


  osc1.connect(gain1);

  gain1.connect(
    audioContext.destination
  );


  osc1.start(now);

  osc1.stop(
    now + .14
  );


  setTimeout(
    function(){

      if(!audioContext){
        return;
      }

      const now2 =
        audioContext.currentTime;


      const osc2 =
        audioContext.createOscillator();

      const gain2 =
        audioContext.createGain();


      osc2.type =
        "sine";

      osc2.frequency.value =
        660;


      gain2.gain.setValueAtTime(
        .16,
        now2
      );

      gain2.gain.exponentialRampToValueAtTime(
        .001,
        now2 + .16
      );


      osc2.connect(gain2);

      gain2.connect(
        audioContext.destination
      );


      osc2.start(now2);

      osc2.stop(
        now2 + .16
      );

    },
    140
  );

}


/* =====================================================
   BELL STOP CONDITION
===================================================== */

function canStopBell(){

  if(!currentMarker){

    return false;

  }


  const current =
    currentMarker.getLatLng();


  /*
   * 目的地30m
   */

  if(destination){

    if(
      current.distanceTo(
        destination
      ) <= 30
    ){

      return true;

    }

  }


  /*
   * 経由地点30m
   */

  for(
    let i=0;
    i<viaPoints.length;
    i++
  ){

    if(
      current.distanceTo(
        viaPoints[i]
      ) <= 30
    ){

      return true;

    }

  }


  /*
   * 速度ATS
   */

  if(
    atsType ===
    "overspeed"
  ){

    if(
      currentSpeed <=
      speedLimit - 3
    ){

      return true;

    }

  }


  return false;

}


/* =====================================================
   BELL START
===================================================== */

function startBell(){

  stopBell();


  if(
    canStopBell()
  ){

    return;

  }


  bellActive = true;

  playBell();


  bellTimer =
    setInterval(
      function(){

        if(
          canStopBell()
        ){

          stopBell();

          return;

        }

        playBell();

      },
      700
    );

}


/* =====================================================
   BELL STOP
===================================================== */

function stopBell(){

  if(
    bellTimer !== null
  ){

    clearInterval(
      bellTimer
    );

    bellTimer = null;

  }


  bellActive = false;

}


/* =====================================================
   START DRIVE
===================================================== */

function startDrive(){

  const type =
    document.getElementById(
      "type"
    ).value;


  const name =
    document.getElementById(
      "destinationName"
    ).value.trim();


  speedLimit =
    Number(
      document.getElementById(
        "speedLimit"
      ).value
    );


  if(!name){

    alert(
      "行き先名を入力してください"
    );

    return;

  }


  if(
    !speedLimit ||
    speedLimit <= 0
  ){

    alert(
      "速度制限を設定してください"
    );

    return;

  }


  prepareAudio();


  /*
   * 種別カラー
   */

  const board =
    document.getElementById(
      "board"
    );


  board.textContent =
    type +
    "・" +
    name;


  if(
    type ===
    "普通"
  ){

    board.style.color =
      "#ffffff";

    board.style.background =
      "rgba(20,20,22,.86)";

  }

  else if(
    type ===
    "新快速"
  ){

    board.style.color =
      "#ffffff";

    board.style.background =
      "rgba(0,122,255,.86)";

  }

  else{

    board.style.color =
      "#ffffff";

    board.style.background =
      "rgba(255,59,48,.86)";

  }


  document.getElementById(
    "limitBox"
  ).textContent =
    "🚦 制限 " +
    speedLimit +
    " km/h";


  document.getElementById(
    "setup"
  ).style.display =
    "none";


  document.getElementById(
    "drive"
  ).style.display =
    "block";


  mode =
    "destination";


  resetATSFlags();

  updateMode();


  setTimeout(
    initMap,
    100
  );

}


/* =====================================================
   RESET ATS FLAGS
===================================================== */

function resetATSFlags(){

  atsAlreadyTriggered = {

    destination:false,

    via:false,

    overspeed:false

  };

}


/* =====================================================
   MAP
===================================================== */

function initMap(){

  if(map){

    map.invalidateSize();

    return;

  }


  map =
    L.map(
      "map",
      {
        zoomControl:false
      }
    );


  L.control.zoom({
    position:"bottomright"
  }).addTo(map);


  /*
   * 無料OpenStreetMap
   * Apple Maps風に見えるようCSS加工
   */

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {

      maxZoom:19,

      attribution:
        "&copy; OpenStreetMap contributors"

    }
  ).addTo(map);


  if(
    !navigator.geolocation
  ){

    alert(
      "この端末ではGPSを利用できません"
    );

    return;

  }


  navigator.geolocation.getCurrentPosition(

    function(position){

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;


      map.setView(
        [lat,lng],
        17
      );


      currentMarker =
        L.marker(
          [lat,lng]
        )
        .addTo(map)
        .bindPopup(
          "🚲 現在地"
        );


      startGPS();

    },

    function(){

      map.setView(
        [35.681236,139.767125],
        13
      );


      document.getElementById(
        "distanceBox"
      ).textContent =
        "📍 GPSを許可してください";

    },

    {

      enableHighAccuracy:true,

      timeout:10000,

      maximumAge:1000

    }

  );


  map.on(
    "click",
    function(e){

      setPoint(
        e.latlng.lat,
        e.latlng.lng
      );

    }
  );

}


/* =====================================================
   SET POINT
===================================================== */

function setPoint(
  lat,
  lng
){

  /*
   * 目的地
   */

  if(
    mode ===
    "destination"
  ){

    if(destinationMarker){

      map.removeLayer(
        destinationMarker
      );

    }


    destination =
      L.latLng(
        lat,
        lng
      );


    destinationMarker =
      L.marker(
        [lat,lng]
      )
      .addTo(map)
      .bindPopup(
        "🎯 目的地"
      );


    mode =
      "via";


    updateMode();

    updateRouteList();


    document.getElementById(
      "distanceBox"
    ).textContent =
      "📍 経由地点を設定してください";


    return;

  }


  /*
   * 経由地点
   */

  if(
    mode ===
    "via"
  ){

    addViaPoint(
      lat,
      lng
    );

  }

}


/* =====================================================
   ADD VIA
===================================================== */

function addViaPoint(
  lat,
  lng
){

  const point =
    L.latLng(
      lat,
      lng
    );


  viaPoints.push(
    point
  );


  const marker =
    L.marker(
      [lat,lng]
    )
    .addTo(map)
    .bindPopup(
      "📍 経由地点 " +
      viaPoints.length
    );


  viaMarkers.push(
    marker
  );


  updateRouteList();

}


/* =====================================================
   MODE
===================================================== */

function updateMode(){

  const box =
    document.getElementById(
      "modeBox"
    );


  if(
    mode ===
    "destination"
  ){

    box.textContent =
      "🎯 目的地設定";

  }

  else{

    box.textContent =
      "📍 経由地点設定";

  }

}


/* =====================================================
   ROUTE LIST
===================================================== */

function updateRouteList(){

  const list =
    document.getElementById(
      "routeList"
    );


  list.innerHTML = "";


  if(destination){

    const item =
      document.createElement(
        "div"
      );


    item.className =
      "routeItem";


    const text =
      document.createElement(
        "span"
      );


    text.textContent =
      "🎯 目的地";


    const button =
      document.createElement(
        "button"
      );


    button.className =
      "deleteRoute";


    button.textContent =
      "削除";


    button.onclick =
      function(){

        deleteDestination();

      };


    item.appendChild(text);

    item.appendChild(button);

    list.appendChild(item);

  }


  viaPoints.forEach(
    function(point,index){

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "routeItem";


      const text =
        document.createElement(
          "span"
        );


      text.textContent =
        "📍 経由 " +
        (index + 1);


      const button =
        document.createElement(
          "button"
        );


      button.className =
        "deleteRoute";


      button.textContent =
        "削除";


      button.onclick =
        function(){

          deleteViaPoint(
            index
          );

        };


      item.appendChild(text);

      item.appendChild(button);

      list.appendChild(item);

    }
  );

}


/* =====================================================
   DELETE DESTINATION
===================================================== */

function deleteDestination(){

  if(
    !confirm(
      "目的地を削除しますか？"
    )
  ){

    return;

  }


  if(destinationMarker){

    map.removeLayer(
      destinationMarker
    );

  }


  destination = null;

  destinationMarker = null;


  /*
   * 目的地を消したら
   * 必ず目的地設定モードへ
   */

  mode =
    "destination";


  updateMode();

  updateRouteList();


  /*
   * 到着ATSをリセット
   */

  atsAlreadyTriggered.destination =
    false;


  document.getElementById(
    "distanceBox"
  ).textContent =
    "🎯 新しい目的地を設定してください";

}


/* =====================================================
   DELETE VIA
===================================================== */

function deleteViaPoint(
  index
){

  if(
    !confirm(
      "この経由地点を削除しますか？"
    )
  ){

    return;

  }


  if(viaMarkers[index]){

    map.removeLayer(
      viaMarkers[index]
    );

  }


  viaMarkers.splice(
    index,
    1
  );


  viaPoints.splice(
    index,
    1
  );


  if(
    currentViaIndex >
    index
  ){

    currentViaIndex--;

  }


  if(
    currentViaIndex < 0
  ){

    currentViaIndex = 0;

  }


  updateRouteList();

}


/* =====================================================
   ROUTE PANEL
===================================================== */

function toggleRoutePanel(){

  const panel =
    document.getElementById(
      "routePanel"
    );


  panel.style.display =
    panel.style.display ===
    "block"
      ? "none"
      : "block";

}


/* =====================================================
   GPS
===================================================== */

function startGPS(){

  if(
    watchID !== null
  ){

    navigator.geolocation.clearWatch(
      watchID
    );

  }


  watchID =
    navigator.geolocation.watchPosition(

      function(position){

        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;


        /*
         * SPEED
         */

        let speed =
          position.coords.speed;


        if(
          speed === null ||
          speed < 0
        ){

          speed = 0;

        }


        speed *= 3.6;


        currentSpeed =
          speed;


        document.getElementById(
          "speed"
        ).textContent =
          Math.round(speed);


        /*
         * CURRENT MARKER
         */

        if(currentMarker){

          currentMarker.setLatLng(
            [lat,lng]
          );

        }


        /*
         * FOLLOW
         */

        const follow =
          document.getElementById(
            "followSwitch"
          ).checked;


        if(
          follow &&
          map
        ){

          map.panTo(
            [lat,lng],
            {

              animate:true,

              duration:.5

            }
          );

        }


        /*
         * SPEED ATS
         */

        if(
          speed >
          speedLimit
        ){

          document.getElementById(
            "overspeed"
          ).style.display =
            "block";


          if(
            !atsActive &&
            !atsAlreadyTriggered.overspeed
          ){

            atsAlreadyTriggered.overspeed =
              true;


            activateATS(
              "⚠️ 速度超過ATS",
              "overspeed"
            );

          }

        }

        else{

          document.getElementById(
            "overspeed"
          ).style.display =
            "none";


          /*
           * 速度が制限以下まで戻ったら
           * 次回の速度超過ATSを許可
           */

          if(
            speed <=
            speedLimit - 3
          ){

            atsAlreadyTriggered.overspeed =
              false;

          }

        }


        /*
         * DESTINATION CHECK
         */

        if(!destination){

          return;

        }


        const current =
          L.latLng(
            lat,
            lng
          );


        /*
         * VIA
         */

        if(
          currentViaIndex <
          viaPoints.length
        ){

          const via =
            viaPoints[
              currentViaIndex
            ];


          const distance =
            current.distanceTo(
              via
            );


          document.getElementById(
            "distanceBox"
          ).textContent =
            "📍 経由 " +
            (currentViaIndex + 1) +
            "まで " +
            Math.round(distance) +
            "m";


          /*
           * 100m ATS
           *
           * 一回だけ
           */

          if(
            distance <= 100 &&
            !atsActive &&
            !atsAlreadyTriggered.via
          ){

            atsAlreadyTriggered.via =
              true;


            activateATS(
              "⚠️ 経由地点ATS",
              "via"
            );

          }


          /*
           * 30m以内
           */

          if(
            distance <= 30
          ){

            stopBell();

          }


          /*
           * ATS解除後に
           * 次の経由地点へ
           */

          if(
            distance <= 30 &&
            !atsActive
          ){

            currentViaIndex++;

            atsAlreadyTriggered.via =
              false;

            updateRouteList();

          }


          return;

        }


        /*
         * DESTINATION
         */

        const distance =
          current.distanceTo(
            destination
          );


        document.getElementById(
          "distanceBox"
        ).textContent =
          "🎯 目的地まで " +
          Math.round(distance) +
          "m";


        /*
         * 到着ATS
         *
         * 一回だけ
         */

        if(
          distance <= 200 &&
          !atsActive &&
          !atsAlreadyTriggered.destination
        ){

          atsAlreadyTriggered.destination =
            true;


          activateATS(
            "🏁 目的地ATS",
            "destination"
          );

        }


        /*
         * 30m以内
         *
         * 必ずキンコン停止
         */

        if(
          distance <= 30
        ){

          stopBell();

        }

      },


      function(){

        document.getElementById(
          "distanceBox"
        ).textContent =
          "📍 GPS取得失敗";

      },


      {

        enableHighAccuracy:true,

        maximumAge:1000,

        timeout:10000

      }

    );

}


/* =====================================================
   ATS ACTIVATE
===================================================== */

function activateATS(
  message,
  type
){

  if(atsActive){

    return;

  }


  atsActive = true;

  atsType = type;

  atsSeconds = 60;


  stopBell();


  document.getElementById(
    "finishButton"
  ).style.display =
    "none";


  document.getElementById(
    "ats"
  ).style.display =
    "block";


  document.getElementById(
    "atsText"
  ).textContent =
    message;


  document.getElementById(
    "atsTimer"
  ).textContent =
    "自動終了まで 60 秒";


  /*
   * ATS警報
   */

  startAlarm();


  /*
   * VIBRATION
   */

  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      [300,200]
    );

  }


  /*
   * COUNTDOWN
   */

  clearInterval(
    atsCountdownTimer
  );


  atsCountdownTimer =
    setInterval(
      function(){

        atsSeconds--;


        document.getElementById(
          "atsTimer"
        ).textContent =
          "自動終了まで " +
          atsSeconds +
          " 秒";


        if(
          atsSeconds <= 0
        ){

          releaseATS();

        }

      },
      1000
    );


  /*
   * FORCE RELEASE
   */

  clearTimeout(
    atsTimer
  );


  atsTimer =
    setTimeout(
      function(){

        releaseATS();

      },
      60000
    );

}


/* =====================================================
   ATS RELEASE
===================================================== */

function releaseATS(){

  if(!atsActive){

    return;

  }


  atsActive = false;


  clearTimeout(
    atsTimer
  );

  clearInterval(
    atsCountdownTimer
  );


  atsTimer = null;

  atsCountdownTimer = null;


  /*
   * ATS音停止
   */

  stopAlarm();


  /*
   * VIBRATION停止
   */

  if(
    navigator.vibrate
  ){

    navigator.vibrate(0);

  }


  /*
   * ATS UI
   */

  document.getElementById(
    "ats"
  ).style.display =
    "none";


  document.getElementById(
    "finishButton"
  ).style.display =
    "block";


  /*
   * 目的地ATSの場合
   *
   * 30m以内ならキンコンを鳴らさない
   */

  if(
    atsType ===
    "destination"
  ){

    if(
      canStopBell()
    ){

      stopBell();

      return;

    }

  }


  /*
   * 経由ATSの場合
   */

  if(
    atsType ===
    "via"
  ){

    if(
      canStopBell()
    ){

      stopBell();

      return;

    }

  }


  /*
   * 速度ATS
   */

  if(
    atsType ===
    "overspeed"
  ){

    if(
      currentSpeed <=
      speedLimit - 3
    ){

      stopBell();

      return;

    }

  }


  /*
   * 条件を満たしていなければ
   * キンコン再開
   */

  startBell();

}


/* =====================================================
   SLIDER TOUCH START
===================================================== */

const sliderButton =
  document.getElementById(
    "sliderButton"
  );


sliderButton.addEventListener(
  "touchstart",
  function(e){

    if(!atsActive){

      return;

    }


    startX =
      e.touches[0].clientX;

  }
);


/* =====================================================
   SLIDER TOUCH MOVE
===================================================== */

sliderButton.addEventListener(
  "touchmove",
  function(e){

    if(!atsActive){

      return;

    }


    const x =
      e.touches[0].clientX;


    sliderX =
      x - startX;


    if(sliderX < 0){

      sliderX = 0;

    }


    const slider =
      sliderButton.parentElement;


    const max =
      slider.clientWidth -
      sliderButton.clientWidth -
      10;


    if(
      sliderX > max
    ){

      sliderX = max;

    }


    sliderButton.style.transform =
      "translateX(" +
      sliderX +
      "px)";

  }
);


/* =====================================================
   SLIDER TOUCH END
===================================================== */

sliderButton.addEventListener(
  "touchend",
  function(){

    if(!atsActive){

      return;

    }


    const slider =
      sliderButton.parentElement;


    const max =
      slider.clientWidth -
      sliderButton.clientWidth -
      10;


    if(
      sliderX >=
      max * .7
    ){

      releaseATS();

    }


    sliderButton.style.transform =
      "translateX(0)";


    sliderX = 0;

  }
);


/* =====================================================
   FINISH
===================================================== */

function finishDrive(){

  if(atsActive){

    return;

  }


  if(
    !confirm(
      "運転を終了しますか？"
    )
  ){

    return;

  }


  /*
   * AUDIO
   */

  stopAlarm();

  stopBell();


  /*
   * TIMERS
   */

  clearTimeout(
    atsTimer
  );

  clearInterval(
    atsCountdownTimer
  );


  /*
   * GPS
   */

  if(
    watchID !== null
  ){

    navigator.geolocation.clearWatch(
      watchID
    );

    watchID = null;

  }


  /*
   * MARKERS
   */

  viaMarkers.forEach(
    function(marker){

      if(map){

        map.removeLayer(
          marker
        );

      }

    }
  );


  if(
    destinationMarker &&
    map
  ){

    map.removeLayer(
      destinationMarker
    );

  }


  if(
    currentMarker &&
    map
  ){

    map.removeLayer(
      currentMarker
    );

  }


  /*
   * RESET
   */

  destination = null;

  destinationMarker = null;

  viaPoints = [];

  viaMarkers = [];

  currentViaIndex = 0;

  atsActive = false;

  atsType = "";

  currentSpeed = 0;

  mode =
    "destination";


  resetATSFlags();


  /*
   * DRIVE OFF
   */

  document.getElementById(
    "drive"
  ).style.display =
    "none";


  document.getElementById(
    "setup"
  ).style.display =
    "block";


  /*
   * PANEL
   */

  document.getElementById(
    "routePanel"
  ).style.display =
    "none";


  /*
   * SPEED
   */

  document.getElementById(
    "speed"
  ).textContent =
    "0";


  /*
   * OVERSPEED
   */

  document.getElementById(
    "overspeed"
  ).style.display =
    "none";


  /*
   * SLIDER
   */

  sliderButton.style.transform =
    "translateX(0)";

  sliderX = 0;

}

</script>
