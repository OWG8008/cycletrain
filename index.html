<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>cycletrain</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

/* =====================================================
   基本
===================================================== */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#eef2f6;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    sans-serif;
  color:#111;
}

button,
input,
select{
  font-family:inherit;
}


/* =====================================================
   Liquid Glass 共通
===================================================== */

.glass{
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.72),
      rgba(255,255,255,.38)
    );

  border:1px solid
    rgba(255,255,255,.72);

  box-shadow:
    0 8px 30px rgba(0,0,0,.12),
    inset 0 1px 1px rgba(255,255,255,.8);

  backdrop-filter:
    blur(24px)
    saturate(180%);

  -webkit-backdrop-filter:
    blur(24px)
    saturate(180%);
}


/* =====================================================
   設定画面
===================================================== */

#setup{

  width:100%;
  height:100vh;

  padding:
    30px
    22px
    30px;

  overflow-y:auto;

  background:
    radial-gradient(
      circle at 20% 10%,
      rgba(120,170,255,.35),
      transparent 35%
    ),
    radial-gradient(
      circle at 90% 90%,
      rgba(150,220,255,.35),
      transparent 35%
    ),
    #edf1f5;
}


.logo{

  text-align:center;

  font-size:34px;

  font-weight:800;

  letter-spacing:-1.5px;

  margin:
    28px 0
    38px;

  color:#111;

}


label{

  display:block;

  margin:
    20px 4px
    8px;

  color:#666;

  font-size:14px;

  font-weight:600;

}


select,
input{

  width:100%;

  height:58px;

  padding:
    0 17px;

  border-radius:20px;

  border:
    1px solid
    rgba(255,255,255,.8);

  background:
    rgba(255,255,255,.58);

  box-shadow:
    inset 0 1px 1px
    rgba(255,255,255,.9),
    0 5px 18px
    rgba(0,0,0,.06);

  backdrop-filter:
    blur(20px);

  -webkit-backdrop-filter:
    blur(20px);

  color:#111;

  font-size:18px;

  outline:none;

}


.speedSetting{

  display:flex;

  align-items:center;

  gap:10px;

}


.speedSetting input{

  flex:1;

}


.speedUnit{

  color:#666;

  font-size:14px;

}


.startButton{

  width:100%;

  height:62px;

  margin-top:30px;

  border:0;

  border-radius:22px;

  background:
    linear-gradient(
      135deg,
      #34c759,
      #22a447
    );

  color:white;

  font-size:19px;

  font-weight:700;

  box-shadow:
    0 10px 25px
    rgba(34,164,71,.28);

}


/* =====================================================
   運転画面
===================================================== */

#drive{

  display:none;

  height:100vh;

  position:relative;

  background:#dce4ea;

}


/* =====================================================
   幕
===================================================== */

#board{

  position:absolute;

  top:12px;

  left:12px;

  right:12px;

  height:62px;

  z-index:1500;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:0 20px;

  border-radius:22px;

  background:
    rgba(15,18,22,.78);

  border:
    1px solid
    rgba(255,255,255,.25);

  box-shadow:
    0 8px 30px
    rgba(0,0,0,.25),
    inset 0 1px 1px
    rgba(255,255,255,.15);

  backdrop-filter:
    blur(25px);

  -webkit-backdrop-filter:
    blur(25px);

  color:white;

  font-size:22px;

  font-weight:800;

  white-space:nowrap;

  overflow:hidden;

}


/* =====================================================
   地図
===================================================== */

#map{

  width:100%;

  height:100vh;

}


/* =====================================================
   Leaflet
===================================================== */

.leaflet-control-zoom{

  border:0 !important;

  border-radius:18px !important;

  overflow:hidden;

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.18) !important;

}

.leaflet-control-zoom a{

  background:
    rgba(255,255,255,.72) !important;

  color:#111 !important;

  border:0 !important;

  backdrop-filter:
    blur(20px);

  -webkit-backdrop-filter:
    blur(20px);

}


/* =====================================================
   情報ボックス
===================================================== */

#distanceBox{

  position:absolute;

  top:86px;

  left:12px;

  z-index:1400;

  padding:
    10px 14px;

  border-radius:18px;

  background:
    rgba(255,255,255,.70);

  border:
    1px solid
    rgba(255,255,255,.8);

  box-shadow:
    0 7px 25px
    rgba(0,0,0,.14);

  backdrop-filter:
    blur(24px)
    saturate(180%);

  -webkit-backdrop-filter:
    blur(24px)
    saturate(180%);

  color:#111;

  font-size:13px;

  font-weight:600;

}


#limitBox{

  position:absolute;

  top:86px;

  right:12px;

  z-index:1400;

  padding:
    10px 14px;

  border-radius:18px;

  background:
    rgba(255,255,255,.70);

  border:
    1px solid
    rgba(255,255,255,.8);

  box-shadow:
    0 7px 25px
    rgba(0,0,0,.14);

  backdrop-filter:
    blur(24px)
    saturate(180%);

  -webkit-backdrop-filter:
    blur(24px)
    saturate(180%);

  color:#111;

  font-size:13px;

  font-weight:600;

}


/* =====================================================
   追従
===================================================== */

#followBox{

  position:absolute;

  top:130px;

  left:12px;

  z-index:1600;

  padding:
    8px 11px;

  border-radius:18px;

  display:flex;

  align-items:center;

  gap:7px;

  background:
    rgba(255,255,255,.66);

  border:
    1px solid
    rgba(255,255,255,.8);

  box-shadow:
    0 7px 22px
    rgba(0,0,0,.12);

  backdrop-filter:
    blur(22px);

  -webkit-backdrop-filter:
    blur(22px);

  color:#222;

  font-size:13px;

  font-weight:600;

}


#followSwitch{

  width:45px;

  height:26px;

  appearance:none;

  background:#aaa;

  border-radius:30px;

  position:relative;

  outline:none;

  padding:0;

  border:0;

  transition:.2s;

}


#followSwitch:checked{

  background:#34c759;

}


#followSwitch::after{

  content:"";

  position:absolute;

  width:22px;

  height:22px;

  top:2px;

  left:2px;

  background:white;

  border-radius:50%;

  transition:.2s;

  box-shadow:
    0 2px 5px
    rgba(0,0,0,.2);

}


#followSwitch:checked::after{

  transform:
    translateX(19px);

}


/* =====================================================
   モード
===================================================== */

#modeBox{

  position:absolute;

  top:130px;

  right:12px;

  z-index:1600;

  padding:
    9px 13px;

  border-radius:18px;

  background:
    rgba(255,255,255,.66);

  border:
    1px solid
    rgba(255,255,255,.8);

  box-shadow:
    0 7px 22px
    rgba(0,0,0,.12);

  backdrop-filter:
    blur(22px);

  -webkit-backdrop-filter:
    blur(22px);

  color:#222;

  font-size:13px;

  font-weight:600;

}


/* =====================================================
   地点一覧ボタン
===================================================== */

#routeButton{

  position:absolute;

  top:170px;

  right:12px;

  z-index:1600;

  border:1px solid
    rgba(255,255,255,.75);

  border-radius:18px;

  background:
    rgba(255,255,255,.68);

  color:#111;

  padding:
    10px 14px;

  font-size:13px;

  font-weight:600;

  box-shadow:
    0 7px 22px
    rgba(0,0,0,.12);

  backdrop-filter:
    blur(22px);

  -webkit-backdrop-filter:
    blur(22px);

}


/* =====================================================
   地点一覧
===================================================== */

#routePanel{

  display:none;

  position:absolute;

  top:215px;

  right:12px;

  width:245px;

  max-height:300px;

  overflow-y:auto;

  z-index:1700;

  padding:10px;

  border-radius:22px;

  background:
    rgba(255,255,255,.76);

  border:
    1px solid
    rgba(255,255,255,.85);

  box-shadow:
    0 15px 45px
    rgba(0,0,0,.20);

  backdrop-filter:
    blur(28px)
    saturate(180%);

  -webkit-backdrop-filter:
    blur(28px)
    saturate(180%);

}


.routeTitle{

  color:#777;

  font-size:12px;

  padding:
    5px
    7px
    9px;

  font-weight:600;

}


.routeItem{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:5px;

  padding:9px;

  margin-bottom:6px;

  background:
    rgba(255,255,255,.65);

  border-radius:15px;

  font-size:13px;

  box-shadow:
    inset 0 1px 1px
    rgba(255,255,255,.8);

}


.deleteRoute{

  border:0;

  border-radius:11px;

  background:
    rgba(255,69,58,.85);

  color:white;

  padding:
    6px 9px;

  font-weight:600;

}


/* =====================================================
   速度
===================================================== */

#speedBox{

  position:absolute;

  bottom:105px;

  left:0;

  width:100%;

  text-align:center;

  z-index:1000;

  pointer-events:none;

}


#speed{

  display:inline-block;

  min-width:105px;

  padding:
    5px 15px;

  border-radius:22px;

  background:
    rgba(255,255,255,.55);

  border:
    1px solid
    rgba(255,255,255,.7);

  box-shadow:
    0 8px 30px
    rgba(0,0,0,.12);

  backdrop-filter:
    blur(22px);

  -webkit-backdrop-filter:
    blur(22px);

  font-size:52px;

  font-weight:800;

  color:#111;

}


.kmh{

  color:#555;

  font-size:14px;

  font-weight:600;

}


/* =====================================================
   速度超過
===================================================== */

#overspeed{

  display:none;

  position:absolute;

  bottom:175px;

  left:0;

  width:100%;

  text-align:center;

  z-index:1800;

  color:#ff3b30;

  font-size:18px;

  font-weight:800;

}


/* =====================================================
   終了ボタン
===================================================== */

#finishButton{

  position:absolute;

  left:15px;

  bottom:15px;

  width:calc(100% - 30px);

  height:62px;

  border:1px solid
    rgba(255,255,255,.75);

  border-radius:22px;

  background:
    rgba(255,255,255,.68);

  color:#111;

  font-size:19px;

  font-weight:700;

  z-index:2000;

  box-shadow:
    0 10px 30px
    rgba(0,0,0,.16);

  backdrop-filter:
    blur(25px)
    saturate(180%);

  -webkit-backdrop-filter:
    blur(25px)
    saturate(180%);

}


/* =====================================================
   ATS
===================================================== */

#ats{

  display:none;

  position:absolute;

  left:15px;

  bottom:15px;

  width:calc(100% - 30px);

  z-index:3000;

  padding:12px;

  border-radius:25px;

  background:
    rgba(20,20,22,.78);

  border:
    1px solid
    rgba(255,255,255,.25);

  box-shadow:
    0 15px 45px
    rgba(0,0,0,.35),
    inset 0 1px 1px
    rgba(255,255,255,.15);

  backdrop-filter:
    blur(30px)
    saturate(150%);

  -webkit-backdrop-filter:
    blur(30px)
    saturate(150%);

}


.atsWarning{

  text-align:center;

  color:#ff453a;

  font-size:18px;

  font-weight:800;

  margin-bottom:6px;

}


.atsTimer{

  text-align:center;

  color:#aaa;

  font-size:12px;

  margin-bottom:8px;

}


.slider{

  position:relative;

  height:62px;

  border-radius:19px;

  background:
    rgba(255,255,255,.12);

  overflow:hidden;

  touch-action:none;

}


.sliderText{

  position:absolute;

  width:100%;

  height:100%;

  display:flex;

  align-items:center;

  justify-content:center;

  color:#aaa;

  font-size:17px;

}


.sliderButton{

  position:absolute;

  left:4px;

  top:4px;

  width:54px;

  height:54px;

  border-radius:16px;

  background:#ff453a;

  color:white;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:24px;

  font-weight:bold;

  z-index:10;

  touch-action:none;

  box-shadow:
    0 5px 15px
    rgba(255,69,58,.3);

}


/* =====================================================
   マーカー
===================================================== */

.leaflet-marker-icon{

  filter:
    drop-shadow(
      0 3px 5px
      rgba(0,0,0,.25)
    );

}


/* =====================================================
   スマホ調整
===================================================== */

@media(
  max-width:390px
){

  #board{
    font-size:20px;
  }

  #distanceBox,
  #limitBox{
    font-size:12px;
  }

  #speed{
    font-size:47px;
  }

}

</style>

</head>


<body>


<!-- =====================================================
     設定
===================================================== -->

<div id="setup">

  <div class="logo">
    🚲 cycletrain
  </div>


  <label>
    種別
  </label>

  <select id="type">

    <option>普通</option>
    <option>快速</option>
    <option>急行</option>
    <option>特急</option>
    <option>新快速</option>

  </select>


  <label>
    行き先
  </label>

  <input
    id="destinationName"
    type="text"
    placeholder="例：別府駅"
  >


  <label>
    速度制限
  </label>

  <div class="speedSetting">

    <input
      id="speedLimit"
      type="number"
      min="1"
      max="200"
      value="20"
      inputmode="numeric"
    >

    <div class="speedUnit">
      km/h
    </div>

  </div>


  <button
    class="startButton"
    onclick="startDrive()"
  >
    🚃 運転開始
  </button>

</div>


<!-- =====================================================
     運転画面
===================================================== -->

<div id="drive">


  <div id="board">
    快速・別府駅行き
  </div>


  <div id="distanceBox">
    📍 目的地を設定してください
  </div>


  <div id="limitBox">
    🚦 制限 20 km/h
  </div>


  <div id="followBox">

    追従

    <input
      id="followSwitch"
      type="checkbox"
      checked
    >

  </div>


  <div id="modeBox">
    🎯 目的地設定
  </div>


  <button
    id="routeButton"
    onclick="toggleRoutePanel()"
  >
    📍 地点一覧
  </button>


  <div id="routePanel">

    <div class="routeTitle">
      設定地点
    </div>

    <div id="routeList"></div>

  </div>


  <div id="map"></div>


  <div id="overspeed">
    ⚠️ 速度超過
  </div>


  <div id="speedBox">

    <div id="speed">
      0
    </div>

    <div class="kmh">
      km/h
    </div>

  </div>


  <button
    id="finishButton"
    onclick="finishDrive()"
  >
    運転終了
  </button>


  <!-- ATS -->

  <div id="ats">

    <div
      id="atsText"
      class="atsWarning"
    >
      ⚠️ ATS作動
    </div>

    <div
      id="atsTimer"
      class="atsTimer"
    >
      自動終了まで 60 秒
    </div>

    <div class="slider">

      <div class="sliderText">
        スライドで解除
      </div>

      <div
        class="sliderButton"
        id="sliderButton"
      >
        →
      </div>

    </div>

  </div>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =====================================================
   基本変数
===================================================== */

let map = null;

let currentMarker = null;

let destination = null;

let destinationMarker = null;

let viaPoints = [];

let viaMarkers = [];

let currentViaIndex = 0;

let mode = "destination";

let watchID = null;

let speedLimit = 20;

let currentSpeed = 0;


/* =====================================================
   ATS
===================================================== */

let atsActive = false;

let atsTimer = null;

let atsCountdownTimer = null;

let atsSeconds = 60;

let atsType = "";


/*
 * ATS一回制御
 *
 * destination:
 * 目的地ATSを一度だけ
 *
 * via:
 * 各経由地点につき一度だけ
 *
 * overspeed:
 * 速度超過ATSを一度だけ
 */

let destinationATSUsed = false;

let viaATSUsed = [];

let overspeedATSUsed = false;


/* =====================================================
   キンコン
===================================================== */

let bellTimer = null;

let bellActive = false;


/* =====================================================
   音
===================================================== */

let audioContext = null;

let alarmOscillator = null;

let alarmGain = null;


/* =====================================================
   スライダー
===================================================== */

let startX = 0;

let sliderX = 0;


/* =====================================================
   Audio
===================================================== */

function prepareAudio(){

  if(!audioContext){

    audioContext =
      new(
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  if(
    audioContext.state === "suspended"
  ){

    audioContext.resume();

  }

}


/* =====================================================
   ATS警報開始
===================================================== */

function startAlarm(){

  prepareAudio();

  stopAlarm();

  alarmOscillator =
    audioContext.createOscillator();

  alarmGain =
    audioContext.createGain();

  alarmOscillator.type =
    "square";

  alarmOscillator.frequency.value =
    700;

  alarmGain.gain.value =
    0.12;

  alarmOscillator.connect(
    alarmGain
  );

  alarmGain.connect(
    audioContext.destination
  );

  alarmOscillator.start();

}


/* =====================================================
   ATS警報停止
===================================================== */

function stopAlarm(){

  if(alarmOscillator){

    try{
      alarmOscillator.stop();
    }catch(e){}

    alarmOscillator.disconnect();

    alarmOscillator = null;

  }

  if(alarmGain){

    alarmGain.disconnect();

    alarmGain = null;

  }

}


/* =====================================================
   キンコン
===================================================== */

function playBell(){

  prepareAudio();

  const now =
    audioContext.currentTime;


  const osc1 =
    audioContext.createOscillator();

  const gain1 =
    audioContext.createGain();

  osc1.type =
    "sine";

  osc1.frequency.value =
    880;

  gain1.gain.setValueAtTime(
    0.16,
    now
  );

  gain1.gain.exponentialRampToValueAtTime(
    0.001,
    now + 0.14
  );

  osc1.connect(gain1);

  gain1.connect(
    audioContext.destination
  );

  osc1.start(now);

  osc1.stop(
    now + 0.14
  );


  setTimeout(
    function(){

      if(!audioContext){
        return;
      }

      const now2 =
        audioContext.currentTime;

      const osc2 =
        audioContext.createOscillator();

      const gain2 =
        audioContext.createGain();

      osc2.type =
        "sine";

      osc2.frequency.value =
        660;

      gain2.gain.setValueAtTime(
        0.16,
        now2
      );

      gain2.gain.exponentialRampToValueAtTime(
        0.001,
        now2 + 0.16
      );

      osc2.connect(gain2);

      gain2.connect(
        audioContext.destination
      );

      osc2.start(now2);

      osc2.stop(
        now2 + 0.16
      );

    },
    140
  );

}


/* =====================================================
   キンコン開始
===================================================== */

function startBell(){

  stopBell();

  if(
    canStopBell()
  ){

    return;

  }

  bellActive = true;

  playBell();

  bellTimer =
    setInterval(
      function(){

        if(
          canStopBell()
        ){

          stopBell();

          return;

        }

        playBell();

      },
      700
    );

}


/* =====================================================
   キンコン停止
===================================================== */

function stopBell(){

  if(
    bellTimer !== null
  ){

    clearInterval(
      bellTimer
    );

    bellTimer = null;

  }

  bellActive = false;

}


/* =====================================================
   キンコン停止条件
===================================================== */

function canStopBell(){

  if(!currentMarker){

    return false;

  }


  const current =
    currentMarker.getLatLng();


  /*
   * 目的地30m
   */

  if(destination){

    if(
      current.distanceTo(destination) <= 30
    ){

      return true;

    }

  }


  /*
   * 経由地点30m
   */

  for(
    let i = 0;
    i < viaPoints.length;
    i++
  ){

    if(
      current.distanceTo(
        viaPoints[i]
      ) <= 30
    ){

      return true;

    }

  }


  /*
   * 速度ATS
   *
   * 制限速度-3以下
   */

  if(
    atsType === "overspeed"
  ){

    if(
      currentSpeed <=
      Math.max(
        0,
        speedLimit - 3
      )
    ){

      return true;

    }

  }


  return false;

}


/* =====================================================
   運転開始
===================================================== */

function startDrive(){

  const type =
    document.getElementById(
      "type"
    ).value;

  const name =
    document.getElementById(
      "destinationName"
    ).value.trim();

  speedLimit =
    Number(
      document.getElementById(
        "speedLimit"
      ).value
    );


  if(!name){

    alert(
      "行き先名を入力してください"
    );

    return;

  }


  if(
    !speedLimit ||
    speedLimit <= 0
  ){

    alert(
      "速度制限を設定してください"
    );

    return;

  }


  prepareAudio();


  document.getElementById(
    "board"
  ).textContent =
    type +
    "・" +
    name +
    "行き";


  document.getElementById(
    "limitBox"
  ).textContent =
    "🚦 制限 " +
    speedLimit +
    " km/h";


  document.getElementById(
    "setup"
  ).style.display =
    "none";


  document.getElementById(
    "drive"
  ).style.display =
    "block";


  /*
   * ATSリセット
   */

  destinationATSUsed = false;

  viaATSUsed = [];

  overspeedATSUsed = false;

  atsActive = false;

  atsType = "";

  currentViaIndex = 0;

  mode = "destination";


  updateMode();


  setTimeout(
    initMap,
    100
  );

}


/* =====================================================
   地図初期化
===================================================== */

function initMap(){

  if(map){

    map.invalidateSize();

    return;

  }


  map =
    L.map("map", {
      zoomControl:true
    });


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,

      attribution:
        "&copy; OpenStreetMap contributors"
    }
  ).addTo(map);


  if(
    !navigator.geolocation
  ){

    alert(
      "この端末ではGPSを利用できません"
    );

    return;

  }


  navigator.geolocation.getCurrentPosition(

    function(position){

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;


      map.setView(
        [lat,lng],
        17
      );


      currentMarker =
        L.marker(
          [lat,lng]
        )
        .addTo(map)
        .bindPopup(
          "🚲 現在地"
        );


      startGPS();

    },

    function(){

      map.setView(
        [35.681236,139.767125],
        13
      );


      document.getElementById(
        "distanceBox"
      ).textContent =
        "📍 GPSを許可してください";

    },

    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:1000
    }

  );


  map.on(
    "click",
    function(e){

      setPoint(
        e.latlng.lat,
        e.latlng.lng
      );

    }
  );

}


/* =====================================================
   地点設定
===================================================== */

function setPoint(
  lat,
  lng
){

  /*
   * 目的地
   */

  if(
    mode === "destination"
  ){

    if(destinationMarker){

      map.removeLayer(
        destinationMarker
      );

    }


    destination =
      L.latLng(
        lat,
        lng
      );


    destinationMarker =
      L.marker(
        [lat,lng]
      )
      .addTo(map)
      .bindPopup(
        "🎯 目的地"
      );


    destinationATSUsed = false;


    mode =
      "via";


    updateMode();

    updateRouteList();


    document.getElementById(
      "distanceBox"
    ).textContent =
      "📍 経由地点を設定してください";


    return;

  }


  /*
   * 経由地点
   */

  if(
    mode === "via"
  ){

    addViaPoint(
      lat,
      lng
    );

  }

}


/* =====================================================
   経由地点追加
===================================================== */

function addViaPoint(
  lat,
  lng
){

  const point =
    L.latLng(
      lat,
      lng
    );


  viaPoints.push(
    point
  );


  viaATSUsed.push(
    false
  );


  const marker =
    L.marker(
      [lat,lng]
    )
    .addTo(map)
    .bindPopup(
      "📍 経由地点 " +
      viaPoints.length
    );


  viaMarkers.push(
    marker
  );


  updateRouteList();

}


/* =====================================================
   モード表示
===================================================== */

function updateMode(){

  const box =
    document.getElementById(
      "modeBox"
    );


  if(
    mode === "destination"
  ){

    box.textContent =
      "🎯 目的地設定";

  }else{

    box.textContent =
      "📍 経由地点設定";

  }

}


/* =====================================================
   地点一覧
===================================================== */

function updateRouteList(){

  const list =
    document.getElementById(
      "routeList"
    );


  list.innerHTML = "";


  /*
   * 目的地
   */

  if(destination){

    const item =
      document.createElement(
        "div"
      );

    item.className =
      "routeItem";


    const text =
      document.createElement(
        "span"
      );

    text.textContent =
      "🎯 目的地";


    const button =
      document.createElement(
        "button"
      );

    button.className =
      "deleteRoute";

    button.textContent =
      "削除";


    button.onclick =
      function(){

        deleteDestination();

      };


    item.appendChild(text);

    item.appendChild(button);

    list.appendChild(item);

  }


  /*
   * 経由地点
   */

  viaPoints.forEach(
    function(point,index){

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "routeItem";


      const text =
        document.createElement(
          "span"
        );

      text.textContent =
        "📍 経由 " +
        (index + 1);


      const button =
        document.createElement(
          "button"
        );

      button.className =
        "deleteRoute";

      button.textContent =
        "削除";


      button.onclick =
        function(){

          deleteViaPoint(
            index
          );

        };


      item.appendChild(text);

      item.appendChild(button);

      list.appendChild(item);

    }
  );

}


/* =====================================================
   目的地削除
===================================================== */

function deleteDestination(){

  if(
    !confirm(
      "目的地を削除しますか？"
    )
  ){

    return;

  }


  if(destinationMarker){

    map.removeLayer(
      destinationMarker
    );

  }


  destination = null;

  destinationMarker = null;

  destinationATSUsed = false;


  /*
   * 目的地設定に戻す
   */

  mode =
    "destination";


  updateMode();

  updateRouteList();


  document.getElementById(
    "distanceBox"
  ).textContent =
    "🎯 新しい目的地を設定してください";

}


/* =====================================================
   経由地点削除
===================================================== */

function deleteViaPoint(
  index
){

  if(
    !confirm(
      "この経由地点を削除しますか？"
    )
  ){

    return;

  }


  if(viaMarkers[index]){

    map.removeLayer(
      viaMarkers[index]
    );

  }


  viaMarkers.splice(
    index,
    1
  );


  viaPoints.splice(
    index,
    1
  );


  viaATSUsed.splice(
    index,
    1
  );


  if(
    currentViaIndex > index
  ){

    currentViaIndex--;

  }


  if(
    currentViaIndex < 0
  ){

    currentViaIndex = 0;

  }


  if(
    currentViaIndex >= viaPoints.length
  ){

    currentViaIndex =
      viaPoints.length;

  }


  updateRouteList();

}


/* =====================================================
   地点一覧
===================================================== */

function toggleRoutePanel(){

  const panel =
    document.getElementById(
      "routePanel"
    );


  if(
    panel.style.display === "block"
  ){

    panel.style.display =
      "none";

  }else{

    panel.style.display =
      "block";

  }

}


/* =====================================================
   GPS
===================================================== */

function startGPS(){

  if(
    watchID !== null
  ){

    navigator.geolocation.clearWatch(
      watchID
    );

  }


  watchID =
    navigator.geolocation.watchPosition(

      function(position){

        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;


        /*
         * 速度
         */

        let speed =
          position.coords.speed;


        if(
          speed === null ||
          speed < 0
        ){

          speed = 0;

        }


        speed =
          speed * 3.6;


        currentSpeed =
          speed;


        document.getElementById(
          "speed"
        ).textContent =
          Math.round(speed);


        /*
         * 現在地
         */

        if(currentMarker){

          currentMarker.setLatLng(
            [lat,lng]
          );

        }


        /*
         * 追従
         */

        const follow =
          document.getElementById(
            "followSwitch"
          ).checked;


        if(
          follow &&
          map
        ){

          map.panTo(
            [lat,lng],
            {
              animate:true,
              duration:.5
            }
          );

        }


        /*
         * 現在地
         */

        const current =
          L.latLng(
            lat,
            lng
          );


        /* =================================================
           速度超過ATS
        ================================================= */

        if(
          speed > speedLimit
        ){

          document.getElementById(
            "overspeed"
          ).style.display =
            "block";


          if(
            !atsActive &&
            !overspeedATSUsed
          ){

            /*
             * 一回だけ
             */

            overspeedATSUsed = true;


            activateATS(
              "⚠️ 速度超過ATS",
              "overspeed"
            );

          }

        }else{

          document.getElementById(
            "overspeed"
          ).style.display =
            "none";

        }


        /*
         * 目的地なし
         */

        if(
          !destination
        ){

          /*
           * ATS解除後などに
           * キンコン停止条件を再確認
           */

          if(
            canStopBell()
          ){

            stopBell();

          }

          return;

        }


        /* =================================================
           経由地点
        ================================================= */

        if(
          currentViaIndex <
          viaPoints.length
        ){

          const via =
            viaPoints[
              currentViaIndex
            ];


          const distance =
            current.distanceTo(
              via
            );


          document.getElementById(
            "distanceBox"
          ).textContent =
            "📍 経由 " +
            (currentViaIndex + 1) +
            "まで " +
            Math.round(distance) +
            "m";


          /*
           * 30m以内
           *
           * まずキンコン停止
           */

          if(
            distance <= 30
          ){

            stopBell();

          }


          /*
           * 100m以内
           *
           * ATSは一回だけ
           */

          if(
            distance <= 100 &&
            !atsActive &&
            !viaATSUsed[currentViaIndex]
          ){

            viaATSUsed[currentViaIndex] =
              true;


            /*
             * 先に次の地点へ進める
             *
             * これが重要
             */

            const passedIndex =
              currentViaIndex;


            currentViaIndex++;


            updateRouteList();


            activateATS(
              "⚠️ 経由地点ATS",
              "via"
            );


            return;

          }


          /*
           * ATS解除後に30m以内なら
           * キンコンを鳴らさない
           */

          if(
            distance <= 30
          ){

            stopBell();

          }


          return;

        }


        /* =================================================
           目的地
        ================================================= */

        const distance =
          current.distanceTo(
            destination
          );


        document.getElementById(
          "distanceBox"
        ).textContent =
          "🎯 目的地まで " +
          Math.round(distance) +
          "m";


        /*
         * 30m以内
         *
         * キンコン停止
         */

        if(
          distance <= 30
        ){

          stopBell();

        }


        /*
         * 200m以内
         *
         * ATSは一回だけ
         */

        if(
          distance <= 200 &&
          !atsActive &&
          !destinationATSUsed
        ){

          /*
           * ここで一度だけ使用済みにする
           *
           * ATS解除後に同じ場所で
           * 再発動しなくなる
           */

          destinationATSUsed = true;


          activateATS(
            "🏁 目的地ATS",
            "destination"
          );


          return;

        }


        /*
         * ATS解除後に30m以内なら
         * キンコン停止
         */

        if(
          distance <= 30
        ){

          stopBell();

        }

      },


      function(){

        document.getElementById(
          "distanceBox"
        ).textContent =
          "📍 GPS取得失敗";

      },


      {
        enableHighAccuracy:true,
        maximumAge:1000,
        timeout:10000
      }

    );

}


/* =====================================================
   ATS作動
===================================================== */

function activateATS(
  message,
  type
){

  /*
   * すでにATS中なら無視
   */

  if(atsActive){

    return;

  }


  atsActive = true;

  atsType = type;

  atsSeconds = 60;


  /*
   * キンコン停止
   */

  stopBell();


  /*
   * 終了ボタン非表示
   */

  document.getElementById(
    "finishButton"
  ).style.display =
    "none";


  /*
   * ATS表示
   */

  document.getElementById(
    "ats"
  ).style.display =
    "block";


  document.getElementById(
    "atsText"
  ).textContent =
    message;


  document.getElementById(
    "atsTimer"
  ).textContent =
    "自動終了まで 60 秒";


  /*
   * 警報
   */

  startAlarm();


  /*
   * 振動
   */

  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      [300,200]
    );

  }


  /*
   * カウントダウン
   */

  clearInterval(
    atsCountdownTimer
  );


  atsCountdownTimer =
    setInterval(
      function(){

        if(!atsActive){

          return;

        }


        atsSeconds--;


        if(
          atsSeconds < 0
        ){

          atsSeconds = 0;

        }


        document.getElementById(
          "atsTimer"
        ).textContent =
          "自動終了まで " +
          atsSeconds +
          " 秒";


        if(
          atsSeconds <= 0
        ){

          releaseATS();

        }

      },
      1000
    );


  /*
   * 60秒強制終了
   */

  clearTimeout(
    atsTimer
  );


  atsTimer =
    setTimeout(
      function(){

        releaseATS();

      },
      60000
    );

}


/* =====================================================
   ATS解除
===================================================== */

function releaseATS(){

  /*
   * すでに解除済みなら何もしない
   */

  if(!atsActive){

    return;

  }


  atsActive = false;


  /*
   * タイマー停止
   */

  clearTimeout(
    atsTimer
  );

  clearInterval(
    atsCountdownTimer
  );


  atsTimer = null;

  atsCountdownTimer = null;


  /*
   * 警報停止
   */

  stopAlarm();


  /*
   * バイブ停止
   */

  if(
    navigator.vibrate
  ){

    navigator.vibrate(0);

  }


  /*
   * ATS画面を消す
   */

  document.getElementById(
    "ats"
  ).style.display =
    "none";


  /*
   * 終了ボタン復活
   */

  document.getElementById(
    "finishButton"
  ).style.display =
    "block";


  /*
   * ATS解除直後の処理
   *
   * 重要：
   * 到着地点30m以内なら
   * キンコンを絶対に鳴らさない
   */

  if(
    canStopBell()
  ){

    stopBell();

  }else{

    /*
     * 速度ATSの場合、
     * まだ制限速度-3を超えているなら
     * キンコン開始
     */

    startBell();

  }


  /*
   * ATS種類を解除
   *
   * ただし、解除直後の
   * canStopBell判定は終わっている
   */

  atsType = "";

}


/* =====================================================
   ATSスライド
===================================================== */

const sliderButton =
  document.getElementById(
    "sliderButton"
  );


sliderButton.addEventListener(
  "touchstart",
  function(e){

    if(!atsActive){

      return;

    }


    startX =
      e.touches[0].clientX;

  }
);


sliderButton.addEventListener(
  "touchmove",
  function(e){

    if(!atsActive){

      return;

    }


    const x =
      e.touches[0].clientX;


    sliderX =
      x - startX;


    if(
      sliderX < 0
    ){

      sliderX = 0;

    }


    const slider =
      sliderButton.parentElement;


    const max =
      slider.clientWidth -
      sliderButton.clientWidth -
      8;


    if(
      sliderX > max
    ){

      sliderX = max;

    }


    sliderButton.style.transform =
      "translateX(" +
      sliderX +
      "px)";

  }
);


sliderButton.addEventListener(
  "touchend",
  function(){

    if(!atsActive){

      return;

    }


    const slider =
      sliderButton.parentElement;


    const max =
      slider.clientWidth -
      sliderButton.clientWidth -
      8;


    if(
      sliderX >= max * 0.7
    ){

      releaseATS();

    }


    sliderButton.style.transform =
      "translateX(0)";

    sliderX = 0;

  }
);


/* =====================================================
   運転終了
===================================================== */

function finishDrive(){

  if(
    atsActive
  ){

    return;

  }


  if(
    !confirm(
      "運転を終了しますか？"
    )
  ){

    return;

  }


  /*
   * 音停止
   */

  stopAlarm();

  stopBell();


  /*
   * タイマー停止
   */

  clearTimeout(
    atsTimer
  );

  clearInterval(
    atsCountdownTimer
  );


  atsTimer = null;

  atsCountdownTimer = null;


  /*
   * GPS停止
   */

  if(
    watchID !== null
  ){

    navigator.geolocation.clearWatch(
      watchID
    );

    watchID = null;

  }


  /*
   * 経由地点削除
   */

  viaMarkers.forEach(
    function(marker){

      if(map){

        map.removeLayer(
          marker
        );

      }

    }
  );


  /*
   * 目的地削除
   */

  if(
    destinationMarker &&
    map
  ){

    map.removeLayer(
      destinationMarker
    );

  }


  /*
   * 現在地削除
   */

  if(
    currentMarker &&
    map
  ){

    map.removeLayer(
      currentMarker
    );

  }


  /*
   * 初期化
   */

  destination = null;

  destinationMarker = null;

  viaPoints = [];

  viaMarkers = [];

  viaATSUsed = [];

  currentViaIndex = 0;

  destinationATSUsed = false;

  overspeedATSUsed = false;

  atsActive = false;

  atsType = "";

  mode = "destination";

  currentSpeed = 0;

  currentMarker = null;


  /*
   * 画面
   */

  document.getElementById(
    "drive"
  ).style.display =
    "none";


  document.getElementById(
    "setup"
  ).style.display =
    "block";


  /*
   * パネル
   */

  document.getElementById(
    "routePanel"
  ).style.display =
    "none";


  /*
   * 速度
   */

  document.getElementById(
    "speed"
  ).textContent =
    "0";


  /*
   * 速度超過
   */

  document.getElementById(
    "overspeed"
  ).style.display =
    "none";


  /*
   * ATS
   */

  document.getElementById(
    "ats"
  ).style.display =
    "none";


  /*
   * ATSスライダー
   */

  sliderButton.style.transform =
    "translateX(0)";

  sliderX = 0;


  /*
   * モード
   */

  updateMode();

}

</script>
