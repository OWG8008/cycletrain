<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
viewport-fit=cover">

<title>Train Destination</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#050505;
    color:white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
}

body{
    overflow-x:hidden;
}


/* =========================================
   LIQUID GLASS
========================================= */

.glass{
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.13),
            rgba(255,255,255,.045)
        );

    border:1px solid rgba(255,255,255,.12);

    box-shadow:
        0 18px 50px rgba(0,0,0,.38),
        inset 0 1px 0 rgba(255,255,255,.15),
        inset 0 -1px 0 rgba(255,255,255,.02);

    backdrop-filter:
        blur(30px)
        saturate(165%);

    -webkit-backdrop-filter:
        blur(30px)
        saturate(165%);
}


/* =========================================
   APP
========================================= */

.app{
    width:100%;
    max-width:720px;
    margin:auto;

    padding:
        calc(12px + env(safe-area-inset-top))
        12px
        calc(30px + env(safe-area-inset-bottom))
        12px;
}


/* =========================================
   SETUP
========================================= */

#setup{
    min-height:
        calc(
            100vh -
            env(safe-area-inset-top) -
            env(safe-area-inset-bottom)
        );

    display:flex;
    align-items:center;
}

.setup-card{
    width:100%;
    padding:24px;
    border-radius:30px;
}

.setup-small{
    font-size:13px;
    color:rgba(255,255,255,.4);
    margin-bottom:6px;
}

.setup-title{
    font-size:31px;
    font-weight:760;
    letter-spacing:-1.5px;
    margin-bottom:22px;
}

.train-buttons{
    display:grid;
    gap:10px;
}

.train-button{
    width:100%;
    border:0;
    border-radius:18px;
    padding:17px;

    background:rgba(255,255,255,.075);
    color:white;

    font-size:16px;
    font-weight:650;
    text-align:left;
}

.train-button.active{
    background:white;
    color:black;
}

.option-area{
    display:none;
    margin-top:18px;
}

.option-area.show{
    display:block;
}

.option-label{
    font-size:13px;
    color:rgba(255,255,255,.4);
    margin-bottom:8px;
}

select,
input{
    width:100%;
    border:0;
    outline:0;

    border-radius:17px;

    padding:16px;

    background:rgba(255,255,255,.09);
    color:white;

    font-size:17px;
    font-weight:600;
}

select option{
    background:#151515;
    color:white;
}

input::placeholder{
    color:rgba(255,255,255,.3);
}

.start-button{
    width:100%;
    margin-top:16px;

    border:0;
    border-radius:19px;

    padding:17px;

    background:white;
    color:black;

    font-size:17px;
    font-weight:700;
}


/* =========================================
   MAIN
========================================= */

#main{
    display:none;
}

.header{
    padding:21px;
    border-radius:27px;
    margin-bottom:13px;
}

.train-name{
    font-size:15px;
    color:rgba(255,255,255,.45);
    margin-bottom:5px;
}

.destination{
    font-size:31px;
    font-weight:760;
    letter-spacing:-1.5px;
}


/* =========================================
   NEXT STATIONS
========================================= */

.next-card{
    padding:20px;
    border-radius:27px;
    margin-bottom:13px;
}

.next-label{
    font-size:13px;
    color:rgba(255,255,255,.4);
    margin-bottom:15px;
}

.station-route{
    display:flex;
    align-items:center;
    justify-content:flex-start;

    gap:8px;

    overflow:hidden;
}

.route-station{
    font-size:17px;
    font-weight:700;

    white-space:nowrap;
    flex-shrink:0;
}

.route-arrow{
    font-size:16px;
    color:rgba(255,255,255,.35);
    flex-shrink:0;
}


/* =========================================
   SPEED
========================================= */

.speed-card{
    padding:23px;
    border-radius:27px;
    margin-bottom:13px;
}

.speed-label{
    font-size:14px;
    color:rgba(255,255,255,.4);
    margin-bottom:6px;
}

.speed-row{
    display:flex;
    align-items:baseline;
}

.speed{
    font-size:75px;
    line-height:.95;
    font-weight:760;
    letter-spacing:-5px;
    font-variant-numeric:tabular-nums;
}

.speed-unit{
    margin-left:9px;
    font-size:19px;
    color:rgba(255,255,255,.45);
}


/* =========================================
   POSITION
========================================= */

.position-card{
    padding:23px;
    border-radius:27px;
    margin-bottom:13px;
}

.position-label{
    font-size:14px;
    color:rgba(255,255,255,.4);
    margin-bottom:15px;
}

.station-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:13px;
}

.station-from,
.station-to{
    font-size:19px;
    font-weight:700;
}

.station-to{
    text-align:right;
}

.progress{
    width:100%;
    height:19px;
    border-radius:999px;
    overflow:hidden;
    background:rgba(255,255,255,.1);
}

.progress-fill{
    width:0%;
    height:100%;
    border-radius:999px;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.4),
            rgba(255,255,255,1)
        );

    transition:width .7s linear;
}

.distance{
    margin-top:14px;
    text-align:right;

    font-size:15px;
    color:rgba(255,255,255,.6);
}


/* =========================================
   GPS
========================================= */

.gps-card{
    padding:19px;
    border-radius:27px;
}

.gps-status{
    text-align:center;

    font-size:13px;

    color:rgba(255,255,255,.38);

    margin-bottom:12px;
}

.gps-button{
    width:100%;

    border:0;
    border-radius:17px;

    padding:15px;

    background:rgba(255,255,255,.09);
    color:white;

    font-size:15px;
    font-weight:650;
}


/* =========================================
   TEST MODE
========================================= */

#testBadge{
    display:none;

    position:fixed;

    top:
        calc(
            10px +
            env(safe-area-inset-top)
        );

    right:12px;

    z-index:10000;

    padding:8px 12px;

    border-radius:999px;

    background:rgba(255,255,255,.14);

    border:1px solid rgba(255,255,255,.1);

    backdrop-filter:blur(20px);

    font-size:12px;
    font-weight:700;
}

#testPanel{
    display:none;

    position:fixed;

    left:12px;
    right:12px;

    bottom:
        calc(
            12px +
            env(safe-area-inset-bottom)
        );

    z-index:9999;

    padding:15px;

    border-radius:25px;
}

.test-title{
    font-size:13px;
    color:rgba(255,255,255,.4);
    margin-bottom:8px;
}

.test-current{
    font-size:19px;
    font-weight:750;
    margin-bottom:12px;
}

.test-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.test-button{
    border:0;
    border-radius:15px;

    padding:14px;

    background:rgba(255,255,255,.1);
    color:white;

    font-size:15px;
    font-weight:650;
}

.test-button.next{
    background:white;
    color:black;
}

</style>
</head>

<div class="progress">

<div

</div>


<div class="gps-card glass">

<button

</div>

</section>

</div>


<!-- TEST -->

<div id="testBadge">
TEST MODE

<div

テストモード

</div>

</div>

/* =====================================================
   VARIABLES
===================================================== */

let selectedType=null;

let gpsRoute=[];

let displayStops=[];

let currentGpsIndex=0;

let currentDisplayIndex=0;

let watchId=null;

let testMode=false;

let tapTimes=[];

let speedHistory=[];


/* =====================================================
   列車選択
===================================================== */

function selectType(type){

    selectedType=type;

    document
    .querySelectorAll(".train-button")
    .forEach(
        e=>e.classList.remove("active")
    );

    const id =
        type==="normal"
        ?"normalButton"
        :type==="sonic"
        ?"sonicButton"
        :"yufuButton";

    document
    .getElementById(id)
    .classList.add("active");


    document
    .querySelectorAll(".option-area")
    .forEach(
        e=>e.classList.remove("show")
    );


    document
    .getElementById(
        type==="normal"
        ?"normalOptions"
        :type==="sonic"
        ?"sonicOptions"
        :"yufuOptions"
    )
    .classList.add("show");
}


/* =====================================================
   ソニック判定
===================================================== */

function getSonicData(number){

    /*
       41号だけ特別。
    */

    if(number===41){

        return {

            name:"特急ソニック 41号",

            destination:"佐伯",

            gps:[...sonic41GPS],

            stops:[...sonic41Stops]

        };

    }


    /*
       基本方向
    */

    if(number%2===0){

        return {

            name:
                "特急ソニック "
                +number
                +"号",

            destination:"博多",

            gps:[
                ...sonicOitaToHakataGPS
            ],

            stops:[
                ...sonicOitaToHakataStops
            ]

        };

    }


    return {

        name:
            "特急ソニック "
            +number
            +"号",

        destination:"大分",

        gps:[
            ...sonicHakataToOitaGPS
        ],

        stops:[
            ...sonicHakataToOitaStops
        ]

    };

}


/* =====================================================
   START
===================================================== */

function startTrain(){

    if(!selectedType){

        alert(
            "列車を選択してください"
        );

        return;
    }


    let trainName="";

    let destination="";


    /* =========================
       普通
    ========================= */

    if(selectedType==="normal"){

        const route=
            document
            .getElementById(
                "normalRoute"
            )
            .value;


        if(route==="nippou"){

            gpsRoute=[
                ...nippouFull
            ];

            displayStops=[
                ...nippouStops
            ];

            trainName="普通列車";

            destination="幸崎";

        }


        if(route==="kyudai"){

            gpsRoute=[
                ...kyudaiFull
            ];

            displayStops=[
                ...kyudaiStops
            ];

            trainName="普通列車";

            destination="日田";

        }


        if(route==="houhi"){

            gpsRoute=[
                ...houhiFull
            ];

            displayStops=[
                ...houhiStops
            ];

            trainName="普通列車";

            destination="宮地";

        }

    }


    /* =========================
       ソニック
    ========================= */

    if(selectedType==="sonic"){

        const number=
            Number(
                document
                .getElementById(
                    "sonicNumber"
                )
                .value
            );


        if(!number){

            alert(
                "ソニックの号数を入力してください"
            );

            return;
        }


        const data=
            getSonicData(number);


        gpsRoute=[
            ...data.gps
        ];

        displayStops=[
            ...data.stops
        ];

        trainName=data.name;

        destination=
            data.destination;

    }


    /* =========================
       ゆふ森
    ========================= */

    if(selectedType==="yufu"){

        const number=
            Number(
                document
                .getElementById(
                    "yufuNumber"
                )
                .value
            );


        if(!yufuRoutes[number]){

            alert(
                "この号数は登録されていません"
            );

            return;
        }


        gpsRoute=[
            ...yufuRoutes[number].gps
        ];

        displayStops=[
            ...yufuRoutes[number].stops
        ];

        trainName=
            "特急ゆふいんの森 "
            +number
            +"号";

        destination=
            yufuRoutes[number]
            .destination;

    }


    currentGpsIndex=0;

    currentDisplayIndex=0;

    speedHistory=[];


    document
    .getElementById(
        "trainName"
    )
    .textContent=
        trainName;


    document
    .getElementById(
        "destination"
    )
    .textContent=
        destination+
        "行き";


    document
    .getElementById(
        "setup"
    )
    .style.display=
        "none";


    document
    .getElementById(
        "main"
    ).style.display=
        "block";


    updateDisplay();

}


/* =====================================================
   距離
===================================================== */

function getDistance(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R=6371000;

    const rad=Math.PI/180;

    const dLat=
        (lat2-lat1)*rad;

    const dLon=
        (lon2-lon1)*rad;

    const a=
        Math.sin(dLat/2)**2+

        Math.cos(lat1*rad)*
        Math.cos(lat2*rad)*
        Math.sin(dLon/2)**2;

    return 2*R*
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );

}


/* =====================================================
   表示更新
===================================================== */

function updateDisplay(){

    /*
       GPS上の現在区間
    */

    const from=
        gpsRoute[
            currentGpsIndex
        ];

    const to=
        gpsRoute[
            currentGpsIndex+1
        ];


    document
    .getElementById(
        "fromStation"
    )
    .textContent=
        from||"";


    document
    .getElementById(
        "toStation"
    )
    .textContent=
        to||"";


    /*
       画面に出す駅は
       displayStopsだけ。

       これによって

       中津
       東中津
       今津
       天津

       のような通過駅は
       ソニック画面には出ない。
    */

    const route=
        document
        .getElementById(
            "stationRoute"
        );

    route.innerHTML="";


    /*
       現在のGPS位置に
       一番近い「停車駅」を探す
    */

    let nearestStop=0;

    let nearestDistance=
        Infinity;


    const currentName=
        gpsRoute[
            currentGpsIndex
        ];


    const currentCoord=
        stationCoords[
            currentName
        ];


    if(currentCoord){

        displayStops.forEach(
            (name,index)=>{

                const coord=
                    stationCoords[
                        name
                    ];

                if(!coord)return;


                const d=
                    getDistance(
                        currentCoord[0],
                        currentCoord[1],
                        coord[0],
                        coord[1]
                    );


                if(d<nearestDistance){

                    nearestDistance=d;

                    nearestStop=index;

                }

            }
        );

    }


    /*
       GPS区間から
       現在位置より先の停車駅を探す
    */

    let start=nearestStop;


    const gpsIndex=
        gpsRoute.indexOf(
            displayStops[
                nearestStop
            ]
        );


    if(
        gpsIndex>=0 &&
        gpsIndex<currentGpsIndex
    ){

        start=
            Math.min(
                nearestStop+1,
                displayStops.length-1
            );

    }


    /*
       次の4駅だけ
    */

    const end=
        Math.min(
            start+4,
            displayStops.length
        );


    for(
        let i=start;
        i<end;
        i++
    ){

        const station=
            document.createElement(
                "div"
            );

        station.className=
            "route-station";

        station.textContent=
            displayStops[i];


        route.appendChild(
            station
        );


        /*
           最後には矢印を付けない
        */

        if(i<end-1){

            const arrow=
                document.createElement(
                    "div"
                );

            arrow.className=
                "route-arrow";

            arrow.textContent="＞";

            route.appendChild(
                arrow
            );

        }

    }


    if(!to){

        showArrival();

    }

}


/* =====================================================
   GPS
===================================================== */

function startGPS(){

    if(testMode)return;


    if(!navigator.geolocation){

        setStatus(
            "この端末ではGPSを利用できません"
        );

        return;
    }


    if(watchId!==null)return;


    setStatus(
        "GPS取得中..."
    );


    watchId=
        navigator.geolocation
        .watchPosition(

            updateGPS,

            gpsError,

            {

                enableHighAccuracy:true,

                maximumAge:1000,

                timeout:15000

            }

        );

}


/* =====================================================
   GPS UPDATE
===================================================== */

function updateGPS(position){

    if(testMode)return;


    const lat=
        position.coords.latitude;

    const lon=
        position.coords.longitude;


    let speed=
        position.coords.speed;


    if(
        speed===null||
        speed===undefined||
        isNaN(speed)||
        speed<0
    ){

        speed=0;

    }else{

        speed*=3.6;

    }


    /*
       異常値除去
    */

    if(speed>250){

        speed=0;

    }


    speedHistory.push(speed);


    if(speedHistory.length>5){

        speedHistory.shift();

    }


    const averageSpeed=
        speedHistory.reduce(
            (a,b)=>a+b,
            0
        )/
        speedHistory.length;


    document
    .getElementById(
        "speed"
    )
    .textContent=
        Math.round(
            averageSpeed
        );


    if(
        currentGpsIndex>=
        gpsRoute.length-1
    ){

        showArrival();

        return;
    }


    const from=
        gpsRoute[
            currentGpsIndex
        ];

    const to=
        gpsRoute[
            currentGpsIndex+1
        ];


    const fromCoord=
        stationCoords[from];

    const toCoord=
        stationCoords[to];


    if(
        !fromCoord||
        !toCoord
    ){

        setStatus(
            "座標未登録: "+to
        );

        return;
    }


    const total=
        getDistance(
            fromCoord[0],
            fromCoord[1],
            toCoord[0],
            toCoord[1]
        );


    const remaining=
        getDistance(
            lat,
            lon,
            toCoord[0],
            toCoord[1]
        );


    let progress=
        1-
        remaining/
        total;


    progress=
        Math.max(
            0,
            Math.min(
                1,
                progress
            )
        );


    document
    .getElementById(
        "progressFill"
    )
    .style.width=
        progress*100+
        "%";


    document
    .getElementById(
        "distance"
    )
    .textContent=

        remaining<=100

        ?to+" まもなく"

        :to+
        "まであと "+
        (
            remaining/1000
        ).toFixed(1)+
        " km";


    /*
       ★重要★

       ここでGPSの全駅を進める。

       ソニックが

       中津
       ↓
       東中津
       ↓
       今津
       ↓
       天津
       ↓
       豊前善光寺

       と進んでいく。

       ただし画面表示は
       停車駅だけ。
    */

    if(
        remaining<=250 &&
        averageSpeed<=30
    ){

        currentGpsIndex++;

        updateDisplay();

    }


    setStatus(
        "GPS接続中"
    );

}


/* =====================================================
   ARRIVAL
===================================================== */

function showArrival(){

    document
    .getElementById(
        "speed"
    )
    .textContent="0";


    document
    .getElementById(
        "fromStation"
    )
    .textContent=
        gpsRoute[
            gpsRoute.length-1
        ];


    document
    .getElementById(
        "toStation"
    )
    .textContent="";


    document
    .getElementById(
        "progressFill"
    )
    .style.width="100%";


    document
    .getElementById(
        "distance"
    )
    .textContent=
        "到着";


    setStatus(
        "終点に到着しました"
    );

}


/* =====================================================
   GPS ERROR
===================================================== */

function gpsError(error){

    let message=
        "GPSを取得できません";


    if(error.code===1){

        message=
            "位置情報の使用を許可してください";

    }

    if(error.code===2){

        message=
            "現在地を取得できません";

    }

    if(error.code===3){

        message=
            "GPS取得がタイムアウトしました";

    }


    setStatus(message);

}


/* =====================================================
   STATUS
===================================================== */

function setStatus(text){

    document
    .getElementById(
        "gpsStatus"
    )
    .textContent=text;

}


/* =====================================================
   3連続タッチ
===================================================== */

document.addEventListener(
    "touchend",
    registerTap,
    {passive:true}
);


function registerTap(){

    const now=Date.now();


    tapTimes.push(now);


    tapTimes=
        tapTimes.filter(
            t=>now-t<=700
        );


    if(tapTimes.length>=3){

        tapTimes=[];

        toggleTestMode();

    }

}


/* =====================================================
   TEST MODE
===================================================== */

function toggleTestMode(){

    if(
        document
        .getElementById(
            "main"
        )
        .style.display!=="block"
    ){

        return;

    }


    testMode=!testMode;


    const panel=
        document.getElementById(
            "testPanel"
        );

    const badge=
        document.getElementById(
            "testBadge"
        );


    if(testMode){

        if(watchId!==null){

            navigator.geolocation
            .clearWatch(
                watchId
            );

            watchId=null;

        }


        panel.style.display="block";

        badge.style.display="block";

        setStatus(
            "テストモード"
        );


        updateTestPanel();

    }else{

        panel.style.display="none";

        badge.style.display="none";

        setStatus(
            "GPSを待っています"
        );

    }

}


/* =====================================================
   TEST NEXT
===================================================== */

function testNext(){

    if(!testMode)return;


    if(
        currentGpsIndex<
        gpsRoute.length-1
    ){

        currentGpsIndex++;

        updateDisplay();

        updateTestPanel();

    }

}


/* =====================================================
   TEST PREVIOUS
===================================================== */

function testPrevious(){

    if(!testMode)return;


    if(currentGpsIndex>0){

        currentGpsIndex--;

        updateDisplay();

        updateTestPanel();

    }

}


/* =====================================================
   TEST PANEL
===================================================== */

function updateTestPanel(){

    const current=
        gpsRoute[
            currentGpsIndex
        ];

    const next=
        gpsRoute[
            currentGpsIndex+1
        ];


    document
    .getElementById(
        "testCurrent"
    )
    .textContent=

        next

        ?current+
         " → "+
         next

        :current+
         "（終点）";


    if(next){

        document
        .getElementById(
            "progressFill"
        )
        .style.width="50%";

        document
        .getElementById(
            "distance"
        )
        .textContent=
            "テストモード";

    }else{

        document
        .getElementById(
            "progressFill"
        )
        .style.width="100%";

        document
        .getElementById(
            "distance"
        )
        .textContent=
            "到着";

    }

}
