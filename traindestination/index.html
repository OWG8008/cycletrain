<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no,
             viewport-fit=cover"
>

<meta name="theme-color" content="#08090b">

<title>Train Destination</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;

    color: white;
}


/* =========================================================
   BACKGROUND
========================================================= */

body {

    background:

        radial-gradient(
            circle at 10% 0%,
            rgba(255,255,255,.22),
            transparent 30%
        ),

        radial-gradient(
            circle at 100% 15%,
            rgba(100,160,255,.20),
            transparent 34%
        ),

        radial-gradient(
            circle at 50% 100%,
            rgba(255,255,255,.13),
            transparent 40%
        ),

        linear-gradient(
            145deg,
            #07080a 0%,
            #15171b 45%,
            #08090b 100%
        );

}


/* =========================================================
   APP
========================================================= */

.app {

    width: 100%;
    height: 100dvh;

    padding:
        calc(6px + env(safe-area-inset-top))
        8px
        calc(6px + env(safe-area-inset-bottom));

    display: flex;

    flex-direction: column;

    gap: 6px;

}


/* =========================================================
   LIQUID GLASS
========================================================= */

.glass {

    position: relative;

    overflow: hidden;

    background:

        linear-gradient(
            135deg,
            rgba(255,255,255,.23),
            rgba(255,255,255,.09) 45%,
            rgba(255,255,255,.045)
        );

    border:

        1px solid
        rgba(255,255,255,.28);

    box-shadow:

        inset
        0 1px 0
        rgba(255,255,255,.38),

        inset
        0 -1px 0
        rgba(255,255,255,.07),

        0 8px 30px
        rgba(0,0,0,.24);

    backdrop-filter:

        blur(32px)
        saturate(180%)
        brightness(1.12);

    -webkit-backdrop-filter:

        blur(32px)
        saturate(180%)
        brightness(1.12);

}


/*
   ガラスの反射
*/

.glass::before {

    content: "";

    position: absolute;

    left: -30%;
    top: -65%;

    width: 160%;
    height: 100%;

    background:

        linear-gradient(
            115deg,
            transparent 35%,
            rgba(255,255,255,.18) 50%,
            transparent 65%
        );

    transform:
        rotate(-7deg);

    pointer-events: none;

}


/* =========================================================
   HEADER
========================================================= */

.header {

    flex: 0 0 auto;

    min-height: 70px;

    padding:
        10px
        15px;

    border-radius: 24px;

}

.train-type {

    position: relative;

    z-index: 1;

    font-size: 11px;

    color:
        rgba(255,255,255,.65);

}

.destination {

    position: relative;

    z-index: 1;

    margin-top: 2px;

    font-size: 27px;

    line-height: 1;

    font-weight: 780;

    letter-spacing: -1.2px;

}


/* =========================================================
   SPEED
========================================================= */

.speed-card {

    flex: 0 0 auto;

    min-height: 100px;

    padding:
        10px
        15px;

    border-radius: 24px;

}

.label {

    position: relative;

    z-index: 1;

    font-size: 11px;

    color:
        rgba(255,255,255,.58);

}

.speed-row {

    position: relative;

    z-index: 1;

    display: flex;

    align-items: baseline;

}

.speed {

    font-size: 57px;

    line-height: .88;

    font-weight: 780;

    letter-spacing: -4px;

    font-variant-numeric:
        tabular-nums;

}

.unit {

    margin-left: 7px;

    font-size: 14px;

    color:
        rgba(255,255,255,.58);

}


/* =========================================================
   POSITION
========================================================= */

.position-card {

    flex: 0 0 auto;

    min-height: 130px;

    padding:
        12px
        15px;

    border-radius: 24px;

}

.station-row {

    position: relative;

    z-index: 1;

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 8px;

}

.station {

    font-size: 17px;

    font-weight: 750;

    white-space: nowrap;

}

.station.right {

    text-align: right;

}


/* =========================================================
   PROGRESS
========================================================= */

.progress {

    position: relative;

    z-index: 1;

    width: 100%;

    height: 22px;

    margin-top: 12px;

    border-radius: 999px;

    overflow: hidden;

    background:

        rgba(255,255,255,.11);

    border:

        1px solid
        rgba(255,255,255,.17);

    box-shadow:

        inset
        0 1px 4px
        rgba(0,0,0,.18);

}

.progress-fill {

    position: absolute;

    left: 0;
    top: 0;

    width: 0%;

    height: 100%;

    border-radius: 999px;

    background:

        linear-gradient(
            90deg,
            rgba(255,255,255,.52),
            rgba(255,255,255,.98)
        );

    box-shadow:

        0 0 16px
        rgba(255,255,255,.45);

    transition:

        width .35s ease-out;

}

.distance {

    position: relative;

    z-index: 1;

    margin-top: 7px;

    text-align: right;

    font-size: 12px;

    color:
        rgba(255,255,255,.68);

    font-variant-numeric:
        tabular-nums;

}


/* =========================================================
   SECTION
========================================================= */

.section-card {

    flex: 0 0 auto;

    min-height: 82px;

    padding:
        10px
        15px;

    border-radius: 24px;

}

.section-title {

    position: relative;

    z-index: 1;

    font-size: 10px;

    color:
        rgba(255,255,255,.50);

}

.section-name {

    position: relative;

    z-index: 1;

    margin-top: 2px;

    font-size: 20px;

    line-height: 1.05;

    font-weight: 760;

    letter-spacing: -.5px;

}

.next {

    position: relative;

    z-index: 1;

    margin-top: 4px;

    font-size: 12px;

    color:
        rgba(255,255,255,.60);

}


/* =========================================================
   GPS
========================================================= */

.gps-card {

    flex: 0 0 auto;

    min-height: 38px;

    padding:
        8px
        13px;

    border-radius: 19px;

    display: flex;

    justify-content: space-between;

    align-items: center;

}

.gps-left {

    position: relative;

    z-index: 1;

    display: flex;

    align-items: center;

    gap: 7px;

}

.gps-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.30);

}

.gps-dot.active {

    background: white;

    box-shadow:
        0 0 12px
        rgba(255,255,255,.95);

}

.gps-text {

    font-size: 11px;

    color:
        rgba(255,255,255,.68);

}

.accuracy {

    position: relative;

    z-index: 1;

    font-size: 10px;

    color:
        rgba(255,255,255,.45);

}


/* =========================================================
   GPS BUTTON
========================================================= */

.gps-button {

    position: relative;

    flex: 0 0 auto;

    width: 100%;

    min-height: 40px;

    border: 0;

    border-radius: 20px;

    color: #111;

    font-size: 14px;

    font-weight: 700;

    background:

        linear-gradient(
            180deg,
            rgba(255,255,255,.98),
            rgba(255,255,255,.72)
        );

    box-shadow:

        0 7px 25px
        rgba(0,0,0,.28);

}

.gps-button:active {

    transform:
        scale(.985);

}


/* =========================================================
   ARRIVAL
========================================================= */

.arrival {

    display: none;

    padding: 13px;

    border-radius: 24px;

    text-align: center;

}

.arrival.show {

    display: block;

}

.arrival-title {

    font-size: 10px;

    color:
        rgba(255,255,255,.52);

}

.arrival-name {

    margin-top: 2px;

    font-size: 27px;

    font-weight: 780;

}


/* =========================================================
   iPHONE 13 PRO
   390 × 844
========================================================= */

@media (
    max-width: 430px
) {

    .app {

        gap: 5px;

        padding:
            calc(5px + env(safe-area-inset-top))
            7px
            calc(5px + env(safe-area-inset-bottom));

    }

    .header {

        min-height: 65px;

        padding:
            9px
            14px;

    }

    .destination {

        font-size: 25px;

    }

    .speed-card {

        min-height: 91px;

        padding:
            8px
            14px;

    }

    .speed {

        font-size: 53px;

    }

    .position-card {

        min-height: 121px;

        padding:
            10px
            14px;

    }

    .section-card {

        min-height: 76px;

        padding:
            9px
            14px;

    }

}


/* =========================================================
   SHORT HEIGHT
========================================================= */

@media (
    max-height: 760px
) {

    .header {

        min-height: 58px;

    }

    .speed-card {

        min-height: 78px;

    }

    .speed {

        font-size: 46px;

    }

    .position-card {

        min-height: 108px;

    }

    .progress {

        height: 18px;

        margin-top: 8px;

    }

    .section-card {

        min-height: 68px;

    }

}

</style>

</head>


<body>


<div class="app">


    <!-- =========================================
         HEADER
    ========================================== -->

    <div class="header glass">

        <div class="train-type">
            普通列車
        </div>

        <div class="destination">
            行橋行
        </div>

    </div>


    <!-- =========================================
         SPEED
    ========================================== -->

    <div class="speed-card glass">

        <div class="label">

        </div>

        <div class="speed-row">

            <span
                id="speed"
                class="speed"
            >

            </span>

            </span>

        </div>

    </div>


    <!-- =========================================

    ========================================== -->

    <div class="position-card glass">

        <div class="label">

        </div>

        <div class="station-row">

            <div
                id="fromStation"
                class="station"
            >
                豊前善光寺
            </div>

            <div
                id="toStation"
                class="station right"
            >
                天津
            </div>

        </div>


        <div class="progress">

            <div
                id="progressFill"
                class="progress-fill"
            ></div>

        </div>


        <div
            id="distance"
            class="distance"
        >

        </div>

    </div>


    <!-- =========================================
         SECTION
    ========================================== -->

    <div class="section-card glass">

        <div class="section-title">
            現在走行区間
        </div>

        <div
            id="sectionName"
            class="section-name"
        >
            豊前善光寺 → 天津
        </div>

        <div
            id="next"
            class="next"
        >
            次は「天津」です
        </div>

    </div>


    <!-- =========================================
         GPS
    ========================================== -->

    <div class="gps-card glass">

        <div class="gps-left">

            <div
                id="gpsDot"
                class="gps-dot"
            ></div>

            <div
                id="gpsText"
                class="gps-text"
            >
                GPS待機中
            </div>

        </div>

        <div
            id="accuracy"
            class="accuracy"
        >

        </div>

    </div>


    <button
        class="gps-button"

    >
        GPSを開始
    </button>


    <!-- =========================================
         ARRIVAL
    ========================================== -->

    <div
        id="arrival"
        class="arrival glass"
    >

        <div class="arrival-title">
            終点到着
        </div>

        <div class="arrival-name">
            行橋
        </div>

    </div>


</div>



<script>

/* =========================================================
   駅データ
   豊前善光寺 → 行橋
========================================================= */

const stations = [

    {
        name: "豊前善光寺",
        lat: 33.5664462,
        lon: 131.3229872
    },

    {
        name: "天津",
        lat: 33.5646518,
        lon: 131.2931969
    },

    {
        name: "今津",
        lat: 33.5719364,
        lon: 131.2676687
    },

    {
        name: "東中津",
        lat: 33.5876661,
        lon: 131.2389301
    },

    {
        name: "中津",
        lat: 33.598966,
        lon: 131.190859
    },

    {
        name: "吉富",
        lat: 33.604756979,
        lon: 131.173684001
    },

    {
        name: "三毛門",
        lat: 33.6147369,
        lon: 131.1553124
    },

    {
        name: "宇島",
        lat: 33.621308934,
        lon: 131.126125753
    },

    {
        name: "豊前松江",
        lat: 33.6224544,
        lon: 131.0952661
    },

    {
        name: "椎田",
        lat: 33.6534281,
        lon: 131.0578436
    },

    {
        name: "築城",
        lat: 33.6731005,
        lon: 131.0378479
    },

    {
        name: "新田原",
        lat: 33.694775883,
        lon: 131.008776426
    },

    {
        name: "南行橋",
        lat: 33.7162864,
        lon: 130.9811458
    },

    {
        name: "行橋",
        lat: 33.7287286,
        lon: 130.9709038
    }

];


/* =========================================================
   GPS SETTINGS
========================================================= */


/*
   現在の駅間

   0 = 豊前善光寺 → 天津
   1 = 天津 → 今津
   ...
*/

let currentSection = 0;


/*
   GPS監視ID
*/

let watchId = null;


/*
   前回GPS
*/

let lastGPS = null;


/*
   最高許容GPS誤差
*/

const MAX_ACCURACY = 80;


/*
   駅到着判定
*/

const ARRIVAL_RADIUS = 130;


/*
   駅間を飛ばすための条件

   GPSがかなり先に飛んだ場合でも
   ある程度信頼できるときだけ更新。
*/

const SKIP_RADIUS = 220;


/* =========================================================
   DISTANCE
========================================================= */

function distance(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R = 6371000;

    const p =
        Math.PI / 180;

    const dLat =
        (lat2 - lat1) * p;

    const dLon =
        (lon2 - lon1) * p;


    const a =

        Math.sin(dLat / 2) ** 2 +

        Math.cos(lat1 * p) *
        Math.cos(lat2 * p) *

        Math.sin(dLon / 2) ** 2;


    const c =

        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );


    return R * c;

}


/* =========================================================
   GPS POSITION → LOCAL XY
========================================================= */

function toXY(
    lat,
    lon,
    baseLat,
    baseLon
) {

    const R = 6371000;

    const rad =
        Math.PI / 180;


    return {

        x:
            (
                lon -
                baseLon
            ) *
            rad *
            R *
            Math.cos(
                baseLat * rad
            ),

        y:
            (
                lat -
                baseLat
            ) *
            rad *
            R

    };

}


/* =========================================================
   POINT → SEGMENT
=========================================================

   現在地を

   駅A -------- 駅B

   の線分に投影する。

   これによって、

   GPSが線路から多少ズレても

   「どれくらい進んだか」

   を計算できる。
========================================================= */

function projectToSegment(
    lat,
    lon,
    a,
    b
) {

    const p =
        toXY(
            lat,
            lon,
            a.lat,
            a.lon
        );


    const q =
        toXY(
            b.lat,
            b.lon,
            a.lat,
            a.lon
        );


    const len2 =
        q.x * q.x +
        q.y * q.y;


    if (
        len2 === 0
    ) {

        return {

            t: 0,

            distance: Math.sqrt(
                p.x * p.x +
                p.y * p.y
            )

        };

    }


    let t =

        (
            p.x * q.x +
            p.y * q.y
        ) /
        len2;


    t =
        Math.max(
            0,
            Math.min(
                1,
                t
            )
        );


    const px =
        p.x -
        q.x * t;


    const py =
        p.y -
        q.y * t;


    return {

        t: t,

        distance:
            Math.sqrt(
                px * px +
                py * py
            )

    };

}


/* =========================================================
   FIND BEST SECTION
========================================================= */

function findBestSection(
    lat,
    lon
) {

    let best = null;


    for (
        let i = 0;
        i < stations.length - 1;
        i++
    ) {

        const a =
            stations[i];

        const b =
            stations[i + 1];


        const result =
            projectToSegment(
                lat,
                lon,
                a,
                b
            );


        if (
            !best ||
            result.distance <
            best.distance
        ) {

            best = {

                index: i,

                t:
                    result.t,

                distance:
                    result.distance

            };

        }

    }


    return best;

}


/* =========================================================
   START GPS
========================================================= */

function startGPS() {

    if (
        !navigator.geolocation
    ) {

        setGPSStatus(
            "GPS非対応",
            false
        );

        return;

    }


    if (
        watchId !== null
    ) {

        return;

    }


    setGPSStatus(
        "GPS取得中...",
        false
    );


    watchId =
        navigator.geolocation.watchPosition(

            updateGPS,

            gpsError,

            {

                enableHighAccuracy:
                    true,

                maximumAge:
                    0,

                timeout:
                    15000

            }

        );

}


/* =========================================================
   UPDATE GPS
========================================================= */

function updateGPS(
    position
) {

    const c =
        position.coords;


    const lat =
        c.latitude;


    const lon =
        c.longitude;


    const accuracy =
        c.accuracy;


    /*
       精度表示
    */

    document.getElementById(
        "accuracy"
    ).textContent =

        Math.round(
            accuracy
        ) + " m";


    /*
       精度が悪すぎるGPSは
       位置判定には使用しない。
    */

    if (
        accuracy >
        MAX_ACCURACY
    ) {

        setGPSStatus(
            "GPS精度低下中",
            false
        );

        return;

    }


    /*
       現在位置から最も近い
       駅間を探す。
    */

    const best =
        findBestSection(
            lat,
            lon
        );


    if (
        !best
    ) {

        return;

    }


    /*
       現在区間より前には
       絶対に戻さない。

       これが今回の重要ポイント。
    */

    if (
        best.index >=
        currentSection
    ) {

        /*
           普通に次の駅間へ
        */

        if (
            best.index ===
            currentSection
        ) {

            /*
               そのまま
            */

        }

        else {

            /*
               GPSが次の区間に入ったら
               区間を更新
            */

            const nextStation =
                stations[
                    currentSection + 1
                ];


            const distanceToNext =
                distance(
                    lat,
                    lon,
                    nextStation.lat,
                    nextStation.lon
                );


            /*
               次駅に近い、
               または明らかに次区間へ
               入っている場合だけ更新。
            */

            if (
                distanceToNext <=
                SKIP_RADIUS
                ||
                best.index ===
                currentSection + 1
            ) {

                currentSection =
                    best.index;

                updateStationUI();

            }

        }

    }


    /*
       現在の区間
    */

    const from =
        stations[
            currentSection
        ];


    const to =
        stations[
            currentSection + 1
        ];


    /*
       現在地を
       現在区間へ投影
    */

    const projected =
        projectToSegment(
            lat,
            lon,
            from,
            to
        );


    /*
       進行率

       0.0 → 駅A
       1.0 → 駅B
    */

    let progress =
        projected.t;


    /*
       進行率が逆戻りしないようにする
    */

    if (
        typeof
        window.lastProgress !==
        "number"
    ) {

        window.lastProgress =
            progress;

    }

    else {

        /*
           GPSの揺れで
           バーが戻らないようにする。

           ただし駅間が変わったら
           updateStationUIでリセット。
        */

        if (
            progress <
            window.lastProgress
        ) {

            progress =
                window.lastProgress;

        }

        else {

            window.lastProgress =
                progress;

        }

    }


    progress =
        Math.max(
            0,
            Math.min(
                1,
                progress
            )
        );


    /*
       バー
    */

    document.getElementById(
        "progressFill"
    ).style.width =

        (
            progress * 100
        ) + "%";


    /*
       次駅までの距離

       GPS直線距離で表示。
    */

    const remain =
        distance(
            lat,
            lon,
            to.lat,
            to.lon
        );


    if (
        remain <= 100
    ) {

        document.getElementById(
            "distance"
        ).textContent =

            to.name +
            " まもなく";

    }

    else {

        document.getElementById(
            "distance"
        ).textContent =

            to.name +
            "まであと " +
            (
                remain / 1000
            ).toFixed(1) +
            " km";

    }


    /*
       駅到着

       ただし現在区間の次駅だけを見る。
    */

    if (
        remain <=
        ARRIVAL_RADIUS
    ) {

        if (
            currentSection <
            stations.length - 2
        ) {

            currentSection++;

            window.lastProgress =
                0;

            updateStationUI();

        }

        else {

            showArrival();

            return;

        }

    }


    /*
       速度
    */

    let speed =
        c.speed;


    if (
        speed === null ||
        speed === undefined ||
        !Number.isFinite(speed)
    ) {

        speed =
            calculateSpeed(
                lat,
                lon,
                position.timestamp
            );

    }

    else {

        speed =
            speed * 3.6;

    }


    /*
       GPS速度の異常値を除去
    */

    if (
        !Number.isFinite(speed) ||
        speed < 0
    ) {

        speed = 0;

    }


    /*
       速度が一瞬だけ跳ねるのを防ぐ
    */

    if (
        speed >
        180
    ) {

        speed = 180;

    }


    document.getElementById(
        "speed"
    ).textContent =

        Math.round(
            speed
        );


    /*
       GPS正常
    */

    setGPSStatus(
        "GPS接続中",
        true
    );


    /*
       前回GPS
    */

    lastGPS = {

        lat:
            lat,

        lon:
            lon,

        time:
            position.timestamp

    };

}


/* =========================================================
   GPS速度計算
========================================================= */

function calculateSpeed(
    lat,
    lon,
    time
) {

    if (
        !lastGPS
    ) {

        return 0;

    }


    const moved =
        distance(
            lastGPS.lat,
            lastGPS.lon,
            lat,
            lon
        );


    const seconds =
        (
            time -
            lastGPS.time
        ) / 1000;


    if (
        seconds <= 0
    ) {

        return 0;

    }


    return (
        moved /
        seconds
    ) * 3.6;

}


/* =========================================================
   UPDATE STATION UI
========================================================= */

function updateStationUI() {

    const from =
        stations[
            currentSection
        ];


    const to =
        stations[
            currentSection + 1
        ];


    document.getElementById(
        "fromStation"
    ).textContent =
        from.name;


    document.getElementById(
        "toStation"
    ).textContent =
        to.name;


    document.getElementById(
        "sectionName"
    ).textContent =

        from.name +
        " → " +
        to.name;


    document.getElementById(
        "next"
    ).textContent =

        "次は「" +
        to.name +
        "」です";


    /*
       駅間変更時だけ
       バーをリセット
    */

    window.lastProgress =
        0;


    document.getElementById(
        "progressFill"
    ).style.width =
        "0%";


    document.getElementById(
        "distance"
    ).textContent =

        to.name +
        "まであと -- km";

}


/* =========================================================
   GPS STATUS
========================================================= */

function setGPSStatus(
    text,
    active
) {

    document.getElementById(
        "gpsText"
    ).textContent =
        text;


    const dot =
        document.getElementById(
            "gpsDot"
        );


    if (
        active
    ) {

        dot.classList.add(
            "active"
        );

    }

    else {

        dot.classList.remove(
            "active"
        );

    }

}


/* =========================================================
   ARRIVAL
========================================================= */

function showArrival() {

    document.getElementById(
        "speed"
    ).textContent =
        "0";


    document.getElementById(
        "fromStation"
    ).textContent =
        "行橋";


    document.getElementById(
        "toStation"
    ).textContent =
        "";


    document.getElementById(
        "progressFill"
    ).style.width =
        "100%";


    document.getElementById(
        "distance"
    ).textContent =
        "行橋 到着";


    document.getElementById(
        "sectionName"
    ).textContent =
        "行橋";


    document.getElementById(
        "next"
    ).textContent =
        "終点です";


    document.getElementById(
        "arrival"
    ).classList.add(
        "show"
    );


    setGPSStatus(
        "行橋に到着",
        true
    );

}


/* =========================================================
   GPS ERROR
========================================================= */

function gpsError(
    error
) {

    let message =
        "GPSエラー";


    if (
        error.code === 1
    ) {

        message =
            "位置情報を許可してください";

    }


    if (
        error.code === 2
    ) {

        message =
            "現在地を取得できません";

    }


    if (
        error.code === 3
    ) {

        message =
            "GPS取得がタイムアウトしました";

    }


    setGPSStatus(
        message,
        false
    );

}


/* =========================================================
   INITIAL
========================================================= */

updateStationUI();


window.addEventListener(
    "load",
    () => {

        startGPS();

    }
);

</script>
