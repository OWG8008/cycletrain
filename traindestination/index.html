<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no,
             viewport-fit=cover"
>

<meta name="theme-color" content="#050609">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>特急ソニック10号｜博多行き</title>

<style>

/* =====================================================
   BASIC
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    width: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;

    background:
        radial-gradient(
            circle at 8% 0%,
            rgba(255,255,255,.12),
            transparent 30%
        ),
        radial-gradient(
            circle at 95% 18%,
            rgba(100,140,255,.10),
            transparent 32%
        ),
        linear-gradient(
            145deg,
            #040508,
            #111318 50%,
            #050609
        );

    color-scheme: dark;
}

body {
    width: 100%;
    min-height: 100%;

    margin: 0;
    padding: 0;

    overflow-x: hidden;
    overflow-y: auto;

    background: transparent;

    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;
}


/* =====================================================
   APP
===================================================== */

.app {

    width: 100%;
    max-width: 650px;

    min-height: 100dvh;

    margin: 0 auto;

    padding:
        calc(
            10px +
            env(safe-area-inset-top)
        )
        8px
        calc(
            20px +
            env(safe-area-inset-bottom)
        )
        8px;
}


/* =====================================================
   LIQUID GLASS
===================================================== */

.glass {

    position: relative;
    overflow: hidden;

    border:
        1px solid
        rgba(255,255,255,.17);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.14),
            rgba(255,255,255,.065) 48%,
            rgba(255,255,255,.035)
        );

    backdrop-filter:
        blur(32px)
        saturate(180%);

    -webkit-backdrop-filter:
        blur(32px)
        saturate(180%);

    box-shadow:

        inset
        0 1px 0
        rgba(255,255,255,.22),

        inset
        0 -1px 0
        rgba(255,255,255,.035),

        0 15px 40px
        rgba(0,0,0,.18);
}

.glass::before {

    content: "";

    position: absolute;

    left: -60%;
    top: -90%;

    width: 190%;
    height: 170%;

    background:
        linear-gradient(
            110deg,
            transparent 43%,
            rgba(255,255,255,.055) 50%,
            transparent 57%
        );

    transform:
        rotate(-6deg);

    pointer-events: none;
}


/* =====================================================
   HEADER
===================================================== */

.header {

    position: relative;

    padding:
        16px 17px;

    border-radius: 25px;

    margin-bottom: 9px;
}

.train-type {

    position: relative;
    z-index: 2;

    font-size: 13px;

    color:
        rgba(255,255,255,.48);

    margin-bottom: 3px;
}

.destination {

    position: relative;
    z-index: 2;

    font-size: 29px;

    font-weight: 760;

    letter-spacing: -1px;
}

.train-number {

    position: absolute;

    right: 16px;
    top: 17px;

    z-index: 3;

    padding:
        6px 10px;

    border-radius: 12px;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid
        rgba(255,255,255,.13);

    font-size: 12px;

    font-weight: 700;

    color:
        rgba(255,255,255,.72);
}


/* =====================================================
   NEXT STATIONS
===================================================== */

.next-stations {

    padding:
        15px 14px 17px;

    border-radius: 25px;

    margin-bottom: 9px;
}

.next-label {

    position: relative;
    z-index: 2;

    font-size: 11px;

    color:
        rgba(255,255,255,.40);

    margin-bottom: 12px;
}


/* =====================================================
   STATION BOARD
   左揃え
===================================================== */

.station-board {

    position: relative;
    z-index: 2;

    display: flex;

    align-items: center;

    justify-content: flex-start;

    width: 100%;

    gap: 0;
}

.board-station {

    flex:
        0 0 auto;

    min-width: 42px;

    text-align: left;

    position: relative;
}

.board-name {

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    min-height: 48px;

    font-size: 19px;

    line-height: 1.15;

    font-weight: 750;

    letter-spacing: 1px;

    color:
        rgba(255,255,255,.72);

    text-shadow:
        0 1px 8px
        rgba(255,255,255,.08);
}

.board-name span {

    display: block;

    height: 22px;
}


/* =====================================================
   ARROW
===================================================== */

.board-arrow {

    flex:
        0 0 25px;

    text-align: center;

    font-size: 20px;

    font-weight: 500;

    color:
        rgba(255,255,255,.30);

    transform:
        translateY(1px);
}


/* =====================================================
   SPEED
===================================================== */

.speed-box {

    padding:
        15px 17px 17px;

    border-radius: 25px;

    margin-bottom: 9px;
}

.speed-label {

    position: relative;
    z-index: 2;

    font-size: 12px;

    color:
        rgba(255,255,255,.43);

    margin-bottom: 4px;
}

.speed-row {

    position: relative;
    z-index: 2;

    display: flex;

    align-items: baseline;
}

.speed {

    font-size: 78px;

    line-height: .88;

    font-weight: 750;

    letter-spacing: -5px;

    font-variant-numeric:
        tabular-nums;
}

.speed-unit {

    font-size: 18px;

    margin-left: 8px;

    color:
        rgba(255,255,255,.48);
}


/* =====================================================
   POSITION
===================================================== */

.position-section {

    padding:
        16px 17px 17px;

    border-radius: 25px;

    margin-bottom: 9px;
}

.position-title {

    position: relative;
    z-index: 2;

    font-size: 12px;

    color:
        rgba(255,255,255,.43);

    margin-bottom: 13px;
}

.station-row {

    position: relative;
    z-index: 2;

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 10px;

    margin-bottom: 10px;
}

.station {

    font-size: 21px;

    font-weight: 750;

    white-space: nowrap;
}

.station.to {

    text-align: right;
}


/* =====================================================
   PROGRESS BAR
===================================================== */

.progress-wrapper {

    position: relative;

    width: 100%;

    height: 23px;
}

.progress-background {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 23px;

    border-radius: 999px;

    background:
        rgba(255,255,255,.075);

    border:
        1px solid
        rgba(255,255,255,.09);

    overflow: hidden;

    box-shadow:
        inset
        0 2px 6px
        rgba(0,0,0,.22);
}

.progress-fill {

    position: absolute;

    left: 0;
    top: 0;

    width: 0%;

    height: 23px;

    border-radius: 999px;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.38),
            rgba(255,255,255,.72),
            rgba(255,255,255,1)
        );

    box-shadow:
        0 0 17px
        rgba(255,255,255,.28),

        inset
        0 1px 1px
        rgba(255,255,255,.55);

    transition:
        width .55s linear;
}

.distance-text {

    position: relative;
    z-index: 2;

    margin-top: 9px;

    text-align: right;

    font-size: 14px;

    color:
        rgba(255,255,255,.62);

    font-variant-numeric:
        tabular-nums;
}


/* =====================================================
   GPS
===================================================== */

.gps-area {

    padding:
        3px 0 0;
}

.gps-status {

    font-size: 11px;

    color:
        rgba(255,255,255,.35);

    text-align: center;

    margin-bottom: 8px;
}

.gps-button {

    width: 100%;

    padding: 14px;

    border:
        1px solid
        rgba(255,255,255,.27);

    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.76),
            rgba(255,255,255,.43)
        );

    color: #111;

    font-size: 15px;

    font-weight: 700;

    box-shadow:
        inset
        0 1px 0
        rgba(255,255,255,.8),

        0 8px 20px
        rgba(0,0,0,.20);
}

.gps-button:active {

    transform:
        scale(.975);

    opacity: .82;
}


/* =====================================================
   SMALL SCREEN
===================================================== */

@media (
    max-width: 380px
) {

    .destination {
        font-size: 26px;
    }

    .board-name {
        font-size: 17px;
    }

    .board-arrow {
        flex-basis: 20px;
        font-size: 18px;
    }

    .speed {
        font-size: 68px;
    }

    .station {
        font-size: 19px;
    }

}

</style>
</head>


<body>

<div class="app">


<!-- ===================================================
     HEADER
=================================================== -->

<div class="header glass">

    <div class="train-type">
        特急ソニック
    </div>

    <div class="destination">
        博多行き
    </div>

    <div class="train-number">
        10号
    </div>

</div>


<!-- ===================================================
     NEXT STATIONS
=================================================== -->

<div class="next-stations glass">

    <div class="next-label">
        次の停車駅
    </div>

    <div
        id="stationBoard"
        class="station-board"
    ></div>

</div>


<!-- ===================================================
     SPEED
=================================================== -->

<div class="speed-box glass">

    <div class="speed-label">
        速度
    </div>

    <div class="speed-row">

        <span
            id="speed"
            class="speed"
        >
            --
        </span>

        <span class="speed-unit">
            km/h
        </span>

    </div>

</div>


<!-- ===================================================
     POSITION
=================================================== -->

<div class="position-section glass">

    <div class="position-title">
        列車位置
    </div>

    <div class="station-row">

        <div
            id="fromStation"
            class="station"
        >
            GPS待機中
        </div>

        <div
            id="toStation"
            class="station to"
        >
            --
        </div>

    </div>

    <div class="progress-wrapper">

        <div class="progress-background">

            <div
                id="progressFill"
                class="progress-fill"
            ></div>

        </div>

    </div>

    <div
        id="distanceText"
        class="distance-text"
    >
        現在地を確認しています
    </div>

</div>


<!-- ===================================================
     GPS
=================================================== -->

<div class="gps-area">

    <div
        id="gpsStatus"
        class="gps-status"
    >
        GPSを待っています
    </div>

    <button
        class="gps-button"
        onclick="startGPS()"
    >
        GPSを開始
    </button>

</div>


</div>


<script>

/* =====================================================
   ソニック10号
   大分 → 博多
===================================================== */

const stations = [

    {
        name: "大分",
        lat: 33.2323,
        lon: 131.6066
    },

    {
        name: "別府",
        lat: 33.2797,
        lon: 131.5004
    },

    {
        name: "杵築",
        lat: 33.4184,
        lon: 131.6171
    },

    {
        name: "宇佐",
        lat: 33.5312,
        lon: 131.3485
    },

    {
        name: "柳ケ浦",
        lat: 33.5650,
        lon: 131.3626
    },

    {
        name: "中津",
        lat: 33.5991,
        lon: 131.1909
    },

    {
        name: "宇島",
        lat: 33.6120,
        lon: 131.1300
    },

    {
        name: "行橋",
        lat: 33.7308,
        lon: 130.9588
    },

    {
        name: "小倉",
        lat: 33.8869,
        lon: 130.8827
    },

    {
        name: "黒崎",
        lat: 33.8660,
        lon: 130.7665
    },

    {
        name: "折尾",
        lat: 33.8650,
        lon: 130.7130
    },

    {
        name: "博多",
        lat: 33.5904,
        lon: 130.4207
    }

];


/* =====================================================
   SETTINGS
===================================================== */

const STATION_RADIUS =
    700;

const SWITCH_DISTANCE =
    500;

const SWITCH_SPEED =
    25;

const ARRIVAL_DISTANCE =
    80;


/* =====================================================
   STATE
===================================================== */

let initialized =
    false;

let currentSegment =
    0;

let watchId =
    null;


/* =====================================================
   次の4駅表示
===================================================== */

function updateNextStations() {

    const board =
        document.getElementById(
            "stationBoard"
        );

    board.innerHTML = "";


    /*
       現在区間の次駅から
       最大4駅表示
    */

    const startIndex =
        currentSegment + 1;


    const endIndex =
        Math.min(
            startIndex + 4,
            stations.length
        );


    const count =
        Math.max(
            0,
            endIndex - startIndex
        );


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const station =
            stations[
                startIndex + i
            ];


        const stationElement =
            document.createElement(
                "div"
            );

        stationElement.className =
            "board-station";


        const name =
            document.createElement(
                "div"
            );

        name.className =
            "board-name";


        /*
           駅名を縦表示
        */

        const chars =
            [...station.name];


        chars.forEach(
            char => {

                const span =
                    document.createElement(
                        "span"
                    );

                span.textContent =
                    char;

                name.appendChild(
                    span
                );

            }
        );


        stationElement.appendChild(
            name
        );

        board.appendChild(
            stationElement
        );


        /*
           駅の間だけ ＞
        */

        if (
            i <
            count - 1
        ) {

            const arrow =
                document.createElement(
                    "div"
                );

            arrow.className =
                "board-arrow";

            arrow.textContent =
                "＞";

            board.appendChild(
                arrow
            );

        }

    }

}


/* =====================================================
   DISTANCE
===================================================== */

function getDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R =
        6371000;

    const rad =
        Math.PI / 180;

    const dLat =
        (lat2 - lat1) *
        rad;

    const dLon =
        (lon2 - lon1) *
        rad;

    const a =

        Math.sin(
            dLat / 2
        ) ** 2

        +

        Math.cos(
            lat1 * rad
        )

        *

        Math.cos(
            lat2 * rad
        )

        *

        Math.sin(
            dLon / 2
        ) ** 2;

    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );

    return R * c;

}


/* =====================================================
   POINT TO SEGMENT
===================================================== */

function pointToSegmentDistance(
    lat,
    lon,
    a,
    b
) {

    const latScale =
        111320;

    const lonScale =
        111320 *
        Math.cos(
            lat *
            Math.PI /
            180
        );

    const px =
        lon *
        lonScale;

    const py =
        lat *
        latScale;

    const ax =
        a.lon *
        lonScale;

    const ay =
        a.lat *
        latScale;

    const bx =
        b.lon *
        lonScale;

    const by =
        b.lat *
        latScale;

    const dx =
        bx - ax;

    const dy =
        by - ay;

    const lengthSquared =
        dx * dx +
        dy * dy;


    if (
        lengthSquared === 0
    ) {

        return Math.sqrt(
            (px - ax) ** 2 +
            (py - ay) ** 2
        );

    }


    let t =

        (
            (px - ax) * dx +
            (py - ay) * dy
        )

        /

        lengthSquared;


    t =
        Math.max(
            0,
            Math.min(
                1,
                t
            )
        );


    const closestX =
        ax +
        t * dx;

    const closestY =
        ay +
        t * dy;


    return Math.sqrt(

        (px - closestX) ** 2 +
        (py - closestY) ** 2

    );

}


/* =====================================================
   INITIAL SEGMENT
===================================================== */

function detectInitialSegment(
    lat,
    lon
) {

    /*
       駅の近くなら駅を優先
    */

    for (
        let i = 0;
        i < stations.length;
        i++
    ) {

        const distance =
            getDistance(
                lat,
                lon,
                stations[i].lat,
                stations[i].lon
            );


        if (
            distance <=
            STATION_RADIUS
        ) {

            if (
                i >=
                stations.length - 1
            ) {

                return stations.length - 1;

            }


            return i;

        }

    }


    /*
       最も近い区間を探す
    */

    let bestSegment =
        0;

    let bestDistance =
        Infinity;


    for (
        let i = 0;
        i < stations.length - 1;
        i++
    ) {

        const distance =
            pointToSegmentDistance(
                lat,
                lon,
                stations[i],
                stations[i + 1]
            );


        if (
            distance <
            bestDistance
        ) {

            bestDistance =
                distance;

            bestSegment =
                i;

        }

    }


    return bestSegment;

}


/* =====================================================
   START GPS
===================================================== */

function startGPS() {

    if (
        !navigator.geolocation
    ) {

        setStatus(
            "この端末ではGPSを利用できません"
        );

        return;

    }


    if (
        watchId !== null
    ) {

        return;

    }


    setStatus(
        "GPS取得中..."
    );


    watchId =
        navigator.geolocation.watchPosition(

            updateGPS,

            gpsError,

            {

                enableHighAccuracy:
                    true,

                maximumAge:
                    500,

                timeout:
                    10000

            }

        );

}


/* =====================================================
   GPS UPDATE
===================================================== */

function updateGPS(
    position
) {

    const lat =
        position.coords.latitude;

    const lon =
        position.coords.longitude;


    let speed =
        position.coords.speed;


    /*
       m/s → km/h
    */

    if (
        speed !== null &&
        speed !== undefined &&
        !isNaN(speed)
    ) {

        speed =
            Math.max(
                0,
                speed * 3.6
            );

    }

    else {

        speed = 0;

    }


    const displaySpeed =
        Math.round(
            speed
        );


    document.getElementById(
        "speed"
    ).textContent =
        displaySpeed;


    /*
       初回GPS
    */

    if (
        !initialized
    ) {

        currentSegment =
            detectInitialSegment(
                lat,
                lon
            );


        initialized =
            true;


        if (
            currentSegment >=
            stations.length - 1
        ) {

            showArrival();

            return;

        }


        updateNextStations();

    }


    /*
       現在区間の次駅
    */

    const to =
        stations[
            currentSegment + 1
        ];


    const remaining =
        getDistance(
            lat,
            lon,
            to.lat,
            to.lon
        );


    /*
       駅切り替え

       ・500m以内
       ・25km/h以下

       または

       ・80m以内
    */

    const slowEnough =
        displaySpeed <=
        SWITCH_SPEED;

    const closeEnough =
        remaining <=
        SWITCH_DISTANCE;

    const almostAtStation =
        remaining <=
        ARRIVAL_DISTANCE;


    if (

        (
            slowEnough &&
            closeEnough
        )

        ||

        almostAtStation

    ) {

        currentSegment++;


        if (
            currentSegment >=
            stations.length - 1
        ) {

            showArrival();

            return;

        }


        updateNextStations();

    }


    updateDisplay(
        lat,
        lon
    );

}


/* =====================================================
   DISPLAY
===================================================== */

function updateDisplay(
    lat,
    lon
) {

    const from =
        stations[
            currentSegment
        ];


    const to =
        stations[
            currentSegment + 1
        ];


    const totalDistance =
        getDistance(
            from.lat,
            from.lon,
            to.lat,
            to.lon
        );


    const remaining =
        getDistance(
            lat,
            lon,
            to.lat,
            to.lon
        );


    let progress =

        1 -

        (
            remaining /
            totalDistance
        );


    progress =
        Math.max(
            0,
            Math.min(
                1,
                progress
            )
        );


    document.getElementById(
        "fromStation"
    ).textContent =
        from.name;


    document.getElementById(
        "toStation"
    ).textContent =
        to.name;


    document.getElementById(
        "progressFill"
    ).style.width =

        (
            progress *
            100
        ) + "%";


    const km =
        remaining /
        1000;


    if (
        km < 0.1
    ) {

        document.getElementById(
            "distanceText"
        ).textContent =
            to.name +
            " まもなく";

    }

    else {

        document.getElementById(
            "distanceText"
        ).textContent =
            to.name +
            "まであと " +
            km.toFixed(1) +
            " km";

    }


    setStatus(
        "● GPS接続中"
    );

}


/* =====================================================
   ARRIVAL
===================================================== */

function showArrival() {

    document.getElementById(
        "speed"
    ).textContent =
        "0";


    document.getElementById(
        "fromStation"
    ).textContent =
        "博多";


    document.getElementById(
        "toStation"
    ).textContent =
        "";


    document.getElementById(
        "progressFill"
    ).style.width =
        "100%";


    document.getElementById(
        "distanceText"
    ).textContent =
        "博多 到着";


    const board =
        document.getElementById(
            "stationBoard"
        );


    board.innerHTML = "";


    const station =
        document.createElement(
            "div"
        );

    station.className =
        "board-station";

    station.style.flex =
        "0 0 auto";


    station.innerHTML =

        `
        <div class="board-name">
            <span>博</span>
            <span>多</span>
        </div>
        `;


    board.appendChild(
        station
    );


    setStatus(
        "● 博多に到着しました"
    );

}


/* =====================================================
   GPS ERROR
===================================================== */

function gpsError(
    error
) {

    let message =
        "GPSを取得できません";


    switch (
        error.code
    ) {

        case 1:

            message =
                "位置情報の使用を許可してください";

            break;


        case 2:

            message =
                "現在地を取得できません";

            break;


        case 3:

            message =
                "GPS取得がタイムアウトしました";

            break;

    }


    setStatus(
        message
    );

}


/* =====================================================
   STATUS
===================================================== */

function setStatus(
    text
) {

    document.getElementById(
        "gpsStatus"
    ).textContent =
        text;

}


/* =====================================================
   LOAD
===================================================== */

window.addEventListener(
    "load",
    () => {

        updateNextStations();

        startGPS();

    }
);

</script>

</body>
</html>
