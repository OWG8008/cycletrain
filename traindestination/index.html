<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               viewport-fit=cover">

<title>Train Destination</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #050505;
    color: #fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
}

body {
    overflow-x: hidden;
}

.app {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;

    padding:
        calc(14px + env(safe-area-inset-top))
        12px
        calc(30px + env(safe-area-inset-bottom))
        12px;
}


/* =====================================================
   LIQUID GLASS
===================================================== */

.glass {

    position: relative;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.14),
            rgba(255,255,255,.055)
        );

    border:
        1px solid
        rgba(255,255,255,.13);

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.42),

        inset 0 1px 0
        rgba(255,255,255,.17),

        inset 0 -1px 0
        rgba(255,255,255,.025);

    backdrop-filter:
        blur(32px)
        saturate(165%);

    -webkit-backdrop-filter:
        blur(32px)
        saturate(165%);
}


/* =====================================================
   SETUP
===================================================== */

#setup {

    min-height:
        calc(
            100vh -
            env(safe-area-inset-top) -
            env(safe-area-inset-bottom)
        );

    display: flex;
    align-items: center;
}

.setup-card {

    width: 100%;

    padding: 24px;

    border-radius: 30px;
}

.setup-small {

    font-size: 13px;

    color:
        rgba(255,255,255,.42);

    margin-bottom: 6px;
}

.setup-title {

    font-size: 31px;

    font-weight: 760;

    letter-spacing: -1.5px;

    margin-bottom: 22px;
}


/* =====================================================
   TRAIN BUTTONS
===================================================== */

.train-buttons {

    display: grid;

    gap: 10px;
}

.train-button {

    width: 100%;

    border: none;

    border-radius: 18px;

    padding: 17px;

    background:
        rgba(255,255,255,.075);

    color: #fff;

    font-size: 16px;

    font-weight: 650;

    text-align: left;
}

.train-button.active {

    background: #fff;

    color: #000;
}


/* =====================================================
   OPTIONS
===================================================== */

.option-area {

    display: none;

    margin-top: 18px;
}

.option-area.show {

    display: block;
}

.option-label {

    font-size: 13px;

    color:
        rgba(255,255,255,.42);

    margin-bottom: 8px;
}

select,
input {

    width: 100%;

    border: none;
    outline: none;

    border-radius: 17px;

    padding: 16px;

    background:
        rgba(255,255,255,.09);

    color: #fff;

    font-size: 17px;

    font-weight: 600;
}

select option {

    background: #151515;

    color: #fff;
}

input::placeholder {

    color:
        rgba(255,255,255,.30);
}


/* =====================================================
   START BUTTON
===================================================== */

.start-button {

    width: 100%;

    margin-top: 16px;

    border: none;

    border-radius: 19px;

    padding: 17px;

    background: #fff;

    color: #000;

    font-size: 17px;

    font-weight: 700;
}


/* =====================================================
   MAIN
===================================================== */

#main {
    display: none;
}


/* =====================================================
   HEADER
===================================================== */

.header {

    padding: 21px;

    border-radius: 27px;

    margin-bottom: 13px;
}

.train-name {

    font-size: 15px;

    color:
        rgba(255,255,255,.48);

    margin-bottom: 5px;
}

.destination {

    font-size: 31px;

    font-weight: 760;

    letter-spacing: -1.5px;
}


/* =====================================================
   NEXT STATIONS
===================================================== */

.next-card {

    padding: 20px;

    border-radius: 27px;

    margin-bottom: 13px;
}

.next-label {

    font-size: 13px;

    color:
        rgba(255,255,255,.42);

    margin-bottom: 15px;
}

.station-route {

    display: flex;

    align-items: center;

    gap: 9px;

    overflow-x: auto;

    scrollbar-width: none;

    justify-content: flex-start;
}

.station-route::-webkit-scrollbar {
    display: none;
}

.route-station {

    font-size: 17px;

    font-weight: 700;

    white-space: nowrap;

    flex-shrink: 0;
}

.route-arrow {

    font-size: 17px;

    color:
        rgba(255,255,255,.38);

    flex-shrink: 0;
}


/* =====================================================
   SPEED
===================================================== */

.speed-card {

    padding: 23px;

    border-radius: 27px;

    margin-bottom: 13px;
}

.speed-label {

    font-size: 14px;

    color:
        rgba(255,255,255,.43);

    margin-bottom: 6px;
}

.speed-row {

    display: flex;

    align-items: baseline;
}

.speed {

    font-size: 75px;

    line-height: .95;

    font-weight: 760;

    letter-spacing: -5px;

    font-variant-numeric:
        tabular-nums;
}

.speed-unit {

    margin-left: 9px;

    font-size: 19px;

    color:
        rgba(255,255,255,.45);
}


/* =====================================================
   POSITION
===================================================== */

.position-card {

    padding: 23px;

    border-radius: 27px;

    margin-bottom: 13px;
}

.position-label {

    font-size: 14px;

    color:
        rgba(255,255,255,.43);

    margin-bottom: 15px;
}

.station-row {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 13px;
}

.station-from,
.station-to {

    font-size: 19px;

    font-weight: 700;
}

.station-to {
    text-align: right;
}


/* =====================================================
   PROGRESS
===================================================== */

.progress {

    width: 100%;

    height: 19px;

    border-radius: 999px;

    overflow: hidden;

    background:
        rgba(255,255,255,.10);
}

.progress-fill {

    width: 0%;

    height: 100%;

    border-radius: 999px;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.45),
            rgba(255,255,255,1)
        );

    transition:
        width .7s linear;
}

.distance {

    margin-top: 14px;

    text-align: right;

    font-size: 15px;

    color:
        rgba(255,255,255,.62);
}


/* =====================================================
   GPS
===================================================== */

.gps-card {

    padding: 19px;

    border-radius: 27px;
}

.gps-status {

    text-align: center;

    font-size: 13px;

    color:
        rgba(255,255,255,.40);

    margin-bottom: 12px;
}

.gps-button {

    width: 100%;

    border: none;

    border-radius: 17px;

    padding: 15px;

    background:
        rgba(255,255,255,.09);

    color: #fff;

    font-size: 15px;

    font-weight: 650;
}


/* =====================================================
   TEST MODE
===================================================== */

#testBadge {

    display: none;

    position: fixed;

    top:
        calc(
            10px +
            env(safe-area-inset-top)
        );

    right: 12px;

    z-index: 10000;

    padding: 8px 12px;

    border-radius: 999px;

    background:
        rgba(255,255,255,.14);

    border:
        1px solid
        rgba(255,255,255,.12);

    backdrop-filter:
        blur(20px);

    font-size: 12px;

    font-weight: 700;
}

#testPanel {

    display: none;

    position: fixed;

    left: 12px;
    right: 12px;

    bottom:
        calc(
            12px +
            env(safe-area-inset-bottom)
        );

    z-index: 9999;

    padding: 15px;

    border-radius: 25px;
}

.test-title {

    font-size: 13px;

    color:
        rgba(255,255,255,.45);

    margin-bottom: 8px;
}

.test-current {

    font-size: 19px;

    font-weight: 750;

    margin-bottom: 12px;
}

.test-buttons {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 9px;
}

.test-button {

    border: none;

    border-radius: 15px;

    padding: 14px;

    background:
        rgba(255,255,255,.11);

    color: #fff;

    font-size: 15px;

    font-weight: 650;
}

.test-button.next {

    background: #fff;

    color: #000;
}

</style>
</head>

<section id="main">

</div>

</span>

km/h
</span>

</div>


<div class="position-card glass">

</div>

--

<div

--
</div>

</div>


<div class="progress">

</div>


<div

</div>


<div class="gps-card glass">

</div>

<button

GPSを開始
</button>

</div>


</section>

</div>


<!-- ==================================================
     TEST
================================================== -->

<div id="testBadge">

</div>

</div>

</div>

/* =====================================================
   列車タイプ選択
===================================================== */

function selectType(type) {

    selectedType = type;

    document
        .querySelectorAll(".train-button")
        .forEach(
            e =>
                e.classList.remove("active")
        );


    const button =
        type === "normal"
            ? "normalButton"
            : type === "sonic"
                ? "sonicButton"
                : "yufuButton";


    document
        .getElementById(button)
        .classList.add("active");


    document
        .querySelectorAll(".option-area")
        .forEach(
            e =>
                e.classList.remove("show")
        );


    document
        .getElementById(
            type === "normal"
                ? "normalOptions"
                : type === "sonic"
                    ? "sonicOptions"
                    : "yufuOptions"
        )
        .classList.add("show");

}


/* =====================================================
   ソニック号数 → 自動判定
===================================================== */

function getSonicData(number) {

    /*
       まず特殊列車を確認
    */

    if (
        sonicExceptions[number]
    ) {

        return {
            ...sonicExceptions[number]
        };

    }


    /*
       通常ソニック

       偶数 → 大分 → 博多
       奇数 → 博多 → 大分

       ただし41号は上で例外処理済み
    */

    if (
        number % 2 === 0
    ) {

        return {

            destination: "博多",

            route:
                [
                    ...sonicOitaToHakata
                ]

        };

    }


    return {

        destination: "大分",

        route:
            [
                ...sonicHakataToOita
            ]

    };

}


/* =====================================================
   START
===================================================== */

function startTrain() {

    if (!selectedType) {

        alert(
            "列車を選択してください"
        );

        return;

    }


    let trainTitle = "";

    let destination = "";


    /* =================================================
       普通
    ================================================= */

    if (
        selectedType === "normal"
    ) {

        const routeName =
            document
                .getElementById(
                    "normalRoute"
                )
                .value;


        currentRoute =
            [
                ...normalRoutes[
                    routeName
                ]
            ];


        const select =
            document
                .getElementById(
                    "normalRoute"
                );


        trainTitle =
            "普通列車 " +
            select
                .options[
                    select.selectedIndex
                ]
                .text
                .split("　")[0];


        destination =
            currentRoute[
                currentRoute.length - 1
            ];

    }


    /* =================================================
       ソニック
    ================================================= */

    if (
        selectedType === "sonic"
    ) {

        const number =
            Number(
                document
                    .getElementById(
                        "sonicNumber"
                    )
                    .value
            );


        if (
            !number ||
            number < 1
        ) {

            alert(
                "ソニックの号数を入力してください"
            );

            return;

        }


        const sonic =
            getSonicData(number);


        currentRoute =
            [
                ...sonic.route
            ];


        destination =
            sonic.destination;


        trainTitle =
            "特急ソニック " +
            number +
            "号";

    }


    /* =================================================
       ゆふ森
    ================================================= */

    if (
        selectedType === "yufu"
    ) {

        const number =
            Number(
                document
                    .getElementById(
                        "yufuNumber"
                    )
                    .value
            );


        if (
            !number
        ) {

            alert(
                "ゆふいんの森の号数を入力してください"
            );

            return;

        }


        if (
            !yufuRoutes[number]
        ) {

            alert(
                "この号数のデータはまだ登録されていません"
            );

            return;

        }


        currentRoute =
            [
                ...yufuRoutes[number]
            ];


        destination =
            currentRoute[
                currentRoute.length - 1
            ];


        trainTitle =
            "特急ゆふいんの森 " +
            number +
            "号";

    }


    currentIndex = 0;

    speedHistory = [];


    document
        .getElementById(
            "trainName"
        )
        .textContent =
        trainTitle;


    document
        .getElementById(
            "destination"
        )
        .textContent =
        destination +
        "行き";


    document
        .getElementById(
            "setup"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "main"
        )
        .style.display =
        "block";


    updateDisplay();

}


/* =====================================================
   距離計算
===================================================== */

function getDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R = 6371000;

    const rad =
        Math.PI / 180;

    const dLat =
        (lat2 - lat1) * rad;

    const dLon =
        (lon2 - lon1) * rad;


    const a =
        Math.sin(dLat / 2) ** 2 +

        Math.cos(lat1 * rad) *
        Math.cos(lat2 * rad) *

        Math.sin(dLon / 2) ** 2;


    return (
        2 *
        R *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        )
    );

}


/* =====================================================
   画面更新
===================================================== */

function updateDisplay() {

    const from =
        currentRoute[
            currentIndex
        ];

    const to =
        currentRoute[
            currentIndex + 1
        ];


    document
        .getElementById(
            "fromStation"
        )
        .textContent =
        from || "";


    document
        .getElementById(
            "toStation"
        )
        .textContent =
        to || "";


    const route =
        document
            .getElementById(
                "stationRoute"
            );


    route.innerHTML = "";


    /*
       現在駅から4駅分だけ
    */

    const end =
        Math.min(
            currentIndex + 4,
            currentRoute.length
        );


    for (
        let i = currentIndex;
        i < end;
        i++
    ) {

        const station =
            document.createElement(
                "div"
            );

        station.className =
            "route-station";

        station.textContent =
            currentRoute[i];


        route.appendChild(
            station
        );


        /*
           最後の駅には矢印を付けない
        */

        if (
            i < end - 1
        ) {

            const arrow =
                document.createElement(
                    "div"
                );

            arrow.className =
                "route-arrow";

            arrow.textContent =
                "＞";


            route.appendChild(
                arrow
            );

        }

    }


    document
        .getElementById(
            "progressFill"
        )
        .style.width =
        "0%";


    if (!to) {

        showArrival();

    }

}


/* =====================================================
   GPS開始
===================================================== */

function startGPS() {

    if (testMode) {
        return;
    }


    if (
        !navigator.geolocation
    ) {

        setStatus(
            "この端末ではGPSを利用できません"
        );

        return;

    }


    if (
        watchId !== null
    ) {

        return;

    }


    setStatus(
        "GPS取得中..."
    );


    watchId =
        navigator.geolocation.watchPosition(

            updateGPS,

            gpsError,

            {

                enableHighAccuracy:
                    true,

                maximumAge:
                    1000,

                timeout:
                    15000

            }

        );

}


/* =====================================================
   GPS更新
===================================================== */

function updateGPS(position) {

    if (testMode) {
        return;
    }


    const lat =
        position.coords.latitude;

    const lon =
        position.coords.longitude;


    let speed =
        position.coords.speed;


    if (
        speed === null ||
        speed === undefined ||
        isNaN(speed) ||
        speed < 0
    ) {

        speed = 0;

    } else {

        speed =
            speed * 3.6;

    }


    /*
       GPSの瞬間的な異常値を除外
    */

    if (
        speed > 250
    ) {

        speed = 0;

    }


    speedHistory.push(
        speed
    );


    if (
        speedHistory.length > 5
    ) {

        speedHistory.shift();

    }


    const averageSpeed =
        speedHistory.reduce(
            (a,b) =>
                a + b,
            0
        )
        /
        speedHistory.length;


    document
        .getElementById(
            "speed"
        )
        .textContent =
        Math.round(
            averageSpeed
        );


    if (
        currentIndex >=
        currentRoute.length - 1
    ) {

        showArrival();

        return;

    }


    const from =
        currentRoute[
            currentIndex
        ];

    const to =
        currentRoute[
            currentIndex + 1
        ];


    const fromCoord =
        stationCoords[from];

    const toCoord =
        stationCoords[to];


    if (
        !fromCoord ||
        !toCoord
    ) {

        setStatus(
            "駅座標未登録: " +
            to
        );

        return;

    }


    const total =
        getDistance(
            fromCoord[0],
            fromCoord[1],
            toCoord[0],
            toCoord[1]
        );


    const remaining =
        getDistance(
            lat,
            lon,
            toCoord[0],
            toCoord[1]
        );


    let progress =
        1 -
        remaining /
        total;


    progress =
        Math.max(
            0,
            Math.min(
                1,
                progress
            )
        );


    document
        .getElementById(
            "progressFill"
        )
        .style.width =
        (
            progress * 100
        ) +
        "%";


    document
        .getElementById(
            "distance"
        )
        .textContent =

        remaining <= 100

            ? to +
              " まもなく"

            :

            to +
            "まであと " +
            (
                remaining /
                1000
            ).toFixed(1) +
            " km";


    /*
       駅切り替え

       ・駅から250m以内
       ・速度30km/h以下

       両方を満たしたときだけ
       次駅へ切り替える。

       これで通過中に
       勝手に駅が進みにくくなる。
    */

    if (
        remaining <= 250 &&
        averageSpeed <= 30
    ) {

        currentIndex++;

        updateDisplay();

    }


    setStatus(
        "GPS接続中"
    );

}


/* =====================================================
   到着
===================================================== */

function showArrival() {

    document
        .getElementById(
            "speed"
        )
        .textContent =
        "0";


    document
        .getElementById(
            "fromStation"
        )
        .textContent =
        currentRoute[
            currentRoute.length - 1
        ];


    document
        .getElementById(
            "toStation"
        )
        .textContent =
        "";


    document
        .getElementById(
            "progressFill"
        )
        .style.width =
        "100%";


    document
        .getElementById(
            "distance"
        )
        .textContent =
        "到着";


    setStatus(
        "終点に到着しました"
    );

}


/* =====================================================
   GPS ERROR
===================================================== */

function gpsError(error) {

    let message =
        "GPSを取得できません";


    switch (
        error.code
    ) {

        case 1:

            message =
                "位置情報の使用を許可してください";

            break;

        case 2:

            message =
                "現在地を取得できません";

            break;

        case 3:

            message =
                "GPS取得がタイムアウトしました";

            break;

    }


    setStatus(
        message
    );

}


/* =====================================================
   STATUS
===================================================== */

function setStatus(text) {

    document
        .getElementById(
            "gpsStatus"
        )
        .textContent =
        text;

}


/* =====================================================
   3連続タッチ
===================================================== */

document.addEventListener(
    "touchend",
    registerTap,
    {
        passive: true
    }
);


function registerTap() {

    const now =
        Date.now();


    tapTimes.push(
        now
    );


    tapTimes =
        tapTimes.filter(
            t =>
                now - t <= 700
        );


    if (
        tapTimes.length >= 3
    ) {

        tapTimes = [];

        toggleTestMode();

    }

}


/* =====================================================
   TEST MODE
===================================================== */

function toggleTestMode() {

    if (
        document
            .getElementById(
                "main"
            )
            .style
            .display !== "block"
    ) {

        return;

    }


    testMode =
        !testMode;


    const panel =
        document
            .getElementById(
                "testPanel"
            );

    const badge =
        document
            .getElementById(
                "testBadge"
            );


    if (testMode) {

        if (
            watchId !== null
        ) {

            navigator.geolocation
                .clearWatch(
                    watchId
                );

            watchId = null;

        }


        panel.style.display =
            "block";

        badge.style.display =
            "block";


        setStatus(
            "テストモード"
        );


        updateTestPanel();

    } else {

        panel.style.display =
            "none";

        badge.style.display =
            "none";


        setStatus(
            "GPSを待っています"
        );

    }

}


/* =====================================================
   TEST NEXT
===================================================== */

function testNext() {

    if (!testMode) {
        return;
    }


    if (
        currentIndex <
        currentRoute.length - 1
    ) {

        currentIndex++;

        updateDisplay();

        updateTestPanel();

    }

}


/* =====================================================
   TEST PREVIOUS
===================================================== */

function testPrevious() {

    if (!testMode) {
        return;
    }


    if (
        currentIndex > 0
    ) {

        currentIndex--;

        updateDisplay();

        updateTestPanel();

    }

}


/* =====================================================
   TEST PANEL
===================================================== */

function updateTestPanel() {

    const current =
        currentRoute[
            currentIndex
        ];

    const next =
        currentRoute[
            currentIndex + 1
        ];


    document
        .getElementById(
            "testCurrent"
        )
        .textContent =

        next

            ? current +
              " → " +
              next

            :

              current +
              "（終点）";


    if (next) {

        document
            .getElementById(
                "progressFill"
            )
            .style.width =
            "50%";


        document
            .getElementById(
                "distance"
            )
            .textContent =
            "テストモード";

    } else {

        document
            .getElementById(
                "progressFill"
            )
            .style.width =
            "100%";


        document
            .getElementById(
                "distance"
            )
            .textContent =
            "到着";

    }

}

</script>
