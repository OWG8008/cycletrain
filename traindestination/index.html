<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1.0,
           maximum-scale=1.0,
           viewport-fit=cover"
>

<title>JR Train Glass</title>

<style>
/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #050607;
  color: white;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    Arial,
    sans-serif;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
}

/* =========================================================
   BACKGROUND
========================================================= */

body::before {
  content: "";
  position: fixed;
  inset: -30%;
  z-index: -3;

  background:
    radial-gradient(
      circle at 20% 15%,
      rgba(255,255,255,.14),
      transparent 28%
    ),
    radial-gradient(
      circle at 85% 35%,
      rgba(100,180,255,.13),
      transparent 30%
    ),
    radial-gradient(
      circle at 50% 90%,
      rgba(255,255,255,.07),
      transparent 32%
    );

  filter: blur(35px);
  animation: bgMove 16s ease-in-out infinite alternate;
}

@keyframes bgMove {
  from {
    transform: translate3d(-2%, -1%, 0) scale(1);
  }

  to {
    transform: translate3d(2%, 2%, 0) scale(1.06);
  }
}

/* =========================================================
   APP
========================================================= */

.app {
  width: 100%;
  max-width: 720px;
  min-height: 100vh;

  margin: 0 auto;

  padding:
    calc(30px + env(safe-area-inset-top))
    20px
    calc(34px + env(safe-area-inset-bottom))
    20px;
}

/* =========================================================
   GLASS
========================================================= */

.glass {
  position: relative;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.15),
      rgba(255,255,255,.055)
    );

  border: 1px solid rgba(255,255,255,.13);

  box-shadow:
    0 20px 60px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.16),
    inset 0 -1px 0 rgba(255,255,255,.025);

  backdrop-filter:
    blur(28px)
    saturate(145%);

  -webkit-backdrop-filter:
    blur(28px)
    saturate(145%);

  overflow: hidden;
}

.glass::before {
  content: "";

  position: absolute;

  left: -30%;
  top: -100%;

  width: 60%;
  height: 300%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.08),
      transparent
    );

  transform: rotate(18deg);

  animation:
    glassReflection 9s ease-in-out infinite;

  pointer-events: none;
}

@keyframes glassReflection {

  0% {
    left: -70%;
  }

  45% {
    left: 120%;
  }

  100% {
    left: 120%;
  }
}

/* =========================================================
   START SCREEN
========================================================= */

.start-screen {
  min-height: calc(100vh - 60px);

  display: flex;
  align-items: center;
  justify-content: center;
}

.start-card {
  width: 100%;

  padding: 30px 24px;

  border-radius: 32px;

  text-align: left;
}

.app-title {
  font-size: 31px;
  font-weight: 800;
  letter-spacing: -1.5px;
}

.app-subtitle {
  margin-top: 8px;

  font-size: 14px;

  color: rgba(255,255,255,.48);
}

/* =========================================================
   SELECTOR
========================================================= */

.selector {
  margin-top: 28px;
}

.selector-label {
  font-size: 13px;
  color: rgba(255,255,255,.48);
  margin-bottom: 9px;
}

select,
input {
  width: 100%;

  padding: 18px;

  border-radius: 19px;

  border: 1px solid rgba(255,255,255,.13);

  outline: none;

  background:
    rgba(255,255,255,.085);

  color: white;

  font-size: 18px;
  font-weight: 650;

  appearance: none;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.09);
}

select option {
  background: #161719;
  color: white;
}

.primary-button {
  width: 100%;

  margin-top: 15px;

  padding: 18px;

  border: none;

  border-radius: 20px;

  background:
    rgba(255,255,255,.93);

  color: #050505;

  font-size: 17px;
  font-weight: 750;

  cursor: pointer;

  transition:
    transform .18s ease,
    opacity .18s ease;
}

.primary-button:active {
  transform: scale(.97);
  opacity: .8;
}

/* =========================================================
   MAIN
========================================================= */

#mainScreen {
  display: none;
}

.header {
  padding: 24px;

  border-radius: 30px;

  margin-bottom: 17px;
}

.train-name {
  font-size: 15px;
  color: rgba(255,255,255,.53);
}

.destination {
  margin-top: 5px;

  font-size: 32px;
  font-weight: 800;

  letter-spacing: -1.2px;
}

.train-number {
  margin-top: 6px;

  font-size: 14px;

  color: rgba(255,255,255,.45);
}

/* =========================================================
   SPEED
========================================================= */

.speed-card {
  padding: 24px;

  border-radius: 30px;
}

.speed-label {
  font-size: 13px;

  color: rgba(255,255,255,.45);
}

.speed-row {
  display: flex;
  align-items: baseline;
  margin-top: 4px;
}

.speed {
  font-size: 82px;

  line-height: .95;

  font-weight: 800;

  letter-spacing: -6px;

  font-variant-numeric: tabular-nums;
}

.speed-unit {
  margin-left: 10px;

  font-size: 18px;

  color: rgba(255,255,255,.45);
}

/* =========================================================
   NEXT STATIONS
========================================================= */

.station-card {
  margin-top: 17px;

  padding: 25px;

  border-radius: 30px;
}

.station-title {
  font-size: 13px;

  color: rgba(255,255,255,.43);

  margin-bottom: 19px;
}

/*
   4駅を縦表示
*/

.station-board {
  display: grid;

  grid-template-columns:
    26px
    1fr
    1fr
    1fr
    1fr;

  align-items: center;

  column-gap: 5px;
}

.arrow {
  font-size: 21px;

  font-weight: 700;

  color: rgba(255,255,255,.7);

  text-align: center;

  opacity: 0;

  transform: translateX(-5px);

  transition:
    opacity .4s ease,
    transform .4s ease;
}

.arrow.visible {
  opacity: 1;
  transform: translateX(0);
}

.station-column {
  min-width: 0;

  text-align: center;
}

.station-column span {
  display: block;

  font-size: 18px;

  line-height: 1.15;

  font-weight: 700;

  word-break: break-all;

  min-height: 72px;

  padding: 8px 3px;

  color: rgba(255,255,255,.92);

  transition:
    transform .5s ease,
    opacity .5s ease,
    filter .5s ease;
}

.station-column.current span {
  color: white;

  transform: translateY(-2px) scale(1.05);

  text-shadow:
    0 0 18px rgba(255,255,255,.25);
}

.station-column.empty span {
  opacity: 0;
}

/* =========================================================
   PROGRESS
========================================================= */

.progress-wrap {
  margin-top: 22px;
}

.progress-track {
  height: 12px;

  width: 100%;

  border-radius: 999px;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid rgba(255,255,255,.08);

  overflow: hidden;

  box-shadow:
    inset 0 1px 4px rgba(0,0,0,.3);
}

.progress-fill {
  height: 100%;

  width: 0%;

  border-radius: inherit;

  background:
    linear-gradient(
      90deg,
      rgba(255,255,255,.35),
      rgba(255,255,255,.95)
    );

  box-shadow:
    0 0 18px rgba(255,255,255,.22);

  transition:
    width .8s cubic-bezier(.22,.61,.36,1);
}

.distance {
  margin-top: 12px;

  text-align: right;

  font-size: 15px;

  color: rgba(255,255,255,.62);

  font-variant-numeric: tabular-nums;
}

/* =========================================================
   INFO
========================================================= */

.info-card {
  margin-top: 17px;

  padding: 23px;

  border-radius: 30px;
}

.info-label {
  font-size: 13px;

  color: rgba(255,255,255,.43);
}

.info-main {
  margin-top: 7px;

  font-size: 24px;

  font-weight: 750;
}

.info-sub {
  margin-top: 8px;

  font-size: 14px;

  color: rgba(255,255,255,.48);
}

/* =========================================================
   CONTROLS
========================================================= */

.controls {
  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 10px;

  margin-top: 17px;
}

.control-button {
  padding: 17px;

  border: 1px solid rgba(255,255,255,.12);

  border-radius: 20px;

  background:
    rgba(255,255,255,.075);

  color: white;

  font-size: 15px;

  font-weight: 650;

  backdrop-filter: blur(20px);

  -webkit-backdrop-filter: blur(20px);

  transition:
    transform .15s ease,
    background .2s ease;
}

.control-button:active {
  transform: scale(.96);

  background:
    rgba(255,255,255,.14);
}

/* =========================================================
   GPS
========================================================= */

.gps-card {
  margin-top: 17px;

  padding: 19px;

  border-radius: 25px;

  text-align: center;
}

.gps-status {
  font-size: 13px;

  color: rgba(255,255,255,.43);
}

.gps-button {
  width: 100%;

  margin-top: 11px;

  padding: 14px;

  border: none;

  border-radius: 17px;

  background:
    rgba(255,255,255,.11);

  color: white;

  font-size: 15px;

  font-weight: 650;
}

/* =========================================================
   ARRIVAL
========================================================= */

.arrival {
  animation:
    arrivalIn .7s cubic-bezier(.2,.8,.2,1);
}

@keyframes arrivalIn {
  from {
    opacity: 0;
    transform: scale(.94);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* =========================================================
   TEST MODE
========================================================= */

.test-badge {
  display: none;

  position: fixed;

  top:
    calc(12px + env(safe-area-inset-top));

  right: 15px;

  z-index: 50;

  padding: 8px 12px;

  border-radius: 999px;

  background:
    rgba(255,255,255,.13);

  border:
    1px solid rgba(255,255,255,.15);

  backdrop-filter: blur(20px);

  font-size: 11px;

  color: rgba(255,255,255,.65);
}

body.test-mode .test-badge {
  display: block;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 390px) {

  .app {
    padding-left: 14px;
    padding-right: 14px;
  }

  .destination {
    font-size: 28px;
  }

  .speed {
    font-size: 68px;
  }

  .station-column span {
    font-size: 16px;
  }

}
</style>
</head>


<body>

<div class="test-badge">
  TEST MODE
</div>


<!-- =======================================================
     選択画面
======================================================= -->

<div
  id="startScreen"
  class="app start-screen"
>

  <div class="start-card glass">

    <div class="app-title">
      Train Glass
    </div>

    <div class="app-subtitle">
      JR九州 列車位置表示
    </div>


    <div class="selector">

      <div class="selector-label">
        列車種別
      </div>

      <select id="trainType">

        <option value="sonic">
          特急ソニック
        </option>

        <option value="yufuin">
          特急ゆふいんの森
        </option>

        <option value="local">
          普通列車
        </option>

      </select>

    </div>


    <div
      id="numberArea"
      class="selector"
    >

      <div class="selector-label">
        号数
      </div>

      <input
        id="trainNumber"
        type="number"
        inputmode="numeric"
        placeholder="入力"
        min="1"
        max="999"
      >

    </div>


    <div
      id="localArea"
      class="selector"
      style="display:none"
    >

      <div class="selector-label">
        路線・区間
      </div>

      <select id="localRoute">

        <option value="nippo_down">
          日豊本線　中津 → 幸崎
        </option>

        <option value="nippo_up">
          日豊本線　幸崎 → 中津
        </option>

        <option value="kyudai_down">
          久大本線　大分 → 日田
        </option>

        <option value="kyudai_up">
          久大本線　日田 → 大分
        </option>

        <option value="hohi_down">
          豊肥本線　大分 → 宮地
        </option>

        <option value="hohi_up">
          豊肥本線　宮地 → 大分
        </option>

      </select>

    </div>


    <button
      class="primary-button"
      onclick="launchTrain()"
    >
      列車を表示
    </button>

  </div>

</div>


<!-- =======================================================
     メイン画面
======================================================= -->

<div
  id="mainScreen"
  class="app"
>

  <div
    id="header"
    class="header glass"
  >

    <div
      id="trainName"
      class="train-name"
    >
      特急ソニック
    </div>

    <div
      id="destination"
      class="destination"
    >
      博多行き
    </div>

    <div
      id="trainNumberDisplay"
      class="train-number"
    >
      ソニック 10号
    </div>

  </div>


  <!-- 速度 -->

  <div class="speed-card glass">

    <div class="speed-label">
      現在速度
    </div>

    <div class="speed-row">

      <span
        id="speed"
        class="speed"
      >
        --
      </span>

      <span class="speed-unit">
        km/h
      </span>

    </div>

  </div>


  <!-- 駅 -->

  <div class="station-card glass">

    <div class="station-title">
      次の停車駅
    </div>


    <div
      id="stationBoard"
      class="station-board"
    ></div>


    <div class="progress-wrap">

      <div class="progress-track">

        <div
          id="progressFill"
          class="progress-fill"
        ></div>

      </div>

      <div
        id="distance"
        class="distance"
      >
        GPS取得中...
      </div>

    </div>

  </div>


  <!-- 区間 -->

  <div class="info-card glass">

    <div class="info-label">
      列車位置
    </div>

    <div
      id="sectionName"
      class="info-main"
    >
      GPS取得中...
    </div>

    <div
      id="nextInfo"
      class="info-sub"
    >
      次の停車駅を確認しています
    </div>

  </div>


  <!-- 前後駅 -->

  <div class="controls">

    <button
      class="control-button"
      onclick="previousStation()"
    >
      ← 前の駅
    </button>

    <button
      class="control-button"
      onclick="nextStation()"
    >
      次の駅 →
    </button>

  </div>


  <!-- GPS -->

  <div class="gps-card glass">

    <div
      id="gpsStatus"
      class="gps-status"
    >
      GPSを待っています
    </div>

    <button
      class="gps-button"
      onclick="startGPS()"
    >
      GPSを開始
    </button>

  </div>

</div>


<script>
/* =========================================================
   駅データ
========================================================= */

/*

  普通列車：

  久大 大分〜日田

  特急：
  ソニック・ゆふいんの森
*/

/* =========================================================
   特急ソニック
========================================================= */

/*
  停車パターンを号数から選択。

  実際の列車は号数によって
  行先・停車駅が異なるため、
  号数を入力すると対応するパターンを作る。
*/

const sonicPatterns = {

  /*
   * 博多〜大分系統
   */

  hakataOita: [
    "博多",
    "吉塚",
    "香椎",
    "赤間",
    "折尾",
    "黒崎",
    "小倉",
    "行橋",
    "中津",
    "宇佐",
    "杵築",
    "別府",
    "大分"
  ],

  /*
   * 主要停車
   */

  hakataOitaFast: [
    "博多",
    "折尾",
    "黒崎",
    "小倉",
    "行橋",
    "中津",
    "別府",
    "大分"
  ],

  /*
   * 佐伯方面
   */

  hakataSaiki: [
    "博多",
    "折尾",
    "黒崎",
    "小倉",
    "行橋",
    "中津",
    "杵築",
    "別府",
    "大分",
    "鶴崎",
    "大在",
    "坂ノ市",
    "幸崎",
    "佐伯"
  ]
};


/*
 * 号数ごとの行先
 *
 * 2026年7月時刻表データを参考に設定。
 */

function getSonicInfo(number) {

  number = Number(number);

  /*
   * 佐伯行
   */

  if (number === 41) {

    return {
      destination: "佐伯行き",
      stations: sonicPatterns.hakataSaiki
    };

  }

  /*
   * 博多方面
   */

  if (
    number >= 2 &&
    number <= 102 &&
    number % 2 === 0
  ) {

    return {
      destination: "博多行き",
      stations: sonicPatterns.hakataOitaFast
    };

  }

  /*
   * 大分方面
   */

  return {
    destination: "大分行き",
    stations: sonicPatterns.hakataOita
  };
}


/* =========================================================
   ゆふいんの森
========================================================= */

const yufuinData = {

    stations: [

  },

  2: {
    destination: "博多行き",
    stations: [

/* =========================================================
   現在列車
========================================================= */

let currentTrain = null;

let stations = [];

let currentStationIndex = 0;

let watchId = null;

let lastPosition = null;

let testMode = false;

let touchTimes = [];


/* =========================================================
   3連続タッチ → TEST MODE
========================================================= */

document.addEventListener(
  "touchstart",
  () => {

    const now = Date.now();

    touchTimes.push(now);

    touchTimes =
      touchTimes.filter(
        t => now - t < 1000
      );

    if (
      touchTimes.length >= 3
    ) {

      testMode = !testMode;

      document.body.classList.toggle(
        "test-mode",
        testMode
      );

      touchTimes = [];

    }

  },
  {
    passive: true
  }
);


/* =========================================================
   種別変更
========================================================= */

document.getElementById(
  "trainType"
).addEventListener(
  "change",
  function() {

    const type = this.value;

    document.getElementById(
      "numberArea"
    ).style.display =
      type === "local"
        ? "none"
        : "block";

    document.getElementById(
      "localArea"
    ).style.display =
      type === "local"
        ? "block"
        : "none";

  }
);


/* =========================================================
   列車開始
========================================================= */

function launchTrain() {

  const type =
    document.getElementById(
      "trainType"
    ).value;


  /*
   * ソニック
   */

  if (type === "sonic") {

    const number =
      Number(
        document.getElementById(
          "trainNumber"
        ).value
      );

    if (!number) {

      alert("ソニックの号数を入力してね");

      return;

    }

    const info =
      getSonicInfo(number);

    currentTrain = {
      type: "sonic",
      number,
      name: "特急ソニック",
      destination: info.destination
    };

    stations =
      createStationObjects(
        info.stations
      );

  }


  /*
   * ゆふ森
   */

  else if (type === "yufuin") {

    const number =
      Number(
        document.getElementById(
          "trainNumber"
        ).value
      );

    if (
      !yufuinData[number]
    ) {

      alert(
        "ゆふいんの森は1〜6号を入力してね"
      );

      return;

    }

    const info =
      yufuinData[number];

    currentTrain = {
      type: "yufuin",
      number,
      name: "特急ゆふいんの森",
      destination: info.destination
    };

    stations =
      createStationObjects(
        info.stations
      );

  }


  /*
   * 普通
   */

  else {

    const route =
      document.getElementById(
        "localRoute"
      ).value;

    let data;

    if (
      route === "nippo_down"
    ) {

      data =
        stationData.nakatsuOitaSaiki;

    }

    else if (
      route === "nippo_up"
    ) {

      data =
        [
          ...stationData.nakatsuOitaSaiki
        ].reverse();

    }

    else if (
      route === "kyudai_down"
    ) {

      data =
        stationData.oitaHita;

    }

    else if (
      route === "kyudai_up"
    ) {

      data =
        [
          ...stationData.oitaHita
        ].reverse();

    }

    else if (
      route === "hohi_down"
    ) {

      data =
        stationData.oitaMiyaji;

    }

    else {

      data =
        [
          ...stationData.oitaMiyaji
        ].reverse();

    }


    stations =
      data.map(
        s => ({
          name: s[0],
          lat: s[1],
          lon: s[2]
        })
      );


    currentTrain = {
      type: "local",
      number: null,
      name: "普通列車",
      destination:
        stations[
          stations.length - 1
        ].name + "行き"
    };

  }


  currentStationIndex = 0;

  document.getElementById(
    "startScreen"
  ).style.display = "none";

  document.getElementById(
    "mainScreen"
  ).style.display = "block";


  updateHeader();

  renderStations();

  startGPS();

}


/* =========================================================
   駅オブジェクト生成
========================================================= */

function createStationObjects(
  names
) {

  /*
   * 特急駅はGPS判定用に
   * 実在駅座標を一部利用。
   *
   * 座標がない駅は
   * 名前だけでも表示可能。
   */

  return names.map(
    name => {

      const found =
        findKnownStation(name);

      return {

        name,

        lat:
          found
            ? found.lat
            : null,

        lon:
          found
            ? found.lon
            : null

      };

    }
  );

}


/* =========================================================
   駅座標検索
========================================================= */

function findKnownStation(
  name
) {

  const all = [

    ...stationData.nakatsuOitaSaiki,

    ...stationData.oitaHita,

    ...stationData.oitaMiyaji

  ];


  const found =
    all.find(
      s => s[0] === name
    );


  if (!found) {

    const known = {

      "博多": [33.5898,130.4208],
      "吉塚": [33.6070,130.4250],
      "香椎": [33.6580,130.4400],
      "赤間": [33.8080,130.5720],
      "折尾": [33.8650,130.7080],
      "黒崎": [33.8660,130.7660],
      "小倉": [33.8860,130.8820],
      "行橋": [33.7308,130.9588],
      "佐伯": [32.9600,131.9000],
      "鳥栖": [33.3740,130.5180],
      "久留米": [33.3190,130.5010]
    };


    if (
      known[name]
    ) {

      return {
        lat: known[name][0],
        lon: known[name][1]
      };

    }

  }


  if (found) {

    return {
      lat: found[1],
      lon: found[2]
    };

  }

  return null;

}

   ヘッダー更新
========================================================= */

function updateHeader() {

  document.getElementById(

  document.getElementById(

  document.getElementById(

/* =========================================================
   4駅表示
========================================================= */

function renderStations() {

  const board =
    document.getElementById(
      "stationBoard"
    );

  board.innerHTML = "";


  /*
   * 現在の次駅から4駅
   */

  for (
    let i = 0;
    i < 4;
    i++
  ) {

    const index =
      currentStationIndex + i;

    const arrow =
      document.createElement(
        "div"
      );

    arrow.className =
      "arrow";


    if (
      i < 3 &&
      index < stations.length - 1
    ) {

      arrow.textContent = "＞";

      arrow.classList.add(
        "visible"
      );

    }


    board.appendChild(arrow);


    const col =
      document.createElement(
        "div"
      );

    col.className =
      "station-column";


    if (
      index >= stations.length
    ) {

      col.classList.add(
        "empty"
      );

      const span =
        document.createElement(
          "span"
        );

      span.textContent = "";

      col.appendChild(span);

      board.appendChild(col);

      continue;

    }


    const span =
      document.createElement(
        "span"
      );

    span.textContent =
      stations[index].name;


    if (
      i === 0
    ) {

      col.classList.add(
        "current"
      );

    }


    col.appendChild(span);

    board.appendChild(col);

  }

}


/* =========================================================
   距離計算
========================================================= */

function distanceBetween(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R = 6371000;

  const rad =
    Math.PI / 180;

  const dLat =
    (lat2 - lat1) * rad;

  const dLon =
    (lon2 - lon1) * rad;


  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * rad) *
    Math.cos(lat2 * rad) *
    Math.sin(dLon / 2) ** 2;


  return (
    R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    )
  );

}


/* =========================================================
   GPS開始
========================================================= */

function startGPS() {

  if (
    testMode
  ) {

    document.getElementById(
      "gpsStatus"
    ).textContent =
      "テストモード";

    return;

  }


  if (
    !navigator.geolocation
  ) {

    document.getElementById(
      "gpsStatus"
    ).textContent =
      "GPSを利用できません";

    return;

  }


  if (
    watchId !== null
  ) {

    return;

  }


  document.getElementById(
    "gpsStatus"
  ).textContent =
    "GPS取得中...";


  watchId =
    navigator.geolocation.watchPosition(

      updateGPS,

      gpsError,

      {
        enableHighAccuracy: true,
        maximumAge: 1000,
        timeout: 10000
      }

    );

}


/* =========================================================
   GPS更新
========================================================= */

function updateGPS(
  position
) {

  const lat =
    position.coords.latitude;

  const lon =
    position.coords.longitude;


  let speed =
    position.coords.speed;


  if (
    speed !== null &&
    !isNaN(speed)
  ) {

    speed =
      Math.max(
        0,
        speed * 3.6
      );

  }

  else {

    speed = 0;

  }


  document.getElementById(
    "speed"
  ).textContent =
    Math.round(speed);


  /*
   * 最寄り駅判定
   */

  let nearest =
    Infinity;

  let nearestIndex =
    currentStationIndex;


  for (
    let i = 0;
    i < stations.length;
    i++
  ) {

    if (
      stations[i].lat === null
    ) {

      continue;

    }


    const d =
      distanceBetween(
        lat,
        lon,
        stations[i].lat,
        stations[i].lon
      );


    if (
      d < nearest
    ) {

      nearest = d;

      nearestIndex = i;

    }

  }


  /*
   * 駅に近づいたら
   * 速度が落ちてから次駅へ
   */

  if (
    nearestIndex >
    currentStationIndex
  ) {

    if (
      speed <= 35 ||
      nearest < 250
    ) {

      currentStationIndex =
        nearestIndex;

      renderStations();

    }

  }


  updateProgress(
    lat,
    lon
  );


  document.getElementById(
    "gpsStatus"
  ).textContent =
    "GPS接続中";

}


/* =========================================================
   進行バー
========================================================= */

function updateProgress(
  lat,
  lon
) {

  const current =
    stations[
      currentStationIndex
    ];

  const next =
    stations[
      currentStationIndex + 1
    ];


  if (
    !next
  ) {

    showArrival();

    return;

  }


  if (
    current.lat === null ||
    next.lat === null
  ) {

    return;

  }


  const total =
    distanceBetween(
      current.lat,
      current.lon,
      next.lat,
      next.lon
    );


  const remaining =
    distanceBetween(
      lat,
      lon,
      next.lat,
      next.lon
    );


  let progress =
    1 -
    remaining / total;


  progress =
    Math.max(
      0,
      Math.min(
        1,
        progress
      )
    );


  document.getElementById(
    "progressFill"
  ).style.width =
    (
      progress * 100
    ) + "%";


  document.getElementById(
    "distance"
  ).textContent =
    next.name +
    "まであと " +
    (
      remaining / 1000
    ).toFixed(1) +
    " km";


  document.getElementById(
    "sectionName"
  ).textContent =
    current.name +
    " → " +
    next.name;


  document.getElementById(
    "nextInfo"
  ).textContent =
    "次の停車駅　" +
    next.name;

}


/* =========================================================
   テストモード
========================================================= */

function testAdvance() {

  if (
    !testMode
  ) {

    return;

  }


  if (
    currentStationIndex <
    stations.length - 1
  ) {

    currentStationIndex++;

    renderStations();

    /*
     * 次駅を押したら
     * メーターをランダムに貯める
     */

    const random =
      35 +
      Math.random() * 60;


    document.getElementById(
      "progressFill"
    ).style.width =
      random + "%";


    document.getElementById(
      "distance"
    ).textContent =
      stations[
        currentStationIndex + 1
      ]
        ? stations[
            currentStationIndex + 1
          ].name +
          "まであと " +
          (
            Math.random() * 10
          ).toFixed(1) +
          " km"
        : "終点";


    document.getElementById(
      "speed"
    ).textContent =
      Math.floor(
        Math.random() * 80
      );

  }

  else {

    showArrival();

  }

}


/* =========================================================
   次の駅
========================================================= */

function nextStation() {

  if (
    testMode
  ) {

    testAdvance();

    return;

  }


  if (
    currentStationIndex <
    stations.length - 1
  ) {

    currentStationIndex++;

    renderStations();

  }

}


/* =========================================================
   前の駅
========================================================= */

function previousStation() {

  if (
    currentStationIndex > 0
  ) {

    currentStationIndex--;

    renderStations();

    document.getElementById(
      "progressFill"
    ).style.width =
      "0%";

  }

}


/* =========================================================
   到着
========================================================= */

function showArrival() {

  currentStationIndex =
    stations.length - 1;


  renderStations();


  document.getElementById(
    "speed"
  ).textContent =
    "0";


  document.getElementById(
    "progressFill"
  ).style.width =
    "100%";


  document.getElementById(
    "distance"
  ).textContent =
    "終点";


  document.getElementById(
    "sectionName"
  ).textContent =
    stations[
      stations.length - 1
    ].name;


  document.getElementById(
    "nextInfo"
  ).textContent =
    "終点に到着しました";


  document.getElementById(
    "gpsStatus"
  ).textContent =
    "到着";

}


/* =========================================================
   GPSエラー
========================================================= */

function gpsError(
  error
) {

  let message =
    "GPSを取得できません";


  if (
    error.code === 1
  ) {

    message =
      "位置情報の使用を許可してください";

  }

  else if (
    error.code === 2
  ) {

    message =
      "現在地を取得できません";

  }

  else if (
    error.code === 3
  ) {

    message =
      "GPS取得がタイムアウトしました";

  }


  document.getElementById(
    "gpsStatus"
  ).textContent =
    message;

}


/* =========================================================
   TEST MODE ボタン処理
   画面上の「次の駅」ボタンを
   テストモードではランダムメーター化
========================================================= */

const originalNext =
  document.querySelectorAll(
    ".control-button"
  )[1];

originalNext.addEventListener(
  "click",
  function(e) {

    e.stopPropagation();

    if (
      testMode
    ) {

      testAdvance();

    }

  },
  true
);

document.getElementById(
