<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1,
           maximum-scale=1,
           viewport-fit=cover"
>

<meta name="theme-color" content="#090a0d">

<title>Train Destination</title>

<style>

/* =========================================
   RESET
========================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 15% 5%,
            rgba(255,255,255,.16),
            transparent 32%
        ),
        radial-gradient(
            circle at 90% 25%,
            rgba(100,160,255,.12),
            transparent 32%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(255,255,255,.09),
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #08090c,
            #17191e,
            #08090c
        );
}


/* =========================================
   APP
========================================= */

.app {
    width: 100%;
    height: 100dvh;

    max-width: 650px;

    margin: 0 auto;

    padding:
        calc(10px + env(safe-area-inset-top))
        14px
        calc(10px + env(safe-area-inset-bottom));

    display: flex;
    flex-direction: column;

    gap: 9px;
}


/* =========================================
   GLASS
========================================= */

.glass {
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.145),
            rgba(255,255,255,.045)
        );

    border:
        1px solid
        rgba(255,255,255,.17);

    box-shadow:
        inset
        0 1px 0
        rgba(255,255,255,.22),

        inset
        0 -1px 0
        rgba(255,255,255,.035),

        0 10px 35px
        rgba(0,0,0,.25);

    backdrop-filter:
        blur(25px)
        saturate(150%);

    -webkit-backdrop-filter:
        blur(25px)
        saturate(150%);
}


/* =========================================
   HEADER
========================================= */

.header {
    flex: 0 0 auto;

    padding:
        12px
        16px;

    border-radius: 21px;
}

.train-type {
    font-size: 12px;

    color:
        rgba(255,255,255,.53);

    line-height: 1;
}

.destination {
    margin-top: 3px;

    font-size: 25px;

    font-weight: 750;

    letter-spacing: -1px;
}


/* =========================================
   SPEED
========================================= */

.speed-card {
    flex: 0 0 auto;

    padding:
        11px
        16px;

    border-radius: 21px;
}

.label {
    font-size: 11px;

    color:
        rgba(255,255,255,.47);

    margin-bottom: 2px;
}

.speed-row {
    display: flex;
    align-items: baseline;
}

.speed {
    font-size: 52px;

    line-height: .86;

    font-weight: 750;

    letter-spacing: -3px;

    font-variant-numeric:
        tabular-nums;
}

.unit {
    margin-left: 6px;

    font-size: 14px;

    color:
        rgba(255,255,255,.5);
}


/* =========================================
   POSITION
========================================= */

.position-card {
    flex: 0 0 auto;

    padding:
        13px
        16px;

    border-radius: 21px;
}

.station-row {
    display: flex;

    justify-content: space-between;
    align-items: center;

    gap: 10px;
}

.station {
    font-size: 16px;

    font-weight: 700;

    white-space: nowrap;
}

.station.right {
    text-align: right;
}


/* =========================================
   PROGRESS BAR
========================================= */

.progress {
    position: relative;

    width: 100%;
    height: 17px;

    margin-top: 10px;

    border-radius: 999px;

    overflow: hidden;

    background:
        rgba(255,255,255,.09);

    border:
        1px solid
        rgba(255,255,255,.11);
}

.progress-fill {
    position: absolute;

    left: 0;
    top: 0;

    width: 0%;
    height: 100%;

    border-radius: 999px;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.48),
            rgba(255,255,255,.98)
        );

    box-shadow:
        0 0 14px
        rgba(255,255,255,.28);

    transition:
        width .6s ease-out;
}

.distance {
    margin-top: 7px;

    text-align: right;

    font-size: 12px;

    color:
        rgba(255,255,255,.65);

    font-variant-numeric:
        tabular-nums;
}


/* =========================================
   SECTION
========================================= */

.section-card {
    flex: 0 0 auto;

    padding:
        12px
        16px;

    border-radius: 21px;
}

.section-title {
    font-size: 11px;

    color:
        rgba(255,255,255,.44);
}

.section-name {
    margin-top: 2px;

    font-size: 19px;

    font-weight: 720;

    letter-spacing: -.4px;
}

.next {
    margin-top: 3px;

    font-size: 12px;

    color:
        rgba(255,255,255,.53);
}


/* =========================================
   GPS
========================================= */

.gps-card {
    flex: 0 0 auto;

    padding:
        10px
        14px;

    border-radius: 18px;

    display: flex;

    justify-content: space-between;
    align-items: center;
}

.gps-left {
    display: flex;

    align-items: center;

    gap: 8px;
}

.gps-dot {
    width: 7px;
    height: 7px;

    flex: 0 0 auto;

    border-radius: 50%;

    background: #666;
}

.gps-dot.active {
    background: #fff;

    box-shadow:
        0 0 10px
        rgba(255,255,255,.8);
}

.gps-text {
    font-size: 11px;

    color:
        rgba(255,255,255,.58);
}

.accuracy {
    font-size: 10px;

    color:
        rgba(255,255,255,.38);

    font-variant-numeric:
        tabular-nums;
}


/* =========================================
   BUTTON
========================================= */

.gps-button {
    flex: 0 0 auto;

    width: 100%;

    padding: 12px;

    border: none;

    border-radius: 18px;

    color: #111;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.98),
            rgba(255,255,255,.78)
        );

    font-size: 14px;

    font-weight: 650;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.25);
}

.gps-button:active {
    transform: scale(.985);
}


/* =========================================
   ARRIVAL
========================================= */

.arrival {
    display: none;

    flex: 0 0 auto;

    padding: 15px;

    border-radius: 21px;

    text-align: center;
}

.arrival.show {
    display: block;
}

.arrival-title {
    font-size: 11px;

    color:
        rgba(255,255,255,.48);
}

.arrival-name {
    margin-top: 2px;

    font-size: 25px;

    font-weight: 750;
}


/* =========================================
   iPhone 13 Pro
   390 × 844 対策
========================================= */

@media (
    max-height: 850px
) {

    .app {
        gap: 7px;

        padding-top:
            calc(
                7px +
                env(safe-area-inset-top)
            );

        padding-bottom:
            calc(
                7px +
                env(safe-area-inset-bottom)
            );
    }

    .header {
        padding: 10px 15px;
    }

    .destination {
        font-size: 23px;
    }

    .speed-card {
        padding: 9px 15px;
    }

    .speed {
        font-size: 48px;
    }

    .position-card {
        padding: 11px 15px;
    }

    .section-card {
        padding: 10px 15px;
    }

    .gps-card {
        padding: 8px 13px;
    }

    .gps-button {
        padding: 11px;
    }
}


/* =========================================
   さらに小さい高さ
========================================= */

@media (
    max-height: 730px
) {

    .app {
        gap: 5px;
    }

    .speed {
        font-size: 43px;
    }

    .header,
    .speed-card,
    .position-card,
    .section-card {
        padding-top: 8px;
        padding-bottom: 8px;
    }

    .progress {
        height: 15px;
        margin-top: 7px;
    }

}

</style>
</head>


<body>

<div class="app">


    <!-- =====================================
         HEADER
    ====================================== -->

    <div class="header glass">

        <div class="train-type">
            普通列車
        </div>

        <div class="destination">
            行橋行
        </div>

    </div>


    <!-- =====================================
         SPEED
    ====================================== -->

    <div class="speed-card glass">

        <div class="label">
            速度
        </div>

        <div class="speed-row">

            <span
                id="speed"
                class="speed"
            >
                --
            </span>

            <span class="unit">
                km/h
            </span>

        </div>

    </div>


    <!-- =====================================
         POSITION
    ====================================== -->

    <div class="position-card glass">

        <div class="label">
            列車位置
        </div>

        <div class="station-row">

            <div
                id="fromStation"
                class="station"
            >
                豊前善光寺
            </div>

            <div
                id="toStation"
                class="station right"
            >
                天津
            </div>

        </div>


        <div class="progress">

            <div
                id="progressFill"
                class="progress-fill"
            ></div>

        </div>


        <div
            id="distance"
            class="distance"
        >
            GPS取得中...
        </div>

    </div>


    <!-- =====================================
         SECTION
    ====================================== -->

    <div class="section-card glass">

        <div class="section-title">
            現在走行区間
        </div>

        <div
            id="sectionName"
            class="section-name"
        >
            豊前善光寺 → 天津
        </div>

        <div
            id="next"
            class="next"
        >
            次は「天津」です
        </div>

    </div>


    <!-- =====================================
         GPS
    ====================================== -->

    <div class="gps-card glass">

        <div class="gps-left">

            <div
                id="gpsDot"
                class="gps-dot"
            ></div>

            <div
                id="gpsText"
                class="gps-text"
            >
                GPS待機中
            </div>

        </div>

        <div
            id="accuracy"
            class="accuracy"
        >
            -- m
        </div>

    </div>


    <button
        class="gps-button"
        onclick="startGPS()"
    >
        GPSを開始
    </button>


    <!-- =====================================
         ARRIVAL
    ====================================== -->

    <div
        id="arrival"
        class="arrival glass"
    >

        <div class="arrival-title">
            終点到着
        </div>

        <div class="arrival-name">
            行橋
        </div>

    </div>


</div>


<script>

/*
==================================================
   豊前善光寺 → 行橋
   普通列車

   停車駅

   豊前善光寺
   ↓
   天津
   ↓
   今津
   ↓
   東中津
   ↓
   中津
   ↓
   吉富
   ↓
   三毛門
   ↓
   宇島
   ↓
   豊前松江
   ↓
   椎田
   ↓
   築城
   ↓
   新田原
   ↓
   南行橋
   ↓
   行橋
==================================================
*/


const stations = [

    {
        name: "豊前善光寺",
        lat: 33.5664462,
        lon: 131.3229872
    },

    {
        name: "天津",
        lat: 33.5646518,
        lon: 131.2931969
    },

    {
        name: "今津",
        lat: 33.5719364,
        lon: 131.2676687
    },

    {
        name: "東中津",
        lat: 33.5876661,
        lon: 131.2389301
    },

    {
        name: "中津",
        lat: 33.5991369,
        lon: 131.1909351
    },

    {
        name: "吉富",
        lat: 33.6048309,
        lon: 131.1735756
    },

    {
        name: "三毛門",
        lat: 33.6147369,
        lon: 131.1553124
    },

    {
        name: "宇島",
        lat: 33.6212411,
        lon: 131.1264123
    },

    {
        name: "豊前松江",
        lat: 33.6224544,
        lon: 131.0952661
    },

    {
        name: "椎田",
        lat: 33.6534281,
        lon: 131.0578436
    },

    {
        name: "築城",
        lat: 33.6731005,
        lon: 131.0378479
    },

    {
        name: "新田原",
        lat: 33.6952063,
        lon: 131.0082270
    },

    {
        name: "南行橋",
        lat: 33.7162864,
        lon: 130.9811458
    },

    {
        name: "行橋",
        lat: 33.7287286,
        lon: 130.9709038
    }

];


/*
==================================================
   GPS設定
==================================================
*/


let watchId = null;


/*
   現在の駅間

   0 =
   豊前善光寺 → 天津

   1 =
   天津 → 今津

   ...
*/

let currentSection = 0;


/*
   GPSの前回位置
*/

let lastGPS = null;


/*
   GPS精度が悪いときの上限

   iPhoneでは20m前後ならかなり良好。
   60m以上は一旦無視。
*/

const MAX_ACCURACY = 60;


/*
   駅到着判定

   駅から80m以内で
   次の駅へ切り替える。
*/

const ARRIVAL_RADIUS = 80;


/*
==================================================
   距離計算
==================================================
*/

function getDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R = 6371000;

    const rad =
        Math.PI / 180;

    const dLat =
        (lat2 - lat1) * rad;

    const dLon =
        (lon2 - lon1) * rad;


    const a =

        Math.sin(dLat / 2) ** 2 +

        Math.cos(lat1 * rad) *
        Math.cos(lat2 * rad) *

        Math.sin(dLon / 2) ** 2;


    const c =

        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );


    return R * c;

}


/*
==================================================
   GPS開始
==================================================
*/

function startGPS() {

    if (
        !navigator.geolocation
    ) {

        setGPSStatus(
            "GPS非対応",
            false
        );

        return;
    }


    if (
        watchId !== null
    ) {

        return;
    }


    setGPSStatus(
        "GPS取得中...",
        false
    );


    watchId =
        navigator.geolocation.watchPosition(

            updateGPS,

            gpsError,

            {

                /*
                   iPhoneの高精度測位
                */

                enableHighAccuracy:
                    true,

                /*
                   キャッシュを使わない
                */

                maximumAge:
                    0,

                /*
                   最大15秒
                */

                timeout:
                    15000

            }

        );

}


/*
==================================================
   GPS更新
==================================================
*/

function updateGPS(
    position
) {

    const coords =
        position.coords;


    const lat =
        coords.latitude;

    const lon =
        coords.longitude;


    const accuracy =
        coords.accuracy;


    /*
       精度表示
    */

    document.getElementById(
        "accuracy"
    ).textContent =

        Math.round(
            accuracy
        ) + " m";


    /*
       精度が悪すぎる場合は
       バーを更新しない
    */

    if (
        accuracy >
        MAX_ACCURACY
    ) {

        setGPSStatus(
            "GPS精度低下中",
            false
        );

        return;
    }


    /*
       速度
    */

    let speed =
        coords.speed;


    /*
       iPhoneから速度が取れない場合は
       GPS差分から計算
    */

    if (
        speed === null ||
        speed === undefined ||
        Number.isNaN(speed)
    ) {

        speed =
            calculateSpeed(
                lat,
                lon,
                position.timestamp
            );

    }

    else {

        speed =
            speed * 3.6;

    }


    /*
       異常な速度を防ぐ
    */

    if (
        !Number.isFinite(speed) ||
        speed < 0
    ) {

        speed = 0;

    }


    document.getElementById(
        "speed"
    ).textContent =

        Math.round(speed);


    /*
       現在の次駅
    */

    const nextStation =
        stations[
            currentSection + 1
        ];


    /*
       次駅まで
    */

    const remaining =
        getDistance(
            lat,
            lon,
            nextStation.lat,
            nextStation.lon
        );


    /*
       次駅到着判定
    */

    if (
        remaining <=
        ARRIVAL_RADIUS
    ) {

        /*
           行橋ではない
        */

        if (
            currentSection <
            stations.length - 2
        ) {

            currentSection++;

            updateStationUI();

        }

        else {

            showArrival();

            return;

        }

    }


    /*
       現在区間
    */

    const from =
        stations[
            currentSection
        ];


    const to =
        stations[
            currentSection + 1
        ];


    /*
       駅間の直線距離
    */

    const total =
        getDistance(
            from.lat,
            from.lon,
            to.lat,
            to.lon
        );


    /*
       次駅まで
    */

    const remain =
        getDistance(
            lat,
            lon,
            to.lat,
            to.lon
        );


    /*
       進行率

       0%
       ↓
       100%
    */

    let progress =

        1 -
        (
            remain /
            total
        );


    progress =

        Math.max(
            0,
            Math.min(
                1,
                progress
            )
        );


    /*
       バー
    */

    document.getElementById(
        "progressFill"
    ).style.width =

        (
            progress * 100
        ) + "%";


    /*
       距離表示
    */

    if (
        remain < 100
    ) {

        document.getElementById(
            "distance"
        ).textContent =

            to.name +
            " まもなく";

    }

    else {

        document.getElementById(
            "distance"
        ).textContent =

            to.name +
            "まであと " +

            (
                remain / 1000
            ).toFixed(1) +

            " km";

    }


    /*
       GPS状態
    */

    setGPSStatus(
        "GPS接続中",
        true
    );


    /*
       前回GPS
    */

    lastGPS = {

        lat: lat,

        lon: lon,

        time:
            position.timestamp

    };

}


/*
==================================================
   GPS差分から速度計算
==================================================
*/

function calculateSpeed(
    lat,
    lon,
    time
) {

    if (
        !lastGPS
    ) {

        return 0;

    }


    const distanceMoved =
        getDistance(
            lastGPS.lat,
            lastGPS.lon,
            lat,
            lon
        );


    const seconds =
        (
            time -
            lastGPS.time
        ) / 1000;


    if (
        seconds <= 0
    ) {

        return 0;

    }


    return (
        distanceMoved /
        seconds
    ) * 3.6;

}


/*
==================================================
   駅表示更新
==================================================
*/

function updateStationUI() {

    const from =
        stations[
            currentSection
        ];


    const to =
        stations[
            currentSection + 1
        ];


    document.getElementById(
        "fromStation"
    ).textContent =
        from.name;


    document.getElementById(
        "toStation"
    ).textContent =
        to.name;


    document.getElementById(
        "sectionName"
    ).textContent =

        from.name +
        " → " +
        to.name;


    document.getElementById(
        "next"
    ).textContent =

        "次は「" +
        to.name +
        "」です";


    /*
       駅間が切り替わったので
       バーを0%に戻す
    */

    document.getElementById(
        "progressFill"
    ).style.width =
        "0%";


    document.getElementById(
        "distance"
    ).textContent =
        to.name +
        "まであと -- km";

}


/*
==================================================
   GPS表示
==================================================
*/

function setGPSStatus(
    text,
    active
) {

    document.getElementById(
        "gpsText"
    ).textContent =
        text;


    const dot =
        document.getElementById(
            "gpsDot"
        );


    if (
        active
    ) {

        dot.classList.add(
            "active"
        );

    }

    else {

        dot.classList.remove(
            "active"
        );

    }

}


/*
==================================================
   行橋到着
==================================================
*/

function showArrival() {

    document.getElementById(
        "speed"
    ).textContent =
        "0";


    document.getElementById(
        "fromStation"
    ).textContent =
        "行橋";


    document.getElementById(
        "toStation"
    ).textContent =
        "";


    document.getElementById(
        "progressFill"
    ).style.width =
        "100%";


    document.getElementById(
        "distance"
    ).textContent =
        "行橋 到着";


    document.getElementById(
        "sectionName"
    ).textContent =
        "行橋";


    document.getElementById(
        "next"
    ).textContent =
        "終点です";


    document.getElementById(
        "arrival"
    ).classList.add(
        "show"
    );


    setGPSStatus(
        "行橋に到着",
        true
    );

}


/*
==================================================
   GPSエラー
==================================================
*/

function gpsError(
    error
) {

    let message =
        "GPSエラー";


    if (
        error.code === 1
    ) {

        message =
            "位置情報を許可してください";

    }


    if (
        error.code === 2
    ) {

        message =
            "現在地を取得できません";

    }


    if (
        error.code === 3
    ) {

        message =
            "GPS取得がタイムアウトしました";

    }


    setGPSStatus(
        message,
        false
    );

}


/*
==================================================
   初期化
==================================================
*/

updateStationUI();


window.addEventListener(
    "load",
    () => {

        startGPS();

    }
);

</script>

</body>
</html>
