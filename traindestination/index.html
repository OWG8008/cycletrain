<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>鉄道運転モニター</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #080a0f;
    color: #fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Noto Sans JP",
        sans-serif;
}

button {
    font: inherit;
}

.hidden {
    display: none !important;
}

/* =========================
   SETUP
========================= */

.setup {
    min-height: 100vh;
    padding: 22px;
    max-width: 720px;
    margin: auto;
}

.title {
    font-size: 31px;
    font-weight: 900;
    letter-spacing: -1px;
}

.subtitle {
    color: #8e95a3;
    font-size: 14px;
    margin-top: 5px;
    margin-bottom: 22px;
}

.card {
    background: #151820;
    border: 1px solid #252a34;
    border-radius: 23px;
    padding: 20px;
    margin-bottom: 15px;
}

.card-title {
    font-size: 17px;
    font-weight: 800;
    margin-bottom: 14px;
}

/* 列車種別 */

.train-grid {
    display: grid;
    gap: 11px;
}

.train-btn {
    border: 0;
    border-radius: 18px;
    padding: 18px;
    background: #222630;
    color: #fff;
    text-align: left;
    transition: .18s;
}

.train-btn:active,
.choice-btn:active,
.route-btn:active {
    transform: scale(.97);
}

.train-btn.selected {
    background: #315eea;
}

.train-name {
    font-size: 20px;
    font-weight: 900;
}

.train-description {
    margin-top: 5px;
    font-size: 12px;
    color: #a6acb8;
}

.train-btn.selected .train-description {
    color: #e1e7ff;
}

/* 路線 */

.route-grid {
    display: grid;
    gap: 10px;
}

.route-btn {
    border: 0;
    border-radius: 17px;
    padding: 17px;
    background: #222630;
    color: white;
    text-align: left;
}

.route-btn.selected {
    background: #315eea;
}

.route-name {
    font-size: 18px;
    font-weight: 900;
}

.route-detail {
    color: #9299a6;
    font-size: 12px;
    margin-top: 4px;
}

.route-btn.selected .route-detail {
    color: #e1e7ff;
}

/* 選択 */

.question {
    font-size: 18px;
    font-weight: 900;
    margin-bottom: 13px;
}

.choice-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 9px;
}

.choice-btn {
    border: 0;
    border-radius: 15px;
    padding: 15px 8px;
    background: #252a35;
    color: white;
    font-weight: 800;
    transition: .18s;
}

.choice-btn.selected {
    background: #315eea;
}

.selected-info {
    line-height: 1.8;
    color: #a0a6b2;
    font-size: 14px;
}

.selected-info b {
    color: white;
}

.start-btn {
    width: 100%;
    border: 0;
    border-radius: 19px;
    padding: 18px;
    background: #28c76f;
    color: white;
    font-size: 18px;
    font-weight: 900;
}

.start-btn:disabled {
    background: #292e36;
    color: #666d79;
}

/* =========================
   DRIVE
========================= */

.drive {
    min-height: 100vh;
    max-width: 900px;
    margin: auto;
    padding: 13px;
}

.topbar {
    height: 45px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.service {
    display: flex;
    align-items: center;
    gap: 10px;
}

.service-name {
    font-size: 16px;
    font-weight: 900;
}

.service-destination {
    font-size: 12px;
    color: #969daa;
}

.clock {
    font-size: 12px;
    color: #858c99;
}

/* 行先 */

.destination-card {
    background: #151820;
    border-radius: 22px;
    padding: 19px;
    margin-bottom: 12px;
}

.destination-title {
    font-size: 32px;
    font-weight: 900;
    letter-spacing: -1px;
}

.route-text {
    margin-top: 5px;
    color: #9097a4;
    font-size: 13px;
}

/* 駅 */

.station-card {
    background: #151820;
    border-radius: 22px;
    padding: 19px;
    margin-bottom: 12px;
}

.station-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 15px;
}

.station-header strong {
    font-size: 15px;
}

.station-header span {
    font-size: 12px;
    color: #838a97;
}

.station-list {
    display: flex;
    flex-direction: column;
}

.station {
    display: grid;
    grid-template-columns: 32px 1fr;
    min-height: 58px;
    position: relative;
}

.station-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #343a46;
    margin-top: 2px;
    border: 4px solid #151820;
    position: relative;
    z-index: 2;
}

.station-line {
    position: absolute;
    left: 7px;
    top: 18px;
    bottom: -4px;
    width: 4px;
    background: #363c47;
}

.station:last-child .station-line {
    display: none;
}

.station.current .station-dot {
    background: #3977ff;
    box-shadow: 0 0 0 5px rgba(57,119,255,.15);
}

.station.passed .station-dot {
    background: #29c76f;
}

.station-name {
    font-size: 16px;
    font-weight: 800;
}

.station.current .station-name {
    color: #4d83ff;
}

.station-info {
    color: #777f8d;
    font-size: 11px;
    margin-top: 3px;
}

/* =========================
   SPEED
========================= */

.speed-card {
    background: #151820;
    border-radius: 22px;
    padding: 19px;
    margin-bottom: 12px;
}

.speed-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
}

.speed-number {
    font-size: 55px;
    line-height: .9;
    font-weight: 900;
    letter-spacing: -3px;
}

.speed-unit {
    color: #9299a5;
    font-size: 14px;
    margin-left: 5px;
}

.limit {
    text-align: right;
    color: #8e95a1;
    font-size: 11px;
}

.limit strong {
    display: block;
    color: white;
    font-size: 24px;
    margin-top: 2px;
}

/* Apple Musicっぽい角丸メーター */

.meter {
    height: 17px;
    width: 100%;
    margin-top: 20px;
    border-radius: 999px;
    background: #292e38;
    overflow: hidden;
}

.meter-fill {
    width: 0%;
    height: 100%;
    border-radius: 999px;
    background: #4b80ff;
    transition: width .08s linear;
}

/* 操作 */

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
}

.control {
    border: 0;
    border-radius: 17px;
    padding: 16px 10px;
    background: #222630;
    color: white;
    font-weight: 900;
}

.control:active {
    transform: scale(.96);
}

.emergency {
    background: #d93636;
}

.back {
    background: #303541;
}

/* =========================
   ATS
========================= */

.ats {
    position: fixed;
    z-index: 100;
    left: 13px;
    right: 13px;
    bottom: 13px;

    background: rgba(25,28,36,.97);
    border: 1px solid #3c424e;
    border-radius: 18px;

    padding: 13px 15px;

    transform: translateY(140%);
    transition: transform .3s ease;
}

.ats.show {
    transform: translateY(0);
}

.ats-label {
    color: #ffcf45;
    font-size: 11px;
    font-weight: 900;
}

.ats-text {
    margin-top: 3px;
    font-size: 15px;
    font-weight: 900;
}

/* =========================
   ARRIVAL
========================= */

.arrival {
    position: fixed;
    inset: 0;
    z-index: 200;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 25px;

    background: rgba(5,7,10,.97);
}

.arrival-box {
    width: 100%;
    max-width: 420px;
    text-align: center;
}

.arrival-small {
    color: #858c99;
    font-size: 13px;
}

.arrival-title {
    font-size: 43px;
    font-weight: 900;
    margin: 10px 0;
}

.arrival-btn {
    width: 100%;
    margin-top: 20px;
    border: 0;
    border-radius: 18px;
    padding: 17px;
    background: #315eea;
    color: white;
    font-weight: 900;
}

/* =========================
   PC
========================= */

@media (min-width: 700px) {
    .train-grid {
        grid-template-columns: repeat(3, 1fr);
    }

    .choice-grid {
        grid-template-columns: repeat(4, 1fr);
    }
}
</style>
</head>

<body>

<!-- ==================================================
     設定画面
================================================== -->

<section id="setup" class="setup">

    <div class="title">
        列車設定
    </div>

    <div class="subtitle">
        列車種別・路線・終着駅を設定
    </div>


    <!-- 列車種別 -->

    <div class="card">

        <div class="card-title">
            列車種別
        </div>

        <div class="train-grid">

            <button
                class="train-btn"
                data-train="普通"
                onclick="selectTrain('普通')">

                <div class="train-name">
                    普通
                </div>

                <div class="train-description">
                    路線・終着駅を指定
                </div>

            </button>


            <button
                class="train-btn"
                data-train="特急ソニック"
                onclick="selectTrain('特急ソニック')">

                <div class="train-name">
                    特急ソニック
                </div>

                <div class="train-description">
                    博多・大分・佐伯
                </div>

            </button>


            <button
                class="train-btn"
                data-train="特急ゆふいんの森"
                onclick="selectTrain('特急ゆふいんの森')">

                <div class="train-name">
                    特急ゆふいんの森
                </div>

                <div class="train-description">
                    博多・由布院・別府
                </div>

            </button>

        </div>

    </div>


    <!-- 路線 -->

    <div
        id="routeCard"
        class="card hidden">

        <div class="card-title">
            路線選択
        </div>

        <div class="route-grid">

            <button
                class="route-btn"
                data-route="日豊本線"
                onclick="selectRoute('日豊本線')">

                <div class="route-name">
                    日豊本線
                </div>

                <div class="route-detail">
                    中津 ～ 佐伯
                </div>

            </button>


            <button
                class="route-btn"
                data-route="久大本線"
                onclick="selectRoute('久大本線')">

                <div class="route-name">
                    久大本線
                </div>

                <div class="route-detail">
                    大分 ～ 日田
                </div>

            </button>


            <button
                class="route-btn"
                data-route="豊肥本線"
                onclick="selectRoute('豊肥本線')">

                <div class="route-name">
                    豊肥本線
                </div>

                <div class="route-detail">
                    大分 ～ 宮地
                </div>

            </button>

        </div>

    </div>


    <!-- 行き先 -->

    <div
        id="destinationCard"
        class="card hidden">

        <div
            id="destinationQuestion"
            class="question">
            終着駅を選択してください
        </div>

        <div
            id="destinationChoices"
            class="choice-grid">
        </div>

    </div>


    <!-- 現在設定 -->

    <div class="card">

        <div class="card-title">
            現在の設定
        </div>

        <div
            id="selectedInfo"
            class="selected-info">
            列車種別を選択してください
        </div>

    </div>


    <button
        id="startBtn"
        class="start-btn"
        disabled
        onclick="startDrive()">

        運転開始

    </button>

</section>


<!-- ==================================================
     運転画面
================================================== -->

<section
    id="drive"
    class="drive hidden">

    <div class="topbar">

        <div class="service">

            <div
                id="driveTrain"
                class="service-name">
                普通
            </div>

            <div
                id="driveDestinationSmall"
                class="service-destination">
                --
            </div>

        </div>

        <div
            id="clock"
            class="clock">
            00:00:00
        </div>

    </div>


    <!-- 行先 -->

    <div class="destination-card">

        <div
            id="driveDestination"
            class="destination-title">
            --
        </div>

        <div
            id="driveRoute"
            class="route-text">
            --
        </div>

    </div>


    <!-- 駅一覧 -->

    <div class="station-card">

        <div class="station-header">

            <strong>
                駅
            </strong>

            <span id="stationCounter">
                0 / 0
            </span>

        </div>

        <div
            id="stationList"
            class="station-list">
        </div>

    </div>


    <!-- 速度 -->

    <div class="speed-card">

        <div class="speed-row">

            <div>

                <span
                    id="speed"
                    class="speed-number">
                    0
                </span>

                <span class="speed-unit">
                    km/h
                </span>

            </div>


            <div class="limit">

                制限速度

                <strong id="limit">
                    80
                </strong>

            </div>

        </div>


        <div class="meter">

            <div
                id="meter"
                class="meter-fill">
            </div>

        </div>

    </div>


    <!-- 操作 -->

    <div class="controls">

        <button
            class="control"
            onclick="accelerate()">
            加速
        </button>

        <button
            class="control"
            onclick="brake()">
            ブレーキ
        </button>

        <button
            class="control"
            onclick="toggleATS()">
            ATS
        </button>

        <button
            class="control emergency"
            onclick="emergencyBrake()">
            非常ブレーキ
        </button>

        <button
            class="control back"
            onclick="backToSetup()">
            設定に戻る
        </button>

    </div>

</section>


<!-- ==================================================
     ATS
================================================== -->

<div
    id="ats"
    class="ats">

    <div class="ats-label">
        ATS
    </div>

    <div
        id="atsText"
        class="ats-text">
        --
    </div>

</div>


<!-- ==================================================
     到着
================================================== -->

<div
    id="arrival"
    class="arrival hidden">

    <div class="arrival-box">

        <div class="arrival-small">
            列車は終着駅に到着しました
        </div>

        <div
            id="arrivalStation"
            class="arrival-title">
            --
        </div>

        <div class="arrival-small">
            お疲れさまでした
        </div>

        <button
            class="arrival-btn"
            onclick="backToSetup()">
            設定画面へ
        </button>

    </div>

</div>


<script>

/* ==================================================
   路線データ
================================================== */

const routes = {

    "日豊本線": [

        "中津",
        "東中津",
        "今津",
        "天津",
        "豊前善光寺",
        "柳ケ浦",
        "豊前長洲",
        "宇佐",
        "西屋敷",
        "立石",
        "中山香",
        "杵築",
        "大神",
        "日出",
        "暘谷",
        "豊後豊岡",
        "亀川",
        "別府大学",
        "別府",
        "東別府",
        "西大分",
        "大分",
        "牧",
        "高城",
        "鶴崎",
        "大在",
        "坂ノ市",
        "幸崎",
        "佐志生",
        "下ノ江",
        "熊崎",
        "臼杵",
        "上臼杵",
        "津久見",
        "日代",
        "浅海井",
        "狩生",
        "海崎",
        "佐伯"

    ],

    "久大本線": [

        "大分",
        "古国府",
        "南大分",
        "賀来",
        "豊後国分",
        "向之原",
        "鬼瀬",
        "小野屋",
        "天神山",
        "庄内",
        "湯平",
        "南由布",
        "由布院",
        "野矢",
        "豊後中村",
        "引治",
        "恵良",
        "豊後森",
        "北山田",
        "杉河内",
        "天ケ瀬",
        "豊後中川",
        "豊後三芳",
        "日田"

    ],

    "豊肥本線": [

        "大分",
        "滝尾",
        "敷戸",
        "大分大学前",
        "中判田",
        "竹中",
        "犬飼",
        "菅尾",
        "三重町",
        "豊後清川",
        "緒方",
        "朝地",
        "豊後竹田",
        "玉来",
        "豊後荻",
        "滝水",
        "波野",
        "宮地"

    ]

};


/* ==================================================
   特急行き先
================================================== */

const expressDestinations = {

    "特急ソニック": [
        "博多",
        "大分",
        "佐伯"
    ],

    "特急ゆふいんの森": [
        "博多",
        "由布院",
        "別府"
    ]

};


/* ==================================================
   状態
================================================== */

let trainType = null;

let selectedRoute = null;

let destination = null;

let currentStation = 0;

let currentStations = [];

let speed = 0;

let targetSpeed = 0;

let limitSpeed = 80;

let driving = false;

let atsEnabled = true;

let clockStarted = false;


/* ==================================================
   列車種別選択
================================================== */

function selectTrain(type) {

    trainType = type;

    selectedRoute = null;

    destination = null;


    document
        .querySelectorAll(".train-btn")
        .forEach(btn => {

            btn.classList.toggle(
                "selected",
                btn.dataset.train === type
            );

        });


    const routeCard =
        document.getElementById("routeCard");

    const destinationCard =
        document.getElementById("destinationCard");


    routeCard.classList.add("hidden");

    destinationCard.classList.add("hidden");


    if (type === "普通") {

        /*
            普通は

            路線選択
            ↓
            終着駅選択
        */

        routeCard.classList.remove("hidden");

    } else {

        /*
            特急は直接行き先選択
        */

        showExpressDestinations();

    }


    updateSetupInfo();

}


/* ==================================================
   普通：路線選択
================================================== */

function selectRoute(route) {

    selectedRoute = route;

    destination = null;


    document
        .querySelectorAll(".route-btn")
        .forEach(btn => {

            btn.classList.toggle(
                "selected",
                btn.dataset.route === route
            );

        });


    showLocalDestinations();

    updateSetupInfo();

}


/* ==================================================
   普通：終着駅一覧
================================================== */

function showLocalDestinations() {

    const card =
        document.getElementById("destinationCard");

    const question =
        document.getElementById("destinationQuestion");

    const choices =
        document.getElementById("destinationChoices");


    card.classList.remove("hidden");

    question.textContent =
        "終着駅を選択してください";


    choices.innerHTML = "";


    routes[selectedRoute].forEach(
        station => {

            const btn =
                document.createElement("button");

            btn.className =
                "choice-btn";

            btn.textContent =
                station;

            btn.onclick = () =>
                selectDestination(station);

            choices.appendChild(btn);

        }
    );

}


/* ==================================================
   特急：行き先
================================================== */

function showExpressDestinations() {

    const card =
        document.getElementById("destinationCard");

    const question =
        document.getElementById("destinationQuestion");

    const choices =
        document.getElementById("destinationChoices");


    card.classList.remove("hidden");

    question.textContent =
        "どこ行きですか？";


    choices.innerHTML = "";


    expressDestinations[trainType].forEach(
        station => {

            const btn =
                document.createElement("button");

            btn.className =
                "choice-btn";

            btn.textContent =
                station;

            btn.onclick = () =>
                selectDestination(station);

            choices.appendChild(btn);

        }
    );

}


/* ==================================================
   終着駅選択
================================================== */

function selectDestination(station) {

    destination = station;


    document
        .querySelectorAll(".choice-btn")
        .forEach(btn => {

            btn.classList.toggle(
                "selected",
                btn.textContent === station
            );

        });


    updateSetupInfo();

}


/* ==================================================
   設定表示
================================================== */

function updateSetupInfo() {

    const info =
        document.getElementById("selectedInfo");

    const start =
        document.getElementById("startBtn");


    if (!trainType) {

        info.innerHTML =
            "列車種別を選択してください";

        start.disabled = true;

        return;

    }


    if (trainType === "普通") {

        if (!selectedRoute) {

            info.innerHTML =
                "列車：<b>普通</b><br>" +
                "路線：未選択<br>" +
                "終着：未選択";

            start.disabled = true;

            return;

        }


        if (!destination) {

            info.innerHTML =
                "列車：<b>普通</b><br>" +
                "路線：<b>" +
                selectedRoute +
                "</b><br>" +
                "終着：未選択";

            start.disabled = true;

            return;

        }


        info.innerHTML =
            "列車：<b>普通</b><br>" +
            "路線：<b>" +
            selectedRoute +
            "</b><br>" +
            "終着：<b>" +
            destination +
            "</b>";

        start.disabled = false;

        return;

    }


    if (!destination) {

        info.innerHTML =
            "列車：<b>" +
            trainType +
            "</b><br>" +
            "行き先：未選択";

        start.disabled = true;

        return;

    }


    info.innerHTML =
        "列車：<b>" +
        trainType +
        "</b><br>" +
        "行き先：<b>" +
        destination +
        "</b>";

    start.disabled = false;

}


/* ==================================================
   運転開始
================================================== */

function startDrive() {

    if (!trainType || !destination) {
        return;
    }


    /*
        普通
        → 選択した路線から駅を抽出

        選択した駅を終着として、
        路線の始点側から走る。

        例：
        大分 → 佐伯
        中津 → 佐伯
    */

    if (trainType === "普通") {

        currentStations =
            createLocalRoute(
                selectedRoute,
                destination
            );

    } else {

        /*
            特急は簡易的な運行ルートを生成
        */

        currentStations =
            createExpressRoute(
                trainType,
                destination
            );

    }


    if (
        !currentStations ||
        currentStations.length < 2
    ) {

        alert(
            "この区間の運転ルートを作成できません。"
        );

        return;

    }


    currentStation = 0;

    speed = 0;

    targetSpeed = 0;

    driving = true;


    document
        .getElementById("setup")
        .classList.add("hidden");

    document
        .getElementById("drive")
        .classList.remove("hidden");

    document
        .getElementById("arrival")
        .classList.add("hidden");


    document
        .getElementById("driveTrain")
        .textContent =
        trainType;


    document
        .getElementById("driveDestinationSmall")
        .textContent =
        destination + "行";


    document
        .getElementById("driveDestination")
        .textContent =
        destination + "行き";


    updateRouteText();

    renderStations();

    updateStation();


    showATS(
        "運転を開始します"
    );

}


/* ==================================================
   普通列車ルート
================================================== */

function createLocalRoute(
    routeName,
    destinationName
) {

    const route =
        routes[routeName];


    if (!route) {
        return [];
    }


    const destinationIndex =
        route.indexOf(destinationName);


    if (destinationIndex === -1) {
        return [];
    }


    /*
        路線の始点から
        選択された終着駅まで
    */

    return route.slice(
        0,
        destinationIndex + 1
    );

}


/* ==================================================
   特急ルート
================================================== */

function createExpressRoute(
    type,
    destinationName
) {

    if (type === "特急ソニック") {

        if (destinationName === "博多") {

            return [
                "大分",
                "別府",
                "杵築",
                "中津",
                "行橋",
                "小倉",
                "黒崎",
                "折尾",
                "博多"
            ];

        }


        if (destinationName === "大分") {

            return [
                "博多",
                "折尾",
                "黒崎",
                "小倉",
                "行橋",
                "中津",
                "杵築",
                "別府",
                "大分"
            ];

        }


        if (destinationName === "佐伯") {

            return [
                "博多",
                "小倉",
                "行橋",
                "中津",
                "杵築",
                "別府",
                "大分",
                "臼杵",
                "津久見",
                "佐伯"
            ];

        }

    }


    if (
        type === "特急ゆふいんの森"
    ) {

        if (destinationName === "博多") {

            return [
                "由布院",
                "日田",
                "久留米",
                "鳥栖",
                "博多"
            ];

        }


        if (destinationName === "由布院") {

            return [
                "博多",
                "鳥栖",
                "久留米",
                "日田",
                "由布院"
            ];

        }


        if (destinationName === "別府") {

            return [
                "博多",
                "久留米",
                "日田",
                "由布院",
                "別府"
            ];

        }

    }


    return [];
}


/* ==================================================
   ルート表示
================================================== */

function updateRouteText() {

    let text = "";


    if (trainType === "普通") {

        text =
            selectedRoute +
            "　" +
            currentStations[0] +
            " → " +
            destination;

    }


    if (trainType === "特急ソニック") {

        text =
            "日豊本線　" +
            currentStations[0] +
            " → " +
            destination;

    }


    if (
        trainType === "特急ゆふいんの森"
    ) {

        text =
            "久大本線　" +
            currentStations[0] +
            " → " +
            destination;

    }


    document
        .getElementById("driveRoute")
        .textContent =
        text;

}


/* ==================================================
   駅表示
================================================== */

function renderStations() {

    const list =
        document.getElementById("stationList");

    list.innerHTML = "";


    /*
        現在駅を中心に
        前後2駅だけ表示
    */

    const start =
        Math.max(
            0,
            currentStation - 2
        );


    const end =
        Math.min(
            currentStations.length,
            currentStation + 3
        );


    for (
        let i = start;
        i < end;
        i++
    ) {

        const station =
            document.createElement("div");

        station.className =
            "station";


        if (i === currentStation) {

            station.classList.add(
                "current"
            );

        }


        if (i < currentStation) {

            station.classList.add(
                "passed"
            );

        }


        station.innerHTML = `

            <div>

                <div class="station-dot"></div>

                <div class="station-line"></div>

            </div>

            <div>

                <div class="station-name">
                    ${currentStations[i]}
                </div>

                <div class="station-info">

                    ${
                        i === currentStation
                        ? "現在駅"
                        : i < currentStation
                        ? "通過済み"
                        : "次駅"
                    }

                </div>

            </div>

        `;


        list.appendChild(station);

    }


    document
        .getElementById("stationCounter")
        .textContent =
        `${currentStation + 1} / ${currentStations.length}`;

}


/* ==================================================
   駅更新
================================================== */

function updateStation() {

    renderStations();


    if (
        currentStation >=
        currentStations.length - 1
    ) {

        arrive();

        return;

    }


    limitSpeed =
        getLimitSpeed(
            currentStation
        );


    document
        .getElementById("limit")
        .textContent =
        limitSpeed;


    if (atsEnabled) {

        showATS(
            currentStations[
                currentStation + 1
            ] + " 接近"
        );

    }

}


/* ==================================================
   制限速度
================================================== */

function getLimitSpeed(index) {

    if (index % 7 === 0) {
        return 60;
    }

    if (index % 5 === 0) {
        return 70;
    }

    return 100;

}


/* ==================================================
   加速
================================================== */

function accelerate() {

    if (!driving) return;

    targetSpeed += 10;

    targetSpeed =
        Math.min(
            targetSpeed,
            130
        );

}


/* ==================================================
   ブレーキ
================================================== */

function brake() {

    if (!driving) return;

    targetSpeed -= 20;

    targetSpeed =
        Math.max(
            targetSpeed,
            0
        );

}


/* ==================================================
   非常ブレーキ
================================================== */

function emergencyBrake() {

    targetSpeed = 0;

    showATS(
        "非常ブレーキ"
    );

}


/* ==================================================
   ATS
================================================== */

function showATS(message) {

    if (!atsEnabled) {
        return;
    }


    const ats =
        document.getElementById("ats");

    document
        .getElementById("atsText")
        .textContent =
        message;


    ats.classList.add("show");


    clearTimeout(
        window.atsTimeout
    );


    window.atsTimeout =
        setTimeout(() => {

            ats.classList.remove(
                "show"
            );

        }, 4000);

}


/* ==================================================
   ATS ON/OFF
================================================== */

function toggleATS() {

    atsEnabled =
        !atsEnabled;


    if (!atsEnabled) {

        document
            .getElementById("ats")
            .classList.remove(
                "show"
            );

        return;

    }


    showATS(
        "ATS ON"
    );

}


/* ==================================================
   到着
================================================== */

function arrive() {

    driving = false;

    speed = 0;

    targetSpeed = 0;


    document
        .getElementById("speed")
        .textContent =
        "0";


    document
        .getElementById("meter")
        .style.width =
        "0%";


    document
        .getElementById("arrivalStation")
        .textContent =
        destination;


    document
        .getElementById("arrival")
        .classList.remove(
            "hidden"
        );

}


/* ==================================================
   設定に戻る
================================================== */

function backToSetup() {

    driving = false;

    speed = 0;

    targetSpeed = 0;


    document
        .getElementById("arrival")
        .classList.add(
            "hidden"
        );

    document
        .getElementById("drive")
        .classList.add(
            "hidden"
        );

    document
        .getElementById("setup")
        .classList.remove(
            "hidden"
        );


    document
        .getElementById("ats")
        .classList.remove(
            "show"
        );

}


/* ==================================================
   時計
================================================== */

function startClock() {

    if (clockStarted) {
        return;
    }

    clockStarted = true;


    function updateClock() {

        const now =
            new Date();


        const h =
            String(
                now.getHours()
            ).padStart(2, "0");


        const m =
            String(
                now.getMinutes()
            ).padStart(2, "0");


        const s =
            String(
                now.getSeconds()
            ).padStart(2, "0");


        document
            .getElementById("clock")
            .textContent =
            `${h}:${m}:${s}`;


        requestAnimationFrame(
            updateClock
        );

    }


    updateClock();

}


/* ==================================================
   滑らかな速度メーター
================================================== */

let previousTime =
    performance.now();


function animationLoop(time) {

    const delta =
        Math.min(
            (time - previousTime) / 1000,
            .05
        );

    previousTime = time;


    /*
        滑らかに目標速度へ近づける
    */

    const difference =
        targetSpeed - speed;


    speed +=
        difference *
        Math.min(
            delta * 4,
            1
        );


    /*
        数値
    */

    const displaySpeed =
        Math.round(speed);


    document
        .getElementById("speed")
        .textContent =
        displaySpeed;


    /*
        メーター

        130km/h = 100%
    */

    const percentage =
        Math.min(
            speed / 130 * 100,
            100
        );


    document
        .getElementById("meter")
        .style.width =
        percentage + "%";


    /*
        制限速度を超えたらATS
    */

    if (
        driving &&
        atsEnabled &&
        speed >
        limitSpeed
    ) {

        showATS(
            "制限速度超過"
        );

    }


    requestAnimationFrame(
        animationLoop
    );

}


requestAnimationFrame(
    animationLoop
);


/* ==================================================
   デモ用：一定時間ごとに次駅へ進む

   実際の距離システムに変更可能
================================================== */

let stationTimer =
    null;


function startStationSimulation() {

    clearInterval(
        stationTimer
    );


    stationTimer =
        setInterval(() => {

            if (!driving) {
                return;
            }


            /*
                速度が20km/h以上なら
                次駅へ進む
            */

            if (
                speed >= 20 &&
                currentStation <
                currentStations.length - 1
            ) {

                currentStation++;

                updateStation();

            }

        }, 15000);

}


const originalStartDrive =
    startDrive;


startDrive = function() {

    originalStartDrive();

    startStationSimulation();

};


/* ==================================================
   初期化
================================================== */

updateSetupInfo();

</script>
