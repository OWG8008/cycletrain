<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               viewport-fit=cover">

<title>JR九州 Train Glass</title>

<style>

/* =========================================================
   BASIC
========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    margin:0;
    padding:0;
    background:#050608;
}

body{
    margin:0;
    padding:0;

    min-height:100vh;

    color:white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 15% 5%,
            rgba(255,255,255,.10),
            transparent 27%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(70,130,255,.08),
            transparent 28%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(255,255,255,.055),
            transparent 32%
        ),
        #050608;

    overflow-x:hidden;
}


/* =========================================================
   BACKGROUND
========================================================= */

body::before{
    content:"";

    position:fixed;

    inset:-30%;

    z-index:-10;

    background:
        radial-gradient(
            circle at 30% 30%,
            rgba(255,255,255,.07),
            transparent 30%
        ),
        radial-gradient(
            circle at 70% 70%,
            rgba(100,150,255,.06),
            transparent 30%
        );

    filter:blur(70px);

    animation:
        backgroundMove 18s
        ease-in-out
        infinite alternate;
}

@keyframes backgroundMove{

    0%{
        transform:
            translate(-2%,-2%)
            scale(1);
    }

    100%{
        transform:
            translate(3%,3%)
            scale(1.08);
    }
}


/* =========================================================
   APP
========================================================= */

.app{

    width:100%;

    max-width:760px;

    min-height:100vh;

    margin:auto;

    padding:
        calc(12px + env(safe-area-inset-top))
        13px
        calc(25px + env(safe-area-inset-bottom))
        13px;
}


/* =========================================================
   LIQUID GLASS
========================================================= */

.glass{

    position:relative;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.14),
            rgba(255,255,255,.045)
        );

    border:
        1px solid
        rgba(255,255,255,.13);

    box-shadow:

        0 20px 55px
        rgba(0,0,0,.40),

        inset 0 1px 0
        rgba(255,255,255,.17),

        inset 0 -1px 0
        rgba(255,255,255,.025);

    backdrop-filter:
        blur(28px)
        saturate(155%);

    -webkit-backdrop-filter:
        blur(28px)
        saturate(155%);

    overflow:hidden;
}

.glass::before{

    content:"";

    position:absolute;

    top:0;
    left:0;
    right:0;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.35),
            transparent
        );

    opacity:.55;

    pointer-events:none;
}


/* =========================================================
   START
========================================================= */

.start-screen{

    display:flex;

    align-items:flex-start;

    justify-content:center;

    min-height:
        calc(
            100vh -
            env(safe-area-inset-top)
        );
}

.start-card{

    width:100%;

    margin-top:8px;

    padding:24px 19px 22px;

    border-radius:30px;
}

.title{

    font-size:32px;

    font-weight:850;

    letter-spacing:-1.7px;
}

.subtitle{

    margin-top:5px;

    color:
        rgba(255,255,255,.43);

    font-size:13px;
}


/* =========================================================
   FORM
========================================================= */

.label{

    margin-top:21px;

    margin-bottom:8px;

    color:
        rgba(255,255,255,.45);

    font-size:13px;

    font-weight:600;
}

select,
input{

    width:100%;

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius:17px;

    padding:15px;

    background:
        rgba(255,255,255,.065);

    color:white;

    outline:none;

    font-size:16px;

    font-weight:650;

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.07);
}

select option{

    background:#17181b;

    color:white;
}

input::placeholder{

    color:
        rgba(255,255,255,.30);
}


/* =========================================================
   BUTTON
========================================================= */

.main-button{

    width:100%;

    margin-top:18px;

    padding:17px;

    border:0;

    border-radius:19px;

    background:
        rgba(255,255,255,.94);

    color:#050505;

    font-size:16px;

    font-weight:800;

    transition:
        transform .15s ease,
        opacity .15s ease;
}

.main-button:active{

    transform:scale(.97);

    opacity:.8;
}


/* =========================================================
   STATION SELECT
========================================================= */

.station-select-screen{

    display:none;
}

.station-select-card{

    width:100%;

    margin-top:8px;

    padding:22px 15px;

    border-radius:30px;
}

.select-title{

    font-size:27px;

    font-weight:850;

    letter-spacing:-1px;
}

.select-subtitle{

    margin-top:4px;

    color:
        rgba(255,255,255,.40);

    font-size:12px;
}

.select-actions{

    display:flex;

    gap:8px;

    margin-top:17px;
}

.small-button{

    flex:1;

    border:1px solid
        rgba(255,255,255,.10);

    border-radius:15px;

    padding:11px 8px;

    background:
        rgba(255,255,255,.07);

    color:white;

    font-size:13px;

    font-weight:650;
}


/* station list */

.station-list{

    display:flex;

    flex-direction:column;

    gap:7px;

    margin-top:14px;

    max-height:
        calc(
            100vh - 270px
        );

    overflow-y:auto;

    padding-right:2px;

    scrollbar-width:none;
}

.station-list::-webkit-scrollbar{
    display:none;
}


.station-item{

    display:flex;

    align-items:center;

    gap:12px;

    padding:12px;

    border-radius:17px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.07);

    transition:
        background .18s ease,
        transform .18s ease;
}

.station-item:active{

    transform:scale(.985);
}

.station-item.selected{

    background:
        rgba(255,255,255,.115);

    border-color:
        rgba(255,255,255,.20);
}

.station-check{

    width:25px;

    height:25px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,255,255,.20);

    display:flex;

    align-items:center;

    justify-content:center;

    flex:none;

    color:transparent;

    font-size:14px;

    font-weight:900;
}

.station-item.selected
.station-check{

    background:white;

    color:#08090b;

    border-color:white;
}

.station-item-name{

    flex:1;

    font-size:16px;

    font-weight:700;
}


/* =========================================================
   MAIN
========================================================= */

#mainScreen{

    display:none;
}


/* =========================================================
   HEADER
========================================================= */

.header{

    padding:19px;

    border-radius:27px;

    margin-bottom:12px;
}

.train-type{

    color:
        rgba(255,255,255,.43);

    font-size:13px;
}

.destination{

    margin-top:4px;

    font-size:29px;

    font-weight:850;

    letter-spacing:-1px;
}

.train-number{

    margin-top:5px;

    color:
        rgba(255,255,255,.40);

    font-size:12px;
}


/* =========================================================
   SPEED
========================================================= */

.speed-card{

    padding:19px;

    border-radius:27px;

    margin-bottom:12px;
}

.speed-label{

    color:
        rgba(255,255,255,.40);

    font-size:12px;
}

.speed-row{

    display:flex;

    align-items:baseline;
}

.speed{

    font-size:76px;

    line-height:.95;

    font-weight:850;

    letter-spacing:-5px;

    font-variant-numeric:
        tabular-nums;
}

.speed-unit{

    margin-left:7px;

    color:
        rgba(255,255,255,.35);

    font-size:13px;
}


/* =========================================================
   STATION BOARD
========================================================= */

.station-card{

    padding:20px;

    border-radius:27px;
}

.board-label{

    margin-bottom:14px;

    color:
        rgba(255,255,255,.40);

    font-size:12px;
}


/*
    ＞ ＞ ＞ ＞
    駅名4列
*/

.station-board{

    width:100%;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    align-items:start;
}

.arrow-row{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    margin-bottom:4px;
}

.arrow{

    text-align:left;

    color:
        rgba(255,255,255,.72);

    font-size:19px;

    font-weight:800;

    padding-left:2px;
}

.arrow.empty{

    opacity:0;
}


/* station columns */

.station-column{

    min-width:0;

    min-height:125px;

    display:flex;

    align-items:flex-start;

    justify-content:flex-start;

    padding-left:0;
}

.station-name{

    display:flex;

    flex-direction:column;

    align-items:flex-start;

    justify-content:flex-start;

    font-size:18px;

    line-height:1.05;

    font-weight:750;

    white-space:pre-line;

    text-align:left;

    transition:
        transform .35s ease,
        opacity .25s ease;
}

.station-name.current{

    transform:
        translateX(2px)
        scale(1.05);

    text-shadow:
        0 0 20px
        rgba(255,255,255,.25);
}

.station-name.empty{

    opacity:0;
}


/* =========================================================
   PROGRESS
========================================================= */

.progress{

    margin-top:12px;
}

.progress-track{

    width:100%;

    height:9px;

    border-radius:999px;

    overflow:hidden;

    background:
        rgba(255,255,255,.07);
}

.progress-fill{

    width:0%;

    height:100%;

    border-radius:999px;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.25),
            rgba(255,255,255,.95)
        );

    transition:
        width .6s
        cubic-bezier(.2,.8,.2,1);
}

.distance{

    margin-top:7px;

    text-align:right;

    color:
        rgba(255,255,255,.35);

    font-size:11px;
}


/* =========================================================
   GPS
========================================================= */

.gps-card{

    margin-top:12px;

    padding:15px;

    border-radius:22px;

    text-align:center;
}

.gps-status{

    color:
        rgba(255,255,255,.40);

    font-size:12px;
}

.gps-button{

    width:100%;

    margin-top:9px;

    padding:13px;

    border:0;

    border-radius:16px;

    background:
        rgba(255,255,255,.07);

    color:white;

    font-size:13px;

    font-weight:650;
}


/* =========================================================
   3 TAP BUBBLE
========================================================= */

.control-bubble{

    position:fixed;

    left:50%;

    bottom:
        calc(
            18px +
            env(safe-area-inset-bottom)
        );

    z-index:500;

    display:flex;

    gap:7px;

    padding:7px;

    border-radius:22px;

    background:
        rgba(38,38,42,.78);

    border:
        1px solid
        rgba(255,255,255,.16);

    box-shadow:
        0 18px 55px
        rgba(0,0,0,.48),

        inset 0 1px 0
        rgba(255,255,255,.15);

    backdrop-filter:
        blur(30px)
        saturate(170%);

    -webkit-backdrop-filter:
        blur(30px)
        saturate(170%);

    opacity:0;

    pointer-events:none;

    transform:
        translate(-50%,30px)
        scale(.88);

    transition:
        opacity .25s ease,
        transform .42s
        cubic-bezier(.2,.8,.2,1);
}

.control-bubble.show{

    opacity:1;

    pointer-events:auto;

    transform:
        translate(-50%,0)
        scale(1);
}

.control-button{

    border:0;

    padding:12px 15px;

    border-radius:16px;

    background:
        rgba(255,255,255,.09);

    color:white;

    font-size:13px;

    font-weight:700;
}

.control-button:active{

    background:
        rgba(255,255,255,.18);
}


/* =========================================================
   TEST MODE
========================================================= */

.test-badge{

    position:fixed;

    top:
        calc(
            8px +
            env(safe-area-inset-top)
        );

    right:10px;

    z-index:1000;

    display:none;

    padding:6px 10px;

    border-radius:999px;

    background:
        rgba(255,255,255,.09);

    border:
        1px solid
        rgba(255,255,255,.10);

    color:
        rgba(255,255,255,.50);

    font-size:9px;

    font-weight:700;

    backdrop-filter:
        blur(20px);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:430px){

    .app{
        padding-left:10px;
        padding-right:10px;
    }

    .start-card{
        padding:22px 15px;
    }

    .title{
        font-size:29px;
    }

    .station-card{
        padding:17px;
    }

    .station-name{
        font-size:17px;
    }

    .speed{
        font-size:70px;
    }

}


/* =========================================================
   ANIMATION
========================================================= */

.fade-in{

    animation:
        fadeIn .45s
        cubic-bezier(.2,.8,.2,1);
}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:
            translateY(12px)
            scale(.98);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}

</style>
</head>


<body>


<!-- =======================================================
     TEST BADGE
======================================================= -->

<div id="testBadge"
     class="test-badge">
    TEST MODE
</div>


<!-- =======================================================
     START
======================================================= -->

<section id="startScreen"
         class="app start-screen">

    <div class="glass start-card">

        <div class="title">
            Train Glass
        </div>

        <div class="subtitle">
            JR九州 Train Display
        </div>


        <div class="label">
            列車種別
        </div>

        <select id="trainTypeSelect">

            <option value="sonic">
                特急ソニック
            </option>

            <option value="yufuin">
                特急ゆふいんの森
            </option>

            <option value="local">
                普通列車
            </option>

        </select>


        <!-- SONIC / YUFUIN -->

        <div id="numberArea">

            <div class="label">
                号数
            </div>

            <input
                id="trainNumberInput"
                type="number"
                inputmode="numeric"
                placeholder="入力">

        </div>


        <!-- LOCAL -->

        <div id="localArea"
             style="display:none">

            <div class="label">
                路線・方向
            </div>

            <select id="localRoute">

                <option value="nippo">
                    日豊本線　中津 → 幸崎
                </option>

                <option value="nippoReverse">
                    日豊本線　幸崎 → 中津
                </option>

                <option value="kyudai">
                    久大本線　大分 → 日田
                </option>

                <option value="kyudaiReverse">
                    久大本線　日田 → 大分
                </option>

                <option value="hohi">
                    豊肥本線　大分 → 宮地
                </option>

                <option value="hohiReverse">
                    豊肥本線　宮地 → 大分
                </option>

            </select>

        </div>


        <button
            class="main-button"
            onclick="openStationSelection()">

            停車駅を選択

        </button>

    </div>

</section>


<!-- =======================================================
     STATION SELECT
======================================================= -->

<section id="stationSelectScreen"
         class="app station-select-screen">

    <div class="glass station-select-card">

        <div class="select-title">
            停車駅を選択
        </div>

        <div id="selectSubtitle"
             class="select-subtitle">
            停車する駅をタップしてください
        </div>


        <div class="select-actions">

            <button
                class="small-button"
                onclick="selectAllStations()">

                全選択

            </button>

            <button
                class="small-button"
                onclick="clearStations()">

                全解除

            </button>

            <button
                class="small-button"
                onclick="backToStart()">

                戻る

            </button>

        </div>


        <div id="stationList"
             class="station-list">
        </div>


        <button
            class="main-button"
            onclick="startTrain()">

            この停車駅で運転開始

        </button>

    </div>

</section>


<!-- =======================================================
     MAIN
======================================================= -->

<section id="mainScreen"
         class="app">

    <!-- HEADER -->

    <div class="glass header fade-in">

        <div id="mainTrainType"
             class="train-type">
            特急ソニック
        </div>

        <div id="mainDestination"
             class="destination">
            博多行き
        </div>

        <div id="mainTrainNumber"
             class="train-number">
        </div>

    </div>


    <!-- SPEED -->

    <div class="glass speed-card fade-in">

        <div class="speed-label">
            現在速度
        </div>

        <div class="speed-row">

            <span id="speed"
                  class="speed">
                --
            </span>

            <span class="speed-unit">
                km/h
            </span>

        </div>

    </div>


    <!-- STATIONS -->

    <div class="glass station-card fade-in">

        <div class="board-label">
            次の駅
        </div>


        <div id="arrowRow"
             class="arrow-row">

        </div>


        <div id="stationBoard"
             class="station-board">

        </div>


        <div class="progress">

            <div class="progress-track">

                <div id="progressFill"
                     class="progress-fill">
                </div>

            </div>

            <div id="distance"
                 class="distance">
                GPS取得中...
            </div>

        </div>

    </div>


    <!-- GPS -->

    <div class="glass gps-card">

        <div id="gpsStatus"
             class="gps-status">

            GPS待機中

        </div>

        <button
            class="gps-button"
            onclick="startGPS()">

            GPSを開始

        </button>

    </div>

</section>


<!-- =======================================================
     CONTROL BUBBLE
======================================================= -->

<div id="controlBubble"
     class="control-bubble">

    <button
        class="control-button"
        onclick="previousStation()">

        ← 前の駅

    </button>

    <button
        class="control-button"
        onclick="nextStation()">

        次の駅 →

    </button>

</div>

/* =========================================================

let candidateStations = [];

let gpsWatch = null;

let testMode = false;

let taps = 0;

let tapTimer = null;

let bubbleTimer = null;


/* =========================================================
   TYPE CHANGE
========================================================= */

document
.getElementById("trainTypeSelect")
.addEventListener(
    "change",
    function(){

        const type = this.value;

        const numberArea =
            document.getElementById(
                "numberArea"
            );

        const localArea =
            document.getElementById(
                "localArea"
            );


        if(type === "local"){

            numberArea.style.display =
                "none";

            localArea.style.display =
                "block";

        }
        else{

            numberArea.style.display =
                "block";

            localArea.style.display =
                "none";

        }

    }
);


/* =========================================================
   LOCAL ROUTE
========================================================= */

document
.getElementById("localRoute")
.addEventListener(
    "change",
    function(){

        /*
          何も特別な処理は不要。
          選択時に候補駅を作る。
        */

    }
);


/* =========================================================
   OPEN STATION SELECT
========================================================= */

function openStationSelection(){

    const type =
        document
        .getElementById(
            "trainTypeSelect"
        )
        .value;


    currentType = type;


    /* ---------- SONIC ---------- */

    if(type === "sonic"){

        const number =
            Number(
                document
                .getElementById(
                    "trainNumberInput"
                )
                .value
            );


        if(
            !number ||
            number < 1
        ){

            alert(
                "ソニックの号数を入力してください。"
            );

            return;

        }


        currentNumber = number;

        candidateStations =
            SONIC_STATIONS.slice();

        destination =
            "行き先を停車駅から設定";

    }


    /* ---------- YUFUIN ---------- */

    else if(type === "yufuin"){

        const number =
            Number(
                document
                .getElementById(
                    "trainNumberInput"
                )
                .value
            );


        if(
            number < 1 ||
            number > 6
        ){

            alert(
                "ゆふいんの森は1〜6号です。"
            );

            return;

        }


        currentNumber = number;

        candidateStations =
            YUFUIN_STATIONS.slice();

    }


    /* ---------- LOCAL ---------- */

    else{

        currentNumber = null;


        const route =
            document
            .getElementById(
                "localRoute"
            )
            .value;


        if(route === "nippo"){

            candidateStations =
                NIPPO.slice();

        }

        else if(
            route === "nippoReverse"
        ){

            candidateStations =
                NIPPO
                .slice()
                .reverse();

        }

        else if(
            route === "kyudai"
        ){

            candidateStations =
                KYUDAI.slice();

        }

        else if(
            route === "kyudaiReverse"
        ){

            candidateStations =
                KYUDAI
                .slice()
                .reverse();

        }

        else if(
            route === "hohi"
        ){

            candidateStations =
                HOHI.slice();

        }

        else{

            candidateStations =
                HOHI
                .slice()
                .reverse();

        }

    }


    /*
      普通列車は各駅停車なので
      最初から全部選択。
    */

    if(type === "local"){

        selectedStations =
            candidateStations.slice();

    }

    else{

        selectedStations = [];

    }


    renderStationSelection();


    document
    .getElementById(
        "startScreen"
    )
    .style.display =
        "none";


    document
    .getElementById(
        "stationSelectScreen"
    )
    .style.display =
        "block";

}


/* =========================================================
   STATION SELECTION RENDER
========================================================= */

function renderStationSelection(){

    const list =
        document
        .getElementById(
            "stationList"
        );

    list.innerHTML = "";


    candidateStations.forEach(
        function(name){

            const item =
                document
                .createElement(
                    "div"
                );


            item.className =
                "station-item";


            const selected =
                selectedStations
                .includes(name);


            if(selected){

                item.classList.add(
                    "selected"
                );

            }


            item.innerHTML = `

                <div class="station-check">
                    ${selected ? "✓" : ""}
                </div>

                <div class="station-item-name">
                    ${name}
                </div>

            `;


            item.onclick =
                function(){

                    toggleStation(name);

                };


            list.appendChild(item);

        }
    );

}


/* =========================================================
   TOGGLE STATION
========================================================= */

function toggleStation(name){

    const index =
        selectedStations
        .indexOf(name);


    if(index >= 0){

        selectedStations
        .splice(index,1);

    }
    else{

        selectedStations
        .push(name);

    }


    /*
      選択順ではなく
      路線順に並べ直す。

      これで
      博多 → 折尾 → 小倉
      の順番が崩れない。
    */

    selectedStations =
        candidateStations
        .filter(
            station =>
                selectedStations
                .includes(station)
        );


    renderStationSelection();

}


/* =========================================================
   ALL
========================================================= */

function selectAllStations(){

    selectedStations =
        candidateStations.slice();

    renderStationSelection();

}


/* =========================================================
   CLEAR
========================================================= */

function clearStations(){

    /*
      普通列車は各駅停車なので
      全解除可能にしておく。
      ユーザーが自由に選べる。
    */

    selectedStations = [];

    renderStationSelection();

}


/* =========================================================
   BACK
========================================================= */

function backToStart(){

    document
    .getElementById(
        "stationSelectScreen"
    )
    .style.display =
        "none";


    document
    .getElementById(
        "startScreen"
    )
    .style.display =
        "flex";

}


/* =========================================================
   START TRAIN
========================================================= */

function startTrain(){

    if(
        selectedStations.length < 2
    ){

        alert(
            "停車駅を2駅以上選択してください。"
        );

        return;

    }


    stations =
        selectedStations.map(
            name => ({
                name:name
            })
        );


    currentIndex = 0;


    /*
      行き先は最後の停車駅
    */

    destination =
        stations[
            stations.length - 1
        ].name +
        "行き";


    document
    .getElementById(
        "stationSelectScreen"
    )
    .style.display =
        "none";


    document
    .getElementById(
        "mainScreen"
    ).style.display =
        "block";


    updateHeader();

    renderBoard();

    startGPS();

}


/* =========================================================
   HEADER
========================================================= */

function updateHeader(){

    let typeText = "";

    if(
        currentType === "sonic"
    ){

        typeText =
            "特急ソニック";

    }

    else if(
        currentType === "yufuin"
    ){

        typeText =
            "特急ゆふいんの森";

    }

    else{

        typeText =
            "普通列車";

    }


    document
    .getElementById(
        "mainTrainType"
    )
    .textContent =
        typeText;


    document
    .getElementById(
        "mainDestination"
    )
    .textContent =
        destination;


    document
    .getElementById(
        "mainTrainNumber"
    )
    .textContent =
        currentNumber
        ? currentNumber + "号"
        : "各駅停車";

}


/* =========================================================
   VERTICAL NAME
========================================================= */

function verticalName(name){

    return [...name]
        .join("\n");

}


/* =========================================================
   BOARD
========================================================= */

function renderBoard(){

    const arrowRow =
        document
        .getElementById(
            "arrowRow"
        );

    const board =
        document
        .getElementById(
            "stationBoard"
        );


    arrowRow.innerHTML = "";

    board.innerHTML = "";


    /*
      現在駅から4駅
    */

    const visible = [];


    for(
        let i=0;
        i<4;
        i++
    ){

        const index =
            currentIndex + i;


        visible.push(
            index < stations.length
            ? stations[index]
            : null
        );

    }


    /*
      ＞＞＞＞
      次の駅が存在する場合だけ表示。

      これで黒崎のときに
      存在しない3つ目の ＞ が
      出る問題も防ぐ。
    */

    visible.forEach(
        function(station,i){

            const arrow =
                document
                .createElement(
                    "div"
                );


            arrow.className =
                "arrow";


            if(
                station &&
                i < 3 &&
                visible[i + 1]
            ){

                arrow.textContent =
                    "＞";

            }
            else{

                arrow.classList.add(
                    "empty"
                );

            }


            arrowRow.appendChild(
                arrow
            );

        }
    );


    /*
      駅名
    */

    visible.forEach(
        function(station,i){

            const column =
                document
                .createElement(
                    "div"
                );


            column.className =
                "station-column";


            if(station){

                const name =
                    document
                    .createElement(
                        "div"
                    );


                name.className =
                    "station-name";


                name.textContent =
                    verticalName(
                        station.name
                    );


                /*
                  現在表示されている
                  先頭駅を強調。
                */

                if(i === 0){

                    name.classList.add(
                        "current"
                    );

                }


                column.appendChild(
                    name
                );

            }


            board.appendChild(
                column
            );

        }
    );

}


/* =========================================================
   NEXT
========================================================= */

function nextStation(){

    if(
        currentIndex >=
        stations.length - 1
    ){

        return;

    }


    currentIndex++;


    renderBoard();


    /*
      TEST MODE
    */

    if(testMode){

        const meter =
            15 +
            Math.random() * 80;


        const randomSpeed =
            Math.floor(
                Math.random() * 120
            );


        document
        .getElementById(
            "progressFill"
        )
        .style.width =
            meter + "%";


        document
        .getElementById(
            "speed"
        )
        .textContent =
            randomSpeed;


        document
        .getElementById(
            "distance"
        )
        .textContent =
            "TEST MODE";

    }

}


/* =========================================================
   PREVIOUS
========================================================= */

function previousStation(){

    if(
        currentIndex <= 0
    ){

        return;

    }


    currentIndex--;

    renderBoard();


    document
    .getElementById(
        "progressFill"
    )
    .style.width =
        "0%";

}


/* =========================================================
   GPS
========================================================= */

function startGPS(){

    if(testMode){

        document
        .getElementById(
            "gpsStatus"
        )
        .textContent =
            "テストモード";

        return;

    }


    if(
        !navigator.geolocation
    ){

        document
        .getElementById(
            "gpsStatus"
        )
        .textContent =
            "この端末ではGPSを利用できません";

        return;

    }


    if(gpsWatch !== null){

        return;

    }


    document
    .getElementById(
        "gpsStatus"
    )
    .textContent =
        "GPS取得中...";


    gpsWatch =
        navigator
        .geolocation
        .watchPosition(

            updateGPS,

            function(error){

                document
                .getElementById(
                    "gpsStatus"
                )
                .textContent =
                    "GPSを取得できません";

            },

            {

                enableHighAccuracy:true,

                maximumAge:1000,

                timeout:10000

            }

        );

}


/* =========================================================
   GPS UPDATE
========================================================= */

function updateGPS(position){

    let speed =
        position.coords.speed;


    if(
        speed !== null &&
        !Number.isNaN(speed)
    ){

        speed =
            speed * 3.6;

    }
    else{

        speed = 0;

    }


    document
    .getElementById(
        "speed"
    )
    .textContent =
        Math.round(speed);


    document
    .getElementById(
        "gpsStatus"
    )
    .textContent =
        "GPS接続中";


    /*
      ここではGPSだけで
      駅を勝手に進めない。

      選択した停車駅を基準にした
      駅座標判定を追加する場合も、
      「停車駅だけ」を対象にできる。
    */

}


/* =========================================================
   3 TAP
========================================================= */

document.addEventListener(
    "touchend",
    function(){

        taps++;

        clearTimeout(
            tapTimer
        );


        tapTimer =
            setTimeout(
                function(){

                    taps = 0;

                },
                650
            );


        if(
            taps === 3
        ){

            taps = 0;

            showControls();

        }

    },
    {
        passive:true
    }
);


/* =========================================================
   SHOW CONTROL
========================================================= */

function showControls(){

    const bubble =
        document
        .getElementById(
            "controlBubble"
        );


    bubble.classList.add(
        "show"
    );


    clearTimeout(
        bubbleTimer
    );


    bubbleTimer =
        setTimeout(
            function(){

                bubble.classList.remove(
                    "show"
                );

            },
            4500
        );

}


/* =========================================================
   TEST MODE
========================================================= */

/*
   テストモード切替用。

   コンソールから

       enableTestMode()

   を実行するとON。
*/

function enableTestMode(){

    testMode = true;

    document
    .getElementById(
        "testBadge"
    )
    .style.display =
        "block";


    document
    .getElementById(
        "gpsStatus"
    )
    .textContent =
        "テストモード";


    document
    .getElementById(
        "speed"
    )
    .textContent =
        "0";

}


/* =========================================================
   DISABLE TEST
========================================================= */

function disableTestMode(){

    testMode = false;

    document
    .getElementById(
        "testBadge"
    )
    .style.display =
        "none";

}


/* =========================================================
   INITIAL
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        /*
          初期表示
        */

        document
        .getElementById(
            "startScreen"
        )
        .style.display =
            "flex";

    }
);

</script>
