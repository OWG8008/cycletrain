<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               viewport-fit=cover">

<title>JR九州 Train Glass</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    min-height:100%;
    background:#07080a;
    color:#fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        sans-serif;
}

body{
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:-25%;
    z-index:-10;

    background:
        radial-gradient(
            circle at 20% 10%,
            rgba(255,255,255,.12),
            transparent 28%
        ),
        radial-gradient(
            circle at 85% 30%,
            rgba(80,150,255,.10),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(255,255,255,.06),
            transparent 30%
        );

    filter:blur(45px);

    animation:
        bgMove 16s
        ease-in-out
        infinite
        alternate;
}

@keyframes bgMove{
    from{
        transform:translate(-2%,-1%) scale(1);
    }
    to{
        transform:translate(2%,2%) scale(1.08);
    }
}


/* =========================
   APP
========================= */

.app{
    width:100%;
    max-width:720px;
    min-height:100vh;

    margin:auto;

    padding:
        calc(20px + env(safe-area-inset-top))
        14px
        calc(24px + env(safe-area-inset-bottom))
        14px;
}


/* =========================
   LIQUID GLASS
========================= */

.glass{
    position:relative;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.14),
            rgba(255,255,255,.045)
        );

    border:
        1px solid
        rgba(255,255,255,.12);

    box-shadow:
        0 20px 55px
        rgba(0,0,0,.40),

        inset 0 1px 0
        rgba(255,255,255,.17),

        inset 0 -1px 0
        rgba(255,255,255,.025);

    backdrop-filter:
        blur(28px)
        saturate(155%);

    -webkit-backdrop-filter:
        blur(28px)
        saturate(155%);

    overflow:hidden;
}

.glass::after{
    content:"";

    position:absolute;

    top:-130%;
    left:-80%;

    width:55%;
    height:350%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.07),
            transparent
        );

    transform:rotate(17deg);

    animation:
        shine 11s
        ease-in-out
        infinite;

    pointer-events:none;
}

@keyframes shine{
    0%{
        left:-80%;
    }

    42%{
        left:125%;
    }

    100%{
        left:125%;
    }
}


/* =========================
   START
========================= */

.start{
    display:flex;
    align-items:center;
    justify-content:center;
}

.start-card{
    width:100%;
    padding:28px 21px;
    border-radius:30px;
}

.title{
    font-size:31px;
    font-weight:850;
    letter-spacing:-1.5px;
}

.subtitle{
    margin-top:6px;
    color:
        rgba(255,255,255,.43);
    font-size:13px;
}

.label{
    margin:
        23px 0
        8px;

    font-size:13px;
    color:
        rgba(255,255,255,.45);
}

select,
input{
    width:100%;

    border:1px solid
        rgba(255,255,255,.12);

    border-radius:18px;

    padding:16px;

    background:
        rgba(255,255,255,.075);

    color:white;

    font-size:16px;
    font-weight:650;

    outline:none;
}

select option{
    background:#17181b;
}

.start-button{
    width:100%;

    margin-top:16px;

    border:0;

    border-radius:20px;

    padding:18px;

    background:
        rgba(255,255,255,.94);

    color:#050505;

    font-size:17px;
    font-weight:750;

    transition:
        transform .15s ease;
}

.start-button:active{
    transform:scale(.97);
}


/* =========================
   MAIN
========================= */

#main{
    display:none;
}

.header{
    padding:21px;

    border-radius:28px;

    margin-bottom:14px;
}

.train-type{
    color:
        rgba(255,255,255,.45);

    font-size:13px;
}

.destination{
    margin-top:4px;

    font-size:30px;

    font-weight:850;

    letter-spacing:-1px;
}

.number{
    margin-top:5px;

    color:
        rgba(255,255,255,.40);

    font-size:13px;
}


/* =========================
   SPEED
========================= */

.speed-card{
    padding:21px;

    border-radius:28px;
}

.speed-label{
    color:
        rgba(255,255,255,.42);

    font-size:13px;
}

.speed-row{
    display:flex;
    align-items:baseline;
}

.speed{
    font-size:76px;

    font-weight:850;

    line-height:1;

    letter-spacing:-5px;

    font-variant-numeric:
        tabular-nums;
}

.unit{
    margin-left:8px;

    color:
        rgba(255,255,255,.38);
}


/* =========================
   STATIONS
========================= */

.station-card{
    margin-top:14px;

    padding:22px;

    border-radius:28px;
}

.station-label{
    margin-bottom:14px;

    font-size:13px;

    color:
        rgba(255,255,255,.43);
}

.station-board{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    width:100%;
}

.station-arrow{
    height:23px;

    display:flex;

    align-items:center;

    justify-content:center;

    color:
        rgba(255,255,255,.67);

    font-size:18px;

    font-weight:750;
}

.station-name{
    min-height:82px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:flex-start;

    padding-top:4px;

    font-size:18px;

    line-height:1.1;

    font-weight:750;

    white-space:pre-line;

    text-align:center;

    transition:
        transform .45s
        cubic-bezier(.2,.8,.2,1),
        opacity .3s ease;
}

.station-name.current{
    transform:scale(1.07);

    text-shadow:
        0 0 22px
        rgba(255,255,255,.22);
}

.station-name.empty{
    opacity:0;
}


/* =========================
   PROGRESS
========================= */

.progress{
    margin-top:17px;
}

.progress-track{
    height:10px;

    border-radius:999px;

    overflow:hidden;

    background:
        rgba(255,255,255,.07);
}

.progress-fill{
    height:100%;

    width:0%;

    border-radius:999px;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.25),
            rgba(255,255,255,.95)
        );

    transition:
        width .65s
        cubic-bezier(.2,.8,.2,1);
}

.distance{
    margin-top:8px;

    text-align:right;

    color:
        rgba(255,255,255,.43);

    font-size:12px;
}


/* =========================
   GPS
========================= */

.gps{
    margin-top:14px;

    padding:17px;

    border-radius:24px;

    text-align:center;
}

.gps-status{
    color:
        rgba(255,255,255,.42);

    font-size:13px;
}

.gps-button{
    width:100%;

    margin-top:10px;

    padding:14px;

    border:0;

    border-radius:17px;

    background:
        rgba(255,255,255,.08);

    color:white;

    font-weight:650;
}


/* =========================
   CONTROL BUBBLE
========================= */

.control-bubble{
    position:fixed;

    left:50%;

    bottom:
        calc(
            20px +
            env(safe-area-inset-bottom)
        );

    z-index:1000;

    display:flex;

    gap:7px;

    padding:8px;

    border-radius:23px;

    background:
        rgba(35,35,38,.76);

    border:
        1px solid
        rgba(255,255,255,.16);

    box-shadow:
        0 18px 50px
        rgba(0,0,0,.45),

        inset 0 1px 0
        rgba(255,255,255,.14);

    backdrop-filter:
        blur(30px)
        saturate(160%);

    -webkit-backdrop-filter:
        blur(30px)
        saturate(160%);

    opacity:0;

    pointer-events:none;

    transform:
        translate(-50%,25px)
        scale(.90);

    transition:
        opacity .25s ease,
        transform .4s
        cubic-bezier(.2,.8,.2,1);
}

.control-bubble.show{
    opacity:1;

    pointer-events:auto;

    transform:
        translate(-50%,0)
        scale(1);
}

.control-bubble button{
    border:0;

    padding:12px 17px;

    border-radius:16px;

    background:
        rgba(255,255,255,.09);

    color:white;

    font-size:14px;

    font-weight:650;
}


/* =========================
   TEST
========================= */

.test-badge{
    position:fixed;

    top:
        calc(
            10px +
            env(safe-area-inset-top)
        );

    right:12px;

    display:none;

    z-index:2000;

    padding:7px 10px;

    border-radius:999px;

    background:
        rgba(255,255,255,.10);

    color:
        rgba(255,255,255,.55);

    font-size:10px;
}
</style>
</head>

/* =========================================================
   START
========================================================= */

function startTrain(){

    const type =
        document
        .getElementById("type")
        .value;


    if(type === "sonic"){

        const number =
            Number(
                document
                .getElementById("number")
                .value
            );


        /*
          未登録号を勝手な停車駅で
          作らない。
        */

        if(
            !SONIC[number]
        ){

            alert(
                "この号数の停車駅データはまだ登録されていません。"
            );

            return;

        }


        currentTrain = {

            name:"特急ソニック",

            number:number,

            destination:
                SONIC[number]
                .destination

        };


        stations =
            SONIC[number]
            .stations
            .map(
                name => ({
                    name:name
                })
            );

    }


    else if(type === "yufuin"){

        const number =
            Number(
                document
                .getElementById("number")
                .value
            );


        if(!YUFUIN[number]){

            alert(
                "ゆふいんの森は1〜6号です。"
            );

            return;

        }


        currentTrain = {

            name:
                "特急ゆふいんの森",

            number:number,

            destination:
                number % 2
                ? "由布院方面"
                : "博多方面"

        };


        stations =
            YUFUIN[number]
            .map(
                name => ({
                    name:name
                })
            );

    }


    else{

        const route =
            document
            .getElementById("local")
            .value;


        let data;


        if(route === "nippo")
            data = LOCAL.nippo;

        else if(
            route === "nippoReverse"
        )
            data =
                [...LOCAL.nippo]
                .reverse();

        else if(
            route === "kyudai"
        )
            data = LOCAL.kyudai;

        else if(
            route === "kyudaiReverse"
        )
            data =
                [...LOCAL.kyudai]
                .reverse();

        else if(
            route === "hohi"
        )
            data = LOCAL.hohi;

        else
            data =
                [...LOCAL.hohi]
                .reverse();


        stations =
            data.map(
                name => ({
                    name:name
                })
            );


        currentTrain = {

            name:"普通列車",

            number:null,

            destination:
                stations[
                    stations.length - 1
                ].name +
                "行き"

        };

    }


    currentIndex = 0;


    document
    .getElementById("start")
    .style.display =
        "none";


    document
    .getElementById("main")
    .style.display =
        "block";


    updateHeader();

    renderStations();

    startGPS();

}

========================================================= */

    document
    .getElementById("trainType")
    .textContent =
        currentTrain.name;


    document
    .getElementById("destination")

        currentTrain.destination;


    document
    .getElementById("trainNumber")
    .textContent =
        currentTrain.number
        ? currentTrain.name +
          " " +
          currentTrain.number +
          "号"
        : currentTrain.name;

}


/* =========================================================
   VERTICAL
========================================================= */

function verticalName(name){

    return [...name]
        .join("\n");

}


/* =========================================================
   STATION BOARD
========================================================= */

function renderStations(){

    const board =
        document
        .getElementById(
            "stationBoard"
        );

    board.innerHTML = "";


    const visible = [];


    /*
      現在位置から4駅
    */

    for(
        let i=0;
        i<4;
        i++
    ){

        const index =
            currentIndex + i;


        visible.push(
            index < stations.length
            ? stations[index]
            : null
        );

    }


    /*
      ＞
      最後の駅の後ろには
      絶対に出さない
    */

    visible.forEach(
        function(station,i){

            const arrow =
                document
                .createElement("div");

            arrow.className =
                "station-arrow";


            if(
                station &&
                i < 3 &&
                visible[i + 1]
            ){

                arrow.textContent =
                    "＞";

            }


            board.appendChild(
                arrow
            );

        }
    );


    /*
      駅名
    */

    visible.forEach(
        function(station,i){

            const wrapper =
                document
                .createElement("div");


            const span =
                document
                .createElement("span");


            span.className =
                "station-name";


            if(!station){

                span.classList.add(
                    "empty"
                );

            }
            else{

                span.textContent =
                    verticalName(
                        station.name
                    );


                /*
                  現在の駅だけ
                  少し強調
                */

                if(i === 0){

                    span.classList.add(
                        "current"
                    );

                }

            }


            wrapper.appendChild(
                span
            );

            board.appendChild(
                wrapper
            );

        }
    );

}


/* =========================================================
   GPS
========================================================= */

function startGPS(){

    if(testMode){

        document
        .getElementById(
            "gpsStatus"
        )
        .textContent =
            "テストモード";

        return;

    }


    if(
        !navigator.geolocation
    ){

        document
        .getElementById(
            "gpsStatus"
        )
        .textContent =
            "GPS非対応";

        return;

    }


    if(gpsWatch !== null)
        return;


    gpsWatch =
        navigator
        .geolocation
        .watchPosition(

            updateGPS,

            function(){

                document
                .getElementById(
                    "gpsStatus"
                )
                .textContent =
                    "位置情報を許可してください";

            },

            {
                enableHighAccuracy:true,

                maximumAge:1000,

                timeout:10000
            }

        );

}


/* =========================================================
   GPS UPDATE
========================================================= */

function updateGPS(position){

    let speed =
        position.coords.speed;


    if(
        speed !== null &&
        !isNaN(speed)
    ){

        speed =
            speed * 3.6;

    }
    else{

        speed = 0;

    }


    document
    .getElementById(
        "speed"
    )
    .textContent =
        Math.round(speed);


    document
    .getElementById(
        "gpsStatus"
    )
    .textContent =
        "GPS接続中";


    /*
      速度が落ちてから次駅へ
      切り替えるための処理は
      ここでは自動変更しない。

      駅到着判定を入れる場合は
      駅座標データと組み合わせる。
    */

}


/* =========================================================
   NEXT
========================================================= */

function nextStation(){

    if(
        currentIndex >=
        stations.length - 1
    ){

        return;

    }


    currentIndex++;


    renderStations();


    /*
      TEST MODE
      次駅ボタンを押すたび
      メーターをランダムにする
    */

    if(testMode){

        const value =
            15 +
            Math.random() * 80;


        document
        .getElementById(
            "progressFill"
        )
        .style.width =
            value + "%";


        document
        .getElementById(
            "speed"
        )
        .textContent =
            Math.floor(
                Math.random() * 115
            );


        document
        .getElementById(
            "distance"
        )
        .textContent =
            "テストモード";

    }

}


/* =========================================================
   PREVIOUS
========================================================= */

function previousStation(){

    if(
        currentIndex <= 0
    ){

        return;

    }


    currentIndex--;

    renderStations();


    document
    .getElementById(
        "progressFill"
    )
    .style.width =
        "0%";

}


/* =========================================================
   3 TAP CONTROL
========================================================= */

document.addEventListener(
    "touchend",
    function(){

        taps++;

        clearTimeout(
            tapTimer
        );


        tapTimer =
            setTimeout(
                function(){

                    taps = 0;

                },
                650
            );


        if(taps === 3){

            taps = 0;

            showControls();

        }

    },
    {
        passive:true
    }
);


function showControls(){

    const bubble =
        document
        .getElementById(
            "controlBubble"
        );


    bubble.classList.add(
        "show"
    );


    clearTimeout(
        bubble.timer
    );


    bubble.timer =
        setTimeout(
            function(){

                bubble.classList.remove(
                    "show"
                );

            },
            4000
        );

}


/* =========================================================
   TEST MODE
========================================================= */

function toggleTestMode(){

    testMode =
        !testMode;


    document.body
    .classList.toggle(
        "test-mode",
        testMode
    );


    document
    .getElementById(
        "testBadge"
    )
    .style.display =
        testMode
        ? "block"
        : "none";

}


/*
  テストモードは
  画面を3回タップした後、
  前/次バブルを出して
  次駅を操作できる構造。

  必要なら専用の隠し領域を
  3回タップで切り替える。
