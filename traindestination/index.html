<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      viewport-fit=cover">

<title>JR九州 Train Glass</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    min-height:100%;
    background:#050608;
}

body{
    color:#fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 15% 5%,
            rgba(255,255,255,.10),
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(80,130,255,.08),
            transparent 30%
        ),
        #050608;

    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:-30%;
    z-index:-1;

    background:
        radial-gradient(
            circle at 30% 30%,
            rgba(255,255,255,.07),
            transparent 30%
        ),
        radial-gradient(
            circle at 70% 70%,
            rgba(100,150,255,.06),
            transparent 30%
        );

    filter:blur(70px);

    animation:bgMove 18s ease-in-out infinite alternate;
}

@keyframes bgMove{
    from{
        transform:translate(-2%,-2%) scale(1);
    }
    to{
        transform:translate(3%,3%) scale(1.08);
    }
}

/* =========================
   APP
========================= */

.app{
    width:100%;
    max-width:760px;
    min-height:100vh;
    margin:auto;

    padding:
        calc(10px + env(safe-area-inset-top))
        10px
        calc(25px + env(safe-area-inset-bottom));
}

/* =========================
   LIQUID GLASS
========================= */

.glass{
    position:relative;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.14),
            rgba(255,255,255,.045)
        );

    border:
        1px solid
        rgba(255,255,255,.13);

    box-shadow:
        0 20px 55px rgba(0,0,0,.42),
        inset 0 1px 0 rgba(255,255,255,.17),
        inset 0 -1px 0 rgba(255,255,255,.025);

    backdrop-filter:
        blur(30px)
        saturate(160%);

    -webkit-backdrop-filter:
        blur(30px)
        saturate(160%);

    overflow:hidden;
}

.glass::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.35),
            transparent
        );

    pointer-events:none;
}

/* =========================
   START
========================= */

#startScreen{
    display:flex;
    align-items:flex-start;
    justify-content:center;
}

.start-card{
    width:100%;
    margin-top:5px;
    padding:23px 17px;
    border-radius:30px;
}

.title{
    font-size:31px;
    font-weight:850;
    letter-spacing:-1.5px;
}

.subtitle{
    margin-top:4px;
    color:rgba(255,255,255,.42);
    font-size:13px;
}

.label{
    margin-top:20px;
    margin-bottom:8px;

    color:rgba(255,255,255,.45);
    font-size:13px;
    font-weight:650;
}

select{
    width:100%;
    padding:15px;

    border-radius:17px;
    border:1px solid rgba(255,255,255,.12);

    background:rgba(255,255,255,.065);
    color:white;

    outline:none;
    font-size:16px;
    font-weight:650;
}

select option{
    background:#17181b;
    color:#fff;
}

/* =========================
   DESTINATION
========================= */

.destination-buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.destination-button{
    min-height:58px;

    border-radius:18px;
    border:1px solid rgba(255,255,255,.10);

    background:
        rgba(255,255,255,.055);

    color:
        rgba(255,255,255,.70);

    font-size:15px;
    font-weight:750;

    transition:
        transform .15s ease,
        background .2s ease;
}

.destination-button.selected{
    background:
        rgba(255,255,255,.18);

    border-color:
        rgba(255,255,255,.25);

    color:#fff;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.18);
}

.destination-button:active{
    transform:scale(.96);
}

/* =========================
   MAIN BUTTON
========================= */

.main-button{
    width:100%;
    margin-top:17px;
    padding:17px;

    border:0;
    border-radius:19px;

    background:rgba(255,255,255,.94);
    color:#050505;

    font-size:16px;
    font-weight:850;

    transition:
        transform .15s ease,
        opacity .15s ease;
}

.main-button:active{
    transform:scale(.97);
    opacity:.8;
}

/* =========================
   STATION SELECT
========================= */

#stationSelectScreen{
    display:none;
}

.station-select-card{
    width:100%;
    margin-top:5px;
    padding:21px 14px;
    border-radius:30px;
}

.select-title{
    font-size:28px;
    font-weight:850;
    letter-spacing:-1px;
}

.select-subtitle{
    margin-top:4px;
    color:rgba(255,255,255,.40);
    font-size:12px;
}

.select-actions{
    display:flex;
    gap:7px;
    margin-top:15px;
}

.small-button{
    flex:1;

    padding:11px 7px;

    border-radius:15px;
    border:1px solid rgba(255,255,255,.10);

    background:rgba(255,255,255,.07);
    color:#fff;

    font-size:12px;
    font-weight:700;
}

.station-list{
    display:flex;
    flex-direction:column;
    gap:7px;

    margin-top:13px;

    max-height:
        calc(100vh - 270px);

    overflow-y:auto;
    scrollbar-width:none;
}

.station-list::-webkit-scrollbar{
    display:none;
}

.station-item{
    display:flex;
    align-items:center;
    gap:12px;

    padding:12px;

    border-radius:17px;

    background:rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.07);

    transition:
        background .18s ease,
        transform .15s ease;
}

.station-item:active{
    transform:scale(.985);
}

.station-item.selected{
    background:rgba(255,255,255,.12);
    border-color:rgba(255,255,255,.20);
}

.station-check{
    width:25px;
    height:25px;

    flex:none;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    border:
        1px solid
        rgba(255,255,255,.20);

    color:transparent;
    font-size:14px;
    font-weight:900;
}

.station-item.selected .station-check{
    background:#fff;
    color:#050608;
    border-color:#fff;
}

.station-item-name{
    font-size:16px;
    font-weight:700;
}

/* =========================
   MAIN DISPLAY
========================= */

#mainScreen{
    display:none;
}

.header{
    padding:18px;
    border-radius:27px;
    margin-bottom:10px;
}

.train-type{
    color:rgba(255,255,255,.42);
    font-size:13px;
}

.destination{
    margin-top:3px;

    font-size:29px;
    font-weight:850;
    letter-spacing:-1px;
}

.route-text{
    margin-top:4px;

    color:rgba(255,255,255,.35);
    font-size:11px;
}

/* =========================
   SPEED
========================= */

.speed-card{
    padding:18px;
    border-radius:27px;
    margin-bottom:10px;
}

.speed-label{
    color:rgba(255,255,255,.40);
    font-size:12px;
}

.speed-row{
    display:flex;
    align-items:baseline;
}

.speed{
    font-size:74px;
    line-height:.95;

    font-weight:850;
    letter-spacing:-5px;

    font-variant-numeric:tabular-nums;
}

.speed-unit{
    margin-left:7px;
    color:rgba(255,255,255,.35);
    font-size:13px;
}

/* =========================
   STATION BOARD
========================= */

.station-card{
    padding:18px 16px 17px;
    border-radius:28px;
}

.board-label{
    margin-bottom:13px;

    color:rgba(255,255,255,.40);
    font-size:12px;
}

/*
   ＞ ＞ ＞ ＞
   博 鳥 久 日
   多 栖 米 田
*/

.arrow-row{
    display:grid;
    grid-template-columns:repeat(4,1fr);

    margin-bottom:2px;
}

.arrow{
    text-align:left;

    color:rgba(255,255,255,.72);

    font-size:18px;
    font-weight:850;
}

.arrow.empty{
    visibility:hidden;
}

.station-board{
    display:grid;
    grid-template-columns:repeat(4,1fr);
}

.station-column{
    min-height:125px;

    display:flex;
    justify-content:flex-start;
    align-items:flex-start;
}

.station-name{
    display:flex;
    flex-direction:column;
    align-items:flex-start;

    color:#fff;

    font-size:18px;
    line-height:1.04;

    font-weight:800;

    text-align:left;
    white-space:pre-line;

    transition:
        opacity .25s ease,
        transform .35s ease;
}

.station-name.current{
    transform:scale(1.05);
    transform-origin:left top;

    text-shadow:
        0 0 20px
        rgba(255,255,255,.22);
}

.station-name.empty{
    opacity:0;
}

/* =========================
   CURRENT SECTION
========================= */

.section-card{
    margin-top:10px;
    padding:17px;

    border-radius:25px;
}

.section-label{
    color:rgba(255,255,255,.38);
    font-size:11px;
    margin-bottom:7px;
}

.section-name{
    font-size:20px;
    font-weight:800;
    letter-spacing:-.5px;
}

/*
   博多 → 鳥栖
   ━━━━━━━=====
*/

.section-route{
    display:flex;
    align-items:center;
    gap:9px;

    margin-top:10px;

    font-size:14px;
    font-weight:700;
}

.section-arrow{
    color:rgba(255,255,255,.50);
}

.section-progress{
    position:relative;

    width:100%;
    height:8px;

    margin-top:9px;

    border-radius:999px;

    background:
        repeating-linear-gradient(
            90deg,
            rgba(255,255,255,.09) 0,
            rgba(255,255,255,.09) 18px,
            transparent 18px,
            transparent 24px
        );

    overflow:hidden;
}

.section-progress-fill{
    width:0%;
    height:100%;

    border-radius:999px;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.25),
            rgba(255,255,255,.95)
        );

    transition:
        width .7s
        cubic-bezier(.2,.8,.2,1);
}

.distance{
    margin-top:7px;

    text-align:right;

    color:rgba(255,255,255,.32);
    font-size:10px;
}

/* =========================
   GPS
========================= */

.gps-card{
    margin-top:10px;
    padding:14px;

    border-radius:22px;

    text-align:center;
}

.gps-status{
    color:rgba(255,255,255,.40);
    font-size:12px;
}

.gps-button{
    width:100%;
    margin-top:8px;

    padding:12px;

    border:0;
    border-radius:16px;

    background:rgba(255,255,255,.07);

    color:white;

    font-size:13px;
    font-weight:700;
}

/* =========================
   CONTROL BUBBLE
========================= */

.control-bubble{
    position:fixed;

    left:50%;
    bottom:
        calc(
            18px +
            env(safe-area-inset-bottom)
        );

    z-index:500;

    display:flex;
    gap:7px;

    padding:7px;

    border-radius:22px;

    background:
        rgba(38,38,42,.78);

    border:
        1px solid
        rgba(255,255,255,.16);

    box-shadow:
        0 18px 55px rgba(0,0,0,.48),
        inset 0 1px 0 rgba(255,255,255,.15);

    backdrop-filter:
        blur(30px)
        saturate(170%);

    -webkit-backdrop-filter:
        blur(30px)
        saturate(170%);

    opacity:0;
    pointer-events:none;

    transform:
        translate(-50%,30px)
        scale(.88);

    transition:
        opacity .25s ease,
        transform .42s cubic-bezier(.2,.8,.2,1);
}

.control-bubble.show{
    opacity:1;
    pointer-events:auto;

    transform:
        translate(-50%,0)
        scale(1);
}

.control-button{
    border:0;

    padding:12px 15px;

    border-radius:16px;

    background:rgba(255,255,255,.09);
    color:white;

    font-size:13px;
    font-weight:750;
}

.control-button:active{
    background:rgba(255,255,255,.18);
}

/* =========================
   TEST
========================= */

.test-badge{
    position:fixed;

    top:
        calc(
            8px +
            env(safe-area-inset-top)
        );

    right:9px;

    z-index:1000;

    display:none;

    padding:6px 10px;

    border-radius:999px;

    background:rgba(255,255,255,.09);

    border:
        1px solid
        rgba(255,255,255,.10);

    color:rgba(255,255,255,.48);

    font-size:9px;
    font-weight:750;

    backdrop-filter:blur(20px);
}

/* =========================
   ANIMATION
========================= */

.fade-in{
    animation:
        fadeIn .45s
        cubic-bezier(.2,.8,.2,1);
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:
            translateY(10px)
            scale(.985);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}

@media(max-width:430px){

    .speed{
        font-size:69px;
    }

    .station-name{
        font-size:17px;
    }

    .destination{
        font-size:27px;
    }
}

</style>
</head>

<body>

<div id="testBadge"

<!-- =====================================================

===================================================== -->

<section id="startScreen"
         class="app">

    <div class="glass start-card">

        <div class="title">

        </div>

        <div class="subtitle">

        </div>

            列車種別
        </div>

        <select id="trainType">

            <option value="sonic">
                特急ソニック

</section>


<!-- =====================================================

===================================================== -->

<section id="stationSelectScreen"

        <div class="select-title">
            停車駅を選択

            </button>

        </div>


        <div id="stationList"
             class="station-list">
        </div>


        <button
            class="main-button"
            onclick="startTrain()">

            この設定で運転開始

        </button>

    </div>

</section>


<!-- =====================================================
     MAIN
===================================================== -->

<section id="mainScreen"
         class="app">

    <div class="glass header fade-in">

        <div id="mainType"
             class="train-type">
            特急ソニック
        </div>

        <div id="mainDestination"
             class="destination">
            博多行き
        </div>

        <div id="mainRoute"
             class="route-text">
        </div>

    </div>


    <div class="glass speed-card fade-in">

        <div class="board-label">

             class="arrow-row">
        </div>


        <div id="stationBoard"
             class="station-board">
        </div>

    </div>


    <!-- CURRENT SECTION -->

    <div class="glass section-card fade-in">

        <div class="section-label">
            現在の走行区間
        </div>

        <div id="sectionName"
             class="section-name">
            博多 → 鳥栖
        </div>

        <div class="section-route">

            <span id="sectionFrom">
                博多
            </span>

            <span class="section-arrow">
                →

            GPSを開始

    </div>

</section>


<!-- =====================================================
     3 TAP CONTROL
===================================================== -->

<div id="controlBubble"

    <button
        class="control-button"
        onclick="previousStation()">

        ← 前の駅

    </button>

    <button
        class="control-button"
        onclick="nextStation()">

        次の駅 →

    </button>

</div>

/* =====================================================

let trainType =

let destination =

/* =====================================================

===================================================== */

function chooseDestination(dest){

    destination =
        dest;


    document
    .querySelectorAll(
        ".destination-button"
    )
    .forEach(
        button => {

            button.classList.toggle(
                "selected",
                button.dataset.destination
                === dest
            );

        }
    );

}


/* =====================================================
   TRAIN TYPE
===================================================== */

document
.getElementById("trainType")
.addEventListener(
    "change",
    function(){

        trainType =
            this.value;


        destination =
            null;


        document
        .querySelectorAll(
            ".destination-button"
        )
        .forEach(
            button =>
                button.classList.remove(
                    "selected"
                )
        );

    }
);


/* =====================================================
   GET ROUTE
===================================================== */

function getRoute(){

    /*
      ソニック
    */

    if(trainType === "sonic"){

        return SONIC_ROUTE.slice();

    }


    /*
      ゆふいんの森
    */

    if(trainType === "yufuin"){

        return YUFUIN_ROUTE.slice();

    }


    /*
      普通列車

      行き先によって
      使用路線を決める。

      大分方面：
      中津 → 大分

      佐伯方面：
      中津 → 佐伯

      博多方面：
      日田 → 大分 → 博多側
      として扱わず、
      久大本線を使用。
    */

    if(trainType === "local"){

        if(destination === "佐伯"){

            return NIPPO.slice();

        }

        if(destination === "大分"){

            return NIPPO.slice(
                0,
                NIPPO.indexOf("大分") + 1
            );

        }

        if(destination === "博多"){

            return KYUDAI
                .slice()
                .reverse();

        }

    }


    return SONIC_ROUTE.slice();

}


/* =====================================================
   OPEN STATION SELECT
===================================================== */

function openStationSelection(){

    if(!destination){

        alert(
            "行き先を選択してください。"
        );

        return;

    }


    candidateStations =
        getRoute();


    /*
      行き先より先を切る。

      例：
      大分行きなら
      中津 → ... → 大分

      佐伯行きなら
      中津 → ... → 佐伯
    */

    const destinationIndex =
        candidateStations.indexOf(
            destination
        );


    if(destinationIndex >= 0){

        /*
          博多→大分 のような
          方向の場合はそのまま。

          逆方向の場合も
          ルート配列を必要に応じて
          切り出す。
        */

        if(
            trainType !== "local" &&
            candidateStations[0]
            !== destination
        ){

            candidateStations =
                candidateStations
                .slice(
                    0,
                    destinationIndex + 1
                );

        }

    }


    /*
      普通列車は各駅停車を初期選択
    */

    if(trainType === "local"){

        selectedStations =
            candidateStations.slice();

    }
    else{

        selectedStations = [];

    }


    renderStationList();


    document
    .getElementById(
        "startScreen"
    )
    .style.display =
        "none";


    document
    .getElementById(
        "stationSelectScreen"
    )
    .style.display =
        "block";


    document
    .getElementById(
        "selectSubtitle"
    )
    .textContent =
        destination +
        "行き・停車駅を選択";

}


/* =====================================================
   RENDER LIST
===================================================== */

function renderStationList(){

    const list =
        document
        .getElementById(
            "stationList"
        );


    list.innerHTML = "";


    candidateStations.forEach(
        station => {

            const item =
                document.createElement(
                    "div"
                );


            const selected =
                selectedStations
                .includes(station);


            item.className =
                "station-item" +
                (
                    selected
                    ? " selected"
                    : ""
                );


            item.innerHTML = `

                <div class="station-check">
                    ${selected ? "✓" : ""}
                </div>

                <div class="station-item-name">
                    ${station}
                </div>

            `;


            item.onclick =
                () =>
                    toggleStation(
                        station
                    );


            list.appendChild(item);

        }
    );

}


/* =====================================================
   TOGGLE
===================================================== */

function toggleStation(station){

    const index =
        selectedStations
        .indexOf(station);


    if(index >= 0){

        selectedStations
        .splice(
            index,
            1
        );

    }
    else{

        selectedStations
        .push(station);

    }


    /*
      路線順に並び直す
    */

    selectedStations =
        candidateStations.filter(
            stationName =>
                selectedStations
                .includes(
                    stationName
                )
        );


    renderStationList();

}


/* =====================================================
   ALL
===================================================== */

function selectAll(){

    selectedStations =
        candidateStations.slice();

    renderStationList();

}


/* =====================================================
   CLEAR
===================================================== */

function clearAll(){

    selectedStations = [];

    renderStationList();

}


/* =====================================================
   BACK
===================================================== */

function backStart(){

    document
    .getElementById(
        "stationSelectScreen"
    )
    .style.display =
        "none";


    document
    .getElementById(
        "startScreen"
    )
    .style.display =
        "flex";

}


/* =====================================================
   START
===================================================== */

function startTrain(){

    if(
        selectedStations.length < 2
    ){

        alert(
            "停車駅を2駅以上選択してください。"
        );

        return;

    }


    stations =
        selectedStations.map(
            name => ({
                name:name
            })
        );


    currentIndex =
        0;


    document
    .getElementById(
        "stationSelectScreen"
    )
    .style.display =
        "none";


    document
    .getElementById(
        "mainScreen"
    )
    .style.display =
        "block";


    updateHeader();

    renderBoard();

    updateSection();

    startGPS();

}


/* =====================================================
   HEADER
===================================================== */

function updateHeader(){

    let typeName;


    if(trainType === "sonic"){

        typeName =
            "特急ソニック";

    }
    else if(
        trainType === "yufuin"
    ){

        typeName =
            "特急ゆふいんの森";

    }
    else{

        typeName =
            "普通列車";

    }


    document
    .getElementById(
        "mainType"
    )
    .textContent =
        typeName;


    document
    .getElementById(
        "mainDestination"
    )
    .textContent =
        destination +
        "行き";


    document
    .getElementById(
        "mainRoute"
    )
    .textContent =
        stations[0].name +
        " → " +
        stations[
            stations.length - 1
        ].name;

}


/* =====================================================
   VERTICAL TEXT
===================================================== */

function verticalText(name){

    return [...name]
        .join("\n");

}


/* =====================================================
   BOARD
===================================================== */

function renderBoard(){

    const arrows =
        document
        .getElementById(
            "arrowRow"
        );

    const board =
        document
        .getElementById(
            "stationBoard"
        );


    arrows.innerHTML = "";

    board.innerHTML = "";


    const visible = [];


    /*
      現在駅から4駅。
    */

    for(
        let i = 0;
        i < 4;
        i++
    ){

        const index =
            currentIndex + i;


        visible.push(
            index < stations.length
            ? stations[index]
            : null
        );

    }


    /*
      ＞

      駅が次にも存在するときだけ
      ＞を表示。

      最後の駅の後ろには
      絶対に ＞ を出さない。
    */

    visible.forEach(
        (station,index) => {

            const arrow =
                document.createElement(
                    "div"
                );


            arrow.className =
                "arrow";


            if(
                station &&
                index < 3 &&
                visible[index + 1]
            ){

                arrow.textContent =
                    "＞";

            }
            else{

                arrow.classList.add(
                    "empty"
                );

            }


            arrows.appendChild(
                arrow
            );

        }
    );


    /*
      駅名
    */

    visible.forEach(
        (station,index) => {

            const column =
                document.createElement(
                    "div"
                );


            column.className =
                "station-column";


            if(station){

                const name =
                    document.createElement(
                        "div"
                    );


                name.className =
                    "station-name";


                if(index === 0){

                    name.classList.add(
                        "current"
                    );

                }


                name.textContent =
                    verticalText(
                        station.name
                    );


                column.appendChild(
                    name
                );

            }


            board.appendChild(
                column
            );

        }
    );

}


/* =====================================================
   CURRENT SECTION
===================================================== */

function updateSection(){

    const from =
        stations[
            currentIndex
        ];


    const to =
        stations[
            currentIndex + 1
        ];


    const sectionName =
        document
        .getElementById(
            "sectionName"
        );


    const fromElement =
        document
        .getElementById(
            "sectionFrom"
        );


    const toElement =
        document
        .getElementById(
            "sectionTo"
        );


    if(!from){

        return;

    }


    if(to){

        sectionName.textContent =
            from.name +
            " → " +
            to.name;


        fromElement.textContent =
            from.name;


        toElement.textContent =
            to.name;

    }
    else{

        sectionName.textContent =
            "終点到着";


        fromElement.textContent =
            from.name;


        toElement.textContent =
            "到着";

    }


    document
    .getElementById(
        "sectionProgressFill"
    )
    .style.width =
        "0%";


    document
    .getElementById(
        "distance"
    )
    .textContent =
        testMode
        ? "TEST MODE"
        : "GPS取得中...";

}


/* =====================================================
   NEXT
===================================================== */

function nextStation(){

    if(
        currentIndex >=
        stations.length - 1
    ){

        return;

    }


    currentIndex++;


    renderBoard();

    updateSection();


    /*
      テストモードでは
      次の駅を押すたびに
      ランダムにメーターが進む。
    */

    if(testMode){

        const randomProgress =
            15 +
            Math.random() * 80;


        const randomSpeed =
            Math.floor(
                Math.random() * 121
            );


        document
        .getElementById(
            "sectionProgressFill"
        )
        .style.width =
            randomProgress +
            "%";


        document
        .getElementById(
            "speed"
        )
        .textContent =
            randomSpeed;


        document
        .getElementById(
            "distance"
        )
        .textContent =
            "TEST MODE";

    }

}


/* =====================================================
   PREVIOUS
===================================================== */

function previousStation(){

    if(
        currentIndex <= 0
    ){

        return;

    }


    currentIndex--;


    renderBoard();

    updateSection();

}


/* =====================================================
   GPS
===================================================== */

function startGPS(){

    if(testMode){

        document
        .getElementById(
            "gpsStatus"
        )
        .textContent =
            "テストモード";

        return;

    }


    if(
        !navigator.geolocation
    ){

        document
        .getElementById(
            "gpsStatus"
        )
        .textContent =
            "GPSを利用できません";

        return;

    }


    if(gpsWatch !== null){

        return;

    }


    document
    .getElementById(
        "gpsStatus"
    )
    .textContent =
        "GPS取得中...";


    gpsWatch =
        navigator
        .geolocation
        .watchPosition(

            updateGPS,

            function(){

                document
                .getElementById(
                    "gpsStatus"
                )
                .textContent =
                    "GPS取得エラー";

            },

            {
                enableHighAccuracy:true,
                maximumAge:1000,
                timeout:10000
            }

        );

}


/* =====================================================
   GPS UPDATE
===================================================== */

function updateGPS(position){

    let speed =
        position.coords.speed;


    if(
        speed !== null &&
        !Number.isNaN(speed)
    ){

        speed =
            speed * 3.6;

    }
    else{

        speed = 0;

    }


    document
    .getElementById(
        "speed"
    )
    .textContent =
        Math.round(speed);


    document
    .getElementById(
        "gpsStatus"
    )
    .textContent =
        "GPS接続中";


    /*
      GPSの精度が取れたら
      現在区間のメーターを
      徐々に動かす。

      駅そのものの判定は
      手動の「次の駅」操作を
      基準にしている。
    */

}


/* =====================================================
   THREE TAP
===================================================== */

document.addEventListener(
    "touchend",
    function(){

        tapCount++;


        clearTimeout(
            tapTimer
        );


        tapTimer =
            setTimeout(
                function(){

                    tapCount = 0;

                },
                650
            );


        if(
            tapCount === 3
        ){

            tapCount = 0;

            showControls();

        }

    },
    {
        passive:true
    }
);


/* =====================================================
   CONTROL BUBBLE
===================================================== */

function showControls(){

    const bubble =
        document
        .getElementById(
            "controlBubble"
        );


    bubble.classList.add(
        "show"
    );


    clearTimeout(
        bubbleTimer
    );


    bubbleTimer =
        setTimeout(
            function(){

                bubble.classList.remove(
                    "show"
                );

            },
            4500
        );

}


/* =====================================================
   TEST MODE
===================================================== */

/*
   3連続タップではなく、
   以下の関数を呼び出すと
   テストモードON。

   enableTestMode()
*/

function enableTestMode(){

    testMode = true;


    document
    .getElementById(
        "testBadge"
    )
    .style.display =
        "block";


    document
    .getElementById(
        "gpsStatus"
    )
    .textContent =
        "テストモード";


    document
    .getElementById(
        "speed"
    )
    .textContent =
        "0";

}


/* =====================================================
   DISABLE TEST
===================================================== */

function disableTestMode(){

    testMode = false;


    document
    .getElementById(
        "testBadge"
    )
    .style.display =
        "none";

}


/* =====================================================
   INITIAL
===================================================== */

document
.addEventListener(
    "DOMContentLoaded",
    function(){

        document
        .getElementById(
            "startScreen"
        )
        .style.display =
            "flex";

    }
);

</script>
