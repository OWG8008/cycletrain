<title>特急ソニック10号｜博多行き</title>


<style>

/* =====================================================
   基本
===================================================== */

}

===================================================== */

/* =====================================================
   Liquid Glass
===================================================== */

.glass {

    position: relative;

    overflow: hidden;

    border:
        1px solid
        rgba(255,255,255,.17);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.135),
            rgba(255,255,255,.065) 48%,
            rgba(255,255,255,.035)
        );

    backdrop-filter:
        blur(32px)
        saturate(180%);

    -webkit-backdrop-filter:
        blur(32px)
        saturate(180%);

    box-shadow:

        inset
        0 1px 0
        rgba(255,255,255,.22),

        inset
        0 -1px 0
        rgba(255,255,255,.035),

        0 15px 40px
        rgba(0,0,0,.18);
}


.glass::before {

    content: "";

    position: absolute;

    left: -60%;
    top: -90%;

    width: 190%;
    height: 170%;

    background:
        linear-gradient(
            110deg,
            transparent 43%,

    pointer-events: none;
}

<script>

/* =====================================================
   ソニック10号

   大分 → 博多
===================================================== */

const stations = [

    {
        name: "大分",
        lat: 33.2323,
        lon: 131.6066
    },

    {
        name: "別府",
        lat: 33.2797,
        lon: 131.5004
    },

    {
        name: "杵築",
        lat: 33.4184,
        lon: 131.6171
    },

    {
        name: "宇佐",
        lat: 33.5312,
        lon: 131.3485
    },

    {
        name: "柳ケ浦",
        lat: 33.5650,
        lon: 131.3626
    },

    {
        name: "中津",
        lat: 33.5991,
        lon: 131.1909
    },

    {
        name: "宇島",
        lat: 33.6120,
        lon: 131.1300
    },

    {
        name: "行橋",
        lat: 33.7308,
        lon: 130.9588
    },

    {
        name: "小倉",
        lat: 33.8869,
        lon: 130.8827
    },

    {
        name: "黒崎",
        lat: 33.8660,
        lon: 130.7665
    },

    {
        name: "折尾",
        lat: 33.8650,
        lon: 130.7130
    },

    {
        name: "博多",
        lat: 33.5904,
        lon: 130.4207
    }

];


/* =====================================================
   駅表示を作成
===================================================== */

function createRouteStations() {

    const container =
        document.getElementById(
            "routeStations"
        );


    container.innerHTML = "";


    stations.forEach(
        (station, index) => {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "route-station future";


            element.id =
                "routeStation-" +
                index;


            element.textContent =
                station.name;


            container.appendChild(
                element
            );

        }
    );

}


/* =====================================================
   上部駅表示更新
===================================================== */

function updateRouteStations(
    currentIndex
) {

    stations.forEach(
        (station, index) => {

            const element =
                document.getElementById(
                    "routeStation-" +
                    index
                );


            if (!element) {
                return;
            }


            element.classList.remove(
                "passed",
                "current",
                "future"
            );


            if (
                index <
                currentIndex
            ) {

                element.classList.add(
                    "passed"
                );

            }

            else if (
                index ===
                currentIndex
            ) {

                element.classList.add(
                    "current"
                );

            }

            else {

                element.classList.add(
                    "future"
                );

            }

        }
    );

}


/* =====================================================
   設定
===================================================== */

const STATION_RADIUS =
    700;

const SWITCH_DISTANCE =
    500;

const SWITCH_SPEED =
    25;

const ARRIVAL_DISTANCE =
    80;


/* =====================================================
   状態
===================================================== */

let initialized =
    false;

let currentSegment =
    0;

let watchId =
    null;


/* =====================================================
   距離計算
===================================================== */

function getDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R =
        6371000;

    const rad =
        Math.PI / 180;

    const dLat =
        (lat2 - lat1) * rad;

    const dLon =
        (lon2 - lon1) * rad;

    const a =

        Math.sin(dLat / 2) ** 2

        +

        Math.cos(lat1 * rad) *
        Math.cos(lat2 * rad) *
        Math.sin(dLon / 2) ** 2;


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );


    return R * c;

}


/* =====================================================
   点と駅間の距離
===================================================== */

function pointToSegmentDistance(
    lat,
    lon,
    a,
    b
) {

    const latScale =
        111320;

    const lonScale =
        111320 *
        Math.cos(
            lat *
            Math.PI /
            180
        );


    const px =
        lon *
        lonScale;

    const py =
        lat *
        latScale;


    const ax =
        a.lon *
        lonScale;

    const ay =
        a.lat *
        latScale;


    const bx =
        b.lon *
        lonScale;

    const by =
        b.lat *
        latScale;


    const dx =
        bx - ax;

    const dy =
        by - ay;


    const lengthSquared =
        dx * dx +
        dy * dy;


    if (
        lengthSquared === 0
    ) {

        return Math.sqrt(
            (px - ax) ** 2 +
            (py - ay) ** 2
        );

    }


    let t =
        (
            (px - ax) * dx +
            (py - ay) * dy
        )
        /
        lengthSquared;


    t =
        Math.max(
            0,
            Math.min(
                1,
                t
            )
        );


    const closestX =
        ax +
        t * dx;

    const closestY =
        ay +
        t * dy;


    return Math.sqrt(

        (px - closestX) ** 2 +

        (py - closestY) ** 2

    );

}


/* =====================================================
   初期区間判定
===================================================== */

function detectInitialSegment(
    lat,
    lon
) {

    /*
       駅そのものに近い場合
    */

    for (
        let i = 0;
        i < stations.length;
        i++
    ) {

        const distance =
            getDistance(
                lat,
                lon,
                stations[i].lat,
                stations[i].lon
            );


        if (
            distance <=
            STATION_RADIUS
        ) {

            /*
               博多
            */

            if (
                i >=
                stations.length - 1
            ) {

                return stations.length - 1;

            }


            /*
               例：

               行橋にいる

               ↓

               行橋 → 小倉
            */

            return i;

        }

    }


    /*
       駅間にいる場合
    */

    let bestSegment =
        0;

    let bestDistance =
        Infinity;


    for (
        let i = 0;
        i < stations.length - 1;
        i++
    ) {

        const distance =
            pointToSegmentDistance(
                lat,
                lon,
                stations[i],
                stations[i + 1]
            );


        if (
            distance <
            bestDistance
        ) {

            bestDistance =
                distance;

            bestSegment =
                i;

        }

    }


    return bestSegment;

}


/* =====================================================
   GPS開始
===================================================== */

function startGPS() {

    if (
        !navigator.geolocation
    ) {

        setStatus(
            "この端末ではGPSを利用できません"
        );

        return;

    }


    if (
        watchId !== null
    ) {

        return;

    }


    setStatus(
        "GPS取得中..."
    );


    watchId =
        navigator.geolocation.watchPosition(

            updateGPS,

            gpsError,

            {

                enableHighAccuracy:
                    true,

                maximumAge:
                    500,

                timeout:
                    10000

            }

        );

}


/* =====================================================
   GPS更新
===================================================== */

function updateGPS(
    position
) {

    const lat =
        position.coords.latitude;

    const lon =
        position.coords.longitude;


    /*
       速度
    */

    let speed =
        position.coords.speed;


    if (
        speed !== null &&
        speed !== undefined &&
        !isNaN(speed)
    ) {

        speed =
            Math.max(
                0,
                speed * 3.6
            );

    }

    else {

        speed = 0;

    }


    const displaySpeed =
        Math.round(speed);


    document.getElementById(
        "speed"
    ).textContent =
        displaySpeed;


    /*
       初回GPS

       現在地から区間を決定
    */

    if (
        !initialized
    ) {

        const detected =
            detectInitialSegment(
                lat,
                lon
            );


        currentSegment =
            detected;


        initialized =
            true;


        /*
           博多
        */

        if (
            currentSegment >=
            stations.length - 1
        ) {

            showArrival();

            return;

        }

    }


    /*
       終点
    */

    if (
        currentSegment >=
        stations.length - 1
    ) {

        showArrival();

        return;

    }


    const to =
        stations[
            currentSegment + 1
        ];


    const remaining =
        getDistance(
            lat,
            lon,
            to.lat,
            to.lon
        );


    /*
       駅切り替え

       近い＋減速

       または

       かなり近い
    */

    const slowEnough =
        displaySpeed <=
        SWITCH_SPEED;

    const closeEnough =
        remaining <=
        SWITCH_DISTANCE;

    const almostAtStation =
        remaining <=
        ARRIVAL_DISTANCE;


    if (

        (
            closeEnough &&
            slowEnough
        )

        ||

        almostAtStation

    ) {

        currentSegment++;


        if (
            currentSegment >=
            stations.length - 1
        ) {

            showArrival();

            return;

        }

    }


    updateDisplay(
        lat,
        lon
    );

}


/* =====================================================
   表示更新
===================================================== */

function updateDisplay(
    lat,
    lon
) {

    const from =
        stations[
            currentSegment
        ];

    const to =
        stations[
            currentSegment + 1
        ];


    /*
       区間距離
    */

    const totalDistance =
        getDistance(
            from.lat,
            from.lon,
            to.lat,
            to.lon
        );


    /*
       次駅まで
    */

    const remaining =
        getDistance(
            lat,
            lon,
            to.lat,
            to.lon
        );


    /*
       バー進行率
    */

    let progress =
        1 -
        (
            remaining /
            totalDistance
        );


    progress =
        Math.max(
            0,
            Math.min(
                1,
                progress
            )
        );


    /*
       駅名
    */

    document.getElementById(
        "fromStation"
    ).textContent =
        from.name;


    document.getElementById(
        "toStation"
    ).textContent =
        to.name;


    /*
       バー
    */

    document.getElementById(
        "progressFill"
    ).style.width =
        (
            progress * 100
        ) + "%";


    /*
       距離
    */

    const km =
        remaining / 1000;


    if (
        km < 0.1
    ) {

        document.getElementById(
            "distanceText"
        ).textContent =
            to.name +
            " まもなく";

    }

    else {

        document.getElementById(
            "distanceText"
        ).textContent =
            to.name +
            "まであと " +
            km.toFixed(1) +
            " km";

    }


    /*
       現在区間
    */

    document.getElementById(
        "sectionName"
    ).textContent =
        from.name +
        " → " +
        to.name;


    /*
       次駅
    */

    document.getElementById(
        "nextInfo"
    ).textContent =
        "次は「" +
        to.name +
        "」です";


    /*
       上部駅表示

       現在の「出発駅」を強調
    */

    updateRouteStations(
        currentSegment
    );


    setStatus(
        "● GPS接続中"
    );

}


/* =====================================================
   博多到着
===================================================== */

function showArrival() {

    document.getElementById(
        "speed"
    ).textContent =
        "0";


    document.getElementById(
        "fromStation"
    ).textContent =
        "博多";


    document.getElementById(
        "toStation"
    ).textContent =
        "";


    document.getElementById(
        "progressFill"
    ).style.width =
        "100%";


    document.getElementById(
        "distanceText"
    ).textContent =
        "博多 到着";


    document.getElementById(
        "sectionName"
    ).textContent =
        "博多";


    document.getElementById(
        "nextInfo"
    ).textContent =
        "終点です";


    updateRouteStations(
        stations.length - 1
    );


    setStatus(
        "● 博多に到着しました"
    );

}


/* =====================================================
   GPSエラー
===================================================== */

function gpsError(
    error
) {

    let message =
        "GPSを取得できません";


    switch (
        error.code
    ) {

        case 1:

            message =
                "位置情報の使用を許可してください";

            break;


        case 2:

            message =
                "現在地を取得できません";

            break;


        case 3:

            message =
                "GPS取得がタイムアウトしました";

            break;

    }


    setStatus(
        message
    );

}


/* =====================================================
   ステータス
===================================================== */

function setStatus(
    text
) {

    document.getElementById(
        "gpsStatus"
    ).textContent =
        text;

}


/* =====================================================
   起動
===================================================== */

window.addEventListener(
    "load",
    () => {

        createRouteStations();

        updateRouteStations(
            0
        );

        startGPS();

    }
);

</script>

</body>

</html>
