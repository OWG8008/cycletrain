<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no"
>

<title>GPS Train Monitor</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    background:#08090d;
    color:#fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Noto Sans JP",
        sans-serif;
}

body{
    min-height:100vh;
}

button{
    font:inherit;
}

.hidden{
    display:none !important;
}


/* =====================================================
   共通
===================================================== */

.page{
    width:100%;
    max-width:760px;
    margin:auto;
    padding:20px 15px 35px;
}

.card{
    background:#15171d;
    border:1px solid #252832;
    border-radius:23px;
    padding:19px;
    margin-bottom:14px;
}

.title{
    font-size:31px;
    font-weight:900;
    letter-spacing:-1.5px;
}

.subtitle{
    color:#818894;
    font-size:12px;
    margin-top:5px;
    margin-bottom:22px;
}

.section-title{
    font-size:17px;
    font-weight:900;
    margin-bottom:13px;
}


/* =====================================================
   設定画面
===================================================== */

.train-grid{
    display:grid;
    gap:10px;
}

.train-button{
    border:0;
    border-radius:18px;
    padding:17px;
    text-align:left;
    background:#252831;
    color:#fff;
}

.train-button:active,
.route-button:active,
.destination-button:active,
.stop-button:active,
.start-button:active{
    transform:scale(.97);
}

.train-button.selected{
    background:#315fea;
}

.train-name{
    font-size:19px;
    font-weight:900;
}

.train-description{
    margin-top:5px;
    color:#8c93a0;
    font-size:12px;
}

.train-button.selected .train-description{
    color:#dce5ff;
}


/* 路線 */

.route-grid{
    display:grid;
    gap:9px;
}

.route-button{
    border:0;
    border-radius:17px;
    padding:16px;
    background:#252831;
    color:#fff;
    text-align:left;
}

.route-button.selected{
    background:#315fea;
}

.route-name{
    font-size:17px;
    font-weight:900;
}

.route-detail{
    color:#8b929f;
    font-size:11px;
    margin-top:4px;
}

.route-button.selected .route-detail{
    color:#dce5ff;
}


/* 行き先 */

.destination-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
}

.destination-button{
    border:0;
    border-radius:15px;
    padding:15px 8px;
    background:#252831;
    color:#fff;
    font-weight:800;
}

.destination-button.selected{
    background:#315fea;
}


/* ソニック停車駅 */

.stop-list{
    display:grid;
    gap:8px;
}

.stop-button{
    width:100%;
    border:0;
    border-radius:15px;
    padding:14px;
    background:#252831;
    color:#fff;

    display:flex;
    align-items:center;
    gap:12px;

    text-align:left;
}

.stop-check{
    width:23px;
    height:23px;

    border-radius:7px;

    border:2px solid #666d79;

    display:flex;
    align-items:center;
    justify-content:center;

    flex-shrink:0;
}

.stop-check::after{
    content:"";

    width:8px;
    height:4px;

    border-left:2px solid #fff;
    border-bottom:2px solid #fff;

    transform:
        rotate(-45deg)
        scale(0);

    transition:.15s;
}

.stop-button.selected{
    background:#202945;
}

.stop-button.selected
.stop-check{
    background:#315fea;
    border-color:#315fea;
}

.stop-button.selected
.stop-check::after{
    transform:
        rotate(-45deg)
        scale(1);
}

.stop-name{
    font-size:14px;
    font-weight:800;
}

.stop-note{
    margin-left:auto;
    color:#747b87;
    font-size:10px;
}


/* 設定情報 */

.info{
    color:#858c98;
    font-size:13px;
    line-height:1.8;
}

.info b{
    color:#fff;
}

.start-button{
    width:100%;
    border:0;
    border-radius:19px;
    padding:18px;

    background:#27c86d;
    color:#fff;

    font-size:18px;
    font-weight:900;
}

.start-button:disabled{
    background:#282c34;
    color:#656b76;
}


/* =====================================================
   運転画面
===================================================== */

.drive{
    width:100%;
    max-width:850px;
    margin:auto;
    padding:13px;
}

.top{
    min-height:48px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.service{
    font-size:16px;
    font-weight:900;
}

.service-destination{
    margin-top:2px;
    color:#858c98;
    font-size:11px;
}

.gps-status{
    font-size:10px;
    font-weight:800;
    color:#65d38f;
}


/* 行き先 */

.destination-card{
    background:#15171d;
    border-radius:23px;
    padding:21px;
    margin-bottom:13px;
}

.destination{
    font-size:36px;
    line-height:1;
    font-weight:900;
    letter-spacing:-2px;
}

.route-name-drive{
    color:#858c98;
    font-size:12px;
    margin-top:8px;
}


/* =====================================================
   次駅メーター
===================================================== */

.station-card{
    background:#15171d;
    border-radius:23px;
    padding:21px;
    margin-bottom:13px;
}

.station-header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:17px;
}

.station-header-title{
    font-size:15px;
    font-weight:900;
}

.station-count{
    color:#737a86;
    font-size:10px;
}


/* 現在駅 */

.current-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;

    margin-bottom:8px;
}

.current-label{
    color:#858c98;
    font-size:10px;
}

.current-name{
    font-size:17px;
    font-weight:900;
}

.next-label{
    text-align:right;
    color:#858c98;
    font-size:10px;
}

.next-name{
    text-align:right;
    font-size:20px;
    font-weight:900;
}


/* Apple Music風バー */

.progress-box{
    position:relative;

    width:100%;
    height:22px;

    margin-top:13px;

    background:#30333b;

    border-radius:999px;

    overflow:hidden;
}

.progress-fill{
    position:absolute;

    left:0;
    top:0;

    width:0%;
    height:100%;

    background:#fff;

    border-radius:999px;

    transition:
        width .25s
        cubic-bezier(.22,.61,.36,1);
}

.progress-dot{
    position:absolute;

    top:50%;
    left:0%;

    width:14px;
    height:14px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 0 3px
        rgba(255,255,255,.08);

    transition:
        left .25s
        cubic-bezier(.22,.61,.36,1);
}

.progress-distance{
    display:flex;
    justify-content:space-between;

    margin-top:8px;

    color:#6d7480;
    font-size:10px;
}


/* =====================================================
   速度
===================================================== */

.speed-card{
    background:#15171d;
    border-radius:23px;

    padding:24px;

    display:flex;
    flex-direction:column;
    align-items:center;
}

.speed-circle{
    width:190px;
    height:190px;

    border-radius:50%;

    border:2px solid #3a3e47;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    box-shadow:
        inset 0 0 35px
        rgba(255,255,255,.025);
}

.speed-number{
    font-size:59px;
    line-height:.9;

    font-weight:900;

    letter-spacing:-3px;
}

.speed-unit{
    color:#858c98;
    font-size:13px;
    margin-top:10px;
}

.speed-caption{
    margin-top:14px;
    color:#858c98;
    font-size:11px;
}

.gps-coordinates{
    margin-top:12px;
    color:#5e6570;
    font-size:9px;
    text-align:center;
}


/* =====================================================
   ATS表示
===================================================== */

.ats{
    position:fixed;

    left:14px;
    right:14px;
    bottom:14px;

    z-index:100;

    background:
        rgba(23,26,33,.97);

    border:
        1px solid #383d47;

    border-radius:18px;

    padding:13px 16px;

    transform:
        translateY(140%);

    transition:.3s;
}

.ats.show{
    transform:
        translateY(0);
}

.ats-label{
    color:#ffd34d;
    font-size:9px;
    font-weight:900;
}

.ats-text{
    margin-top:3px;
    font-size:14px;
    font-weight:900;
}


/* =====================================================
   到着
===================================================== */

.arrival{
    position:fixed;
    inset:0;

    z-index:200;

    background:#08090d;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:25px;
}

.arrival-box{
    width:100%;
    max-width:420px;
    text-align:center;
}

.arrival-small{
    color:#7d8490;
    font-size:13px;
}

.arrival-title{
    margin:10px 0;

    font-size:46px;
    font-weight:900;
}

.arrival-button{
    width:100%;

    margin-top:22px;

    border:0;
    border-radius:18px;

    padding:17px;

    background:#315fea;
    color:#fff;

    font-weight:900;
}


/* =====================================================
   PC
===================================================== */

@media(min-width:700px){

    .train-grid{
        grid-template-columns:
            repeat(3,1fr);
    }

    .destination-grid{
        grid-template-columns:
            repeat(4,1fr);
    }
}

</style>
</head>


<body>


<!-- =====================================================
     設定
===================================================== -->

<section
    id="setup"
    class="page">

    <div class="title">
        列車設定
    </div>

    <div class="subtitle">
        列車種別・路線・行き先を設定
    </div>


    <!-- 列車種別 -->

    <div class="card">

        <div class="section-title">
            列車種別
        </div>

        <div class="train-grid">

            <button
                class="train-button"
                data-train="普通"
                onclick="selectTrain('普通')">

                <div class="train-name">
                    普通
                </div>

                <div class="train-description">
                    路線・終着駅を指定
                </div>

            </button>


            <button
                class="train-button"
                data-train="特急ソニック"
                onclick="selectTrain('特急ソニック')">

                <div class="train-name">
                    特急ソニック
                </div>

                <div class="train-description">
                    行き先・停車駅を指定
                </div>

            </button>


            <button
                class="train-button"
                data-train="特急ゆふいんの森"
                onclick="selectTrain('特急ゆふいんの森')">

                <div class="train-name">
                    特急ゆふいんの森
                </div>

                <div class="train-description">
                    行き先を指定
                </div>

            </button>

        </div>
    </div>


    <!-- 路線 -->

    <div
        id="route-card"
        class="card hidden">

        <div class="section-title">
            路線選択
        </div>

        <div class="route-grid">

            <button
                class="route-button"
                data-route="日豊本線"
                onclick="selectRoute('日豊本線')">

                <div class="route-name">
                    日豊本線
                </div>

                <div class="route-detail">
                    中津 ～ 佐伯
                </div>

            </button>


            <button
                class="route-button"
                data-route="久大本線"
                onclick="selectRoute('久大本線')">

                <div class="route-name">
                    久大本線
                </div>

                <div class="route-detail">
                    大分 ～ 日田
                </div>

            </button>


            <button
                class="route-button"
                data-route="豊肥本線"
                onclick="selectRoute('豊肥本線')">

                <div class="route-name">
                    豊肥本線
                </div>

                <div class="route-detail">
                    大分 ～ 宮地
                </div>

            </button>

        </div>
    </div>


    <!-- 行き先 -->

    <div
        id="destination-card"
        class="card hidden">

        <div
            id="destination-question"
            class="section-title">
            行き先
        </div>

        <div
            id="destination-grid"
            class="destination-grid">
        </div>

    </div>


    <!-- ソニック停車駅 -->

    <div
        id="sonic-stop-card"
        class="card hidden">

        <div class="section-title">
            ソニック停車駅
        </div>

        <div class="subtitle">
            停車する駅を選択してください
        </div>

        <div
            id="sonic-stop-list"
            class="stop-list">
        </div>

    </div>


    <!-- 設定内容 -->

    <div class="card">

        <div class="section-title">
            設定内容
        </div>

        <div
            id="setting-info"
            class="info">
            列車種別を選択してください
        </div>

    </div>


    <button
        id="start-button"
        class="start-button"
        disabled
        onclick="startDrive()">

        運転開始

    </button>

</section>



<!-- =====================================================
     運転画面
===================================================== -->

<section
    id="drive"
    class="drive hidden">


    <div class="top">

        <div>

            <div
                id="drive-service"
                class="service">
                --
            </div>

            <div
                id="drive-destination-small"
                class="service-destination">
                --
            </div>

        </div>


        <div
            id="gps-status"
            class="gps-status">
            GPS待機中
        </div>

    </div>


    <!-- 行き先 -->

    <div class="destination-card">

        <div
            id="drive-destination"
            class="destination">
            --
        </div>

        <div
            id="drive-route"
            class="route-name-drive">
            --
        </div>

    </div>


    <!-- 次駅メーター -->

    <div class="station-card">

        <div class="station-header">

            <div class="station-header-title">
                次の駅
            </div>

            <div
                id="station-count"
                class="station-count">
                --
            </div>

        </div>


        <div class="current-row">

            <div>

                <div class="current-label">
                    現在駅
                </div>

                <div
                    id="current-station"
                    class="current-name">
                    --
                </div>

            </div>


            <div>

                <div class="next-label">
                    NEXT
                </div>

                <div
                    id="next-station"
                    class="next-name">
                    --
                </div>

            </div>

        </div>


        <div class="progress-box">

            <div
                id="progress-fill"
                class="progress-fill">
            </div>

            <div
                id="progress-dot"
                class="progress-dot">
            </div>

        </div>


        <div class="progress-distance">

            <span>
                現在位置
            </span>

            <span
                id="next-distance">
                --
            </span>

        </div>

    </div>


    <!-- 速度 -->

    <div class="speed-card">

        <div class="speed-circle">

            <div
                id="speed-number"
                class="speed-number">
                0
            </div>

            <div class="speed-unit">
                km/h
            </div>

        </div>

        <div class="speed-caption">
            現在速度
        </div>

        <div
            id="gps-coordinates"
            class="gps-coordinates">
            GPS取得中...
        </div>

    </div>

</section>


<!-- ATS -->

<div
    id="ats"
    class="ats">

    <div class="ats-label">
        GPS TRAIN
    </div>

    <div
        id="ats-text"
        class="ats-text">
        --
    </div>

</div>


<!-- 到着 -->

<div
    id="arrival"
    class="arrival hidden">

    <div class="arrival-box">

        <div class="arrival-small">
            終着駅に到着しました
        </div>

        <div
            id="arrival-name"
            class="arrival-title">
            --
        </div>

        <div class="arrival-small">
            お疲れさまでした
        </div>

        <button
            class="arrival-button"
            onclick="returnToSetup()">

            設定画面へ

        </button>

    </div>

</div>

/* =====================================================
   ソニック停車駅選択
===================================================== */

function showSonicStops(){

    const card =
        document.getElementById(
            "sonic-stop-card"
        );

    const list =
        document.getElementById(
            "sonic-stop-list"
        );


    card.classList.remove("hidden");

    list.innerHTML = "";


    /*
       行き先に応じて候補を
       適切な区間にする
    */

    let route =
        getSonicRoute(destination);


    /*
       始発・終着は必ず選択
    */

    sonicStops = [
        route[0],
        route[route.length - 1]
    ];


    route.forEach(
        (station,index)=>{

            const mandatory =
                index === 0 ||
                index === route.length - 1;


            const button =
                document.createElement("button");

            button.className =
                "stop-button";


            if(mandatory){

                button.classList.add(
                    "selected"
                );

            }


            button.innerHTML = `
                <span class="stop-check"></span>
                <span class="stop-name">
                    ${station}
                </span>
                <span class="stop-note">
                    ${mandatory ? "必停" : ""}
                </span>
            `;


            button.onclick = ()=>{

                if(mandatory){

                    return;

                }


                if(
                    sonicStops.includes(
                        station
                    )
                ){

                    sonicStops =
                        sonicStops.filter(
                            item =>
                                item !== station
                        );

                    button.classList.remove(
                        "selected"
                    );

                }else{

                    sonicStops.push(
                        station
                    );

                    button.classList.add(
                        "selected"
                    );

                }


                updateSettingInfo();

            };


            list.appendChild(button);

        }
    );
}


/* =====================================================
   ソニック経路
===================================================== */

function getSonicRoute(destination){

    /*
       候補駅を実際の方向に並べる。

       博多行き
       → 佐伯方面から博多

       大分行き
       → 博多方面から大分

       佐伯行き
       → 博多方面から佐伯
    */

    if(destination === "博多"){

        return [
            ...SONIC_ROUTE
        ].reverse();

    }


    if(destination === "大分"){

        const end =
            SONIC_ROUTE.indexOf(
                "大分"
            );

        return SONIC_ROUTE.slice(
            0,
            end + 1
        );

    }


    if(destination === "佐伯"){

        return [
            ...SONIC_ROUTE
        ];

    }


    return [];
}

/* =====================================================
   運転ルート作成
===================================================== */

function makeDriveRoute(){

    /*
       普通
    */

    if(trainType === "普通"){

        const route =
            LOCAL_ROUTES[
                selectedRoute
            ];

        const destinationIndex =
            route.indexOf(
                destination
            );


        if(destinationIndex < 0){

            return [];

        }


        /*
           路線の並びをそのまま使用
        */

        return route.slice(
            0,
            destinationIndex + 1
        );
    }


    /*
       ソニック
    */

    if(
        trainType === "特急ソニック"
    ){

        const route =
            getSonicRoute(
                destination
            );


        /*
           選択された駅だけ残す。

           ただし順番は絶対に
           ルート順を維持する。
        */

        return route.filter(
            station =>
                sonicStops.includes(
                    station
                )
        );
    }


    /*
       ゆふいんの森
    */

    if(
        trainType ===
        "特急ゆふいんの森"
    ){

        let route =
            [...YUFUIN_ROUTE];


        const index =
            route.indexOf(
                destination
            );


        if(index < 0){

            return [];

        }


        /*
           博多方面へ行く場合
        */

        if(destination === "博多"){

            return [
                ...route
            ].reverse();
        }


        /*
           由布院・別府
        */

        return route.slice(
            0,
            index + 1
        );
    }


    return [];
}


/* =====================================================
   運転開始
===================================================== */

function startDrive(){

    currentStations =
        makeDriveRoute();


    if(
        currentStations.length < 2
    ){

    */

        const station of currentStations

        ){

                station +
                " のGPS座標がありません。"
            );

            return;
        }
    }


    driveStarted = true;

    currentStationIndex = 0;

    gpsLat = null;

    gpsLon = null;

    gpsSpeed = 0;

/* =====================================================
   GPS開始
===================================================== */

function startGPS(){

    if(
        !navigator.geolocation
    ){

        setGPSStatus(
            "GPS非対応"
        );

        showATS(
            "この端末ではGPSを利用できません"
        );

        return;
    }


    gpsWatchId =
        navigator.geolocation.watchPosition(

            handleGPS,

            handleGPSError,

            {
                enableHighAccuracy:true,

                /*
                   キャッシュされた古い位置を
                   なるべく使わない。
                */

                maximumAge:1000,

                timeout:10000
            }
        );
}


/* =====================================================
   GPS本体
===================================================== */

function handleGPS(position){

    const lat =
        position.coords.latitude;

    const lon =
        position.coords.longitude;


    const timestamp =
        position.timestamp ||
        Date.now();


    gpsLat = lat;

    gpsLon = lon;


    /*
       GPS速度を取得。

       coords.speed は m/s。
    */

    let measuredSpeed =
        null;


    if(
        Number.isFinite(
            position.coords.speed
        ) &&
        position.coords.speed >= 0
    ){

        measuredSpeed =
            position.coords.speed *
            3.6;

    }


    /*
       speedが取得できない場合のみ
       前回位置との差から計算。
    */

    if(
        measuredSpeed === null &&
        previousGPS
    ){

        const elapsed =
            (
                timestamp -
                previousGPS.time
            ) / 1000;


        if(
            elapsed > 0.2 &&
            elapsed < 30
        ){

            const distance =
                distanceMeters(
                    previousGPS.lat,
                    previousGPS.lon,
                    lat,
                    lon
                );


            const calculated =
                distance /
                elapsed *
                3.6;


            /*
               GPS飛び防止。

               前回値から一気に大きく
               飛んだ場合は採用しない。
            */

            if(
                calculated <=
                MAX_REASONABLE_SPEED
            ){

                measuredSpeed =
                    calculated;

            }else{

                measuredSpeed =
                    smoothedSpeed;
            }
        }
    }


    if(
        measuredSpeed === null
    ){

        measuredSpeed =
            smoothedSpeed;
    }


    /*
       絶対的な異常値を排除
    */

    if(
        measuredSpeed >
        MAX_REASONABLE_SPEED
    ){

        measuredSpeed =
            smoothedSpeed;
    }


    /*
       マイナス防止
    */

    measuredSpeed =
        Math.max(
            0,
            measuredSpeed
        );


    /*
       GPS速度を滑らかにする。

       ただし5km/h判定は
       生のGPS速度ではなく、
       安定化した速度を使用。
    */

    const alpha =
        measuredSpeed <
        smoothedSpeed
        ? 0.28
        : 0.18;


    smoothedSpeed =
        smoothedSpeed +
        (
            measuredSpeed -
            smoothedSpeed
        ) *
        alpha;


    /*
       0.5km/h未満は0
    */

    if(
        smoothedSpeed < 0.5
    ){

        smoothedSpeed = 0;
    }


    gpsSpeed =
        smoothedSpeed;


    document
        .getElementById(
            "speed-number"
        )
        .textContent =
        Math.round(
            gpsSpeed
        );


    previousGPS = {
        lat,
        lon,
        time:timestamp
    };


    /*
       GPS位置から
       次駅までの進行状況を更新
    */

    updateNextStationProgress(
        lat,
        lon
    );


    setGPSStatus(
        "GPS接続中"
    );


    document
        .getElementById(
            "gps-coordinates"
        )
        .textContent =
        `GPS ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
}


/* =====================================================
   GPSエラー
===================================================== */

function handleGPSError(error){

    setGPSStatus(
        "GPSエラー"
    );


    let message =
        "GPSを取得できません";


    if(error.code === 1){

        message =
            "位置情報の使用を許可してください";

    }else if(error.code === 2){

        message =
            "現在位置を取得できません";

    }else if(error.code === 3){

        message =
            "GPS取得がタイムアウトしました";
    }


    showATS(message);
}


/* =====================================================
   次駅進行
===================================================== */

function updateNextStationProgress(
    lat,
    lon
){

    /*
       終着済み
    */

    if(
        currentStationIndex >=
        currentStations.length - 1
    ){

        return;
    }


    const currentStation =
        currentStations[
            currentStationIndex
        ];


    const nextStation =
        currentStations[
            currentStationIndex + 1
        ];


    const current =
        STATIONS[
            currentStation
        ];


    const next =
        STATIONS[
            nextStation
        ];


    /*
       現在駅 → 次駅の線分に
       GPS位置を投影
    */

    const projection =
        projectPointToSegment(
            lat,
            lon,
            current[0],
            current[1],
            next[0],
            next[1]
        );


    /*
       駅までの実距離
    */

    const distanceToNext =
        distanceMeters(
            lat,
            lon,
            next[0],
            next[1]
        );


    /*
       進行率
    */

    const percentage =
        Math.max(
            0,
            Math.min(
                100,
                projection.t * 100
            )
        );


    document
        .getElementById(
            "progress-fill"
        )
        .style.width =
        percentage + "%";


    document
        .getElementById(
            "progress-dot"
        )
        .style.left =
        percentage + "%";


    /*
       残り距離
    */

    document
        .getElementById(
            "next-distance"
        )
        .textContent =
        formatDistance(
            distanceToNext
        );


    /*
       駅到着判定。

       「駅に近い」だけでは
       次駅へ切り替えない。

       まず駅付近に入る。
    */

    if(
        distanceToNext <=
        STATION_ARRIVAL_DISTANCE
    ){

        slowingAtStation = true;
    }


    /*
       駅付近に入り、
       速度が5km/h以下になったら
       次駅へ切り替える。
    */

    if(
        slowingAtStation &&
        gpsSpeed <=
        STATION_SWITCH_SPEED
    ){

        switchToNextStation();
    }
}


/* =====================================================
   次駅切り替え
===================================================== */

function switchToNextStation(){

    /*
       同じGPS更新で二重切替しない。
    */

    if(
        !slowingAtStation
    ){

        return;
    }


    slowingAtStation = false;


    currentStationIndex++;


    /*
       終着
    */

    if(
        currentStationIndex >=
        currentStations.length - 1
    ){

        updateStationDisplay();

        showATS(
            destination +
            " 到着"
        );


        /*
           最後の駅に到着したあと、
           0km/h付近になったら到着画面。
        */

        if(
            gpsSpeed <=
            STATION_SWITCH_SPEED
        ){

            arrive();

        }

        return;
    }


    updateStationDisplay();


    showATS(
        currentStations[
            currentStationIndex
        ] +
        " 到着"
    );
}

    const current =
        currentStations[
            currentStationIndex
        ];


    const next =
        currentStations[
            currentStationIndex + 1
        ];


    document
        .getElementById(
            "current-station"
        )

        current;


    document
        .getElementById(
            "next-station"
        )
        .textContent =
        next || "終着";


    document
        .getElementById(
            "station-count"
        )
        .textContent =
        `${currentStationIndex + 1} / ${currentStations.length}`;


    /*

}


/* =====================================================
   距離
===================================================== */

function distanceMeters(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R =
        6371000;

    const rad =
        Math.PI / 180;


    const dLat =
        (lat2 - lat1) * rad;

    const dLon =
        (lon2 - lon1) * rad;


    const a =
        Math.sin(dLat / 2) ** 2 +

        Math.cos(
            lat1 * rad
        ) *

        Math.cos(
            lat2 * rad
        ) *

        Math.sin(
            dLon / 2
        ) ** 2;


    return (
        2 *
        R *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        )
    );
}


/* =====================================================
   線分への投影
===================================================== */

function projectPointToSegment(
    pLat,
    pLon,
    aLat,
    aLon,
    bLat,
    bLon
){

    const latScale =
        111320;


    const lonScale =
        111320 *
        Math.cos(
            pLat *
            Math.PI /
            180
        );


    /*
       GPS地点を原点にする。
    */

    const ax =
        (aLon - pLon) *
        lonScale;

    const ay =
        (aLat - pLat) *
        latScale;


    const bx =
        (bLon - pLon) *
        lonScale;

    const by =
        (bLat - pLat) *
        latScale;


    const dx =
        bx - ax;

    const dy =
        by - ay;


    const length2 =
        dx * dx +
        dy * dy;


    let t = 0;


    if(length2 > 0){

        /*
           線分上の最近点。
        */

        t =
            -(
                ax * dx +
                ay * dy
            ) /
            length2;

    }


    t =
        Math.max(
            0,
            Math.min(
                1,
                t
            )
        );


    const cx =
        ax + dx * t;

    const cy =
        ay + dy * t;


    return {

        t,

        distance:
            Math.sqrt(
                cx * cx +
                cy * cy
            )
    };
}


/* =====================================================
   距離表示
===================================================== */

function formatDistance(meters){

    if(
        meters < 1000
    ){

        return (
            Math.round(
                meters
            ) +
            " m"
        );
    }


    return (
        (
            meters /
            1000
        ).toFixed(1) +
        " km"
    );
}


/* =====================================================
   GPS状態
===================================================== */

function setGPSStatus(text){

    document
        .getElementById(
            "gps-status"
        )
        .textContent =
        text;
}


/* =====================================================
   ATS表示
===================================================== */

function showATS(text){

    const ats =
        document.getElementById(
            "ats"
        );


    document
        .getElementById(
            "ats-text"
        )
        .textContent =
        text;


    ats.classList.add(
        "show"
    );


    clearTimeout(
        window.atsTimer
    );


    window.atsTimer =
        setTimeout(()=>{

            ats.classList.remove(
                "show"
            );

        },4000);
}


/* =====================================================
   到着
===================================================== */

function arrive(){

    if(!driveStarted){

        return;
    }


    driveStarted = false;


    if(
        gpsWatchId !== null
    ){

        navigator.geolocation.clearWatch(
            gpsWatchId
        );

        gpsWatchId = null;
    }


    gpsSpeed = 0;

    smoothedSpeed = 0;


    document
        .getElementById(
            "speed-number"
        )
        .textContent =
        "0";


    document
        .getElementById(
            "arrival-name"
        )
        .textContent =
        destination;


    document
        .getElementById(
            "arrival"
        )
        .classList.remove(
            "hidden"
        );


    document
        .getElementById(
            "ats"
        )
        .classList.remove(
            "show"
        );
}


/* =====================================================
   設定画面へ
===================================================== */

function returnToSetup(){

    driveStarted = false;


    if(
        gpsWatchId !== null
    ){

        navigator.geolocation.clearWatch(
            gpsWatchId
        );

        gpsWatchId = null;
    }


    trainType = null;

    selectedRoute = null;

    destination = null;

    sonicStops = [];

    currentStations = [];

    currentStationIndex = 0;

    gpsLat = null;

    gpsLon = null;

    gpsSpeed = 0;

    smoothedSpeed = 0;

    previousGPS = null;

    slowingAtStation = false;


    document
        .getElementById(
            "arrival"
        )
        .classList.add(
            "hidden"
        );


    document
        .getElementById(
            "drive"
        )
        .classList.add(
            "hidden"
        );


    document
        .getElementById(
            "setup"
        )
        .classList.remove(
            "hidden"
        );


    document
        .querySelectorAll(
            ".train-button"
        )
        .forEach(
            button =>
                button.classList.remove(
                    "selected"
                )
        );


    document
        .querySelectorAll(
            ".route-button"
        )
        .forEach(
            button =>
                button.classList.remove(
                    "selected"
                )
        );


    document
        .getElementById(
            "route-card"
        )
        .classList.add(
            "hidden"
        );


    document
        .getElementById(
            "destination-card"
        )
        .classList.add(
            "hidden"
        );


    document
        .getElementById(
            "sonic-stop-card"
        )
        .classList.add(
            "hidden"
        );


    updateSettingInfo();
}

updateSettingInfo();
