<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>GPS Train Monitor</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    min-height:100%;
    background:
        radial-gradient(
            circle at 20% 0%,
            #34415f 0%,
            transparent 38%
        ),
        radial-gradient(
            circle at 100% 30%,
            #26354e 0%,
            transparent 40%
        ),
        #080a0f;
    color:#fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Noto Sans JP",
        sans-serif;
}

body{
    min-height:100vh;
}

button{
    font:inherit;
}

.hidden{
    display:none!important;
}


/* ==============================
   Liquid Glass
============================== */

.glass{
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.13),
            rgba(255,255,255,.045)
        );

    border:
        1px solid
        rgba(255,255,255,.16);

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.28),

        inset 0 1px 0
        rgba(255,255,255,.15),

        inset 0 -1px 0
        rgba(255,255,255,.04);

    backdrop-filter:
        blur(28px)
        saturate(150%);

    -webkit-backdrop-filter:
        blur(28px)
        saturate(150%);
}

.page{
    width:100%;
    max-width:760px;
    margin:auto;
    padding:24px 15px 45px;
}

.title{
    font-size:32px;
    font-weight:900;
    letter-spacing:-1.5px;
}

.subtitle{
    color:#aeb5c2;
    font-size:12px;
    margin-top:5px;
    margin-bottom:20px;
}

.card{
    border-radius:25px;
    padding:19px;
    margin-bottom:14px;
}

.section-title{
    font-size:17px;
    font-weight:900;
    margin-bottom:13px;
}


/* ==============================
   設定画面
============================== */

.train-grid{
    display:grid;
    gap:10px;
}

.train-button{
    border:1px solid rgba(255,255,255,.08);
    border-radius:19px;
    padding:17px;
    text-align:left;

    color:#fff;

    background:
        rgba(255,255,255,.06);

    transition:
        transform .15s,
        background .2s,
        border .2s;
}

.train-button:active,
.route-button:active,
.destination-button:active,
.stop-button:active,
.start-button:active{
    transform:scale(.97);
}

.train-button.selected{
    background:
        linear-gradient(
            135deg,
            rgba(82,132,255,.85),
            rgba(61,87,210,.62)
        );

    border-color:
        rgba(255,255,255,.25);
}

.train-name{
    font-size:19px;
    font-weight:900;
}

.train-description{
    margin-top:5px;
    color:#aab1bd;
    font-size:12px;
}

.train-button.selected
.train-description{
    color:#e8edff;
}


.route-grid{
    display:grid;
    gap:9px;
}

.route-button{
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:16px;
    background:rgba(255,255,255,.06);
    color:#fff;
    text-align:left;
}

.route-button.selected{
    background:
        linear-gradient(
            135deg,
            rgba(82,132,255,.85),
            rgba(61,87,210,.62)
        );
}

.route-name{
    font-size:17px;
    font-weight:900;
}

.route-detail{
    color:#a5acb8;
    font-size:11px;
    margin-top:4px;
}


.destination-grid{
    display:grid;
    grid-template-columns:
        repeat(2,1fr);
    gap:9px;
}

.destination-button{
    border:1px solid rgba(255,255,255,.08);
    border-radius:17px;
    padding:15px 8px;

    background:
        rgba(255,255,255,.06);

    color:#fff;
    font-weight:800;
}

.destination-button.selected{
    background:
        linear-gradient(
            135deg,
            rgba(82,132,255,.85),
            rgba(61,87,210,.62)
        );
}


.stop-list{
    display:grid;
    gap:8px;
}

.stop-button{
    width:100%;
    border:1px solid rgba(255,255,255,.08);
    border-radius:17px;
    padding:14px;

    background:
        rgba(255,255,255,.055);

    color:#fff;

    display:flex;
    align-items:center;
    gap:12px;

    text-align:left;
}

.stop-button.selected{
    background:
        rgba(70,110,230,.38);
}

.stop-check{
    width:23px;
    height:23px;
    border-radius:50%;

    border:
        2px solid
        rgba(255,255,255,.35);

    display:flex;
    align-items:center;
    justify-content:center;

    flex-shrink:0;
}

.stop-check::after{
    content:"";
    width:8px;
    height:4px;

    border-left:2px solid white;
    border-bottom:2px solid white;

    transform:
        rotate(-45deg)
        scale(0);

    transition:.15s;
}

.stop-button.selected .stop-check{
    background:#4d78ff;
    border-color:#4d78ff;
}

.stop-button.selected .stop-check::after{
    transform:
        rotate(-45deg)
        scale(1);
}

.stop-name{
    font-size:14px;
    font-weight:800;
}

.stop-note{
    margin-left:auto;
    color:#8f96a3;
    font-size:10px;
}


.info{
    color:#a4abb7;
    font-size:13px;
    line-height:1.8;
}

.info b{
    color:#fff;
}

.start-button{
    width:100%;
    border:1px solid rgba(255,255,255,.2);
    border-radius:20px;
    padding:18px;

    background:
        linear-gradient(
            135deg,
            rgba(64,216,126,.95),
            rgba(26,170,91,.85)
        );

    color:#fff;
    font-size:18px;
    font-weight:900;

    box-shadow:
        0 15px 35px
        rgba(28,180,100,.22),

        inset 0 1px 0
        rgba(255,255,255,.3);
}

.start-button:disabled{
    background:rgba(255,255,255,.07);
    color:#6f7682;
    box-shadow:none;
}


/* ==============================
   運転画面
============================== */

.drive{
    width:100%;
    max-width:850px;
    margin:auto;
    padding:13px;
}

.top{
    min-height:50px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.service{
    font-size:16px;
    font-weight:900;
}

.service-destination{
    margin-top:2px;
    color:#9ca4b0;
    font-size:11px;
}

.gps-status{
    padding:7px 10px;
    border-radius:999px;

    background:
        rgba(50,220,120,.12);

    border:
        1px solid
        rgba(90,255,150,.2);

    color:#72e69c;

    font-size:10px;
    font-weight:800;
}


/* 行き先 */

.destination-card{
    border-radius:27px;
    padding:23px;
    margin-bottom:13px;
}

.destination{
    font-size:38px;
    line-height:1;
    font-weight:900;
    letter-spacing:-2px;
}

.route-name-drive{
    color:#9da5b2;
    font-size:12px;
    margin-top:9px;
}


/* ==============================
   駅カード
============================== */

.station-card{
    border-radius:27px;
    padding:21px;
    margin-bottom:13px;
}

.station-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:17px;
}

.station-header-title{
    font-size:15px;
    font-weight:900;
}

.station-count{
    color:#858d9a;
    font-size:10px;
}

.current-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom:8px;
}

.current-label,
.next-label{
    color:#858d9a;
    font-size:10px;
}

.current-name{
    font-size:18px;
    font-weight:900;
}

.next-name{
    text-align:right;
    font-size:21px;
    font-weight:900;
}


/* ==============================
   Apple Music風進行バー
============================== */

.progress-box{
    position:relative;

    width:100%;
    height:22px;

    margin-top:13px;

    background:
        rgba(255,255,255,.11);

    border-radius:999px;

    overflow:hidden;

    box-shadow:
        inset 0 1px 3px
        rgba(0,0,0,.3);
}

.progress-fill{
    position:absolute;

    left:0;
    top:0;

    width:0%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            #fff,
            #e7eaff
        );

    border-radius:999px;

    transition:
        width .3s
        cubic-bezier(.22,.61,.36,1);

    box-shadow:
        0 0 18px
        rgba(255,255,255,.18);
}

.progress-distance{
    display:flex;
    justify-content:space-between;

    margin-top:8px;

    color:#747c89;
    font-size:10px;
}


/* ==============================
   速度
============================== */

.speed-card{
    border-radius:27px;
    padding:26px;

    display:flex;
    flex-direction:column;
    align-items:center;
}

.speed-circle{
    width:200px;
    height:200px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 25%,
            rgba(255,255,255,.14),
            rgba(255,255,255,.035) 55%,
            rgba(255,255,255,.015)
        );

    border:
        1px solid
        rgba(255,255,255,.23);

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.18),

        0 18px 45px
        rgba(0,0,0,.25);

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.speed-number{
    font-size:62px;
    line-height:.9;
    font-weight:900;
    letter-spacing:-4px;
}

.speed-unit{
    color:#9ca4b1;
    font-size:13px;
    margin-top:11px;
}

.speed-caption{
    margin-top:15px;
    color:#9da5b2;
    font-size:11px;
}

.gps-coordinates{
    margin-top:11px;
    color:#68707c;
    font-size:9px;
    text-align:center;
}


/* ==============================
   ATS
============================== */

.ats{
    position:fixed;

    left:14px;
    right:14px;
    bottom:14px;

    z-index:100;

    border-radius:20px;
    padding:13px 16px;

    background:
        rgba(25,29,38,.82);

    border:
        1px solid
        rgba(255,255,255,.16);

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:
        blur(25px);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.35);

    transform:
        translateY(140%);

    transition:.3s;
}

.ats.show{
    transform:translateY(0);
}

.ats-label{
    color:#ffd84d;
    font-size:9px;
    font-weight:900;
}

.ats-text{
    margin-top:3px;
    font-size:14px;
    font-weight:900;
}


/* ==============================
   到着
============================== */

.arrival{
    position:fixed;
    inset:0;
    z-index:200;

    background:
        rgba(5,7,11,.65);

    backdrop-filter:
        blur(30px);

    -webkit-backdrop-filter:
        blur(30px);

    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
}

.arrival-box{
    width:100%;
    max-width:420px;

    border-radius:30px;
    padding:30px;

    text-align:center;
}

.arrival-small{
    color:#929aa7;
    font-size:13px;
}

.arrival-title{
    margin:10px 0;
    font-size:46px;
    font-weight:900;
}

.arrival-button{
    width:100%;
    margin-top:22px;

    border:1px solid rgba(255,255,255,.18);
    border-radius:19px;
    padding:17px;

    background:
        rgba(80,120,255,.75);

    color:white;
    font-weight:900;
}


@media(min-width:700px){

    .train-grid{
        grid-template-columns:
            repeat(3,1fr);
    }

    .destination-grid{
        grid-template-columns:
            repeat(4,1fr);
    }
}

</style>
</head>

<body>


<!-- ==============================
     設定
============================== -->

<section id="setup" class="page">

    <div class="title">
        列車設定
    </div>

    <div class="subtitle">
        GPS連動列車モニター
    </div>


    <div class="card glass">

        <div class="section-title">
            列車種別
        </div>

        <div class="train-grid">

            <button
                class="train-button"
                data-train="普通"
                onclick="selectTrain('普通')">

                <div class="train-name">
                    普通
                </div>

                <div class="train-description">
                    路線・終着駅を指定
                </div>

            </button>


            <button
                class="train-button"
                data-train="特急ソニック"
                onclick="selectTrain('特急ソニック')">

                <div class="train-name">
                    特急ソニック
                </div>

                <div class="train-description">
                    行き先・停車駅を指定
                </div>

            </button>


            <button
                class="train-button"
                data-train="特急ゆふいんの森"
                onclick="selectTrain('特急ゆふいんの森')">

                <div class="train-name">
                    特急ゆふいんの森
                </div>

                <div class="train-description">
                    行き先を指定
                </div>

            </button>

        </div>
    </div>


    <div
        id="route-card"
        class="card glass hidden">

        <div class="section-title">
            路線選択
        </div>

        <div class="route-grid">

            <button
                class="route-button"
                data-route="日豊本線"
                onclick="selectRoute('日豊本線')">

                <div class="route-name">
                    日豊本線
                </div>

                <div class="route-detail">
                    中津 ～ 佐伯
                </div>

            </button>


            <button
                class="route-button"
                data-route="久大本線"
                onclick="selectRoute('久大本線')">

                <div class="route-name">
                    久大本線
                </div>

                <div class="route-detail">
                    大分 ～ 日田
                </div>

            </button>


            <button
                class="route-button"
                data-route="豊肥本線"
                onclick="selectRoute('豊肥本線')">

                <div class="route-name">
                    豊肥本線
                </div>

                <div class="route-detail">
                    大分 ～ 宮地
                </div>

            </button>

        </div>
    </div>


    <div
        id="destination-card"
        class="card glass hidden">

        <div
            id="destination-question"
            class="section-title">

            行き先を選択

        </div>

        <div
            id="destination-grid"
            class="destination-grid">
        </div>

    </div>


    <div
        id="sonic-stop-card"
        class="card glass hidden">

        <div class="section-title">
            ソニック停車駅
        </div>

        <div class="subtitle">
            停車駅を個別に選択
        </div>

        <div
            id="sonic-stop-list"
            class="stop-list">
        </div>

    </div>


    <div class="card glass">

        <div class="section-title">
            設定内容
        </div>

        <div
            id="setting-info"
            class="info">

            列車種別を選択してください

        </div>

    </div>


    <button
        id="start-button"
        class="start-button"
        disabled
        onclick="startDrive()">

        運転開始

    </button>

</section>


<!-- ==============================
     運転画面
============================== -->

<section
    id="drive"
    class="drive hidden">

    <div class="top">

        <div>

            <div
                id="drive-service"
                class="service">

                --

            </div>

            <div
                id="drive-destination-small"
                class="service-destination">

                --

            </div>

        </div>

        <div
            id="gps-status"
            class="gps-status">

            GPS待機中

        </div>

    </div>


    <div class="destination-card glass">

        <div
            id="drive-destination"
            class="destination">

            --

        </div>

        <div
            id="drive-route"
            class="route-name-drive">

            --

        </div>

    </div>


    <div class="station-card glass">

        <div class="station-header">

            <div class="station-header-title">
                次の駅
            </div>

            <div
                id="station-count"
                class="station-count">

                --

            </div>

        </div>


        <div class="current-row">

            <div>

                <div class="current-label">
                    現在駅
                </div>

                <div
                    id="current-station"
                    class="current-name">

                    GPS取得中...

                </div>

            </div>


            <div>

                <div class="next-label">
                    NEXT
                </div>

                <div
                    id="next-station"
                    class="next-name">

                    GPS取得中...

                </div>

            </div>

        </div>


        <div class="progress-box">

            <div
                id="progress-fill"
                class="progress-fill">
            </div>

        </div>


        <div class="progress-distance">

            <span>
                現在位置
            </span>

            <span
                id="next-distance">

                --

            </span>

        </div>

    </div>


    <div class="speed-card glass">

        <div class="speed-circle">

            <div
                id="speed-number"
                class="speed-number">

                0

            </div>

            <div class="speed-unit">
                km/h
            </div>

        </div>

        <div class="speed-caption">
            現在速度
        </div>

        <div
            id="gps-coordinates"
            class="gps-coordinates">

            GPS取得中...

        </div>

    </div>

</section>


<div id="ats" class="ats">

    <div class="ats-label">
        GPS TRAIN
    </div>

    <div
        id="ats-text"
        class="ats-text">

        --

    </div>

</div>


<div
    id="arrival"
    class="arrival hidden">

    <div class="arrival-box glass">

        <div class="arrival-small">
            終着駅に到着しました
        </div>

        <div
            id="arrival-name"
            class="arrival-title">

            --

        </div>

        <div class="arrival-small">
            お疲れさまでした
        </div>

        <button
            class="arrival-button"
            onclick="returnToSetup()">

            設定画面へ

        </button>

    </div>

</div>

function showSonicStops(){

    const card=
        document.getElementById(
            "sonic-stop-card"
        );

    const list=
        document.getElementById(
            "sonic-stop-list"
        );

    card.classList.remove("hidden");

    list.innerHTML="";

    const route=
        getSonicRoute(destination);

    sonicStops=[
        route[0],
        route[route.length-1]
    ];

    route.forEach((station,index)=>{

        const mandatory=
            index===0 ||
            index===route.length-1;

        const b=
            document.createElement("button");

        b.className="stop-button";

        if(mandatory){
            b.classList.add("selected");
        }

        b.innerHTML=`
            <span class="stop-check"></span>
            <span class="stop-name">
                ${station}
            </span>
            <span class="stop-note">
                ${mandatory?"必停":""}
            </span>
        `;

        b.onclick=()=>{

            if(mandatory){
                return;
            }

            if(
                sonicStops.includes(station)
            ){

                sonicStops=
                    sonicStops.filter(
                        s=>s!==station
                    );

                b.classList.remove(
                    "selected"
                );

            }else{

                sonicStops.push(station);

                b.classList.add(
                    "selected"
                );
            }

            updateSettingInfo();
        };

        list.appendChild(b);
    });
}


function getSonicRoute(destination){

    if(destination==="博多"){
        return [
            ...SONIC_ROUTE
        ].reverse();
    }

    const index=
        SONIC_ROUTE.indexOf(
            destination
        );

    if(index<0){
        return [];
    }

    return SONIC_ROUTE.slice(
        0,
        index+1
    );
}

function makeDriveRoute(){

    if(trainType==="普通"){

        const route=
            LOCAL_ROUTES[selectedRoute];

        const index=
            route.indexOf(destination);

        return route.slice(
            0,
            index+1
        );
    }


    if(trainType==="特急ソニック"){

        const route=
            getSonicRoute(destination);

        /*
           選択した停車駅だけ
           ただし順番はルート順
        */

        return route.filter(
            station=>
                sonicStops.includes(station)
        );
    }


    if(
        trainType==="特急ゆふいんの森"
    ){

        const route=
            [...YUFUIN_ROUTE];

        const index=
            route.indexOf(destination);

        if(destination==="博多"){

            return route
                .slice(0,index+1)
                .reverse();
        }

        return route.slice(
            0,
            index+1
        );
    }

    return [];
}

function startGPS(){

    if(!navigator.geolocation){

        setGPSStatus(
            "GPS非対応"
        );

        return;
    }


    gpsWatchId=
        navigator.geolocation.watchPosition(
            handleGPS,
            handleGPSError,
            {
                enableHighAccuracy:true,
                maximumAge:1000,
                timeout:10000
            }
        );
}


/* =====================================================
   GPS受信
===================================================== */

function handleGPS(position){

    const lat=
        position.coords.latitude;

    const lon=
        position.coords.longitude;


    let speed=
        position.coords.speed;


    /*
       GPSのspeedはm/s
    */

    if(
        Number.isFinite(speed) &&
        speed>=0
    ){

        speed*=3.6;

    }else{

        speed=
            calculateGPSSpeed(
                lat,
                lon,
                position.timestamp
            );
    }


    /*
       GPS異常値
    */

    if(
        !Number.isFinite(speed) ||
        speed<0 ||
        speed>180
    ){

        speed=
            gpsSpeed;
    }


    gpsSpeed=speed;


    /*
       実速度に近く、
       かつ表示は滑らか
    */

    smoothedSpeed +=
        (
            gpsSpeed-
            smoothedSpeed
        )*.5;


    if(
        Math.abs(
            gpsSpeed-
            smoothedSpeed
        )<.15
    ){

        smoothedSpeed=
            gpsSpeed;
    }


    document
        .getElementById(
            "speed-number"
        )
        .textContent=
        Math.round(
            smoothedSpeed
        );


    document
        .getElementById(
            "gps-coordinates"
        )
        .textContent=
        "GPS "+
        lat.toFixed(5)+
        ", "+
        lon.toFixed(5);


    /*
       ★ 現在位置から
       現在の駅・次駅を判定
    */

    syncStationWithGPS(
        lat,
        lon
    );


    if(
        previousGPS===null
    ){

        previousGPS={
            lat,
            lon,
            time:
                position.timestamp ||
                Date.now()
        };

    }else{

        previousGPS={
            lat,
            lon,
            time:
                position.timestamp ||
                Date.now()
        };
    }


    setGPSStatus(
        "GPS接続中"
    );
}


/* =====================================================
   ★ 駅位置同期
===================================================== */

function syncStationWithGPS(
    lat,
    lon
){

    if(
        currentStations.length<2
    ){
        return;
    }


    /*
       初回GPS
    */

    if(!gpsPositionKnown){

        currentStationIndex=
            findNearestSegment(
                lat,
                lon
            );

        gpsPositionKnown=true;

        updateStationDisplay();

        updateNextStationProgress(
            lat,
            lon
        );

        return;
    }


    /*
       今の区間の次駅
    */

    const nextIndex=
        currentStationIndex+1;


    if(
        nextIndex>=
        currentStations.length
    ){
        return;
    }


    const nextStation=
        currentStations[
            nextIndex
        ];

    const coord=
        STATIONS[nextStation];


    if(!coord){
        return;
    }


    const distance=
        distanceMeters(
            lat,
            lon,
            coord[0],
            coord[1]
        );


    /*
       駅到着ゾーン
       GPS誤差を考慮して150m
    */

    if(distance<=150){

        stationArrivalDetected=true;
    }


    /*
       ★重要
       到着ゾーンに入っていて
       速度が5km/h以下なら切替
    */

    if(
        stationArrivalDetected &&
        gpsSpeed<=5
    ){

        switchToNextStation();

        return;
    }


    /*
       もしGPSが駅の中心を
       少し通り越した場合でも
       300m以内なら到着扱い
    */

    if(
        distance<=300 &&
        gpsSpeed<=5
    ){

        switchToNextStation();

        return;
    }


    updateNextStationProgress(
        lat,
        lon
    );
}


/* =====================================================
   最寄り区間
===================================================== */

function findNearestSegment(
    lat,
    lon
){

    let bestIndex=0;
    let bestDistance=Infinity;


    for(
        let i=0;
        i<currentStations.length-1;
        i++
    ){

        const a=
            STATIONS[
                currentStations[i]
            ];

        const b=
            STATIONS[
                currentStations[i+1]
            ];


        const p=
            projectPointToSegment(
                lat,
                lon,
                a[0],
                a[1],
                b[0],
                b[1]
            );


        const projectedLat=
            a[0]+
            (b[0]-a[0])*p.t;

        const projectedLon=
            a[1]+
            (b[1]-a[1])*p.t;


        const d=
            distanceMeters(
                lat,
                lon,
                projectedLat,
                projectedLon
            );


        if(d<bestDistance){

            bestDistance=d;
            bestIndex=i;
        }
    }


    return bestIndex;
}


/* =====================================================
   次駅進行
===================================================== */

function updateNextStationProgress(
    lat,
    lon
){

    if(
        currentStationIndex>=
        currentStations.length-1
    ){
        return;
    }


    const current=
        STATIONS[
            currentStations[
                currentStationIndex
            ]
        ];

    const next=
        STATIONS[
            currentStations[
                currentStationIndex+1
            ]
        ];


    if(!current || !next){
        return;
    }


    const projected=
        projectPointToSegment(
            lat,
            lon,

            current[0],
            current[1],

            next[0],
            next[1]
        );


    const percentage=
        Math.max(
            0,
            Math.min(
                100,
                projected.t*100
            )
        );


    document
        .getElementById(
            "progress-fill"
        )
        .style.width=
        percentage+"%";


    const distance=
        distanceMeters(
            lat,
            lon,
            next[0],
            next[1]
        );


    document
        .getElementById(
            "next-distance"
        )
        .textContent=
        formatDistance(distance);
}


/* =====================================================
   駅切替
===================================================== */

function switchToNextStation(){

    if(
        !stationArrivalDetected
    ){
        return;
    }


    stationArrivalDetected=false;


    if(
        currentStationIndex<
        currentStations.length-1
    ){

        currentStationIndex++;


        /*
           次の区間へ完全リセット
        */

        document
            .getElementById(
                "progress-fill"
            )
            .style.width=
            "0%";


        updateStationDisplay();


        const arrived=
            currentStations[
                currentStationIndex
            ];


        showATS(
            arrived+
            " 到着"
        );


        /*
           終着なら到着画面
        */

        if(
            currentStationIndex===
            currentStations.length-1
        ){

            if(gpsSpeed<=5){

                setTimeout(
                    arrive,
                    500
                );
            }
        }
    }
}

/* =====================================================
   GPS速度補完
===================================================== */

function calculateGPSSpeed(
    lat,
    lon,
    timestamp
){

    if(!previousGPS){
        return 0;
    }


    const dt=
        (
            timestamp-
            previousGPS.time
        )/1000;


    if(
        dt<=0 ||
        dt>10
    ){
        return gpsSpeed;
    }


    const distance=
        distanceMeters(
            previousGPS.lat,
            previousGPS.lon,
            lat,
            lon
        );


    const speed=
        distance/dt*3.6;


    if(
        speed>180
    ){
        return gpsSpeed;
    }


    return speed;
}


/* =====================================================
   距離
===================================================== */

function distanceMeters(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R=6371000;

    const rad=Math.PI/180;

    const dLat=
        (lat2-lat1)*rad;

    const dLon=
        (lon2-lon1)*rad;


    const a=
        Math.sin(dLat/2)**2+
        Math.cos(lat1*rad)*
        Math.cos(lat2*rad)*
        Math.sin(dLon/2)**2;


    return 2*R*Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1-a)
    );
}


/* =====================================================
   線分投影
===================================================== */

function projectPointToSegment(
    pLat,
    pLon,
    aLat,
    aLon,
    bLat,
    bLon
){

    const latScale=111320;

    const lonScale=
        111320*
        Math.cos(
            pLat*Math.PI/180
        );


    const ax=
        (aLon-pLon)*
        lonScale;

    const ay=
        (aLat-pLat)*
        latScale;

    const bx=
        (bLon-pLon)*
        lonScale;

    const by=
        (bLat-pLat)*
        latScale;


    const dx=bx-ax;
    const dy=by-ay;


    const length2=
        dx*dx+
        dy*dy;


    let t=0;


    if(length2>0){

        t=
            -(ax*dx+ay*dy)/
            length2;
    }


    t=
        Math.max(
            0,
            Math.min(
                1,
                t
            )
        );


    return {t};
}


/* =====================================================
   距離表示
===================================================== */

function formatDistance(m){

    if(m<1000){

        return(
            Math.round(m)+
            " m"
        );
    }

    return(
        (m/1000).toFixed(1)+
        " km"
    );
}


/* =====================================================
   GPSエラー
===================================================== */

function handleGPSError(error){

    setGPSStatus(
        "GPSエラー"
    );


    let text=
        "GPSを取得できません";


    if(error.code===1){

        text=
            "位置情報の使用を許可してください";

    }else if(error.code===2){

        text=
            "現在位置を取得できません";

    }else if(error.code===3){

        text=
            "GPS取得がタイムアウトしました";
    }


    showATS(text);
}


/* =====================================================
   GPS状態
===================================================== */

function setGPSStatus(text){

    document
        .getElementById(
            "gps-status"
        )
        .textContent=
        text;
}


/* =====================================================
   ATS
===================================================== */

function showATS(text){

    const ats=
        document.getElementById(
            "ats"
        );

    document
        .getElementById(
            "ats-text"
        )
        .textContent=
        text;


    ats.classList.add("show");


    clearTimeout(
        window.atsTimer
    );


    window.atsTimer=
        setTimeout(
            ()=>{
                ats.classList.remove(
                    "show"
                );
            },
            4000
        );
}


/* =====================================================
   到着
===================================================== */

function arrive(){

    if(arrivalTriggered){
        return;
    }


    arrivalTriggered=true;


    if(
        gpsWatchId!==null
    ){

        navigator.geolocation.clearWatch(
            gpsWatchId
        );

        gpsWatchId=null;
    }


    document
        .getElementById(
            "speed-number"
        )
        .textContent=
        "0";


    document
        .getElementById(
            "arrival-name"
        )
        .textContent=
        destination;


    document
        .getElementById(
            "arrival"
        )
        .classList.remove(
            "hidden"
        );


    document
        .getElementById(
            "ats"
        )
        .classList.remove(
            "show"
        );
}


/* =====================================================
   設定画面へ
===================================================== */

function returnToSetup(){

    if(
        gpsWatchId!==null
    ){

        navigator.geolocation.clearWatch(
            gpsWatchId
        );

        gpsWatchId=null;
    }


    trainType=null;
    selectedRoute=null;
    destination=null;
    sonicStops=[];

    currentStations=[];
    currentStationIndex=0;

    gpsSpeed=0;
    smoothedSpeed=0;

    previousGPS=null;

    gpsPositionKnown=false;
    stationArrivalDetected=false;
    arrivalTriggered=false;


    document
        .getElementById(
            "arrival"
        )
        .classList.add("hidden");


    document
        .getElementById(
            "drive"
        )
        .classList.add("hidden");


    document
        .getElementById(
            "setup"
        )
        .classList.remove("hidden");


    document
        .querySelectorAll(
            ".train-button"
        )
        .forEach(
            b=>b.classList.remove(
                "selected"
            )
        );


    document
        .querySelectorAll(
            ".route-button"
        )
        .forEach(
            b=>b.classList.remove(
                "selected"
            )
        );


    document
        .getElementById(
            "route-card"
        )
        .classList.add("hidden");


    document
        .getElementById(
            "destination-card"
        )
        .classList.add("hidden");


    document
        .getElementById(
            "sonic-stop-card"
        )
        .classList.add("hidden");


    updateSettingInfo();
}


updateSettingInfo();

</script>
