===================================================== */

   LIQUID GLASS
===================================================== */

}


.glass::before {

<script>

/* =====================================================
   ソニック10号
   大分 → 博多
===================================================== */

const stations = [

    {
        name: "大分",
        lat: 33.2323,
        lon: 131.6066
    },

    {
        name: "別府",
        lat: 33.2797,
        lon: 131.5004
    },

    {
        name: "杵築",
        lat: 33.4184,
        lon: 131.6171
    },

    {
        name: "宇佐",
        lat: 33.5312,
        lon: 131.3485
    },

    {
        name: "柳ケ浦",
        lat: 33.5650,
        lon: 131.3626
    },

    {
        name: "中津",
        lat: 33.5991,
        lon: 131.1909
    },

    {
        name: "宇島",
        lat: 33.6120,
        lon: 131.1300
    },

    {
        name: "行橋",
        lat: 33.7308,
        lon: 130.9588
    },

    {
        name: "小倉",
        lat: 33.8869,
        lon: 130.8827
    },

    {
        name: "黒崎",
        lat: 33.8660,
        lon: 130.7665
    },

    {
        name: "折尾",
        lat: 33.8650,
        lon: 130.7130
    },

    {
        name: "博多",
        lat: 33.5904,
        lon: 130.4207
    }

];


/* =====================================================
   設定
===================================================== */

const STATION_RADIUS =
    700;

const SWITCH_DISTANCE =
    500;

const SWITCH_SPEED =
    25;

const ARRIVAL_DISTANCE =
    80;


/* =====================================================
   状態
===================================================== */

let initialized =
    false;

let currentSegment =
    0;

let watchId =
    null;


/* =====================================================
   次の4駅を表示
===================================================== */

function updateNextStations() {

    const board =
        document.getElementById(
            "stationBoard"
        );


    board.innerHTML = "";


    /*
       currentSegmentの次駅から
       4駅表示
    */

    const startIndex =
        currentSegment + 1;


    const endIndex =
        Math.min(
            startIndex + 4,
            stations.length
        );


    for (
        let i = startIndex;
        i < endIndex;
        i++
    ) {

        const station =
            stations[i];


        /*
           駅
        */

        const stationElement =
            document.createElement(
                "div"
            );


        stationElement.className =
            "board-station";


        const name =
            document.createElement(
                "div"
            );


        name.className =
            "board-name";


        /*
           駅名を1文字ずつ縦に
        */

        const chars =
            [...station.name];


        chars.forEach(
            char => {

                const span =
                    document.createElement(
                        "span"
                    );

                span.textContent =
                    char;

                name.appendChild(
                    span
                );

            }
        );


        stationElement.appendChild(
            name
        );


        board.appendChild(
            stationElement
        );


        /*
           ＞
        */

        if (
            i < endIndex - 1
        ) {

            const arrow =
                document.createElement(
                    "div"
                );


            arrow.className =
                "board-arrow";


            arrow.textContent =
                "＞";


            board.appendChild(
                arrow
            );

        }

    }


    /*
       4駅に満たない場合
       空きを作る
    */

    const displayed =
        endIndex -
        startIndex;


    for (
        let i = displayed;
        i < 4;
        i++
    ) {

        const empty =
            document.createElement(
                "div"
            );


        empty.className =
            "board-station";


        empty.innerHTML =
            `
            <div class="board-name">
                <span></span>
                <span></span>
            </div>
            `;


        board.appendChild(
            empty
        );


        if (
            i < 3
        ) {

            const arrow =
                document.createElement(
                    "div"
                );


            arrow.className =
                "board-arrow";


            arrow.textContent =
                "＞";


            board.appendChild(
                arrow
            );

        }

    }

}


/* =====================================================
   距離
===================================================== */

function getDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R =
        6371000;

    const rad =
        Math.PI / 180;

    const dLat =
        (lat2 - lat1) * rad;

    const dLon =
        (lon2 - lon1) * rad;

    const a =

        Math.sin(dLat / 2) ** 2

        +

        Math.cos(lat1 * rad) *
        Math.cos(lat2 * rad) *
        Math.sin(dLon / 2) ** 2;


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );


    return R * c;

}


/* =====================================================
   点と区間の距離
===================================================== */

function pointToSegmentDistance(
    lat,
    lon,
    a,
    b
) {

    const latScale =
        111320;

    const lonScale =
        111320 *
        Math.cos(
            lat *
            Math.PI /
            180
        );


    const px =
        lon *
        lonScale;

    const py =
        lat *
        latScale;


    const ax =
        a.lon *
        lonScale;

    const ay =
        a.lat *
        latScale;


    const bx =
        b.lon *
        lonScale;

    const by =
        b.lat *
        latScale;


    const dx =
        bx - ax;

    const dy =
        by - ay;


    const lengthSquared =
        dx * dx +
        dy * dy;


    if (
        lengthSquared === 0
    ) {

        return Math.sqrt(
            (px - ax) ** 2 +
            (py - ay) ** 2
        );

    }


    let t =
        (
            (px - ax) * dx +
            (py - ay) * dy
        )
        /
        lengthSquared;


    t =
        Math.max(
            0,
            Math.min(
                1,
                t
            )
        );


    const closestX =
        ax +
        t * dx;

    const closestY =
        ay +
        t * dy;


    return Math.sqrt(

        (px - closestX) ** 2 +
        (py - closestY) ** 2

    );

}


/* =====================================================
   初期区間
===================================================== */

function detectInitialSegment(
    lat,
    lon
) {

    /*
       駅に近い場合
    */

    for (
        let i = 0;
        i < stations.length;
        i++
    ) {

        const distance =
            getDistance(
                lat,
                lon,
                stations[i].lat,
                stations[i].lon
            );


        if (
            distance <=
            STATION_RADIUS
        ) {

            if (
                i >=
                stations.length - 1
            ) {

                return stations.length - 1;

            }


            return i;

        }

    }


    /*
       区間上にいる場合
    */

    let bestSegment =
        0;

    let bestDistance =
        Infinity;


    for (
        let i = 0;
        i < stations.length - 1;
        i++
    ) {

        const distance =
            pointToSegmentDistance(
                lat,
                lon,
                stations[i],
                stations[i + 1]
            );


        if (
            distance <
            bestDistance
        ) {

            bestDistance =
                distance;

            bestSegment =
                i;

        }

    }


    return bestSegment;

}


/* =====================================================
   GPS開始
===================================================== */

function startGPS() {

    if (
        !navigator.geolocation
    ) {

        setStatus(
            "この端末ではGPSを利用できません"
        );

        return;

    }


    if (
        watchId !== null
    ) {

        return;

    }


    setStatus(
        "GPS取得中..."
    );


    watchId =
        navigator.geolocation.watchPosition(

            updateGPS,

            gpsError,

            {

                enableHighAccuracy:
                    true,

                maximumAge:
                    500,

                timeout:
                    10000

            }

        );

}


/* =====================================================
   GPS更新
===================================================== */

function updateGPS(
    position
) {

    const lat =
        position.coords.latitude;

    const lon =
        position.coords.longitude;


    /*
       速度
    */

    let speed =
        position.coords.speed;


    if (
        speed !== null &&
        speed !== undefined &&
        !isNaN(speed)
    ) {

        speed =
            Math.max(
                0,
                speed * 3.6
            );

    }

    else {

        speed = 0;

    }


    const displaySpeed =
        Math.round(speed);


    document.getElementById(
        "speed"
    ).textContent =
        displaySpeed;


    /*
       初回GPS
    */

    if (
        !initialized
    ) {

        currentSegment =
            detectInitialSegment(
                lat,
                lon
            );


        initialized =
            true;


        if (
            currentSegment >=
            stations.length - 1
        ) {

            showArrival();

            return;

        }


        updateNextStations();

    }


    /*
       次駅
    */

    const to =
        stations[
            currentSegment + 1
        ];


    const remaining =
        getDistance(
            lat,
            lon,
            to.lat,
            to.lon
        );


    /*
       駅切り替え

       「近い」だけでは切り替えない。

       速度が25km/h以下に落ちた
       ＋
       駅まで500m以内

       もしくは80m以内
    */

    const slowEnough =
        displaySpeed <=
        SWITCH_SPEED;

    const closeEnough =
        remaining <=
        SWITCH_DISTANCE;

    const almostAtStation =
        remaining <=
        ARRIVAL_DISTANCE;


    if (

        (
            slowEnough &&
            closeEnough
        )

        ||

        almostAtStation

    ) {

        currentSegment++;


        if (
            currentSegment >=
            stations.length - 1
        ) {

            showArrival();

            return;

        }


        updateNextStations();

    }


    updateDisplay(
        lat,
        lon
    );

}


/* =====================================================
   表示
===================================================== */

function updateDisplay(
    lat,
    lon
) {

    const from =
        stations[
            currentSegment
        ];

    const to =
        stations[
            currentSegment + 1
        ];


    /*
       区間距離
    */

    const totalDistance =
        getDistance(
            from.lat,
            from.lon,
            to.lat,
            to.lon
        );


    /*
       次駅まで
    */

    const remaining =
        getDistance(
            lat,
            lon,
            to.lat,
            to.lon
        );


    /*
       バー
    */

    let progress =
        1 -
        (
            remaining /
            totalDistance
        );


    progress =
        Math.max(
            0,
            Math.min(
                1,
                progress
            )
        );


    document.getElementById(
        "fromStation"
    ).textContent =
        from.name;


    document.getElementById(
        "toStation"
    ).textContent =
        to.name;


    document.getElementById(
        "progressFill"
    ).style.width =
        (
            progress * 100
        ) + "%";


    /*
       距離
    */

    const km =
        remaining / 1000;


    if (
        km < 0.1
    ) {

        document.getElementById(
            "distanceText"
        ).textContent =
            to.name +
            " まもなく";

    }

    else {

        document.getElementById(
            "distanceText"
        ).textContent =
            to.name +
            "まであと " +
            km.toFixed(1) +
            " km";

    }


    /*
       現在区間
    */

    document.getElementById(
        "sectionName"
    ).textContent =
        from.name +
        " → " +
        to.name;


    /*
       次駅
    */

    document.getElementById(
        "nextInfo"
    ).textContent =
        "次は「" +
        to.name +
        "」です";


    setStatus(
        "● GPS接続中"
    );

}


/* =====================================================
   博多到着
===================================================== */

function showArrival() {

    document.getElementById(
        "speed"
    ).textContent =
        "0";


    document.getElementById(
        "fromStation"
    ).textContent =
        "博多";


    document.getElementById(
        "toStation"
    ).textContent =
        "";


    document.getElementById(
        "progressFill"
    ).style.width =
        "100%";


    document.getElementById(
        "distanceText"
    ).textContent =
        "博多 到着";


    document.getElementById(
        "sectionName"
    ).textContent =
        "博多";


    document.getElementById(
        "nextInfo"
    ).textContent =
        "終点です";


    /*
       次駅表示を空にする
    */

    document.getElementById(
        "stationBoard"
    ).innerHTML =
        `
        <div
            class="board-station"
            style="flex:1"
        >
            <div class="board-name">
                <span>博</span>
                <span>多</span>
            </div>
        </div>
        `;


    setStatus(
        "● 博多に到着しました"
    );

}


/* =====================================================
   GPSエラー
===================================================== */

function gpsError(
    error
) {

    let message =
        "GPSを取得できません";


    switch (
        error.code
    ) {

        case 1:

            message =
                "位置情報の使用を許可してください";

            break;


        case 2:

            message =
                "現在地を取得できません";

            break;


        case 3:

            message =
                "GPS取得がタイムアウトしました";

            break;

    }


    setStatus(
        message
    );

}


/* =====================================================
   STATUS
===================================================== */

function setStatus(
    text
) {

    document.getElementById(
        "gpsStatus"
    ).textContent =
        text;

}


/* =====================================================
   起動
===================================================== */

window.addEventListener(
    "load",
    () => {

        /*
           初期状態では
           大分からの次の4駅
        */

        updateNextStations();

        startGPS();

    }
);

</script>
