<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               viewport-fit=cover">
<title>JR九州 列車情報</title>
<style>
/* =====================================================
   基本
===================================================== */
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background:
        radial-gradient(
            circle at 20% 0%,
            rgba(255,255,255,.12),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 80%,
            rgba(255,255,255,.08),
            transparent 38%
        ),
        #050505;
    color: #fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
}
body {
    overflow-x: hidden;
}
/* =====================================================
   アプリ
===================================================== */
.app {
    width: 100%;
    max-width: 680px;
    min-height: 100vh;
    margin: 0 auto;
    padding:
        calc(16px + env(safe-area-inset-top))
        14px
        calc(24px + env(safe-area-inset-bottom))
        14px;
}
/* =====================================================
   Liquid Glass
===================================================== */
.glass {
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.15),
            rgba(255,255,255,.045)
        );
    border:
        1px solid rgba(255,255,255,.13);
    box-shadow:
        0 18px 50px rgba(0,0,0,.38),
        inset 0 1px 1px rgba(255,255,255,.16);
    backdrop-filter:
        blur(28px)
        saturate(165%);
    -webkit-backdrop-filter:
        blur(28px)
        saturate(165%);
}
/* =====================================================
   選択画面
===================================================== */
#selectScreen {
    min-height: calc(
        100vh
        - env(safe-area-inset-top)
        - env(safe-area-inset-bottom)
    );
    display: flex;
    flex-direction: column;
    justify-content: center;
}
.select-title {
    font-size: 34px;
    font-weight: 760;
    letter-spacing: -1.5px;
}
.select-sub {
    margin-top: 5px;
    color:
        rgba(255,255,255,.45);
    font-size: 14px;
}
/* =====================================================
   選択カード
===================================================== */
.select-card {
    margin-top: 16px;
    padding: 16px;
    border-radius: 25px;
}
.select-label {
    margin-bottom: 10px;
    font-size: 13px;
    color:
        rgba(255,255,255,.45);
}
.number-row {
    display: flex;
    gap: 8px;
}
.number-input {
    flex: 1;
    min-width: 0;
    height: 53px;
    padding: 0 15px;
    border:
        1px solid rgba(255,255,255,.1);
    border-radius: 17px;
    outline: none;
    background:
        rgba(255,255,255,.07);
    color: #fff;
    font-size: 18px;
    font-weight: 650;
    -webkit-appearance: none;
}
.number-input::placeholder {
    color:
        rgba(255,255,255,.28);
}
.number-button {
    width: 88px;
    border: 0;
    border-radius: 17px;
    background:
        rgba(255,255,255,.94);
    color: #000;
    font-size: 15px;
    font-weight: 700;
}
/* =====================================================
   普通列車ボタン
===================================================== */
.local-grid {
    display: grid;
    grid-template-columns:
        repeat(2, minmax(0,1fr));
    gap: 8px;
}
.local-button {
    min-height: 57px;
    border:
        1px solid rgba(255,255,255,.08);
    border-radius: 17px;
    background:
        rgba(255,255,255,.065);
    color: #fff;
    font-size: 14px;
    font-weight: 650;
}
.local-button:active,
.number-button:active,
.gps-button:active,
.test-button:active,
.back-button:active {
    transform: scale(.97);
}
/* =====================================================
   列車画面
===================================================== */
#trainScreen {
    display: none;
}
/* =====================================================
   ヘッダー
===================================================== */
.header-card {
    padding: 18px 19px 20px;
    border-radius: 27px;
    overflow: hidden;
}
.train-name {
    font-size: 17px;
    color:
        rgba(255,255,255,.56);
    font-weight: 600;
}
.destination {
    margin-top: 2px;
    font-size: 31px;
    font-weight: 760;
    letter-spacing: -1.3px;
}
.train-number {
    margin-top: 4px;
    font-size: 15px;
    color:
        rgba(255,255,255,.42);
}
/* =====================================================
   速度
===================================================== */
.speed-card {
    margin-top: 10px;
    padding: 18px;
    border-radius: 27px;
}
.speed-label {
    font-size: 13px;
    color:
        rgba(255,255,255,.4);
}
.speed-row {
    display: flex;
    align-items: baseline;
}
.speed {
    font-size: 70px;
    line-height: .95;
    font-weight: 760;
    letter-spacing: -5px;
    font-variant-numeric:
        tabular-nums;
}
.speed-unit {
    margin-left: 8px;
    font-size: 17px;
    color:
        rgba(255,255,255,.42);
}
/* =====================================================
   駅カード
===================================================== */
.station-card {
    margin-top: 10px;
    padding: 18px;
    border-radius: 27px;
    overflow-x: hidden;
}
.station-title {
    margin-bottom: 15px;
    font-size: 13px;
    color:
        rgba(255,255,255,.4);
}
/* =====================================================
   4駅 横並び・縦書き
===================================================== */
.station-route {
    display: grid;
    grid-template-columns:
        repeat(4, 1fr);
    column-gap: 8px;
    width: 100%;
    min-height: 150px;
}
/*
   1駅分
*/
.station-column {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    min-width: 0;
}
/*
   ＞
*/
.station-arrow {
    height: 30px;
    font-size: 24px;
    line-height: 30px;
    font-weight: 750;
    color:
        rgba(255,255,255,.72);
}
/*
   駅名
*/
.station-vertical {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 28px;
    font-size: 22px;
    line-height: 1.08;
    font-weight: 720;
    letter-spacing: 0;
    white-space: nowrap;
}
/*
   駅名が長くても
   横幅を壊さない
*/
.station-char {
    display: block;
    height: 24px;
}
/* =====================================================
   メーター
===================================================== */
.progress-area {
    margin-top: 13px;
}
.progress-background {
    width: 100%;
    height: 8px;
    border-radius: 999px;
    overflow: hidden;
    background:
        rgba(255,255,255,.1);
}
.progress-fill {
    width: 0%;
    height: 100%;
    border-radius: 999px;
    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.52),
            rgba(255,255,255,.97)
        );
    transition:
        width .65s ease;
}
.distance-text {
    margin-top: 10px;
    font-size: 14px;
    color:
        rgba(255,255,255,.55);
    text-align: left;
}
/* =====================================================
   GPS
===================================================== */
.gps-card {
    margin-top: 10px;
    padding: 15px;
    border-radius: 23px;
}
.gps-status {
    font-size: 13px;
    line-height: 1.5;
    color:
        rgba(255,255,255,.4);
}
.gps-button {
    width: 100%;
    margin-top: 10px;
    padding: 14px;
    border: 0;
    border-radius: 17px;
    background:
        rgba(255,255,255,.94);
    color: #000;
    font-size: 15px;
    font-weight: 700;
}
/* =====================================================
   テストモード
===================================================== */
.test-panel {
    display: none;
    margin-top: 10px;
    padding: 15px;
    border-radius: 23px;
}
.test-title {
    margin-bottom: 9px;
    font-size: 13px;
    color:
        rgba(255,255,255,.43);
}
.test-buttons {
    display: grid;
    grid-template-columns:
        1fr 1fr;
    gap: 8px;
}
.test-button {
    min-height: 49px;
    border: 0;
    border-radius: 16px;
    background:
        rgba(255,255,255,.075);
    color: #fff;
    font-size: 15px;
    font-weight: 650;
}
/* =====================================================
   戻る
===================================================== */
.back-button {
    width: 100%;
    margin-top: 10px;
    padding: 13px;
    border: 0;
    border-radius: 16px;
    background:
        rgba(255,255,255,.055);
    color:
        rgba(255,255,255,.55);
    font-size: 14px;
}
/* =====================================================
   小さい画面
===================================================== */
@media (max-width:380px) {
    .app {
        padding-left: 11px;
        padding-right: 11px;
    }
    .station-route {
        column-gap: 4px;
    }
    .station-vertical {
        font-size: 20px;
    }
    .station-char {
        height: 22px;
    }
    .station-arrow {
        font-size: 22px;
    }
    .speed {
        font-size: 61px;
    }
}
</style>
</head>
<body>
<div class="app">
<!-- ==================================================
     列車選択
================================================== -->
<section id="selectScreen">
    <div class="select-title">
        列車を選択
    </div>
    <div class="select-sub">
        JR九州 列車情報
    </div>
    <!-- ソニック -->
    <div class="select-card glass">
        <div class="select-label">
            特急ソニック
        </div>
        <div class="number-row">
            <input
                id="sonicNumber"
                class="number-input"
                type="number"
                inputmode="numeric"
                placeholder="号数を入力"
            >
            <button
                class="number-button"
                onclick="startSonic()"
            >
                決定
            </button>
        </div>
    </div>
    <!-- ゆふ森 -->
    <div class="select-card glass">
        <div class="select-label">
            特急ゆふいんの森
        </div>
        <div class="number-row">
            <input
                id="yufuNumber"
                class="number-input"
                type="number"
                inputmode="numeric"
                placeholder="号数を入力"
            >
            <button
                class="number-button"
                onclick="startYufuin()"
            >
                決定
            </button>
        </div>
    </div>
    <!-- 普通 -->
    <div class="select-card glass">
        <div class="select-label">
            普通列車
        </div>
        <div class="local-grid">
            <button
                class="local-button"
                onclick="selectLocal('nippouDown')"
            >
                中津 → 佐伯
            </button>
            <button
                class="local-button"
                onclick="selectLocal('nippouUp')"
            >
                佐伯 → 中津
            </button>
            <button
                class="local-button"
                onclick="selectLocal('kyudaiDown')"
            >
                大分 → 日田
            </button>
            <button
                class="local-button"
                onclick="selectLocal('kyudaiUp')"
            >
                日田 → 大分
            </button>
            <button
                class="local-button"
                onclick="selectLocal('hohiDown')"
            >
                大分 → 宮地
            </button>
            <button
                class="local-button"
                onclick="selectLocal('hohiUp')"
            >
                宮地 → 大分
            </button>
        </div>
    </div>
</section>
<!-- ==================================================
     列車画面
================================================== -->
<section id="trainScreen">
    <div class="header-card glass">
        <div
            id="trainName"
            class="train-name"
        >
            特急ソニック
        </div>
        <div
            id="destination"
            class="destination"
        >
            博多行き
        </div>
        <div
            id="trainNumber"
            class="train-number"
        >
            10号
        </div>
    </div>
    <!-- 速度 -->
    <div class="speed-card glass">
        <div class="speed-label">
            速度
        </div>
        <div class="speed-row">
            <span
                id="speed"
                class="speed"
            >
                --
            </span>
            <span class="speed-unit">
                km/h
            </span>
        </div>
    </div>
    <!-- 駅 -->
    <div class="station-card glass">
        <div class="station-title">
            次の駅
        </div>
        <!--
            ここが今回の変更部分。
            4駅を横に並べ、
            駅名を1文字ずつ縦に表示。
        -->
        <div
            id="stationRoute"
            class="station-route"
        ></div>
        <div class="progress-area">
            <div class="progress-background">
                <div
                    id="progressFill"
                    class="progress-fill"
                ></div>
            </div>
        </div>
        <div
            id="distanceText"
            class="distance-text"
        >
            GPS取得中...
        </div>
    </div>
    <!-- GPS -->
    <div class="gps-card glass">
        <div
            id="gpsStatus"
            class="gps-status"
        >
            GPSを待っています
        </div>
        <button
            class="gps-button"
            onclick="startGPS()"
        >
            GPSを開始
        </button>
    </div>
    <!-- テスト -->
    <div
        id="testPanel"
        class="test-panel glass"
    >
        <div class="test-title">
            TEST MODE
        </div>
        <div class="test-buttons">
            <button
                class="test-button"
                onclick="testPreviousStation()"
            >
                ← 前の駅
            </button>
            <button
                class="test-button"
                onclick="testNextStation()"
            >
                次の駅 →
            </button>
        </div>
    </div>
    <button
        class="back-button"
        onclick="backToSelect()"
    >
        列車選択に戻る
    </button>
</section>
</div>

    else if (

    */
    else {
        sonic[n] = {
            destination:
                "博多",
            route:
                [...sonicOitaToHakata]
        };
    }
}

let currentNumber = "";

let lastSpeed = 0;
let testMode = false;
let arrived = false;

/* =====================================================
   4駅表示
===================================================== */
function updateStationDisplay() {
    const box =
        document.getElementById(
            "stationRoute"
        );
    box.innerHTML = "";
    /*
       現在駅の次から4駅
    */
    const nextStations =
        currentRoute.slice(
            currentIndex + 1,
            currentIndex + 5
        );
    /*
       4列を作る
    */
    for (
        let i = 0;
        i < 4;
        i++
    ) {
        const column =
            document.createElement(
                "div"
            );
        column.className =
            "station-column";
        /*
           駅が存在する場合だけ
           ＞と駅名を表示
        */
        if (
            nextStations[i]
        ) {
            const arrow =
                document.createElement(
                    "div"
                );
            arrow.className =
                "station-arrow";
            arrow.textContent =
                "＞";
            const vertical =
                document.createElement(
                    "div"
                );
            vertical.className =
                "station-vertical";
            /*
               駅名を1文字ずつ分解
            */
            [
                ...nextStations[i]
            ].forEach(
                char => {
                    const span =
                        document.createElement(
                            "span"
                        );
                    span.className =
                        "station-char";
                    span.textContent =
                        char;
                    vertical.appendChild(
                        span
                    );
                }
            );
            column.appendChild(
                arrow
            );
            column.appendChild(
                vertical
            );
        }
        box.appendChild(
            column
        );
    }
    /*
       終点
    */
    if (
        currentIndex >=
        currentRoute.length - 1
    ) {
        showArrival();
    }
}
/* =====================================================
   GPS開始
===================================================== */
function startGPS() {
    if (
        testMode
    ) {
        return;
    }
    if (
        !navigator.geolocation
    ) {
        setGPSStatus(
            "この端末ではGPSを利用できません"
        );
        return;
    }
    if (
        watchId !== null
    ) {
        return;
    }
    setGPSStatus(
        "GPS取得中..."
    );
    watchId =
        navigator.geolocation.watchPosition(
            updateGPS,
            gpsError,
            {
                enableHighAccuracy:
                    true,
                maximumAge:
                    500,
                timeout:
                    10000
            }
        );
}
/* =====================================================
   GPS更新
===================================================== */
function updateGPS(
    position
) {
    if (
        testMode ||
        arrived
    ) {
        return;
    }
    const lat =
        position.coords.latitude;
    const lon =
        position.coords.longitude;
    let speed =
        position.coords.speed;
    if (
        speed !== null &&
        speed !== undefined &&
        !isNaN(speed)
    ) {
        speed =
            Math.max(
                0,
                speed * 3.6
            );
    }
    else {
        speed = 0;
    }
    /*
       速度を少し平滑化
    */
    speed =
        lastSpeed * .35 +
        speed * .65;
    lastSpeed =
        speed;
    document.getElementById(
        "speed"
    ).textContent =
        Math.round(speed);
    /*
       次駅
    */
    const nextIndex =
        currentIndex + 1;
    if (
        nextIndex >=
        currentRoute.length
    ) {
        showArrival();
        return;
    }
    const nextStation =
        currentRoute[
            nextIndex
        ];
    const nextData =
        stationDB[
            nextStation
        ];
    /*
       座標がない場合でも
       画面は動かす
    */
    if (
        !nextData
    ) {
        setGPSStatus(
            "GPS接続中"
        );
        return;
    }
    const distance =
        getDistance(
            lat,
            lon,
            nextData.lat,
            nextData.lon
        );
    /*
       現在駅
    */
    const currentStation =
        currentRoute[
            currentIndex
        ];
    const currentData =
        stationDB[
            currentStation
        ];
    let totalDistance =
        1000;
    if (
        currentData
    ) {
        totalDistance =
            getDistance(
                currentData.lat,
                currentData.lon,
                nextData.lat,
                nextData.lon
            );
    }
    /*
       進行率
    */
    let progress =
        1 -
        (
            distance /
            totalDistance
        );
    progress =
        Math.max(
            0,
            Math.min(
                1,
                progress
            )
        );
    document.getElementById(
        "progressFill"
    ).style.width =
        (
            progress * 100
        ) + "%";
    /*
       距離表示
    */
    if (
        distance < 100
    ) {
        document.getElementById(
            "distanceText"
        ).textContent =
            nextStation +
            " まもなく";
    }
    else {
        document.getElementById(
            "distanceText"
        ).textContent =
            nextStation +
            "まであと " +
            (
                distance / 1000
            ).toFixed(1) +
            " km";
    }
    /*
       駅に近づいて、
       速度が落ちたら次駅へ
       180m以内
       ＋
       15km/h以下
    */
    if (
        distance <= 180 &&
        speed <= 15
    ) {
        currentIndex++;
        document.getElementById(
            "progressFill"
        ).style.width =
            "0%";
        updateStationDisplay();
        return;
    }
    setGPSStatus(
        "GPS接続中"
    );
}
/* =====================================================
   到着
===================================================== */
function showArrival() {
    arrived =
        true;
    document.getElementById(
        "speed"
    ).textContent =
        "0";
    document.getElementById(
        "progressFill"
    ).style.width =
        "100%";
    const finalStation =
        currentRoute[
            currentRoute.length - 1
        ];
    const box =
        document.getElementById(
            "stationRoute"
        );
    box.innerHTML = "";
    const column =
        document.createElement(
            "div"
        );
    column.className =
        "station-column";
    const vertical =
        document.createElement(
            "div"
        );
    vertical.className =
        "station-vertical";
    [
        ...finalStation
    ].forEach(
        char => {
            const span =
                document.createElement(
                    "span"
                );
            span.className =
                "station-char";
            span.textContent =
                char;
            vertical.appendChild(
                span
            );
        }
    );
    column.appendChild(
        vertical
    );
    box.appendChild(
        column
    );
    document.getElementById(
        "distanceText"
    ).textContent =
        finalStation +
        " 到着";
    setGPSStatus(
        finalStation +
        "に到着しました"
    );
}

let tapCount = 0;
let tapTimer = null;
document.addEventListener(

        clearTimeout(

        tapTimer =

/* =====================================================
   テストモード切替
===================================================== */
function toggleTestMode() {
    testMode =
        !testMode;
    const panel =
        document.getElementById(
            "testPanel"
        );
    if (
        testMode
    ) {
        if (
            watchId !== null
        ) {
            navigator.geolocation.clearWatch(
                watchId
            );
            watchId = null;
        }
        panel.style.display =
            "block";
        setGPSStatus(
            "テストモード"
        );
        randomMeter();
    }
    else {
        panel.style.display =
            "none";
        setGPSStatus(
            "GPSを待っています"
        );
        startGPS();
    }
}
/* =====================================================
   テストメーター
===================================================== */
function randomMeter() {
    if (
        currentIndex >=
        currentRoute.length - 1
    ) {
        return;
    }
    const value =
        Math.floor(
            Math.random() * 71
        ) + 20;
    document.getElementById(
        "progressFill"
    ).style.width =
        value + "%";
    const next =
        currentRoute[
            currentIndex + 1
        ];
    document.getElementById(
        "distanceText"
    ).textContent =
        "テスト走行中 → " +
        next;
}
/* =====================================================
   テスト：次の駅
===================================================== */
function testNextStation() {
    if (
        !testMode
    ) {
        return;
    }
    if (
        currentIndex <
        currentRoute.length - 1
    ) {
        currentIndex++;
        if (
            currentIndex >=
            currentRoute.length - 1
        ) {
            showArrival();
        }
        else {
            updateStationDisplay();
            randomMeter();
        }
    }
}
/* =====================================================
   テスト：前の駅
===================================================== */
function testPreviousStation() {
    if (
        !testMode
    ) {
        return;
    }
    if (
        currentIndex > 0
    ) {
        currentIndex--;
        arrived =
            false;
        updateStationDisplay();
        randomMeter();
    }
}
/* =====================================================
   距離計算
===================================================== */
function getDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {
    const R =
        6371000;
    const rad =
        Math.PI / 180;
    const dLat =
        (
            lat2 -
            lat1
        ) * rad;
    const dLon =
        (
            lon2 -
            lon1
        ) * rad;
    const a =
        Math.sin(
            dLat / 2
        ) ** 2 +
        Math.cos(
            lat1 * rad
        ) *
        Math.cos(
            lat2 * rad
        ) *
        Math.sin(
            dLon / 2
        ) ** 2;
    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );
    return R * c;
}
/* =====================================================
   GPSエラー
===================================================== */
function gpsError(
    error
) {
    let message =
        "GPSを取得できません";
    if (
        error.code === 1
    ) {
        message =
            "位置情報の使用を許可してください";
    }
    else if (
        error.code === 2
    ) {
        message =
            "現在地を取得できません";
    }
    else if (
        error.code === 3
    ) {
        message =
            "GPS取得がタイムアウトしました";
    }
    setGPSStatus(
        message
    );
}
/* =====================================================
   GPSステータス
===================================================== */
function setGPSStatus(
    text
) {
    const el =
        document.getElementById(
            "gpsStatus"
        );
    if (
        el
    ) {
        el.textContent =
            text;
    }
}

function backToSelect() {
    if (

        navigator.geolocation.clearWatch(

        watchId = null;
    }
    currentIndex =
        0;
    lastSpeed =
        0;
    arrived =

    testMode =
        false;

        "trainScreen"
    ).style.display =
