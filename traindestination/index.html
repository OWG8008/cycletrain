<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
  initial-scale=1,
  maximum-scale=1,
  user-scalable=no,
  viewport-fit=cover"
>

<title>Train Destination</title>

<style>

/* ================================
   RESET
================================ */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {

  color: white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    Arial,
    sans-serif;

  background:

    radial-gradient(
      circle at 10% 0%,
      rgba(255,255,255,.25),
      transparent 32%
    ),

    radial-gradient(
      circle at 100% 20%,
      rgba(100,160,255,.20),
      transparent 35%
    ),

    radial-gradient(
      circle at 50% 100%,
      rgba(255,255,255,.14),
      transparent 40%
    ),

    linear-gradient(
      145deg,
      #050608,
      #17191e,
      #07080a
    );

}


/* ================================
   APP
================================ */

.app {

  width: 100%;
  height: 100dvh;

  padding:
    calc(5px + env(safe-area-inset-top))
    7px
    calc(5px + env(safe-area-inset-bottom));

  display: flex;

  flex-direction: column;

  gap: 5px;

}


/* ================================
   LIQUID GLASS
================================ */

.glass {

  position: relative;

  overflow: hidden;

  background:

    linear-gradient(
      135deg,
      rgba(255,255,255,.25),
      rgba(255,255,255,.105) 45%,
      rgba(255,255,255,.045)
    );

  border:
    1px solid
    rgba(255,255,255,.30);

  box-shadow:

    inset
    0 1px 0
    rgba(255,255,255,.42),

    inset
    0 -1px 0
    rgba(255,255,255,.08),

    0 8px 30px
    rgba(0,0,0,.25);

  backdrop-filter:
    blur(35px)
    saturate(190%)
    brightness(1.13);

  -webkit-backdrop-filter:
    blur(35px)
    saturate(190%)
    brightness(1.13);

}


/* ガラスの反射 */

.glass::before {

  content: "";

  position: absolute;

  width: 160%;
  height: 100%;

  left: -30%;
  top: -65%;

  background:

    linear-gradient(
      115deg,
      transparent 35%,
      rgba(255,255,255,.20) 50%,
      transparent 65%
    );

  transform:
    rotate(-7deg);

  pointer-events: none;

}


/* ================================
   HEADER
================================ */

.header {

  min-height: 64px;

  padding:
    9px 14px;

  border-radius: 24px;

}

.train-type {

  position: relative;
  z-index: 1;

  font-size: 11px;

  color:
    rgba(255,255,255,.62);

}

.destination {

  position: relative;
  z-index: 1;

  margin-top: 2px;

  font-size: 26px;

  line-height: 1;

  font-weight: 780;

  letter-spacing: -1px;

}


/* ================================
   SPEED
================================ */

.speed-card {

  min-height: 91px;

  padding:
    8px 14px;

  border-radius: 24px;

}

.label {

  position: relative;
  z-index: 1;

  font-size: 11px;

  color:
    rgba(255,255,255,.57);

}

.speed-row {

  position: relative;
  z-index: 1;

  display: flex;

  align-items: baseline;

}

.speed {

  font-size: 54px;

  line-height: .88;

  font-weight: 780;

  letter-spacing: -4px;

  font-variant-numeric:
    tabular-nums;

}

.unit {

  margin-left: 7px;

  font-size: 14px;

  color:
    rgba(255,255,255,.58);

}


/* ================================
   POSITION
================================ */

.position-card {

  min-height: 122px;

  padding:
    10px 14px;

  border-radius: 24px;

}

.station-row {

  position: relative;
  z-index: 1;

  display: flex;

  justify-content:
    space-between;

  align-items:
    center;

}

.station {

  font-size: 17px;

  font-weight: 750;

  white-space:
    nowrap;

}

.progress {

  position: relative;
  z-index: 1;

  width: 100%;

  height: 22px;

  margin-top: 12px;

  border-radius: 999px;

  overflow: hidden;

  background:
    rgba(255,255,255,.105);

  border:
    1px solid
    rgba(255,255,255,.17);

}

.progress-fill {

  position: absolute;

  left: 0;
  top: 0;

  width: 0%;

  height: 100%;

  border-radius: 999px;

  background:

    linear-gradient(
      90deg,
      rgba(255,255,255,.48),
      rgba(255,255,255,.98)
    );

  box-shadow:
    0 0 17px
    rgba(255,255,255,.45);

  transition:
    width .35s ease-out;

}

.distance {

  position: relative;
  z-index: 1;

  margin-top: 7px;

  text-align: right;

  font-size: 12px;

  color:
    rgba(255,255,255,.68);

}


/* ================================
   CURRENT SECTION
================================ */

.section-card {

  min-height: 76px;

  padding:
    9px 14px;

  border-radius: 24px;

}

.section-title {

  position: relative;
  z-index: 1;

  font-size: 10px;

  color:
    rgba(255,255,255,.48);

}

.section-name {

  position: relative;
  z-index: 1;

  margin-top: 2px;

  font-size: 20px;

  font-weight: 760;

  line-height: 1.05;

}

.next {

  position: relative;
  z-index: 1;

  margin-top: 4px;

  font-size: 12px;

  color:
    rgba(255,255,255,.60);

}


/* ================================
   GPS
================================ */

.gps-card {

  min-height: 37px;

  padding:
    7px 12px;

  border-radius: 19px;

  display: flex;

  justify-content:
    space-between;

  align-items:
    center;

}

.gps-left {

  position: relative;
  z-index: 1;

  display: flex;

  align-items:
    center;

  gap: 7px;

}

.gps-dot {

  width: 7px;
  height: 7px;

  border-radius: 50%;

  background:
    rgba(255,255,255,.30);

}

.gps-dot.active {

  background: white;

  box-shadow:
    0 0 12px
    rgba(255,255,255,.95);

}

.gps-text {

  font-size: 11px;

  color:
    rgba(255,255,255,.65);

}

.accuracy {

  position: relative;
  z-index: 1;

  font-size: 10px;

  color:
    rgba(255,255,255,.42);

}


/* ================================
   BUTTON
================================ */

.gps-button {

  min-height: 40px;

  width: 100%;

  border: none;

  border-radius: 20px;

  background:

    linear-gradient(
      180deg,
      rgba(255,255,255,.98),
      rgba(255,255,255,.72)
    );

  color: #111;

  font-size: 14px;

  font-weight: 700;

}

.gps-button:active {

  transform:
    scale(.985);

}


/* ================================
   ARRIVAL
================================ */

.arrival {

  display: none;

  padding: 13px;

  border-radius: 24px;

  text-align: center;

}

.arrival.show {

  display: block;

}

.arrival-title {

  font-size: 10px;

  color:
    rgba(255,255,255,.50);

}

.arrival-name {

  font-size: 27px;

  font-weight: 780;

}


/* ================================
   SMALL HEIGHT
================================ */

@media (
  max-height: 760px
) {

  .app {
    gap: 4px;
  }

  .header {
    min-height: 57px;
  }

  .speed-card {
    min-height: 78px;
  }

  .speed {
    font-size: 46px;
  }

  .position-card {
    min-height: 105px;
  }

  .progress {
    height: 18px;
    margin-top: 8px;
  }

  .section-card {
    min-height: 67px;
  }

}

</style>
</head>


<body>


<div class="app">


  <!-- HEADER -->

  <div class="header glass">

    <div class="train-type">
      普通列車
    </div>

    <div class="destination">
      行橋行
    </div>

  </div>


  <!-- SPEED -->

  <div class="speed-card glass">

    <div class="label">
      速度
    </div>

    <div class="speed-row">

      <span
        id="speed"
        class="speed"
      >
        --
      </span>

      <span class="unit">
        km/h
      </span>

    </div>

  </div>


  <!-- POSITION -->

  <div class="position-card glass">

    <div class="label">
      列車位置
    </div>

    <div class="station-row">

      <div
        id="fromStation"
        class="station"
      >
        豊前善光寺
      </div>

      <div
        id="toStation"
        class="station"
      >
        天津
      </div>

    </div>


    <div class="progress">

      <div
        id="progressFill"
        class="progress-fill"
      ></div>

    </div>


    <div
      id="distance"
      class="distance"
    >
      GPS取得中...
    </div>

  </div>


  <!-- SECTION -->

  <div class="section-card glass">

    <div class="section-title">
      現在走行区間
    </div>

    <div
      id="sectionName"
      class="section-name"
    >
      豊前善光寺 → 天津
    </div>

    <div
      id="next"
      class="next"
    >
      次は「天津」です
    </div>

  </div>


  <!-- GPS -->

  <div class="gps-card glass">

    <div class="gps-left">

      <div
        id="gpsDot"
        class="gps-dot"
      ></div>

      <div
        id="gpsText"
        class="gps-text"
      >
        GPS待機中
      </div>

    </div>

    <div
      id="accuracy"
      class="accuracy"
    >
      -- m
    </div>

  </div>


  <button
    class="gps-button"
    onclick="startGPS()"
  >
    GPSを開始
  </button>


  <!-- ARRIVAL -->

  <div
    id="arrival"
    class="arrival glass"
  >

    <div class="arrival-title">
      終点到着
    </div>

    <div class="arrival-name">
      行橋
    </div>

  </div>


</div>



<script>

/* =========================================================
   駅データ

   豊前善光寺
   ↓
   天津
   ↓
   今津
   ↓
   東中津
   ↓
   中津
   ↓
   吉富
   ↓
   三毛門
   ↓
   宇島
   ↓
   豊前松江
   ↓
   椎田
   ↓
   築城
   ↓
   新田原
   ↓
   南行橋
   ↓
   行橋
========================================================= */

const stations = [

  {
    name: "豊前善光寺",
    lat: 33.5664462,
    lon: 131.3229872
  },

  {
    name: "天津",
    lat: 33.5646518,
    lon: 131.2931969
  },

  {
    name: "今津",
    lat: 33.5719364,
    lon: 131.2676687
  },

  {
    name: "東中津",
    lat: 33.5876661,
    lon: 131.2389301
  },

  {
    name: "中津",
    lat: 33.5991369,
    lon: 131.1909351
  },

  {
    name: "吉富",
    lat: 33.6048309,
    lon: 131.1735756
  },

  {
    name: "三毛門",
    lat: 33.6147369,
    lon: 131.1553124
  },

  {
    name: "宇島",
    lat: 33.6212411,
    lon: 131.1264123
  },

  {
    name: "豊前松江",
    lat: 33.6224544,
    lon: 131.0952661
  },

  {
    name: "椎田",
    lat: 33.6534281,
    lon: 131.0578436
  },

  {
    name: "築城",
    lat: 33.6731005,
    lon: 131.0378479
  },

  {
    name: "新田原",
    lat: 33.6952063,
    lon: 131.0082270
  },

  {
    name: "南行橋",
    lat: 33.7162864,
    lon: 130.9811458
  },

  {
    name: "行橋",
    lat: 33.7287286,
    lon: 130.9709038
  }

];


/* =========================================================
   STATE

   ここが今回の重要部分
========================================================= */


/*
   現在の駅

   0 = 豊前善光寺

   1 = 天津

   2 = 今津

   3 = 東中津

   ...
*/

let currentStation = 0;


/*
   GPS監視
*/

let watchId = null;


/*
   GPSの前回位置
*/

let previousGPS = null;


/*
   現在の進行率
*/

let progressValue = 0;


/*
   GPS誤差
*/

const MAX_ACCURACY = 100;


/*
   駅を通過したと判断する距離

   これを大きめにして
   GPSが駅を少し飛び越しても
   ちゃんと次駅へ進む。
*/

const PASS_RADIUS = 250;


/*
   さらに次駅が近ければ
   強制的に進める。

   これが「天津で止まる」
   問題への対策。
*/

const FORCE_NEXT_RADIUS = 500;


/* =========================================================
   DISTANCE
========================================================= */

function getDistance(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R = 6371000;

  const p =
    Math.PI / 180;

  const dLat =
    (lat2 - lat1) * p;

  const dLon =
    (lon2 - lon1) * p;

  const a =

    Math.sin(dLat / 2) ** 2 +

    Math.cos(lat1 * p) *
    Math.cos(lat2 * p) *

    Math.sin(dLon / 2) ** 2;

  const c =

    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

  return R * c;

}


/* =========================================================
   START GPS
========================================================= */

function startGPS() {

  if (
    !navigator.geolocation
  ) {

    setGPS(
      "GPS非対応",
      false
    );

    return;

  }


  if (
    watchId !== null
  ) {

    return;

  }


  setGPS(
    "GPS取得中...",
    false
  );


  watchId =

    navigator.geolocation.watchPosition(

      updateGPS,

      gpsError,

      {

        enableHighAccuracy:
          true,

        maximumAge:
          0,

        timeout:
          10000

      }

    );

}


/* =========================================================
   GPS UPDATE
========================================================= */

function updateGPS(
  position
) {

  const c =
    position.coords;


  const lat =
    c.latitude;

  const lon =
    c.longitude;

  const accuracy =
    c.accuracy;


  document.getElementById(
    "accuracy"
  ).textContent =

    Math.round(
      accuracy
    ) + " m";


  /*
     GPS誤差が大きすぎるときは
     駅判定しない。
  */

  if (
    accuracy >
    MAX_ACCURACY
  ) {

    setGPS(
      "GPS精度低下中",
      false
    );

    return;

  }


  /*
     現在の「次の駅」
  */

  const nextIndex =
    currentStation + 1;


  /*
     行橋到着済み
  */

  if (
    nextIndex >=
    stations.length
  ) {

    arrival();

    return;

  }


  const current =
    stations[
      currentStation
    ];

  const next =
    stations[
      nextIndex
    ];


  /*
     現在駅から次駅までの
     距離
  */

  const total =
    getDistance(
      current.lat,
      current.lon,
      next.lat,
      next.lon
    );


  /*
     現在地から次駅
  */

  const toNext =
    getDistance(
      lat,
      lon,
      next.lat,
      next.lon
    );


  /*
     現在地から現在駅
  */

  const fromCurrent =
    getDistance(
      lat,
      lon,
      current.lat,
      current.lon
    );


  /* ======================================================
     駅切り替え
  ====================================================== */


  /*
     ★最重要★

     次駅に250m以内なら
     次駅へ進む。

     GPSが駅を飛び越しても
     ここで更新。
  */

  if (
    toNext <=
    PASS_RADIUS
  ) {

    moveToNextStation();

    return;

  }


  /*
     GPSが次駅の500m以内なら
     さらに強制的に進める。

     ただし現在駅から十分離れている
     場合のみ。
  */

  if (
    toNext <=
    FORCE_NEXT_RADIUS
    &&
    fromCurrent >
    300
  ) {

    moveToNextStation();

    return;

  }


  /* ======================================================
     進行率
  ====================================================== */


  /*
     現在駅から次駅までの
     距離比率。

     例：

     10km区間で
     現在3km進んでいる

     → 30%
  */

  let progress =

    1 -
    (
      toNext /
      total
    );


  /*
     0～1に収める
  */

  progress =

    Math.max(
      0,
      Math.min(
        1,
        progress
      )
    );


  /*
     GPSの揺れで
     バーが後ろに戻らない。

     ただし一定以上進んだ場合は更新。
  */

  if (
    progress >
    progressValue
  ) {

    progressValue =
      progress;

  }


  /*
     バー表示
  */

  document.getElementById(
    "progressFill"
  ).style.width =

    (
      progressValue *
      100
    ) + "%";


  /*
     距離表示
  */

  if (
    toNext <
    100
  ) {

    document.getElementById(
      "distance"
    ).textContent =

      next.name +
      " まもなく";

  }

  else {

    document.getElementById(
      "distance"
    ).textContent =

      next.name +
      "まであと " +

      (
        toNext / 1000
      ).toFixed(1) +

      " km";

  }


  /* ======================================================
     SPEED
  ====================================================== */

  let speed =
    c.speed;


  /*
     iPhoneがspeedを返さない場合
  */

  if (
    speed === null ||
    speed === undefined ||
    !Number.isFinite(speed)
  ) {

    speed =
      calculateSpeed(
        lat,
        lon,
        position.timestamp
      );

  }

  else {

    speed =
      speed * 3.6;

  }


  /*
     異常値防止
  */

  if (
    !Number.isFinite(speed) ||
    speed < 0
  ) {

    speed = 0;

  }


  if (
    speed > 180
  ) {

    speed = 180;

  }


  document.getElementById(
    "speed"
  ).textContent =

    Math.round(
      speed
    );


  /*
     GPS正常
  */

  setGPS(
    "GPS接続中",
    true
  );


  /*
     前回GPS
  */

  previousGPS = {

    lat:
      lat,

    lon:
      lon,

    time:
      position.timestamp

  };

}


/* =========================================================
   NEXT STATION
========================================================= */

function moveToNextStation() {

  /*
     まだ行橋ではない
  */

  if (
    currentStation <
    stations.length - 1
  ) {

    currentStation++;

  }


  /*
     行橋
  */

  if (
    currentStation >=
    stations.length - 1
  ) {

    arrival();

    return;

  }


  /*
     新しい駅間なので
     バーを0に戻す。
  */

  progressValue =
    0;


  document.getElementById(
    "progressFill"
  ).style.width =
    "0%";


  updateUI();

}


/* =========================================================
   UI UPDATE
========================================================= */

function updateUI() {

  const from =
    stations[
      currentStation
    ];

  const to =
    stations[
      currentStation + 1
    ];


  document.getElementById(
    "fromStation"
  ).textContent =
    from.name;


  document.getElementById(
    "toStation"
  ).textContent =
    to.name;


  document.getElementById(
    "sectionName"
  ).textContent =

    from.name +
    " → " +
    to.name;


  document.getElementById(
    "next"
  ).textContent =

    "次は「" +
    to.name +
    "」です";


  document.getElementById(
    "distance"
  ).textContent =

    to.name +
    "まであと -- km";

}


/* =========================================================
   SPEED FROM GPS
========================================================= */

function calculateSpeed(
  lat,
  lon,
  time
) {

  if (
    !previousGPS
  ) {

    return 0;

  }


  const d =
    getDistance(
      previousGPS.lat,
      previousGPS.lon,
      lat,
      lon
    );


  const dt =
    (
      time -
      previousGPS.time
    ) / 1000;


  if (
    dt <= 0
  ) {

    return 0;

  }


  return (
    d / dt
  ) * 3.6;

}


/* =========================================================
   GPS STATUS
========================================================= */

function setGPS(
  text,
  active
) {

  document.getElementById(
    "gpsText"
  ).textContent =
    text;


  const dot =
    document.getElementById(
      "gpsDot"
    );


  if (
    active
  ) {

    dot.classList.add(
      "active"
    );

  }

  else {

    dot.classList.remove(
      "active"
    );

  }

}


/* =========================================================
   ARRIVAL
========================================================= */

function arrival() {

  document.getElementById(
    "speed"
  ).textContent =
    "0";


  document.getElementById(
    "fromStation"
  ).textContent =
    "行橋";


  document.getElementById(
    "toStation"
  ).textContent =
    "";


  document.getElementById(
    "progressFill"
  ).style.width =
    "100%";


  document.getElementById(
    "distance"
  ).textContent =
    "行橋 到着";


  document.getElementById(
    "sectionName"
  ).textContent =
    "行橋";


  document.getElementById(
    "next"
  ).textContent =
    "終点です";


  document.getElementById(
    "arrival"
  ).classList.add(
    "show"
  );


  setGPS(
    "行橋に到着",
    true
  );

}


/* =========================================================
   GPS ERROR
========================================================= */

function gpsError(
  error
) {

  let text =
    "GPSエラー";


  if (
    error.code === 1
  ) {

    text =
      "位置情報を許可してください";

  }


  if (
    error.code === 2
  ) {

    text =
      "現在地を取得できません";

  }


  if (
    error.code === 3
  ) {

    text =
      "GPS取得がタイムアウトしました";

  }


  setGPS(
    text,
    false
  );

}


/* =========================================================
   INIT
========================================================= */

updateUI();


window.addEventListener(
  "load",
  () => {

    startGPS();

  }
);

</script>
