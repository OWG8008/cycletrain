<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="
        width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover
    "
>
<title>列車情報｜普通 行橋行</title>
<style>
/* =====================================================
   RESET
===================================================== */
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color:
        transparent;
}
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    color: #fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;
}
/* =====================================================
   BACKGROUND
===================================================== */
body {
    background:
        radial-gradient(
            circle at 5% 0%,
            rgba(255,255,255,.32),
            transparent 30%
        ),
        radial-gradient(
            circle at 100% 12%,
            rgba(125,165,255,.28),
            transparent 35%
        ),
        radial-gradient(
            circle at 40% 100%,
            rgba(255,255,255,.16),
            transparent 38%
        ),
        radial-gradient(
            circle at 85% 85%,
            rgba(170,200,255,.12),
            transparent 30%
        ),
        linear-gradient(
            145deg,
            #050609 0%,
            #101218 38%,
            #1a1d24 60%,
            #050608 100%
        );
}
/* =====================================================
   背景の光
===================================================== */
body::before {
    content: "";
    position: fixed;
    width: 240px;
    height: 240px;
    left: -90px;
    top: 130px;
    border-radius: 50%;
    background:
        rgba(255,255,255,.12);
    filter:
        blur(70px);
    pointer-events: none;
}
body::after {
    content: "";
    position: fixed;
    width: 280px;
    height: 280px;
    right: -120px;
    bottom: 100px;
    border-radius: 50%;
    background:
        rgba(100,145,255,.13);
    filter:
        blur(80px);
    pointer-events: none;
}
/* =====================================================
   APP
===================================================== */
.app {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100dvh;
    max-width: 650px;
    margin: 0 auto;
    padding:
        calc(
            14px +
            env(safe-area-inset-top)
        )
        9px
        calc(
            10px +
            env(safe-area-inset-bottom)
        )
        9px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
/* =====================================================
   LIQUID GLASS 共通
===================================================== */
.glass {
    position: relative;
    overflow: hidden;
    border:
        1px solid
        rgba(255,255,255,.27);
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.22),
            rgba(255,255,255,.105) 42%,
            rgba(255,255,255,.055)
        );
    backdrop-filter:
        blur(42px)
        saturate(190%)
        brightness(1.15);
    -webkit-backdrop-filter:
        blur(42px)
        saturate(190%)
        brightness(1.15);
    box-shadow:
        inset
        0 1px 0
        rgba(255,255,255,.45),
        inset
        0 -1px 0
        rgba(255,255,255,.07),
        0 18px 45px
        rgba(0,0,0,.25);
}
/* =====================================================
   ガラス反射
===================================================== */
.glass::before {
    content: "";
    position: absolute;
    left: -35%;
    top: -75%;
    width: 170%;
    height: 120%;
    background:
        linear-gradient(
            115deg,
            transparent 34%,
            rgba(255,255,255,.20) 48%,
            rgba(255,255,255,.06) 53%,
            transparent 68%
        );
    transform:
        rotate(-6deg);
    pointer-events: none;
}
/* =====================================================
   HEADER
===================================================== */
.header {
    padding:
        15px
        18px
        17px;
    border-radius: 29px;
    margin-bottom: 10px;
}
.train-type {
    position: relative;
    z-index: 1;
    font-size: 14px;
    color:
        rgba(255,255,255,.62);
    margin-bottom: 3px;
}
.destination {
    position: relative;
    z-index: 1;
    font-size: 31px;
    line-height: 1;
    font-weight: 780;
    letter-spacing: -1.2px;
}
/* =====================================================
   SPEED
===================================================== */
.speed-box {
    padding:
        14px
        18px
        16px;
    border-radius: 29px;
    margin-bottom: 10px;
}
.speed-label {
    position: relative;
    z-index: 1;
    font-size: 13px;
    color:
        rgba(255,255,255,.54);
    margin-bottom: 4px;
}
.speed-row {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: baseline;
}
.speed {
    font-size: 78px;
    line-height: .87;
    font-weight: 750;
    letter-spacing: -5px;
    font-variant-numeric:
        tabular-nums;
}
.speed-unit {
    font-size: 18px;
    margin-left: 9px;
    color:
        rgba(255,255,255,.58);
}
/* =====================================================
   POSITION
===================================================== */
.position-section {
    padding:
        15px
        18px
        17px;
    border-radius: 29px;
    margin-bottom: 10px;
}
.position-title {
    position: relative;
    z-index: 1;
    font-size: 13px;
    color:
        rgba(255,255,255,.52);
    margin-bottom: 12px;
}
/* =====================================================
   駅名
===================================================== */
.station-row {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content:
        space-between;
    align-items:
        center;
    gap: 10px;
    margin-bottom: 10px;
}
.station {
    font-size: 20px;
    line-height: 1.1;
    font-weight: 720;
    white-space: nowrap;
}
.station.to {
    text-align: right;
}
/* =====================================================
   APPLE MUSIC風 BAR
===================================================== */
.progress-wrapper {
    position: relative;
    width: 100%;
    height: 24px;
}
.progress-background {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 24px;
    border-radius: 999px;
    background:
        rgba(255,255,255,.105);
    border:
        1px solid
        rgba(255,255,255,.13);
    overflow: hidden;
    box-shadow:
        inset
        0 2px 5px
        rgba(0,0,0,.25);
}
.progress-fill {
    position: absolute;
    left: 0;
    top: 0;
    width: 0%;
    height: 24px;
    border-radius: 999px;
    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.42),
            rgba(255,255,255,.74),
            rgba(255,255,255,1)
        );
    box-shadow:
        0 0 18px
        rgba(255,255,255,.48),
        inset
        0 1px 1px
        rgba(255,255,255,.65);
    transition:
        width .5s linear;
}
/* =====================================================
   距離
===================================================== */
.distance-text {
    position: relative;
    z-index: 1;
    margin-top: 9px;
    text-align: right;
    font-size: 14px;
    color:
        rgba(255,255,255,.68);
    font-variant-numeric:
        tabular-nums;
}
/* =====================================================
   INFO CARD
===================================================== */
.info-card {
    padding:
        15px
        18px
        17px;
    border-radius: 29px;
    margin-bottom: 10px;
}
.info-label {
    position: relative;
    z-index: 1;
    font-size: 12px;
    color:
        rgba(255,255,255,.47);
    margin-bottom: 5px;
}
.info-main {
    position: relative;
    z-index: 1;
    font-size: 23px;
    line-height: 1.1;
    font-weight: 760;
    letter-spacing: -.5px;
}
.info-sub {
    position: relative;
    z-index: 1;
    margin-top: 7px;
    font-size: 14px;
    color:
        rgba(255,255,255,.58);
}
/* =====================================================
   GPS
===================================================== */
.gps-area {
    margin-top: auto;
    padding-top: 7px;
}
.gps-status {
    position: relative;
    z-index: 1;
    font-size: 12px;
    color:
        rgba(255,255,255,.45);
    text-align: center;
    margin-bottom: 8px;
}
/* =====================================================
   GPS BUTTON
===================================================== */
.gps-button {
    position: relative;
    width: 100%;
    padding: 14px;
    border:
        1px solid
        rgba(255,255,255,.40);
    border-radius: 21px;
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.82),
            rgba(255,255,255,.54)
        );
    color: #111;
    font-size: 15px;
    font-weight: 700;
    box-shadow:
        inset
        0 1px 0
        rgba(255,255,255,.9),
        0 8px 25px
        rgba(0,0,0,.25);
    backdrop-filter:
        blur(20px);
    -webkit-backdrop-filter:
        blur(20px);
    cursor: pointer;
}
.gps-button:active {
    transform:
        scale(.975);
    opacity: .82;
}
/* =====================================================
   到着
===================================================== */
.arrived {
    position: relative;
    z-index: 1;
    font-size: 28px;
    font-weight: 750;
    margin-top: 8px;
}
/* =====================================================
   iPhone向け
===================================================== */
@media (
    max-width: 430px
) {
    .app {
        padding-left: 7px;
        padding-right: 7px;
    }
}
/* =====================================================
   小さい画面
===================================================== */
@media (
    max-height: 760px
) {
    .app {
        padding-top:
            calc(
                7px +
                env(safe-area-inset-top)
            );
        gap: 0;
    }
    .header {
        padding:
            11px 16px;
    }
    .destination {
        font-size: 28px;
    }
    .speed-box {
        padding:
            10px 16px;
    }
    .speed {
        font-size: 65px;
    }
    .position-section {
        padding:
            11px 16px;
    }
    .info-card {
        padding:
            11px 16px;
    }
    .station {
        font-size: 18px;
    }
}
/* =====================================================
   動きを減らす設定にも対応
===================================================== */
@media (
    prefers-reduced-motion: reduce
) {
    .progress-fill {
        transition: none;
    }
}
</style>
</head>
<body>
<div class="app">
    <!-- =================================================
         HEADER
    ================================================== -->
    <div class="header glass">
        <div class="train-type">
            普通列車
        </div>
        <div class="destination">
            行橋行
        </div>
    </div>
    <!-- =================================================
         SPEED
    ================================================== -->
    <div class="speed-box glass">
        <div class="speed-label">
            速度
        </div>
        <div class="speed-row">
            <span
                id="speed"
                class="speed"
            >
                --
            </span>
            <span class="speed-unit">
                km/h
            </span>
        </div>
    </div>
    <!-- =================================================
         POSITION
    ================================================== -->
    <div class="position-section glass">
        <div class="position-title">
            列車位置
        </div>
        <div class="station-row">
            <div
                id="fromStation"
                class="station"
            >
                豊前善光寺
            </div>
            <div
                id="toStation"
                class="station to"
            >
                柳ヶ浦
            </div>
        </div>
        <div class="progress-wrapper">
            <div class="progress-background">
                <div
                    id="progressFill"
                    class="progress-fill"
                ></div>
            </div>
        </div>
        <div
            id="distanceText"
            class="distance-text"
        >
            GPS取得中...
        </div>
    </div>
    <!-- =================================================
         INFO
    ================================================== -->
    <div class="info-card glass">
        <div class="info-label">
            現在走行区間
        </div>
        <div
            id="sectionName"
            class="info-main"
        >
            GPS取得中...
        </div>
        <div
            id="nextInfo"
            class="info-sub"
        >
            次駅を確認しています
        </div>
    </div>
    <!-- =================================================
         GPS
    ================================================== -->
    <div class="gps-area">
        <div
            id="gpsStatus"
            class="gps-status"
        >
            GPSを待っています
        </div>
        <button
            class="gps-button"
            onclick="startGPS()"
        >
            GPSを開始
        </button>
    </div>
</div>
<script>
/* =====================================================
   駅データ
===================================================== */
const stations = [
    {
        name: "豊前善光寺",
        lat: 33.5697,
        lon: 131.4240
    },
    {
        name: "柳ヶ浦",
        lat: 33.5650,
        lon: 131.3626
    },
    {
        name: "中津",
        lat: 33.5991,
        lon: 131.1909
    },
    {
        name: "吉富",
        lat: 33.6020,
        lon: 131.1750
    },
    {
        name: "三毛門",
        lat: 33.6200,
        lon: 131.1500
    },
    {
        name: "宇島",
        lat: 33.6120,
        lon: 131.1300
    },
    {
        name: "豊前松江",
        lat: 33.6480,
        lon: 131.1050
    },
    {
        name: "椎田",
        lat: 33.6700,
        lon: 131.0550
    },
    {
        name: "築城",
        lat: 33.6730,
        lon: 131.0300
    },
    {
        name: "新田原",
        lat: 33.6950,
        lon: 130.9900
    },
    {
        name: "南行橋",
        lat: 33.7160,
        lon: 130.9700
    },
    {
        name: "行橋",
        lat: 33.7308,
        lon: 130.9588
    }
];
/* =====================================================
   GPS
===================================================== */
let watchId = null;
/* =====================================================
   距離計算
===================================================== */
function getDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {
    const R = 6371000;
    const rad =
        Math.PI / 180;
    const dLat =
        (lat2 - lat1) * rad;
    const dLon =
        (lon2 - lon1) * rad;
    const a =
        Math.sin(dLat / 2) *
        Math.sin(dLat / 2) +
        Math.cos(lat1 * rad) *
        Math.cos(lat2 * rad) *
        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);
    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );
    return R * c;
}
/* =====================================================
   最近駅
===================================================== */
function findNearestStation(
    lat,
    lon
) {
    let nearestIndex = 0;
    let nearestDistance =
        Infinity;
    for (
        let i = 0;
        i < stations.length;
        i++
    ) {
        const d =
            getDistance(
                lat,
                lon,
                stations[i].lat,
                stations[i].lon
            );
        if (
            d < nearestDistance
        ) {
            nearestDistance = d;
            nearestIndex = i;
        }
    }
    return {
        index:
            nearestIndex,
        distance:
            nearestDistance
    };
}
/* =====================================================
   GPS開始
===================================================== */
function startGPS() {
    if (
        !navigator.geolocation
    ) {
        document.getElementById(
            "gpsStatus"
        ).textContent =
            "この端末ではGPSを利用できません";
        return;
    }
    if (
        watchId !== null
    ) {
        return;
    }
    document.getElementById(
        "gpsStatus"
    ).textContent =
        "GPS取得中...";
    watchId =
        navigator.geolocation.watchPosition(
            updateGPS,
            gpsError,
            {
                enableHighAccuracy:
                    true,
                maximumAge:
                    1000,
                timeout:
                    10000
            }
        );
}
/* =====================================================
   GPS更新
===================================================== */
function updateGPS(
    position
) {
    const lat =
        position.coords.latitude;
    const lon =
        position.coords.longitude;
    /* ======================
       速度
    ====================== */
    let speed =
        position.coords.speed;
    if (
        speed !== null &&
        speed !== undefined &&
        !isNaN(speed)
    ) {
        speed =
            Math.max(
                0,
                speed * 3.6
            );
    }
    else {
        speed = 0;
    }
    document.getElementById(
        "speed"
    ).textContent =
        Math.round(speed);
    /* ======================
       最近駅
    ====================== */
    const nearest =
        findNearestStation(
            lat,
            lon
        );
    /* ======================
       行橋到着
    ====================== */
    if (
        nearest.index >=
        stations.length - 1
    ) {
        showArrival();
        return;
    }
    /* ======================
       現在区間
    ====================== */
    const from =
        stations[
            nearest.index
        ];
    const to =
        stations[
            nearest.index + 1
        ];
    /* ======================
       区間距離
    ====================== */
    const totalDistance =
        getDistance(
            from.lat,
            from.lon,
            to.lat,
            to.lon
        );
    /* ======================
       次駅まで
    ====================== */
    const remaining =
        getDistance(
            lat,
            lon,
            to.lat,
            to.lon
        );
    /* ======================
       進行率
    ====================== */
    let progress =
        1 -
        (
            remaining /
            totalDistance
        );
    progress =
        Math.max(
            0,
            Math.min(
                1,
                progress
            )
        );
    /* ======================
       駅名
    ====================== */
    document.getElementById(
        "fromStation"
    ).textContent =
        from.name;
    document.getElementById(
        "toStation"
    ).textContent =
        to.name;
    /* ======================
       バー
    ====================== */
    document.getElementById(
        "progressFill"
    ).style.width =
        (
            progress * 100
        ) + "%";
    /* ======================
       距離
    ====================== */
    const km =
        remaining / 1000;
    let distanceText;
    if (
        km < 0.1
    ) {
        distanceText =
            to.name +
            " まもなく";
    }
    else {
        distanceText =
            to.name +
            "まであと " +
            km.toFixed(1) +
            " km";
    }
    document.getElementById(
        "distanceText"
    ).textContent =
        distanceText;
    /* ======================
       区間
    ====================== */
    document.getElementById(
        "sectionName"
    ).textContent =
        from.name +
        " → " +
        to.name;
    /* ======================
       次駅
    ====================== */
    document.getElementById(
        "nextInfo"
    ).textContent =
        "次は「" +
        to.name +
        "」です";
    /* ======================
       GPS状態
    ====================== */
    document.getElementById(
        "gpsStatus"
    ).textContent =
        "● GPS接続中";
}
/* =====================================================
   行橋到着
===================================================== */
function showArrival() {
    document.getElementById(
        "speed"
    ).textContent =
        "0";
    document.getElementById(
        "fromStation"
    ).textContent =
        "行橋";
    document.getElementById(
        "toStation"
    ).textContent =
        "";
    document.getElementById(
        "progressFill"
    ).style.width =
        "100%";
    document.getElementById(
        "distanceText"
    ).textContent =
        "行橋 到着";
    document.getElementById(
        "sectionName"
    ).textContent =
        "行橋";
    document.getElementById(
        "nextInfo"
    ).textContent =
        "終点です";
    document.getElementById(
        "gpsStatus"
    ).textContent =
        "● 行橋に到着しました";
}
/* =====================================================
   GPSエラー
===================================================== */
function gpsError(
    error
) {
    let message =
        "GPSを取得できません";
    switch (
        error.code
    ) {
        case 1:
            message =
                "位置情報の使用を許可してください";
            break;
        case 2:
            message =
                "現在地を取得できません";
            break;
        case 3:
            message =
                "GPS取得がタイムアウトしました";
            break;
    }
    document.getElementById(
        "gpsStatus"
    ).textContent =
        message;
}
/* =====================================================
   起動時
===================================================== */
window.addEventListener(
    "load",
    () => {
        startGPS();
    }
);
</script>
</body>
</html>
