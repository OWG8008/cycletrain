<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>GPS鉄道モニター</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:#08090d;
    color:#fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Noto Sans JP",
        sans-serif;
}

body{
    overflow-x:hidden;
}

button{
    font:inherit;
}

.hidden{
    display:none!important;
}


/* =========================
   設定画面
========================= */

.setup{
    max-width:720px;
    margin:auto;
    min-height:100vh;
    padding:25px 17px 35px;
}

.title{
    font-size:32px;
    font-weight:900;
    letter-spacing:-1.5px;
}

.subtitle{
    color:#858b97;
    font-size:13px;
    margin-top:5px;
    margin-bottom:24px;
}

.card{
    background:#15171d;
    border:1px solid #242730;
    border-radius:23px;
    padding:19px;
    margin-bottom:14px;
}

.card-title{
    font-size:17px;
    font-weight:900;
    margin-bottom:14px;
}


/* 列車 */

.train-grid{
    display:grid;
    gap:10px;
}

.train-btn{
    width:100%;
    border:0;
    border-radius:18px;
    padding:17px;
    background:#242730;
    color:#fff;
    text-align:left;
    transition:.15s;
}

.train-btn:active,
.route-btn:active,
.choice-btn:active,
.start-btn:active{
    transform:scale(.97);
}

.train-btn.selected{
    background:#315fea;
}

.train-name{
    font-size:19px;
    font-weight:900;
}

.train-description{
    margin-top:5px;
    color:#9298a4;
    font-size:12px;
}

.train-btn.selected .train-description{
    color:#dfe6ff;
}


/* 路線 */

.route-grid{
    display:grid;
    gap:10px;
}

.route-btn{
    width:100%;
    border:0;
    border-radius:17px;
    padding:16px;
    background:#242730;
    color:#fff;
    text-align:left;
}

.route-btn.selected{
    background:#315fea;
}

.route-name{
    font-size:18px;
    font-weight:900;
}

.route-detail{
    color:#8e95a2;
    margin-top:4px;
    font-size:12px;
}

.route-btn.selected .route-detail{
    color:#dfe6ff;
}


/* 行き先 */

.question{
    font-size:18px;
    font-weight:900;
    margin-bottom:13px;
}

.choice-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
}

.choice-btn{
    border:0;
    border-radius:15px;
    padding:15px 8px;
    background:#252832;
    color:#fff;
    font-weight:800;
}

.choice-btn.selected{
    background:#315fea;
}


/* ソニック停車駅 */

.stop-list{
    display:grid;
    gap:8px;
}

.stop-btn{
    width:100%;
    border:0;
    border-radius:15px;
    padding:14px;
    background:#242730;
    color:#fff;
    display:flex;
    align-items:center;
    gap:12px;
    text-align:left;
}

.stop-box{
    width:22px;
    height:22px;
    border-radius:7px;
    border:2px solid #6e7480;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-shrink:0;
}

.stop-btn.selected{
    background:#252c42;
}

.stop-btn.selected .stop-box{
    background:#315fea;
    border-color:#315fea;
}

.stop-box::after{
    content:"";
    width:8px;
    height:4px;
    border-left:2px solid white;
    border-bottom:2px solid white;
    transform:rotate(-45deg) scale(0);
    transition:.15s;
}

.stop-btn.selected .stop-box::after{
    transform:rotate(-45deg) scale(1);
}

.stop-name{
    font-weight:800;
}

.stop-note{
    color:#7e8592;
    font-size:11px;
    margin-left:auto;
}


/* 設定情報 */

.selected-info{
    color:#949aa7;
    font-size:14px;
    line-height:1.8;
}

.selected-info b{
    color:#fff;
}

.start-btn{
    width:100%;
    border:0;
    border-radius:19px;
    padding:18px;
    background:#28c76f;
    color:#fff;
    font-size:18px;
    font-weight:900;
}

.start-btn:disabled{
    background:#282c34;
    color:#626874;
}


/* =========================
   運転画面
========================= */

.drive{
    max-width:900px;
    margin:auto;
    min-height:100vh;
    padding:14px;
}

.topbar{
    height:43px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.service-name{
    font-size:16px;
    font-weight:900;
}

.service-destination{
    margin-top:2px;
    color:#8d94a1;
    font-size:11px;
}

.gps-status{
    color:#67d391;
    font-size:10px;
    font-weight:800;
}


/* 行先 */

.destination-card{
    background:#15171d;
    border-radius:23px;
    padding:20px;
    margin-bottom:13px;
}

.destination-title{
    font-size:34px;
    font-weight:900;
    letter-spacing:-1.5px;
}

.route-text{
    color:#878e9b;
    font-size:12px;
    margin-top:6px;
}


/* =========================
   駅進行
========================= */

.station-card{
    background:#15171d;
    border-radius:23px;
    padding:20px;
    margin-bottom:13px;
}

.station-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.station-top-title{
    font-size:15px;
    font-weight:900;
}

.station-count{
    color:#777e8b;
    font-size:11px;
}

.station-label-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:8px;
}

.station-label{
    color:#8c93a0;
    font-size:12px;
    font-weight:700;
}

.station-label.current{
    color:#fff;
}


/*
   Apple Music風バー
*/

.progress-wrap{
    position:relative;
    width:100%;
    height:22px;
    border-radius:999px;
    overflow:hidden;
    background:#30333b;
}

.progress-fill{
    position:absolute;
    left:0;
    top:0;
    width:0%;
    height:100%;
    border-radius:999px;
    background:#fff;
    transition:
        width .35s cubic-bezier(.22,.61,.36,1);
}

.progress-dot{
    position:absolute;
    top:50%;
    left:0%;
    width:14px;
    height:14px;
    border-radius:50%;
    background:#fff;
    transform:translate(-50%,-50%);
    box-shadow:0 0 0 3px rgba(255,255,255,.1);
    transition:
        left .35s cubic-bezier(.22,.61,.36,1);
}

.segment-info{
    display:flex;
    justify-content:space-between;
    margin-top:7px;
    color:#686f7b;
    font-size:10px;
}


/* =========================
   速度
========================= */

.speed-card{
    background:#15171d;
    border-radius:23px;
    padding:22px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.speed-circle{
    width:190px;
    height:190px;
    border-radius:50%;
    border:2px solid #383c45;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    box-shadow:
        inset 0 0 35px rgba(255,255,255,.025);
}

.speed-number{
    font-size:58px;
    line-height:.9;
    font-weight:900;
    letter-spacing:-3px;
}

.speed-unit{
    color:#858c98;
    font-size:13px;
    margin-top:9px;
}

.speed-label{
    color:#858c98;
    font-size:11px;
    margin-top:15px;
}


/* =========================
   GPS
========================= */

.gps-info{
    margin-top:13px;
    color:#666d79;
    font-size:10px;
    text-align:center;
}


/* =========================
   ATS
========================= */

.ats{
    position:fixed;
    z-index:100;
    left:14px;
    right:14px;
    bottom:14px;
    padding:13px 16px;
    border-radius:18px;
    background:rgba(24,27,34,.97);
    border:1px solid #383d47;
    transform:translateY(140%);
    transition:.3s;
}

.ats.show{
    transform:translateY(0);
}

.ats-label{
    color:#ffd34d;
    font-size:10px;
    font-weight:900;
}

.ats-text{
    margin-top:3px;
    font-size:14px;
    font-weight:900;
}


/* =========================
   到着
========================= */

.arrival{
    position:fixed;
    inset:0;
    z-index:200;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
    background:#08090d;
}

.arrival-box{
    width:100%;
    max-width:420px;
    text-align:center;
}

.arrival-small{
    color:#808793;
    font-size:13px;
}

.arrival-title{
    margin:10px 0;
    font-size:44px;
    font-weight:900;
}

.arrival-btn{
    width:100%;
    margin-top:22px;
    border:0;
    border-radius:18px;
    padding:17px;
    background:#315fea;
    color:#fff;
    font-weight:900;
}


@media(min-width:700px){

    .train-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .choice-grid{
        grid-template-columns:repeat(4,1fr);
    }
}
</style>
</head>


<body>


<!-- ==================================================
     設定
================================================== -->

<section id="setup" class="setup">

    <div class="title">
        列車設定
    </div>

    <div class="subtitle">
        列車種別・路線・行き先を設定
    </div>


    <!-- 列車 -->

    <div class="card">

        <div class="card-title">
            列車種別
        </div>

        <div class="train-grid">

            <button
                class="train-btn"
                data-train="普通"
                onclick="selectTrain('普通')">

                <div class="train-name">
                    普通
                </div>

                <div class="train-description">
                    路線・終着駅を指定
                </div>

            </button>


            <button
                class="train-btn"
                data-train="特急ソニック"
                onclick="selectTrain('特急ソニック')">

                <div class="train-name">
                    特急ソニック
                </div>

                <div class="train-description">
                    博多・大分・佐伯
                </div>

            </button>


            <button
                class="train-btn"
                data-train="特急ゆふいんの森"
                onclick="selectTrain('特急ゆふいんの森')">

                <div class="train-name">
                    特急ゆふいんの森
                </div>

                <div class="train-description">
                    博多・由布院・別府
                </div>

            </button>

        </div>
    </div>


    <!-- 普通の路線 -->

    <div
        id="routeCard"
        class="card hidden">

        <div class="card-title">
            路線選択
        </div>

        <div class="route-grid">

            <button
                class="route-btn"
                data-route="日豊本線"
                onclick="selectRoute('日豊本線')">

                <div class="route-name">
                    日豊本線
                </div>

                <div class="route-detail">
                    中津 ～ 佐伯
                </div>

            </button>


            <button
                class="route-btn"
                data-route="久大本線"
                onclick="selectRoute('久大本線')">

                <div class="route-name">
                    久大本線
                </div>

                <div class="route-detail">
                    大分 ～ 日田
                </div>

            </button>


            <button
                class="route-btn"
                data-route="豊肥本線"
                onclick="selectRoute('豊肥本線')">

                <div class="route-name">
                    豊肥本線
                </div>

                <div class="route-detail">
                    大分 ～ 宮地
                </div>

            </button>

        </div>
    </div>


    <!-- 行き先 -->

    <div
        id="destinationCard"
        class="card hidden">

        <div
            id="destinationQuestion"
            class="question">
            どこ行きですか？
        </div>

        <div
            id="destinationChoices"
            class="choice-grid">
        </div>

    </div>


    <!-- ソニック停車駅 -->

    <div
        id="sonicStopsCard"
        class="card hidden">

        <div class="card-title">
            停車駅を選択
        </div>

        <div class="subtitle">
            行き先までの停車駅を自由に選択
        </div>

        <div
            id="sonicStopList"
            class="stop-list">
        </div>

    </div>


    <!-- 設定確認 -->

    <div class="card">

        <div class="card-title">
            現在の設定
        </div>

        <div
            id="selectedInfo"
            class="selected-info">
            列車種別を選択してください
        </div>

    </div>


    <button
        id="startBtn"
        class="start-btn"
        disabled
        onclick="startDrive()">

        運転開始

    </button>

</section>



<!-- ==================================================
     運転
================================================== -->

<section
    id="drive"
    class="drive hidden">


    <div class="topbar">

        <div>

            <div
                id="driveTrain"
                class="service-name">
                普通
            </div>

            <div
                id="driveDestinationSmall"
                class="service-destination">
                --
            </div>

        </div>


        <div
            id="gpsStatus"
            class="gps-status">
            GPS待機中
        </div>

    </div>


    <!-- 行き先 -->

    <div class="destination-card">

        <div
            id="driveDestination"
            class="destination-title">
            --
        </div>

        <div
            id="driveRoute"
            class="route-text">
            --
        </div>

    </div>


    <!-- 駅進行 -->

    <div class="station-card">

        <div class="station-top">

            <div class="station-top-title">
                駅進行状況
            </div>

            <div
                id="stationCounter"
                class="station-count">
                0 / 0
            </div>

        </div>


        <div class="station-label-row">

            <div
                id="currentStationLabel"
                class="station-label current">
                --
            </div>

            <div
                id="nextStationLabel"
                class="station-label">
                --
            </div>

        </div>


        <div class="progress-wrap">

            <div
                id="progressFill"
                class="progress-fill">
            </div>

            <div
                id="progressDot"
                class="progress-dot">
            </div>

        </div>


        <div class="segment-info">

            <span id="previousStation">
                --
            </span>

            <span id="nextStation">
                --
            </span>

        </div>

    </div>


    <!-- 速度 -->

    <div class="speed-card">

        <div class="speed-circle">

            <div
                id="speed"
                class="speed-number">
                0
            </div>

            <div class="speed-unit">
                km/h
            </div>

        </div>

        <div class="speed-label">
            現在速度
        </div>

        <div
            id="gpsInfo"
            class="gps-info">
            GPS位置取得中...
        </div>

    </div>

</section>


<!-- ATS -->

<div
    id="ats"
    class="ats">

    <div class="ats-label">
        GPS
    </div>

    <div
        id="atsText"
        class="ats-text">
        --
    </div>

</div>


<!-- 到着 -->

<div
    id="arrival"
    class="arrival hidden">

    <div class="arrival-box">

        <div class="arrival-small">
            終着駅に到着しました
        </div>

        <div
            id="arrivalStation"
            class="arrival-title">
            --
        </div>

        <div class="arrival-small">
            お疲れさまでした
        </div>

        <button
            class="arrival-btn"
            onclick="backToSetup()">
            設定画面へ
        </button>

    </div>

</div>

/* =========================================================

function selectTrain(type){

/* =========================================================
   行き先
========================================================= */

function selectDestination(station){

    destination = station;


    document
        .querySelectorAll(".choice-btn")
        .forEach(btn=>{
            btn.classList.toggle(
                "selected",
                btn.textContent === station
            );
        });


    if(trainType === "特急ソニック"){

        showSonicStops();

    }else{

        document
            .getElementById(
                "sonicStopsCard"
            )
            .classList.add("hidden");
    }


    updateSetupInfo();
}


/* =========================================================
   ソニック停車駅
========================================================= */

function showSonicStops(){

    const card =
        document.getElementById(
            "sonicStopsCard"
        );

    const list =
        document.getElementById(
            "sonicStopList"
        );


    card.classList.remove("hidden");

    list.innerHTML = "";


    const route =
        sonicRoutes[destination];


    if(!route) return;


    route.forEach((station,index)=>{

        const btn =
            document.createElement("button");

        btn.className =
            "stop-btn";


        /*
           初期状態

           始発・終着は必ず停車
        */

        const mandatory =
            index === 0 ||
            index === route.length - 1;


        if(mandatory){

            sonicStops.push(station);

            btn.classList.add("selected");
        }


        btn.innerHTML = `
            <span class="stop-box"></span>
            <span class="stop-name">${station}</span>
            <span class="stop-note">
                ${mandatory ? "必停" : "選択"}
            </span>
        `;


        btn.onclick = ()=>{

            if(mandatory){
                return;
            }


            if(
                sonicStops.includes(station)
            ){

                sonicStops =
                    sonicStops.filter(
                        s=>s!==station
                    );

                btn.classList.remove(
                    "selected"
                );

            }else{

                sonicStops.push(station);

                btn.classList.add(
                    "selected"
                );
            }


            updateSetupInfo();
        };


        list.appendChild(btn);
    });
}


/* =========================================================
   設定確認
========================================================= */

function updateSetupInfo(){

    const info =
        document.getElementById(
            "selectedInfo"
        );

    const start =
        document.getElementById(
            "startBtn"
        );


    if(!trainType){

        info.innerHTML =
            "列車種別を選択してください";

        start.disabled = true;

        return;
    }


    if(trainType === "普通"){

        if(!selectedRoute){

            info.innerHTML =
                "列車：<b>普通</b><br>" +
                "路線：未選択<br>" +
                "終着：未選択";

            start.disabled = true;

            return;
        }


        if(!destination){

            info.innerHTML =
                "列車：<b>普通</b><br>" +
                "路線：<b>" +
                selectedRoute +
                "</b><br>" +
                "終着：未選択";

            start.disabled = true;

            return;
        }


        info.innerHTML =
            "列車：<b>普通</b><br>" +
            "路線：<b>" +
            selectedRoute +
            "</b><br>" +
            "終着：<b>" +
            destination +
            "</b>";

        start.disabled = false;

        return;
    }


    if(!destination){

        info.innerHTML =
            "列車：<b>" +
            trainType +
            "</b><br>" +
            "行き先：未選択";

        start.disabled = true;

        return;
    }


    if(
        trainType === "特急ソニック" &&
        sonicStops.length < 2
    ){

        info.innerHTML =
            "列車：<b>" +
            trainType +
            "</b><br>" +
            "行き先：<b>" +
            destination +
            "</b><br>" +
            "停車駅を選択してください";

        start.disabled = true;

        return;
    }


    info.innerHTML =
        "列車：<b>" +
        trainType +
        "</b><br>" +
        "行き先：<b>" +
        destination +
        "</b><br>" +
        (
            trainType === "特急ソニック"
            ? "停車駅：<b>" +
              sonicStops.join("・") +
              "</b>"
            : ""
        );


    start.disabled = false;
}


/* =========================================================
   ルート生成
========================================================= */

function makeRoute(){

    if(trainType === "普通"){

        const route =
            routes[selectedRoute];

        const index =
            route.indexOf(destination);

        if(index < 0) return [];

        return route.slice(
            0,
            index + 1
        );
    }


    if(trainType === "特急ソニック"){

        /*
           選択された停車駅だけ
        */

        const base =
            sonicRoutes[destination];


        if(!base) return [];


        const filtered =
            base.filter(
                station =>
                    sonicStops.includes(station)
            );


        /*
           GPS走行方向に合わせる
        */

        return filtered;
    }


    if(trainType === "特急ゆふいんの森"){

        return yufuinRoutes[destination] || [];
    }


    return [];
}


/* =========================================================
   運転開始
========================================================= */

function startDrive(){

    currentStations =
        makeRoute();


    if(currentStations.length < 2){

        alert(
            "運転ルートを作成できません。"
        );

        return;
    }


    for(
        const station of currentStations
    ){

        if(!stationDB[station]){

            alert(
                station +
                " のGPS座標がありません。"
            );

            return;
        }
    }


    driving = true;

    currentLat = null;
    currentLon = null;

    currentSpeed = 0;

    lastGPS = null;


    document
        .getElementById("setup")
        .classList.add("hidden");

    document
        .getElementById("drive")
        .classList.remove("hidden");


    document
        .getElementById("driveTrain")
        .textContent =
        trainType;


    document
        .getElementById("driveDestinationSmall")
        .textContent =
        destination + "行";


    document
        .getElementById("driveDestination")
        .textContent =
        destination + "行き";


    document
        .getElementById("driveRoute")
        .textContent =
        currentStations.join(" → ");


    createStationUI();

    updateStationUI();


    startGPS();


    showATS(
        "GPS位置情報を取得しています"
    );
}


/* =========================================================
   GPS開始
========================================================= */

function startGPS(){

    if(
        !("geolocation" in navigator)
    ){

        showGPSStatus(
            "GPS非対応"
        );

        showATS(
            "この端末では位置情報を利用できません"
        );

        return;
    }


    watchId =
        navigator.geolocation.watchPosition(

            position => {

                handleGPS(
                    position
                );

            },

            error => {

                handleGPSError(
                    error
                );

            },

            {
                enableHighAccuracy:true,
                maximumAge:1000,
                timeout:10000
            }
        );
}


/* =========================================================
   GPS処理
========================================================= */

function handleGPS(position){

    const lat =
        position.coords.latitude;

    const lon =
        position.coords.longitude;


    currentLat = lat;
    currentLon = lon;


    /*
       GPS速度

       iPhone等で速度が取れる場合は
       その値を使用。
    */

    if(
        position.coords.speed !== null &&
        position.coords.speed >= 0
    ){

        currentSpeed =
            position.coords.speed * 3.6;

    }else if(lastGPS){

        const distance =
            distanceMeters(
                lastGPS.lat,
                lastGPS.lon,
                lat,
                lon
            );


        const elapsed =
            (
                position.timestamp -
                lastGPS.time
            ) / 1000;


        if(elapsed > 0){

            currentSpeed =
                distance /
                elapsed *
                3.6;
        }
    }


    /*
       GPSノイズ対策
    */

    if(currentSpeed < 1){

        currentSpeed = 0;
    }


    currentSpeed =
        Math.min(
            currentSpeed,
            300
        );


    document
        .getElementById("speed")
        .textContent =
        Math.round(
            currentSpeed
        );


    lastGPS = {
        lat,
        lon,
        time:position.timestamp
    };


    /*
       現在位置をルートへ投影
    */

    updateRoutePosition(
        lat,
        lon
    );


    showGPSStatus(
        "GPS接続中"
    );


    document
        .getElementById("gpsInfo")
        .textContent =
        `位置 ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
}


/* =========================================================
   GPSエラー
========================================================= */

function handleGPSError(error){

    showGPSStatus(
        "GPSエラー"
    );


    let text =
        "GPSを取得できません";


    if(error.code === 1){

        text =
            "位置情報の使用を許可してください";

    }else if(error.code === 2){

        text =
            "現在位置を取得できません";

    }else if(error.code === 3){

        text =
            "GPS取得がタイムアウトしました";
    }


    showATS(text);
}


/* =========================================================
   ルート位置計算
========================================================= */

function updateRoutePosition(
    lat,
    lon
){

    let bestDistance =
        Infinity;

    let bestSegment = 0;

    let bestT = 0;


    /*
       全駅間を調べ、
       GPS位置から一番近い線分を探す
    */

    for(
        let i = 0;
        i < currentStations.length - 1;
        i++
    ){

        const a =
            stationDB[
                currentStations[i]
            ];

        const b =
            stationDB[
                currentStations[i+1]
            ];


        const result =
            projectPointToSegment(
                lat,
                lon,
                a.lat,
                a.lon,
                b.lat,
                b.lon
            );


        if(
            result.distance <
            bestDistance
        ){

            bestDistance =
                result.distance;

            bestSegment = i;

            bestT = result.t;
        }
    }


    nearestSegment =
        bestSegment;

    routeProgress =
        bestT;


    /*
       全体の進行率
    */

    const total =
        currentStations.length - 1;


    const percentage =
        (
            bestSegment +
            bestT
        ) /
        total *
        100;


    document
        .getElementById(
            "progressFill"
        )
        .style.width =
        percentage + "%";


    document
        .getElementById(
            "progressDot"
        )
        .style.left =
        percentage + "%";


    /*
       現在駅判定
    */

    updateCurrentStation(
        bestSegment,
        bestT
    );
}


/* =========================================================
   現在駅判定
========================================================= */

function updateCurrentStation(
    segment,
    t
){

    let index =
        segment;


    /*
       次駅にかなり近づいたら
       次駅を現在駅扱い
    */

    if(t >= 0.82){

        index =
            Math.min(
                segment + 1,
                currentStations.length - 1
            );
    }


    /*
       終着
    */

    if(
        index ===
        currentStations.length - 1 &&
        segment ===
        currentStations.length - 2 &&
        t >= .9
    ){

        arrive();

        return;
    }


    if(
        index !==
        window.lastStationIndex
    ){

        window.lastStationIndex =
            index;


        updateStationUI();


        if(index > 0){

            showATS(
                currentStations[index] +
                " 付近"
            );
        }
    }
}


/* =========================================================

========================================================= */

function createStationUI(){

function updateStationUI(){

    const index =
        window.lastStationIndex || 0;


    const total =
        currentStations.length;


    const current =
        currentStations[
            Math.min(
                index,
                total - 1
            )
        ];


    const next =
        index < total - 1
        ? currentStations[index + 1]
        : "終着駅";


    document
        .getElementById(
            "currentStationLabel"
        )
        .textContent =
        current;


    document
        .getElementById(
            "nextStationLabel"
        )
        .textContent =
        next;


    document
        .getElementById(
            "previousStation"
        )
        .textContent =
        index > 0
        ? currentStations[index - 1]
        : "始発駅";


    document
        .getElementById(
            "nextStation"
        )
        .textContent =
        next;


    document
        .getElementById(
            "stationCounter"
        )
        .textContent =
        `${index + 1} / ${total}`;
}

/* =========================================================
   距離
========================================================= */

function distanceMeters(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R =
        6371000;


    const rad =
        Math.PI / 180;


    const dLat =
        (lat2 - lat1) * rad;

    const dLon =
        (lon2 - lon1) * rad;


    const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * rad) *
        Math.cos(lat2 * rad) *
        Math.sin(dLon / 2) ** 2;


    return (
        2 *
        R *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        )
    );
}


/* =========================================================
   GPSを駅間線分へ投影
========================================================= */

function projectPointToSegment(
    pLat,
    pLon,
    aLat,
    aLon,
    bLat,
    bLon
){

    /*
       緯度経度をローカルXYへ変換
    */

    const latScale =
        111320;


    const lonScale =
        111320 *
        Math.cos(
            pLat *
            Math.PI /
            180
        );


    const px = 0;

    const py = 0;


    const ax =
        (aLon - pLon) *
        lonScale;

    const ay =
        (aLat - pLat) *
        latScale;


    const bx =
        (bLon - pLon) *
        lonScale;

    const by =
        (bLat - pLat) *
        latScale;


    const dx =
        bx - ax;

    const dy =
        by - ay;


    const length2 =
        dx * dx +
        dy * dy;


    let t = 0;


    if(length2 > 0){

        t =
            -(
                ax * dx +
                ay * dy
            ) /
            length2;
    }


    t =
        Math.max(
            0,
            Math.min(
                1,
                t
            )
        );


    const cx =
        ax + dx * t;

    const cy =
        ay + dy * t;


    const distance =
        Math.sqrt(
            cx * cx +
            cy * cy
        );


    return {
        t,
        distance
    };
}


/* =========================================================
   ATS
========================================================= */

function showATS(text){

    const box =
        document.getElementById(
            "ats"
        );


    document
        .getElementById(
            "atsText"
        )
        .textContent =
        text;


    box.classList.add("show");


    clearTimeout(
        window.atsTimer
    );


    window.atsTimer =
        setTimeout(()=>{
            box.classList.remove(
                "show"
            );
        },4000);
}


/* =========================================================
   到着
========================================================= */

function arrive(){

    if(!driving){
        return;
    }


    driving = false;


    if(
        watchId !== null
    ){

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId = null;
    }


    currentSpeed = 0;


    document
        .getElementById(
            "speed"
        )
        .textContent =
        "0";


    document
        .getElementById(
            "arrivalStation"
        )
        .textContent =
        destination;


    document
        .getElementById(
            "arrival"
        )
        .classList.remove(
            "hidden"
        );


    document
        .getElementById(
            "ats"
        )
        .classList.remove(
            "show"
        );
}


/* =========================================================
   戻る
========================================================= */

function backToSetup(){

    driving = false;


    if(
        watchId !== null
    ){

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId = null;
    }


    currentSpeed = 0;

    currentStations = [];

    destination = null;

    selectedRoute = null;

    sonicStops = [];

    window.lastStationIndex = 0;


    document
        .getElementById(
            "arrival"
        )
        .classList.add(
            "hidden"
        );


    document
        .getElementById(
            "drive"
        )
        .classList.add(
            "hidden"
        );


    document
        .getElementById(
            "setup"
        )
        .classList.remove(
            "hidden"
        );


    document
        .getElementById(
            "ats"
        )
        .classList.remove(
            "show"
        );
}


/* =========================================================
   初期化
========================================================= */

updateSetupInfo();
