<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1.0,
           maximum-scale=1.0,
           viewport-fit=cover"
>

<title>Train Destination</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #050505;
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
}

body {
    overflow-x: hidden;
}


/* =====================================================
   APP
===================================================== */

.app {
    width: 100%;
    max-width: 700px;

    margin: 0 auto;

    padding:
        calc(18px + env(safe-area-inset-top))
        16px
        calc(35px + env(safe-area-inset-bottom))
        16px;
}


/* =====================================================
   LIQUID GLASS
===================================================== */

.glass {

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.14),
            rgba(255,255,255,0.045)
        );

    border:
        1px solid rgba(255,255,255,0.12);

    box-shadow:
        0 18px 55px rgba(0,0,0,0.42),
        inset 0 1px 0 rgba(255,255,255,0.15),
        inset 0 -1px 0 rgba(255,255,255,0.025);

    backdrop-filter:
        blur(30px)
        saturate(150%);

    -webkit-backdrop-filter:
        blur(30px)
        saturate(150%);
}


/* =====================================================
   SETUP
===================================================== */

#setup {
    min-height:
        calc(
            100vh
            - env(safe-area-inset-top)
            - env(safe-area-inset-bottom)
        );

    display: flex;
    align-items: center;
}

.setup-card {
    width: 100%;
    padding: 25px;
    border-radius: 30px;
}

.setup-small {
    font-size: 13px;
    color: rgba(255,255,255,0.45);
    margin-bottom: 7px;
}

.setup-title {
    font-size: 31px;
    font-weight: 750;
    letter-spacing: -1.5px;
    margin-bottom: 24px;
}


/* =====================================================
   TRAIN CATEGORY
===================================================== */

.train-buttons {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
}

.train-button {

    width: 100%;

    border: none;
    border-radius: 18px;

    padding: 17px;

    background:
        rgba(255,255,255,0.08);

    color: white;

    font-size: 16px;
    font-weight: 650;

    text-align: left;
}

.train-button.active {

    background: white;
    color: black;

}


/* =====================================================
   OPTION AREA
===================================================== */

.option-area {
    display: none;
    margin-top: 18px;
}

.option-area.show {
    display: block;
}

.option-label {
    font-size: 13px;
    color: rgba(255,255,255,0.45);
    margin-bottom: 8px;
}

select,
input {

    width: 100%;

    border: none;
    outline: none;

    border-radius: 17px;

    padding: 16px;

    background:
        rgba(255,255,255,0.09);

    color: white;

    font-size: 17px;
    font-weight: 600;
}

select option {
    background: #151515;
    color: white;
}

input::placeholder {
    color: rgba(255,255,255,0.3);
}


/* =====================================================
   START
===================================================== */

.start-button {

    width: 100%;

    margin-top: 16px;

    border: none;
    border-radius: 19px;

    padding: 17px;

    background: white;
    color: black;

    font-size: 17px;
    font-weight: 700;
}


/* =====================================================
   MAIN
===================================================== */

#main {
    display: none;
}


/* =====================================================
   HEADER
===================================================== */

.header {

    padding: 22px;

    border-radius: 28px;

    margin-bottom: 15px;
}

.train-name {

    font-size: 15px;

    color:
        rgba(255,255,255,0.5);

    margin-bottom: 5px;
}

.destination {

    font-size: 31px;

    font-weight: 750;

    letter-spacing: -1.5px;
}


/* =====================================================
   NEXT STATIONS
===================================================== */

.next-card {

    padding: 20px;

    border-radius: 27px;

    margin-bottom: 15px;
}

.next-label {

    font-size: 13px;

    color:
        rgba(255,255,255,0.42);

    margin-bottom: 15px;
}

.station-route {

    display: flex;

    align-items: center;

    gap: 9px;

    overflow-x: auto;

    scrollbar-width: none;
}

.station-route::-webkit-scrollbar {
    display: none;
}

.route-station {

    font-size: 17px;

    font-weight: 700;

    white-space: nowrap;

    flex-shrink: 0;
}

.route-arrow {

    font-size: 18px;

    color:
        rgba(255,255,255,0.42);

    flex-shrink: 0;
}


/* =====================================================
   SPEED
===================================================== */

.speed-card {

    padding: 24px;

    border-radius: 28px;

    margin-bottom: 15px;
}

.speed-label {

    font-size: 14px;

    color:
        rgba(255,255,255,0.43);

    margin-bottom: 6px;
}

.speed-row {

    display: flex;

    align-items: baseline;
}

.speed {

    font-size: 76px;

    line-height: .95;

    font-weight: 750;

    letter-spacing: -5px;

    font-variant-numeric:
        tabular-nums;
}

.speed-unit {

    margin-left: 9px;

    font-size: 19px;

    color:
        rgba(255,255,255,0.45);
}


/* =====================================================
   POSITION
===================================================== */

.position-card {

    padding: 24px;

    border-radius: 28px;

    margin-bottom: 15px;
}

.position-label {

    font-size: 14px;

    color:
        rgba(255,255,255,0.43);

    margin-bottom: 15px;
}

.station-row {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 13px;
}

.station-from,
.station-to {

    font-size: 19px;

    font-weight: 700;
}

.station-to {
    text-align: right;
}


/* =====================================================
   PROGRESS BAR
===================================================== */

.progress {

    width: 100%;

    height: 19px;

    border-radius: 999px;

    overflow: hidden;

    background:
        rgba(255,255,255,0.10);

    box-shadow:
        inset 0 1px 4px rgba(0,0,0,0.25);
}

.progress-fill {

    width: 0%;

    height: 100%;

    border-radius: 999px;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,0.48),
            rgba(255,255,255,1)
        );

    box-shadow:
        0 0 18px
        rgba(255,255,255,0.2);

    transition:
        width .7s linear;
}

.distance {

    margin-top: 14px;

    text-align: right;

    font-size: 15px;

    color:
        rgba(255,255,255,0.63);

    font-variant-numeric:
        tabular-nums;
}


/* =====================================================
   GPS
===================================================== */

.gps-card {

    padding: 20px;

    border-radius: 27px;

    margin-bottom: 15px;
}

.gps-status {

    text-align: center;

    font-size: 13px;

    color:
        rgba(255,255,255,0.4);

    margin-bottom: 12px;
}

.gps-button {

    width: 100%;

    border: none;

    border-radius: 17px;

    padding: 15px;

    background:
        rgba(255,255,255,0.09);

    color: white;

    font-size: 15px;

    font-weight: 650;
}


/* =====================================================
   TEST MODE
===================================================== */

#testPanel {

    display: none;

    position: fixed;

    left: 14px;
    right: 14px;

    bottom:
        calc(
            14px +
            env(safe-area-inset-bottom)
        );

    z-index: 9999;

    padding: 15px;

    border-radius: 25px;

}

.test-title {

    font-size: 13px;

    color:
        rgba(255,255,255,0.5);

    margin-bottom: 9px;
}

.test-current {

    font-size: 19px;

    font-weight: 750;

    margin-bottom: 12px;
}

.test-buttons {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 9px;
}

.test-button {

    border: none;

    border-radius: 15px;

    padding: 14px;

    background:
        rgba(255,255,255,0.11);

    color: white;

    font-size: 15px;

    font-weight: 650;
}

.test-button.next {

    background: white;
    color: black;
}


/* =====================================================
   TEST BADGE
===================================================== */

#testBadge {

    display: none;

    position: fixed;

    top:
        calc(
            10px +
            env(safe-area-inset-top)
        );

    right: 12px;

    z-index: 10000;

    padding: 8px 12px;

    border-radius: 999px;

    background:
        rgba(255,255,255,0.14);

    border:
        1px solid
        rgba(255,255,255,0.13);

    backdrop-filter:
        blur(20px);

    font-size: 12px;

    font-weight: 700;
}


/* =====================================================
   ARRIVAL
===================================================== */

.arrival {

    margin-top: 10px;

    font-size: 25px;

    font-weight: 750;
}


/* =====================================================
   SMALL SCREEN
===================================================== */

@media (max-width:380px) {

    .app {
        padding-left: 13px;
        padding-right: 13px;
    }

    .speed {
        font-size: 63px;
    }

    .destination {
        font-size: 27px;
    }

    .station-from,
    .station-to {
        font-size: 17px;
    }

}

</style>
</head>

/* =====================================================
   TYPE SELECT
===================================================== */

function selectType(type) {

    selectedType = type;

    document
        .querySelectorAll(".train-button")
        .forEach(
            button =>
                button.classList.remove(
                    "active"
                )
        );


    if (
        type === "normal"
    ) {

        document
            .getElementById(
                "normalButton"
            )
            .classList.add(
                "active"
            );

    }


    if (
        type === "sonic"
    ) {

        document
            .getElementById(
                "sonicButton"
            )
            .classList.add(
                "active"
            );

    }


    if (
        type === "yufu"
    ) {

        document
            .getElementById(
                "yufuButton"
            )
            .classList.add(
                "active"
            );

        .querySelectorAll(
            ".option-area"

                    "show"
                )
        );


    if (
        type === "normal"
    ) {

        document
            .getElementById(
                "normalOptions"
            )
            .classList.add(
                "show"
            );

    }


    if (
        type === "sonic"
    ) {

        document
            .getElementById(
                "sonicOptions"
            )
            .classList.add(
                "show"
            );

    }


    if (
        type === "yufu"
    ) {

        document
            .getElementById(
                "yufuOptions"
            )
            .classList.add(
                "show"
            );

    }

}


/* =====================================================
   START TRAIN
===================================================== */

function startTrain() {

    if (!selectedType) {

        alert(
            "列車を選択してください"
        );

        return;

    }


    /*
    普通列車
    */

    if (
        selectedType === "normal"
    ) {

        const route =
            document
                .getElementById(
                    "normalRoute"
                )
                .value;


        currentRoute =
            [...routes[route]];

    }


    /*
    ソニック
    */

    if (
        selectedType === "sonic"
    ) {

        const number =
            document
                .getElementById(
                    "sonicNumber"
                )
                .value;


        if (!number) {

            alert(
                "号数を入力してください"
            );

            return;

        }


        currentRoute =
            [...sonicRoute];


        document
            .getElementById(
                "trainName"
            )
            .textContent =
            "特急ソニック " +
            number +
            "号";

    }


    /*
    ゆふ森
    */

    if (
        selectedType === "yufu"
    ) {

        const number =
            document
                .getElementById(
                    "yufuNumber"
                )
                .value;


        if (!number) {

            alert(
                "号数を入力してください"
            );

            return;

        }


        currentRoute =
            [...yufuRoute];


        document
            .getElementById(
                "trainName"
            )
            .textContent =
            "特急ゆふいんの森 " +
            number +
            "号";

    }


    /*
    普通列車タイトル
    */

    if (
        selectedType === "normal"
    ) {

        const select =
            document
                .getElementById(
                    "normalRoute"
                );

        document
            .getElementById(
                "trainName"
            )
            .textContent =
            "普通列車 " +
            select
                .options[
                    select.selectedIndex
                ]
                .text
                .split("　")[0];

    }


    currentIndex = 0;

    speedHistory = [];


    document
        .getElementById(
            "destination"
        )
        .textContent =
        currentRoute[
            currentRoute.length - 1
        ] +
        "行き";


    document
        .getElementById(
            "setup"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "main"
        )
        .style.display =
        "block";


    updateDisplay();

}


/* =====================================================
   DISTANCE
===================================================== */

function getDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R = 6371000;

    const rad =
        Math.PI / 180;

    const dLat =
        (lat2 - lat1) * rad;

    const dLon =
        (lon2 - lon1) * rad;


    const a =
        Math.sin(dLat / 2) **
        2

        +

        Math.cos(
            lat1 * rad
        )
        *
        Math.cos(
            lat2 * rad
        )
        *
        Math.sin(
            dLon / 2
        ) ** 2;


    return (
        2 *
        R *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        )
    );

}


/* =====================================================
   DISPLAY
===================================================== */

function updateDisplay() {

    const from =
        currentRoute[
            currentIndex
        ];

    const to =
        currentRoute[
            currentIndex + 1
        ];


    document
        .getElementById(
            "fromStation"
        )
        .textContent =
        from || "";


    document
        .getElementById(
            "toStation"
        )
        .textContent =
        to || "";


    /*
    次の4駅
    */

    const route =
        document
            .getElementById(
                "stationRoute"
            );


    route.innerHTML = "";


    const end =
        Math.min(
            currentIndex + 4,
            currentRoute.length
        );


    for (
        let i = currentIndex;
        i < end;
        i++
    ) {

        const station =
            document.createElement(
                "div"
            );

        station.className =
            "route-station";

        station.textContent =
            currentRoute[i];


        route.appendChild(
            station
        );


        if (
            i < end - 1
        ) {

            const arrow =
                document.createElement(
                    "div"
                );

            arrow.className =
                "route-arrow";

            arrow.textContent =
                "＞";


            route.appendChild(
                arrow
            );

        }

    }


    /*
    バーをリセット
    */

    document
        .getElementById(
            "progressFill"
        )
        .style.width =
        "0%";


    if (!to) {

        showArrival();

    }

}


/* =====================================================
   GPS START
===================================================== */

function startGPS() {

    if (testMode) {

        return;

    }


    if (
        !navigator.geolocation
    ) {

        setStatus(
            "GPSを利用できません"
        );

        return;

    }


    if (
        watchId !== null
    ) {

        return;

    }


    setStatus(
        "GPS取得中..."
    );


    watchId =
        navigator.geolocation.watchPosition(

            updateGPS,

            gpsError,

            {

                enableHighAccuracy:
                    true,

                maximumAge:
                    1000,

                timeout:
                    15000

            }

        );

}


/* =====================================================
   GPS UPDATE
===================================================== */

function updateGPS(position) {

    if (testMode) {

        return;

    }


    const lat =
        position.coords.latitude;

    const lon =
        position.coords.longitude;


    /*
    速度
    */

    let speed =
        position.coords.speed;


    if (
        speed === null ||
        speed === undefined ||
        isNaN(speed) ||
        speed < 0
    ) {

        speed = 0;

    } else {

        speed *= 3.6;

    }


    if (speed > 250) {

        speed = 0;

    }


    speedHistory.push(speed);


    if (
        speedHistory.length > 5
    ) {

        speedHistory.shift();

    }


    const averageSpeed =
        speedHistory.reduce(
            (a,b) => a + b,
            0
        )
        /
        speedHistory.length;


    document
        .getElementById(
            "speed"
        )
        .textContent =
        Math.round(
            averageSpeed
        );


    /*
    終点
    */

    if (
        currentIndex >=
        currentRoute.length - 1
    ) {

        showArrival();

        return;

    }


    const from =
        currentRoute[
            currentIndex
        ];

    const to =
        currentRoute[
            currentIndex + 1
        ];


    const fromCoord =
        stationCoords[from];

    const toCoord =
        stationCoords[to];


    if (
        !fromCoord ||
        !toCoord
    ) {

        setStatus(
            "駅座標がありません: " +
            to
        );

        return;

    }


    /*
    駅間距離
    */

    const total =
        getDistance(
            fromCoord[0],
            fromCoord[1],
            toCoord[0],
            toCoord[1]
        );


    const remaining =
        getDistance(
            lat,
            lon,
            toCoord[0],
            toCoord[1]
        );


    /*
    バー
    */

    let progress =
        1 -
        (
            remaining /
            total
        );


    progress =
        Math.max(
            0,
            Math.min(
                1,
                progress
            )
        );


    document
        .getElementById(
            "progressFill"
        )
        .style.width =
        (
            progress * 100
        ) +
        "%";


    /*
    距離
    */

    if (
        remaining < 100
    ) {

        document
            .getElementById(
                "distance"
            )
            .textContent =
            to +
            " まもなく";

    } else {

        document
            .getElementById(
                "distance"
            )
            .textContent =
            to +
            "まであと " +
            (
                remaining / 1000
            ).toFixed(1) +
            " km";

    }


    /*
    ==================================================
    駅切り替え
    ==================================================

    250m以内
    ＋
    速度30km/h以下

    になってから切り替える。

    GPS誤差で一度進んだ駅へ
    戻ることはない。
    */

    const near =
        remaining <= 250;

    const stopped =
        averageSpeed <= 30;


    if (
        near &&
        stopped
    ) {

        currentIndex++;

        updateDisplay();

    }


    setStatus(
        "GPS接続中"
    );

}


/* =====================================================
   ARRIVAL
===================================================== */

function showArrival() {

    document
        .getElementById(
            "speed"
        )
        .textContent =
        "0";


    document
        .getElementById(
            "fromStation"
        )
        .textContent =
        currentRoute[
            currentRoute.length - 1
        ];


    document
        .getElementById(
            "toStation"
        )
        .textContent =
        "";


    document
        .getElementById(
            "progressFill"
        )
        .style.width =
        "100%";


    document
        .getElementById(
            "distance"
        )
        .textContent =
        "到着";


    setStatus(
        "終点に到着しました"
    );

}


/* =====================================================
   GPS ERROR
===================================================== */

function gpsError(error) {

    let message =
        "GPSを取得できません";


    if (
        error.code === 1
    ) {

        message =
            "位置情報の使用を許可してください";

    }


    if (
        error.code === 2
    ) {

        message =
            "現在地を取得できません";

    }


    if (
        error.code === 3
    ) {

        message =
            "GPS取得がタイムアウトしました";

    }


    setStatus(message);

}


/* =====================================================
   STATUS
===================================================== */

function setStatus(text) {

    document
        .getElementById(
            "gpsStatus"
        )
        .textContent =
        text;

}


/* =====================================================
   TEST MODE
===================================================== */


/*
3連続タッチ
*/

document.addEventListener(
    "touchend",
    handleTripleTap,
    {
        passive: true
    }
);


document.addEventListener(
    "click",
    handleTripleTap,
    {
        passive: true
    }
);


function handleTripleTap() {

    const now =
        Date.now();


    tapTimes.push(now);


    /*
    700ms以内のタッチだけ残す
    */

    tapTimes =
        tapTimes.filter(
            time =>
                now - time <= 700
        );


    if (
        tapTimes.length >= 3
    ) {

        tapTimes = [];

        toggleTestMode();

    }

}


/* =====================================================
   TEST MODE ON / OFF
===================================================== */

function toggleTestMode() {

    /*
    メイン画面が出ていない場合
    */

    if (
        document
            .getElementById(
                "main"
            )
            .style
            .display !== "block"
    ) {

        return;

    }


    testMode =
        !testMode;


    const panel =
        document
            .getElementById(
                "testPanel"
            );


    const badge =
        document
            .getElementById(
                "testBadge"
            );


    if (testMode) {

        /*
        GPS停止
        */

        if (
            watchId !== null
        ) {

            navigator.geolocation
                .clearWatch(
                    watchId
                );

            watchId = null;

        }


        panel.style.display =
            "block";

        badge.style.display =
            "block";


        setStatus(
            "テストモード"
        );


        updateTestPanel();


    } else {

        panel.style.display =
            "none";

        badge.style.display =
            "none";


        setStatus(
            "GPSを待っています"
        );

    }

}


/* =====================================================
   TEST NEXT
===================================================== */

function testNext() {

    if (!testMode) {
        return;
    }


    if (
        currentIndex <
        currentRoute.length - 1
    ) {

        currentIndex++;

        updateDisplay();

        updateTestPanel();

    }

}


/* =====================================================
   TEST PREVIOUS
===================================================== */

function testPrevious() {

    if (!testMode) {
        return;
    }


    if (
        currentIndex > 0
    ) {

        currentIndex--;

        updateDisplay();

        updateTestPanel();

    }

}


/* =====================================================
   TEST PANEL
===================================================== */

function updateTestPanel() {

    const current =
        currentRoute[
            currentIndex
        ];


    const next =
        currentRoute[
            currentIndex + 1
        ];


    document
        .getElementById(
            "testCurrent"
        )
        .textContent =
        next
            ? current +
              " → " +
              next
            : current +
              "（終点）";


    /*
    テスト時もバーを動かす
    */

    if (next) {

        document
            .getElementById(
                "progressFill"
            )
            .style.width =
            "50%";


        document
            .getElementById(
                "distance"
            )
            .textContent =
            "テストモード";

    } else {

        document
            .getElementById(
                "progressFill"
            )
            .style.width =
            "100%";

        document
            .getElementById(
                "distance"
            )
            .textContent =
            "到着";

    }

}

===================================================== */

        /*
        GPSは
        「GPSを開始」を押したときに開始。

    }
);
