<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no,
             viewport-fit=cover"
>

<meta name="theme-color" content="#050608">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>列車情報</title>

<style>

/* =====================================================
   基本
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background:
        radial-gradient(
            circle at 10% -10%,
            rgba(255,255,255,.14),
            transparent 32%
        ),
        radial-gradient(
            circle at 100% 10%,
            rgba(110,140,255,.09),
            transparent 35%
        ),
        #050608;

    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;
}

body {
    overflow-x: hidden;
    overflow-y: auto;
}


/* =====================================================
   リキッドグラス
===================================================== */

.glass {

    position: relative;

    overflow: hidden;

    border:
        1px solid
        rgba(255,255,255,.13);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.12),
            rgba(255,255,255,.055) 45%,
            rgba(255,255,255,.025)
        );

    backdrop-filter:
        blur(34px)
        saturate(180%);

    -webkit-backdrop-filter:
        blur(34px)
        saturate(180%);

    box-shadow:

        inset 0 1px 0
        rgba(255,255,255,.17),

        inset 0 -1px 0
        rgba(255,255,255,.025),

        0 18px 45px
        rgba(0,0,0,.25);
}

.glass::before {

    content: "";

    position: absolute;

    left: -60%;
    top: -100%;

    width: 190%;
    height: 180%;

    background:
        linear-gradient(
            115deg,
            transparent 44%,
            rgba(255,255,255,.035) 50%,
            transparent 56%
        );

    transform: rotate(-5deg);

    pointer-events: none;
}


/* =====================================================
   共通
===================================================== */

.hidden {
    display: none !important;
}


/* =====================================================
   選択画面
===================================================== */

.setup {

    width: 100%;

    min-height: 100dvh;

    padding:
        20px;

    display: flex;

    justify-content: center;
    align-items: center;
}

.setup-card {

    width: 100%;
    max-width: 430px;

    padding: 28px 22px;

    border-radius: 30px;
}

.setup-small {

    position: relative;
    z-index: 2;

    font-size: 12px;

    letter-spacing: 1.5px;

    color:
        rgba(255,255,255,.40);

    margin-bottom: 4px;
}

.setup-title {

    position: relative;
    z-index: 2;

    font-size: 34px;

    font-weight: 780;

    letter-spacing: -1.5px;

    margin-bottom: 25px;
}

.setup-label {

    position: relative;
    z-index: 2;

    font-size: 13px;

    color:
        rgba(255,255,255,.45);

    margin-bottom: 8px;
}

.select-box,
.number-input {

    position: relative;
    z-index: 2;

    width: 100%;

    padding: 16px;

    border-radius: 18px;

    border:
        1px solid
        rgba(255,255,255,.15);

    outline: none;

    background:
        rgba(255,255,255,.07);

    color: white;

    font-size: 18px;

    font-weight: 650;

    appearance: none;
}

.number-input {

    margin-top: 10px;

    font-size: 25px;

    text-align: center;
}

.number-input::placeholder {

    color:
        rgba(255,255,255,.32);
}

.start-button {

    position: relative;
    z-index: 2;

    width: 100%;

    margin-top: 15px;

    padding: 16px;

    border: none;

    border-radius: 18px;

    background:
        rgba(255,255,255,.88);

    color: #111;

    font-size: 16px;

    font-weight: 750;
}

.start-button:active {

    transform:
        scale(.975);

    opacity: .8;
}

.setup-error {

    position: relative;
    z-index: 2;

    min-height: 20px;

    margin-top: 12px;

    text-align: center;

    font-size: 12px;

    color:
        rgba(255,120,120,.9);
}


/* =====================================================
   メイン
===================================================== */

.app {

    width: 100%;

    max-width: 650px;

    min-height: 100dvh;

    margin: 0 auto;

    padding:
        calc(
            8px +
            env(safe-area-inset-top)
        )
        8px
        calc(
            25px +
            env(safe-area-inset-bottom)
        )
        8px;
}


/* =====================================================
   ヘッダー
===================================================== */

.header {

    position: relative;

    padding: 17px;

    border-radius: 25px;

    margin-bottom: 9px;
}

.train-type {

    position: relative;
    z-index: 2;

    font-size: 13px;

    color:
        rgba(255,255,255,.45);

    margin-bottom: 3px;
}

.destination {

    position: relative;
    z-index: 2;

    font-size: 29px;

    font-weight: 780;

    letter-spacing: -1px;
}

.train-number {

    position: absolute;

    right: 16px;
    top: 17px;

    z-index: 3;

    padding:
        6px 10px;

    border-radius: 12px;

    background:
        rgba(255,255,255,.075);

    border:
        1px solid
        rgba(255,255,255,.12);

    font-size: 12px;

    font-weight: 700;

    color:
        rgba(255,255,255,.72);
}


/* =====================================================
   次の4駅
===================================================== */

.next-stations {

    padding:
        15px 14px 17px;

    border-radius: 25px;

    margin-bottom: 9px;
}

.next-label {

    position: relative;
    z-index: 2;

    font-size: 11px;

    color:
        rgba(255,255,255,.38);

    margin-bottom: 11px;
}

.station-board {

    position: relative;
    z-index: 2;

    display: flex;

    align-items: flex-start;

    justify-content: flex-start;

    width: 100%;

    overflow: hidden;
}

.board-station {

    flex:
        0 0 auto;

    width: 48px;
}

.board-name {

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: flex-start;

    min-height: 48px;

    font-size: 18px;

    line-height: 1.15;

    font-weight: 760;

    letter-spacing: 1px;

    color:
        rgba(255,255,255,.78);
}

.board-name span {

    display: block;

    height: 21px;
}

.board-arrow {

    flex:
        0 0 22px;

    text-align: center;

    font-size: 18px;

    line-height: 42px;

    color:
        rgba(255,255,255,.27);
}


/* =====================================================
   速度
===================================================== */

.speed-box {

    padding:
        15px 17px 17px;

    border-radius: 25px;

    margin-bottom: 9px;
}

.speed-label {

    position: relative;
    z-index: 2;

    font-size: 12px;

    color:
        rgba(255,255,255,.40);

    margin-bottom: 4px;
}

.speed-row {

    position: relative;
    z-index: 2;

    display: flex;

    align-items: baseline;
}

.speed {

    font-size: 78px;

    line-height: .88;

    font-weight: 760;

    letter-spacing: -5px;

    font-variant-numeric:
        tabular-nums;
}

.speed-unit {

    font-size: 18px;

    margin-left: 8px;

    color:
        rgba(255,255,255,.48);
}


/* =====================================================
   列車位置
===================================================== */

.position-section {

    padding:
        16px 17px 17px;

    border-radius: 25px;

    margin-bottom: 9px;
}

.position-title {

    position: relative;
    z-index: 2;

    font-size: 12px;

    color:
        rgba(255,255,255,.40);

    margin-bottom: 13px;
}

.station-row {

    position: relative;
    z-index: 2;

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    margin-bottom: 10px;
}

.station {

    font-size: 21px;

    font-weight: 750;

    white-space: nowrap;
}

.station.to {
    text-align: right;
}


/* =====================================================
   進行バー
===================================================== */

.progress-wrapper {

    position: relative;

    width: 100%;

    height: 23px;
}

.progress-background {

    position: absolute;

    width: 100%;
    height: 23px;

    border-radius: 999px;

    background:
        rgba(255,255,255,.065);

    border:
        1px solid
        rgba(255,255,255,.08);

    overflow: hidden;
}

.progress-fill {

    position: absolute;

    left: 0;
    top: 0;

    width: 0%;

    height: 23px;

    border-radius: 999px;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.35),
            rgba(255,255,255,.72),
            rgba(255,255,255,1)
        );

    box-shadow:
        0 0 18px
        rgba(255,255,255,.25);

    transition:
        width .55s linear;
}

.distance-text {

    position: relative;
    z-index: 2;

    margin-top: 9px;

    text-align: right;

    font-size: 14px;

    color:
        rgba(255,255,255,.60);

    font-variant-numeric:
        tabular-nums;
}


/* =====================================================
   GPS
===================================================== */

.gps-area {

    padding-top: 2px;
}

.gps-status {

    font-size: 11px;

    color:
        rgba(255,255,255,.32);

    text-align: center;

    margin-bottom: 8px;
}

.gps-button {

    width: 100%;

    padding: 14px;

    border:
        1px solid
        rgba(255,255,255,.22);

    border-radius: 18px;

    background:
        rgba(255,255,255,.72);

    color: #111;

    font-size: 15px;

    font-weight: 700;
}

.gps-button:active {

    transform:
        scale(.975);

    opacity: .8;
}


/* =====================================================
   小さい画面
===================================================== */

@media (max-width: 380px) {

    .destination {
        font-size: 26px;
    }

    .board-station {
        width: 43px;
    }

    .board-arrow {
        flex-basis: 18px;
    }

    .board-name {
        font-size: 16px;
    }

    .speed {
        font-size: 68px;
    }

    .station {
        font-size: 19px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     列車選択
===================================================== -->

<div
    id="setupScreen"
    class="setup"
>

    <div class="setup-card glass">

        <div class="setup-small">
            TRAIN INFORMATION
        </div>

        <div class="setup-title">
            列車を選択
        </div>


        <div class="setup-label">
            列車種別
        </div>

        <select
            id="trainType"
            class="select-box"
            onchange="updateNumberOptions()"
        >

            <option value="sonic">
                特急ソニック
            </option>

            <option value="yufuin">
                特急ゆふいんの森
            </option>

        </select>


        <div
            class="setup-label"
            style="margin-top:16px;"
        >
            号数
        </div>

        <input
            id="trainNumberInput"
            class="number-input"
            type="number"
            inputmode="numeric"
            placeholder="入力"
        >


        <button
            class="start-button"
            onclick="startTrain()"
        >
            運転情報を表示
        </button>


        <div
            id="setupError"
            class="setup-error"
        ></div>

    </div>

</div>



<!-- =====================================================
     メイン
===================================================== -->

<div
    id="mainScreen"
    class="app"
    style="display:none;"
>


    <div class="header glass">

        <div
            id="trainTypeText"
            class="train-type"
        >
            特急ソニック
        </div>

        <div
            id="destination"
            class="destination"
        >
            博多行き
        </div>

        <div
            id="trainNumber"
            class="train-number"
        >
            10号
        </div>

    </div>


    <div class="next-stations glass">

        <div class="next-label">
            次の停車駅
        </div>

        <div
            id="stationBoard"
            class="station-board"
        ></div>

    </div>


    <div class="speed-box glass">

        <div class="speed-label">
            速度
        </div>

        <div class="speed-row">

            <span
                id="speed"
                class="speed"
            >
                --
            </span>

            <span class="speed-unit">
                km/h
            </span>

        </div>

    </div>


    <div class="position-section glass">

        <div class="position-title">
            列車位置
        </div>

        <div class="station-row">

            <div
                id="fromStation"
                class="station"
            >
                GPS待機中
            </div>

            <div
                id="toStation"
                class="station to"
            >
                --
            </div>

        </div>

        <div class="progress-wrapper">

            <div class="progress-background">

                <div
                    id="progressFill"
                    class="progress-fill"
                ></div>

            </div>

        </div>

        <div
            id="distanceText"
            class="distance-text"
        >
            現在地を確認しています
        </div>

    </div>


    <div class="gps-area">

        <div
            id="gpsStatus"
            class="gps-status"
        >
            GPSを待っています
        </div>

        <button
            class="gps-button"
            onclick="startGPS()"
        >
            GPSを開始
        </button>

    </div>

</div>



<script>

/* =====================================================
   駅座標
===================================================== */

const baseStations = {

    /* ---------- ソニック ---------- */

    "大分": {
        lat: 33.2323,
        lon: 131.6066
    },

    "別府": {
        lat: 33.2797,
        lon: 131.5004
    },

    "杵築": {
        lat: 33.4184,
        lon: 131.6171
    },

    "宇佐": {
        lat: 33.5312,
        lon: 131.3485
    },

    "柳ケ浦": {
        lat: 33.5650,
        lon: 131.3626
    },

    "中津": {
        lat: 33.5991,
        lon: 131.1909
    },

    "宇島": {
        lat: 33.6120,
        lon: 131.1300
    },

    "行橋": {
        lat: 33.7308,
        lon: 130.9588
    },

    "下曽根": {
        lat: 33.8328,
        lon: 130.8738
    },

    "小倉": {
        lat: 33.8869,
        lon: 130.8827
    },

    "戸畑": {
        lat: 33.8972,
        lon: 130.8195
    },

    "黒崎": {
        lat: 33.8660,
        lon: 130.7665
    },

    "折尾": {
        lat: 33.8650,
        lon: 130.7130
    },

    "赤間": {
        lat: 33.8067,
        lon: 130.5714
    },

    "福間": {
        lat: 33.7654,
        lon: 130.4831
    },

    "吉塚": {
        lat: 33.6075,
        lon: 130.4205
    },

    "博多": {
        lat: 33.5904,
        lon: 130.4207
    },


    /* ---------- ゆふいんの森 ---------- */

    "鳥栖": {
        lat: 33.3745,
        lon: 130.5186
    },

    "久留米": {
        lat: 33.3190,
        lon: 130.5155
    },

    "日田": {
        lat: 33.3217,
        lon: 130.9405
    },

    "天ケ瀬": {
        lat: 33.2573,
        lon: 131.0273
    },

    "豊後森": {
        lat: 33.2792,
        lon: 131.1530
    },

    "由布院": {
        lat: 33.2649,
        lon: 131.3553
    }

};


/* =====================================================
   ソニック
===================================================== */

const sonicRoutes = {

    4: [
        "大分",
        "別府",
        "杵築",
        "宇佐",
        "柳ケ浦",
        "中津",
        "宇島",
        "行橋",
        "下曽根",
        "小倉",
        "戸畑",
        "黒崎",
        "折尾",
        "赤間",
        "福間",
        "吉塚",
        "博多"
    ],

    10: [
        "大分",
        "別府",
        "杵築",
        "宇佐",
        "柳ケ浦",
        "中津",
        "宇島",
        "行橋",
        "小倉",
        "黒崎",
        "折尾",
        "博多"
    ],

    41: [
        "博多",
        "折尾",
        "黒崎",
        "小倉",
        "行橋",
        "中津",
        "別府",
        "大分"
    ]

};


/* =====================================================
   ゆふいんの森

   JR九州 2026/3/14改正
===================================================== */

const yufuinRoutes = {

    /* 博多 → 由布院 */

    1: [
        "博多",
        "鳥栖",
        "久留米",
        "日田",
        "天ケ瀬",
        "豊後森",
        "由布院"
    ],


    /* 由布院 → 博多 */

    2: [
        "由布院",
        "豊後森",
        "天ケ瀬",
        "日田",
        "久留米",
        "鳥栖",
        "博多"
    ],


    /* 博多 → 別府 */

    3: [
        "博多",
        "鳥栖",
        "久留米",
        "日田",
        "天ケ瀬",
        "豊後森",
        "由布院",
        "大分",
        "別府"
    ],


    /* 別府 → 博多 */

    4: [
        "別府",
        "大分",
        "由布院",
        "豊後森",
        "天ケ瀬",
        "日田",
        "久留米",
        "鳥栖",
        "博多"
    ],


    /* 博多 → 由布院 */

    5: [
        "博多",
        "鳥栖",
        "久留米",
        "日田",
        "天ケ瀬",
        "豊後森",
        "由布院"
    ],


    /* 由布院 → 博多 */

    6: [
        "由布院",
        "豊後森",
        "天ケ瀬",
        "日田",
        "久留米",
        "鳥栖",
        "博多"
    ]

};


/* =====================================================
   状態
===================================================== */

let stations = [];

let currentSegment = 0;

let initialized = false;

let watchId = null;


/* =====================================================
   号数入力
===================================================== */

function startTrain() {

    const type =
        document.getElementById(
            "trainType"
        ).value;

    const number =
        Number(
            document.getElementById(
                "trainNumberInput"
            ).value
        );


    let route = null;


    if (type === "sonic") {

        route =
            sonicRoutes[number];

    } else {

        route =
            yufuinRoutes[number];

    }


    if (!route) {

        document.getElementById(
            "setupError"
        ).textContent =
            type === "sonic"
            ? "ソニックは4・10・41号に対応しています"
            : "ゆふいんの森は1〜6号に対応しています";

        return;

    }


    /*
       駅データ作成
    */

    stations =
        route.map(
            name => ({

                name: name,

                lat:
                    baseStations[name].lat,

                lon:
                    baseStations[name].lon

            })
        );


    const destination =
        stations[
            stations.length - 1
        ].name;


    /*
       ヘッダー
    */

    document.getElementById(
        "trainTypeText"
    ).textContent =
        type === "sonic"
        ? "特急ソニック"
        : "特急ゆふいんの森";


    document.getElementById(
        "destination"
    ).textContent =
        destination + "行き";


    document.getElementById(
        "trainNumber"
    ).textContent =
        number + "号";


    /*
       画面切り替え
    */

    document.getElementById(
        "setupScreen"
    ).style.display =
        "none";


    document.getElementById(
        "mainScreen"
    ).style.display =
        "block";


    currentSegment = 0;

    initialized = false;


    updateNextStations();

    startGPS();

}


/* =====================================================
   次の4駅
===================================================== */

function updateNextStations() {

    const board =
        document.getElementById(
            "stationBoard"
        );


    board.innerHTML = "";


    /*
       現在区間の次駅から
       最大4駅
    */

    const startIndex =
        currentSegment + 1;


    const endIndex =
        Math.min(
            startIndex + 4,
            stations.length
        );


    const count =
        endIndex -
        startIndex;


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const station =
            stations[
                startIndex + i
            ];


        const stationElement =
            document.createElement(
                "div"
            );

        stationElement.className =
            "board-station";


        const name =
            document.createElement(
                "div"
            );

        name.className =
            "board-name";


        [
            ...station.name
        ].forEach(
            char => {

                const span =
                    document.createElement(
                        "span"
                    );

                span.textContent =
                    char;

                name.appendChild(
                    span
                );

            }
        );


        stationElement.appendChild(
            name
        );

        board.appendChild(
            stationElement
        );


        /*
           最後だけ「＞」なし
        */

        if (
            i <
            count - 1
        ) {

            const arrow =
                document.createElement(
                    "div"
                );

            arrow.className =
                "board-arrow";

            arrow.textContent =
                "＞";

            board.appendChild(
                arrow
            );

        }

    }

}


/* =====================================================
   距離計算
===================================================== */

function getDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R =
        6371000;

    const rad =
        Math.PI / 180;

    const dLat =
        (lat2 - lat1) * rad;

    const dLon =
        (lon2 - lon1) * rad;


    const a =

        Math.sin(
            dLat / 2
        ) ** 2

        +

        Math.cos(
            lat1 * rad
        )

        *

        Math.cos(
            lat2 * rad
        )

        *

        Math.sin(
            dLon / 2
        ) ** 2;


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );


    return R * c;

}


/* =====================================================
   初回区間判定
===================================================== */

function findInitialSegment(
    lat,
    lon
) {

    let bestIndex = 0;

    let bestDistance =
        Infinity;


    for (
        let i = 0;
        i < stations.length - 1;
        i++
    ) {

        const midLat =
            (
                stations[i].lat +
                stations[i + 1].lat
            ) / 2;


        const midLon =
            (
                stations[i].lon +
                stations[i + 1].lon
            ) / 2;


        const d =
            getDistance(
                lat,
                lon,
                midLat,
                midLon
            );


        if (
            d < bestDistance
        ) {

            bestDistance = d;

            bestIndex = i;

        }

    }


    return bestIndex;

}


/* =====================================================
   GPS開始
===================================================== */

function startGPS() {

    if (
        !navigator.geolocation
    ) {

        setStatus(
            "この端末ではGPSを利用できません"
        );

        return;

    }


    if (
        watchId !== null
    ) {

        return;

    }


    setStatus(
        "GPS取得中..."
    );


    watchId =
        navigator.geolocation.watchPosition(

            updateGPS,

            gpsError,

            {

                enableHighAccuracy:
                    true,

                maximumAge:
                    500,

                timeout:
                    10000

            }

        );

}


/* =====================================================
   GPS更新
===================================================== */

function updateGPS(
    position
) {

    const lat =
        position.coords.latitude;

    const lon =
        position.coords.longitude;


    /*
       GPS速度
    */

    let speed =
        position.coords.speed;


    if (
        speed !== null &&
        speed !== undefined &&
        !isNaN(speed)
    ) {

        speed =
            Math.max(
                0,
                speed * 3.6
            );

    } else {

        speed = 0;

    }


    document.getElementById(
        "speed"
    ).textContent =
        Math.round(speed);


    /*
       初回
    */

    if (!initialized) {

        currentSegment =
            findInitialSegment(
                lat,
                lon
            );

        initialized = true;

        updateNextStations();

    }


    /*
       終点
    */

    if (
        currentSegment >=
        stations.length - 1
    ) {

        showArrival();

        return;

    }


    const next =
        stations[
            currentSegment + 1
        ];


    const remaining =
        getDistance(
            lat,
            lon,
            next.lat,
            next.lon
        );


    /*
       駅切り替え

       80m以内
       または
       500m以内＋25km/h以下

       → 減速してから切り替え
    */

    if (

        remaining <= 80

        ||

        (
            remaining <= 500 &&
            speed <= 25
        )

    ) {

        currentSegment++;


        if (
            currentSegment >=
            stations.length - 1
        ) {

            showArrival();

            return;

        }


        updateNextStations();

    }


    updateDisplay(
        lat,
        lon
    );

}


/* =====================================================
   表示更新
===================================================== */

function updateDisplay(
    lat,
    lon
) {

    if (
        currentSegment >=
        stations.length - 1
    ) {

        showArrival();

        return;

    }


    const from =
        stations[
            currentSegment
        ];

    const to =
        stations[
            currentSegment + 1
        ];


    const total =
        getDistance(
            from.lat,
            from.lon,
            to.lat,
            to.lon
        );


    const remaining =
        getDistance(
            lat,
            lon,
            to.lat,
            to.lon
        );


    let progress =
        1 -
        (
            remaining /
            total
        );


    progress =
        Math.max(
            0,
            Math.min(
                1,
                progress
            )
        );


    /*
       区間
    */

    document.getElementById(
        "fromStation"
    ).textContent =
        from.name;


    document.getElementById(
        "toStation"
    ).textContent =
        to.name;


    /*
       バー
    */

    document.getElementById(
        "progressFill"
    ).style.width =
        (
            progress * 100
        ) + "%";


    /*
       距離
    */

    const km =
        remaining / 1000;


    if (
        km < 0.1
    ) {

        document.getElementById(
            "distanceText"
        ).textContent =
            to.name +
            " まもなく";

    } else {

        document.getElementById(
            "distanceText"
        ).textContent =
            to.name +
            "まであと " +
            km.toFixed(1) +
            " km";

    }


    setStatus(
        "● GPS接続中"
    );

}


/* =====================================================
   到着
===================================================== */

function showArrival() {

    const finalStation =
        stations[
            stations.length - 1
        ];


    document.getElementById(
        "speed"
    ).textContent =
        "0";


    document.getElementById(
        "fromStation"
    ).textContent =
        finalStation.name;


    document.getElementById(
        "toStation"
    ).textContent =
        "";


    document.getElementById(
        "progressFill"
    ).style.width =
        "100%";


    document.getElementById(
        "distanceText"
    ).textContent =
        finalStation.name +
        " 到着";


    /*
       次駅表示を終点だけにする
    */

    const board =
        document.getElementById(
            "stationBoard"
        );


    board.innerHTML = "";


    const station =
        document.createElement(
            "div"
        );

    station.className =
        "board-station";


    const name =
        document.createElement(
            "div"
        );

    name.className =
        "board-name";


    [
        ...finalStation.name
    ].forEach(
        char => {

            const span =
                document.createElement(
                    "span"
                );

            span.textContent =
                char;

            name.appendChild(
                span
            );

        }
    );


    station.appendChild(
        name
    );

    board.appendChild(
        station
    );


    setStatus(
        finalStation.name +
        "に到着しました"
    );

}


/* =====================================================
   GPSエラー
===================================================== */

function gpsError(
    error
) {

    let message =
        "GPSを取得できません";


    switch (
        error.code
    ) {

        case 1:

            message =
                "位置情報の使用を許可してください";

            break;


        case 2:

            message =
                "現在地を取得できません";

            break;


        case 3:

            message =
                "GPS取得がタイムアウトしました";

            break;

    }


    setStatus(
        message
    );

}


/* =====================================================
   ステータス
===================================================== */

function setStatus(
    text
) {

    document.getElementById(
        "gpsStatus"
    ).textContent =
        text;

}


/* =====================================================
   Enterキー
===================================================== */

document
    .getElementById(
        "trainNumberInput"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                startTrain();

            }

        }
    );


/* =====================================================
   列車種別変更時
===================================================== */

function updateNumberOptions() {

    document.getElementById(
        "trainNumberInput"
    ).value = "";

    document.getElementById(
        "setupError"
    ).textContent = "";

}
