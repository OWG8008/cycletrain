<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>鉄道運転モニター</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #08090d;
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Noto Sans JP",
        sans-serif;
}

body {
    overflow-x: hidden;
}

button {
    font: inherit;
}

.hidden {
    display: none !important;
}


/* =========================================
   設定画面
========================================= */

.setup {
    min-height: 100vh;
    max-width: 720px;
    margin: auto;
    padding: 24px 18px 30px;
}

.title {
    font-size: 31px;
    font-weight: 900;
    letter-spacing: -1.5px;
}

.subtitle {
    margin-top: 5px;
    margin-bottom: 24px;
    color: #858b97;
    font-size: 13px;
}

.card {
    background: #15171d;
    border: 1px solid #242730;
    border-radius: 23px;
    padding: 19px;
    margin-bottom: 14px;
}

.card-title {
    font-size: 17px;
    font-weight: 900;
    margin-bottom: 14px;
}


/* 列車 */

.train-grid {
    display: grid;
    gap: 10px;
}

.train-btn {
    width: 100%;
    border: 0;
    border-radius: 18px;
    padding: 17px;
    background: #23262f;
    color: white;
    text-align: left;
    transition: transform .15s ease,
                background .2s ease;
}

.train-btn:active,
.route-btn:active,
.choice-btn:active,
.start-btn:active {
    transform: scale(.97);
}

.train-btn.selected {
    background: #315fea;
}

.train-name {
    font-size: 19px;
    font-weight: 900;
}

.train-description {
    margin-top: 5px;
    font-size: 12px;
    color: #9298a4;
}

.train-btn.selected .train-description {
    color: #dfe6ff;
}


/* 路線 */

.route-grid {
    display: grid;
    gap: 10px;
}

.route-btn {
    width: 100%;
    border: 0;
    border-radius: 17px;
    padding: 16px;
    background: #23262f;
    color: white;
    text-align: left;
    transition: transform .15s ease,
                background .2s ease;
}

.route-btn.selected {
    background: #315fea;
}

.route-name {
    font-size: 18px;
    font-weight: 900;
}

.route-detail {
    margin-top: 4px;
    color: #8e95a2;
    font-size: 12px;
}

.route-btn.selected .route-detail {
    color: #dfe6ff;
}


/* 行き先 */

.question {
    margin-bottom: 13px;
    font-size: 18px;
    font-weight: 900;
}

.choice-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 9px;
}

.choice-btn {
    border: 0;
    border-radius: 15px;
    padding: 15px 8px;
    background: #252832;
    color: white;
    font-weight: 800;
    transition: transform .15s ease,
                background .2s ease;
}

.choice-btn.selected {
    background: #315fea;
}


/* 設定情報 */

.selected-info {
    color: #949aa7;
    font-size: 14px;
    line-height: 1.8;
}

.selected-info b {
    color: white;
}

.start-btn {
    width: 100%;
    border: 0;
    border-radius: 19px;
    padding: 18px;
    background: #28c76f;
    color: white;
    font-size: 18px;
    font-weight: 900;
}

.start-btn:disabled {
    background: #282c34;
    color: #626874;
}


/* =========================================
   運転画面
========================================= */

.drive {
    min-height: 100vh;
    max-width: 900px;
    margin: auto;
    padding: 14px;
}

.topbar {
    height: 43px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.service-name {
    font-size: 16px;
    font-weight: 900;
}

.service-destination {
    margin-top: 2px;
    color: #8d94a1;
    font-size: 11px;
}

.clock {
    color: #777e8b;
    font-size: 11px;
}


/* 行先 */

.destination-card {
    background: #15171d;
    border-radius: 23px;
    padding: 20px;
    margin-bottom: 13px;
}

.destination-title {
    font-size: 34px;
    font-weight: 900;
    letter-spacing: -1.5px;
}

.route-text {
    margin-top: 6px;
    color: #878e9b;
    font-size: 12px;
}


/* =========================================
   駅進行状況
========================================= */

.station-card {
    background: #15171d;
    border-radius: 23px;
    padding: 20px;
    margin-bottom: 13px;
}

.station-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
}

.station-top-title {
    font-size: 15px;
    font-weight: 900;
}

.station-count {
    color: #777e8b;
    font-size: 11px;
}


/*
    駅名
*/

.station-names {
    position: relative;
    height: 28px;
    overflow: hidden;
}

.station-name {
    position: absolute;
    top: 0;
    white-space: nowrap;
    color: #8c93a0;
    font-size: 12px;
    font-weight: 700;
    transform: translateX(-50%);
    transition:
        left .8s cubic-bezier(.22,.61,.36,1),
        color .3s ease,
        transform .8s cubic-bezier(.22,.61,.36,1);
}

.station-name.current {
    color: white;
    font-size: 13px;
}


/*
    Apple Music風
    横長・角丸・直方体
*/

.progress-wrap {
    position: relative;
    width: 100%;
    height: 22px;
    border-radius: 999px;
    background: #2b2e36;
    overflow: hidden;
}


/*
    進んだ部分
*/

.progress-fill {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: #ffffff;

    transition:
        width .9s cubic-bezier(.22,.61,.36,1);
}


/*
    現在位置の丸
*/

.progress-dot {
    position: absolute;
    top: 50%;
    left: 0%;

    width: 13px;
    height: 13px;

    border-radius: 50%;

    background: white;

    transform:
        translate(-50%, -50%);

    box-shadow:
        0 0 0 3px rgba(255,255,255,.10);

    transition:
        left .9s cubic-bezier(.22,.61,.36,1);
}


/*
    駅マーカー
*/

.station-markers {
    position: relative;
    height: 17px;
    margin-top: 4px;
}

.station-marker {
    position: absolute;
    top: 0;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: #676d79;

    transform: translateX(-50%);

    transition:
        background .3s ease,
        transform .3s ease;
}

.station-marker.current {
    background: white;
    transform:
        translateX(-50%)
        scale(1.5);
}


/* 駅間 */

.segment-info {
    display: flex;
    justify-content: space-between;
    margin-top: 5px;

    color: #666d79;
    font-size: 10px;
}


/* =========================================
   速度
========================================= */

.speed-card {
    background: #15171d;
    border-radius: 23px;
    padding: 20px;

    display: flex;
    flex-direction: column;
    align-items: center;
}


/*
    円形速度メーター
*/

.speed-circle {
    width: 190px;
    height: 190px;

    border-radius: 50%;

    border: 2px solid #30343d;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    position: relative;

    box-shadow:
        inset 0 0 30px rgba(255,255,255,.025);
}

.speed-number {
    font-size: 58px;
    line-height: .9;
    font-weight: 900;
    letter-spacing: -3px;
}

.speed-unit {
    margin-top: 9px;
    color: #858c98;
    font-size: 13px;
}

.speed-label {
    margin-top: 15px;
    color: #858c98;
    font-size: 11px;
}


/* =========================================
   ATS
========================================= */

.ats {
    position: fixed;

    left: 14px;
    right: 14px;
    bottom: 14px;

    z-index: 100;

    padding: 13px 16px;

    border-radius: 18px;

    background: rgba(24,27,34,.97);
    border: 1px solid #383d47;

    transform: translateY(140%);
    transition: transform .3s ease;
}

.ats.show {
    transform: translateY(0);
}

.ats-label {
    color: #ffd34d;
    font-size: 10px;
    font-weight: 900;
}

.ats-text {
    margin-top: 3px;
    font-size: 14px;
    font-weight: 900;
}


/* =========================================
   到着
========================================= */

.arrival {
    position: fixed;
    inset: 0;
    z-index: 200;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 25px;

    background: #08090d;
}

.arrival-box {
    width: 100%;
    max-width: 420px;
    text-align: center;
}

.arrival-small {
    color: #808793;
    font-size: 13px;
}

.arrival-title {
    margin: 10px 0;
    font-size: 44px;
    font-weight: 900;
}

.arrival-btn {
    width: 100%;
    margin-top: 22px;

    border: 0;
    border-radius: 18px;

    padding: 17px;

    background: #315fea;
    color: white;

    font-weight: 900;
}


/* =========================================
   PC
========================================= */

@media (min-width: 700px) {

    .train-grid {
        grid-template-columns: repeat(3, 1fr);
    }

    .choice-grid {
        grid-template-columns: repeat(4, 1fr);
    }

}
</style>
</head>


<body>


<!-- =========================================
     設定
========================================= -->

<section id="setup" class="setup">

    <div class="title">
        列車設定
    </div>

    <div class="subtitle">
        列車種別・路線・終着駅を設定
    </div>


    <!-- 列車種別 -->

    <div class="card">

        <div class="card-title">
            列車種別
        </div>

        <div class="train-grid">

            <button
                class="train-btn"
                data-train="普通"
                onclick="selectTrain('普通')">

                <div class="train-name">
                    普通
                </div>

                <div class="train-description">
                    路線・終着駅を指定
                </div>

            </button>


            <button
                class="train-btn"
                data-train="特急ソニック"
                onclick="selectTrain('特急ソニック')">

                <div class="train-name">
                    特急ソニック
                </div>

                <div class="train-description">
                    博多・大分・佐伯
                </div>

            </button>


            <button
                class="train-btn"
                data-train="特急ゆふいんの森"
                onclick="selectTrain('特急ゆふいんの森')">

                <div class="train-name">
                    特急ゆふいんの森
                </div>

                <div class="train-description">
                    博多・由布院・別府
                </div>

            </button>

        </div>

    </div>


    <!-- 路線選択 -->

    <div
        id="routeCard"
        class="card hidden">

        <div class="card-title">
            路線選択
        </div>

        <div class="route-grid">

            <button
                class="route-btn"
                data-route="日豊本線"
                onclick="selectRoute('日豊本線')">

                <div class="route-name">
                    日豊本線
                </div>

                <div class="route-detail">
                    中津 ～ 佐伯
                </div>

            </button>


            <button
                class="route-btn"
                data-route="久大本線"
                onclick="selectRoute('久大本線')">

                <div class="route-name">
                    久大本線
                </div>

                <div class="route-detail">
                    大分 ～ 日田
                </div>

            </button>


            <button
                class="route-btn"
                data-route="豊肥本線"
                onclick="selectRoute('豊肥本線')">

                <div class="route-name">
                    豊肥本線
                </div>

                <div class="route-detail">
                    大分 ～ 宮地
                </div>

            </button>

        </div>

    </div>


    <!-- 行き先 -->

    <div
        id="destinationCard"
        class="card hidden">

        <div
            id="destinationQuestion"
            class="question">
            終着駅を選択してください
        </div>

        <div
            id="destinationChoices"
            class="choice-grid">
        </div>

    </div>


    <!-- 設定確認 -->

    <div class="card">

        <div class="card-title">
            現在の設定
        </div>

        <div
            id="selectedInfo"
            class="selected-info">
            列車種別を選択してください
        </div>

    </div>


    <button
        id="startBtn"
        class="start-btn"
        disabled
        onclick="startDrive()">

        運転開始

    </button>

</section>



<!-- =========================================
     運転画面
========================================= -->

<section
    id="drive"
    class="drive hidden">


    <div class="topbar">

        <div>

            <div
                id="driveTrain"
                class="service-name">
                普通
            </div>

            <div
                id="driveDestinationSmall"
                class="service-destination">
                --
            </div>

        </div>


        <div
            id="clock"
            class="clock">
            00:00:00
        </div>

    </div>



    <!-- 行先 -->

    <div class="destination-card">

        <div
            id="driveDestination"
            class="destination-title">
            --
        </div>

        <div
            id="driveRoute"
            class="route-text">
            --
        </div>

    </div>



    <!-- =====================================
         駅進行状況
    ====================================== -->

    <div class="station-card">

        <div class="station-top">

            <div class="station-top-title">
                駅進行状況
            </div>

            <div
                id="stationCounter"
                class="station-count">
                0 / 0
            </div>

        </div>


        <div
            id="stationNames"
            class="station-names">
        </div>


        <div class="progress-wrap">

            <div
                id="progressFill"
                class="progress-fill">
            </div>

            <div
                id="progressDot"
                class="progress-dot">
            </div>

        </div>


        <div
            id="stationMarkers"
            class="station-markers">
        </div>


        <div class="segment-info">

            <span id="previousStation">
                --
            </span>

            <span id="nextStation">
                --
            </span>

        </div>

    </div>



    <!-- =====================================
         速度
    ====================================== -->

    <div class="speed-card">

        <div class="speed-circle">

            <div
                id="speed"
                class="speed-number">
                0
            </div>

            <div class="speed-unit">
                km/h
            </div>

        </div>

        <div class="speed-label">
            現在速度
        </div>

    </div>

</section>



<!-- =========================================
     ATS
========================================= -->

<div
    id="ats"
    class="ats">

    <div class="ats-label">
        ATS
    </div>

    <div
        id="atsText"
        class="ats-text">
        --
    </div>

</div>



<!-- =========================================
     到着
========================================= -->

<div
    id="arrival"
    class="arrival hidden">

    <div class="arrival-box">

        <div class="arrival-small">
            列車は終着駅に到着しました
        </div>

        <div
            id="arrivalStation"
            class="arrival-title">
            --
        </div>

        <div class="arrival-small">
            お疲れさまでした
        </div>

        <button
            class="arrival-btn"
            onclick="backToSetup()">
            設定画面へ
        </button>

    </div>

</div>



<script>

/* =========================================================
   駅データ
========================================================= */

const routes = {

    "日豊本線": [
        "中津",
        "東中津",
        "今津",
        "天津",
        "豊前善光寺",
        "柳ケ浦",
        "豊前長洲",
        "宇佐",
        "西屋敷",
        "立石",
        "中山香",
        "杵築",
        "大神",
        "日出",
        "暘谷",
        "豊後豊岡",
        "亀川",
        "別府大学",
        "別府",
        "東別府",
        "西大分",
        "大分",
        "牧",
        "高城",
        "鶴崎",
        "大在",
        "坂ノ市",
        "幸崎",
        "佐志生",
        "下ノ江",
        "熊崎",
        "臼杵",
        "上臼杵",
        "津久見",
        "日代",
        "浅海井",
        "狩生",
        "海崎",
        "佐伯"
    ],

    "久大本線": [
        "大分",
        "古国府",
        "南大分",
        "賀来",
        "豊後国分",
        "向之原",
        "鬼瀬",
        "小野屋",
        "天神山",
        "庄内",
        "湯平",
        "南由布",
        "由布院",
        "野矢",
        "豊後中村",
        "引治",
        "恵良",
        "豊後森",
        "北山田",
        "杉河内",
        "天ケ瀬",
        "豊後中川",
        "豊後三芳",
        "日田"
    ],

    "豊肥本線": [
        "大分",
        "滝尾",
        "敷戸",
        "大分大学前",
        "中判田",
        "竹中",
        "犬飼",
        "菅尾",
        "三重町",
        "豊後清川",
        "緒方",
        "朝地",
        "豊後竹田",
        "玉来",
        "豊後荻",
        "滝水",
        "波野",
        "宮地"
    ]
};


/* =========================================================
   特急
========================================================= */

const expressDestinations = {

    "特急ソニック": [
        "博多",
        "大分",
        "佐伯"
    ],

    "特急ゆふいんの森": [
        "博多",
        "由布院",
        "別府"
    ]

};


/* =========================================================
   状態
========================================================= */

let trainType = null;
let selectedRoute = null;
let destination = null;

let currentStations = [];
let currentStation = 0;

let speed = 0;
let targetSpeed = 0;

let driving = false;
let atsEnabled = true;

let stationProgress = 0;


/* =========================================================
   列車選択
========================================================= */

function selectTrain(type) {

    trainType = type;

    selectedRoute = null;
    destination = null;


    document
        .querySelectorAll(".train-btn")
        .forEach(btn => {

            btn.classList.toggle(
                "selected",
                btn.dataset.train === type
            );

        });


    document
        .getElementById("routeCard")
        .classList.add("hidden");

    document
        .getElementById("destinationCard")
        .classList.add("hidden");


    if (type === "普通") {

        document
            .getElementById("routeCard")
            .classList.remove("hidden");

    } else {

        showExpressDestinations();

    }


    updateSetupInfo();
}


/* =========================================================
   路線選択
========================================================= */

function selectRoute(route) {

    selectedRoute = route;
    destination = null;


    document
        .querySelectorAll(".route-btn")
        .forEach(btn => {

            btn.classList.toggle(
                "selected",
                btn.dataset.route === route
            );

        });


    showLocalDestinations();

    updateSetupInfo();
}


/* =========================================================
   普通列車の終着駅
========================================================= */

function showLocalDestinations() {

    const card =
        document.getElementById("destinationCard");

    const question =
        document.getElementById("destinationQuestion");

    const choices =
        document.getElementById("destinationChoices");


    card.classList.remove("hidden");

    question.textContent =
        "終着駅を選択してください";


    choices.innerHTML = "";


    routes[selectedRoute].forEach(
        station => {

            const button =
                document.createElement("button");

            button.className =
                "choice-btn";

            button.textContent =
                station;

            button.onclick = () =>
                selectDestination(station);

            choices.appendChild(button);

        }
    );
}


/* =========================================================
   特急の行き先
========================================================= */

function showExpressDestinations() {

    const card =
        document.getElementById("destinationCard");

    const question =
        document.getElementById("destinationQuestion");

    const choices =
        document.getElementById("destinationChoices");


    card.classList.remove("hidden");

    question.textContent =
        "どこ行きですか？";


    choices.innerHTML = "";


    expressDestinations[trainType]
        .forEach(station => {

            const button =
                document.createElement("button");

            button.className =
                "choice-btn";

            button.textContent =
                station;

            button.onclick = () =>
                selectDestination(station);

            choices.appendChild(button);

        });
}


/* =========================================================
   行き先選択
========================================================= */

function selectDestination(station) {

    destination = station;


    document
        .querySelectorAll(".choice-btn")
        .forEach(button => {

            button.classList.toggle(
                "selected",
                button.textContent === station
            );

        });


    updateSetupInfo();
}


/* =========================================================
   設定確認
========================================================= */

function updateSetupInfo() {

    const info =
        document.getElementById("selectedInfo");

    const start =
        document.getElementById("startBtn");


    if (!trainType) {

        info.innerHTML =
            "列車種別を選択してください";

        start.disabled = true;

        return;
    }


    if (trainType === "普通") {

        if (!selectedRoute) {

            info.innerHTML =
                "列車：<b>普通</b><br>" +
                "路線：未選択<br>" +
                "終着：未選択";

            start.disabled = true;

            return;
        }


        if (!destination) {

            info.innerHTML =
                "列車：<b>普通</b><br>" +
                "路線：<b>" +
                selectedRoute +
                "</b><br>" +
                "終着：未選択";

            start.disabled = true;

            return;
        }


        info.innerHTML =
            "列車：<b>普通</b><br>" +
            "路線：<b>" +
            selectedRoute +
            "</b><br>" +
            "終着：<b>" +
            destination +
            "</b>";

        start.disabled = false;

        return;
    }


    if (!destination) {

        info.innerHTML =
            "列車：<b>" +
            trainType +
            "</b><br>" +
            "行き先：未選択";

        start.disabled = true;

        return;
    }


    info.innerHTML =
        "列車：<b>" +
        trainType +
        "</b><br>" +
        "行き先：<b>" +
        destination +
        "</b>";

    start.disabled = false;
}


/* =========================================================
   普通列車ルート作成
========================================================= */

function createLocalRoute(
    routeName,
    destinationName
) {

    const route =
        routes[routeName];

    if (!route) return [];


    const destinationIndex =
        route.indexOf(destinationName);

    if (destinationIndex < 0) {
        return [];
    }


    return route.slice(
        0,
        destinationIndex + 1
    );
}


/* =========================================================
   特急ルート
========================================================= */

function createExpressRoute(
    type,
    destinationName
) {

    if (type === "特急ソニック") {

        if (destinationName === "博多") {

            return [
                "大分",
                "別府",
                "杵築",
                "中津",
                "行橋",
                "小倉",
                "黒崎",
                "折尾",
                "博多"
            ];
        }


        if (destinationName === "大分") {

            return [
                "博多",
                "折尾",
                "黒崎",
                "小倉",
                "行橋",
                "中津",
                "杵築",
                "別府",
                "大分"
            ];
        }


        if (destinationName === "佐伯") {

            return [
                "博多",
                "小倉",
                "行橋",
                "中津",
                "杵築",
                "別府",
                "大分",
                "臼杵",
                "津久見",
                "佐伯"
            ];
        }
    }


    if (type === "特急ゆふいんの森") {

        if (destinationName === "博多") {

            return [
                "由布院",
                "日田",
                "久留米",
                "鳥栖",
                "博多"
            ];
        }


        if (destinationName === "由布院") {

            return [
                "博多",
                "鳥栖",
                "久留米",
                "日田",
                "由布院"
            ];
        }


        if (destinationName === "別府") {

            return [
                "博多",
                "久留米",
                "日田",
                "由布院",
                "別府"
            ];
        }
    }


    return [];
}


/* =========================================================
   運転開始
========================================================= */

function startDrive() {

    if (!trainType || !destination) {
        return;
    }


    if (trainType === "普通") {

        currentStations =
            createLocalRoute(
                selectedRoute,
                destination
            );

    } else {

        currentStations =
            createExpressRoute(
                trainType,
                destination
            );
    }


    if (currentStations.length < 2) {

        alert(
            "運転ルートを作成できません。"
        );

        return;
    }


    currentStation = 0;

    stationProgress = 0;

    speed = 0;

    targetSpeed = 0;

    driving = true;


    document
        .getElementById("setup")
        .classList.add("hidden");

    document
        .getElementById("drive")
        .classList.remove("hidden");

    document
        .getElementById("arrival")
        .classList.add("hidden");


    document
        .getElementById("driveTrain")
        .textContent =
        trainType;


    document
        .getElementById("driveDestinationSmall")
        .textContent =
        destination + "行";


    document
        .getElementById("driveDestination")
        .textContent =
        destination + "行き";


    updateRouteText();

    createStationUI();

    updateStationUI();

    showATS(
        "運転を開始します"
    );
}


/* =========================================================
   路線表示
========================================================= */

function updateRouteText() {

    let text = "";


    if (trainType === "普通") {

        text =
            selectedRoute +
            "　" +
            currentStations[0] +
            " → " +
            destination;

    } else if (
        trainType === "特急ソニック"
    ) {

        text =
            "日豊本線　" +
            currentStations[0] +
            " → " +
            destination;

    } else {

        text =
            "久大本線　" +
            currentStations[0] +
            " → " +
            destination;
    }


    document
        .getElementById("driveRoute")
        .textContent =
        text;
}


/* =========================================================
   駅UI作成
========================================================= */

function createStationUI() {

    const names =
        document.getElementById(
            "stationNames"
        );

    const markers =
        document.getElementById(
            "stationMarkers"
        );


    names.innerHTML = "";

    markers.innerHTML = "";


    const count =
        currentStations.length;


    currentStations.forEach(
        (station, index) => {

            const position =
                count <= 1
                ? 0
                : index / (count - 1) * 100;


            /*
                駅名
            */

            const name =
                document.createElement("div");

            name.className =
                "station-name";

            name.textContent =
                station;

            name.style.left =
                position + "%";


            if (index === 0) {

                name.style.transform =
                    "translateX(0)";

            } else if (
                index === count - 1
            ) {

                name.style.transform =
                    "translateX(-100%)";

            }


            names.appendChild(name);


            /*
                駅マーカー
            */

            const marker =
                document.createElement("div");

            marker.className =
                "station-marker";

            marker.style.left =
                position + "%";


            markers.appendChild(marker);

        }
    );
}


/* =========================================================
   駅UI更新
========================================================= */

function updateStationUI() {

    const count =
        currentStations.length;


    /*
        全体に対する現在駅位置
    */

    const percentage =
        count <= 1
        ? 0
        : currentStation /
          (count - 1) *
          100;


    /*
        Apple Music風進行バー
    */

    document
        .getElementById("progressFill")
        .style.width =
        percentage + "%";


    /*
        現在位置の丸
    */

    document
        .getElementById("progressDot")
        .style.left =
        percentage + "%";


    /*
        駅マーカー
    */

    document
        .querySelectorAll(
            ".station-marker"
        )
        .forEach(
            (marker, index) => {

                marker.classList.toggle(
                    "current",
                    index === currentStation
                );

            }
        );


    /*
        駅名
    */

    document
        .querySelectorAll(
            ".station-name"
        )
        .forEach(
            (name, index) => {

                name.classList.toggle(
                    "current",
                    index === currentStation
                );

            }
        );


    /*
        駅数
    */

    document
        .getElementById("stationCounter")
        .textContent =
        `${currentStation + 1} / ${count}`;


    /*
        前駅・次駅
    */

    document
        .getElementById("previousStation")
        .textContent =
        currentStation > 0
        ? currentStations[
            currentStation - 1
          ]
        : "始発駅";


    document
        .getElementById("nextStation")
        .textContent =
        currentStation < count - 1
        ? currentStations[
            currentStation + 1
          ]
        : "終着駅";
}


/* =========================================================
   ATS
========================================================= */

function showATS(message) {

    if (!atsEnabled) {
        return;
    }


    const ats =
        document.getElementById("ats");


    document
        .getElementById("atsText")
        .textContent =
        message;


    ats.classList.add("show");


    clearTimeout(
        window.atsTimer
    );


    window.atsTimer =
        setTimeout(() => {

            ats.classList.remove(
                "show"
            );

        }, 4000);
}


/* =========================================================
   速度
========================================================= */

/*
    実際の速度を直接操作するボタンは置かない。

    シミュレーションとして、
    時間経過で速度が自然に変化する。
*/

function updateSpeed(delta) {

    if (!driving) {
        return;
    }


    /*
        駅間を走行している間は
        ゆっくり加速
    */

    if (
        currentStation <
        currentStations.length - 1
    ) {

        targetSpeed = 80;

    } else {

        targetSpeed = 0;

    }


    /*
        滑らかに目標速度へ近づく
    */

    const difference =
        targetSpeed - speed;


    speed +=
        difference *
        Math.min(
            delta * 1.4,
            1
        );


    /*
        終着駅付近で減速
    */

    if (
        currentStation >=
        currentStations.length - 2
    ) {

        targetSpeed = 0;

    }


    document
        .getElementById("speed")
        .textContent =
        Math.round(speed);
}


/* =========================================================
   駅間を滑らかに進める
========================================================= */

let stationProgressTimer = 0;


function updateStationProgress(delta) {

    if (!driving) {
        return;
    }


    /*
        速度に応じて駅間進行

        80km/hなら速く
        20km/hなら遅く
    */

    const movement =
        speed / 80 *
        delta *
        0.055;


    stationProgress += movement;


    /*
        駅に到着
    */

    if (stationProgress >= 1) {

        stationProgress = 0;

        currentStation++;


        if (
            currentStation >=
            currentStations.length - 1
        ) {

            currentStation =
                currentStations.length - 1;

            updateStationUI();

            arrive();

            return;
        }


        updateStationUI();


        showATS(
            currentStations[
                currentStation
            ] +
            " 到着"
        );
    }


    /*
        駅間の現在位置を
        Apple Music風バーに反映
    */

    const totalSegments =
        currentStations.length - 1;


    const overallProgress =
        (
            currentStation +
            stationProgress
        ) /
        totalSegments;


    const percentage =
        overallProgress * 100;


    document
        .getElementById("progressFill")
        .style.width =
        percentage + "%";


    document
        .getElementById("progressDot")
        .style.left =
        percentage + "%";
}


/* =========================================================
   到着
========================================================= */

function arrive() {

    driving = false;

    speed = 0;

    targetSpeed = 0;


    document
        .getElementById("speed")
        .textContent =
        "0";


    document
        .getElementById("arrivalStation")
        .textContent =
        destination;


    document
        .getElementById("arrival")
        .classList.remove(
            "hidden"
        );


    document
        .getElementById("ats")
        .classList.remove(
            "show"
        );
}


/* =========================================================
   設定画面へ
========================================================= */

function backToSetup() {

    driving = false;

    speed = 0;

    targetSpeed = 0;

    stationProgress = 0;


    document
        .getElementById("arrival")
        .classList.add(
            "hidden"
        );


    document
        .getElementById("drive")
        .classList.add(
            "hidden"
        );


    document
        .getElementById("setup")
        .classList.remove(
            "hidden"
        );


    document
        .getElementById("ats")
        .classList.remove(
            "show"
        );
}


/* =========================================================
   時計
========================================================= */

function updateClock() {

    const now =
        new Date();


    const h =
        String(
            now.getHours()
        ).padStart(2, "0");


    const m =
        String(
            now.getMinutes()
        ).padStart(2, "0");


    const s =
        String(
            now.getSeconds()
        ).padStart(2, "0");


    document
        .getElementById("clock")
        .textContent =
        `${h}:${m}:${s}`;
}


/* =========================================================
   メインループ
========================================================= */

let previousTime =
    performance.now();


function mainLoop(time) {

    const delta =
        Math.min(
            (time - previousTime) / 1000,
            0.05
        );


    previousTime = time;


    updateSpeed(delta);

    updateStationProgress(delta);


    requestAnimationFrame(
        mainLoop
    );
}


setInterval(
    updateClock,
    1000
);


updateClock();


requestAnimationFrame(
    mainLoop
);


/* =========================================================
   初期状態
========================================================= */

updateSetupInfo();

</script>
