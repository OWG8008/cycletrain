<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="
        width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        viewport-fit=cover
    "
>

<title>Train Destination</title>

<style>

/* =================================================
   BASIC
================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    margin: 0;
    padding: 0;
    background: #050505;
}

body {

    margin: 0;
    padding: 0;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 20% 0%,
            rgba(255,255,255,0.12),
            transparent 32%
        ),
        radial-gradient(
            circle at 100% 50%,
            rgba(255,255,255,0.07),
            transparent 40%
        ),
        #050505;

    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;

    overflow-x: hidden;
}


/* =================================================
   APP
================================================= */

.app {

    width: 100%;

    max-width: 700px;

    margin: 0 auto;

    padding:
        calc(18px + env(safe-area-inset-top))
        18px
        calc(35px + env(safe-area-inset-bottom))
        18px;

}


/* =================================================
   LIQUID GLASS
================================================= */

.glass {

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.13),
            rgba(255,255,255,0.045)
        );

    border:
        1px solid rgba(255,255,255,0.13);

    box-shadow:

        0 20px 60px
        rgba(0,0,0,0.45),

        inset 0 1px 0
        rgba(255,255,255,0.16),

        inset 0 -1px 0
        rgba(255,255,255,0.03);

    backdrop-filter:
        blur(28px)
        saturate(150%);

    -webkit-backdrop-filter:
        blur(28px)
        saturate(150%);

}


/* =================================================
   SETUP SCREEN
================================================= */

#setup {

    min-height: calc(
        100vh -
        env(safe-area-inset-top) -
        env(safe-area-inset-bottom)
    );

    display: flex;

    flex-direction: column;

    justify-content: center;

}


.setup-card {

    padding: 25px;

    border-radius: 30px;

}


.setup-title {

    font-size: 14px;

    color:
        rgba(255,255,255,0.5);

    margin-bottom: 8px;

}


.setup-heading {

    font-size: 31px;

    font-weight: 750;

    letter-spacing: -1.5px;

    margin-bottom: 25px;

}


/* =================================================
   TRAIN SELECT
================================================= */

.train-select {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;

    margin-bottom: 18px;

}


.train-select button {

    border: none;

    border-radius: 18px;

    padding: 17px 10px;

    background:
        rgba(255,255,255,0.09);

    color: white;

    font-size: 16px;

    font-weight: 650;

}


.train-select button.active {

    background: white;

    color: black;

}


.number-area {

    display: none;

}


.number-area.show {

    display: block;

}


.number-label {

    font-size: 14px;

    color:
        rgba(255,255,255,0.5);

    margin-bottom: 8px;

}


#trainNumber {

    width: 100%;

    border: none;

    outline: none;

    border-radius: 18px;

    padding: 17px;

    background:
        rgba(255,255,255,0.09);

    color: white;

    font-size: 20px;

    font-weight: 650;

}


#trainNumber::placeholder {

    color:
        rgba(255,255,255,0.3);

}


.start-button {

    width: 100%;

    margin-top: 14px;

    border: none;

    border-radius: 19px;

    padding: 17px;

    background: white;

    color: black;

    font-size: 17px;

    font-weight: 700;

}


/* =================================================
   MAIN SCREEN
================================================= */

#main {

    display: none;

}


/* =================================================
   HEADER
================================================= */

.header {

    padding: 22px;

    border-radius: 28px;

    margin-bottom: 16px;

}


.train-name {

    font-size: 15px;

    color:
        rgba(255,255,255,0.53);

    margin-bottom: 5px;

}


.destination {

    font-size: 31px;

    font-weight: 750;

    letter-spacing: -1.4px;

}


/* =================================================
   NEXT STATIONS
================================================= */

.next-stations {

    padding: 20px;

    border-radius: 26px;

    margin-bottom: 16px;

}


.next-label {

    font-size: 13px;

    color:
        rgba(255,255,255,0.43);

    margin-bottom: 15px;

}


.station-route {

    display: flex;

    align-items: center;

    gap: 10px;

    overflow-x: auto;

    scrollbar-width: none;

}


.station-route::-webkit-scrollbar {

    display: none;

}


.route-station {

    min-width: 58px;

    text-align: center;

    font-size: 17px;

    font-weight: 700;

    white-space: nowrap;

}


.route-arrow {

    font-size: 19px;

    color:
        rgba(255,255,255,0.42);

    flex-shrink: 0;

}


/* =================================================
   SPEED
================================================= */

.speed-card {

    padding: 24px;

    border-radius: 28px;

    margin-bottom: 16px;

}


.speed-label {

    font-size: 14px;

    color:
        rgba(255,255,255,0.45);

    margin-bottom: 6px;

}


.speed-row {

    display: flex;

    align-items: baseline;

}


.speed {

    font-size: 75px;

    line-height: 0.95;

    font-weight: 750;

    letter-spacing: -5px;

    font-variant-numeric:
        tabular-nums;

}


.speed-unit {

    margin-left: 9px;

    font-size: 19px;

    color:
        rgba(255,255,255,0.45);

}


/* =================================================
   POSITION
================================================= */

.position-card {

    padding: 24px;

    border-radius: 28px;

    margin-bottom: 16px;

}


.position-label {

    font-size: 14px;

    color:
        rgba(255,255,255,0.45);

    margin-bottom: 15px;

}


.station-names {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 12px;

}


.station-from,
.station-to {

    font-size: 19px;

    font-weight: 700;

}


.station-to {

    text-align: right;

}


/* =================================================
   APPLE MUSIC STYLE BAR
================================================= */

.progress {

    width: 100%;

    height: 19px;

    border-radius: 999px;

    overflow: hidden;

    background:
        rgba(255,255,255,0.11);

    box-shadow:
        inset 0 1px 3px
        rgba(0,0,0,0.25);

}


.progress-fill {

    width: 0%;

    height: 100%;

    border-radius: 999px;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,0.45),
            rgba(255,255,255,0.98)
        );

    box-shadow:
        0 0 15px
        rgba(255,255,255,0.22);

    transition:
        width 0.8s linear;

}


.distance {

    margin-top: 14px;

    text-align: right;

    font-size: 15px;

    color:
        rgba(255,255,255,0.62);

    font-variant-numeric:
        tabular-nums;

}


/* =================================================
   GPS
================================================= */

.gps-card {

    padding: 20px;

    border-radius: 26px;

}


.gps-status {

    text-align: center;

    font-size: 13px;

    color:
        rgba(255,255,255,0.4);

    margin-bottom: 12px;

}


.gps-button {

    width: 100%;

    border: none;

    border-radius: 17px;

    padding: 15px;

    background:
        rgba(255,255,255,0.1);

    color: white;

    font-size: 15px;

    font-weight: 650;

}


.gps-button:active {

    transform: scale(0.98);

}


/* =================================================
   ARRIVAL
================================================= */

.arrival {

    margin-top: 10px;

    font-size: 25px;

    font-weight: 750;

}


/* =================================================
   MOBILE
================================================= */

@media (max-width: 380px) {

    .app {

        padding-left: 14px;
        padding-right: 14px;

    }

    .destination {

        font-size: 27px;

    }

    .speed {

        font-size: 63px;

    }

    .station-from,
    .station-to {

        font-size: 17px;

    }

}

</style>

</head>


<body>


<div class="app">


<!-- =================================================
     SETUP
================================================= -->

<section id="setup">

    <div class="setup-card glass">

        <div class="setup-title">
            TRAIN DESTINATION
        </div>

        <div class="setup-heading">
            列車を選択
        </div>


        <div class="train-select">

            <button
                id="sonicButton"
                onclick="selectTrain('sonic')"
            >
                特急ソニック
            </button>


            <button
                id="yufuButton"
                onclick="selectTrain('yufu')"
            >
                ゆふいんの森
            </button>

        </div>


        <div
            id="numberArea"
            class="number-area"
        >

            <div class="number-label">
                号数を入力
            </div>

            <input
                id="trainNumber"
                type="number"
                inputmode="numeric"
                placeholder="入力"
            >

        </div>


        <button
            class="start-button"
            onclick="startTrain()"
        >
            運転情報を表示
        </button>

    </div>

</section>



<!-- =================================================
     MAIN
================================================= -->

<section id="main">


    <!-- HEADER -->

    <div class="header glass">

        <div
            id="trainName"
            class="train-name"
        >
            特急ソニック
        </div>

        <div
            id="destination"
            class="destination"
        >
            博多行き
        </div>

    </div>



    <!-- NEXT STATIONS -->

    <div class="next-stations glass">

        <div class="next-label">
            この先の駅
        </div>

        <div
            id="stationRoute"
            class="station-route"
        ></div>

    </div>



    <!-- SPEED -->

    <div class="speed-card glass">

        <div class="speed-label">
            速度
        </div>

        <div class="speed-row">

            <span
                id="speed"
                class="speed"
            >
                --
            </span>

            <span class="speed-unit">
                km/h
            </span>

        </div>

    </div>



    <!-- POSITION -->

    <div class="position-card glass">

        <div class="position-label">
            列車位置
        </div>


        <div class="station-names">

            <div
                id="fromStation"
                class="station-from"
            >
                --
            </div>

            <div
                id="toStation"
                class="station-to"
            >
                --
            </div>

        </div>


        <div class="progress">

            <div
                id="progressFill"
                class="progress-fill"
            ></div>

        </div>


        <div
            id="distance"
            class="distance"
        >
            GPS取得中...
        </div>

    </div>



    <!-- GPS -->

    <div class="gps-card glass">

        <div
            id="gpsStatus"
            class="gps-status"
        >
            GPSを待っています
        </div>

        <button
            class="gps-button"
            onclick="startGPS()"
        >
            GPSを開始
        </button>

    </div>


</section>


</div>


<script>

/* =================================================
   TRAIN DATA
================================================= */


/*
====================================================
 SONIC
====================================================
*/

const sonicRouteDown = [

    "博多",
    "香椎",
    "福間",
    "赤間",
    "折尾",
    "黒崎",
    "小倉",
    "行橋",
    "中津",
    "宇佐",
    "杵築",
    "別府",
    "大分"

];


const sonicRouteUp = [

    "大分",
    "別府",
    "杵築",
    "宇佐",
    "中津",
    "行橋",
    "小倉",
    "黒崎",
    "折尾",
    "赤間",
    "福間",
    "香椎",
    "博多"

];


/*
====================================================
 YUFUIN NO MORI
====================================================
*/

const yufuRoutes = {

    1: {

        destination: "由布院",
        
        stations: [
            "博多",
            "鳥栖",
            "久留米",
            "日田",
            "天ケ瀬",
            "豊後森",
            "由布院"
        ]

    },


    2: {

        destination: "博多",

        stations: [
            "由布院",
            "豊後森",
            "天ケ瀬",
            "日田",
            "久留米",
            "鳥栖",
            "博多"
        ]

    },


    3: {

        destination: "別府",

        stations: [
            "博多",
            "鳥栖",
            "久留米",
            "日田",
            "天ケ瀬",
            "豊後森",
            "由布院",
            "大分",
            "別府"
        ]

    },


    4: {

        destination: "博多",

        stations: [
            "別府",
            "大分",
            "由布院",
            "豊後森",
            "天ケ瀬",
            "日田",
            "久留米",
            "鳥栖",
            "博多"
        ]

    },


    5: {

        destination: "由布院",

        stations: [
            "博多",
            "鳥栖",
            "久留米",
            "日田",
            "天ケ瀬",
            "豊後森",
            "由布院"
        ]

    },


    6: {

        destination: "博多",

        stations: [
            "由布院",
            "豊後森",
            "天ケ瀬",
            "日田",
            "久留米",
            "鳥栖",
            "博多"
        ]

    }

};


/* =================================================
   GPS COORDINATES
================================================= */

const stationCoords = {

    "博多": [33.5902, 130.4207],

    "香椎": [33.6590, 130.4440],

    "福間": [33.7665, 130.4860],

    "赤間": [33.8070, 130.5710],

    "折尾": [33.8640, 130.7070],

    "黒崎": [33.8660, 130.7660],

    "戸畑": [33.8970, 130.8190],

    "小倉": [33.8869, 130.8827],

    "行橋": [33.7290, 130.9700],

    "中津": [33.5991, 131.1889],

    "宇佐": [33.5310, 131.3540],

    "杵築": [33.4160, 131.6160],

    "別府": [33.2790, 131.5000],

    "大分": [33.2323, 131.6060],

    "鳥栖": [33.3748, 130.5172],

    "久留米": [33.3198, 130.5083],

    "日田": [33.3210, 130.9410],

    "天ケ瀬": [33.2570, 131.0260],

    "豊後森": [33.2040, 131.1540],

    "由布院": [33.2650, 131.3550]

};


/* =================================================
   VARIABLES
================================================= */

let selectedTrain = null;

let selectedNumber = null;

let currentRoute = [];

let currentIndex = 0;

let watchId = null;


/*
駅切り替え防止用

一度進んだ駅には
GPS誤差で戻らない
*/

let passedIndex = 0;


/*
速度履歴
*/

let speedHistory = [];


/* =================================================
   TRAIN SELECT
================================================= */

function selectTrain(type) {

    selectedTrain = type;

    const sonic =
        document.getElementById(
            "sonicButton"
        );

    const yufu =
        document.getElementById(
            "yufuButton"
        );


    sonic.classList.remove(
        "active"
    );

    yufu.classList.remove(
        "active"
    );


    if (
        type === "sonic"
    ) {

        sonic.classList.add(
            "active"
        );

        document
            .getElementById(
                "numberArea"
            )
            .classList.add(
                "show"
            );

    }


    if (
        type === "yufu"
    ) {

        yufu.classList.add(
            "active"
        );

        document
            .getElementById(
                "numberArea"
            )
            .classList.add(
                "show"
            );

    }

}


/* =================================================
   START TRAIN
================================================= */

function startTrain() {

    if (!selectedTrain) {

        alert(
            "列車を選択してください"
        );

        return;

    }


    selectedNumber =
        Number(
            document
                .getElementById(
                    "trainNumber"
                )
                .value
        );


    if (
        !selectedNumber ||
        selectedNumber <= 0
    ) {

        alert(
            "号数を入力してください"
        );

        return;

    }


    /*
    ================================================
    ソニック
    ================================================
    */

    if (
        selectedTrain === "sonic"
    ) {

        /*
        偶数
        大分 → 博多

        奇数
        博多 → 大分

        ※一部列車は例外
        */

        if (
            selectedNumber % 2 === 0
        ) {

            currentRoute =
                [...sonicRouteUp];

        } else {

            currentRoute =
                [...sonicRouteDown];

        }

    }


    /*
    ================================================
    ゆふ森
    ================================================
    */

    if (
        selectedTrain === "yufu"
    ) {

        const data =
            yufuRoutes[
                selectedNumber
            ];


        if (!data) {

            alert(
                "ゆふいんの森は1〜6号です"
            );

            return;

        }


        currentRoute =
            [...data.stations];

    }


    /*
    初期化
    */

    currentIndex = 0;

    passedIndex = 0;

    speedHistory = [];


    /*
    画面切り替え
    */

    document
        .getElementById(
            "setup"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "main"
        )
        .style.display =
        "block";


    /*
    ヘッダー
    */

    const trainName =
        selectedTrain === "sonic"
            ? "特急ソニック " +
              selectedNumber +
              "号"
            : "特急ゆふいんの森 " +
              selectedNumber +
              "号";


    document
        .getElementById(
            "trainName"
        )
        .textContent =
        trainName;


    /*
    行先
    */

    document
        .getElementById(
            "destination"
        )
        .textContent =
        currentRoute[
            currentRoute.length - 1
        ] + "行き";


    /*
    最初の駅表示
    */

    updateStationDisplay();

}


/* =================================================
   DISTANCE
================================================= */

function distanceBetween(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R = 6371000;

    const rad =
        Math.PI / 180;

    const dLat =
        (lat2 - lat1) * rad;

    const dLon =
        (lon2 - lon1) * rad;


    const a =
        Math.sin(dLat / 2) *
        Math.sin(dLat / 2)

        +

        Math.cos(
            lat1 * rad
        )

        *

        Math.cos(
            lat2 * rad
        )

        *

        Math.sin(
            dLon / 2
        )

        *

        Math.sin(
            dLon / 2
        );


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );


    return R * c;

}


/* =================================================
   NEXT 4 STATIONS
================================================= */

function updateStationDisplay() {

    const container =
        document.getElementById(
            "stationRoute"
        );


    container.innerHTML = "";


    /*
    現在駅から
    4駅分だけ表示
    */

    const end =
        Math.min(
            currentIndex + 4,
            currentRoute.length
        );


    for (
        let i = currentIndex;
        i < end;
        i++
    ) {

        const station =
            document.createElement(
                "div"
            );

        station.className =
            "route-station";

        station.textContent =
            currentRoute[i];


        container.appendChild(
            station
        );


        /*
        最後の駅の後には
        ＞を出さない
        */

        if (
            i < end - 1
        ) {

            const arrow =
                document.createElement(
                    "div"
                );

            arrow.className =
                "route-arrow";

            arrow.textContent =
                "＞";

            container.appendChild(
                arrow
            );

        }

    }

}


/* =================================================
   GPS START
================================================= */

function startGPS() {

    if (
        !navigator.geolocation
    ) {

        setGPSStatus(
            "この端末ではGPSを利用できません"
        );

        return;

    }


    if (
        watchId !== null
    ) {

        return;

    }


    setGPSStatus(
        "GPS取得中..."
    );


    watchId =
        navigator.geolocation.watchPosition(

            updateGPS,

            gpsError,

            {

                enableHighAccuracy: true,

                maximumAge: 0,

                timeout: 15000

            }

        );

}


/* =================================================
   GPS UPDATE
================================================= */

function updateGPS(
    position
) {

    const lat =
        position.coords.latitude;

    const lon =
        position.coords.longitude;


    /*
    ================================================
    SPEED
    ================================================
    */

    let speed =
        position.coords.speed;


    if (
        speed !== null &&
        speed !== undefined &&
        !isNaN(speed) &&
        speed >= 0
    ) {

        speed =
            speed * 3.6;

    } else {

        speed = 0;

    }


    /*
    異常値をカット
    */

    if (
        speed > 300
    ) {

        speed = 0;

    }


    speedHistory.push(
        speed
    );


    if (
        speedHistory.length > 5
    ) {

        speedHistory.shift();

    }


    const averageSpeed =
        speedHistory.reduce(
            (a,b) => a + b,
            0
        )
        /
        speedHistory.length;


    document
        .getElementById(
            "speed"
        )
        .textContent =
        Math.round(
            averageSpeed
        );


    /*
    ================================================
    到着済み
    ================================================
    */

    if (
        currentIndex >=
        currentRoute.length - 1
    ) {

        showArrival();

        return;

    }


    /*
    ================================================
    現在駅
    ================================================
    */

    const from =
        currentRoute[
            currentIndex
        ];


    const to =
        currentRoute[
            currentIndex + 1
        ];


    const fromCoord =
        stationCoords[from];


    const toCoord =
        stationCoords[to];


    if (
        !fromCoord ||
        !toCoord
    ) {

        return;

    }


    /*
    ================================================
    駅間距離
    ================================================
    */

    const total =
        distanceBetween(

            fromCoord[0],
            fromCoord[1],

            toCoord[0],
            toCoord[1]

        );


    const remaining =
        distanceBetween(

            lat,
            lon,

            toCoord[0],
            toCoord[1]

        );


    /*
    ================================================
    PROGRESS
    ================================================
    */

    let progress =
        1 -
        remaining /
        total;


    progress =
        Math.max(
            0,
            Math.min(
                1,
                progress
            )
        );


    document
        .getElementById(
            "progressFill"
        )
        .style.width =
        (
            progress * 100
        ) + "%";


    /*
    ================================================
    DISTANCE
    ================================================
    */

    let km =
        remaining / 1000;


    if (
        km < 0.1
    ) {

        document
            .getElementById(
                "distance"
            )
            .textContent =
            to +
            " まもなく";

    } else {

        document
            .getElementById(
                "distance"
            )
            .textContent =
            to +
            "まであと " +
            km.toFixed(1) +
            " km";

    }


    /*
    ================================================
    駅切り替え判定
    ================================================

    重要！

    GPSが駅の近くに来ただけでは
    すぐ次駅にしない。

    ・駅から250m以内
    ・速度が30km/h以下

    この2条件を基本にする。

    */

    const nearStation =
        remaining <= 250;

    const slowingDown =
        averageSpeed <= 30;


    if (
        nearStation &&
        slowingDown
    ) {

        if (
            currentIndex <
            currentRoute.length - 1
        ) {

            currentIndex++;

            passedIndex =
                currentIndex;

            updateStationDisplay();

        }

    }


    /*
    ================================================
    GPS STATUS
    ================================================
    */

    setGPSStatus(
        "GPS接続中"
    );

}


/* =================================================
   ARRIVAL
================================================= */

function showArrival() {

    document
        .getElementById(
            "speed"
        )
        .textContent =
        "0";


    document
        .getElementById(
            "fromStation"
        )
        .textContent =
        currentRoute[
            currentRoute.length - 1
        ];


    document
        .getElementById(
            "toStation"
        )
        .textContent =
        "";


    document
        .getElementById(
            "progressFill"
        )
        .style.width =
        "100%";


    document
        .getElementById(
            "distance"
        )
        .textContent =
        "到着";


    setGPSStatus(
        "終点に到着しました"
    );

}


/* =================================================
   GPS ERROR
================================================= */

function gpsError(
    error
) {

    let message =
        "GPSを取得できません";


    if (
        error.code === 1
    ) {

        message =
            "位置情報の使用を許可してください";

    }


    if (
        error.code === 2
    ) {

        message =
            "現在地を取得できません";

    }


    if (
        error.code === 3
    ) {

        message =
            "GPS取得がタイムアウトしました";

    }


    setGPSStatus(
        message
    );

}


/* =================================================
   STATUS
================================================= */

function setGPSStatus(
    text
) {

    document
        .getElementById(
            "gpsStatus"
        )
        .textContent =
        text;

}

        */

    }
);
