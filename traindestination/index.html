<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="
        width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover
    "
>

<title>特急ソニック10号｜博多行</title>


<style>

/* =====================================================
   基本
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;
}


/* =====================================================
   背景
===================================================== */

body {

    background:

        radial-gradient(
            circle at 10% 0%,
            rgba(255,255,255,.12),
            transparent 30%
        ),

        radial-gradient(
            circle at 95% 20%,
            rgba(100,140,255,.12),
            transparent 32%
        ),

        radial-gradient(
            circle at 30% 100%,
            rgba(255,255,255,.07),
            transparent 38%
        ),

        linear-gradient(
            145deg,
            #050609,
            #111318 50%,
            #07080b
        );
}


/* =====================================================
   APP
===================================================== */

.app {

    width: 100%;
    height: 100dvh;

    max-width: 650px;

    margin: 0 auto;

    padding:
        calc(8px + env(safe-area-inset-top))
        8px
        calc(8px + env(safe-area-inset-bottom))
        8px;

    display: flex;
    flex-direction: column;

    overflow: hidden;
}


/* =====================================================
   LIQUID GLASS
===================================================== */

.glass {

    position: relative;

    overflow: hidden;

    border:
        1px solid
        rgba(255,255,255,.18);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.13),
            rgba(255,255,255,.065) 48%,
            rgba(255,255,255,.035)
        );

    backdrop-filter:
        blur(32px)
        saturate(170%);

    -webkit-backdrop-filter:
        blur(32px)
        saturate(170%);

    box-shadow:

        inset
        0 1px 0
        rgba(255,255,255,.22),

        inset
        0 -1px 0
        rgba(255,255,255,.035),

        0 14px 40px
        rgba(0,0,0,.18);
}


.glass::before {

    content: "";

    position: absolute;

    width: 180%;
    height: 120%;

    left: -50%;
    top: -70%;

    background:

        linear-gradient(
            110deg,
            transparent 43%,
            rgba(255,255,255,.07) 50%,
            transparent 58%
        );

    transform:
        rotate(-5deg);

    pointer-events: none;
}


/* =====================================================
   ヘッダー
===================================================== */

.header {

    position: relative;

    padding:
        13px 17px;

    border-radius: 25px;

    margin-bottom: 8px;
}


.train-type {

    position: relative;
    z-index: 2;

    font-size: 13px;

    color:
        rgba(255,255,255,.52);

    margin-bottom: 3px;
}


.destination {

    position: relative;
    z-index: 2;

    font-size: 29px;

    line-height: 1;

    font-weight: 760;

    letter-spacing: -1px;
}


.train-number {

    position: absolute;

    right: 17px;
    top: 15px;

    z-index: 3;

    padding:
        6px 10px;

    border-radius: 12px;

    background:
        rgba(255,255,255,.09);

    border:
        1px solid
        rgba(255,255,255,.13);

    font-size: 12px;

    font-weight: 700;

    color:
        rgba(255,255,255,.75);
}


/* =====================================================
   速度
===================================================== */

.speed-box {

    padding:
        12px 17px 14px;

    border-radius: 25px;

    margin-bottom: 8px;
}


.speed-label {

    position: relative;
    z-index: 2;

    font-size: 12px;

    color:
        rgba(255,255,255,.46);

    margin-bottom: 3px;
}


.speed-row {

    position: relative;
    z-index: 2;

    display: flex;

    align-items: baseline;
}


.speed {

    font-size: 74px;

    line-height: .88;

    font-weight: 740;

    letter-spacing: -5px;

    font-variant-numeric:
        tabular-nums;
}


.speed-unit {

    font-size: 17px;

    margin-left: 8px;

    color:
        rgba(255,255,255,.50);
}


/* =====================================================
   列車位置
===================================================== */

.position-section {

    padding:
        14px 17px 15px;

    border-radius: 25px;

    margin-bottom: 8px;
}


.position-title {

    position: relative;
    z-index: 2;

    font-size: 12px;

    color:
        rgba(255,255,255,.46);

    margin-bottom: 11px;
}


.station-row {

    position: relative;
    z-index: 2;

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 10px;

    margin-bottom: 9px;
}


.station {

    font-size: 20px;

    font-weight: 720;

    line-height: 1.1;

    white-space: nowrap;
}


.station.to {
    text-align: right;
}


/* =====================================================
   バー
===================================================== */

.progress-wrapper {

    position: relative;

    width: 100%;

    height: 22px;
}


.progress-background {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 22px;

    border-radius: 999px;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid
        rgba(255,255,255,.09);

    overflow: hidden;

    box-shadow:
        inset
        0 2px 5px
        rgba(0,0,0,.2);
}


.progress-fill {

    position: absolute;

    left: 0;
    top: 0;

    width: 0%;
    height: 22px;

    border-radius: 999px;

    background:

        linear-gradient(
            90deg,
            rgba(255,255,255,.40),
            rgba(255,255,255,.70),
            rgba(255,255,255,.97)
        );

    box-shadow:

        0 0 16px
        rgba(255,255,255,.28),

        inset
        0 1px 1px
        rgba(255,255,255,.5);

    transition:
        width .55s linear;
}


.distance-text {

    position: relative;
    z-index: 2;

    margin-top: 8px;

    text-align: right;

    font-size: 13px;

    color:
        rgba(255,255,255,.60);

    font-variant-numeric:
        tabular-nums;
}


/* =====================================================
   情報カード
===================================================== */

.info-card {

    padding:
        14px 17px;

    border-radius: 25px;

    margin-bottom: 8px;
}


.info-label {

    position: relative;
    z-index: 2;

    font-size: 11px;

    color:
        rgba(255,255,255,.42);

    margin-bottom: 4px;
}


.info-main {

    position: relative;
    z-index: 2;

    font-size: 22px;

    font-weight: 750;

    line-height: 1.1;
}


.info-sub {

    position: relative;
    z-index: 2;

    margin-top: 6px;

    font-size: 13px;

    color:
        rgba(255,255,255,.53);
}


/* =====================================================
   GPS
===================================================== */

.gps-area {

    margin-top: auto;

    padding-top: 3px;
}


.gps-status {

    font-size: 11px;

    color:
        rgba(255,255,255,.38);

    text-align: center;

    margin-bottom: 7px;
}


.gps-button {

    width: 100%;

    padding: 13px;

    border:
        1px solid
        rgba(255,255,255,.28);

    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.72),
            rgba(255,255,255,.42)
        );

    color: #111;

    font-size: 15px;

    font-weight: 700;

    box-shadow:

        inset
        0 1px 0
        rgba(255,255,255,.75),

        0 7px 20px
        rgba(0,0,0,.18);
}


.gps-button:active {

    transform:
        scale(.975);

    opacity: .82;
}


/* =====================================================
   iPhone 13 Proなど
===================================================== */

@media (
    max-width: 430px
) {

    .app {

        padding-left: 7px;
        padding-right: 7px;

    }
}


@media (
    max-height: 760px
) {

    .header {
        padding: 10px 15px;
    }

    .destination {
        font-size: 27px;
    }

    .speed-box {
        padding: 9px 15px 11px;
    }

    .speed {
        font-size: 63px;
    }

    .position-section {
        padding: 10px 15px 12px;
    }

    .station {
        font-size: 18px;
    }

    .info-card {
        padding: 10px 15px 12px;
    }
}

</style>

</head>


<body>


<div class="app">


    <!-- ヘッダー -->

    <div class="header glass">

        <div class="train-type">
            特急ソニック
        </div>

        <div class="destination">
            博多行
        </div>

        <div class="train-number">
            10号
        </div>

    </div>


    <!-- 速度 -->

    <div class="speed-box glass">

        <div class="speed-label">
            速度
        </div>

        <div class="speed-row">

            <span
                id="speed"
                class="speed"
            >
                --
            </span>

            <span class="speed-unit">
                km/h
            </span>

        </div>

    </div>


    <!-- 列車位置 -->

    <div class="position-section glass">

        <div class="position-title">
            列車位置
        </div>

        <div class="station-row">

            <div
                id="fromStation"
                class="station"
            >
                GPS待機中
            </div>

            <div
                id="toStation"
                class="station to"
            >
                --
            </div>

        </div>


        <div class="progress-wrapper">

            <div class="progress-background">

                <div
                    id="progressFill"
                    class="progress-fill"
                ></div>

            </div>

        </div>


        <div
            id="distanceText"
            class="distance-text"
        >
            現在地を確認しています
        </div>

    </div>


    <!-- 現在区間 -->

    <div class="info-card glass">

        <div class="info-label">
            現在走行区間
        </div>

        <div
            id="sectionName"
            class="info-main"
        >
            GPS待機中
        </div>

        <div
            id="nextInfo"
            class="info-sub"
        >
            現在地を取得しています
        </div>

    </div>


    <!-- GPS -->

    <div class="gps-area">

        <div
            id="gpsStatus"
            class="gps-status"
        >
            GPSを待っています
        </div>

        <button
            class="gps-button"
            onclick="startGPS()"
        >
            GPSを開始
        </button>

    </div>


</div>



<script>


/* =====================================================
   ソニック10号

   大分 → 博多

   JR九州の停車駅順
===================================================== */

const stations = [

    {
        name: "大分",
        lat: 33.2323,
        lon: 131.6066
    },

    {
        name: "別府",
        lat: 33.2797,
        lon: 131.5004
    },

    {
        name: "杵築",
        lat: 33.4184,
        lon: 131.6171
    },

    {
        name: "宇佐",
        lat: 33.5312,
        lon: 131.3485
    },

    {
        name: "柳ケ浦",
        lat: 33.5650,
        lon: 131.3626
    },

    {
        name: "中津",
        lat: 33.5991,
        lon: 131.1909
    },

    {
        name: "宇島",
        lat: 33.6120,
        lon: 131.1300
    },

    {
        name: "行橋",
        lat: 33.7308,
        lon: 130.9588
    },

    {
        name: "小倉",
        lat: 33.8869,
        lon: 130.8827
    },

    {
        name: "黒崎",
        lat: 33.8660,
        lon: 130.7665
    },

    {
        name: "折尾",
        lat: 33.8650,
        lon: 130.7130
    },

    {
        name: "博多",
        lat: 33.5904,
        lon: 130.4207
    }

];


/* =====================================================
   設定
===================================================== */


/*
   駅の近くと判定する距離
*/

const STATION_RADIUS = 700;


/*
   次駅へ切り替える距離
*/

const SWITCH_DISTANCE = 500;


/*
   次駅へ切り替える速度
*/

const SWITCH_SPEED = 25;


/*
   かなり駅に近ければ
   速度に関係なく切り替える
*/

const ARRIVAL_DISTANCE = 80;


/*
   GPS開始直後に
   区間を決定したか
*/

let initialized = false;


/*
   現在の区間

   0 = 大分 → 別府
   1 = 別府 → 杵築
   ...
*/

let currentSegment = 0;


/*
   GPS監視
*/

let watchId = null;


/* =====================================================
   距離
===================================================== */

function getDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R = 6371000;

    const rad =
        Math.PI / 180;

    const dLat =
        (lat2 - lat1) * rad;

    const dLon =
        (lon2 - lon1) * rad;

    const a =

        Math.sin(dLat / 2) *
        Math.sin(dLat / 2)

        +

        Math.cos(lat1 * rad) *
        Math.cos(lat2 * rad) *

        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);

    const c =

        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );

    return R * c;
}


/* =====================================================
   点と線分の距離

   現在地が
   「どの駅間にいるか」
   を判断するために使う。
===================================================== */

function pointToSegmentDistance(
    lat,
    lon,
    a,
    b
) {

    /*
       緯度経度を
       簡易的なXY座標に変換
    */

    const latScale = 111320;

    const lonScale =
        111320 *
        Math.cos(
            lat * Math.PI / 180
        );


    const px =
        lon * lonScale;

    const py =
        lat * latScale;


    const ax =
        a.lon * lonScale;

    const ay =
        a.lat * latScale;


    const bx =
        b.lon * lonScale;

    const by =
        b.lat * latScale;


    const dx =
        bx - ax;

    const dy =
        by - ay;


    const lengthSquared =
        dx * dx +
        dy * dy;


    if (
        lengthSquared === 0
    ) {

        return Math.sqrt(
            (px - ax) ** 2 +
            (py - ay) ** 2
        );

    }


    let t =

        (
            (px - ax) * dx +
            (py - ay) * dy
        )
        /
        lengthSquared;


    t =
        Math.max(
            0,
            Math.min(
                1,
                t
            )
        );


    const closestX =
        ax + t * dx;

    const closestY =
        ay + t * dy;


    return Math.sqrt(

        (px - closestX) ** 2 +

        (py - closestY) ** 2

    );

}


/* =====================================================
   現在地から最初の区間を決める
===================================================== */

function detectInitialSegment(
    lat,
    lon
) {

    /*
       まず駅そのものに近いか確認。

       これが重要。

       例えば行橋駅にいるなら

       行橋 → 小倉

       にする。
    */

    for (
        let i = 0;
        i < stations.length;
        i++
    ) {

        const distance =
            getDistance(
                lat,
                lon,
                stations[i].lat,
                stations[i].lon
            );


        if (
            distance <=
            STATION_RADIUS
        ) {

            /*
               博多なら終点
            */

            if (
                i >=
                stations.length - 1
            ) {

                return stations.length - 1;

            }


            /*
               駅にいるなら
               その駅から次駅へ
            */

            return i;

        }

    }


    /*
       駅から離れている場合は
       一番近い「駅間」を探す。
    */

    let bestSegment = 0;

    let bestDistance =
        Infinity;


    for (
        let i = 0;
        i < stations.length - 1;
        i++
    ) {

        const distance =
            pointToSegmentDistance(
                lat,
                lon,
                stations[i],
                stations[i + 1]
            );


        if (
            distance <
            bestDistance
        ) {

            bestDistance =
                distance;

            bestSegment =
                i;

        }

    }


    return bestSegment;

}


/* =====================================================
   GPS開始
===================================================== */

function startGPS() {

    if (
        !navigator.geolocation
    ) {

        setStatus(
            "この端末ではGPSを利用できません"
        );

        return;

    }


    if (
        watchId !== null
    ) {

        return;

    }


    setStatus(
        "GPS取得中..."
    );


    watchId =
        navigator.geolocation.watchPosition(

            updateGPS,

            gpsError,

            {

                enableHighAccuracy: true,

                maximumAge: 500,

                timeout: 10000

            }

        );

}


/* =====================================================
   GPS更新
===================================================== */

function updateGPS(
    position
) {

    const lat =
        position.coords.latitude;

    const lon =
        position.coords.longitude;


    /* =================================================
       速度
    ================================================= */

    let speed =
        position.coords.speed;


    if (
        speed !== null &&
        speed !== undefined &&
        !isNaN(speed)
    ) {

        speed =
            Math.max(
                0,
                speed * 3.6
            );

    }

    else {

        speed = 0;

    }


    const displaySpeed =
        Math.round(speed);


    document.getElementById(
        "speed"
    ).textContent =
        displaySpeed;


    /* =================================================
       初回GPS

       ★ここが今回の重要部分
    ================================================= */

    if (
        !initialized
    ) {

        const detected =
            detectInitialSegment(
                lat,
                lon
            );


        /*
           博多にいる
        */

        if (
            detected >=
            stations.length - 1
        ) {

            currentSegment =
                stations.length - 1;

            initialized = true;

            showArrival();

            return;

        }


        /*
           現在地から
           正しい区間を設定
        */

        currentSegment =
            detected;


        initialized = true;

    }


    /* =================================================
       終点チェック
    ================================================= */

    if (
        currentSegment >=
        stations.length - 1
    ) {

        showArrival();

        return;

    }


    /* =================================================
       現在区間
    ================================================= */

    const from =
        stations[
            currentSegment
        ];

    const to =
        stations[
            currentSegment + 1
        ];


    const remaining =
        getDistance(
            lat,
            lon,
            to.lat,
            to.lon
        );


    /* =================================================
       駅切り替え

       ① 500m以内
       ＋
       ② 25km/h以下

       または

       ③ 80m以内
    ================================================= */

    const slowEnough =
        displaySpeed <=
        SWITCH_SPEED;


    const closeEnough =
        remaining <=
        SWITCH_DISTANCE;


    const almostAtStation =
        remaining <=
        ARRIVAL_DISTANCE;


    if (

        (
            closeEnough &&
            slowEnough
        )

        ||

        almostAtStation

    ) {

        currentSegment++;


        if (
            currentSegment >=
            stations.length - 1
        ) {

            showArrival();

            return;

        }

    }


    updateDisplay(
        lat,
        lon
    );

}


/* =====================================================
   表示
===================================================== */

function updateDisplay(
    lat,
    lon
) {

    if (
        currentSegment >=
        stations.length - 1
    ) {

        showArrival();

        return;

    }


    const from =
        stations[
            currentSegment
        ];

    const to =
        stations[
            currentSegment + 1
        ];


    /* =================================================
       区間距離
    ================================================= */

    const totalDistance =
        getDistance(
            from.lat,
            from.lon,
            to.lat,
            to.lon
        );


    /* =================================================
       次駅まで
    ================================================= */

    const remaining =
        getDistance(
            lat,
            lon,
            to.lat,
            to.lon
        );


    /* =================================================
       進行率
    ================================================= */

    let progress =

        1 -
        (
            remaining /
            totalDistance
        );


    progress =

        Math.max(
            0,
            Math.min(
                1,
                progress
            )
        );


    /* =================================================
       駅名
    ================================================= */

    document.getElementById(
        "fromStation"
    ).textContent =
        from.name;


    document.getElementById(
        "toStation"
    ).textContent =
        to.name;


    /* =================================================
       バー
    ================================================= */

    document.getElementById(
        "progressFill"
    ).style.width =
        (
            progress * 100
        ) + "%";


    /* =================================================
       距離
    ================================================= */

    const km =
        remaining / 1000;


    if (
        km < 0.1
    ) {

        document.getElementById(
            "distanceText"
        ).textContent =
            to.name +
            " まもなく";

    }

    else {

        document.getElementById(
            "distanceText"
        ).textContent =
            to.name +
            "まであと " +
            km.toFixed(1) +
            " km";

    }


    /* =================================================
       現在区間
    ================================================= */

    document.getElementById(
        "sectionName"
    ).textContent =
        from.name +
        " → " +
        to.name;


    /* =================================================
       次駅
    ================================================= */

    document.getElementById(
        "nextInfo"
    ).textContent =
        "次は「" +
        to.name +
        "」です";


    setStatus(
        "● GPS接続中"
    );

}


/* =====================================================
   到着
===================================================== */

function showArrival() {

    document.getElementById(
        "speed"
    ).textContent =
        "0";


    document.getElementById(
        "fromStation"
    ).textContent =
        "博多";


    document.getElementById(
        "toStation"
    ).textContent =
        "";


    document.getElementById(
        "progressFill"
    ).style.width =
        "100%";


    document.getElementById(
        "distanceText"
    ).textContent =
        "博多 到着";


    document.getElementById(
        "sectionName"
    ).textContent =
        "博多";


    document.getElementById(
        "nextInfo"
    ).textContent =
        "終点です";


    setStatus(
        "● 博多に到着しました"
    );

}


/* =====================================================
   GPSステータス
===================================================== */

function setStatus(
    text
) {

    document.getElementById(
        "gpsStatus"
    ).textContent =
        text;

}


/* =====================================================
   GPSエラー
===================================================== */

function gpsError(
    error
) {

    let message =
        "GPSを取得できません";


    switch (
        error.code
    ) {

        case 1:

            message =
                "位置情報の使用を許可してください";

            break;


        case 2:

            message =
                "現在地を取得できません";

            break;


        case 3:

            message =
                "GPS取得がタイムアウトしました";

            break;

    }


    setStatus(
        message
    );

}


/* =====================================================
   起動
===================================================== */

window.addEventListener(
    "load",
    () => {

        startGPS();

    }
);
