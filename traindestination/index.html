<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="
    width=device-width,
    initial-scale=1,
    maximum-scale=1,
    user-scalable=no,
    viewport-fit=cover
  "
>

<meta name="theme-color" content="#08090c">

<title>Train Destination</title>


<style>

/* =====================================================
   RESET
===================================================== */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {

  margin: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

}

body {

  color: white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Helvetica Neue",
    Arial,
    sans-serif;

  background:

    radial-gradient(
      circle at 0% 0%,
      rgba(255,255,255,.28),
      transparent 32%
    ),

    radial-gradient(
      circle at 100% 15%,
      rgba(120,170,255,.22),
      transparent 35%
    ),

    radial-gradient(
      circle at 50% 100%,
      rgba(255,255,255,.15),
      transparent 40%
    ),

    linear-gradient(
      145deg,
      #050608 0%,
      #17191e 45%,
      #07080a 100%
    );

}


/* =====================================================
   APP
===================================================== */

.app {

  width: 100%;

  height: 100dvh;

  padding:

    calc(6px + env(safe-area-inset-top))
    6px
    calc(6px + env(safe-area-inset-bottom));

  display: flex;

  flex-direction: column;

  gap: 6px;

}


/* =====================================================
   LIQUID GLASS
===================================================== */

.glass {

  position: relative;

  overflow: hidden;

  background:

    linear-gradient(
      135deg,
      rgba(255,255,255,.29),
      rgba(255,255,255,.12) 45%,
      rgba(255,255,255,.045)
    );

  border:

    1px solid
    rgba(255,255,255,.33);

  box-shadow:

    inset
    0 1px 0
    rgba(255,255,255,.46),

    inset
    0 -1px 0
    rgba(255,255,255,.08),

    0 10px 35px
    rgba(0,0,0,.27);

  backdrop-filter:

    blur(38px)
    saturate(200%)
    brightness(1.15);

  -webkit-backdrop-filter:

    blur(38px)
    saturate(200%)
    brightness(1.15);

}


/* ガラス反射 */

.glass::before {

  content: "";

  position: absolute;

  width: 170%;
  height: 110%;

  left: -35%;
  top: -72%;

  background:

    linear-gradient(
      115deg,
      transparent 34%,
      rgba(255,255,255,.23) 50%,
      transparent 66%
    );

  transform:
    rotate(-7deg);

  pointer-events: none;

}


/* =====================================================
   HEADER
===================================================== */

.header {

  min-height: 79px;

  padding:

    11px
    17px;

  border-radius: 27px;

}

.train-type {

  position: relative;
  z-index: 1;

  font-size: 12px;

  color:
    rgba(255,255,255,.65);

}

.destination {

  position: relative;
  z-index: 1;

  margin-top: 3px;

  font-size: 31px;

  line-height: 1;

  font-weight: 800;

  letter-spacing: -1.4px;

}


/* =====================================================
   SPEED
===================================================== */

.speed-card {

  min-height: 115px;

  padding:

    10px
    17px;

  border-radius: 27px;

}

.label {

  position: relative;
  z-index: 1;

  font-size: 12px;

  color:
    rgba(255,255,255,.57);

}

.speed-row {

  position: relative;
  z-index: 1;

  display: flex;

  align-items: baseline;

}

.speed {

  font-size: 67px;

  line-height: .88;

  font-weight: 800;

  letter-spacing: -5px;

  font-variant-numeric:
    tabular-nums;

}

.unit {

  margin-left: 8px;

  font-size: 15px;

  color:
    rgba(255,255,255,.58);

}


/* =====================================================
   POSITION
===================================================== */

.position-card {

  min-height: 150px;

  padding:

    13px
    17px;

  border-radius: 27px;

}

.station-row {

  position: relative;
  z-index: 1;

  display: flex;

  justify-content:
    space-between;

  align-items:
    center;

  gap: 10px;

}

.station {

  font-size: 21px;

  line-height: 1.1;

  font-weight: 780;

  white-space:
    nowrap;

}

.progress {

  position: relative;

  z-index: 1;

  width: 100%;

  height: 27px;

  margin-top: 15px;

  border-radius: 999px;

  overflow: hidden;

  background:

    rgba(255,255,255,.105);

  border:

    1px solid
    rgba(255,255,255,.18);

  box-shadow:

    inset
    0 2px 5px
    rgba(0,0,0,.20);

}

.progress-fill {

  position: absolute;

  left: 0;
  top: 0;

  width: 0%;

  height: 100%;

  border-radius: 999px;

  background:

    linear-gradient(
      90deg,
      rgba(255,255,255,.48),
      rgba(255,255,255,.99)
    );

  box-shadow:

    0 0 20px
    rgba(255,255,255,.52);

  transition:

    width .25s
    linear;

}

.distance {

  position: relative;

  z-index: 1;

  margin-top: 8px;

  text-align: right;

  font-size: 13px;

  color:
    rgba(255,255,255,.70);

}


/* =====================================================
   SECTION
===================================================== */

.section-card {

  min-height: 93px;

  padding:

    11px
    17px;

  border-radius: 27px;

}

.section-title {

  position: relative;
  z-index: 1;

  font-size: 11px;

  color:
    rgba(255,255,255,.50);

}

.section-name {

  position: relative;
  z-index: 1;

  margin-top: 3px;

  font-size: 23px;

  line-height: 1.05;

  font-weight: 790;

  letter-spacing: -.7px;

}

.next {

  position: relative;
  z-index: 1;

  margin-top: 6px;

  font-size: 13px;

  color:
    rgba(255,255,255,.62);

}


/* =====================================================
   GPS
===================================================== */

.gps-card {

  min-height: 43px;

  padding:

    8px
    14px;

  border-radius: 22px;

  display: flex;

  justify-content:
    space-between;

  align-items:
    center;

}

.gps-left {

  position: relative;
  z-index: 1;

  display: flex;

  align-items:
    center;

  gap: 8px;

}

.gps-dot {

  width: 8px;
  height: 8px;

  border-radius: 50%;

  background:
    rgba(255,255,255,.30);

}

.gps-dot.active {

  background: white;

  box-shadow:

    0 0 14px
    rgba(255,255,255,.95);

}

.gps-text {

  font-size: 12px;

  color:
    rgba(255,255,255,.68);

}

.accuracy {

  position: relative;
  z-index: 1;

  font-size: 11px;

  color:
    rgba(255,255,255,.45);

}


/* =====================================================
   BUTTON
===================================================== */

.gps-button {

  width: 100%;

  min-height: 45px;

  border: none;

  border-radius: 23px;

  color: #111;

  font-size: 15px;

  font-weight: 750;

  background:

    linear-gradient(
      180deg,
      rgba(255,255,255,.99),
      rgba(255,255,255,.73)
    );

  box-shadow:

    0 8px 25px
    rgba(0,0,0,.30);

}

.gps-button:active {

  transform:
    scale(.985);

}


/* =====================================================
   ARRIVAL
===================================================== */

.arrival {

  display: none;

  padding: 15px;

  border-radius: 27px;

  text-align: center;

}

.arrival.show {

  display: block;

}

.arrival-title {

  font-size: 11px;

  color:
    rgba(255,255,255,.52);

}

.arrival-name {

  margin-top: 2px;

  font-size: 31px;

  font-weight: 800;

}


/* =====================================================
   iPHONE 13 PRO
===================================================== */

@media (
  max-width: 430px
) {

  .app {

    gap: 6px;

  }

}


/* =====================================================
   SHORT SCREEN
===================================================== */

@media (
  max-height: 760px
) {

  .app {
    gap: 4px;
  }

  .header {
    min-height: 65px;
  }

  .destination {
    font-size: 27px;
  }

  .speed-card {
    min-height: 92px;
  }

  .speed {
    font-size: 55px;
  }

  .position-card {
    min-height: 120px;
  }

  .station {
    font-size: 18px;
  }

  .progress {
    height: 21px;
    margin-top: 10px;
  }

  .section-card {
    min-height: 76px;
  }

}

</style>

</head>


<body>


<div class="app">


  <!-- ===============================================
       HEADER
  ================================================ -->

  <div class="header glass">

    <div class="train-type">
      普通列車
    </div>

    <div class="destination">
      行橋行
    </div>

  </div>


  <!-- ===============================================
       SPEED
  ================================================ -->

  <div class="speed-card glass">

    <div class="label">
      速度
    </div>

    <div class="speed-row">

      <span
        id="speed"
        class="speed"
      >
        --
      </span>

      <span class="unit">
        km/h
      </span>

    </div>

  </div>


  <!-- ===============================================
       POSITION
  ================================================ -->

  <div class="position-card glass">

    <div class="label">
      列車位置
    </div>

    <div class="station-row">

      <div
        id="fromStation"
        class="station"
      >
        豊前善光寺
      </div>

      <div
        id="toStation"
        class="station"
      >
        天津
      </div>

    </div>


    <div class="progress">

      <div
        id="progressFill"
        class="progress-fill"
      ></div>

    </div>


    <div
      id="distance"
      class="distance"
    >
      GPS取得中...
    </div>

  </div>


  <!-- ===============================================
       CURRENT SECTION
  ================================================ -->

  <div class="section-card glass">

    <div class="section-title">
      現在走行区間
    </div>

    <div
      id="sectionName"
      class="section-name"
    >
      豊前善光寺 → 天津
    </div>

    <div
      id="next"
      class="next"
    >
      次は「天津」です
    </div>

  </div>


  <!-- ===============================================
       GPS
  ================================================ -->

  <div class="gps-card glass">

    <div class="gps-left">

      <div
        id="gpsDot"
        class="gps-dot"
      ></div>

      <div
        id="gpsText"
        class="gps-text"
      >
        GPS待機中
      </div>

    </div>

    <div
      id="accuracy"
      class="accuracy"
    >
      -- m
    </div>

  </div>


  <button
    class="gps-button"
    onclick="startGPS()"
  >
    GPSを開始
  </button>


  <!-- ===============================================
       ARRIVAL
  ================================================ -->

  <div
    id="arrival"
    class="arrival glass"
  >

    <div class="arrival-title">
      終点到着
    </div>

    <div class="arrival-name">
      行橋
    </div>

  </div>


</div>



<script>

/* =====================================================
   駅データ
===================================================== */

const stations = [

  {
    name: "豊前善光寺",
    lat: 33.5664462,
    lon: 131.3229872
  },

  {
    name: "天津",
    lat: 33.5646518,
    lon: 131.2931969
  },

  {
    name: "今津",
    lat: 33.5719364,
    lon: 131.2676687
  },

  {
    name: "東中津",
    lat: 33.5876661,
    lon: 131.2389301
  },

  {
    name: "中津",
    lat: 33.5991369,
    lon: 131.1909351
  },

  {
    name: "吉富",
    lat: 33.6048309,
    lon: 131.1735756
  },

  {
    name: "三毛門",
    lat: 33.6147369,
    lon: 131.1553124
  },

  {
    name: "宇島",
    lat: 33.6212411,
    lon: 131.1264123
  },

  {
    name: "豊前松江",
    lat: 33.6224544,
    lon: 131.0952661
  },

  {
    name: "椎田",
    lat: 33.6534281,
    lon: 131.0578436
  },

  {
    name: "築城",
    lat: 33.6731005,
    lon: 131.0378479
  },

  {
    name: "新田原",
    lat: 33.6952063,
    lon: 131.0082270
  },

  {
    name: "南行橋",
    lat: 33.7162864,
    lon: 130.9811458
  },

  {
    name: "行橋",
    lat: 33.7287286,
    lon: 130.9709038
  }

];


/* =====================================================
   STATE
===================================================== */


/*
   currentSection

   0
   豊前善光寺 → 天津

   1
   天津 → 今津

   2
   今津 → 東中津

   ...
*/

let currentSection = 0;


/*
   現在区間の進行率
*/

let progress = 0;


/*
   GPS監視ID
*/

let watchId = null;


/*
   前回GPS
*/

let previousGPS = null;


/*
   駅切替判定距離
*/

const ARRIVAL_DISTANCE = 250;


/*
   GPS精度上限
*/

const MAX_ACCURACY = 100;


/* =====================================================
   DISTANCE
===================================================== */

function distance(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R = 6371000;

  const rad =
    Math.PI / 180;

  const dLat =
    (lat2 - lat1) * rad;

  const dLon =
    (lon2 - lon1) * rad;

  const a =

    Math.sin(dLat / 2) ** 2 +

    Math.cos(lat1 * rad) *
    Math.cos(lat2 * rad) *

    Math.sin(dLon / 2) ** 2;

  return

    R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

}


/* =====================================================
   GPS START
===================================================== */

function startGPS() {

  if (
    !navigator.geolocation
  ) {

    setGPS(
      "GPS非対応",
      false
    );

    return;

  }


  if (
    watchId !== null
  ) {

    return;

  }


  setGPS(
    "GPS取得中...",
    false
  );


  watchId =
    navigator.geolocation.watchPosition(

      updateGPS,

      gpsError,

      {

        enableHighAccuracy:
          true,

        maximumAge:
          0,

        timeout:
          10000

      }

    );

}


/* =====================================================
   GPS UPDATE
===================================================== */

function updateGPS(
  position
) {

  const c =
    position.coords;


  const lat =
    c.latitude;

  const lon =
    c.longitude;


  const accuracy =
    c.accuracy;


  document.getElementById(
    "accuracy"
  ).textContent =

    Math.round(
      accuracy
    ) +
    " m";


  /*
     精度が悪い場合
  */

  if (
    accuracy >
    MAX_ACCURACY
  ) {

    setGPS(
      "GPS精度低下中",
      false
    );

    return;

  }


  /*
     現在の区間
  */

  const from =
    stations[
      currentSection
    ];

  const to =
    stations[
      currentSection + 1
    ];


  /*
     次駅まで
  */

  const toNext =
    distance(
      lat,
      lon,
      to.lat,
      to.lon
    );


  /*
     現在駅から
  */

  const fromCurrent =
    distance(
      lat,
      lon,
      from.lat,
      from.lon
    );


  /* =================================================
     駅到着判定
  ================================================= */


  if (
    toNext <=
    ARRIVAL_DISTANCE
  ) {

    nextSection();

    return;

  }


  /* =================================================
     進行率
  ================================================= */

  const total =
    distance(
      from.lat,
      from.lon,
      to.lat,
      to.lon
    );


  let newProgress =

    1 -
    (
      toNext /
      total
    );


  /*
     0～1
  */

  newProgress =

    Math.max(
      0,
      Math.min(
        1,
        newProgress
      )
    );


  /*
     GPSのブレで
     バーを戻さない
  */

  if (
    newProgress >
    progress
  ) {

    progress =
      newProgress;

  }


  /*
     99.5%以上なら
     100%にする
  */

  if (
    progress >=
    0.995
  ) {

    progress = 1;

  }


  /*
     バー表示
  */

  document.getElementById(
    "progressFill"
  ).style.width =

    (
      progress *
      100
    ) +
    "%";


  /* =================================================
     距離
  ================================================= */

  if (
    toNext <= 100
  ) {

    document.getElementById(
      "distance"
    ).textContent =

      to.name +
      " まもなく";

  }

  else {

    document.getElementById(
      "distance"
    ).textContent =

      to.name +
      "まであと " +

      (
        toNext /
        1000
      ).toFixed(1) +

      " km";

  }


  /* =================================================
     SPEED
  ================================================= */

  let speed =
    c.speed;


  if (
    speed === null ||
    speed === undefined ||
    !Number.isFinite(speed)
  ) {

    speed =
      calculateSpeed(
        lat,
        lon,
        position.timestamp
      );

  }

  else {

    speed =
      speed * 3.6;

  }


  if (
    !Number.isFinite(speed) ||
    speed < 0
  ) {

    speed = 0;

  }


  if (
    speed > 180
  ) {

    speed = 180;

  }


  document.getElementById(
    "speed"
  ).textContent =

    Math.round(
      speed
    );


  /*
     GPS正常
  */

  setGPS(
    "GPS接続中",
    true
  );


  previousGPS = {

    lat:
      lat,

    lon:
      lon,

    time:
      position.timestamp

  };

}


/* =====================================================
   ★ 次の駅間へ移動
===================================================== */

function nextSection() {

  /*
     バーを一度100%にする
  */

  progress = 1;

  document.getElementById(
    "progressFill"
  ).style.width =
    "100%";


  /*
     少しだけ待ってから
     駅名を切り替える。

     「満タンになった」
     のが見える。
  */

  setTimeout(
    () => {

      /*
         次の区間へ
      */

      currentSection++;


      /*
         行橋到着
      */

      if (
        currentSection >=
        stations.length - 1
      ) {

        arrival();

        return;

      }


      /*
         新しい区間なので
         0%から再スタート
      */

      progress = 0;


      document.getElementById(
        "progressFill"
      ).style.width =
        "0%";


      /*
         駅名更新
      */

      updateUI();

    },

    350

  );

}


/* =====================================================
   UI UPDATE
===================================================== */

function updateUI() {

  const from =
    stations[
      currentSection
    ];

  const to =
    stations[
      currentSection + 1
    ];


  /*
     左駅
  */

  document.getElementById(
    "fromStation"
  ).textContent =

    from.name;


  /*
     右駅
  */

  document.getElementById(
    "toStation"
  ).textContent =

    to.name;


  /*
     区間表示
  */

  document.getElementById(
    "sectionName"
  ).textContent =

    from.name +
    " → " +
    to.name;


  /*
     次駅
  */

  document.getElementById(
    "next"
  ).textContent =

    "次は「" +
    to.name +
    "」です";


  /*
     距離初期化
  */

  document.getElementById(
    "distance"
  ).textContent =

    to.name +
    "まであと -- km";

}


/* =====================================================
   SPEED CALCULATION
===================================================== */

function calculateSpeed(
  lat,
  lon,
  time
) {

  if (
    !previousGPS
  ) {

    return 0;

  }


  const d =
    distance(
      previousGPS.lat,
      previousGPS.lon,
      lat,
      lon
    );


  const dt =
    (
      time -
      previousGPS.time
    ) / 1000;


  if (
    dt <= 0
  ) {

    return 0;

  }


  return (
    d /
    dt
  ) *
  3.6;

}


/* =====================================================
   GPS STATUS
===================================================== */

function setGPS(
  text,
  active
) {

  document.getElementById(
    "gpsText"
  ).textContent =
    text;


  const dot =
    document.getElementById(
      "gpsDot"
    );


  if (
    active
  ) {

    dot.classList.add(
      "active"
    );

  }

  else {

    dot.classList.remove(
      "active"
    );

  }

}


/* =====================================================
   ARRIVAL
===================================================== */

function arrival() {

  document.getElementById(
    "speed"
  ).textContent =
    "0";


  document.getElementById(
    "fromStation"
  ).textContent =
    "行橋";


  document.getElementById(
    "toStation"
  ).textContent =
    "";


  document.getElementById(
    "progressFill"
  ).style.width =
    "100%";


  document.getElementById(
    "distance"
  ).textContent =
    "行橋 到着";


  document.getElementById(
    "sectionName"
  ).textContent =
    "行橋";


  document.getElementById(
    "next"
  ).textContent =
    "終点です";


  document.getElementById(
    "arrival"
  ).classList.add(
    "show"
  );


  setGPS(
    "行橋に到着",
    true
  );

}


/* =====================================================
   GPS ERROR
===================================================== */

function gpsError(
  error
) {

  let message =
    "GPSエラー";


  if (
    error.code === 1
  ) {

    message =
      "位置情報を許可してください";

  }

  else if (
    error.code === 2
  ) {

    message =
      "現在地を取得できません";

  }

  else if (
    error.code === 3
  ) {

    message =
      "GPS取得がタイムアウトしました";

  }


  setGPS(
    message,
    false
  );

}


/* =====================================================
   INITIAL
===================================================== */

updateUI();


window.addEventListener(
  "load",
  () => {

    startGPS();

  }
);

</script>
