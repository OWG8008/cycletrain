<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      viewport-fit=cover">

<title>JR九州 Train Glass</title>

<style>

/* =====================================================
   BASE
===================================================== */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    min-height:100%;

    background:#050608;
}

body{
    color:#fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;

    overflow-x:hidden;

    background:
        radial-gradient(
            circle at 15% 5%,
            rgba(255,255,255,.10),
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(80,130,255,.08),
            transparent 30%
        ),
        #050608;
}

body::before{
    content:"";

    position:fixed;
    inset:-30%;

    z-index:-1;

    background:
        radial-gradient(
            circle at 30% 30%,
            rgba(255,255,255,.07),
            transparent 30%
        ),
        radial-gradient(
            circle at 70% 70%,
            rgba(100,150,255,.06),
            transparent 30%
        );

    filter:blur(70px);

    animation:
        bgMove 18s
        ease-in-out
        infinite
        alternate;
}

@keyframes bgMove{

    from{
        transform:
            translate(-2%,-2%)
            scale(1);
    }

    to{
        transform:
            translate(3%,3%)
            scale(1.08);
    }

}


/* =====================================================
   APP
===================================================== */

.app{
    width:100%;
    max-width:760px;

    min-height:100vh;

    margin:auto;

    padding:
        calc(10px + env(safe-area-inset-top))
        10px
        calc(25px + env(safe-area-inset-bottom));
}


/* =====================================================
   LIQUID GLASS
===================================================== */

.glass{

    position:relative;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.14),
            rgba(255,255,255,.045)
        );

    border:
        1px solid
        rgba(255,255,255,.13);

    box-shadow:
        0 20px 55px
        rgba(0,0,0,.42),

        inset 0 1px 0
        rgba(255,255,255,.17),

        inset 0 -1px 0
        rgba(255,255,255,.025);

    backdrop-filter:
        blur(30px)
        saturate(160%);

    -webkit-backdrop-filter:
        blur(30px)
        saturate(160%);

    overflow:hidden;
}

.glass::before{

    content:"";

    position:absolute;

    top:0;
    left:0;
    right:0;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.35),
            transparent
        );

    pointer-events:none;
}


/* =====================================================
   START
===================================================== */

#startScreen{

    display:flex;

    align-items:flex-start;
    justify-content:center;
}

.start-card{

    width:100%;

    margin-top:5px;

    padding:23px 17px;

    border-radius:30px;
}

.title{

    font-size:31px;

    font-weight:850;

    letter-spacing:-1.5px;
}

.subtitle{

    margin-top:4px;

    color:
        rgba(255,255,255,.42);

    font-size:13px;
}

.label{

    margin-top:20px;
    margin-bottom:8px;

    color:
        rgba(255,255,255,.45);

    font-size:13px;

    font-weight:650;
}


/* =====================================================
   SELECT
===================================================== */

select{

    width:100%;

    padding:15px;

    border-radius:17px;

    border:
        1px solid
        rgba(255,255,255,.12);

    background:
        rgba(255,255,255,.065);

    color:#fff;

    outline:none;

    font-size:16px;

    font-weight:650;
}

select option{

    background:#17181b;
    color:#fff;
}


/* =====================================================
   DESTINATION
===================================================== */

.destination-buttons{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:8px;
}

.destination-button{

    min-height:58px;

    border-radius:18px;

    border:
        1px solid
        rgba(255,255,255,.10);

    background:
        rgba(255,255,255,.055);

    color:
        rgba(255,255,255,.70);

    font-size:15px;

    font-weight:750;

    transition:
        transform .15s ease,
        background .2s ease;
}

.destination-button.selected{

    background:
        rgba(255,255,255,.18);

    border-color:
        rgba(255,255,255,.25);

    color:#fff;

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.18);
}

.destination-button:active{

    transform:scale(.96);
}


/* =====================================================
   MAIN BUTTON
===================================================== */

.main-button{

    width:100%;

    margin-top:17px;

    padding:17px;

    border:0;

    border-radius:19px;

    background:
        rgba(255,255,255,.94);

    color:#050505;

    font-size:16px;

    font-weight:850;

    transition:
        transform .15s ease,
        opacity .15s ease;
}

.main-button:active{

    transform:scale(.97);

    opacity:.8;
}


/* =====================================================
   STATION SELECT
===================================================== */

#stationSelectScreen{
    display:none;
}

.station-select-card{

    width:100%;

    margin-top:5px;

    padding:21px 14px;

    border-radius:30px;
}

.select-title{

    font-size:28px;

    font-weight:850;

    letter-spacing:-1px;
}

.select-subtitle{

    margin-top:4px;

    color:
        rgba(255,255,255,.40);

    font-size:12px;
}

.select-actions{

    display:flex;

    gap:7px;

    margin-top:15px;
}

.small-button{

    flex:1;

    padding:11px 7px;

    border-radius:15px;

    border:
        1px solid
        rgba(255,255,255,.10);

    background:
        rgba(255,255,255,.07);

    color:#fff;

    font-size:12px;

    font-weight:700;
}

.station-list{

    display:flex;

    flex-direction:column;

    gap:7px;

    margin-top:13px;

    max-height:
        calc(100vh - 270px);

    overflow-y:auto;

    scrollbar-width:none;
}

.station-list::-webkit-scrollbar{
    display:none;
}

.station-item{

    display:flex;

    align-items:center;

    gap:12px;

    padding:12px;

    border-radius:17px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.07);

    transition:
        background .18s ease,
        transform .15s ease;
}

.station-item:active{

    transform:scale(.985);
}

.station-item.selected{

    background:
        rgba(255,255,255,.12);

    border-color:
        rgba(255,255,255,.20);
}

.station-check{

    width:25px;
    height:25px;

    flex:none;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    border:
        1px solid
        rgba(255,255,255,.20);

    color:transparent;

    font-size:14px;

    font-weight:900;
}

.station-item.selected
.station-check{

    background:#fff;

    color:#050608;

    border-color:#fff;
}

.station-item-name{

    font-size:16px;

    font-weight:700;
}


/* =====================================================
   MAIN
===================================================== */

#mainScreen{
    display:none;
}

.header{

    padding:18px;

    border-radius:27px;

    margin-bottom:10px;
}

.train-type{

    color:
        rgba(255,255,255,.42);

    font-size:13px;
}

.destination{

    margin-top:3px;

    font-size:29px;

    font-weight:850;

    letter-spacing:-1px;
}

.route-text{

    margin-top:4px;

    color:
        rgba(255,255,255,.35);

    font-size:11px;
}


/* =====================================================
   SPEED
===================================================== */

.speed-card{

    padding:18px;

    border-radius:27px;

    margin-bottom:10px;
}

.speed-label{

    color:
        rgba(255,255,255,.40);

    font-size:12px;
}

.speed-row{

    display:flex;

    align-items:baseline;
}

.speed{

    font-size:74px;

    line-height:.95;

    font-weight:850;

    letter-spacing:-5px;

    font-variant-numeric:
        tabular-nums;
}

.speed-unit{

    margin-left:7px;

    color:
        rgba(255,255,255,.35);

    font-size:13px;
}


/* =====================================================
   STATION BOARD
===================================================== */

.station-card{

    padding:18px 16px 17px;

    border-radius:28px;
}

.board-label{

    margin-bottom:13px;

    color:
        rgba(255,255,255,.40);

    font-size:12px;
}

.arrow-row{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    margin-bottom:2px;
}

.arrow{

    text-align:left;

    color:
        rgba(255,255,255,.72);

    font-size:18px;

    font-weight:850;
}

.arrow.empty{

    visibility:hidden;
}

.station-board{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);
}

.station-column{

    min-height:125px;

    display:flex;

    justify-content:flex-start;

    align-items:flex-start;
}

.station-name{

    display:flex;

    flex-direction:column;

    align-items:flex-start;

    color:#fff;

    font-size:18px;

    line-height:1.04;

    font-weight:800;

    text-align:left;

    white-space:pre-line;

    transition:
        opacity .25s ease,
        transform .35s ease;
}

.station-name.current{

    transform:scale(1.05);

    transform-origin:left top;

    text-shadow:
        0 0 20px
        rgba(255,255,255,.22);
}

.station-name.empty{

    opacity:0;
}


/* =====================================================
   CURRENT SECTION
===================================================== */

.section-card{

    margin-top:10px;

    padding:17px;

    border-radius:25px;
}

.section-label{

    color:
        rgba(255,255,255,.38);

    font-size:11px;

    margin-bottom:7px;
}

.section-name{

    font-size:20px;

    font-weight:800;

    letter-spacing:-.5px;
}

.section-route{

    display:flex;

    align-items:center;

    gap:9px;

    margin-top:10px;

    font-size:14px;

    font-weight:700;
}

.section-arrow{

    color:
        rgba(255,255,255,.50);
}


/* =====================================================
   APPLE MUSIC STYLE METER
===================================================== */

.section-progress{

    position:relative;

    width:100%;

    height:12px;

    margin-top:12px;

    border-radius:999px;

    background:
        rgba(255,255,255,.10);

    overflow:hidden;

    box-shadow:
        inset 0 1px 2px
        rgba(0,0,0,.25),

        inset 0 1px 0
        rgba(255,255,255,.08);
}


/*
   白いバー部分。

   cubic-bezierで
   Apple Musicっぽく
   ヌルッと伸びる。
*/

.section-progress-fill{

    position:absolute;

    left:0;
    top:0;

    width:0%;

    height:100%;

    border-radius:999px;

    background:
        rgba(255,255,255,.92);

    box-shadow:
        0 0 12px
        rgba(255,255,255,.18);

    transition:
        width 1.2s
        cubic-bezier(.22,.61,.36,1);
}


/*
   メーターの先端に
   少しだけ光を追加
*/

.section-progress-fill::after{

    content:"";

    position:absolute;

    right:0;

    top:0;

    width:24px;

    height:100%;

    border-radius:999px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.45)
        );

    opacity:.55;
}


.distance{

    margin-top:7px;

    text-align:right;

    color:
        rgba(255,255,255,.32);

    font-size:10px;
}


/* =====================================================
   GPS
===================================================== */

.gps-card{

    margin-top:10px;

    padding:14px;

    border-radius:22px;

    text-align:center;
}

.gps-status{

    color:
        rgba(255,255,255,.40);

    font-size:12px;
}

.gps-button{

    width:100%;

    margin-top:8px;

    padding:12px;

    border:0;

    border-radius:16px;

    background:
        rgba(255,255,255,.07);

    color:#fff;

    font-size:13px;

    font-weight:700;
}


/* =====================================================
   3 TAP BUBBLE
===================================================== */

.control-bubble{

    position:fixed;

    left:50%;

    bottom:
        calc(
            18px +
            env(safe-area-inset-bottom)
        );

    z-index:500;

    display:flex;

    gap:7px;

    padding:7px;

    border-radius:22px;

    background:
        rgba(38,38,42,.78);

    border:
        1px solid
        rgba(255,255,255,.16);

    box-shadow:
        0 18px 55px
        rgba(0,0,0,.48),

        inset 0 1px 0
        rgba(255,255,255,.15);

    backdrop-filter:
        blur(30px)
        saturate(170%);

    -webkit-backdrop-filter:
        blur(30px)
        saturate(170%);

    opacity:0;

    pointer-events:none;

    transform:
        translate(-50%,30px)
        scale(.88);

    transition:
        opacity .25s ease,
        transform .42s
        cubic-bezier(.2,.8,.2,1);
}

.control-bubble.show{

    opacity:1;

    pointer-events:auto;

    transform:
        translate(-50%,0)
        scale(1);
}

.control-button{

    border:0;

    padding:12px 15px;

    border-radius:16px;

    background:
        rgba(255,255,255,.09);

    color:white;

    font-size:13px;

    font-weight:750;
}

.control-button:active{

    background:
        rgba(255,255,255,.18);
}


/* =====================================================
   TEST BADGE
===================================================== */

.test-badge{

    position:fixed;

    top:
        calc(
            8px +
            env(safe-area-inset-top)
        );

    right:9px;

    z-index:1000;

    display:none;

    padding:6px 10px;

    border-radius:999px;

    background:
        rgba(255,255,255,.09);

    border:
        1px solid
        rgba(255,255,255,.10);

    color:
        rgba(255,255,255,.48);

    font-size:9px;

    font-weight:750;

    backdrop-filter:
        blur(20px);
}


/* =====================================================
   ANIMATION
===================================================== */

.fade-in{

    animation:
        fadeIn .45s
        cubic-bezier(.2,.8,.2,1);
}

@keyframes fadeIn{

    from{

        opacity:0;

        transform:
            translateY(10px)
            scale(.985);
    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }
}


@media(max-width:430px){

    .speed{
        font-size:69px;
    }

    .station-name{
        font-size:17px;
    }

    .destination{
        font-size:27px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     TEST BADGE
===================================================== -->

<div id="testBadge"
     class="test-badge">

    TEST MODE

</div>


<!-- =====================================================
     START
===================================================== -->

<section id="startScreen"
         class="app">

    <div class="glass start-card">

        <div class="title">
            Train Glass
        </div>

        <div class="subtitle">
            JR九州 Train Display
        </div>


        <div class="label">
            列車種別
        </div>

        <select id="trainType">

            <option value="sonic">
                特急ソニック
            </option>

            <option value="yufuin">
                特急ゆふいんの森
            </option>

            <option value="local">
                普通列車
            </option>

        </select>


        <div class="label">
            行き先
        </div>

        <div id="destinationButtons"
             class="destination-buttons">

            <button
                class="destination-button"
                data-destination="博多"
                onclick="chooseDestination('博多')">

                博多

            </button>

            <button
                class="destination-button"
                data-destination="大分"
                onclick="chooseDestination('大分')">

                大分

            </button>

            <button
                class="destination-button"
                data-destination="佐伯"
                onclick="chooseDestination('佐伯')">

                佐伯

            </button>

        </div>


        <button
            class="main-button"
            onclick="openStationSelection()">

            停車駅を選択

        </button>

    </div>

</section>


<!-- =====================================================
     STATION SELECT
===================================================== -->

<section id="stationSelectScreen"
         class="app">

    <div class="glass station-select-card">

        <div class="select-title">
            停車駅を選択
        </div>

        <div id="selectSubtitle"
             class="select-subtitle">

            停車する駅を選択してください

        </div>


        <div class="select-actions">

            <button
                class="small-button"
                onclick="selectAll()">

                全選択

            </button>

            <button
                class="small-button"
                onclick="clearAll()">

                全解除

            </button>

            <button
                class="small-button"
                onclick="backStart()">

                戻る

            </button>

        </div>


        <div id="stationList"
             class="station-list">
        </div>


        <button
            class="main-button"
            onclick="startTrain()">

            この設定で運転開始

        </button>

    </div>

</section>


<!-- =====================================================
     MAIN
===================================================== -->

<section id="mainScreen"
         class="app">


    <!-- HEADER -->

    <div class="glass header fade-in">

        <div id="mainType"
             class="train-type">

            特急ソニック

        </div>

        <div id="mainDestination"
             class="destination">

            博多行き

        </div>

        <div id="mainRoute"
             class="route-text">
        </div>

    </div>


    <!-- SPEED -->

    <div class="glass speed-card fade-in">

        <div class="speed-label">
            現在速度
        </div>

        <div class="speed-row">

            <span id="speed"
                  class="speed">

                --

            </span>

            <span class="speed-unit">
                km/h
            </span>

        </div>

    </div>


    <!-- STATION BOARD -->

    <div class="glass station-card fade-in">

        <div class="board-label">
            次の4駅
        </div>

        <div id="arrowRow"
             class="arrow-row">
        </div>

        <div id="stationBoard"
             class="station-board">
        </div>

    </div>


    <!-- CURRENT SECTION -->

    <div class="glass section-card fade-in">

        <div class="section-label">
            現在の走行区間
        </div>

        <div id="sectionName"
             class="section-name">

            博多 → 鳥栖

        </div>

        <div class="section-route">

            <span id="sectionFrom">
                博多
            </span>

            <span class="section-arrow">
                →
            </span>

            <span id="sectionTo">
                鳥栖
            </span>

        </div>


        <!-- APPLE MUSIC STYLE METER -->

        <div class="section-progress">

            <div id="sectionProgressFill"
                 class="section-progress-fill">
            </div>

        </div>


        <div id="distance"
             class="distance">

            GPS取得中...

        </div>

    </div>


    <!-- GPS -->

    <div class="glass gps-card">

        <div id="gpsStatus"
             class="gps-status">

            GPS待機中

        </div>

        <button
            class="gps-button"
            onclick="startGPS()">

            GPSを開始

        </button>

    </div>

</section>


<!-- =====================================================
     3 TAP CONTROL
===================================================== -->

<div id="controlBubble"
     class="control-bubble">

    <button
        class="control-button"
        onclick="previousStation()">

        ← 前の駅

    </button>

    <button
        class="control-button"
        onclick="nextStation()">

        次の駅 →

    </button>

</div>

/*

*/

const KYUDAI_ROUTE = [

    "大分",
    "古国府",
    "南大分",
    "賀来",
    "豊後国分",
    "向之原",
    "鬼瀬",
    "小野屋",
    "天神山",
    "庄内",
    "湯平",
    "南由布",
    "由布院",
    "野矢",
    "豊後中村",
    "引治",
    "恵良",
    "豊後森",
    "北山田",
    "豊後中川",
    "天ヶ瀬",
    "杉河内",
    "日田"

];


/*
=========================================================
豊肥本線 普通
大分 → 宮地

各駅停車
=========================================================
*/

const HOHI_ROUTE = [

    "大分",
    "滝尾",
    "敷戸",
    "大分大学前",
    "中判田",
    "竹中",
    "犬飼",
    "菅尾",
    "三重町",
    "豊後清川",
    "緒方",
    "朝地",
    "豊後竹田",
    "玉来",
    "豊後荻",
    "滝水",
    "波野",
    "宮地"

];


/* =====================================================
   STATE
===================================================== */

let trainType =
    "sonic";

let destination =
    null;

let candidateStations =
    [];

let selectedStations =
    [];

let stations =
    [];

let currentIndex =
    0;

let gpsWatch =
    null;

let testMode =
    false;

let tapCount =
    0;

let tapTimer =
    null;

let bubbleTimer =
    null;

let meterAnimation =
    null;


/* =====================================================
   TRAIN TYPE CHANGE
===================================================== */

document
.getElementById("trainType")
.addEventListener(
    "change",
    function(){

        trainType =
            this.value;

        destination =
            null;

        document
        .querySelectorAll(
            ".destination-button"
        )
        .forEach(
            button =>
                button.classList.remove(
                    "selected"
                )
        );

        updateDestinationButtons();

    }
);


/* =====================================================
   DESTINATION BUTTONS
===================================================== */

function updateDestinationButtons(){

    const container =
        document
        .getElementById(
            "destinationButtons"
        );


    /*
      ゆふ森は

      博多
      由布院
      別府
    */

    if(trainType === "yufuin"){

        container.innerHTML = `

            <button
                class="destination-button"
                data-destination="博多"
                onclick="chooseDestination('博多')">

                博多

            </button>

            <button
                class="destination-button"
                data-destination="由布院"
                onclick="chooseDestination('由布院')">

                由布院

            </button>

            <button
                class="destination-button"
                data-destination="別府"
                onclick="chooseDestination('別府')">

                別府

            </button>

        `;

        return;

    }


    /*
      ソニック・普通列車
    */

    container.innerHTML = `

        <button
            class="destination-button"
            data-destination="博多"
            onclick="chooseDestination('博多')">

            博多

        </button>

        <button
            class="destination-button"
            data-destination="大分"
            onclick="chooseDestination('大分')">

            大分

        </button>

        <button
            class="destination-button"
            data-destination="佐伯"
            onclick="chooseDestination('佐伯')">

            佐伯

        </button>

    `;

}


/* =====================================================
   CHOOSE DESTINATION
===================================================== */

function chooseDestination(dest){

    destination =
        dest;


    document
    .querySelectorAll(
        ".destination-button"
    )
    .forEach(
        button => {

            button.classList.toggle(
                "selected",

                button.dataset.destination
                === dest

            );

        }
    );

}


/* =====================================================
   GET ROUTE
===================================================== */

function getRoute(){

    /*
      ソニック
    */

    if(
        trainType === "sonic"
    ){

        let route =
            SONIC_ROUTE.slice();


        /*
          博多行き
        */

        if(
            destination === "博多"
        ){

            return route;

        }


        /*
          大分行き
        */

        if(
            destination === "大分"
        ){

            const end =
                route.indexOf("大分");

            return route.slice(
                0,
                end + 1
            );

        }


        /*
          佐伯行き
        */

        if(
            destination === "佐伯"
        ){

            return route;

        }

    }


    /*
      ゆふ森
    */

    if(
        trainType === "yufuin"
    ){

        const route =
            YUFUIN_ROUTE.slice();


        /*
          博多行き

          別府・由布院側から
          博多へ向かう表示も
          正しい方向にする。
        */

        if(
            destination === "博多"
        ){

            return route;

        }


        /*
          由布院行き
        */

        if(
            destination === "由布院"
        ){

            const end =
                route.indexOf(
                    "由布院"
                );

            return route.slice(
                0,
                end + 1
            );

        }


        /*
          別府行き
        */

        if(
            destination === "別府"
        ){

            return route;

        }

    }


    /*
      普通列車
    */

    if(
        trainType === "local"
    ){

        /*
          佐伯行き
        */

        if(
            destination === "佐伯"
        ){

            return NIPPO_ROUTE.slice();

        }


        /*
          大分行き
        */

        if(
            destination === "大分"
        ){

            const end =
                NIPPO_ROUTE.indexOf(
                    "大分"
                );

            return NIPPO_ROUTE.slice(
                0,
                end + 1
            );

        }


        /*
          博多行き

          久大本線側を使用
        */

        if(
            destination === "博多"
        ){

            return KYUDAI_ROUTE
                .slice()
                .reverse();

        }

    }


    return SONIC_ROUTE.slice();

}


/* =====================================================
   OPEN STATION SELECT
===================================================== */

function openStationSelection(){

    if(!destination){

        alert(
            "行き先を選択してください。"
        );

        return;

    }


    candidateStations =
        getRoute();


    /*
      普通列車は
      各駅停車を最初から全選択
    */

    if(
        trainType === "local"
    ){

        selectedStations =
            candidateStations.slice();

    }
    else{

        selectedStations = [];

    }


    /*
      ゆふ森も
      選択した行き先まで。
    */

    if(
        trainType === "yufuin"
    ){

        const end =
            candidateStations.indexOf(
                destination
            );


        if(end >= 0){

            selectedStations =
                candidateStations.slice(
                    0,
                    end + 1
                );

        }

    }


    renderStationList();


    document
    .getElementById(
        "startScreen"
    )
    .style.display =
        "none";


    document
    .getElementById(
        "stationSelectScreen"
    )
    .style.display =
        "block";


    document
    .getElementById(
        "selectSubtitle"
    )
    .textContent =
        destination +
        "行き・停車駅を選択";

}


/* =====================================================
   STATION LIST
===================================================== */

function renderStationList(){

    const list =
        document
        .getElementById(
            "stationList"
        );


    list.innerHTML = "";


    candidateStations.forEach(
        station => {

            const item =
                document.createElement(
                    "div"
                );


            const selected =
                selectedStations
                .includes(station);


            item.className =
                "station-item" +
                (
                    selected
                    ? " selected"
                    : ""
                );


            item.innerHTML = `

                <div class="station-check">
                    ${selected ? "✓" : ""}
                </div>

                <div class="station-item-name">
                    ${station}
                </div>

            `;


            item.onclick =
                () =>
                    toggleStation(
                        station
                    );


            list.appendChild(item);

        }
    );

}


/* =====================================================
   TOGGLE STATION
===================================================== */

function toggleStation(station){

    const index =
        selectedStations
        .indexOf(station);


    if(index >= 0){

        selectedStations
        .splice(
            index,
            1
        );

    }
    else{

        selectedStations
        .push(station);

    }


    /*
      元の路線順に戻す
    */

    selectedStations =
        candidateStations.filter(
            stationName =>
                selectedStations
                .includes(
                    stationName
                )
        );


    renderStationList();

}


/* =====================================================
   SELECT ALL
===================================================== */

function selectAll(){

    selectedStations =
        candidateStations.slice();

    renderStationList();

}


/* =====================================================
   CLEAR
===================================================== */

function clearAll(){

    selectedStations =
        [];

    renderStationList();

}


/* =====================================================
   BACK
===================================================== */

function backStart(){

    document
    .getElementById(
        "stationSelectScreen"
    )
    .style.display =
        "none";


    document
    .getElementById(
        "startScreen"
    )
    .style.display =
        "flex";

}


/* =====================================================
   START TRAIN
===================================================== */

function startTrain(){

    if(
        selectedStations.length < 2
    ){

        alert(
            "停車駅を2駅以上選択してください。"
        );

        return;

    }


    stations =
        selectedStations.map(
            name => ({
                name:name
            })
        );


    currentIndex =
        0;


    document
    .getElementById(
        "stationSelectScreen"
    )
    .style.display =
        "none";


    document
    .getElementById(
        "mainScreen"
    )
    .style.display =
        "block";


    updateHeader();

    renderBoard();

    updateSection();

    startGPS();

}


/* =====================================================
   HEADER
===================================================== */

function updateHeader(){

    let typeName;


    if(
        trainType === "sonic"
    ){

        typeName =
            "特急ソニック";

    }
    else if(
        trainType === "yufuin"
    ){

        typeName =
            "特急ゆふいんの森";

    }
    else{

        typeName =
            "普通列車";

    }


    document
    .getElementById(
        "mainType"
    )
    .textContent =
        typeName;


    document
    .getElementById(
        "mainDestination"
    )
    .textContent =
        destination +
        "行き";


    document
    .getElementById(
        "mainRoute"
    )
    .textContent =
        stations[0].name +
        " → " +
        stations[
            stations.length - 1
        ].name;

}


/* =====================================================
   VERTICAL TEXT
===================================================== */

function verticalText(name){

    return [...name]
        .join("\n");

}


/* =====================================================
   STATION BOARD
===================================================== */

function renderBoard(){

    const arrows =
        document
        .getElementById(
            "arrowRow"
        );


    const board =
        document
        .getElementById(
            "stationBoard"
        );


    arrows.innerHTML = "";

    board.innerHTML = "";


    const visible = [];


    /*
      現在駅を含めて
      4駅表示
    */

    for(
        let i = 0;
        i < 4;
        i++
    ){

        const index =
            currentIndex + i;


        visible.push(

            index < stations.length
            ? stations[index]
            : null

        );

    }


    /*
      ＞表示
    */

    visible.forEach(
        (station,index) => {

            const arrow =
                document.createElement(
                    "div"
                );


            arrow.className =
                "arrow";


            if(
                station &&
                index < 3 &&
                visible[index + 1]
            ){

                arrow.textContent =
                    "＞";

            }
            else{

                arrow.classList.add(
                    "empty"
                );

            }


            arrows.appendChild(
                arrow
            );

        }
    );


    /*
      駅名
    */

    visible.forEach(
        (station,index) => {

            const column =
                document.createElement(
                    "div"
                );


            column.className =
                "station-column";


            if(station){

                const name =
                    document.createElement(
                        "div"
                    );


                name.className =
                    "station-name";


                if(
                    index === 0
                ){

                    name.classList.add(
                        "current"
                    );

                }


                name.textContent =
                    verticalText(
                        station.name
                    );


                column.appendChild(
                    name
                );

            }


            board.appendChild(
                column
            );

        }
    );

}


/* =====================================================
   SECTION
===================================================== */

function updateSection(){

    const from =
        stations[
            currentIndex
        ];


    const to =
        stations[
            currentIndex + 1
        ];


    if(!from){

        return;

    }


    const sectionName =
        document
        .getElementById(
            "sectionName"
        );


    const fromElement =
        document
        .getElementById(
            "sectionFrom"
        );


    const toElement =
        document
        .getElementById(
            "sectionTo"
        );


    if(to){

        sectionName.textContent =
            from.name +
            " → " +
            to.name;


        fromElement.textContent =
            from.name;


        toElement.textContent =
            to.name;

    }
    else{

        sectionName.textContent =
            "終点到着";


        fromElement.textContent =
            from.name;


        toElement.textContent =
            "到着";

    }


    /*
      メーターを0に戻す。
      CSS transitionで
      Apple Music風に滑らか。
    */

    setMeter(
        0
    );


    document
    .getElementById(
        "distance"
    )
    .textContent =
        testMode
        ? "TEST MODE"
        : "GPS取得中...";

}


/* =====================================================
   SMOOTH METER
===================================================== */

function setMeter(percent){

    const meter =
        document
        .getElementById(
            "sectionProgressFill"
        );


    /*
      いったんrequestAnimationFrameを
      挟むことで、
      0% → 指定値のアニメーションを
      確実に発生させる。
    */

    requestAnimationFrame(
        () => {

            requestAnimationFrame(
                () => {

                    meter.style.width =
                        Math.max(
                            0,
                            Math.min(
                                100,
                                percent
                            )
                        ) + "%";

                }
            );

        }
    );

}


/* =====================================================
   TEST MODE METER
===================================================== */

function animateTestMeter(){

    if(
        meterAnimation
    ){

        cancelAnimationFrame(
            meterAnimation
        );

    }


    const meter =
        document
        .getElementById(
            "sectionProgressFill"
        );


    const start =
        5 +
        Math.random() * 15;


    const end =
        65 +
        Math.random() * 30;


    const duration =
        1800 +
        Math.random() * 1400;


    const startTime =
        performance.now();


    function frame(now){

        const elapsed =
            now - startTime;


        const t =
            Math.min(
                elapsed / duration,
                1
            );


        /*
          easeOutCubic

          最初は速く、
          最後にゆっくり。
        */

        const eased =
            1 -
            Math.pow(
                1 - t,
                3
            );


        const value =
            start +
            (end - start)
            * eased;


        meter.style.width =
            value + "%";


        if(t < 1){

            meterAnimation =
                requestAnimationFrame(
                    frame
                );

        }

    }


    meterAnimation =
        requestAnimationFrame(
            frame
        );

}


/* =====================================================
   NEXT STATION
===================================================== */

function nextStation(){

    if(
        currentIndex >=
        stations.length - 1
    ){

        return;

    }


    currentIndex++;


    renderBoard();

    updateSection();


    /*
      テストモードなら
      次の駅を押した瞬間から
      メーターを滑らかに動かす。
    */

    if(testMode){

        animateTestMeter();


        const randomSpeed =
            Math.floor(
                20 +
                Math.random() * 105
            );


        document
        .getElementById(
            "speed"
        )
        .textContent =
            randomSpeed;


        document
        .getElementById(
            "distance"
        )
        .textContent =
            "TEST MODE";

    }

}


/* =====================================================
   PREVIOUS STATION
===================================================== */

function previousStation(){

    if(
        currentIndex <= 0
    ){

        return;

    }


    currentIndex--;


    renderBoard();

    updateSection();


    if(testMode){

        animateTestMeter();

    }

}


/* =====================================================
   GPS
===================================================== */

function startGPS(){

    if(testMode){

        document
        .getElementById(
            "gpsStatus"
        )
        .textContent =
            "テストモード";

        return;

    }


    if(
        !navigator.geolocation
    ){

        document
        .getElementById(
            "gpsStatus"
        )
        .textContent =
            "GPSを利用できません";

        return;

    }


    if(
        gpsWatch !== null
    ){

        return;

    }


    document
    .getElementById(
        "gpsStatus"
    )
    .textContent =
        "GPS取得中...";


    gpsWatch =
        navigator
        .geolocation
        .watchPosition(

            updateGPS,

            function(){

                document
                .getElementById(
                    "gpsStatus"
                )
                .textContent =
                    "GPS取得エラー";

            },

            {

                enableHighAccuracy:true,

                maximumAge:1000,

                timeout:10000

            }

        );

}


/* =====================================================
   GPS UPDATE
===================================================== */

function updateGPS(position){

    let speed =
        position.coords.speed;


    if(
        speed !== null &&
        !Number.isNaN(speed)
    ){

        speed =
            speed * 3.6;

    }
    else{

        speed = 0;

    }


    document
    .getElementById(
        "speed"
    )
    .textContent =
        Math.round(
            speed
        );


    document
    .getElementById(
        "gpsStatus"
    )
    .textContent =
        "GPS接続中";

}


/* =====================================================
   THREE TAP
===================================================== */

document.addEventListener(

    "touchend",

    function(){

        tapCount++;


        clearTimeout(
            tapTimer
        );


        tapTimer =
            setTimeout(
                function(){

                    tapCount = 0;

                },
                650
            );


        if(
            tapCount === 3
        ){

            tapCount = 0;

            showControls();

        }

    },

    {
        passive:true
    }

);


/* =====================================================
   CONTROL BUBBLE
===================================================== */

function showControls(){

    const bubble =
        document
        .getElementById(
            "controlBubble"
        );


    bubble.classList.add(
        "show"
    );


    clearTimeout(
        bubbleTimer
    );


    bubbleTimer =
        setTimeout(
            function(){

                bubble.classList.remove(
                    "show"
                );

            },
            4500
        );

}


/* =====================================================
   TEST MODE
===================================================== */

function enableTestMode(){

    testMode =
        true;


    document
    .getElementById(
        "testBadge"
    )
    .style.display =
        "block";


    document
    .getElementById(
        "gpsStatus"
    )
    .textContent =
        "テストモード";


    document
    .getElementById(
        "speed"
    )
    .textContent =
        "0";

}


/* =====================================================
   DISABLE TEST
===================================================== */

function disableTestMode(){

    testMode =
        false;


    document
    .getElementById(
        "testBadge"
    )
    .style.display =
        "none";

}


/* =====================================================
   INITIAL
===================================================== */

document.addEventListener(

    "DOMContentLoaded",

    function(){

        updateDestinationButtons();


        document
        .getElementById(
            "startScreen"
        )
        .style.display =
            "flex";

    }

);

</script>
