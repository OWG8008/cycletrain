<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             viewport-fit=cover"
>

<title>JR九州 列車情報</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;

    background:
        radial-gradient(
            circle at 20% 0%,
            rgba(255,255,255,.12),
            transparent 38%
        ),
        radial-gradient(
            circle at 90% 80%,
            rgba(255,255,255,.08),
            transparent 35%
        ),
        #050505;

    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
}


/* =====================================================
   アプリ
===================================================== */

.app {
    width: 100%;
    max-width: 680px;

    min-height: 100vh;

    margin: 0 auto;

    padding:
        calc(18px + env(safe-area-inset-top))
        18px
        calc(24px + env(safe-area-inset-bottom))
        18px;
}


/* =====================================================
   Liquid Glass
===================================================== */

.glass {
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.16),
            rgba(255,255,255,.055)
        );

    border:
        1px solid rgba(255,255,255,.14);

    box-shadow:
        0 18px 50px rgba(0,0,0,.38),
        inset 0 1px 1px rgba(255,255,255,.18);

    backdrop-filter:
        blur(28px)
        saturate(160%);

    -webkit-backdrop-filter:
        blur(28px)
        saturate(160%);
}


/* =====================================================
   選択画面
===================================================== */

#selectScreen {
    min-height: calc(
        100vh -
        env(safe-area-inset-top) -
        env(safe-area-inset-bottom)
    );

    display: flex;
    flex-direction: column;
    justify-content: center;
}

.select-title {
    font-size: 34px;
    font-weight: 750;
    letter-spacing: -1.5px;
}

.select-sub {
    margin-top: 7px;

    color:
        rgba(255,255,255,.5);

    font-size: 14px;
}

.select-group {
    margin-top: 30px;
}

.select-label {
    font-size: 13px;

    color:
        rgba(255,255,255,.45);

    margin-bottom: 10px;
}

.select-buttons {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 10px;
}

.select-button {
    min-height: 65px;

    border: 0;
    border-radius: 20px;

    color: #fff;

    background:
        rgba(255,255,255,.09);

    border:
        1px solid rgba(255,255,255,.10);

    font-size: 16px;
    font-weight: 650;

    box-shadow:
        inset 0 1px 1px
        rgba(255,255,255,.08);
}

.select-button:active {
    transform: scale(.97);

    background:
        rgba(255,255,255,.16);
}


/* =====================================================
   列車画面
===================================================== */

#trainScreen {
    display: none;
}


/* =====================================================
   ヘッダー
===================================================== */

.header-card {
    padding: 18px 19px 20px;

    border-radius: 27px;

    position: relative;

    overflow: hidden;
}

.header-card::after {
    content: "";

    position: absolute;

    left: -20%;
    top: -80%;

    width: 140%;
    height: 100%;

    background:
        linear-gradient(
            110deg,
            transparent 35%,
            rgba(255,255,255,.13),
            transparent 65%
        );

    transform: rotate(-4deg);

    pointer-events: none;
}

.train-name {
    position: relative;
    z-index: 1;

    font-size: 17px;

    color:
        rgba(255,255,255,.58);

    font-weight: 600;
}

.destination {
    position: relative;
    z-index: 1;

    margin-top: 2px;

    font-size: 32px;

    font-weight: 760;

    letter-spacing: -1.4px;
}

.train-number {
    position: relative;
    z-index: 1;

    margin-top: 4px;

    font-size: 15px;

    color:
        rgba(255,255,255,.45);
}


/* =====================================================
   速度
===================================================== */

.speed-card {
    margin-top: 12px;

    padding: 20px;

    border-radius: 27px;
}

.speed-label {
    font-size: 13px;

    color:
        rgba(255,255,255,.42);
}

.speed-row {
    display: flex;

    align-items: baseline;

    margin-top: 2px;
}

.speed {
    font-size: 70px;

    line-height: .95;

    font-weight: 760;

    letter-spacing: -5px;

    font-variant-numeric:
        tabular-nums;
}

.speed-unit {
    margin-left: 8px;

    font-size: 17px;

    color:
        rgba(255,255,255,.45);
}


/* =====================================================
   4駅表示
===================================================== */

.station-card {
    margin-top: 12px;

    padding: 19px;

    border-radius: 27px;
}

.station-title {
    font-size: 13px;

    color:
        rgba(255,255,255,.42);

    margin-bottom: 14px;
}

.station-route {
    display: flex;

    flex-direction: column;

    align-items: flex-start;

    gap: 0;
}

.station-line {
    display: flex;

    align-items: center;

    min-height: 43px;

    width: 100%;
}

.station-name {
    width: 95px;

    font-size: 21px;

    font-weight: 700;

    letter-spacing: -.6px;

    text-align: left;

    white-space: nowrap;
}

.station-arrow {
    width: 34px;

    font-size: 25px;

    font-weight: 700;

    color:
        rgba(255,255,255,.48);

    text-align: center;
}

.station-line:last-child
.station-arrow {
    opacity: 0;
}


/* =====================================================
   進行バー
===================================================== */

.progress-area {
    margin-top: 14px;
}

.progress-background {
    width: 100%;

    height: 8px;

    border-radius: 999px;

    background:
        rgba(255,255,255,.10);

    overflow: hidden;
}

.progress-fill {
    width: 0%;

    height: 100%;

    border-radius: 999px;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.55),
            rgba(255,255,255,.95)
        );

    transition:
        width .7s linear;
}

.distance-text {
    margin-top: 10px;

    text-align: left;

    font-size: 14px;

    color:
        rgba(255,255,255,.56);

    font-variant-numeric:
        tabular-nums;
}


/* =====================================================
   GPS
===================================================== */

.gps-card {
    margin-top: 12px;

    padding: 16px;

    border-radius: 24px;

    text-align: left;
}

.gps-status {
    font-size: 13px;

    color:
        rgba(255,255,255,.42);

    line-height: 1.5;
}

.gps-button {
    width: 100%;

    margin-top: 12px;

    padding: 14px;

    border: 0;

    border-radius: 17px;

    background:
        rgba(255,255,255,.92);

    color: #000;

    font-size: 15px;

    font-weight: 700;
}

.gps-button:active {
    transform: scale(.98);
}


/* =====================================================
   テストモード
===================================================== */

.test-panel {
    display: none;

    margin-top: 12px;

    padding: 18px;

    border-radius: 25px;
}

.test-title {
    font-size: 14px;

    color:
        rgba(255,255,255,.5);

    margin-bottom: 10px;
}

.test-buttons {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 8px;
}

.test-button {
    border: 0;

    border-radius: 14px;

    padding: 12px;

    background:
        rgba(255,255,255,.09);

    color: #fff;

    font-weight: 600;
}


/* =====================================================
   到着
===================================================== */

.arrived {
    margin-top: 8px;

    font-size: 28px;

    font-weight: 760;
}


/* =====================================================
   戻る
===================================================== */

.back-button {
    margin-top: 12px;

    width: 100%;

    padding: 13px;

    border: 0;

    border-radius: 16px;

    background:
        rgba(255,255,255,.07);

    color:
        rgba(255,255,255,.65);

    font-size: 14px;
}


/* =====================================================
   小画面
===================================================== */

@media (max-width: 380px) {

    .app {
        padding-left: 14px;
        padding-right: 14px;
    }

    .destination {
        font-size: 28px;
    }

    .speed {
        font-size: 60px;
    }

    .station-name {
        width: 82px;
        font-size: 19px;
    }

    .station-arrow {
        width: 30px;
    }
}

</style>
</head>


<body>

<div class="app">

        </div>

        <div

        <button

    <!-- テストモード -->

    >

        <div class="test-title">

        </div>

        <div

        ></div>

    </div>


    <button
        class="back-button"
        onclick="backToSelect()"
    >
        列車選択に戻る

</section>

</div>

            "豊後森",
            "天ケ瀬",
            "日田",
            "久留米",
            "鳥栖",
            "博多"

        ]

    },


    5: {

        from: "博多",

        to: "由布院",

        route: [

            "博多",
            "鳥栖",
            "久留米",
            "日田",
            "天ケ瀬",
            "豊後森",
            "由布院"

        ]

    },


    6: {

        from: "由布院",

        to: "博多",

        route: [

            "由布院",
            "豊後森",
            "天ケ瀬",
            "日田",
            "久留米",
            "鳥栖",
            "博多"

        ]

    }

};


/* =====================================================
   状態
===================================================== */

let currentRoute = [];

let currentTrainName = "";

let currentNumber = "";

let currentIndex = 0;

let watchId = null;

let lastSpeed = 0;

let arrived = false;


/* =====================================================
   ボタン生成
===================================================== */

function createButtons() {

    const sonicBox =
        document.getElementById(
            "sonicButtons"
        );

    const yufuBox =
        document.getElementById(
            "yufuButtons"
        );


    sonicBox.innerHTML = "";

    yufuBox.innerHTML = "";


    /*
       ソニック1〜41号
    */

    for (
        let n = 1;
        n <= 41;
        n++
    ) {

        const button =
            document.createElement(
                "button"
            );

        button.className =
            "select-button";

        button.textContent =
            n + "号";

        button.onclick =
            () => selectSonic(n);

        sonicBox.appendChild(
            button
        );

    }


    /*
       ゆふ森
    */

    [
        1,
        2,
        3,
        4,
        5,
        6
    ].forEach(
        n => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "select-button";

            button.textContent =
                n + "号";

            button.onclick =
                () => selectYufuin(n);

            yufuBox.appendChild(
                button
            );

        }
    );

}


/* =====================================================
   ソニック選択
===================================================== */

function selectSonic(number) {

    const data =
        sonic[number];

    if (!data) return;


    selectRoute(
        data.route,
        "特急ソニック",
        number,
        data.to
    );

}


/* =====================================================
   ゆふ森選択
===================================================== */

function selectYufuin(number) {

    const data =
        yufuin[number];

    if (!data) return;


    selectRoute(
        data.route,
        "特急ゆふいんの森",
        number,
        data.to
    );

}


/* =====================================================
   普通列車選択
===================================================== */

function selectTrain(type) {

    if (
        type === "localDown"
    ) {

        selectRoute(
            localDown,
            "普通列車",
            "",
            "佐伯"
        );

    }

    else if (
        type === "localUp"
    ) {

        selectRoute(
            localUp,
            "普通列車",
            "",
            "中津"
        );

    }

    else if (
        type === "kyudai"
    ) {

        selectRoute(
            kyudai,
            "普通列車",
            "",
            "日田"
        );

    }

    else if (
        type === "kyudaiReverse"
    ) {

        selectRoute(
            kyudaiReverse,
            "普通列車",
            "",
            "大分"
        );

    }

    else if (
        type === "hohi"
    ) {

        selectRoute(
            hohi,
            "普通列車",
            "",
            "宮地"
        );

    }

    else if (
        type === "hohiReverse"
    ) {

        selectRoute(
            hohiReverse,
            "普通列車",
            "",
            "大分"
        );

    }

}


/* =====================================================
   路線設定
===================================================== */

function selectRoute(
    route,
    trainName,
    number,
    destination
) {

    currentRoute =
        route;

    currentTrainName =
        trainName;

    currentNumber =
        number;

    currentIndex = 0;

    arrived = false;

    lastSpeed = 0;


    document.getElementById(
        "selectScreen"
    ).style.display =
        "none";


    document.getElementById(
        "trainScreen"
    ).style.display =
        "block";


    document.getElementById(
        "trainName"
    ).textContent =
        trainName;


    document.getElementById(
        "destination"
    ).textContent =
        destination +
        "行き";


    document.getElementById(
        "trainNumber"
    ).textContent =
        number
            ? number + "号"
            : "";


    updateDisplay();

    startGPS();

}


/* =====================================================
   4駅表示
===================================================== */

function updateDisplay() {

    if (
        !currentRoute.length
    ) return;


    const box =
        document.getElementById(
            "stationRoute"
        );


    box.innerHTML = "";


    const visible =
        currentRoute.slice(
            currentIndex + 1,
            currentIndex + 5
        );


    if (
        visible.length === 0
    ) {

        showArrival();

        return;

    }


    visible.forEach(
        (
            station,
            index
        ) => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "station-line";


            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "station-name";

            name.textContent =
                station;


            const arrow =
                document.createElement(
                    "div"
                );

            arrow.className =
                "station-arrow";


            /*
               最後の駅の後には
               ＞を出さない
            */

            if (
                index <
                visible.length - 1
            ) {

                arrow.textContent =
                    "＞";

            }


            row.appendChild(
                name
            );

            row.appendChild(
                arrow
            );

            box.appendChild(
                row
            );

        }
    );

}


/* =====================================================
   GPS開始
===================================================== */

function startGPS() {

    if (
        !navigator.geolocation
    ) {

        setGPSStatus(
            "この端末ではGPSを利用できません"
        );

        return;

    }


    if (
        watchId !== null
    ) {

        return;

    }


    setGPSStatus(
        "GPS取得中..."
    );


    watchId =
        navigator.geolocation.watchPosition(

            updateGPS,

            gpsError,

            {

                enableHighAccuracy:
                    true,

                maximumAge:
                    500,

                timeout:
                    10000

            }

        );

}


/* =====================================================
   GPS更新
===================================================== */

function updateGPS(
    position
) {

    if (
        arrived
    ) return;


    const lat =
        position.coords.latitude;

    const lon =
        position.coords.longitude;


    let speed =
        position.coords.speed;


    if (
        speed !== null &&
        speed !== undefined &&
        !isNaN(speed)
    ) {

        speed =
            Math.max(
                0,
                speed * 3.6
            );

    }
    else {

        speed = 0;

    }


    /*
       速度を少し滑らかにする
    */

    speed =
        lastSpeed * .35 +
        speed * .65;


    lastSpeed =
        speed;


    document.getElementById(
        "speed"
    ).textContent =
        Math.round(speed);


    const nextIndex =
        currentIndex + 1;


    if (
        nextIndex >=
        currentRoute.length
    ) {

        showArrival();

        return;

    }


    const nextStation =
        currentRoute[
            nextIndex
        ];


    const nextData =
        stationDB[
            nextStation
        ];


    if (!nextData) {

        setGPSStatus(
            "駅データを確認中..."
        );

        return;

    }


    const remaining =
        getDistance(
            lat,
            lon,
            nextData.lat,
            nextData.lon
        );


    const currentStation =
        currentRoute[
            currentIndex
        ];


    const currentData =
        stationDB[
            currentStation
        ];


    let totalDistance =
        1000;


    if (
        currentData
    ) {

        totalDistance =
            getDistance(
                currentData.lat,
                currentData.lon,
                nextData.lat,
                nextData.lon
            );

    }


    let progress =
        1 -
        remaining /
        totalDistance;


    progress =
        Math.max(
            0,
            Math.min(
                1,
                progress
            )
        );


    document.getElementById(
        "progressFill"
    ).style.width =
        (
            progress * 100
        ) + "%";


    /*
       距離
    */

    if (
        remaining < 100
    ) {

        document.getElementById(
            "distanceText"
        ).textContent =
            nextStation +
            " まもなく";

    }

    else {

        document.getElementById(
            "distanceText"
        ).textContent =
            nextStation +
            "まであと " +
            (
                remaining / 1000
            ).toFixed(1) +
            " km";

    }


    /*
       駅切り替え

       180m以内
       ＋
       速度15km/h以下

       この両方を満たした時だけ
       次駅へ進む。
    */

    const nearStation =
        remaining <= 180;

    const stopped =
        speed <= 15;


    if (
        nearStation &&
        stopped
    ) {

        currentIndex++;

        document.getElementById(
            "progressFill"
        ).style.width =
            "0%";

        updateDisplay();

        return;

    }


    setGPSStatus(
        "GPS接続中"
    );

}


/* =====================================================
   到着
===================================================== */

function showArrival() {

    arrived = true;


    document.getElementById(
        "speed"
    ).textContent =
        "0";


    const finalStation =
        currentRoute[
            currentRoute.length - 1
        ];


    const box =
        document.getElementById(
            "stationRoute"
        );


    box.innerHTML = "";


    const row =
        document.createElement(
            "div"
        );

    row.className =
        "station-line";


    const name =
        document.createElement(
            "div"
        );

    name.className =
        "station-name";

    name.textContent =
        finalStation;


    row.appendChild(
        name
    );


    box.appendChild(
        row
    );


    document.getElementById(
        "progressFill"
    ).style.width =
        "100%";


    document.getElementById(
        "distanceText"
    ).innerHTML =
        '<span class="arrived">' +
        finalStation +
        ' 到着</span>';


    setGPSStatus(
        finalStation +
        "に到着しました"
    );

}


/* =====================================================
   距離計算
===================================================== */

function getDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R =
        6371000;

    const rad =
        Math.PI / 180;


    const dLat =
        (lat2 - lat1) * rad;

    const dLon =
        (lon2 - lon1) * rad;


    const a =
        Math.sin(
            dLat / 2
        ) ** 2 +

        Math.cos(
            lat1 * rad
        ) *

        Math.cos(
            lat2 * rad
        ) *

        Math.sin(
            dLon / 2
        ) ** 2;


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );


    return R * c;

}


/* =====================================================
   GPSエラー
===================================================== */

function gpsError(
    error
) {

    let message =
        "GPSを取得できません";


    switch (
        error.code
    ) {

        case 1:

            message =
                "位置情報の使用を許可してください";

            break;

        case 2:

            message =
                "現在地を取得できません";

            break;

        case 3:

            message =
                "GPS取得がタイムアウトしました";

            break;

    }


    setGPSStatus(
        message
    );

}


/* =====================================================
   GPS表示
===================================================== */

function setGPSStatus(
    text
) {

    const el =
        document.getElementById(
            "gpsStatus"
        );

    if (el) {

        el.textContent =
            text;

    }

}


/* =====================================================
   戻る
===================================================== */

function backToSelect() {

    if (
        watchId !== null
    ) {

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId = null;

    }


    arrived = false;

    currentIndex = 0;

    lastSpeed = 0;


    document.getElementById(
        "trainScreen"
    ).style.display =
        "none";


    document.getElementById(
        "selectScreen"
    ).style.display =
        "flex";


    document.getElementById(
        "speed"
    ).textContent =
        "--";

}


/* =====================================================
   3連続タッチ
   テストモード
===================================================== */

let tapCount = 0;

let tapTimer = null;


document.addEventListener(
    "touchend",
    function () {

        tapCount++;


        clearTimeout(
            tapTimer
        );


        tapTimer =
            setTimeout(
                () => {

                    tapCount = 0;

                },
                700
            );


        if (
            tapCount >= 3
        ) {

            tapCount = 0;

            toggleTestMode();

        }

    }
);


/* =====================================================
   テストモード切替
===================================================== */

function toggleTestMode() {

    const panel =
        document.getElementById(
            "testPanel"
        );


    if (
        panel.style.display ===
        "block"
    ) {

        panel.style.display =
            "none";

        return;

    }


    panel.style.display =
        "block";


    createTestButtons();

}


/* =====================================================
   テストボタン
===================================================== */

function createTestButtons() {

    const box =
        document.getElementById(
            "testButtons"
        );


    box.innerHTML = "";


    currentRoute.forEach(
        (
            station,
            index
        ) => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "test-button";


            button.textContent =
                station;


            button.onclick =
                () => {

                    currentIndex =
                        index;

                    arrived =
                        false;

                    updateDisplay();

                };


            box.appendChild(
                button
            );

        }
    );

}


/* =====================================================
   起動
===================================================== */

createButtons();

</script>
